name: Attendance heartbeat

# A CLOCK THAT ACTUALLY KEEPS TIME.
#
# GitHub's `schedule` is best-effort and throttled. Measured against this repo, a request
# for sixty runs between 05:00 and 09:59 EAT delivered ONE, at about 10:00, every day for
# a week — so the crew badged in at 05:45 and the board had no times until ten. The
# external cron that used to poke workflow_dispatch every five minutes died on 1 Sep when
# its token expired, silently, and nobody noticed for a fortnight.
#
# This is the clock, kept inside GitHub so there is no third-party service to expire.
# One run stays alive for five hours, dispatching the scrape every five minutes while the
# office cares, then hands the chain on to a fresh run before it reaches the six-hour job
# limit. The chain is what keeps time; `schedule` below is only a re-seed for the case
# where the chain is ever broken, and being hours late is fine for that job.
#
# The repo is public, so Actions minutes are free and unmetered.

on:
  schedule:
    - cron: '23 * * * *'      # hourly re-seed. Late is fine — it only has to restart a dead chain.
  workflow_dispatch: {}

# Exactly one heartbeat alive at a time. A re-seed replaces the running chain rather than
# doubling it — two chains would dispatch two scrapes every five minutes for ever.
concurrency:
  group: attendance-heartbeat
  cancel-in-progress: true

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 320        # 5h20 — comfortably under GitHub's 6h ceiling
    steps:
      - name: Keep time, and hand the chain on
        env:
          GH_TOKEN: ${{ secrets.CRON_PAT }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows"
          fire () {
            curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/$1/dispatches" -d '{"ref":"main"}'
          }
          # THE HAND-ON IS THE ONE CALL THAT MUST NOT FAIL. Everything else this job does
          # is retried five minutes later by the next iteration; the hand-on has no next
          # iteration. One dropped connection at midnight and there is no chain at 05:00,
          # which is the morning the crew arrive to a blank board. So it gets four goes.
          fire_hard () {
            for attempt in 1 2 3 4; do
              CODE=$(fire "$1")
              echo "  hand-on attempt ${attempt}: ${CODE}"
              [ "$CODE" = "204" ] && return 0
              sleep 15
            done
            echo "  HAND-ON FAILED — the hourly re-seed is now the only thing keeping this alive"
            return 1
          }
          # Five hours of keeping time, then hand on. Leaving before the timeout matters:
          # a job killed at the ceiling never reaches the hand-on and the chain dies.
          END=$(( $(date +%s) + 300*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            H=$(TZ=Africa/Mogadishu date +%H)
            H=$((10#$H))                       # 08 and 09 are not octal, thank you
            M=$(TZ=Africa/Mogadishu date +%M)
            M=$((10#$M))
            T=$((H*60+M))                      # minutes since midnight, EAT
            # 05:00-09:59 arrivals (300-599), 16:00-17:00 departures (960-1020).
            # NOTHING AFTER FIVE. The crew go home at 17:00 and the day is finished, so a
            # later run has nothing new to read — it re-reads the same punches and, since
            # a re-scrape APPENDS an "out" row rather than replacing the one before it,
            # every extra run can only add a departure that did not happen. The window used
            # to run to 19:59 and that is what filled the log with them.
            # Friday (5) the offices are shut.
            D=$(TZ=Africa/Mogadishu date +%u)  # 1=Mon .. 5=Fri .. 7=Sun
            if [ "$D" -ne 5 ] && { { [ "$T" -ge 300 ] && [ "$T" -le 599 ]; } || { [ "$T" -ge 960 ] && [ "$T" -le 1020 ]; }; }; then
              echo "$(TZ=Africa/Mogadishu date +%H:%M) EAT — in window, dispatching scrape: $(fire scrape.yml)"
              sleep 300
            else
              # Four minutes, not fifteen: the wait costs nothing (it is a sleep inside a
              # job that is already running, not another run) and a fifteen-minute loop
              # could enter the morning window a quarter of an hour late.
              echo "$(TZ=Africa/Mogadishu date +%H:%M) EAT — outside the window, idling"
              sleep 240
            fi
          done
          echo "handing the chain on"
          fire_hard heartbeat.yml
