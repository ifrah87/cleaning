name: Attendance scrape

# Runs the Hik-Connect Time Card scraper in the cloud, independent of any laptop.
# Cron is UTC. EAT = UTC+3. We poll every 5 min from 06:00 to 19:55 EAT
# (03:00-16:55 UTC) so early morning badge-ins are captured quickly.
# NOTE: GitHub schedules are best-effort — ticks can be delayed or skipped under load.
on:
  schedule:
    - cron: '*/5 3-16 * * *'
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

concurrency:
  group: attendance-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      - name: Install Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        env:
          HIK_EMAIL: ${{ secrets.HIK_EMAIL }}
          HIK_PASSWORD: ${{ secrets.HIK_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scrape.js

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-shots
          path: scraper/*.png
          if-no-files-found: ignore
          retention-days: 3
