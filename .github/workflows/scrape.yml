name: Attendance scrape

# Runs the Hik-Connect Time Card scraper in the cloud, independent of any laptop.
# Cron is UTC. EAT = UTC+3. The crew badges in around 06:40 EAT (03:40 UTC).
#
# GitHub's scheduler is best-effort and has been running HOURS late, not minutes:
#   26 Jul  window opened 03:00 UTC, first run 07:07 UTC  (4h07 late)
#   27 Jul  window opened 03:00 UTC, first run 06:16 UTC  (3h16 late)
#   28 Jul  window opened 03:00 UTC, first run 05:36 UTC  (2h36 late)
#
# The first run of the day seems to arrive a few hours after the window opens, so
# the window now opens at 00:00 UTC (03:00 EAT) rather than 03:00 UTC. That pulls
# the first delayed run earlier, closer to when the crew actually arrives.
#
# This is a mitigation, not a fix — the real answer is our own cron on a small box,
# see scraper/deploy/. Nothing here can make GitHub run on time.
# Earliest anyone has ever badged in, across 27 days of records:
#   06:03 Hassan · 06:22 Sadaaq · 06:23 Mahamed Nur · 06:31 Abdirisaq · 06:34 Dauud
# So the morning window opens at 05:00 EAT (02:00 UTC), an hour of headroom.
#
# This schedule is only a backup — GitHub runs it hours late or not at all. The
# reliable trigger is an external cron calling workflow_dispatch every 5 minutes
# from 05:00 to 09:59 EAT; see scraper/deploy/external-cron.md.
on:
  schedule:
    - cron: '*/5 2-6 * * *'
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

concurrency:
  group: attendance-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      - name: Install Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        env:
          HIK_EMAIL: ${{ secrets.HIK_EMAIL }}
          HIK_PASSWORD: ${{ secrets.HIK_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scrape.js

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-shots
          path: scraper/*.png
          if-no-files-found: ignore
          retention-days: 3
