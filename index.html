  // call — a separate job, done by their own pair after the offices — and that stays
  // true of the HAND-OUT. It was never a good reason to keep the work off the wall: it
  // lived on a page of its own that the board rotated to, so a flat somebody had just
  // cleaned was invisible for most of every minute, and "what has been done today"
  // could not be read off the screen in one look. They sit in their cleaner's column
  // now, in a colour of their own so nobody mistakes one for a morning room.
  // Any kind the office has switched off the roll call in Settings still shows — the
  // work exists whether or not it is dealt out. Empty while everything is switched on.
  //
  // ...ONCE SOMEBODY HAS BEEN GIVEN ONE, AND NOT BEFORE. Every flat went on, held or
  // not, so the twelve unhanded ones landed in NOBODY YET as a block of fourteen and
  // the morning read as thirty-six jobs when the round is twenty-four. The office looked
  // at the wall and saw the app proposing a dozen flats for a morning that is not
  // theirs: the flats are done after the offices, by whoever is free, on whoever checked
  // out — and the office picks them. Nothing unhanded belongs on the morning board.
  //
  // A flat WITH a name on it does still show, in its cleaner's column and its own
  // colour, because that is the half of this that was right: the wall is where "what has
  // been done today" is read, and a flat cleaned at two o'clock has to be visible on it.
  // Handing one out is what puts it there — see neverAutoDealt: no automatic pass ever
  // will. Unhanded flats are picked up on the roll call's own Airbnb strip, which reads
  // the rooms directly and is not affected by any of this. (This is not 26 Aug's mistake
  // repeated: that took the flats off every screen at once, ticking included.)
  tvOffRollCall().forEach((u) => {
    const air = unitType(u) === 'airbnb';
    const holder = heldBy(u.assignedTo);
    if (!holder) return;                              // nobody has been given it — not the morning's
    const who = staffById[holder];
    bucket(holder).push({                             // handed flats go to their cleaner
      id: u.id, label: u.unit + (air && who ? ' · ' + who.name.split(' ')[0] : ''),
      done: cleanedToday(u), kind: unitType(u),
      early: timeSlot(u) === 'early', area: false, air,
    });
  });
  // A SHARED AREA IS ON BOTH BOARDS. It was on one — whoever answered for it — with the
  // other names printed beside it, which keeps the counting tidy and gets the job wrong:
  // a column is read as "what am I doing this morning", and a cleaner who is on the
  // corridors and cannot see the corridors in their own list has not been told.
  //
  // So it appears for everybody on it, each seeing the others named beside it. It is
  // still ONE job: ticked once, done for all of them, and counted once in the totals
  // (see countJobs) — a job on two boards is not two jobs.
  areasInterior().forEach((a) => {
    // Whoever the rota has in, of the people named on it. If the one who answers for it
    // is at home and somebody else on the walk is in, the walk is theirs for the day
    // rather than a helper's job with nobody above them.
    const on = [a.assignedTo].concat(areaHelpers(a).map((p) => p.id))
      .filter(Boolean).filter((id) => heldBy(id));
    const owner = on.indexOf(a.assignedTo) >= 0 ? a.assignedTo : (on[0] || null);
    const who = on.length ? on : [null];
    who.forEach((pid) => {
      const others = on.filter((x) => x !== pid)
        .map((x) => staffById[x])
        .filter(Boolean).map((p) => p.name.split(' ')[0]);
      bucket(pid).push({
        id: a.id,
        label: a.label + (others.length ? ' + ' + others.join(', ') : ''),
        done: areaDone(a), early: false, area: true, kind: 'area',
        // Being named ON somebody else's walk is not a round of your own. Without this,
        // an assistant put on the corridors with their leader stopped counting as spare
        // and was given a column — which is the exact thing naming them beside the
        // leader exists to avoid.
        helper: pid !== owner,
      });
    });
  });
  // Red first, then whatever is still open, then the finished ones out of the way.
  Object.keys(buckets).forEach((k) => {
    buckets[k].sort((x, y) =>
      (x.done ? 1 : 0) - (y.done ? 1 : 0)
      || (y.early ? 1 : 0) - (x.early ? 1 : 0)
      // The morning's own rooms first, then the guest flats that follow them, which is
      // the order the work is actually done in.
      || (x.late ? 1 : 0) - (y.late ? 1 : 0)
      || (x.air ? 1 : 0) - (y.air ? 1 : 0)
      || String(x.label).localeCompare(String(y.label), undefined, { numeric: true }));
  });
  return { buckets: buckets, order: order };
}

// Columns: everyone rostered on today gets one even when they are empty-handed,
// because an empty column is the useful bit of news. Unassigned work goes in an
// amber column at the front — it is the only thing on the board nobody owns.
// An assistant who has not turned up is not with anybody, and printing their name on
// a wall the whole office reads would be a promise the day cannot keep.
const tvHere = (x) => AWAY.indexOf(state.attendance[x.id] || 'present') < 0;

// ON ONE OF OUR TEAMS. Somebody carried as "Outside team" is not part of the round
// this board is about, and their column was the emptiest thing on a screen otherwise
// full of work. Matched on the word rather than a specific team name, so renaming the
// team or adding a second outside crew does not quietly put them back on the wall.
const tvOnTeam = (p) => {
  const c = String((p && p.crew) || '').trim();
  return !!c && !/outside/i.test(c);
};
// ...EXCEPT THAT THE OFFICE WANTS TO SEE THEM. The outside team are in the building
// every day, they take work by hand, and a board that will not admit they exist is a
// board somebody has to hold half of in their head. They get columns like everyone
// else; nothing is dealt to them automatically, so an empty one says exactly what it
// should — here, and free.
const tvOutside = (p) => /outside/i.test(String((p && p.crew) || ''));

// WHAT TIME SOMEBODY CAME IN. The badge data is already loaded for the roll call;
// the board simply never showed it. Blank when there is no scan — Hik's Time Card
// fills in through the morning (see the attendance-lag note), so "no time yet" and
// "did not come in" are different things and the board must not conflate them.
function tvArrival(p) {
  const a = p && hikArrivals && hikArrivals[p.id];
  // Already formatted by arrivalsForDay(); running it through fmtEventTime again
  // happened to be harmless but was one refactor away from not being.
  return (a && a.time) ? String(a.time) : '';
}

// GONE HOME. The last badge scan of the day, which arrivalsForDay already works out.
// Worth being honest about what this is: the reader records a scan, not a direction,
// so somebody who steps out to the shop and back has a last scan that is really a
// re-entry. It is the best the door can tell us, and on a crew that badges out at the
// end of a shift it is right nearly always — but it is "last seen", not a promise.
function tvLeft(p) {
  const a = p && hikArrivals && hikArrivals[p.id];
  return (a && a.out) ? String(a.out) : '';
}

// The shared withLabel() prints bare first names, which on this screen would undo the
// thing tvName() exists to do: "with Mahad" above one column while another column is
// headed Mahad A. is the same ambiguity in smaller type. Same sentence, TV names.
// ONE PERSON, ONE PLACE ON THE BOARD. An assistant who holds no rooms of their own
// belongs under their leader — that is the whole point of naming them there — and an
// assistant who does hold rooms has a column already. Listing them in both spots put
// the same person on the wall twice, once as a name and once as an empty column, and
// an empty column on a board full of work reads as somebody with nothing to do.
// This is the rule the hand-out sheet has always used; the TV simply never had it.
function tvWithLabel(p, spare) {
  const a = assistantsFor(p, (x) => tvHere(x) && spare(x));
  // A NAME HERE IS A PROMISE THAT SOMEBODY IS ON THE FLOOR. tvHere() only asks the
  // attendance status, and finalizeState defaults every person on the roster to
  // 'present' - so an assistant the door has never seen today was being printed
  // alongside their leader as though they had turned up. On 23 Aug that was Abukar
  // Daud Osman, last scanned the previous afternoon, named on the wall all day.
  //
  // Flagged rather than dropped: Hik fills in through the morning, so a missing scan
  // early is usually late data rather than a missing person, and quietly deleting the
  // name would replace one wrong answer with another. The leader is still shown as
  // having them - with the one thing the board actually knows attached.
  if (!a.length) return '';
  // Returns MARKUP, not text - the caller inserts it unescaped - so every name has to
  // be escaped right here. The amber is doing real work: the sentence reads as
  // reassurance ("Mahad has Abukar with him") and the one word that contradicts it
  // must not be the same colour as the rest.
  // WITH THEIR TIME. An assistant's name is the only place they appear on this board, so
  // it is also the only place their badge-in can be shown — and it was not shown, so
  // "what time did Abukar get in?" could not be answered from the wall at all.
  return 'with ' + a.map((x) => esc(tvName(x))
    + (tvArrival(x)
        ? ` <span class="tv-atsm">${esc(tvArrival(x))}${tvLeft(x) ? ' → ' + esc(tvLeft(x)) : ''}</span>`
        : ' <span class="tv-noscan">(no scan)</span>')).join(', ');
}

// Named under somebody else, so not given a column of their own.
function tvNamedElsewhere(p, spare) {
  if (!p || !p.isCleaner || p.isLeader || !p.crew || !spare(p) || !tvHere(p)) return false;
  return teamMembers(p.crew).some((x) => x.id !== p.id && x.isLeader && tvHere(x));
}

// HOW MUCH WORK IS THERE, when a shared area sits in two columns? One job's worth.
// Counting the columns up would say two, and every total on every screen would drift
// apart from the list under it the moment the office put a second name on the corridors.
function countJobs(cols) {
  const seen = new Set(), doneIds = new Set();
  cols.forEach((c) => c.jobs.forEach((j) => {
    const k = (j.area ? 'a:' : 'u:') + j.id;
    seen.add(k);
    if (j.done) doneIds.add(k);
  }));
  return { all: seen.size, done: doneIds.size };
}

// THE DAYS AHEAD, ON THE WALL. The board answers "what is today?" and the office also
// stands in front of it asking "what is tomorrow?" — and had to go to a phone for it.
// Up and Down on the remote step a day; the columns are then read from that day's PLAN
// instead of the live board, which is the honest thing to show: a future day has been
// laid out, not worked, so nothing on it is ticked.
let tvDayOffset = 0;              // 0 = today's live board
let tvDayTouched = 0;             // when somebody last pressed a key
function tvColumnsForDay(day) {
  const plan = (state.plans || {})[day] || {};
  const byId = {}; (state.staff || []).forEach((p) => { byId[p.id] = p; });
  const uById = {}; (state.servicedUnits || []).forEach((u) => { uById[u.id] = u; });
  const buckets = {}, order = [];
  Object.values(plan).forEach((j) => {
    // Same rule as the live board: a name the rota has off that day is not holding it.
    const k = (j.assignedTo && onDutyForDay(byId[j.assignedTo], day)) ? j.assignedTo : '__none__';
    if (!buckets[k]) { buckets[k] = []; order.push(k); }
    const u = j.kind === 'unit' ? uById[j.refId] : null;
    buckets[k].push({
      id: j.refId, label: j.label, done: false,
      air: !!(u && unitType(u) === 'airbnb'),
      area: j.kind !== 'unit', kind: j.kind === 'unit' ? unitType(u) : 'area',
      late: !!(u && timeSlot(u) === 'late'), early: !!(u && timeSlot(u) === 'early'),
    });
  });
  return order.sort((a, b) => (a === '__none__' ? -1 : 0) - (b === '__none__' ? -1 : 0)
      || buckets[b].length - buckets[a].length)
    .map((k) => {
      const p = byId[k];
      return { key: k, name: p ? tvName(p) : 'NOBODY YET', jobs: buckets[k],
        none: !p, out: false, status: null, with: '',
        team: p ? tvTeam(p) : '', at: '', left: '', note: '' };
    });
}
function tvColumns() {
  const grouped = tvJobsByPerson();
  // "Spare" = holding nothing of their own today. Computed once from the same buckets
  // the columns are built from, so the two can never disagree about who has work.
  const spare = (x) => !(grouped.buckets[x.id] || []).some((j) => !j.helper);
  const cols = [];
  const unassigned = grouped.buckets['__none__'] || [];
  if (unassigned.length) {
    cols.push({ key: '__none__', name: 'NOBODY YET', jobs: unassigned, none: true, out: false, status: null });
  }
  // A CREW WITH NO LEADER IS A PAIR, AND A PAIR IS ONE COLUMN.
  // Where a team has a leader, the board names the others beside them — "with Nur Ali
  // Sidow" — because the work is the leader's round and they are on it. The outside team
  // has no leader: two people who go round together, and neither of them is the one it
  // belongs to. So they share a column with both names on it, Mohamed Salaal / Nur Ali
  // Sidow, and whatever either of them is holding is in it.
  const crewOf = (p) => String((p && p.crew) || '').trim();
  const pairMates = (p) => {
    const c = crewOf(p);
    if (!c) return null;
    const mates = cleaningStaff().filter((x) => crewOf(x) === c && worksToday(x) && tvHere(x));
    if (mates.length < 2 || mates.some((x) => x.isLeader)) return null;
    return mates.sort((a, b) => String(tvArrival(b) ? 0 : 1).localeCompare(String(tvArrival(a) ? 0 : 1))
      || String(a.name).localeCompare(String(b.name)));
  };

  const seen = {};
  cleaningStaff().filter((p) => worksToday(p) && (tvOnTeam(p) || tvOutside(p)) && !tvNamedElsewhere(p, spare)).forEach((p) => {
    const pair = pairMates(p);
    if (pair && pair[0].id !== p.id) { seen[p.id] = true; return; }   // their mate carries the column
    seen[p.id] = true;
    const st = state.attendance[p.id] || 'present';
    if (pair) {
      pair.forEach((x) => { seen[x.id] = true; });
      cols.push({
        key: p.id,                                   // work dropped on the pair lands on them
        name: pair.map((x) => tvName(x)).join(' / '),
        jobs: pair.reduce((all, x) => all.concat(grouped.buckets[x.id] || []), []),
        none: false, out: AWAY.indexOf(st) >= 0, status: st, with: '',
        team: tvTeam(p), at: tvArrival(p), left: tvLeft(p), note: p.note || '',
      });
      return;
    }
    cols.push({
      key: p.id, name: tvName(p), jobs: grouped.buckets[p.id] || [],
      none: false, out: AWAY.indexOf(st) >= 0, status: st, with: tvWithLabel(p, spare),
      team: tvTeam(p), at: tvArrival(p), left: tvLeft(p), note: p.note || '',
    });
  });
  // Somebody off the rota still holding work has to show, or that work vanishes — and
  // that now includes the outside team. They are kept off the board when they are
  // holding nothing, because an empty column on a wall full of work reads as somebody
  // with nothing to do. Give one of them the bins and the job has to be visible.
  (state.staff || []).forEach((p) => {
    // "Still holding work" means work of their own, not a name on somebody else's walk —
    // otherwise being put on the corridors buys a column by the back door.
    if (seen[p.id] || spare(p)) return;
    const st = state.attendance[p.id] || 'present';
    cols.push({
      key: p.id, name: tvName(p), jobs: grouped.buckets[p.id],
      none: false, out: AWAY.indexOf(st) >= 0, status: st, with: tvWithLabel(p, spare),
      team: tvTeam(p), at: tvArrival(p), left: tvLeft(p), note: p.note || '',
    });
  });
  // Stranded work first, then TEAMS TOGETHER. The first rule is unchanged: work with
  // nobody behind it leads, because it is the only thing on the board that is nobody's
  // job to notice. What follows it used to be arbitrary, which scattered Team B across
  // two corners of the screen and made the team labels decorative — you could read who
  // somebody worked with but never see the team as a thing. Sorting by team after rank
  // puts mates side by side, so a team reads as a block and a gap in one is obvious.
  //
  // This was safe to change only once the board stopped paging: when half the crew was
  // hidden for fifteen seconds at a time, ordering had to fight to get the urgent onto
  // the visible page. Everybody is on one screen now, so ordering can group instead.
  return cols.sort((a, b) => {
    // An empty column is not work, it is the absence of it, and it was landing second
    // on the board purely because "Outside team" sorts before "Team A". Somebody in
    // with nothing on them is worth showing — it is how you notice a spare pair of
    // hands — but at the end, not in the place the eye lands first.
    // ...AND A TEAMMATE WITH NOTHING STAYS WITH THEIR TEAM. An empty column sorts last,
    // because on a wall full of work it reads as somebody with nothing to do — but that
    // separated a pair who work together: Salaal with the bins near the front, Nur empty
    // and stranded on the bottom row, when the whole point is that they are one team
    // standing next to each other. Empty AND nobody on your crew is working: last.
    // Empty while your crew has work: beside them.
    const crewWorking = {};
    cols.forEach((c) => { if (c.team && c.jobs.length) crewWorking[c.team] = true; });
    const rank = (c) => c.none ? 0
      : (c.out && c.jobs.some((j) => !j.done)) ? 1
      : (c.jobs.length || (c.team && crewWorking[c.team])) ? 2 : 3;
    // Teamless people sort last rather than under an empty heading, so "Outside team"
    // sits at the end where it reads as the exception it is.
    const teamKey = (c) => (c.team ? '0' + c.team.toLowerCase() : '1');
    return rank(a) - rank(b)
      || teamKey(a).localeCompare(teamKey(b))
      || String(a.name).localeCompare(String(b.name), undefined, { sensitivity: 'base' });
  });
}

function tvCrewStrip() {
  // The strip no longer clips, so it earns its space by shrinking instead: a big crew
  // gets smaller chips rather than a shorter list. Every name and every time is on the
  // wall, which is the whole job of this strip.
  // EVERY PAIR OF HANDS, NOT JUST THE ROUNDS. This strip was leaders-only on the
  // grounds that an assistant is already named on their leader's column — true, and it
  // meant the wall could not answer the plainest question asked in front of it: what
  // time did everybody get in. Salaal badged in at 07:39 and appeared on no screen at
  // all; the outside pair badged in and the board would not admit they existed.
  //
  // So: anybody rostered on today, and anybody the door saw, whichever team they are
  // carried under and whether or not they run a round.
  const onStrip = (p) => (worksToday(p) || !!tvArrival(p))
    && (tvOnTeam(p) || tvOutside(p) || !!tvArrival(p));
  const onToday = cleaningStaff().filter(onStrip).length + (hikOther || []).length;
  const wrap = el(`<div class="tv-crew${onToday > 10 ? ' lots' : onToday > 6 ? ' many' : ''}"></div>`);
  // THE ROLL CALL IS THE LEADERS. An assistant is there to assist the leader they are
  // tagged under, and they are already named on that leader's column — putting them on
  // the roll call as well made the strip a list of everybody, which is the one thing it
  // was not meant to be. Whoever a leader has with them is read off their column.
  const crew = cleaningStaff().filter(onStrip);
  if (!crew.length && !(hikOther || []).length) {
    wrap.appendChild(el(`<div class="tv-empty">Nobody is rostered on today</div>`)); return wrap;
  }

  // WHO IS STILL IN THE BUILDING. Counted before the chips, because "how many are
  // still here" is a question people were answering by counting green outlines.
  const here = crew.filter((p) => !tvLeft(p) && AWAY.indexOf(state.attendance[p.id] || 'present') < 0);
  const gone = crew.filter((p) => tvLeft(p));
  const head = el(`<div class="tv-crewhead"></div>`);
  head.appendChild(el(`<span class="on">${here.length} STILL HERE</span>`));
  if (gone.length) head.appendChild(el(`<span class="off">${gone.length} LEFT</span>`));
  // Counted at the top for the same reason NEED COVER is: it is the thing you want to
  // know without reading every chip, and the answer to "who is missing?" at 7am.
  // Assistants count here even though they get no chip of their own. The roll call is
  // deliberately leaders-only, but "who has not punched in?" is a question about every
  // pair of hands expected today, and an assistant is exactly the person whose absence
  // is otherwise invisible - their name simply rides along on a leader's column.
  const noScanCrew = cleaningStaff().filter((p) => worksToday(p) && (tvOnTeam(p) || tvOutside(p))
    && !tvArrival(p) && !tvLeft(p)
    && AWAY.indexOf(state.attendance[p.id] || 'present') < 0);
  if (noScanCrew.length) head.appendChild(el(`<span class="noscan">${noScanCrew.length} NO SCAN</span>`));
  wrap.appendChild(head);

  // Away first — who is missing is what you want without hunting. Then the people
  // still in, then the ones who have gone home: the board reads down the day.
  // CHRONOLOGICAL. This used to group away / in / gone and then sort each group by
  // name, which put a 05:53 arrival after an 07:25 one because of the alphabet. The
  // strip is a record of the morning arriving, so it reads in the order the morning
  // actually happened.
  //
  // The two cases with no time keep their place at the front: somebody marked away,
  // and somebody the door has not seen. Neither has a clock reading to sort by, and
  // both are the thing you want to notice before you start reading times.
  crew.slice().sort((a, b) => {
    const rank = (p) => AWAY.indexOf(state.attendance[p.id] || 'present') >= 0 ? 0
      : !tvArrival(p) ? 1 : 2;
    const r = rank(a) - rank(b);
    if (r) return r;
    return String(tvArrival(a)).localeCompare(String(tvArrival(b)))
      || String(a.name).localeCompare(String(b.name));
  }).forEach((p) => {
    const st = state.attendance[p.id] || 'present';
    const meta = STATUS[st] || STATUS.present;
    // The time is the more useful fact when somebody is in — it answers "was the
    // 6am round covered?" — so it takes the slot the word PRESENT was using.
    const at = tvArrival(p), left = tvLeft(p);
    // Gone home reads as gone: dimmed, and told in the words the roll call uses.
    // Somebody who has gone home is told in one time, not two. Carrying both made
    // every chip wide enough that twelve of them took four rows and pushed the board
    // itself off the bottom of the screen — the roll call is the smaller question and
    // must not crowd out the work. What time they arrived is on their column.
    // PRESENT IS A CLAIM NOBODY MADE. Attendance defaults to 'present' for everyone on
    // the roster - finalizeState does it so a new person is not born absent - so the
    // word was being printed against people the door has never seen today. It reads as
    // a confirmation and it is the opposite: it is the absence of one. Say so.
    //
    // "NO SCAN YET", not "NOT IN": Hik's Time Card fills in through the morning, so an
    // early blank is far more often data that has not arrived than a person who has
    // not. The board should report what it knows - no scan - and let the office decide
    // what that means at 6am versus at 11am.
    const noScan = (st === 'present' && !left && !at);
    const tail = (st !== 'present') ? meta.label
      : (at && left) ? (at + ' → ' + left)      // came in AND went home: say both
      : left ? ('LEFT ' + left)
      : at ? ('IN ' + at) : 'NO SCAN YET';
    const chip = el(`<div class="tv-chip${(st === 'present' && left) ? ' gone' : ''}${noScan ? ' noscan' : ''}"><span>${esc(tvName(p))}</span><span class="st">${esc(tail)}</span></div>`);
    if (noScan) chip.style.borderColor = '#fbbf24';
    if (!noScan) chip.style.borderColor = meta.color;
    // Present takes the board's own text colour rather than a hardcoded near-white:
    // on the light ground that was white-on-white and the whole roll call vanished.
    chip.style.color = noScan ? '#fbbf24' : (st === 'present') ? '' : meta.color;
    wrap.appendChild(chip);
  });
  // AND THE ONES THE DOOR SAW WHO ARE NOT TAGGED AS CLEANERS. They are in the building
  // and their badge-in is as real as anybody's; the tag decides who gets ROOMS, not who
  // the wall is allowed to admit exists. Slate, because nothing is expected of them
  // here — the same slate an off column wears.
  (hikOther || []).slice().sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')))
    .forEach((o) => {
      const chip = el(`<div class="tv-chip"><span>${esc(o.name)}</span>`
        + `<span class="st">IN ${esc(o.time || '')}</span></div>`);
      chip.style.borderColor = 'var(--tv-off-fg)';
      chip.style.color = 'var(--tv-off-fg)';
      wrap.appendChild(chip);
    });
  return wrap;
}

// WHO ELSE IS IN THE BUILDING. The board is built round the office round, and
// tvOnTeam() drops anybody carried as "Outside team" - correctly, because they are
// not doing this work and an empty column for them would be the emptiest thing on a
// screen full of jobs. The cost was that nine people could be in the building on a
// Sunday and the board would not admit one of them existed.
//
// So they get a line rather than a column: name, time, nothing else. No rooms are
// dealt to them and the round is untouched; it answers "who else is about if I need
// a hand?" - which on a morning where somebody is off is the first question asked.
//
// OPT IN, NOT OPT OUT. The first cut of this hid named individuals, which makes the
// board a list somebody has to maintain for ever - every new starter appears on the
// wall until a person notices and hides them. The app already has the right idea in
// isCleaner: the office says who is crew, once, on their card, and everyone else -
// drivers, office staff, a contractor passing the reader - is simply not in the set.
// A one-minute scan on the way past is then not a rule to write, it is somebody who
// was never a cleaner.
function tvAlsoIn() {
  return cleaningStaff()
    .filter((p) => p && !tvOnTeam(p) && !tvOutside(p) && tvArrival(p))
    .sort((a, b) => String(tvArrival(a)).localeCompare(String(tvArrival(b))));
}

function tvAlsoStrip() {
  const who = tvAlsoIn();
  if (!who.length) return null;
  const wrap = el(`<div class="tv-also"></div>`);
  wrap.appendChild(el(`<span class="lab">ALSO IN</span>`));
  who.forEach((p) => {
    const at = tvArrival(p), left = tvLeft(p);
    const row = el(`<span class="who${left ? ' gone' : ''}"></span>`);
    row.appendChild(el(`<span>${esc(tvName(p))}</span>`));
    // Off the round does not always mean off the building's floor plan - somebody can
    // hold a floor and still not be on this morning's office round. Where they do,
    // say which, because "who is on six?" is the question this line gets asked.
    const fl = tvFloorLabel(p);
    if (fl) row.appendChild(el(`<span class="at">${esc(fl)}</span>`));
    // BOTH TIMES HERE, unlike the roll call above. The crew chips deliberately carry
    // one time and not two - twelve of them at double width took four rows and pushed
    // the board off the bottom of the screen. This line is text rather than chips and
    // there are only ever a handful of names on it, so the full shift fits: these are
    // the people nobody is tracking through the morning, and "was he here at eight?"
    // is the whole reason the line exists.
    row.appendChild(el(`<span class="at">${esc(at)}${left ? ' \u2192 ' + esc(left) : ''}</span>`));
    wrap.appendChild(row);
  });
  return wrap;
}

// THE SEPARATE JOB, ON ITS OWN PAGE. Airbnb is cleaned by its own pair after the
// offices and is deliberately kept off the morning roll call — so it has no business
// sitting among the columns, where it would read as somebody's round. It is still
// work owed today though, and a board that never mentions it is exactly how it gets
// forgotten. So it alternates with the main board instead: same screen, own page.
function tvOffRollCall() {
  try {
    // DUE, not merely PLANNED. The obvious source here was plannedOffRollCall(), which
    // is what the roll call screen uses — but it reads today's plan, and on a building
    // where the twelve Airbnb rooms are daily and nobody plans them one by one, that
    // list is empty while all twelve are sitting there owed. The board would have shown
    // a blank page under a confident heading, which is worse than no page.
    //
    // So: everything off the roll call that today's list wants, plus anything actually
    // planned, deduped. Cleaned rooms stay on with a line through them — a list that
    // shrinks as work gets done cannot be read as progress.
    const seen = {}, out = [];
    const take = (u) => {
      if (!u || u.paused || seen[u.id] || onRollCall(u)) return;
      seen[u.id] = 1; out.push(u);
    };
    (state.servicedUnits || []).forEach((u) => { if (onTodaysList(u)) take(u); });
    plannedOffRollCall().forEach(take);
    return out.sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  } catch (e) { return []; }
}

// Named after whatever is actually on it rather than hardcoded to "Airbnb" — the
// off-roll-call list is a rule about roll call, not a room type, and the day the
// office switches something else off this page should say so without being edited.
function tvAirTitle(air) {
  const kinds = [];
  air.forEach((u) => {
    const l = ((UNIT_TYPES[unitType(u)] || {}).label || 'Rooms');
    if (kinds.indexOf(l) < 0) kinds.push(l);
  });
  return (kinds.join(' + ') + ' — a separate job').toUpperCase();
}

function tvAirGrid(air) {
  const grid = el(`<div class="tv-air"></div>`);
  air.forEach((u) => {
    const isDone = cleanedToday(u);
    const card = el(`<div class="tv-aircard${isDone ? ' done' : ''}"></div>`);
    card.appendChild(el(`<div class="tv-airunit">${esc(u.unit)}</div>`));
    // The guest is who the room is being turned around for, and the checkout is the
    // deadline. Both are the reason this job cannot simply wait until tomorrow.
    if (u.guest) card.appendChild(el(`<div class="tv-airguest">${esc(u.guest)}</div>`));
    if (u.time) card.appendChild(el(`<div class="tv-airtime">OUT ${esc(u.time)}</div>`));
    if (isDone) card.appendChild(el(`<div class="tv-airdone">DONE</div>`));
    grid.appendChild(card);
  });
  return grid;
}

// THE MONTH ON THE WALL. The board answers "what is happening now"; this answers the
// other question the office asks in front of it — what is coming, which days are heavy,
// where the thin ones are. It was a tab on a phone, and the phone is not what anybody is
// standing in front of at seven in the morning.
//
// The month shown is the one holding the day the remote is on, so up and down keep the
// single meaning they already have — WHICH DAY — and walking far enough forward turns
// the page to next month by itself. Nothing here is tappable; a wall is read, not used.
function tvCalendarPage(day) {
  const box = el(`<div class="tv-cols" style="display:flex;flex-direction:column;min-height:0"></div>`);
  const d = new Date(day + 'T00:00:00');
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const today = workToday();
  const dowRow = el(`<div class="tv-cal-dow"></div>`);
  ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((x) => dowRow.appendChild(el(`<div>${x}</div>`)));
  box.appendChild(dowRow);
  const grid = el(`<div class="tv-cal"></div>`);
  for (let i = 0; i < first.getDay(); i += 1) grid.appendChild(el(`<div class="tv-cal-cell blank"></div>`));
  const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  // The heaviest day in view sets the bar, so the shape of the month reads at a glance
  // rather than every day looking the same size. Same rule as the calendar tab.
  let peak = 1;
  const infos = {};
  for (let n = 1; n <= daysInMonth; n += 1) {
    const k = ymd(new Date(first.getFullYear(), first.getMonth(), n));
    infos[k] = calDayInfo(k);
    peak = Math.max(peak, infos[k].rooms);
  }
  for (let n = 1; n <= daysInMonth; n += 1) {
    const k = ymd(new Date(first.getFullYear(), first.getMonth(), n));
    const info = infos[k];
    const cls = (k < today ? ' past' : '') + (k === today ? ' today' : '') + (k === day && k !== today ? ' shown' : '');
    const cell = el(`<div class="tv-cal-cell${cls}"></div>`);
    cell.appendChild(el(`<div class="tv-cal-n" style="color:${k === today ? 'var(--tv-accent)' : 'var(--tv-fg)'}">${n}</div>`));
    if (info.rooms) {
      const bar = el(`<div class="tv-cal-bar"></div>`);
      bar.appendChild(el(`<div style="width:${Math.round((info.rooms / peak) * 100)}%;`
        + `background:${info.planned ? 'var(--tv-accent)' : 'var(--tv-job-ln)'}"></div>`));
      cell.appendChild(bar);
      cell.appendChild(el(`<div class="tv-cal-sub" style="color:${info.loose ? 'var(--tv-none-fg)' : 'var(--tv-muted)'}">`
        + `${info.rooms}${info.loose ? ' · ' + info.loose + ' free' : ''}</div>`));
    } else {
      cell.appendChild(el(`<div class="tv-cal-sub" style="color:var(--tv-empty)">—</div>`));
    }
    grid.appendChild(cell);
  }
  box.appendChild(grid);
  box.appendChild(el(`<div class="tv-cal-key">Blue is laid out and handed round · grey is what the schedule says is due`
    + ` · amber is work nobody has yet</div>`));
  return box;
}

function renderTV() {
  const app = document.getElementById('app');
  document.body.classList.add('tv');
  // ?tv=1&light=1 — the same board on the app's own paper-white ground, so the two
  // can be looked at on the actual wall rather than argued about in the abstract.
  document.body.classList.toggle('tvlight', /[?&]light\b/.test(location.search));
  app.innerHTML = '';
  const now = new Date();
  const wrap = el(`<div class="tv-wrap"></div>`);

  // Today comes from the live board; a day ahead comes from its plan. Same columns,
  // same cards — the difference is that nothing on a future day is ticked, because
  // nobody has worked it yet.
  if (tvDayOffset && tvDayTouched && Date.now() - tvDayTouched > 2 * 60 * 1000) tvDayOffset = 0;
  const cols = tvDayOffset ? tvColumnsForDay(shiftDay(workToday(), tvDayOffset)) : tvColumns();
  // The guest flats are in the columns now, so the page that used to carry them would
  // simply show the same rooms a second time. Kept as an empty list rather than torn
  // out, so the board falls back to it the day somebody wants it again.
  const air = [];
  const boardPages = Math.max(1, Math.ceil(cols.length / TV_COLS_PER_PAGE));
  // The month is always the last page, so its position does not move about as the crew
  // grows and the board gains or loses a page under it.
  const tvPages = boardPages + (air.length ? 1 : 0) + 1;
  if (tvPage >= tvPages) tvPage = 0;
  const onCal = tvPage === tvPages - 1;
  const onAir = !onCal && air.length > 0 && tvPage === tvPages - 2;

  // Every number at the top counts the page you are actually looking at, or the
  // Airbnb page would sit under the offices' progress and read as its own.
  const counted = countJobs(cols);
  const jobs = onAir ? air.length : counted.all;
  const done = onAir ? air.filter((u) => cleanedToday(u)).length : counted.done;
  const pct = jobs ? Math.round((done / jobs) * 100) : 0;

  // --- top line ---
  const top = el(`<div class="tv-top"></div>`);
  const left = el(`<div></div>`);
  left.appendChild(el(`<div class="tv-brand">${onCal ? 'THE MONTH AHEAD'
    : onAir ? esc(tvAirTitle(air)) : 'CLEANING BOARD'}</div>`));
  // THE DAY THE BOARD IS ABOUT, NOT THE DAY THE CLOCK IS ON.
  // The work day rolls at 3am — a round that runs past midnight belongs to the morning
  // it started — and the jobs below have always followed that. The date line did not:
  // it printed the calendar date, so from midnight to 3am the wall read "Tuesday" over
  // Monday's round, with everything on it ticked. The board contradicted itself for
  // three hours every night, and the office quite reasonably read it as the wrong jobs.
  // A WALL LEFT ON TOMORROW IS A WALL SHOWING THE WRONG DAY. Somebody looks ahead,
  // walks off, and the crew reads next Tuesday's round as this morning's. It comes home
  // by itself two minutes after the last key.
  if (tvDayOffset && tvDayTouched && Date.now() - tvDayTouched > 2 * 60 * 1000) tvDayOffset = 0;
  const shownDay = tvDayOffset ? shiftDay(workToday(), tvDayOffset) : workToday();
  const boardDay = new Date(shownDay + 'T00:00:00');
  const stillLastNight = workToday() !== todayKey();
  left.appendChild(el(`<div class="tv-date">`
    + `${esc(boardDay.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }))}`
    + (stillLastNight ? ` <span style="opacity:0.75">· tonight's round, until 3am</span>` : '')
    + (tvDayOffset ? ` <span style="color:#fbbf24">· PLANNED, not today`
        + `${tvDayOffset === 1 ? ' (tomorrow)' : ' (' + tvDayOffset + ' days ahead)'}</span>` : '')
    + `</div>`));
  top.appendChild(left);

  // THREE NUMBERS, EACH SAYING WHAT IT IS. This used to read "1 of 28 done", which
  // is a sentence broken across two type sizes and was reliably misread — people
  // asked whether 28 was the total, the target, or the rooms left. Each number now
  // carries its own label underneath it and means only one thing.
  const mid = el(`<div class="tv-progress"></div>`);
  const tile = (n, label, color) => {
    const t = el(`<div class="tv-tile"></div>`);
    const num = el(`<div class="n">${n}</div>`);
    if (color) num.style.color = color;
    const cap = el(`<div class="cap">${esc(label)}</div>`);
    if (color) cap.style.color = color;
    t.appendChild(num); t.appendChild(cap);
    return t;
  };
  mid.appendChild(tile(done, 'DONE', '#22c55e'));
  mid.appendChild(tile(jobs, onAir ? (jobs === 1 ? 'ROOM TODAY' : 'ROOMS TODAY')
                                   : (jobs === 1 ? 'JOB TODAY' : 'JOBS TODAY'), null));
  // Work with nobody behind it gets its own number at the top. The columns turn
  // over on a timer, so the one thing that must never be on the page you missed
  // is how much of today is currently falling on the floor.
  // WORK THAT HAS FALLEN THROUGH — which the guest flats have not. They sit in the
  // unassigned column by design, not because a round lost them, and counting twelve of
  // them as needing cover would make the one number on this board that means "somebody
  // has to act" say so every single morning.
  const cover = cols.filter((c) => c.out || c.none)
    .reduce((n, c) => n + c.jobs.filter((j) => !j.done && !j.air).length, 0);
  if (cover && !onAir) mid.appendChild(tile(cover, 'NEED COVER', '#f59e0b'));
  top.appendChild(mid);

  const right = el(`<div></div>`);
  right.appendChild(el(`<div class="tv-clock">${esc(now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }))}</div>`));
  // A board nobody can tell is stale is worse than no board. Say when it last
  // heard anything, and go amber once that stops being reassuring.
  // Dated off the last time the board actually TOOK new numbers, not the last time a
  // request came back without throwing. Those are different questions, and answering
  // the second one in the words of the first is how a frozen wall said "up to date"
  // for a whole morning.
  const mins = tvLastData ? Math.round((Date.now() - tvLastData) / 60000) : null;
  const stampTxt = (mins === null) ? 'waiting for data'
    : mins < 2 ? 'up to date' : mins + ' min since last update';
  right.appendChild(el(`<div class="tv-stamp${mins !== null && mins >= 10 ? ' tv-stale' : ''}">${esc(stampTxt)}</div>`));
  top.appendChild(right);
  wrap.appendChild(top);

  const bar = el(`<div class="tv-bar"><i></i></div>`);
  bar.firstChild.style.width = pct + '%';
  wrap.appendChild(bar);

  // The roll call is the morning's crew. Airbnb is not on it, so on that page the
  // strip would be naming people who are not doing this work.
  if (!onAir) {
    wrap.appendChild(tvCrewStrip());
    const also = tvAlsoStrip();
    if (also) wrap.appendChild(also);
  }

  // --- columns, a page at a time ---
  // Spread the columns evenly over the pages rather than filling each to the
  // brim: six people is 3+3, not 5 then a lonely 1, and the column width stops
  // jumping about every time the board turns over.
  const perPage = Math.max(1, Math.ceil(cols.length / boardPages));
  const shown = (onAir || onCal) ? [] : cols.slice(tvPage * perPage, tvPage * perPage + perPage);

  const grid = el(`<div class="tv-cols"></div>`);
  const g = tvGrid(shown.length);
  grid.style.gridTemplateColumns = 'repeat(' + g.across + ', minmax(0, 1fr))';
  grid.style.setProperty('--tvs', String(g.scale));
  if (!cols.length) {
    grid.appendChild(el(`<div class="tv-empty">Nothing on today's board yet</div>`));
  }
  shown.forEach((c) => {
    const col = el(`<div class="tv-col${c.none ? ' none' : ''}${c.out ? ' out' : ''}`
      + `${c.status === 'off' ? ' off' : ''}"></div>`);
    const hd = el(`<div class="tv-col-hd"></div>`);
    const row = el(`<div class="tv-hd-row"></div>`);
    row.appendChild(el(`<div class="tv-who">${esc(c.name)}</div>`));
    row.appendChild(el(`<div class="tv-count">${c.jobs.filter((j) => j.done).length}/${c.jobs.length}</div>`));
    hd.appendChild(row);
    // The name alone doesn't say the work is stranded. Spell it out on its own
    // line, where a long name can't push it off the edge.
    const open = c.jobs.filter((j) => !j.done).length;
    if (c.out) {
      const meta = STATUS[c.status] || STATUS.noshow;
      const sub = el(`<div class="tv-sub">${esc(meta.label)}${open ? ' · ' + open + ' NEED COVER' : ' · NOTHING OPEN'}</div>`);
      sub.style.color = open ? '#fbbf24' : meta.color;
      hd.appendChild(sub);
    } else if (c.none) {
      hd.appendChild(el(`<div class="tv-sub" style="color:#fbbf24">NOT HANDED OUT</div>`));
    }
    // A leader's column is the team's column: the rooms underneath are worked by
    // whoever is with them, and naming only the leader left the floor to be guessed
    // at from across the office. Muted, because it answers a question about the
    // heading rather than being another thing to read.
    if (c.with) hd.appendChild(el(`<div class="tv-with">${c.with}</div>`));   // pre-escaped in tvWithLabel
    // Amber, and above the team line: it is the exception to everything else the
    // column says, so it should be read before the routine facts and not after them.
    if (c.note) hd.appendChild(el(`<div class="tv-note">${esc(c.note)}</div>`));
    // Team on the left, the time they badged in on the right: the two questions
    // asked of a name on this board that the name alone cannot answer.
    if (c.team || c.at) {
      const meta = el(`<div class="tv-meta"></div>`);
      meta.appendChild(el(`<div class="tv-team">${c.team ? esc(c.team) : ''}</div>`));
      // BOTH TIMES, NOT THE LAST ONE. Clocking out replaced the arrival with a
      // departure, so the moment somebody went home the board could no longer say when
      // they had started — which is the number the office is looking for when it reads
      // a column at eleven o'clock.
      if (c.at || c.left) meta.appendChild(el(`<div class="tv-at${c.left ? ' gone' : ''}">`
        + (c.at ? 'IN ' + esc(c.at) : '')
        + (c.at && c.left ? ' · ' : '')
        + (c.left ? 'OUT ' + esc(c.left) : '') + `</div>`));
      hd.appendChild(meta);
    }
    col.appendChild(hd);
    // ROOMS AND COMMUNAL AREAS, SAID SEPARATELY. These used to run together in one
    // list on the argument that a corridor is another thing somebody has to get
    // through and splitting them hides half the load. True of the load, wrong for the
    // question actually asked of this board — "are the offices done?" — which one
    // mixed list cannot answer without counting. Two headed groups, and the count in
    // the corner still totals both, so nothing about the load is hidden.
    const chip = (j) => {
      // An away person's unfinished room is nobody's room until someone picks it
      // up, so it wears the same amber as work that was never handed out.
      // Done first, then the deadline, then what kind of work it is. A guest flat keeps
      // its own colour even in the amber column — the heading there already says nobody
      // is on it, and what the job IS should not change with who is holding it.
      const cls = j.done ? 'done' : j.early ? 'early' : j.air ? 'air'
        : (c.out || c.none) ? 'cover' : j.area ? 'area' : '';
      return el(`<div class="tv-job ${cls}">${j.early && !j.done ? '🌅 ' : ''}${esc(j.label)}</div>`);
    };
    const rooms = c.jobs.filter((j) => !j.area);
    const areas = c.jobs.filter((j) => j.area);
    if (!c.jobs.length) {
      const list = el(`<div class="tv-jobs"></div>`);
      list.appendChild(el(`<div class="tv-empty">—</div>`));
      col.appendChild(list);
    }
    // Only headed when there is something to tell apart: one group on its own needs
    // no label, and a heading over a single list is noise on a wall.
    const group = (items, label) => {
      if (!items.length) return;
      if (rooms.length && areas.length) col.appendChild(el(`<div class="tv-group">${esc(label)}</div>`));
      const list = el(`<div class="tv-jobs"></div>`);
      items.forEach((j) => list.appendChild(chip(j)));
      col.appendChild(list);
    };
    group(rooms, 'OFFICES');
    group(areas, 'COMMUNAL');
    grid.appendChild(col);
  });
  wrap.appendChild(onCal ? tvCalendarPage(shownDay) : onAir ? tvAirGrid(air) : grid);

  // THE REMOTE, SPELLED OUT. Left and right walk the pages, up and down walk the days —
  // true since the pages went in, and said out loud only at the bottom of the month.
  // On the board itself nothing hinted that either axis existed, so the wall read as a
  // fixed picture and nobody reached for the remote at all. Named on every page, with
  // whichever one you are on lit, so somebody standing in front of it can see there is
  // more than what is showing.
  {
    const nav = el(`<div class="tv-nav"></div>`);

    const days = el(`<div class="tv-navgrp"></div>`);
    days.appendChild(el(`<div class="tv-navk">▲▼</div>`));
    days.appendChild(el(`<div class="tv-navl${tvDayOffset === 0 ? ' on' : ''}">TODAY</div>`));
    days.appendChild(el(`<div class="tv-navl${tvDayOffset ? ' on' : ''}">`
      + (tvDayOffset > 1 ? esc(fmtDay(shownDay).toUpperCase()) : 'TOMORROW') + `</div>`));
    nav.appendChild(days);

    const pgs = el(`<div class="tv-navgrp"></div>`);
    pgs.appendChild(el(`<div class="tv-navk">◀▶</div>`));
    pgs.appendChild(el(`<div class="tv-navl${!onCal ? ' on' : ''}">BOARD</div>`));
    if (boardPages > 1) {
      const dots = el(`<div class="tv-pager"></div>`);
      for (let i = 0; i < boardPages; i += 1) {
        dots.appendChild(el(`<div class="tv-dot${!onCal && i === tvPage ? ' on' : ''}"></div>`));
      }
      pgs.appendChild(dots);
    }
    pgs.appendChild(el(`<div class="tv-navl${onCal ? ' on' : ''}">MONTH</div>`));
    nav.appendChild(pgs);

    wrap.appendChild(nav);
  }

  app.appendChild(wrap);
}

// No hands on this screen, so the board has to keep itself alive: redraw on a
// tick, turn the page on its own, and re-pull in case realtime quietly died.
// A PHONE RUNS WHATEVER IT DOWNLOADED WHEN THE TAB WAS OPENED.
// The televisions have watched for new builds since 23 Aug — they are never touched, so
// without it they run month-old code. Everybody else was left out, and the failure is
// quieter and worse: the office asks for a change, the change ships, and their phone
// carries on showing the old screen. Every report of "it still does the old thing" is
// indistinguishable from the fix not working, and the afternoon goes on the fix.
//
// The board reloads itself, because nobody is standing at it. A phone does not: somebody
// may be halfway through typing a room number, and a page that reloads under a thumb is
// worse than one that is a version behind. It says so instead, and reloads when asked.
let _newBuild = false;
function startBuildWatch() {
  let seen = null;
  const check = () => {
    // HEAD, not the page: this file is half a megabyte and the answer is in one header.
    fetch(location.pathname + '?bc=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then((r) => {
        const stamp = r.headers.get('last-modified') || r.headers.get('etag');
        if (!stamp) return;
        if (seen === null) { seen = stamp; return; }
        if (stamp === seen || _newBuild) return;
        _newBuild = true;
        render();
      })
      .catch(() => {});      // offline is not news; the sync layer already says so
  };
  check();
  setInterval(check, 3 * 60 * 1000);
}

function startTVLoop() {
  // ...+ 1 for the month, which is always the last page. Counted the same way renderTV
  // counts it, or right-arrow walks into a page the board will not draw — which it
  // already did: this added a page for the off-roll-call flats while renderTV has held
  // that list empty since they moved into the columns, so on a board with guest rooms
  // the remote had one more page to walk than there were pages to see.
  const pages = () => Math.max(1, Math.ceil(tvColumns().length / TV_COLS_PER_PAGE)) + 1;
  // PICK UP NEW CODE WITHOUT ANYBODY WALKING TO THE TV. The board pulls fresh DATA
  // all day, but the JavaScript it is running is whatever it downloaded when the page
  // was opened — and this screen is opened once and left for weeks. Every fix shipped
  // since then simply never arrives, and the one screen nobody touches is the one
  // running the oldest code.
  //
  // So it reloads itself once a night, in the half hour after the work day rolls over
  // at 3am: the previous round has closed out, the crew is hours from arriving, and a
  // blink of a page load costs nothing. Only after six hours up, so a reload cannot
  // loop, and never while something is still waiting to be delivered.
  const bootedAt = Date.now();

  // SHIP A FIX, AND THE WALL HAS IT IN FIVE MINUTES.
  // The nightly reload below is the backstop; this is the thing that stops anybody
  // walking to a television. The board pulls fresh DATA all day but runs whatever
  // JAVASCRIPT it downloaded when the page opened, so every fix shipped since then
  // simply never arrives - and on 23 Aug that meant the planner guard was live on the
  // server while both screens carried on churning, because nobody had power-cycled
  // them yet.
  //
  // A HEAD request, not a fetch of the page: the board is half a megabyte and asking
  // for it every few minutes to see whether it changed would move more data than the
  // board itself uses in a day. Last-Modified is all that is needed, and the server
  // already sends it.
  //
  // Only after ten minutes up, so a bad deploy cannot put every screen in the office
  // into a reload loop faster than somebody can revert it.
  let _builtAt = null;
  const checkBuild = () => {
    fetch(location.href, { method: 'HEAD', cache: 'no-store' })
      .then((r) => {
        const stamp = r.headers.get('last-modified') || r.headers.get('etag');
        if (!stamp) return;                       // nothing to compare - leave it alone
        if (_builtAt === null) { _builtAt = stamp; return; }
        if (stamp === _builtAt) return;
        if (Date.now() - bootedAt < 10 * 60 * 1000) return;
        location.reload();
      })
      .catch(() => {});                           // offline: the retry loop already covers it
  };
  checkBuild();
  setInterval(checkBuild, 5 * 60 * 1000);

  setInterval(() => {
    const h = new Date().getHours(), m = new Date().getMinutes();
    const quiet = h === WORKDAY_CUTOFF_HOUR && m >= 30 && m < 40;
    if (!quiet) return;
    if (Date.now() - bootedAt < 6 * 3600e3) return;
    if (isDirty()) return;                    // something of ours is still owed
    location.reload();
  }, 60000);
  setInterval(() => renderTV(), TV_TICK_MS);
  // THE BOARD DOES NOT TURN ITSELF. It used to rotate — fifteen seconds of board,
  // six of Airbnb, round and round — and that was wrong for a screen on a wall: a
  // board that moves while you are reading it makes you wait for your own information
  // to come back, and movement in the corner of a room is a thing people learn to
  // ignore. The office asked for it to stay still, which is also the honest default:
  // the main board is the page that matters and it is now simply always up.
  //
  // The other pages have not gone anywhere. Right and left on the remote reach them,
  // and the board stays wherever it is put — no timer waiting to take the screen back
  // off whoever is standing in front of it. A reload returns to page one on its own,
  // so a page left open overnight is corrected by the 3am refresh without anyone
  // having to remember.
  document.addEventListener('keydown', (e) => {
    const n = pages();
    if (n < 2) return;
    // Left and right still walk the columns. Up and down walk the DAYS — a week ahead
    // and no further back than today, because the wall is not a filing cabinet.
    if (e.key === 'ArrowRight') tvPage = (tvPage + 1) % n;
    else if (e.key === 'ArrowLeft') tvPage = (tvPage - 1 + n) % n;
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      tvDayOffset = Math.max(0, Math.min(7, tvDayOffset + (e.key === 'ArrowDown' ? 1 : -1)));
      tvPage = 0; tvDayTouched = Date.now();
    } else return;
    e.preventDefault();
    renderTV();
  });
  setInterval(() => {
    // Arrivals as well as the board. Hik's Time Card fills in through the morning,
    // so a 06:40 badge-in is routinely not in the data when the board first loads,
    // and a board that asked once at boot would show an empty roll call all day.
    Promise.all([
      remotePull(),
      Promise.resolve().then(() => loadHikArrivals()).catch(() => {}),
    ]).then(([pulled]) => { if (pulled) tvLastData = Date.now(); renderTV(); }).catch(() => {});
    // A WALL THAT HAS HEARD NOTHING FOR HALF AN HOUR IS BROKEN, NOT PATIENT. Whatever
    // wedged it — an expired session, a flag it cannot clear, a socket nobody noticed
    // die — the board cannot diagnose itself, and nobody is going to walk over and
    // reload a screen that claims to be fine. A reload costs the wall two seconds and
    // fixes every one of those causes.
    // ...AND A WALL THAT NEVER HEARD ANYTHING AT ALL IS THE SAME WALL. tvLastData starts
    // at zero and is only stamped when a pull or a realtime update actually lands, so
    // `tvLastData &&` skipped the very case this exists for: a board that came up, drew
    // the numbers it had, and never heard another word. Reckon from the boot when
    // nothing has landed yet — silence since we started is still silence.
    const heardAt = tvLastData || bootedAt;
    if (Date.now() - heardAt > 30 * 60 * 1000) location.reload();
    // THE SOCKET GOES QUIET WITHOUT SAYING SO. The retry ladder hangs off subscribe()'s
    // status callback, and a channel the server has let go does not always report it —
    // the board simply stops hearing, and nothing on the page knows. That is what stood
    // on the wall for most of this morning: 402 and 404 on Sadaaq, Ahmed Daahir holding
    // 403, every name reading NO SCAN, hours after all of it had come off every phone.
    // Nothing was late; it had stopped listening. Ask the channel how it is on every
    // pull rather than waiting to be told, and rejoin if it has gone. 'joining' is left
    // alone so a socket already on its way back is not torn down and started again.
    const rtState = _rtChannel && _rtChannel.state;
    if (db && rtState !== 'joined' && rtState !== 'joining') subscribeRealtime();
  }, TV_PULL_MS);
  // A TV that sleeps at 10am is a blank wall. Wake Lock is refused by most TV
  // browsers, so this is a try-and-shrug, not a guarantee — turn the screensaver
  // off in the TV's own settings as well.
  const hold = () => {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    navigator.wakeLock.request('screen').catch(() => {});
  };
  hold();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { hold(); renderTV(); } });
}

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  // One entry point, so every existing caller — realtime, save, the arrival
  // poller — lands on the board without knowing the board exists.
  if (TV_MODE) { renderTV(); return; }
  clearGhost();                       // nothing left floating from a drag that is over
  const app = document.getElementById('app');
  app.innerHTML = '';
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const s = statsBar();

  // ONE LINE OF CHROME. The board is the app, so everything that is not the board gets
  // out of its way: no eyebrow, no title repeated from the tab you tapped to get here,
  // no stats strip saying what the board says better. The day, how much is left, and
  // the way to everything else.
  const header = el(`<div class="header" style="padding:10px 14px"></div>`);
  const bar = el('<div style="display:flex;align-items:center;gap:10px"></div>');
  // EVERYTHING THAT IS NOT TODAY'S WORK, IN ONE PLACE. Rooms, schedules, the team, the
  // history, the one-off jobs, the settings: all of it is used once a day at most, and
  // all of it was on the main screen or a tab away from it, competing with the round.
  //
  // ON THE LEFT, AND FIRST. It sat on the right in a row with the search and the day
  // switch, which put the way OUT of a screen in the same cluster as the controls FOR
  // that screen — and on the widest screen the board runs on, the way back to
  // everything else was the furthest thing from where a hand already is. It is now the
  // first thing in the bar and it never moves: Back and the title follow it, so the
  // menu is in one place whatever screen you are on and whether or not Back is there.
  const menuBtn = el(`<button class="tb-btn" style="font-size:16px;padding:6px 12px">☰</button>`);
  menuBtn.onclick = () => { _menuOpen = true; render(); };
  bar.appendChild(menuBtn);
  if (_navStack.length && state.tab !== 'board') {
    const back = el(`<button class="tb-btn">‹ Back</button>`);
    back.onclick = goBack;
    bar.appendChild(back);
  }
  const ROOMS_TITLE = { all: 'All Rooms', airbnb: 'Airbnb Rooms', office: 'Office Cleaning', building: 'Building Cleaning' };
  const titles = { board:'', setup:'Setup', more:'Setup', today:'', rollcall:'Morning set-up', tick:'',
    building:'Floors & Common Areas', exterior:'Exterior', history:'Cleaning History', team:'Team',
    settings:'Settings', plan:'Plan a Day', calendar:'Calendar', rooms: ROOMS_TITLE[roomsFilter()], tonight:'Tonight’s Round' };
  // A tab with no view renders an empty screen, so never trust it blindly.
  if (titles[state.tab] === undefined) state.tab = 'board';
  const onBoard = state.tab === 'board';
  document.body.classList.toggle('wide', onBoard);
  document.body.classList.toggle('boardmode', onBoard);

  if (onBoard) {
    // NAME THE DAY THE BOARD IS SHOWING. The plan screen learned this the hard way —
    // it opened on tomorrow while the header printed today, so the office planned what
    // it believed was today and the board came up empty. A header that can be wrong
    // about the day is worse than no header.
    const bDay = shiftDay(workToday(), _boardDay);
    const cols = _boardDay ? tvColumnsForDay(bDay) : tvColumns();
    const c = countJobs(cols);
    const bStr = _boardDay
      ? new Date(bDay + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
      : dateStr;
    bar.appendChild(el(`<div style="min-width:0"><div style="font-size:15px;font-weight:800;`
      + `color:${_boardDay ? '#fcd34d' : '#eaf1fb'}">${esc(bStr)}</div>`
      + `<div style="font-size:12px;font-weight:700;color:#7f9abf">`
      + (_boardDay
        ? `TOMORROW · ${c.all} planned`
        : `<b style="color:${c.all - c.done ? '#fbbf24' : '#22c55e'}">${c.all - c.done} left</b> · ${c.done} done`)
      + `</div></div>`));
  } else {
    bar.appendChild(el(`<div style="min-width:0"><div style="font-size:15px;font-weight:800;color:#eaf1fb">`
      + `${esc(titles[state.tab] || dateStr)}</div>`
      + `<div style="font-size:12px;font-weight:700;color:#7f9abf">${esc(dateStr)}</div></div>`));
  }
  bar.appendChild(el(`<div style="flex:1"></div>`));
  // IS THIS SCREEN TELLING ME THE TRUTH? A board nobody can tell is stale is worse than
  // no board — the televisions have said so in the corner since the day they went up,
  // and every phone and laptop said nothing at all. So a room ticked on the laptop and
  // not on the phone looked like a bug in the ticking rather than one screen being
  // behind. Three states, and only the middle one needs anybody to do anything.
  {
    const owed = dirtyForMs();
    const dot = owed > DEAF_LIMIT_MS ? ['#f59e0b', 'not sent yet']
      : owed ? ['#7ea6dc', 'saving…']
      : offlineMode ? ['#f59e0b', 'offline']
      : ['#22c55e', 'up to date'];
    const sync = el(`<div title="${esc(owed ? 'This device is holding a change it has not managed to send' : 'This device has the current board')}" `
      + `style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:${dot[0]}">`
      + `<span style="width:7px;height:7px;border-radius:4px;background:${dot[0]};display:inline-block"></span>${dot[1]}</div>`);
    bar.appendChild(sync);
  }
  // ONE SMALL BUTTON, IN THE CORNER WITH THE OTHER TWO. It says where it takes you, not
  // where you are: on today it reads Tomorrow, on tomorrow it reads Today. Ahead of the
  // search and menu icons so those keep the corner position everybody's thumb knows.
  if (onBoard) {
    const dayBtn = el(`<button class="tb-btn"${_boardDay ? ' style="border-color:#b45309;color:#fcd34d"' : ''}>`
      + (_boardDay ? '‹ Today' : 'Tomorrow ›') + `</button>`);
    dayBtn.onclick = () => setBoardDay(_boardDay ? 0 : 1);
    bar.appendChild(dayBtn);
    // ...AND ONWARD FROM TOMORROW. Tomorrow answers "what is the next round", and the
    // question straight after it is "and then what" — which the board cannot answer,
    // because it holds one day. Rather than grow a day stepper on a screen built for
    // the round in front of you, the button that already means "further ahead" carries
    // on into the month, which is the screen that exists for exactly that.
    //
    // Only from tomorrow. On today it would be a third control competing with the
    // round; from tomorrow you are already looking forward and it is the next step.
    if (_boardDay) {
      const monthBtn = el(`<button class="tb-btn" style="border-color:#0284c7;color:#38bdf8">Month ›</button>`);
      monthBtn.onclick = () => {
        // Land on the day the board was showing, not on whatever month was last open —
        // arriving somewhere other than where you were is how a jump loses your place.
        const d = shiftDay(workToday(), _boardDay);
        _calDay = d;
        const t = new Date(d + 'T00:00:00');
        _calMonth = new Date(t.getFullYear(), t.getMonth(), 1);
        setTab('calendar');
      };
      bar.appendChild(monthBtn);
    }
  }
  const searchBtn = el(`<button class="tb-btn">⌕</button>`);
  searchBtn.onclick = openSearch;
  bar.appendChild(searchBtn);
  header.appendChild(bar);
  // ON THE PLAN SCREEN, SAY WHICH DAY IS BEING PLANNED. It opens on TOMORROW while the
  // header printed today's date, so the office planned what it believed was today, the
  // work was filed against tomorrow, and today's board came up empty. Nothing was wrong
  // with the plan or the sync — the screen was naming the wrong day.
  if (state.tab === 'plan') {
    const pd = curPlanDay();
    const pretty = new Date(pd + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    const isToday = pd === workToday() || pd === todayKey();
    const rel = isToday ? 'TODAY' : pd === tomorrowKey() ? 'TOMORROW' : null;
    header.appendChild(el(`<div class="h-date" style="font-size:13px;font-weight:800;margin-top:6px;`
      + `color:${isToday ? '#15803d' : '#b45309'}">`
      + `Planning ${rel ? rel + ' · ' : ''}${esc(pretty)}</div>`));
    if (!isToday) header.appendChild(el(`<div class="h-date" style="color:#b45309">`
      + `Not today — these rooms appear on the board on ${esc(pretty.split(',')[0])}.</div>`));
  }
  app.appendChild(header);
  // Said once, at the top, and it stays until it is taken. One tap: the office should
  // never have to know what a hard refresh is.
  if (_newBuild) {
    const bar = el(`<div style="display:flex;align-items:center;gap:10px;margin:10px 16px 0;padding:10px 12px;`
      + `border-radius:10px;background:#eef6fd;border:1px solid #cfe8fb"></div>`);
    bar.appendChild(el(`<div style="flex:1;min-width:0;font-size:12px;font-weight:700;color:#0369a1">`
      + `A newer version of the app is ready.</div>`));
    const rb = el(`<button class="freqmini" style="flex:0 0 auto;padding:8px 12px;background:#0284c7;`
      + `border-color:#0284c7;color:#ffffff">Reload</button>`);
    rb.onclick = () => location.reload();
    bar.appendChild(rb);
    app.appendChild(bar);
  }

  if (state.tab==='more' || state.tab==='setup') app.appendChild(viewMore());
  else if (state.tab==='board' || state.tab==='today' || state.tab==='tick') app.appendChild(viewTick());
  else if (state.tab==='rollcall') app.appendChild(viewRollCall());
  else if (state.tab==='calendar') app.appendChild(viewCalendar());
  else if (state.tab==='plan') app.appendChild(viewPlan());
  else if (state.tab==='tonight') app.appendChild(viewTonight());
  else if (state.tab==='rooms') app.appendChild(viewRoomsHub());
  else if (state.tab==='building') app.appendChild(viewBuilding());
  else if (state.tab==='exterior') app.appendChild(viewExterior());
  else if (state.tab==='history') app.appendChild(viewHistory());
  else if (state.tab==='team') app.appendChild(viewTeam());
  else if (state.tab==='settings') app.appendChild(viewSettings());

  // NOBODY SHOULD MISTAKE A STALE BOARD FOR A LIVE ONE. Says what it is, how old it
  // is, and that the work is not lost — the three things somebody needs to decide
  // whether to trust what they are looking at.
  if (offlineMode) {
    const bar = el(`<div style="background:#fdf3e6;border:1px solid #f0d9b5;border-radius:10px;`
      + `padding:10px 12px;margin:0 14px 12px;font-size:12px;color:#8a5a12;font-weight:600">`
      + `⚠ Offline — showing the board as saved ${esc(lastSyncLabel())}. `
      + `Your ticks are kept and go up when it is back.</div>`);
    app.insertBefore(bar, app.firstChild ? app.firstChild.nextSibling : null);
  }
  app.appendChild(el(`<div class="footer">`
    + (offlineMode ? 'Offline — changes are held on this device until the server is back'
                   : 'Changes save on this device · Daily tasks reset each day')
    + `</div>`));

  // --- Cover confirmation popup ---
  if (state.pendingCover) {
    const pc = state.pendingCover;
    const absent = STAFF.find(p => p.id === pc.absentId);
    const affected = unitsOwnedBy(pc.absentId);
    if (absent && affected.length) {
      const overlay = el(`<div class="modal-overlay"></div>`);
      const modal = el(`<div class="modal"></div>`);
      modal.appendChild(el(`<div class="modal-title">${esc(absent.name.split(' ')[0])} is absent</div>`));
      const unitList = affected.map(u => 'Unit ' + esc(u.unit)).join(', ');
      modal.appendChild(el(`<div class="modal-sub">${affected.length} unit${affected.length>1?'s':''} need cover: ${unitList}</div>`));

      // chosen coverer (default = suggestion), selectable
      let chosen = pc.suggestId;
      modal.appendChild(el(`<div class="modal-label">Assign cover to:</div>`));
      const picker = el(`<div class="cover-picker"></div>`);
      // Anybody who is away cannot cover — that used to read 'noshow' alone, so a
      // cleaner off sick, or marked off for the day, was offered as cover for somebody
      // else who was absent.
      const present = STAFF.filter(p => p.id !== pc.absentId && !isAway(p.id));
      const loads = unitLoads();
      if (!present.length) {
        modal.appendChild(el(`<div class="modal-sub" style="color:#dc2626">No one else is present to cover.</div>`));
      }
      present
        .sort((a,b) => (loads[a.id]||0)-(loads[b.id]||0))
        .forEach(p => {
          const isSug = p.id === pc.suggestId;
          const btn = el(`<button class="cover-opt ${p.id===chosen?'on':''}">${esc(p.name.split(' ')[0])}<span class="cover-load">${loads[p.id]||0} units${isSug?' · lightest':''}</span></button>`);
          btn.onclick = () => { chosen = p.id; picker.querySelectorAll('.cover-opt').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); };
          picker.appendChild(btn);
        });
      modal.appendChild(picker);

      const btnRow = el(`<div class="modal-btns"></div>`);
      const confirmB = el(`<button class="modal-confirm">Confirm cover</button>`);
      confirmB.onclick = () => { if (chosen) confirmCover(chosen); else dismissCover(); };
      const skipB = el(`<button class="modal-skip">Skip for now</button>`);
      skipB.onclick = () => dismissCover();
      if (present.length) btnRow.appendChild(confirmB);
      btnRow.appendChild(skipB);
      modal.appendChild(btnRow);

      overlay.appendChild(modal);
      app.appendChild(overlay);
    }
  }

  if (_backdate) app.appendChild(backdateSheet());
  if (_search) app.appendChild(searchSheet());

  // NO TAB BAR. There is one screen; everything else is behind ☰.
  if (_menuOpen) app.appendChild(menuSheet());
  // The sticky search bar has to sit exactly under the header, and the header's
  // height changes with the screen and with which strips it is showing — so it is
  // measured rather than guessed.
  const hdr = app.querySelector('.header');
  if (hdr) app.style.setProperty('--hdr', hdr.offsetHeight + 'px');
}

// ============================================================
// LOGIN  (real accounts via Supabase Auth; the local gate is only a
// fallback for when the server isn't configured)
// ============================================================
const AUTH_KEY = 'cleaning_app_auth';                              // legacy fallback flag
const CREDENTIALS = { username: 'admin', password: 'admin123' };   // fallback only (no server)
let authed = false;                                                // true when a real Supabase session exists

// ============================================================
// WORKING WHEN THE SERVER IS NOT
//
// The whole board is written to localStorage on every save, and yet the app
// refused to open without a live Supabase session — db is always truthy, so the
// gate always demanded the server. On 19 Aug 2026 Supabase restricted the project
// over an Edge Function quota and returned 402 to everything, including auth. The
// crew met a login screen that could never accept their PIN, with a perfectly good
// copy of the morning's board sitting unused on the device.
//
// A backend will go down sometime — this one, or whichever replaces it. So the
// server being reachable is no longer what decides whether anyone can work.
//
// The gate is KEPT, not dropped: on a successful sign-in the PIN is hashed and the
// hash stored, so offline it can still be checked. Only a device that has signed in
// for real can fall back; a fresh device stays locked out exactly as before.
// ============================================================
const PIN_HASH_KEY = 'cleaning_pin_hash';    // sha-256 of the PIN, never the PIN
const CACHE_STAMP_KEY = 'cleaning_last_sync';
let offlineMode = false;                     // running from the local copy

async function pinHash(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('orfane:' + pin));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
const canWorkOffline = () => {
  try { return !!localStorage.getItem(PIN_HASH_KEY) && !!localStorage.getItem(STORE); }
  catch (e) { return false; }
};
// A refusal that is about the SERVER, not about the PIN. A wrong PIN must never
// open the offline door — only an unreachable or broken back end does.
const isServerDown = (e) => {
  const msg = String((e && (e.message || e.error_description || e)) || '').toLowerCase();
  const status = e && (e.status || e.statusCode);
  if (status && (status === 402 || status === 403 || status >= 500)) return true;
  return /restricted|quota|failed to fetch|networkerror|load failed|timeout|502|503|504/.test(msg);
};
function stampSynced() { try { localStorage.setItem(CACHE_STAMP_KEY, new Date().toISOString()); } catch (e) {} }
function lastSyncLabel() {
  try {
    const v = localStorage.getItem(CACHE_STAMP_KEY);
    if (!v) return 'an earlier session';
    const d = new Date(v);
    return isNaN(d) ? 'an earlier session'
      : d.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  } catch (e) { return 'an earlier session'; }
}

// Synchronous "is someone signed in?" used by route()/boot().
function isLoggedIn() { return db ? (authed || offlineMode) : (localStorage.getItem(AUTH_KEY) === 'true'); }

async function logout() {
  try { if (db) await db.auth.signOut(); } catch (e) {}
  authed = false;
  offlineMode = false;
  localStorage.removeItem(AUTH_KEY);
  // Signing out closes the offline door as well, or "log out" would leave the device
  // still openable by the same PIN with no way to revoke it.
  try { localStorage.removeItem(PIN_HASH_KEY); } catch (e) {}
  renderLogin();
}

async function attemptLogin() {
  const pinEl = document.getElementById('loginPin');
  const errEl = document.getElementById('loginErr');
  const pin = (pinEl.value || '').trim();
  const fail = (msg) => { errEl.textContent = msg; pinEl.classList.add('error'); };
  if (!/^\d{4}$/.test(pin)) { fail('Enter your 4-digit PIN'); return; }
  const email = 'admin@orfanerealestate.so';
  const password = 'orfane-' + pin;   // 4-digit PIN padded to a valid password

  if (db) {
    const btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
    try {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      authed = true;
      offlineMode = false;
      // Keep a hash of the PIN that just worked, so this device can check it again
      // when the server cannot be asked. Never the PIN itself.
      try { localStorage.setItem(PIN_HASH_KEY, await pinHash(pin)); } catch (e2) {}
      boot();
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
      // THE SERVER IS DOWN, NOT THE PIN WRONG. Check it against the hash this device
      // stored the last time it signed in for real, and open the local copy.
      if (isServerDown(e) && canWorkOffline() && (await pinHash(pin)) === localStorage.getItem(PIN_HASH_KEY)) {
        offlineMode = true;
        authed = false;
        bootOffline();
        return;
      }
      pinEl.value = '';
      fail(isServerDown(e) ? 'Server unavailable — try again' : 'Wrong PIN');
    }
    return;
  }
  fail('Server not connected.');
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const screen = el(`<div class="login-screen"></div>`);
  const box = el(`<div class="login-box"></div>`);
  box.appendChild(el(`<div class="login-logo">✦</div>`));
  box.appendChild(el(`<div class="login-heading">Cleaning Ops</div>`));
  box.appendChild(el(`<div class="login-sub">Enter your 4-digit PIN</div>`));
  const pin = el(`<input class="login-input" id="loginPin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" style="text-align:center;letter-spacing:0.6em;font-size:26px">`);
  pin.addEventListener('input', () => {
    pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
    pin.classList.remove('error');
    if (pin.value.length === 4) attemptLogin();   // auto-submit on 4th digit
  });
  pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  box.appendChild(pin);
  const btn = el(`<button class="login-btn" id="loginBtn">Sign In</button>`);
  btn.onclick = attemptLogin;
  box.appendChild(btn);
  box.appendChild(el(`<div class="login-error" id="loginErr"></div>`));
  screen.appendChild(box);
  app.appendChild(screen);
  setTimeout(() => { try { pin.focus(); } catch (e) {} }, 100);
}

// Everything automatic about planning used to happen here and only here, which meant
// it happened when somebody OPENED the app. That was survivable while the office
// reloaded it on a phone each morning; it is not survivable on a TV left on for a
// week, where boot runs once and the day rolls over without anything re-planning.
// So the chain lives in its own function and a watcher re-runs it when the work day
// changes, with nobody touching anything.
// NOBODY STARTS THE MORNING HOLDING FOUR ASKED-FOR ROOMS.
// The early rooms are the ones with a clock on them, and the hand-out has always had a
// cap of two each — but the hand-out is switched off on this building, so nothing
// enforced it. Pins do the allocating instead, and pins do not count: four early rooms
// pinned to one person are four early rooms that person starts the day with.
//
// This levels the early round ONCE, at the first sight of the day, before anybody has
// ticked anything — and then never again, which is the other half of what the office
// asked for: no movement once people are working. It only ever takes an early room off
// somebody holding more than the cap and gives it to somebody holding fewer. Nothing
// else on the board is touched, no pin is changed, and every move it makes is stamped as
// a decision so the day cannot re-deal it afterwards.
function evenOutEarlyRooms() {
  if (TV_MODE) return { moved: 0 };
  const day = workToday();
  if (state.earlyEvenedOn === day) return { moved: 0 };     // once a day, and once only
  const cap = earlyCap();
  const staffById = {};
  (state.staff || []).forEach((p) => { staffById[p.id] = p; });
  // Only people who could actually take one: on the crew, here, and cleared for the kind.
  const takers = cleaningStaff().filter((p) => p.isLeader && !isAway(p.id) && worksToday(p));
  if (takers.length < 2) return { moved: 0 };

  const early = todaysRoomList().filter((u) => timeSlot(u) === 'early' && !cleanedToday(u));
  if (!early.length) { state.earlyEvenedOn = day; return { moved: 0 }; }

  const load = {};
  takers.forEach((p) => { load[p.id] = 0; });
  early.forEach((u) => { if (load[u.assignedTo] != null) load[u.assignedTo] += 1; });

  const moves = [];
  let guard = 0;
  for (;;) {
    if (++guard > 50) break;                                 // a loop that cannot run away
    const over = Object.keys(load).filter((id) => load[id] > cap)
      .sort((a, b) => load[b] - load[a])[0];
    if (!over) break;
    const under = Object.keys(load).filter((id) => load[id] < cap)
      .sort((a, b) => load[a] - load[b] || String(staffById[a].name).localeCompare(String(staffById[b].name)))[0];
    if (under === undefined) break;                          // everybody is at the cap already
