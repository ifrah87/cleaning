<!DOCTYPE html>
<html lang="en">
<head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #f4f7fb;
    color: #15202e;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; font-size: 16px; }
  ::-webkit-scrollbar { display: none; }

  /* Brand palette
     navy   #0284c7   teal #0284c7   teal-soft #e3f2f4
     ink    #15202e   slate #5f7189  line #e7ecf3
     green  #15803d   amber #b45309  red #dc2626
  */

  #app { min-height: 100vh; padding-bottom: 78px; }

  .header {
    background: linear-gradient(180deg, #ffffff 0%, #eef2f8 100%);
    color: #15202e;
    padding: 18px 16px 16px;
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid #e7ecf3;
    box-shadow: 0 1px 3px rgba(15,40,80,0.06);
  }

  .h-title { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; color: #0f1a27; }
  .h-date { font-size: 11px; color: #5f7189; margin-top: 3px; font-weight: 500; }

  .stats { display: flex; gap: 8px; margin-top: 14px; }
  .stat {
    background: #eef2f8; border: 1px solid #e7ecf3;
    border-radius: 10px; padding: 8px 12px; flex: 1;
  }
  .stat .lbl { font-size: 9px; letter-spacing: 0.12em; color: #5b6a7f; font-weight: 600; margin-bottom: 1px; }
  .stat .val { font-size: 19px; font-weight: 800; color: #0f1a27; }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #ffffff; border-top: 1px solid #e7ecf3;
    display: flex; z-index: 30;
    padding-bottom: env(safe-area-inset-bottom, 0);
    box-shadow: 0 -2px 12px rgba(15,58,95,0.06);
  }
  .nav button {
    flex: 1; padding: 10px 4px 12px; text-align: center;
    color: #5b6a7f; font-size: 10px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .nav button.active { color: #0284c7; }
  .nav .ico { font-size: 19px; line-height: 1; }

  .body { padding: 16px; }

  /* Roll call */
  .crew-group { margin-bottom: 16px; }
  .crew-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 0 2px; }
  .crew-dot { width: 10px; height: 10px; border-radius: 3px; }
  .crew-name { font-size: 13px; font-weight: 700; color: #0f1a27; }
  .crew-sub { font-size: 11px; color: #5b6a7f; font-weight: 600; margin-left: auto; }

  .person {
    background: #ffffff; border: 1px solid #e7ecf3; border-radius: 9px;
    padding: 8px 12px; margin-bottom: 5px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 3px rgba(15,58,95,0.04);
  }
  .person-name { font-size: 14px; }
  .person-floors { font-size: 11px; }
  .person-info { flex: 1; min-width: 0; }
  .person-name { font-size: 15px; font-weight: 600; color: #0f1a27; }
  .person-floors { font-size: 12px; color: #5f7189; margin-top: 1px; }
  .status-btn {
    padding: 9px 14px; border-radius: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    min-width: 96px; text-align: center; color: #ffffff;
  }

  .alert {
    background: #ffffff; border: 1px solid #f6d5d5; border-left: 4px solid #dc2626;
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(212,73,63,0.08);
  }
  .alert-title { font-size: 12px; color: #dc2626; font-weight: 700; }
  .alert-body { font-size: 13px; color: #b91c1c; margin-top: 5px; line-height: 1.5; }
  .cover-suggest {
    background: #e7f6ec; border: 1px solid #bfe6cd; border-radius: 9px;
    padding: 10px 12px; margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .cover-text { font-size: 12px; color: #15803d; flex: 1; }
  .cover-btn {
    background: #15803d; color: #ffffff; padding: 9px 14px; border-radius: 8px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }

  .confirm {
    background: #e7f6ec; border: 1px solid #bfe6cd; border-radius: 9px;
    padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .confirm-text { font-size: 12px; color: #15803d; flex: 1; }
  .undo-btn { font-size: 11px; color: #5f7189; border: 1px solid #d8e0ea; border-radius: 7px; padding: 7px 11px; font-weight: 600; }

  /* Floors */
  .floor { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; margin-bottom: 9px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,58,95,0.04); }
  .floor-head { width: 100%; padding: 13px 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
  .floor-badge {
    width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #ffffff;
  }
  .floor-info { flex: 1; min-width: 0; }
  .floor-name { font-size: 15px; font-weight: 700; color: #0f1a27; }
  .floor-sub { font-size: 11px; color: #5f7189; margin-top: 1px; font-weight: 500; }
  .floor-prog { width: 48px; height: 6px; border-radius: 3px; background: #e7ecf3; position: relative; flex-shrink: 0; overflow: hidden; }
  .floor-prog > div { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .chev { color: #5b6a7f; font-size: 12px; width: 14px; text-align: center; }

  .unit-grid { padding: 4px 14px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .unit { background: #eef2f8; border: 1px solid #e7ecf3; border-radius: 10px; padding: 11px 8px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .unit.done { background: #e7f6ec; border-color: #bfe6cd; }
  .unit-num { font-size: 15px; font-weight: 800; color: #0f1a27; }
  .unit.done .unit-num { color: #15803d; }
  .unit-mark { width: 100%; padding: 7px; border-radius: 7px; font-size: 11px; font-weight: 700; color: #ffffff; background: #0284c7; }
  .unit.done .unit-mark { background: #15803d; }

  /* Zones */
  .zone { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(15,58,95,0.04); }
  .zone.done { background: #e7f6ec; border-color: #bfe6cd; }
  .zone-info { flex: 1; min-width: 0; }
  .zone-freq { font-size: 10px; letter-spacing: 0.08em; font-weight: 700; }
  .zone-name { font-size: 14px; font-weight: 600; color: #0f1a27; margin-top: 2px; }
  .zone.done .zone-name { color: #15803d; }
  .zone-mark { padding: 9px 16px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #ffffff; background: #0284c7; white-space: nowrap; }
  .zone.done .zone-mark { background: #15803d; }

  .section-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; margin: 2px 0 12px; text-transform: uppercase; }
  .note { font-size: 13px; color: #5f7189; line-height: 1.55; margin-bottom: 14px; }
  .reset-btn { width: 100%; background: #ffffff; color: #5f7189; border: 1px solid #d8e0ea; border-radius: 10px; padding: 11px; font-size: 12px; font-weight: 600; margin-bottom: 14px; }
  .owner-tag { font-size: 9px; letter-spacing: 0.04em; padding: 4px 9px; border-radius: 6px; font-weight: 700; color: #ffffff; }
  .footer { padding: 18px 16px 8px; font-size: 11px; color: #6b7a8f; text-align: center; font-weight: 500; }
  .hint { font-size: 11px; color: #6b7a8f; text-align: center; margin-top: 6px; font-weight: 500; }

  /* Serviced units */
  .addbox { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .addbox input { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 11px; }
  .addbox input::placeholder { color: #5b6a7f; }
  .freqpick { flex: 1; padding: 9px 4px; border-radius: 8px; font-size: 11px; font-weight: 600; color: #5f7189; background: #f4f7fb; border: 1px solid #d8e0ea; }
  .freqpick.on { color: #ffffff; background: #0284c7; border-color: #0284c7; }
  .add-btn { width: 100%; background: #0284c7; color: #ffffff; border-radius: 9px; padding: 12px; font-size: 13px; font-weight: 700; }
  .su-card { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; }
  .su-card.done { background: #e7f6ec; border-color: #bfe6cd; }
  .su-top { display: flex; align-items: center; gap: 12px; }
  .su-unit { font-size: 16px; font-weight: 700; color: #0f1a27; }
  .su-guest { font-size: 12px; color: #5f7189; margin-top: 1px; }
  .su-mark { padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #ffffff; background: #0284c7; white-space: nowrap; }
  .su-card.done .su-mark { background: #15803d; }
  .su-next { font-size: 11px; color: #5f7189; font-weight: 600; padding: 6px 10px; border: 1px solid #d8e0ea; border-radius: 7px; white-space: nowrap; }
  .su-ctl { display: flex; gap: 6px; margin-top: 11px; padding-top: 11px; border-top: 1px solid #e7ecf3; }
  /* Communal areas: a plain list, not nine stacked cards. One thin rule between
     rows carries the separation a box was doing at ten times the height. */
  .area-list { background: #ffffff; border: 1px solid #e2e8f1; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .area-item { border-top: 1px solid #eef2f7; }
  .area-item:first-child { border-top: none; }
  .area-row { display: flex; align-items: center; gap: 8px; padding: 6px 9px; }
  .area-tick { flex: 0 0 auto; width: 19px; height: 19px; padding: 0; border-radius: 50%; border: 1.5px solid #cbd5e1; background: #ffffff; color: transparent; font-size: 10px; line-height: 1; }
  .area-tick.on { background: #15803d; border-color: #15803d; color: #ffffff; }
  .area-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 700; color: #15202e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .area-item.done .area-name { color: #94a3b8; }
  .area-freq { font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: 0.05em; }
  .area-who { flex: 0 1 112px; min-width: 0; font-size: 11.5px; padding: 3px 5px; border: 1px solid #e2e8f1; border-radius: 6px; background: #f8fafc; color: #334155; }
  .area-more { flex: 0 0 auto; width: 22px; padding: 3px 0; font-size: 12px; color: #94a3b8; background: transparent; border: none; }
  .area-ctl { display: flex; gap: 4px; padding: 0 9px 7px; }
  .freqmini { flex: 1; padding: 7px 4px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #5f7189; background: #f4f7fb; border: 1px solid #d8e0ea; }
  .freqmini.on { color: #ffffff; background: #0284c7; border-color: #0284c7; }
  .su-rm { padding: 7px 12px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #dc2626; background: transparent; border: 1px solid #f6d5d5; }
  .su-edit { padding: 7px 12px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #0284c7; background: transparent; border: 1px solid #cfe8fb; }
  .area-select { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 10px; font-size: 13px; }
  .su-card input { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 11px; }
  .su-card input::placeholder { color: #5b6a7f; }
  .su-assign { font-size: 11px; font-weight: 600; margin-top: 3px; }
  .su-card.needs-cover { border-color: #dc2626; }

  /* Cover confirmation popup */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: #ffffff; border: 1px solid #d8e0ea; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; padding: 20px 18px calc(20px + env(safe-area-inset-bottom,0)); }
  .modal-title { font-size: 18px; font-weight: 800; color: #0f1a27; }
  .modal-sub { font-size: 13px; color: #5f7189; margin-top: 6px; line-height: 1.5; }
  .modal-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; text-transform: uppercase; margin: 16px 0 8px; }
  .cover-picker { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .cover-opt { display: flex; justify-content: space-between; align-items: center; padding: 13px 14px; border-radius: 10px; background: #eef2f8; border: 1px solid #d8e0ea; color: #15202e; font-size: 14px; font-weight: 600; }
  .cover-opt.on { border-color: #0284c7; background: #e6f4fd; }
  .cover-load { font-size: 11px; color: #5f7189; font-weight: 500; }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
  .modal-confirm { flex: 1; background: #0284c7; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 700; }
  .modal-skip { padding: 14px 18px; border-radius: 10px; background: transparent; border: 1px solid #d8e0ea; color: #5f7189; font-size: 13px; font-weight: 600; }
  .modal-danger { flex: 1; background: #dc2626; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 700; }

  /* Login screen */
  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 360px; }
  .login-logo { font-size: 36px; text-align: center; margin-bottom: 8px; }
  .login-heading { font-size: 22px; font-weight: 800; color: #0f1a27; text-align: center; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: #5b6a7f; text-align: center; margin-bottom: 28px; }
  .login-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
  .login-input { width: 100%; background: #ffffff; color: #15202e; border: 1px solid #d8e0ea; border-radius: 10px; padding: 13px 14px; font-size: 15px; margin-bottom: 16px; outline: none; }
  .login-input:focus { border-color: #0284c7; }
  .login-input.error { border-color: #dc2626; }
  .login-btn { width: 100%; background: #0284c7; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; margin-top: 4px; }
  .login-error { font-size: 12px; color: #dc2626; text-align: center; margin-top: 12px; font-weight: 600; }

  /* Backup buttons */
  .backup-btn { width: 100%; border-radius: 10px; padding: 13px; font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .backup-export { background: #ffffff; color: #0284c7; border: 1px solid #cfe8fb; }
  .backup-import { background: #ffffff; color: #b45309; border: 1px solid #f5e4bd; }
  .backup-msg { font-size: 12px; text-align: center; margin-top: 8px; font-weight: 600; padding: 8px; border-radius: 8px; }
  .backup-msg.ok { color: #15803d; background: #e7f6ec; }
  .backup-msg.err { color: #dc2626; background: #fbe3e3; }

  /* Persistent storage warning (save/load failures) */
  .storage-warn { background: #fbe3e3; color: #dc2626; border-bottom: 1px solid #f6d5d5; padding: 11px 14px; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.4; }

  /* Make the native date-picker calendar icon visible on our dark fields */
  input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.55; cursor: pointer; }
  input[type="date"] { -webkit-appearance: none; appearance: none; }
</style>
</head>

<script>
// ============================================================
// SHARED SERVER (Supabase) — fill these two in after creating your project.
// Until then the app keeps working locally (localStorage only), exactly as before.
// See SETUP.md for the 5-minute walkthrough.
// ============================================================
const SUPABASE_URL = 'https://issnrivggzkhrcjfhzit.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzc25yaXZnZ3praHJjamZoeml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNzU3MTIsImV4cCI6MjA5OTY1MTcxMn0.XiBy2O1KD41as85PsZCuEqkMXCFFfKQcgpr0-628pGI';
const BUILDING = 'orfane-main';   // must match the seeded row in supabase-schema.sql
const db = (window.supabase && !SUPABASE_URL.includes('YOUR-') && !SUPABASE_ANON_KEY.includes('YOUR-'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// ============================================================
// DATA MODEL — Edit STAFF to match your real team (one-time).
// ============================================================
const DEFAULT_STAFF = [
  { id: 'p1', name: 'Sofia Reyes',   crew: 'Team A', color: '#0284c7', floors: [1, 2] },
  { id: 'p2', name: 'Daniel Chen',   crew: 'Team A', color: '#0284c7', floors: [3, 4] },
  { id: 'p3', name: 'Priya Shah',    crew: 'Team B', color: '#0284c7', floors: [5, 6] },
  { id: 'p4', name: 'Jamal Brooks',  crew: 'Team B', color: '#0284c7', floors: [7, 8] },

// STAFF is a live reference into state.staff (set in load()). Using a getter
// so all existing code that reads STAFF keeps working unchanged.
let STAFF = DEFAULT_STAFF;

const DEFAULT_AREAS = [
  // Interior — ground/common
  { id: 'lobby', label: 'Main Lobby', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'mail', label: 'Mail Room', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'gym', label: 'Fitness Room', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'laundry', label: 'Laundry Room', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'trash', label: 'Trash / Recycling', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'elevator', label: 'Elevators / Lifts', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'stairs', label: 'Stairwells', freq: 'weekly', kind: 'interior', assignedTo: null },
  { id: 'corridors', label: 'Corridors', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'windowsint', label: 'Interior Windows', freq: 'monthly', kind: 'interior', assignedTo: null },
  // Exterior
  { id: 'entrance', label: 'Entrance & Walkway', freq: 'daily', kind: 'exterior', assignedTo: null },
  { id: 'dumpster', label: 'Dumpster / Bin Store', freq: 'daily', kind: 'exterior', assignedTo: null },
  { id: 'sidewalks', label: 'Sidewalks', freq: 'weekly', kind: 'exterior', assignedTo: null },
  { id: 'landscape', label: 'Landscaping Edges', freq: 'weekly', kind: 'exterior', assignedTo: null },
  { id: 'windowsext', label: 'Exterior Windows', freq: 'monthly', kind: 'exterior', assignedTo: null },
  { id: 'rooftopcheck', label: 'Rooftop Check', freq: 'weekly', kind: 'exterior', assignedTo: null },
];
const DEFAULT_FLOORS = 11;

const FREQ = {
  daily:   { label: 'DAILY', tint: '#0284c7' },
  weekly:  { label: 'WEEKLY', tint: '#b45309' },
  monthly: { label: 'MONTHLY', tint: '#7c3aed' },
};
const STATUS = {
  present: { label: 'PRESENT', color: '#15803d' },
  late:    { label: 'LATE', color: '#b45309' },
  noshow:  { label: 'NO-SHOW', color: '#dc2626' },
  off:     { label: 'OFF', color: '#5b6a7f' },
};
const STATUS_ORDER = ['present', 'late', 'noshow', 'off'];

// Areas live in state (editable). Helpers to read them:
function areasInterior() { return (state.areas || []).filter(a => a.kind === 'interior'); }
function areasExterior() { return (state.areas || []).filter(a => a.kind === 'exterior'); }

// --- Communal areas as work --------------------------------------------------
// The interior areas are a job somebody has to be given, the same as a room. They
// were only ever visible on the Floors & Common Areas checklist, which is not where
// the morning is allocated, so nobody was ever handed the corridors.
// An area stays outstanding until it's ticked off for its current period: daily

  if (typeof state.floors !== 'number' || state.floors < 1) state.floors = DEFAULT_FLOORS;
  if (!state.plans || typeof state.plans !== 'object') state.plans = {};
  if (!state.planSeeded || typeof state.planSeeded !== 'object') state.planSeeded = {};
  if (!state.planDropped || typeof state.planDropped !== 'object') state.planDropped = {};
  if (!state.manualArrivals || typeof state.manualArrivals !== 'object') state.manualArrivals = {};
  if (!state.assignConfirmed || typeof state.assignConfirmed !== 'object') state.assignConfirmed = {};
  dedupeServicedUnits();
  STAFF = state.staff;
  refreshTeamColors();
  STAFF.forEach(p => { if (!state.attendance[p.id]) state.attendance[p.id] = 'present'; });
}
// Self-heal: collapse any rooms that share a unit number down to one record,
// carrying over an assignment/priority from whichever copy has it. Runs on every
// load so a stale device that re-added duplicates can't leave them behind.
function dedupeServicedUnits() {
  if (!Array.isArray(state.servicedUnits)) { state.servicedUnits = []; return false; }
  const byUnit = new Map();
  for (const u of state.servicedUnits) {
    const key = String(u.unit || '').trim().toLowerCase();
    if (!byUnit.has(key)) { byUnit.set(key, u); continue; }
    const base = byUnit.get(key);
    for (const f of ['assignedTo', 'usualTo', 'priority', 'guest', 'time', 'lastCleaned']) {
      if (!base[f] && u[f]) base[f] = u[f];
    }
  }
  const before = state.servicedUnits.length;
  state.servicedUnits = [...byUnit.values()];
  return state.servicedUnits.length !== before;   // true if it removed any dupes
}

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const saved = JSON.parse(raw);
      state = { ...state, ...saved, tab: 'rollcall' };
      if (state.coverageDay !== todayKey()) { state.coverage = {}; state.unitCover = {}; state.pendingCover = null; state.coverageDay = todayKey(); }
    }
  } catch (e) {}
  finalizeState();
}

// Save = write the local cache instantly, then push to the shared server.
// The device is marked dirty until the server confirms the write, so a change
// can never be left stranded on one phone (see DIRTY FLAG below).
function save() {
  dedupeServicedUnits();   // never persist a duplicate room, no matter how it got created
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  markDirty();
  remotePush();
}

// ============================================================
// SHARED SERVER SYNC (Supabase)
// The whole app state is stored as one row per building. Every device
// pulls it on open, pushes on every change, and gets live updates.
// NOTE (concurrency): this is document-level "last write wins". If two
// people save within the same ~second, one change can be overwritten.
// Fine for a small crew; if that becomes a problem the high-write pieces
// (attendance, completions) should move to their own rows — see SETUP.md.
//
// DURABILITY: a save is not finished until the server confirms it. Until then
// the device is "dirty": it retries, it flushes before the page is hidden or
// closed, it re-pushes on the next open, and it refuses to let a server copy
// overwrite the change it has not managed to send yet. Without this, a tap
// followed by locking the phone lost the change silently — it stayed in
// localStorage, so that phone kept showing it while no other device ever saw it.
// ============================================================
const DIRTY_KEY = STORE + '_dirty';   // survives a reload, so an unsent change is replayed
let _lastRemoteJSON = null;   // dedupe realtime echoes of our own writes
let _pushTimer = null;
let _retryTimer = null;
let _retryDelay = 0;
let _pushing = false;

function isDirty() { try { return localStorage.getItem(DIRTY_KEY) === '1'; } catch (e) { return false; } }
function markDirty() { try { localStorage.setItem(DIRTY_KEY, '1'); } catch (e) {} }
function clearDirty() { try { localStorage.removeItem(DIRTY_KEY); } catch (e) {} }

// Debounced push: collapses a burst of saves into one network write.
function remotePush() {
  if (!db) return;             // not configured yet → local-only (unchanged behavior)
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => { pushNow(); }, 250);
}

// Send the current state to the server. Resolves true only when the row is written.
async function pushNow() {
  if (!db || _pushing) return false;
  clearTimeout(_pushTimer);    // a pending debounce is now redundant
  clearTimeout(_retryTimer);
  _pushing = true;
  const snapshot = JSON.stringify(state);
  try {
    const { error } = await db.from('app_state')
      .upsert({ building: BUILDING, data: JSON.parse(snapshot), updated_at: new Date().toISOString() });
    if (error) throw error;
    _lastRemoteJSON = snapshot;   // only now is it genuinely our own write echoing back
    clearDirty();
    _retryDelay = 0;
    hideStorageWarn();
    return true;
  } catch (e) {
    markDirty();                  // still ours to deliver
    showStorageWarn('Not saved to the server yet (' + (e.message || e) + '). Retrying — keep this page open.');
    scheduleRetry();
    return false;
  } finally {
    _pushing = false;
  }
}

// Keep trying, backing off 1s → 2s → 4s … up to 30s, until the write lands.
function scheduleRetry() {
  clearTimeout(_retryTimer);
  _retryDelay = Math.min(_retryDelay ? _retryDelay * 2 : 1000, 30000);
  _retryTimer = setTimeout(() => { if (isDirty()) pushNow(); }, _retryDelay);
}

// Flush before the page goes away. Locking a phone or switching apps fires
// visibilitychange/pagehide; without this the debounce timer was killed first
// and the change was never sent.
function flushBeforeHide() {
  if (!db || !isDirty()) return;
  clearTimeout(_pushTimer);
  pushNow();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushBeforeHide(); });
window.addEventListener('pagehide', flushBeforeHide);
window.addEventListener('online', () => { if (isDirty()) { _retryDelay = 0; pushNow(); } });

async function remotePull() {
  if (!db) return;
  // An unsent local change outranks whatever the server holds — deliver it first,
  // otherwise adopting the server copy below would wipe it.
  if (isDirty()) { await pushNow(); if (isDirty()) return; }
  try {
    const { data, error } = await db.from('app_state').select('data').eq('building', BUILDING).maybeSingle();
    if (error) throw error;
    if (data && data.data && Object.keys(data.data).length) {
      applyRemote(data.data);
    } else {
      await pushNow();         // server empty → seed it with what this device has
    }
    hideStorageWarn();
  } catch (e) {
    showStorageWarn('Cannot reach the server (' + (e.message || e) + '). Showing this device\'s saved copy.');
  }
}

// Adopt state coming from the server (initial pull or a live update from another device).
function applyRemote(saved) {
  const serialized = JSON.stringify(saved);
  if (serialized === _lastRemoteJSON) return;   // this is our own write echoing back
  // Never discard a change this device has not delivered yet; send ours instead.
  if (isDirty()) { pushNow(); return; }
  _lastRemoteJSON = serialized;
  const keepTab = state.tab;
  state = { ...state, ...saved, tab: keepTab, pendingCover: null, editingUnit: null, editingArea: null, editingEmp: null };
  if (state.coverageDay !== todayKey()) { state.coverage = {}; state.unitCover = {}; state.pendingCover = null; state.coverageDay = todayKey(); }
  finalizeState();
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  route();
}

function subscribeRealtime() {
  if (!db) return;
  db.channel('app_state_' + BUILDING)
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'app_state', filter: 'building=eq.' + BUILDING },
        (payload) => { if (payload.new && payload.new.data) applyRemote(payload.new.data); })
    .subscribe();
}

// The "save failed" banner (styled but previously never shown).
function showStorageWarn(msg) {
  let el = document.getElementById('storageWarn');
  if (!el) {
    el = document.createElement('div');
    el.id = 'storageWarn';
    el.className = 'storage-warn';
    el.style.position = 'sticky'; el.style.top = '0'; el.style.zIndex = '60';
    document.body.insertBefore(el, document.body.firstChild);
  }
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
function hideStorageWarn() {
  const el = document.getElementById('storageWarn');
  if (el) el.style.display = 'none';
}

// ============================================================
// CLEANING HISTORY LOG  (append-only table in Supabase)
// ============================================================
let cleaningHistory = [];        // recent log rows, newest first
let lastCleanedByUnit = {};      // unit_id -> newest row (drives the "last cleaned" line)
let historyFilter = 'all';       // History view room filter (per-device UI state)
let historyDay = '';             // History view day filter ('' = all days)
let teamShowAll = false;         // Team tab: false = cleaners only (default once any tagged)
let teamFridayPer = 3;           // how many are in on each Friday, chosen in Team
const dayKeyLocal = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('en-CA'); }; // local YYYY-MM-DD

// dayKey lets a clean be recorded against the day it happened rather than the
// moment it was entered — the office often marks yesterday's work this morning.
// whoId names who actually did it. Without it a backdated entry gets stamped with
// today's assignment, which is the wrong person as soon as the crew rotates.
async function logClean(unit, dayKey, whoId) {
  if (!db) return null;
  const picked = (whoId && whoId !== 'office') ? (state.staff || []).find(p => p.id === whoId) : null;
  // Only fall back to the room's assignment when no name was given at all —
  // an explicit "Office" has to stay Office, not resolve to the floor's cleaner.
  const c = (picked || whoId === 'office') ? null : cleanerForUnit(unit);
  const cleanerId = picked ? picked.id : (c ? c.person.id : 'office');
  const cleanerName = picked ? picked.name : (c ? c.person.name : 'Office');
  // Midday avoids a timezone shift dragging the entry onto the wrong date.
  const when = (dayKey && dayKey !== todayKey())
    ? new Date(dayKey + 'T12:00:00').toISOString()
    : new Date().toISOString();
  try {
    const { data, error } = await db.from('cleaning_log')
      .insert({
        building: BUILDING,
        unit_id: unit.id,
        unit_label: unit.unit,
        cleaner_id: cleanerId,
        cleaner_name: cleanerName,
        cleaned_at: when,
      })
      .select('id')
      .single();
    if (error) throw error;
    refreshHistory();
    return data.id;
  } catch (e) {
    showStorageWarn('Could not log this cleaning to history (' + (e.message || e) + ').');
    return null;
  }
}

// Recording a past night writes a whole crew's work at once. One insert keeps it
// to a single round trip and a single history refresh instead of one of each per
// room, and the caller learns whether the write landed before it moves schedules.
async function logCleanMany(entries, dayKey) {
  if (!db || !entries.length) return false;
  const when = (dayKey && dayKey !== todayKey())
    ? new Date(dayKey + 'T12:00:00').toISOString()
    : new Date().toISOString();
  const rows = entries.map(({ u, who }) => {
    const picked = (who && who !== 'office') ? (state.staff || []).find(p => p.id === who) : null;
    return {
      building: BUILDING,
      unit_id: u.id,
      unit_label: u.unit,
      cleaner_id: picked ? picked.id : 'office',
      cleaner_name: picked ? picked.name : 'Office',
      cleaned_at: when,
    };
  });
  try {
    // Ask for the ids back so a caller that ticks many things at once can still
    // hold a history reference per row — without them, un-ticking one of them
    // would clear the checkmark and strand its entry in History.
    const { data, error } = await db.from('cleaning_log').insert(rows).select('id');
    if (error) throw error;
    refreshHistory();
    return (data || []).map((r) => r.id);
  } catch (e) {
    showStorageWarn('Could not log ' + rows.length + ' backdated cleaning' + (rows.length === 1 ? '' : 's') + ' (' + (e.message || e) + ').');
    return null;
  }
}

async function unlogClean(logId) {
  if (!db || !logId) return;
  try { await db.from('cleaning_log').delete().eq('id', logId); refreshHistory(); } catch (e) {}
}

async function refreshHistory() {
  if (!db) return;
  try {
    const { data, error } = await db.from('cleaning_log')
      .select('id,unit_id,unit_label,cleaner_id,cleaner_name,cleaned_at')
      .eq('building', BUILDING)
      .order('cleaned_at', { ascending: false })
      .limit(1000);
    if (error) throw error;
    cleaningHistory = data || [];
    const map = {};
    for (const row of cleaningHistory) { if (!map[row.unit_id]) map[row.unit_id] = row; } // first seen = newest
    lastCleanedByUnit = map;
    if (getMe()) render();
  } catch (e) {}
}

// ============================================================
// LEARN WHO USUALLY DOES WHAT
// A room can be tied to a cleaner (★ Usual), and once it is, the hand-out gives it
// back to that person every morning they are in. Setting them one room at a time is
// the reason almost nothing is tied: nobody taps forty rooms. The log already knows
// who has been doing what, so this reads it rather than asking.
//
// Only a clear pattern counts. Somebody who has done a room once, or half the time,
// is not "who does that room" — those stay in the pool and keep rotating.
// ============================================================
const LEARN_DAYS = 30;          // how far back to look
const LEARN_MIN_CLEANS = 3;     // fewer than this is not a pattern, it is a coincidence
const LEARN_SHARE = 0.6;        // and they must have done most of them

function learnUsualPlan(days) {
  const since = shiftDay(todayKey(), -(days || LEARN_DAYS));
  const staffById = {};
  (state.staff || []).forEach((s) => { staffById[s.id] = s; });
  const byName = {};
  (state.staff || []).forEach((s) => { byName[String(s.name).trim().toLowerCase()] = s; });

  // unit -> cleaner -> how many times
  const tally = {};
  (cleaningHistory || []).forEach((r) => {
    if (!r.unit_id || dayKeyLocal(r.cleaned_at) < since) return;
    // Older rows were written before cleaner_id was recorded; fall back to the name.
    const who = (r.cleaner_id && staffById[r.cleaner_id]) ? r.cleaner_id
      : (byName[String(r.cleaner_name || '').trim().toLowerCase()] || {}).id;
    if (!who) return;
    (tally[r.unit_id] = tally[r.unit_id] || {})[who] = (tally[r.unit_id][who] || 0) + 1;
  });

  const proposals = [], skipped = [];
  (state.servicedUnits || []).forEach((u) => {
    if (!onRollCall(u) || u.paused) return;
    const counts = tally[u.id];
    if (!counts) return;
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const [top] = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const n = counts[top];
    if (n < LEARN_MIN_CLEANS || n / total < LEARN_SHARE) { skipped.push({ u, reason: 'no clear pattern' }); return; }
    if (u.usualTo === top) return;                              // already theirs
    // A room nobody is cleared for is not a room to tie to them.
    if (!canCleanUnit(staffById[top], u)) { skipped.push({ u, reason: 'not cleared for it' }); return; }
    proposals.push({ u, who: top, name: (staffById[top] || {}).name || top, n, total, was: u.usualTo || null });
  });
  proposals.sort((a, b) => String(a.u.unit).localeCompare(String(b.u.unit), undefined, { numeric: true }));
  return { proposals, skipped, days: days || LEARN_DAYS };
}

function applyLearnedUsuals(plan) {
  plan.proposals.forEach((p) => { p.u.usualTo = p.who; });
  save();
}

function learnUsualCleaners() {
  const plan = learnUsualPlan(LEARN_DAYS);
  if (!plan.proposals.length) {
    hikSyncMsg = { err: false, text: 'Nothing clear enough in the last ' + plan.days
      + ' days — no room has one person doing most of it.' };
    render(); return;
  }
  const byWho = {};
  plan.proposals.forEach((p) => { (byWho[p.name] = byWho[p.name] || []).push(p.u.unit); });
  const summary = Object.keys(byWho).sort()
    .map((nm) => nm.split(' ')[0] + ': ' + byWho[nm].join(', ')).join(' · ');
  const changing = plan.proposals.filter((p) => p.was).length;
  showConfirm(
    'Tie ' + plan.proposals.length + ' room' + (plan.proposals.length === 1 ? '' : 's') + ' to who does them?',
    summary + '. Taken from the last ' + plan.days + ' days of the log — each of these has one person doing '
      + 'most of the cleans. They will go back to that person every morning they are in, instead of being '
      + 'dealt out again.'
      + (changing ? ' ' + changing + ' of them are tied to somebody else at the moment and will change hands.' : '')
      + ' Rooms with no clear pattern are left in the pool to rotate as they do now.',
    () => { applyLearnedUsuals(plan); render(); },
    'Tie them',
    'safe'
  );
}

function subscribeHistory() {
  if (!db) return;
  db.channel('cleaning_log_' + BUILDING)
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'cleaning_log', filter: 'building=eq.' + BUILDING },
        () => refreshHistory())
    .subscribe();
}

// Friendly timestamp: "Today 2:30 PM", "Yesterday 9:05 AM", "Jul 14, 2:30 PM".
function fmtWhen(iso) {
  try {
    const d = new Date(iso);
    const now = new Date();
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'Today ' + time;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'Yesterday ' + time;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + time;
  } catch (e) { return iso; }
}

// ============================================================
// LOGIC
// ============================================================
function personFloors(p) {
  const parts = [];
  if (p.floors && p.floors.length) parts.push('Floors ' + p.floors.join(', '));
  if (p.special) parts.push(p.special.map(s => s==='ground'?'Ground':'Rooftop').join(' + '));
  return parts.join(' · ') || 'No assignment';
}
function gaps() {
  const out = [];
  STAFF.forEach(p => {
    if (state.attendance[p.id] === 'noshow' && p.floors && p.floors.length) {
      p.floors.forEach(f => { if (!state.coverage[f]) out.push({ person: p, floor: f }); });
    }
  });
  return out;
}
function suggestCover(floor) {
  const candidates = STAFF.filter(p =>
    (state.attendance[p.id]==='present' || state.attendance[p.id]==='late') && p.floors && p.floors.length);
  if (!candidates.length) return null;
  const load = {};
  candidates.forEach(p => load[p.id] = (p.floors||[]).length);
  Object.values(state.coverage).forEach(pid => { if (load[pid]!=null) load[pid]++; });
  candidates.sort((a,b) => load[a.id]-load[b.id]);
  return candidates[0];
}
function whoCleansFloor(floor) {
  if (state.coverage[floor]) {
    const c = STAFF.find(p => p.id===state.coverage[floor]);
    if (c) return { person: c, covering: true };
  }
  const owner = STAFF.find(p => (p.floors||[]).includes(floor));
  return owner ? { person: owner, covering: false } : null;
}

// ============================================================
// ACTIONS
// ============================================================
function cycleStatus(pid) {
  const cur = state.attendance[pid] || 'present';
  const next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
  state.attendance[pid] = next;

  if (next === 'noshow') {
    // Does this person own any serviced units (via their floors)?
    const affected = unitsOwnedBy(pid);
    if (affected.length) {
      const sug = suggestCoverPerson(pid);
      state.pendingCover = { absentId: pid, suggestId: sug ? sug.id : null };
    }
  } else {
    // Back to present/late/off — release any cover they were given and clear pending
    if (state.unitCover) {
      Object.keys(state.unitCover).forEach(uid => {
        const u = state.servicedUnits.find(x => x.id === uid);
        if (u && ownerOfFloor(floorOfUnit(u.unit))?.id === pid) delete state.unitCover[uid];
      });
    }
    if (state.pendingCover && state.pendingCover.absentId === pid) state.pendingCover = null;
  }
  save(); render();
}
// Apply the confirmed cover: all the absent person's units -> chosen covererer
function confirmCover(coverId) {
  const pc = state.pendingCover;
  if (!pc) return;
  if (!state.unitCover) state.unitCover = {};
  unitsOwnedBy(pc.absentId).forEach(u => { state.unitCover[u.id] = coverId; });
  state.coverageDay = todayKey();
  state.pendingCover = null;
  save(); render();
}
function dismissCover() { state.pendingCover = null; save(); render(); }
function assignCover(floor, pid) { state.coverage[floor]=pid; state.coverageDay=todayKey(); save(); render(); }
function toggleUnit(uid) { const k=uid+'::perm'; if(state.completions[k])delete state.completions[k];else state.completions[k]=true; save(); render(); }
function toggleZone(zid, freq) { const k=zid+'::'+freqKey(freq); if(state.completions[k])delete state.completions[k];else state.completions[k]=true; save(); render(); }
function toggleFloorExpand(fid) { state.expandedFloors[fid]=!state.expandedFloors[fid]; save(); render(); }
function setTab(t) { state.tab=t; _assignPick=null; save(); render(); }
function resetCompletions() { showConfirm('Reset all completion checkmarks?', 'Attendance and assignments are kept.', () => { state.completions={}; save(); render(); }); }

// --- Serviced unit actions ---
// Cleaning types, colour-coded.
const UNIT_TYPES = {
  airbnb:   { label: 'Airbnb',   color: '#dc2626' },
  office:   { label: 'Office',   color: '#0284c7' },
  building: { label: 'Building', color: '#15803d' },
};
const UNIT_TYPE_ORDER = ['airbnb', 'office', 'building'];
// Which kinds of room the morning roll call is about. Some kinds are run as a
// separate operation and only clutter it. No list set = all of them.
const onRollCall = (u) => !Array.isArray(state.rollCallTypes) || state.rollCallTypes.includes(unitType(u));
function toggleRollCallType(typeKey) {
  const cur = Array.isArray(state.rollCallTypes) ? state.rollCallTypes.slice() : UNIT_TYPE_ORDER.slice();

// Flip a whole group of rooms onto one schedule at once — one-by-one is painful

// Rooms on the same multi-day cadence that were all cleaned together stay locked
// together forever — 13 every-other-day rooms all land on the same morning, giving
// a 38-room day followed by a 25-room day. Spread them across the cycle instead.
// Only ever DELAYS a room (one longer gap, once); never pulls a clean forward.
function balancePlan(ids) {
  const byFreq = {};
  (state.servicedUnits || []).forEach(u => {
    if (!ids.includes(u.id)) return;
    const n = FREQ_DAYS[u.freq] || 1;
    if (n > 1) (byFreq[u.freq] = byFreq[u.freq] || []).push(u);
  });
  const plan = [];
  Object.keys(byFreq).forEach(f => {
    const n = FREQ_DAYS[f];
    // Sorted by room number, so the split falls on floor boundaries — "lower floors
    // one day, upper floors the next" is something the crew can actually remember.
    const list = byFreq[f].slice().sort((a, b) =>
      String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
    list.forEach((u, i) => {
      const bucket = Math.floor(i * n / list.length);   // contiguous blocks, 0..n-1
      if (!bucket) return;                              // first block keeps its date
      const base = lastCleanDate(u);
      if (!base) return;                                // never cleaned → already due, nothing to spread
      if (dueShift(u) === bucket) return;             // already spread this way
      plan.push({ u, base, shift: bucket });
    });
  });
  return plan;
}
// ============================================================
// LEVEL THE WEEK
// Thirteen rooms tomorrow and twenty-four the day after is the same fortnight's
// work either way, but the heavy day cannot actually be finished and the light one
// wastes a crew. balancePlan below splits each frequency group into equal blocks by
// room number, which evens out that group in isolation and says nothing about what
// the day as a whole ends up carrying — the every-other-day split can land squarely
// on the day the weeklies already fall.
//
// This works from the projection the week-ahead view shows, so what gets levelled is
// the number the office is actually looking at, and it picks each room's place in
// its own cycle to flatten the daily totals.
//
// It only ever moves a clean EARLIER, never later — the same rule the rest of the
// scheduling keeps. Nothing waits longer than its frequency to be cleaned; a room
// simply takes its next turn a day or two sooner, and carries on from there.
// ============================================================
const LEVEL_HORIZON = 14;

// The projected count for each of the next n days as the schedule stands.
function projectedCounts(horizon) {
  const counts = {};
  projectDueDays(horizon).forEach((d) => { counts[d.day] = d.due.length; });
  return counts;
}

// Work out where each room would sit to make the days come out even. Returns the
// moves and the before/after shape, without touching anything.
function levelPlan(horizon) {
  const span = horizon || LEVEL_HORIZON;
  const start = workToday();
  const days = [];
  for (let i = 0; i < span; i += 1) days.push(shiftDay(start, i));
  const idx = {};
  days.forEach((d, i) => { idx[d] = i; });

  const before = projectedCounts(span);
  const walk = projectDueDays(span);
  const firstDueIdx = {};      // room -> the day it is next due, as an offset
  walk.forEach((d, i) => d.due.forEach((u) => { if (firstDueIdx[u.id] === undefined) firstDueIdx[u.id] = i; }));

  const units = (state.servicedUnits || []).filter((u) => !u.paused && onRollCall(u));
  const load = new Array(span).fill(0);
  const movable = [];
  units.forEach((u) => {
    const n = FREQ_DAYS[u.freq] || 1;
    const from = firstDueIdx[u.id];
    // A daily room is on every day whatever we do, and a room not due inside the
    // horizon has nothing to place. Both are fixed load to work around.
    if (n <= 1 || from === undefined) {
      if (from !== undefined) for (let i = from; i < span; i += n) load[i] += 1;
      return;
    }
    movable.push({ u, n, from });
  });

  // Fewest choices first: an every-other-day room can only sit on one of two days,
  // so it must pick before a weekly that can go anywhere fits itself around it.
  movable.sort((a, b) => (a.n - b.n)
    || String(a.u.unit).localeCompare(String(b.u.unit), undefined, { numeric: true }));

  const moves = [];
  movable.forEach((m) => {
    // A room already due today is the hard case, and the common one: when every
    // every-other-day room falls due together there is no earlier day to move any of
    // them to, so nothing can prise them apart. It is going to be cleaned today
    // whatever happens, so the way to split the clump is an EXTRA clean on the
    // opposite day — one more clean, once, after which the room runs on its new day
    // for good. Nothing is ever delayed to tidy the schedule.
    // Two ways to move a room, and never a third: bring its next turn FORWARD, or
    // leave that turn where it is and give it one EXTRA clean later in the cycle.
    // Nothing is ever held back. The extra clean is what prises apart a clump that
    // is due now — there is no earlier day to move any of them to, so the only way
    // to break it up is to clean some of them twice, once, and let them carry on
    // from the opposite day thereafter.
    const cands = [];
    for (let at = Math.min(1, m.from); at <= m.from; at += 1) cands.push({ at, kind: 'earlier', keep: [] });
    for (let at = m.from + 1; at <= m.from + m.n - 1 && at < span; at += 1) cands.push({ at, kind: 'extra', keep: [m.from] });

    const inSeries = (i, at) => i >= at && (i - at) % m.n === 0;
    let best = { at: m.from, kind: 'earlier', keep: [] }, bestCost = Infinity;
    cands.forEach((c) => {
      let peak = 0, sq = 0;
      for (let i = 0; i < span; i += 1) {
        const v = load[i] + ((inSeries(i, c.at) || c.keep.includes(i)) ? 1 : 0);
        if (v > peak) peak = v;
        sq += v * v;
      }
      // Flatten the worst day first, then the shape as a whole. An extra clean is
      // real work, so it has to beat staying put outright rather than merely tie.
      const cost = peak * 10000 + sq + (c.kind === 'extra' ? 1 : 0);
      if (cost < bestCost - 1e-9) { bestCost = cost; best = c; }
    });

    best.keep.forEach((i) => { if (!inSeries(i, best.at)) load[i] += 1; });
    for (let i = best.at; i < span; i += m.n) load[i] += 1;
    if (best.at !== m.from) {
      moves.push({ u: m.u, from: days[m.from], to: days[best.at], freq: m.u.freq, kind: best.kind });
    }
  });

  const after = {};
  days.forEach((d, i) => { after[d] = load[i]; });
  const nums = days.map((d) => after[d]);
  // The first days of the horizon carry work that is already due and is never
  // delayed, so they cannot be lightened and judging the result by them hides a
  // real fix: a clump due tomorrow still lands tomorrow, whatever we do about the
  // fortnight after it. The settled half is where levelling shows up.
  const tail = Math.floor(span / 2);
  return {
    days, moves, before, after,
    peakBefore: Math.max(...days.map((d) => before[d] || 0)),
    peakAfter: Math.max(...nums),
    lowBefore: Math.min(...days.map((d) => before[d] || 0)),
    lowAfter: Math.min(...nums),
    settledBefore: Math.max(...days.slice(tail).map((d) => before[d] || 0)),
    settledAfter: Math.max(...nums.slice(tail)),
    settledLowAfter: Math.min(...nums.slice(tail)),
  };
}

// Apply a levelling. A room takes its next turn earlier by being given that day
// outright — the same one-off extra clean the clump-splitter uses, which lapses the
// moment it is done and leaves the room running on its new day for good.
function applyLevelPlan(plan) {
  plan.moves.forEach((m) => { m.u.alsoCleanOn = m.to; delete m.u.holdUntil; });
  save();
}

function balanceUnitsAcrossDays(ids, groupLabel) {
  const plan = balancePlan(ids);
  if (!plan.length) return;
  // Preview the resulting spread so the trade is visible before committing.
  const moved = {};
  plan.forEach(p => {
    const d = shiftDay(p.base, (FREQ_DAYS[p.u.freq] || 1) + p.shift);
    moved[d] = (moved[d] || 0) + 1;
  });
  const spread = Object.keys(moved).sort()
    .map(d => `${moved[d]} to ${new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`)
    .join(', ');
  showConfirm(
    `Spread ${plan.length} room${plan.length === 1 ? '' : 's'} onto later days?`,
    `Applies to ${groupLabel}. Moves ${spread}, so the same work lands evenly instead of all on one morning. No room is cleaned sooner than its schedule — each moved room just waits one extra day, once.`,
    () => {
      plan.forEach(p => { p.u.cycleShift = p.shift; p.u.cycleShiftFrom = p.base; });
      save(); render();
    },
    'Spread them out',
    'safe'
  );
}

// Record a whole group as cleaned (or not) in one go — at the end of a day where

function setUnitsLastCleanedBulk(ids, dayKey, groupLabel, whoId) {
  const changing = (state.servicedUnits || []).filter(u => ids.includes(u.id) && (u.lastCleaned || null) !== dayKey).length;

    `Mark ${changing} room${changing === 1 ? '' : 's'} ${what}?`,
    `Applies to ${groupLabel} only. Their next clean is scheduled from this date.`,
    () => {
      (state.servicedUnits || []).forEach(u => {
        if (!ids.includes(u.id)) return;
        const was = u.lastCleaned || null;
        u.lastCleaned = dayKey || null;
        stampCleanedBy(u, dayKey, whoId);
        if (dayKey && dayKey !== was) logClean(u, dayKey, whoId);   // record it, don't just reschedule
      });

    dayKey ? 'Mark ' + what : 'Clear',
    'safe'
  );
}

// --- Record a past day -------------------------------------------------------
// Last night's work gets entered the next morning. Ticking rooms off "today" puts
// the whole night on the wrong date and credits whoever happens to be assigned
// now, so past days get their own sheet: pick the day, and the only names offered
// are the people who actually badged in on it.
let _backdate = null;   // { day, loading, failed, arrivals, picks, chosen, type, warn, saving }
let _backdateSeq = 0;   // a slow day-load must not land after you've moved to another day

function openBackdate(day) {

                picks: {}, chosen: {}, type: 'all', warn: '', saving: false };
  render();

}
function closeBackdate() { _backdate = null; render(); }
function setBackdateDay(day) {
  if (!_backdate || !day || day > todayKey()) return;   // no attendance exists for a day that hasn't happened
  _backdate.day = day; _backdate.loading = true; _backdate.warn = '';
  _backdate.picks = {}; _backdate.chosen = {};          // another day is another crew — start the names over
  render();
  loadBackdateDay();
}
function setBackdateType(t) { if (_backdate) { _backdate.type = t; _backdate.warn = ''; render(); } }
async function loadBackdateDay() {
  const b = _backdate; if (!b) return;
  const token = ++_backdateSeq;
  const res = await arrivalsForDay(b.day);
  if (_backdate !== b || token !== _backdateSeq) return;   // day changed (or sheet closed) mid-read
  b.arrivals = res ? res.arrivals : {};
  b.failed = !res;
  b.loading = false;
  render();
}

function backdateRooms() {
  const b = _backdate; if (!b) return [];
  return (state.servicedUnits || [])
    .filter(u => b.type === 'all' || unitType(u) === b.type)
    .slice()
    .sort((x, y) => String(x.unit).localeCompare(String(y.unit), undefined, { numeric: true }));
}
// Already in History for that day — offering it again would double-count the room.
const loggedOnDay = (unitId, day) => cleaningHistory.some(r => r.unit_id === unitId && dayKeyLocal(r.cleaned_at) === day);
// Who could have cleaned this room that day: badged in, and cleared for the kind.
function cleanersPresentFor(u, arrivals) {
  return cleaningStaff().filter(p => arrivals[p.id] && canCleanUnit(p, u));
}
// Best guess at the name, drawn from that day's crew — never from today's assignment.
// Their usual room comes first, then the floor's owner; today's override is the
// weakest signal because auto-assign rewrites it every morning. No clear answer
// returns nothing, so the office picks rather than the app inventing a name.
function defaultCleanerFrom(u, arrivals) {
  const cands = cleanersPresentFor(u, arrivals);
  if (!cands.length) return '';
  const among = (id) => id ? cands.find(p => p.id === id) : null;
  const owner = ownerOfFloor(floorOfUnit(u.unit));
  const pick = among(u.usualTo) || (owner && among(owner.id)) || among(u.assignedTo)
            || (cands.length === 1 ? cands[0] : null);
  return pick ? pick.id : '';
}
const backdateCandidates = (u) => (_backdate ? cleanersPresentFor(u, _backdate.arrivals) : []);
const backdatePick = (u) => (_backdate.picks[u.id] !== undefined ? _backdate.picks[u.id] : defaultCleanerFrom(u, _backdate.arrivals));

// Jump in from a room group: the day picker still rules, but the group arrives
// ticked so a whole night is a couple of taps.
function openBackdateForType(typeKey, day) {
  openBackdate(day);
  _backdate.type = typeKey;
  backdateSelectAll(true);
}
// One room, one tap. The name comes from that day's badge-ins; when the day's crew
// doesn't point at one person, open the sheet instead of guessing.
async function markCleanedOn(id, day) {
  const u = (state.servicedUnits || []).find(x => x.id === id);
  if (!u) return;
  const res = await arrivalsForDay(day);
  const who = res ? defaultCleanerFrom(u, res.arrivals) : '';
  if (!who) {
    openBackdate(day);
    _backdate.type = unitType(u);
    _backdate.chosen[u.id] = true;

  }

function backdateSelectAll(on) {
  const b = _backdate; if (!b) return;
  backdateRooms().forEach(u => { if (!loggedOnDay(u.id, b.day)) b.chosen[u.id] = on; });
  b.warn = '';
  render();
}

async function saveBackdate() {
  const b = _backdate; if (!b || b.saving) return;
  const rooms = backdateRooms().filter(u => b.chosen[u.id] && !loggedOnDay(u.id, b.day));
  if (!rooms.length) { b.warn = 'Tick the rooms that were cleaned first.'; render(); return; }
  // Logging an unnamed room as "Office" would quietly credit nobody for a night's
  // work, so stop and ask rather than guess.
  const missing = rooms.filter(u => !backdatePick(u));
  if (missing.length) {
    b.warn = missing.length + (missing.length === 1 ? ' room still needs a name: ' : ' rooms still need a name: ')
           + missing.slice(0, 4).map(u => u.unit).join(', ') + (missing.length > 4 ? '…' : '');
    render(); return;
  }
  const day = b.day;
  const entries = rooms.map(u => ({ u, who: backdatePick(u) }));
  b.saving = true; render();
  const ok = await logCleanMany(entries, day);
  if (!ok) { if (_backdate === b) { b.saving = false; b.warn = 'Nothing was saved — try again.'; render(); } return; }
  entries.forEach(({ u, who }) => {
    const was = u.lastCleaned || null;
    // Never drag a schedule backwards: a room cleaned again since that night is
    // still due from the later clean. The name only moves with the date — crediting
    // that night's cleaner for a later clean they didn't do would be worse than
    // leaving the newer name in place.
    if (!was || day > was) { u.lastCleaned = day; stampCleanedBy(u, day, who); }
  });
  save();
  _backdate = null;
  // Land on that day in History — seeing the entries is the only real confirmation
  // that the night was recorded.
  historyDay = day; historyFilter = 'all'; state.tab = 'history';
  render();
}

let _assignPick = null;   // {unitId} while the "who should take this?" picker is open
const assignConfirmedToday = (u) => (state.assignConfirmed || {})[u.id] === todayKey();

// Put every room back the way it was before the last auto-assign, including who
// had already been signed off.
// Take the whole morning back off its cleaners in one go. Undo already covers the
// last auto-assign, but only while it is still the last thing that happened; this
// works any time — the usual reason being that the crew who turned up is not the
// crew the board was built for, so it is easier to start again than to move a
// dozen rooms one at a time. A permanent cleaner is a standing decision made in
// Settings rather than a hand-out for the morning, so those rooms keep their person.
function unassignAllRooms() {
  const rooms = (state.servicedUnits || []).filter((u) =>
    onRollCall(u) && onTodaysList(u) && u.assignedTo && !u.usualTo);
  if (!rooms.length) return;
  const signed = rooms.filter((u) => assignConfirmedToday(u)).length;
  const kept = (state.servicedUnits || []).filter((u) =>
    onRollCall(u) && onTodaysList(u) && u.assignedTo && u.usualTo).length;
  showConfirm(
    'Put all ' + rooms.length + ' rooms back in the pool?',
    'They all come off their cleaner' + (signed ? ', including ' + signed + ' already checked' : '')
      + ', ready to hand out again.'
      + (kept ? ' ' + kept + ' room' + (kept === 1 ? ' with a permanent cleaner keeps' : 's with a permanent cleaner keep') + ' that person.' : '')
      + ' You can undo it afterwards.',
    () => runUnassignAll(rooms),
    'Put back in pool',
    'safe'
  );
}

function runUnassignAll(rooms) {
  // Same snapshot the auto-assign undo reads, so one Undo covers whichever bulk
  // change to the board happened last.
  state.lastAutoAssign = {
    at: new Date().toISOString(),
    kind: 'unassign',
    who: rooms.reduce((m, u) => { m[u.id] = u.assignedTo || null; return m; }, {}),
    confirmed: rooms.reduce((m, u) => { if (state.assignConfirmed[u.id]) m[u.id] = state.assignConfirmed[u.id]; return m; }, {}),
  };
  rooms.forEach((u) => { u.assignedTo = null; delete state.assignConfirmed[u.id]; });
  hikSyncMsg = { text: rooms.length + ' room' + (rooms.length === 1 ? ' is' : 's are') + ' back in the pool.' };
  save(); render();
}

function undoAutoAssign() {
  const snap = state.lastAutoAssign;
  if (!snap) return;
  Object.keys(snap.who).forEach((id) => {
    const u = (state.servicedUnits || []).find((x) => x.id === id);
    if (!u) return;
    u.assignedTo = snap.who[id];
    if (snap.confirmed[id]) state.assignConfirmed[id] = snap.confirmed[id];
    else delete state.assignConfirmed[id];
  });
  state.lastAutoAssign = null;
  hikSyncMsg = { text: 'Put the assignments back as they were.' };
  save(); render();
}
const lastBoardChangeLabel = () => (state.lastAutoAssign && state.lastAutoAssign.kind === 'unassign')
  ? '↩ Undo putting them back' : '↩ Undo auto-assign';
// Hand the rooms out on their own once the crew starts badging in, so the morning
// works without anyone remembering to press anything. Deliberately conservative:
// it runs once a day, only when NOTHING has been handed out yet, so it can never
// overwrite a decision the office already made. Everything it does still needs a
// yes/no, and Undo is there — it is a starting point, not a verdict.
// Keep the week level on its own. Rooms cleaned together come due together, so
// left alone the every-other-day rooms re-stack onto a single morning — 38 rooms
// one day, 25 the next. This spreads them the moment that starts happening.
// Only ever delays a room; a clean is never pulled forward.
function maybeBalanceSchedule() {
  if (state.autoBalance === false) return;
  const ids = (state.servicedUnits || []).map((u) => u.id);
  const upcoming = {};
  (state.servicedUnits || []).forEach((u) => {
    const d = nextDueDate(u); if (d) upcoming[d] = (upcoming[d] || 0) + 1;
  });
  const days = Object.keys(upcoming).sort().slice(0, 4);
  if (!days.length) return;
  const peak = Math.max(...days.map((d) => upcoming[d]));
  const low = Math.min(...days.map((d) => upcoming[d]));
  // One day carrying several more than another is the pile-up worth fixing; a
  // difference of one or two is just how the rooms fall.
  if (days.length > 1 && peak - low <= 2) return;
  const plan = balancePlan(ids);
  if (!plan.length) return;
  plan.forEach((p) => { p.u.cycleShift = p.shift; p.u.cycleShiftFrom = p.base; });
  save();
}
// Carry a plan made for today into this morning. Planning tomorrow last night and
// then watching the roll call deal the rooms out again from scratch makes the
// planning pointless, so a planned hand-out is honoured rather than recomputed.
// Only for people who actually turned up: somebody who isn't in can't clean, so
// their rooms fall through to be dealt with the rest.
function applyPlannedAssignments() {
  const day = todayKey();
  const plan = (state.plans || {})[day];
  const out = { carried: 0, absent: 0, load: {}, slotLoad: { early: {}, late: {} } };
  if (!plan) return out;
  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const staffById = {};
  (state.staff || []).forEach((s) => { staffById[s.id] = s; });

  Object.keys(plan).forEach((k) => {
    const j = plan[k];
    if (j.kind !== 'unit' || !j.assignedTo) return;
    const u = unitById[j.refId];
    if (!u || !onRollCall(u) || !unitDueToday(u) || u.assignedTo) return;
    if (!hikArrivals[j.assignedTo]) { out.absent += 1; return; }   // planned for, not in
    if (!canCleanUnit(staffById[j.assignedTo], u)) return;
    u.assignedTo = j.assignedTo;
    // Planned the night before is a decision, not a suggestion awaiting a yes/no.
    state.assignConfirmed[u.id] = day;
    out.carried += 1;
    out.load[j.assignedTo] = (out.load[j.assignedTo] || 0) + 1;
    const slot = timeSlot(u);
    if (slot !== 'any') out.slotLoad[slot][j.assignedTo] = (out.slotLoad[slot][j.assignedTo] || 0) + 1;
  });
  return out;
}

function maybeAutoAssign() {
  if (state.autoAssign === false) return;                      // switched off in Settings
  if (state.autoAssignedOn === todayKey()) return;             // already done today
  const people = Object.keys(hikArrivals).filter((id) => (state.staff || []).some((s) => s.id === id));
  if (!people.length) return;                                  // nobody in yet — wait
  const due = (state.servicedUnits || []).filter((u) => onRollCall(u) && unitDueToday(u));
  if (!due.length) return;
  const officeGotThereFirst = due.some((u) => u.assignedTo);
  const carried = applyPlannedAssignments();                   // last night's plan wins over a fresh deal
  if (officeGotThereFirst) {                                   // office got there first; don't touch the rest
    state.autoAssignedOn = todayKey(); save(); return;
  }
  state.autoAssignedOn = todayKey();
  maybeBalanceSchedule();   // level the week before handing today's rooms out
  const rest = due.filter((u) => !u.assignedTo);
  if (!rest.length) { save(); render(); return; }              // the plan covered the whole morning
  // Deal only what the plan didn't cover, counting the carried rooms against their
  // cleaners so the split stays even across the morning as a whole.
  autoAssignRooms(rest, carried.load, carried.slotLoad);
}

// One-tap auto-assign:
//   1. Rooms with a "usual" cleaner who clocked in → keep that same person (Airbnb stays with its crew).
//   2. Remaining rooms, priority ⭐ first, go to the earliest-arriving cleaners.
//   3. Everything balances so no one is overloaded.
// onlyRooms limits the deal to part of the morning — used when last night's plan has
// already covered the rest. loadSeed/slotSeed carry what those cleaners are holding
// from the plan, so a partial deal still balances against the whole morning.
function autoAssignRooms(onlyRooms, loadSeed, slotSeed) {
  const people = Object.keys(hikArrivals)
    .filter((id) => (state.staff || []).some((s) => s.id === id))
    .map((id) => ({ id, raw: hikArrivals[id].raw }))
    .sort((a, b) => String(a.raw || '').localeCompare(String(b.raw || '')));   // earliest badge-in first
  if (!people.length) { hikSyncMsg = { err: true, text: 'No one clocked in to assign rooms to.' }; render(); return; }
  const inIds = new Set(people.map((p) => p.id));
  const load = {}; people.forEach((p) => { load[p.id] = (loadSeed && loadSeed[p.id]) || 0; });

  const pool = onlyRooms || (state.servicedUnits || []).filter((u) => onRollCall(u) && unitDueToday(u));
  const rooms = pool.slice().sort((a, b) =>   // due today, of the kinds roll call covers
    (slotRank(a) - slotRank(b))                            // 🌅 early-preference rooms first → earliest arrivals
    || (b.priority ? 1 : 0) - (a.priority ? 1 : 0)                               // then priority ⭐ rooms
    || String(a.time || '~').localeCompare(String(b.time || '~'))               // then earliest scheduled time
    || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  if (!rooms.length) { hikSyncMsg = { err: true, text: 'No rooms are due for cleaning today.' }; render(); return; }

  // Nothing handed out yet is the normal morning — don't make the common case
  // pay for a confirm. Only ask when there is real work to lose.
  const held = rooms.filter((u) => u.assignedTo);
  const signed = held.filter((u) => assignConfirmedToday(u)).length;
  if (held.length) {
    showConfirm(
      `Reassign all ${rooms.length} rooms?`,
      `${held.length} ${held.length === 1 ? 'is' : 'are'} already handed out`
        + (signed ? `, ${signed} of them checked` : '')
        + `. This shuffles them all again — rooms with a permanent cleaner stay with that person. You can undo it afterwards.`,
      () => runAutoAssign(rooms, people, inIds, load, slotSeed),
      'Reassign',
      'safe'
    );
    return;
  }
  runAutoAssign(rooms, people, inIds, load, slotSeed);
}

function runAutoAssign(rooms, people, inIds, load, slotSeed) {
  // Snapshot before reshuffling. Auto-assign silently discards a morning of manual
  // assignments, and it sits one mis-tap away from the room list, so it needs to be
  // reversible rather than merely careful.
  state.lastAutoAssign = {
    at: new Date().toISOString(),
    who: rooms.reduce((m, u) => { m[u.id] = u.assignedTo || null; return m; }, {}),
    confirmed: rooms.reduce((m, u) => { if (state.assignConfirmed[u.id]) m[u.id] = state.assignConfirmed[u.id]; return m; }, {}),
  };
  // Start fresh: every room it hands out is a new suggestion awaiting a yes/no,
  // so any earlier sign-off for today is void.
  rooms.forEach((u) => { u.assignedTo = null; delete state.assignConfirmed[u.id]; });

  const order = people.map((p) => p.id);   // clocked-in ids, earliest arrival first
  const staffById = {};
  for (const s of (state.staff || [])) staffById[s.id] = s;
  // Nobody gets handed a kind of room they aren't cleared for — a trainee kept off
  // offices must stay off them however the room reaches them.
  const ableFor = (u) => order.filter((id) => canCleanUnit(staffById[id], u));
  // Rotation: don't hand a room straight back to whoever cleaned it last time, so
  // nobody spends every morning on the same patch. Kept as a TIE-BREAK, never ahead
  // of load — an even split is the thing that was actually asked for, and rotation
  // that unbalances the morning to achieve variety would be a worse deal. With most
  // days tying on load anyway, this is what decides them.
  const repeats = (id, u) => (u.lastCleanedBy && id === u.lastCleanedBy) ? 1 : 0;
  const bestFor = (u, pool) => (pool || ableFor(u)).slice().sort((a, b) =>
    (load[a] - load[b])
    || (repeats(a, u) - repeats(b, u))
    || (order.indexOf(a) - order.indexOf(b)))[0] || null;
  const lightestFor = (u) => bestFor(u);

  // Pass 1: rooms with a time the customer asked for. Handing every morning room to
  // whoever badged in first is how one person ends up with a wall of them and can't
  // physically get them all done before lunch — which is the complaint the early flag
  // exists to prevent. So they are dealt round the crew: fewest morning rooms so far
  // wins, and arrival order only breaks the tie. The earliest in still get the first
  // ones, but once everyone has had one it comes round again, and everybody ends up
  // with a mixture of asked-for and ordinary rooms rather than one lopsided round.
  const slotLoad = { early: {}, late: {} };
  people.forEach((p) => {
    // Seeded with any asked-for rooms already carried in from the plan, so a partial
    // deal doesn't hand somebody a second helping of the early round.
    slotLoad.early[p.id] = (slotSeed && slotSeed.early && slotSeed.early[p.id]) || 0;
    slotLoad.late[p.id] = (slotSeed && slotSeed.late && slotSeed.late[p.id]) || 0;
  });
  const spreadSlot = (slot) => {
    rooms.filter((u) => !u.assignedTo && timeSlot(u) === slot).forEach((u) => {
      const pick = ableFor(u).sort((a, b) =>
        (slotLoad[slot][a] - slotLoad[slot][b])          // nobody carries them all
        || (load[a] - load[b])                            // then whoever has least overall
        || (repeats(a, u) - repeats(b, u))                // then not the same person as last time
        || (order.indexOf(a) - order.indexOf(b)))[0];     // then whoever got here first
      if (pick) { u.assignedTo = pick; load[pick]++; slotLoad[slot][pick]++; }
    });
  };
  spreadSlot('early');
  spreadSlot('late');
  // Pass 2: remaining rooms keep their usual cleaner if that person clocked in.
  let kept = 0;
  rooms.forEach((u) => {
    if (!u.assignedTo && u.usualTo && inIds.has(u.usualTo) && canCleanUnit(staffById[u.usualTo], u)) {
      u.assignedTo = u.usualTo; load[u.usualTo]++; kept++;
    }
  });
  // Pass 3: keep a room with whoever owns its floor, if they clocked in. Floors are
  // already how the building is divided up, and a cleaner working one floor walks a
  // lot less than one chasing rooms across eleven of them.
  let onFloor = 0;
  rooms.forEach((u) => {
    if (u.assignedTo) return;
    const owner = ownerOfFloor(floorOfUnit(u.unit));
    if (owner && inIds.has(owner.id) && canCleanUnit(owner, u)) { u.assignedTo = owner.id; load[owner.id]++; onFloor++; }
  });
  // Pass 4: rooms on a floor a TEAM owns go to that team, spread across whichever
  // of its members clocked in. The leader answers for the zone; the app just keeps
  // the work inside the right team rather than scattering it building-wide.
  let onTeam = 0;
  rooms.forEach((u) => {
    if (u.assignedTo) return;
    const t = teamOfFloor(floorOfUnit(u.unit));
    if (!t) return;
    const mates = teamMembers(t.name).filter((p) => inIds.has(p.id) && canCleanUnit(p, u));
    if (!mates.length) return;                    // nobody from that team in today who can take it
    const pick = mates.slice().sort((a, b) =>
      ((load[a.id] || 0) - (load[b.id] || 0))
      || (repeats(a.id, u) - repeats(b.id, u))
      || (order.indexOf(a.id) - order.indexOf(b.id)))[0];
    u.assignedTo = pick.id; load[pick.id]++; onTeam++;
  });
  // Pass 5: whatever is left goes to whoever's carrying the fewest (earliest breaks ties).
  let unstaffed = 0;
  rooms.filter((u) => !u.assignedTo).forEach((u) => {
    const pick = lightestFor(u);
    if (pick) { u.assignedTo = pick; load[pick]++; } else unstaffed++;   // nobody in today is cleared for it
  });
  // Pass 6: even it out. Keeping a cleaner on their own floor or inside their team's
  // zone saves a lot of walking, but those are preferences, not promises — left to
  // themselves they hand one person five rooms while four others carry two, because
  // ownership is decided before anything counts the load. So whatever is still
  // lopsided gets moved: rooms with a permanent cleaner stay put, and so do rooms the
  // customer asked a time for, since both were somebody's deliberate decision.
  // A room the customer asked a time for never moves — that is the customer's call,
  // not a load-balancing decision. A room with a permanent cleaner moves only as a
  // last resort, once nothing else can close the gap: most rooms here have picked up
  // a permanent cleaner simply by being assigned by hand once, and left absolute they
  // freeze the whole morning into whatever shape it drifted into.
  const freeToMove = (u) => !u.usualTo && timeSlot(u) === 'any';
  const pinnedButMovable = (u) => !!u.usualTo && timeSlot(u) === 'any';
  let moved = 0, unpinned = 0;
  for (let guard = rooms.length * 4; guard > 0; guard -= 1) {
    const ranked = order.slice().sort((a, b) => load[a] - load[b]);
    const hi = ranked[ranked.length - 1];
    if (load[hi] - load[ranked[0]] <= 1) break;             // as even as it can get
    let done = false;
    // Unpinned rooms first, everywhere they can help, before disturbing any pin.
    for (const pass of [freeToMove, pinnedButMovable]) {
      for (const lo of ranked) {
        if (load[hi] - load[lo] <= 1) break;
        const cands = rooms.filter((u) => u.assignedTo === hi && pass(u) && canCleanUnit(staffById[lo], u));
        // Of the rooms that could move, shift one this person didn't clean last time.
        const move = cands.find((u) => !repeats(lo, u)) || cands[0];
        if (!move) continue;
        move.assignedTo = lo; load[hi] -= 1; load[lo] += 1; moved += 1;
        if (pass === pinnedButMovable) unpinned += 1;
        done = true; break;
      }
      if (done) break;
    }
    if (!done) break;                                        // nothing left that can legally move
  }

  const notes = [];
  if (moved) notes.push(`${moved} moved to even it out${unpinned ? ` (${unpinned} off their usual cleaner)` : ''}`);
  if (kept) notes.push(`${kept} kept with their usual crew`);
  if (onFloor) notes.push(`${onFloor} kept on their own floor`);
  if (onTeam) notes.push(`${onTeam} kept in their team's zone`);
  if (unstaffed) notes.push(`${unstaffed} left unassigned — nobody in today is cleared for them`);
  hikSyncMsg = { text: `Suggested ${rooms.length} rooms for ${people.length} cleaners${notes.length ? ` (${notes.join(', ')})` : ''} — check each one below.` };
  save(); render();
}

let hikSyncMsg = null;
