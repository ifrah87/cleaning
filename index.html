<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f7fb">
<meta name="apple-mobile-web-app-title" content="Cleaning">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Cleaning Ops</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #f4f7fb;
    color: #15202e;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; font-size: 16px; }
  ::-webkit-scrollbar { display: none; }

  /* Brand palette
     navy   #0284c7   teal #0284c7   teal-soft #e3f2f4
     ink    #15202e   slate #5f7189  line #e7ecf3
     green  #15803d   amber #b45309  red #dc2626
  */

  #app { min-height: 100vh; padding-bottom: 78px; }

  .header {
    background: linear-gradient(180deg, #ffffff 0%, #eef2f8 100%);
    color: #15202e;
    padding: 18px 16px 16px;
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid #e7ecf3;
    box-shadow: 0 1px 3px rgba(15,40,80,0.06);
  }
  .h-eyebrow { font-size: 10px; letter-spacing: 0.18em; color: #5f7189; font-weight: 600; margin-bottom: 3px; }
  .h-title { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; color: #0f1a27; }
  .h-date { font-size: 11px; color: #5f7189; margin-top: 3px; font-weight: 500; }

  .stats { display: flex; gap: 8px; margin-top: 14px; }
  .stat {
    background: #eef2f8; border: 1px solid #e7ecf3;
    border-radius: 10px; padding: 8px 12px; flex: 1;
  }
  .stat .lbl { font-size: 9px; letter-spacing: 0.12em; color: #5b6a7f; font-weight: 600; margin-bottom: 1px; }
  .stat .val { font-size: 19px; font-weight: 800; color: #0f1a27; }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #ffffff; border-top: 1px solid #e7ecf3;
    display: flex; z-index: 30;
    padding-bottom: env(safe-area-inset-bottom, 0);
    box-shadow: 0 -2px 12px rgba(15,58,95,0.06);
  }
  .nav button {
    flex: 1; padding: 10px 4px 12px; text-align: center;
    color: #5b6a7f; font-size: 10px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .nav button.active { color: #0284c7; }
  .nav .ico { font-size: 19px; line-height: 1; }

  /* Top bar: getting back, and finding things. Both sit above the title on every
     screen so they are in the same place whatever you are looking at. */
  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-height: 26px; }
  .tb-btn {
    font-size: 12px; font-weight: 700; color: #0284c7;
    background: #eef6fd; border: 1px solid #cfe8fb; border-radius: 8px; padding: 5px 10px;
  }
  .tb-btn:active { background: #dceefb; }

  /* THE SEARCH BOX SCROLLED AWAY WITH EVERYTHING ELSE. Sixty-six rooms is a long
     list, and the one control that makes it short sat at the very top of it — so
     finding a second room meant scrolling all the way back up to the box. It sticks
     under the header now, which is itself sticky; --hdr is the header's real height,
     measured after each render because it changes with the screen. */
  .stickbar {
    position: sticky; top: var(--hdr, 0px); z-index: 15;
    background: #f4f7fb; padding: 8px 0 4px; margin: 0 -2px;
  }
  .grp-head { cursor: pointer; user-select: none; }
  .grp-btn {
    display: flex; align-items: center; gap: 9px; width: 100%;
    margin: 16px 0 6px; padding: 11px 12px; border-radius: 10px;
    background: #ffffff; border: 1px solid #e7ecf3; text-align: left;
  }
  .grp-btn:active { background: #eef2f8; }
  .grp-title { font-size: 14px; font-weight: 700; color: #0f1a27; }
  .grp-sub { font-size: 11px; color: #5f7189; margin-top: 1px; }
  .grp-count {
    font-size: 11px; font-weight: 700; color: #5b6a7f; background: #f4f7fb;
    border-radius: 20px; padding: 3px 9px; flex: 0 0 auto;
  }
  .grp-caret { font-size: 11px; color: #5b6a7f; width: 12px; }

  /* Segmented filter — one row of room kinds in place of four tabs. */
  .seg { display: flex; gap: 6px; margin-bottom: 14px; }
  .segbtn {
    flex: 1; padding: 9px 4px; border-radius: 9px; border: 1px solid #e7ecf3;
    background: #fff; color: #5f7189; font-size: 12px; font-weight: 700;
  }
  .segbtn.on { background: #0284c7; border-color: #0284c7; color: #fff; }
  .segn { display: block; font-size: 10px; font-weight: 600; opacity: 0.7; }

  /* Search sheet */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(15,32,46,0.45); z-index: 60;
    display: flex; flex-direction: column;
  }
  .sheet {
    background: #f4f7fb; margin-top: auto; border-radius: 16px 16px 0 0;
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet-head { padding: 14px 16px 10px; background: #fff; border-bottom: 1px solid #e7ecf3; }
  .sheet-body { padding: 12px 16px 24px; overflow-y: auto; }
  .sr-row {
    display: flex; align-items: center; gap: 10px; background: #fff;
    border: 1px solid #e7ecf3; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .sr-main { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: #0f1a27; }
  .sr-sub { font-size: 11px; color: #5f7189; font-weight: 500; margin-top: 1px; }
  .sr-kind { font-size: 9px; letter-spacing: 0.1em; font-weight: 700; color: #5b6a7f; }

  /* The hand-out sheet: one screen, photographable, no controls. */
  .sheet-paper { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 12px 14px; }
  .sp-head { border-bottom: 2px solid #0f1a27; padding-bottom: 7px; margin-bottom: 9px; }
  .sp-date { font-size: 16px; font-weight: 800; color: #0f1a27; letter-spacing: -0.01em; }
  .sp-meta { font-size: 11px; color: #5f7189; font-weight: 600; margin-top: 1px; }
  .sp-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #eef2f8; }
  .sp-row:last-child { border-bottom: none; }
  .sp-who {
    flex: 0 0 84px; font-size: 13px; font-weight: 800; color: #0f1a27;
    display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap;
  }
  .sp-with { flex: 1 0 100%; font-size: 10px; font-weight: 700; color: #5f7189; }
  .sp-lead { color: #d97706; font-size: 11px; }
  .sp-n { font-size: 10px; font-weight: 700; color: #5b6a7f; }
  .sp-jobs { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 3px 4px; }
  .sp-job {
    font-size: 12px; font-weight: 700; color: #15202e;
    background: #eef2f8; border-radius: 5px; padding: 1px 6px;
  }
  .sp-job.area { background: #e3f2f4; color: #0369a1; font-weight: 600; }
  .sp-loose .sp-who { color: #b45309; }
  .sp-loose .sp-job { background: #fdf3e6; color: #8a5a12; }
  @media (min-width: 900px) {
    body:not(.tv) .sp-who { flex: 0 0 110px; }
  }

  /* Floor allocation — tap a floor on or off for a person. */
  .fl-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .fl-btn {
    min-width: 30px; padding: 5px 7px; border-radius: 7px; font-size: 12px; font-weight: 700;
    border: 1px solid #e7ecf3; background: #fff; color: #5f7189;
  }
  .fl-btn.on { background: #0284c7; border-color: #0284c7; color: #fff; }
  .fl-btn.taken { border-style: dashed; color: #b45309; }

  .body { padding: 16px; }

  /* Roll call */
  .crew-group { margin-bottom: 16px; }
  .crew-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 0 2px; }
  .crew-dot { width: 10px; height: 10px; border-radius: 3px; }
  .crew-name { font-size: 13px; font-weight: 700; color: #0f1a27; }
  .crew-sub { font-size: 11px; color: #5b6a7f; font-weight: 600; margin-left: auto; }

  .person {
    background: #ffffff; border: 1px solid #e7ecf3; border-radius: 9px;
    padding: 8px 12px; margin-bottom: 5px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 3px rgba(15,58,95,0.04);
  }
  .person-name { font-size: 14px; }
  .person-floors { font-size: 11px; }
  .person-info { flex: 1; min-width: 0; }
  .person-name { font-size: 15px; font-weight: 600; color: #0f1a27; }
  .person-floors { font-size: 12px; color: #5f7189; margin-top: 1px; }
  .status-btn {
    padding: 9px 14px; border-radius: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    min-width: 96px; text-align: center; color: #ffffff;
  }

  .alert {
    background: #ffffff; border: 1px solid #f6d5d5; border-left: 4px solid #dc2626;
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(212,73,63,0.08);
  }
  .alert-title { font-size: 12px; color: #dc2626; font-weight: 700; }
  .alert-body { font-size: 13px; color: #b91c1c; margin-top: 5px; line-height: 1.5; }
  .cover-suggest {
    background: #e7f6ec; border: 1px solid #bfe6cd; border-radius: 9px;
    padding: 10px 12px; margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .cover-text { font-size: 12px; color: #15803d; flex: 1; }
  .cover-btn {
    background: #15803d; color: #ffffff; padding: 9px 14px; border-radius: 8px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }

  .confirm {
    background: #e7f6ec; border: 1px solid #bfe6cd; border-radius: 9px;
    padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .confirm-text { font-size: 12px; color: #15803d; flex: 1; }
  .undo-btn { font-size: 11px; color: #5f7189; border: 1px solid #d8e0ea; border-radius: 7px; padding: 7px 11px; font-weight: 600; }

  /* Floors */
  .floor { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; margin-bottom: 9px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,58,95,0.04); }
  .floor-head { width: 100%; padding: 13px 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
  .floor-badge {
    width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #ffffff;
  }
  .floor-info { flex: 1; min-width: 0; }
  .floor-name { font-size: 15px; font-weight: 700; color: #0f1a27; }
  .floor-sub { font-size: 11px; color: #5f7189; margin-top: 1px; font-weight: 500; }
  .floor-prog { width: 48px; height: 6px; border-radius: 3px; background: #e7ecf3; position: relative; flex-shrink: 0; overflow: hidden; }
  .floor-prog > div { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .chev { color: #5b6a7f; font-size: 12px; width: 14px; text-align: center; }

  .unit-grid { padding: 4px 14px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .unit { background: #eef2f8; border: 1px solid #e7ecf3; border-radius: 10px; padding: 11px 8px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .unit.done { background: #e7f6ec; border-color: #bfe6cd; }
  .unit-num { font-size: 15px; font-weight: 800; color: #0f1a27; }
  .unit.done .unit-num { color: #15803d; }
  .unit-mark { width: 100%; padding: 7px; border-radius: 7px; font-size: 11px; font-weight: 700; color: #ffffff; background: #0284c7; }
  .unit.done .unit-mark { background: #15803d; }

  /* Zones */
  .zone { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(15,58,95,0.04); }
  .zone.done { background: #e7f6ec; border-color: #bfe6cd; }
  .zone-info { flex: 1; min-width: 0; }
  .zone-freq { font-size: 10px; letter-spacing: 0.08em; font-weight: 700; }
  .zone-name { font-size: 14px; font-weight: 600; color: #0f1a27; margin-top: 2px; }
  .zone.done .zone-name { color: #15803d; }
  .zone-mark { padding: 9px 16px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #ffffff; background: #0284c7; white-space: nowrap; }
  .zone.done .zone-mark { background: #15803d; }

  .section-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; margin: 2px 0 12px; text-transform: uppercase; }
  .note { font-size: 13px; color: #5f7189; line-height: 1.55; margin-bottom: 14px; }
  .reset-btn { width: 100%; background: #ffffff; color: #5f7189; border: 1px solid #d8e0ea; border-radius: 10px; padding: 11px; font-size: 12px; font-weight: 600; margin-bottom: 14px; }
  .owner-tag { font-size: 9px; letter-spacing: 0.04em; padding: 4px 9px; border-radius: 6px; font-weight: 700; color: #ffffff; }
  .footer { padding: 18px 16px 8px; font-size: 11px; color: #6b7a8f; text-align: center; font-weight: 500; }
  .hint { font-size: 11px; color: #6b7a8f; text-align: center; margin-top: 6px; font-weight: 500; }

  /* Serviced units */
  .addbox { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .addbox input { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 11px; }
  .addbox input::placeholder { color: #5b6a7f; }
  .freqpick { flex: 1; padding: 9px 4px; border-radius: 8px; font-size: 11px; font-weight: 600; color: #5f7189; background: #f4f7fb; border: 1px solid #d8e0ea; }
  .freqpick.on { color: #ffffff; background: #0284c7; border-color: #0284c7; }
  .add-btn { width: 100%; background: #0284c7; color: #ffffff; border-radius: 9px; padding: 12px; font-size: 13px; font-weight: 700; }
  .su-card { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; }
  .su-card.done { background: #e7f6ec; border-color: #bfe6cd; }
  .su-top { display: flex; align-items: center; gap: 12px; }
  .su-unit { font-size: 16px; font-weight: 700; color: #0f1a27; }
  .su-guest { font-size: 12px; color: #5f7189; margin-top: 1px; }
  .su-mark { padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #ffffff; background: #0284c7; white-space: nowrap; }
  .su-card.done .su-mark { background: #15803d; }
  .su-next { font-size: 11px; color: #5f7189; font-weight: 600; padding: 6px 10px; border: 1px solid #d8e0ea; border-radius: 7px; white-space: nowrap; }
  .su-ctl { display: flex; gap: 6px; margin-top: 11px; padding-top: 11px; border-top: 1px solid #e7ecf3; }
  /* Communal areas: a plain list, not nine stacked cards. One thin rule between
     rows carries the separation a box was doing at ten times the height. */
  .area-list { background: #ffffff; border: 1px solid #e2e8f1; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .area-item { border-top: 1px solid #eef2f7; }
  .area-item:first-child { border-top: none; }
  .area-row { display: flex; align-items: center; gap: 8px; padding: 6px 9px; }
  .area-tick { flex: 0 0 auto; width: 19px; height: 19px; padding: 0; border-radius: 50%; border: 1.5px solid #cbd5e1; background: #ffffff; color: transparent; font-size: 10px; line-height: 1; }
  .area-tick.on { background: #15803d; border-color: #15803d; color: #ffffff; }
  .area-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 700; color: #15202e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .area-item.done .area-name { color: #94a3b8; }
  .area-freq { font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: 0.05em; }
  .area-who { flex: 0 1 112px; min-width: 0; font-size: 11.5px; padding: 3px 5px; border: 1px solid #e2e8f1; border-radius: 6px; background: #f8fafc; color: #334155; }
  .area-more { flex: 0 0 auto; width: 22px; padding: 3px 0; font-size: 12px; color: #94a3b8; background: transparent; border: none; }
  .area-ctl { display: flex; gap: 4px; padding: 0 9px 7px; }
  .freqmini { flex: 1; padding: 7px 4px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #5f7189; background: #f4f7fb; border: 1px solid #d8e0ea; }
  .freqmini.on { color: #ffffff; background: #0284c7; border-color: #0284c7; }
  .su-rm { padding: 7px 12px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #dc2626; background: transparent; border: 1px solid #f6d5d5; }
  .su-edit { padding: 7px 12px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #0284c7; background: transparent; border: 1px solid #cfe8fb; }
  .area-select { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 10px; font-size: 13px; }
  .su-card input { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 11px; }
  .su-card input::placeholder { color: #5b6a7f; }
  .su-assign { font-size: 11px; font-weight: 600; margin-top: 3px; }
  .su-card.needs-cover { border-color: #dc2626; }

  /* Cover confirmation popup */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: #ffffff; border: 1px solid #d8e0ea; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; padding: 20px 18px calc(20px + env(safe-area-inset-bottom,0)); }
  .modal-title { font-size: 18px; font-weight: 800; color: #0f1a27; }
  /* pre-line so an explanation can have paragraphs; single-line messages are unaffected */
  .modal-sub { font-size: 13px; color: #5f7189; margin-top: 6px; line-height: 1.5; white-space: pre-line; }
  .modal-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; text-transform: uppercase; margin: 16px 0 8px; }
  .cover-picker { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .cover-opt { display: flex; justify-content: space-between; align-items: center; padding: 13px 14px; border-radius: 10px; background: #eef2f8; border: 1px solid #d8e0ea; color: #15202e; font-size: 14px; font-weight: 600; }
  .cover-opt.on { border-color: #0284c7; background: #e6f4fd; }
  .cover-load { font-size: 11px; color: #5f7189; font-weight: 500; }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
  .modal-confirm { flex: 1; background: #0284c7; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 700; }
  .modal-skip { padding: 14px 18px; border-radius: 10px; background: transparent; border: 1px solid #d8e0ea; color: #5f7189; font-size: 13px; font-weight: 600; }
  .modal-danger { flex: 1; background: #dc2626; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 700; }

  /* Login screen */
  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 360px; }
  .login-logo { font-size: 36px; text-align: center; margin-bottom: 8px; }
  .login-heading { font-size: 22px; font-weight: 800; color: #0f1a27; text-align: center; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: #5b6a7f; text-align: center; margin-bottom: 28px; }
  .login-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
  .login-input { width: 100%; background: #ffffff; color: #15202e; border: 1px solid #d8e0ea; border-radius: 10px; padding: 13px 14px; font-size: 15px; margin-bottom: 16px; outline: none; }
  .login-input:focus { border-color: #0284c7; }
  .login-input.error { border-color: #dc2626; }
  .login-btn { width: 100%; background: #0284c7; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; margin-top: 4px; }
  .login-error { font-size: 12px; color: #dc2626; text-align: center; margin-top: 12px; font-weight: 600; }

  /* Backup buttons */
  .backup-btn { width: 100%; border-radius: 10px; padding: 13px; font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .backup-export { background: #ffffff; color: #0284c7; border: 1px solid #cfe8fb; }

  if (!state.assignConfirmed || typeof state.assignConfirmed !== 'object') state.assignConfirmed = {};
  dedupeServicedUnits();
  STAFF = state.staff;
  refreshTeamColors();
  STAFF.forEach(p => { if (!state.attendance[p.id]) state.attendance[p.id] = 'present'; });
}
// Self-heal: collapse any rooms that share a unit number down to one record,
// carrying over an assignment/priority from whichever copy has it. Runs on every
// load so a stale device that re-added duplicates can't leave them behind.
function dedupeServicedUnits() {
  if (!Array.isArray(state.servicedUnits)) { state.servicedUnits = []; return false; }
  const byUnit = new Map();
  for (const u of state.servicedUnits) {
    const key = String(u.unit || '').trim().toLowerCase();
    if (!byUnit.has(key)) { byUnit.set(key, u); continue; }
    const base = byUnit.get(key);
    for (const f of ['assignedTo', 'usualTo', 'priority', 'guest', 'time', 'lastCleaned']) {
      if (!base[f] && u[f]) base[f] = u[f];
    }
  }
  const before = state.servicedUnits.length;
  state.servicedUnits = [...byUnit.values()];
  return state.servicedUnits.length !== before;   // true if it removed any dupes
}

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const saved = JSON.parse(raw);
      state = { ...state, ...saved, tab: 'rollcall' };
      if (state.coverageDay !== todayKey()) { state.coverage = {}; state.unitCover = {}; state.pendingCover = null; state.coverageDay = todayKey(); }
    }
  } catch (e) {}
  finalizeState();
}

// Save = write the local cache instantly, then push to the shared server.
// The device is marked dirty until the server confirms the write, so a change
// can never be left stranded on one phone (see DIRTY FLAG below).
function save() {
  dedupeServicedUnits();   // never persist a duplicate room, no matter how it got created
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  // THE BOARD NEVER WRITES BACK. A display that sits open for days holds the
  // stalest copy in the building, and the whole state travels as one blob, so a
  // single push from the TV overwrites everything the crew and the office have done
  // since it last looked. It keeps its own local copy so the screen stays right; it
  // just never sends it. Nothing is lost — every figure on that board was saved by
  // whichever device actually did the work.
  if (TV_MODE) return;
  markDirty();
  remotePush();
}

// ============================================================
// SHARED SERVER SYNC (Supabase)
// The whole app state is stored as one row per building. Every device
// pulls it on open, pushes on every change, and gets live updates.
// NOTE (concurrency): this is document-level "last write wins". If two
// people save within the same ~second, one change can be overwritten.
// Fine for a small crew; if that becomes a problem the high-write pieces
// (attendance, completions) should move to their own rows — see SETUP.md.
//
// DURABILITY: a save is not finished until the server confirms it. Until then
// the device is "dirty": it retries, it flushes before the page is hidden or
// closed, it re-pushes on the next open, and it refuses to let a server copy
// overwrite the change it has not managed to send yet. Without this, a tap
// followed by locking the phone lost the change silently — it stayed in
// localStorage, so that phone kept showing it while no other device ever saw it.
// ============================================================
const DIRTY_KEY = STORE + '_dirty';   // survives a reload, so an unsent change is replayed
let _lastRemoteJSON = null;   // dedupe realtime echoes of our own writes
let _pushTimer = null;
let _retryTimer = null;
let _retryDelay = 0;
let _pushing = false;

function isDirty() { try { return localStorage.getItem(DIRTY_KEY) === '1'; } catch (e) { return false; } }
function markDirty() { try { localStorage.setItem(DIRTY_KEY, '1'); } catch (e) {} }
function clearDirty() { try { localStorage.removeItem(DIRTY_KEY); } catch (e) {} }

// Debounced push: collapses a burst of saves into one network write.
// COALESCE THE RUSH. Every save sends the WHOLE state and realtime then broadcasts it
// to every other device, so a quarter-second debounce meant a morning of ticking rooms
// off was a push — and a broadcast to every phone and the TV — per tap. A second and a
// bit gathers a burst into one write without anybody feeling it: the screen has already
// updated locally, and nothing waits on the push. A change still in the window is not
// at risk — it is marked owed, flushed when the page is hidden, and retried on failure.
function remotePush() {
  if (!db) return;             // not configured yet → local-only (unchanged behavior)
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => { pushNow(); }, 1200);
}

// Send the current state to the server. Resolves true only when the row is written.
async function pushNow() {
  if (!db || _pushing || TV_MODE) return false;   // the board is a display, not a writer
  clearTimeout(_pushTimer);    // a pending debounce is now redundant
  clearTimeout(_retryTimer);
  _pushing = true;
  const snapshot = JSON.stringify(state);
  try {
    const { error } = await db.from('app_state')
      .upsert({ building: BUILDING, data: JSON.parse(snapshot), updated_at: new Date().toISOString() });
    if (error) throw error;
    _lastRemoteJSON = snapshot;   // only now is it genuinely our own write echoing back
    stampSynced();                // so an offline session can say how old the board is
    clearDirty();
    _retryDelay = 0;
    hideStorageWarn();
    return true;
  } catch (e) {
    markDirty();                  // still ours to deliver
    showStorageWarn('Not saved to the server yet (' + (e.message || e) + '). Retrying — keep this page open.');
    scheduleRetry();
    return false;
  } finally {
    _pushing = false;
  }
}

// Keep trying, backing off 1s → 2s → 4s … up to 30s, until the write lands.
function scheduleRetry() {
  clearTimeout(_retryTimer);
  _retryDelay = Math.min(_retryDelay ? _retryDelay * 2 : 1000, 30000);
  _retryTimer = setTimeout(() => { if (isDirty()) pushNow(); }, _retryDelay);
}

// Flush before the page goes away. Locking a phone or switching apps fires
// visibilitychange/pagehide; without this the debounce timer was killed first
// and the change was never sent.
function flushBeforeHide() {
  if (!db || !isDirty()) return;
  clearTimeout(_pushTimer);
  pushNow();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushBeforeHide(); });
window.addEventListener('pagehide', flushBeforeHide);
window.addEventListener('online', () => { if (isDirty()) { _retryDelay = 0; pushNow(); } });

async function remotePull() {
  if (!db) return;
  // An unsent local change outranks whatever the server holds — deliver it first,
  // otherwise adopting the server copy below would wipe it.
  if (isDirty()) { await pushNow(); if (isDirty()) return; }
  try {
    const { data, error } = await db.from('app_state').select('data').eq('building', BUILDING).maybeSingle();
    if (error) throw error;
    if (data && data.data && Object.keys(data.data).length) {
      applyRemote(data.data);
    } else {
      await pushNow();         // server empty → seed it with what this device has
    }
    hideStorageWarn();
  } catch (e) {
    showStorageWarn('Cannot reach the server (' + (e.message || e) + '). Showing this device\'s saved copy.');
  }
}

// Adopt state coming from the server (initial pull or a live update from another device).
function applyRemote(saved) {
  const serialized = JSON.stringify(saved);
  if (serialized === _lastRemoteJSON) return;   // this is our own write echoing back
  // Never discard a change this device has not delivered yet; send ours instead.
  if (isDirty() && !TV_MODE) { pushNow(); return; }   // the board has nothing of its own to send
  _lastRemoteJSON = serialized;
  const keepTab = state.tab;
  // A DAY THAT ONLY THIS DEVICE HAS SEEN SURVIVES THE PULL.
  // The whole state travels as one blob and the last writer wins, so a plan made
  // here while the connection was down was being wiped by the next device to push —
  // a TV or a phone whose copy had never contained it. The plan was correct, saved,
  // and then deleted by somebody else's snapshot, which is why it never reached the
  // roll call. Days the incoming copy has are still its business; days it has never
  // heard of are kept and pushed back rather than dropped on the floor.
  const localPlans = state.plans || {};
  const mergedPlans = { ...(saved.plans || {}) };
  let rescued = 0;
  Object.keys(localPlans).forEach((d) => {
    if (mergedPlans[d] || !Object.keys(localPlans[d] || {}).length) return;
    mergedPlans[d] = localPlans[d]; rescued += 1;
  });
  // A ROOM ONLY THIS DEVICE HAS SEEN SURVIVES THE PULL, for the same reason a plan
  // does: the whole state is one blob and the last writer wins, so adding rooms on
  // one device and then opening another was enough to lose them. A room the other
  // side deleted on purpose stays deleted — that is what the tombstones are for.
  const gone = { ...(saved.removedUnits || {}), ...(state.removedUnits || {}) };
  const remoteUnits = Array.isArray(saved.servicedUnits) ? saved.servicedUnits : null;
  let unitsKept = 0, mergedUnits = remoteUnits;
  if (remoteUnits) {
    const haveId = new Set(remoteUnits.map((u) => u.id));
    const extra = (state.servicedUnits || []).filter((u) => u && !haveId.has(u.id) && !gone[u.id]);
    mergedUnits = remoteUnits.concat(extra);
    unitsKept = extra.length;
    // A tombstone has to bite in BOTH directions, or a delete simply travels back
    // from whichever device had not heard about it yet and the room reappears.
    const before = mergedUnits.length;
    mergedUnits = mergedUnits.filter((u) => !gone[u.id]);
    if (mergedUnits.length !== before) unitsKept = Math.max(unitsKept, 1);
  }

  // A TICK IS A FACT, AND FACTS MERGE. The whole state travels as one blob and the
  // last writer wins, so `completions` — the ticks themselves — were taken wholesale
  // from whichever device pushed most recently. Two people ticking rooms off on two
  // phones was enough to wipe one of them, with no error and nothing on screen: the
  // room simply came back as due, and it read as the crew forgetting to tick.
  // A tick is now never removed because the other copy had not heard of it. Only a
  // deliberate un-tick removes one, and that leaves a headstone in `untick` which
  // travels the same way — so an un-tick is not undone by a stale copy either.
  const untick = { ...(saved.untick || {}), ...(state.untick || {}) };
  const mergedDone = { ...(saved.completions || {}) };
  let ticksKept = 0;
  Object.keys(state.completions || {}).forEach((k) => {
    if (!state.completions[k] || mergedDone[k]) return;
    mergedDone[k] = true; ticksKept += 1;
  });
  Object.keys(untick).forEach((k) => { if (mergedDone[k]) { delete mergedDone[k]; ticksKept += 1; } });

  // The same rule for the date stamped on the room itself, which is the other half of
  // "was this cleaned today" — otherwise a stale copy hands the tick back but reverts
  // the room's own record, and the room reads as due anyway.
  if (mergedUnits) {
    const mineById = {};
    (state.servicedUnits || []).forEach((u) => { mineById[u.id] = u; });
    mergedUnits = mergedUnits.map((u) => {
      const mine = mineById[u.id];
      if (!mine) return u;
      const stamp = (src) => ({ ...u,
        lastCleaned: src.lastCleaned || null,
        lastCleanedBy: src.lastCleanedBy || null,
        lastCleanedByName: src.lastCleanedByName || null });
      // Un-ticked here, and the incoming copy has not heard: keep our reverted date.
      if (u.lastCleaned && untick['su:' + u.id + '::' + u.lastCleaned]) return stamp(mine);
      // Otherwise the later clean wins. A clean that happened cannot be undone by a
      // copy that predates it.
      if (mine.lastCleaned && (!u.lastCleaned || String(mine.lastCleaned) > String(u.lastCleaned))) return stamp(mine);
      return u;
    });
  }

  const localSeeded = state.planSeeded || {};
  const mergedSeeded = { ...(saved.planSeeded || {}) };
  Object.keys(localSeeded).forEach((d) => { if (mergedPlans[d]) mergedSeeded[d] = mergedSeeded[d] || localSeeded[d]; });

  state = { ...state, ...saved, tab: keepTab, pendingCover: null, editingUnit: null, editingArea: null, editingEmp: null };
  state.plans = mergedPlans;
  state.planSeeded = mergedSeeded;
  state.removedUnits = gone;
  state.completions = mergedDone;
  state.untick = untick;
  if (mergedUnits) state.servicedUnits = mergedUnits;
  if ((rescued || unitsKept || ticksKept) && !TV_MODE) markDirty();   // ours to deliver — the server has not got these
  if (state.coverageDay !== todayKey()) { state.coverage = {}; state.unitCover = {}; state.pendingCover = null; state.coverageDay = todayKey(); }
  finalizeState();
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  stampSynced();             // fresh from the server counts as in sync, same as a push
  tvLastData = Date.now();   // the TV board dates itself off the last thing it heard
  if ((rescued || unitsKept || ticksKept) && !TV_MODE) remotePush();  // get them up before anything overwrites them
  route();
}

function subscribeRealtime() {
  if (!db) return;
  db.channel('app_state_' + BUILDING)
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'app_state', filter: 'building=eq.' + BUILDING },
        (payload) => { if (payload.new && payload.new.data) applyRemote(payload.new.data); })
    .subscribe();
}

// The "save failed" banner (styled but previously never shown).
function showStorageWarn(msg) {
  let el = document.getElementById('storageWarn');
  if (!el) {
    el = document.createElement('div');
    el.id = 'storageWarn';
    el.className = 'storage-warn';
    el.style.position = 'sticky'; el.style.top = '0'; el.style.zIndex = '60';
    document.body.insertBefore(el, document.body.firstChild);
  }
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
function hideStorageWarn() {
  const el = document.getElementById('storageWarn');
  if (el) el.style.display = 'none';
}

// ============================================================
// WHO AM I  (per-device — deliberately NOT synced; each phone is
// whichever cleaner is holding it, so covers get logged correctly)
// ============================================================
const ME_KEY = 'cleaning_app_me';
let currentMe = null;   // in-memory copy so the pick works even if localStorage is blocked
function getMe() {
  if (currentMe) return currentMe;
  try { const r = localStorage.getItem(ME_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function setMe(id) {
  const p = (state.staff || []).find(s => s.id === id);
  const me = p ? { id: p.id, name: p.name } : { id: 'office', name: 'Office' };
  currentMe = me;                                    // always held in memory (survives flaky storage)
  try { localStorage.setItem(ME_KEY, JSON.stringify(me)); } catch (e) {}
  route();
}
function switchMe() { currentMe = null; try { localStorage.removeItem(ME_KEY); } catch (e) {} route(); }

// Which screen: login → pick-your-name → the app.
function route() {
  if (!isLoggedIn()) { renderLogin(); return; }
  render();   // no 'who's cleaning' gate — go straight into the app
}

function renderCleanerPicker() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const screen = el(`<div class="login-screen"></div>`);
  const box = el(`<div class="login-box"></div>`);
  box.appendChild(el(`<div class="login-logo">✦</div>`));
  box.appendChild(el(`<div class="login-heading">Who's cleaning?</div>`));
  box.appendChild(el(`<div class="login-sub">Tap your name — the rooms you mark clean get logged to you.</div>`));
  const list = state.staff || [];
  list.forEach(p => {
    const b = el(`<button class="cover-opt" style="width:100%;margin-bottom:8px">${esc(p.name)}<span class="cover-load">${esc(p.crew || '')}</span></button>`);
    b.onclick = () => setMe(p.id);
    box.appendChild(b);
  });
  if (!list.length) {
    box.appendChild(el(`<div class="login-error" style="color:#5f7189;margin-bottom:12px">No staff added yet — add employees in Settings.</div>`));
  }
  // Escape hatch: never let this screen trap you.
  const cont = el(`<button class="login-btn" style="margin-top:8px">Continue →</button>`);
  cont.onclick = () => setMe('office');
  box.appendChild(cont);
  screen.appendChild(box);
  app.appendChild(screen);
}

// ============================================================
// CLEANING HISTORY LOG  (append-only table in Supabase)
// ============================================================
let cleaningHistory = [];        // recent log rows, newest first
let lastCleanedByUnit = {};      // unit_id -> newest row (drives the "last cleaned" line)
let historyFilter = 'all';       // History view room filter (per-device UI state)
let historyDay = '';             // History view day filter ('' = all days)
let teamShowAll = false;         // Team tab: false = cleaners only (default once any tagged)
let teamFridayPer = 3;
let teamFridayShift = 0;   // rotates which group lands on the coming Friday           // how many are in on each Friday, chosen in Team
const dayKeyLocal = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('en-CA'); }; // local YYYY-MM-DD

// dayKey lets a clean be recorded against the day it happened rather than the
// moment it was entered — the office often marks yesterday's work this morning.
// whoId names who actually did it. Without it a backdated entry gets stamped with
// today's assignment, which is the wrong person as soon as the crew rotates.
async function logClean(unit, dayKey, whoId) {
  if (!db) return null;
  const picked = (whoId && whoId !== 'office') ? (state.staff || []).find(p => p.id === whoId) : null;
  // Only fall back to the room's assignment when no name was given at all —
  // an explicit "Office" has to stay Office, not resolve to the floor's cleaner.
  const c = (picked || whoId === 'office') ? null : cleanerForUnit(unit);
  const cleanerId = picked ? picked.id : (c ? c.person.id : 'office');
  const cleanerName = picked ? picked.name : (c ? c.person.name : 'Office');
  // Midday avoids a timezone shift dragging the entry onto the wrong date.
  const when = (dayKey && dayKey !== todayKey())
    ? new Date(dayKey + 'T12:00:00').toISOString()
    : new Date().toISOString();
  try {
    const { data, error } = await db.from('cleaning_log')
      .insert({
        building: BUILDING,
        unit_id: unit.id,
        unit_label: unit.unit,
        cleaner_id: cleanerId,
        cleaner_name: cleanerName,
        cleaned_at: when,
      })
      .select('id')
      .single();
    if (error) throw error;
    refreshHistory();
    return data.id;
  } catch (e) {
    showStorageWarn('Could not log this cleaning to history (' + (e.message || e) + ').');
    return null;
  }
}

// Recording a past night writes a whole crew's work at once. One insert keeps it
// to a single round trip and a single history refresh instead of one of each per
// room, and the caller learns whether the write landed before it moves schedules.
async function logCleanMany(entries, dayKey) {
  if (!db || !entries.length) return false;
  const when = (dayKey && dayKey !== todayKey())
    ? new Date(dayKey + 'T12:00:00').toISOString()
    : new Date().toISOString();
  const rows = entries.map(({ u, who }) => {
    const picked = (who && who !== 'office') ? (state.staff || []).find(p => p.id === who) : null;
    return {
      building: BUILDING,
      unit_id: u.id,
      unit_label: u.unit,
      cleaner_id: picked ? picked.id : 'office',
      cleaner_name: picked ? picked.name : 'Office',
      cleaned_at: when,
    };
  });
  try {
    // Ask for the ids back so a caller that ticks many things at once can still
    // hold a history reference per row — without them, un-ticking one of them
    // would clear the checkmark and strand its entry in History.
    const { data, error } = await db.from('cleaning_log').insert(rows).select('id');
    if (error) throw error;
    refreshHistory();
    return (data || []).map((r) => r.id);
  } catch (e) {
    showStorageWarn('Could not log ' + rows.length + ' backdated cleaning' + (rows.length === 1 ? '' : 's') + ' (' + (e.message || e) + ').');
    return null;
  }
}

async function unlogClean(logId) {
  if (!db || !logId) return;
  try { await db.from('cleaning_log').delete().eq('id', logId); refreshHistory(); } catch (e) {}
}

async function refreshHistory() {
  if (!db) return;
  try {
    const { data, error } = await db.from('cleaning_log')
      .select('id,unit_id,unit_label,cleaner_id,cleaner_name,cleaned_at')
      .eq('building', BUILDING)
      .order('cleaned_at', { ascending: false })
      .limit(1000);
    if (error) throw error;
    cleaningHistory = data || [];
    const map = {};
    for (const row of cleaningHistory) { if (!map[row.unit_id]) map[row.unit_id] = row; } // first seen = newest
    lastCleanedByUnit = map;
    if (getMe()) render();
  } catch (e) {}
}

// ============================================================
// LEARN WHO USUALLY DOES WHAT
// A room can be tied to a cleaner (★ Usual), and once it is, the hand-out gives it
// back to that person every morning they are in. Setting them one room at a time is
// the reason almost nothing is tied: nobody taps forty rooms. The log already knows
// who has been doing what, so this reads it rather than asking.
//
// Only a clear pattern counts. Somebody who has done a room once, or half the time,
// is not "who does that room" — those stay in the pool and keep rotating.
// ============================================================
const LEARN_DAYS = 30;          // how far back to look
const LEARN_MIN_CLEANS = 3;     // fewer than this is not a pattern, it is a coincidence
const LEARN_SHARE = 0.6;        // and they must have done most of them

function learnUsualPlan(days) {
  const since = shiftDay(todayKey(), -(days || LEARN_DAYS));
  const staffById = {};
  (state.staff || []).forEach((s) => { staffById[s.id] = s; });
  const byName = {};
  (state.staff || []).forEach((s) => { byName[String(s.name).trim().toLowerCase()] = s; });

  // unit -> cleaner -> how many times
  const tally = {};
  (cleaningHistory || []).forEach((r) => {
    if (!r.unit_id || dayKeyLocal(r.cleaned_at) < since) return;
    // Older rows were written before cleaner_id was recorded; fall back to the name.
    const who = (r.cleaner_id && staffById[r.cleaner_id]) ? r.cleaner_id
      : (byName[String(r.cleaner_name || '').trim().toLowerCase()] || {}).id;
    if (!who) return;
    (tally[r.unit_id] = tally[r.unit_id] || {})[who] = (tally[r.unit_id][who] || 0) + 1;
  });

  const proposals = [], skipped = [];
  (state.servicedUnits || []).forEach((u) => {
    if (!onRollCall(u) || u.paused) return;
    const counts = tally[u.id];
    if (!counts) return;
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const [top] = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const n = counts[top];
    if (n < LEARN_MIN_CLEANS || n / total < LEARN_SHARE) { skipped.push({ u, reason: 'no clear pattern' }); return; }
    if (u.usualTo === top) return;                              // already theirs
    // A room nobody is cleared for is not a room to tie to them.
    if (!canCleanUnit(staffById[top], u)) { skipped.push({ u, reason: 'not cleared for it' }); return; }
    proposals.push({ u, who: top, name: (staffById[top] || {}).name || top, n, total, was: u.usualTo || null });
  });
  proposals.sort((a, b) => String(a.u.unit).localeCompare(String(b.u.unit), undefined, { numeric: true }));
  return { proposals, skipped, days: days || LEARN_DAYS };
}

function applyLearnedUsuals(plan) {
  plan.proposals.forEach((p) => { p.u.usualTo = p.who; });
  save();
}

function learnUsualCleaners() {
  const plan = learnUsualPlan(LEARN_DAYS);
  if (!plan.proposals.length) {
    hikSyncMsg = { err: false, text: 'Nothing clear enough in the last ' + plan.days
      + ' days — no room has one person doing most of it.' };
    render(); return;
  }
  const byWho = {};
  plan.proposals.forEach((p) => { (byWho[p.name] = byWho[p.name] || []).push(p.u.unit); });
  const summary = Object.keys(byWho).sort()
    .map((nm) => nm.split(' ')[0] + ': ' + byWho[nm].join(', ')).join(' · ');
  const changing = plan.proposals.filter((p) => p.was).length;
  showConfirm(
    'Tie ' + plan.proposals.length + ' room' + (plan.proposals.length === 1 ? '' : 's') + ' to who does them?',
    summary + '. Taken from the last ' + plan.days + ' days of the log — each of these has one person doing '
      + 'most of the cleans. They will go back to that person every morning they are in, instead of being '
      + 'dealt out again.'
      + (changing ? ' ' + changing + ' of them are tied to somebody else at the moment and will change hands.' : '')
      + ' Rooms with no clear pattern are left in the pool to rotate as they do now.',
    () => { applyLearnedUsuals(plan); render(); },
    'Tie them',
    'safe'
  );
}

function subscribeHistory() {
  if (!db) return;
  db.channel('cleaning_log_' + BUILDING)

// Friendly timestamp: "Today 2:30 PM", "Yesterday 9:05 AM", "Jul 14, 2:30 PM".
function fmtWhen(iso) {
  try {
    const d = new Date(iso);
    const now = new Date();
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'Today ' + time;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'Yesterday ' + time;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + time;
  } catch (e) { return iso; }
}

// ============================================================
function personFloors(p) {
  const parts = [];
  if (p.floors && p.floors.length) parts.push('Floors ' + p.floors.join(', '));
  if (p.special) parts.push(p.special.map(s => s==='ground'?'Ground':'Rooftop').join(' + '));
  return parts.join(' · ') || 'No assignment';
}
function gaps() {
  const out = [];
  STAFF.forEach(p => {
    if (isAway(p.id) && p.floors && p.floors.length) {
      p.floors.forEach(f => { if (!state.coverage[f]) out.push({ person: p, floor: f }); });
    }
  });
  return out;
}
function suggestCover(floor) {
  const candidates = STAFF.filter(p =>
    (state.attendance[p.id]==='present' || state.attendance[p.id]==='late') && p.floors && p.floors.length);
  if (!candidates.length) return null;
  const load = {};
  candidates.forEach(p => load[p.id] = (p.floors||[]).length);
  Object.values(state.coverage).forEach(pid => { if (load[pid]!=null) load[pid]++; });
  candidates.sort((a,b) => load[a.id]-load[b.id]);
  return candidates[0];
}
function whoCleansFloor(floor) {
  if (state.coverage[floor]) {
    const c = STAFF.find(p => p.id===state.coverage[floor]);
    if (c) return { person: c, covering: true };
  }
  const owner = STAFF.find(p => (p.floors||[]).includes(floor));
  return owner ? { person: owner, covering: false } : null;
}

// ACTIONS
// ============================================================
function cycleStatus(pid) {
  const cur = state.attendance[pid] || 'present';
  const next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
  state.attendance[pid] = next;

  if (next === 'noshow' || next === 'sick') {
    // Does this person own any serviced units (via their floors)?
    const affected = unitsOwnedBy(pid);
    if (affected.length) {
      const sug = suggestCoverPerson(pid);
      state.pendingCover = { absentId: pid, suggestId: sug ? sug.id : null };
    }
  } else {
    // Back to present/late/off — release any cover they were given and clear pending
    if (state.unitCover) {
      Object.keys(state.unitCover).forEach(uid => {
        const u = state.servicedUnits.find(x => x.id === uid);
        if (u && ownerOfFloor(floorOfUnit(u.unit))?.id === pid) delete state.unitCover[uid];
      });
    }
    if (state.pendingCover && state.pendingCover.absentId === pid) state.pendingCover = null;
  }
  save(); render();
}
// Apply the confirmed cover: all the absent person's units -> chosen covererer
function confirmCover(coverId) {
  const pc = state.pendingCover;
  if (!pc) return;
  if (!state.unitCover) state.unitCover = {};
  unitsOwnedBy(pc.absentId).forEach(u => { state.unitCover[u.id] = coverId; });
  state.coverageDay = todayKey();
  state.pendingCover = null;
  save(); render();
}
function dismissCover() { state.pendingCover = null; save(); render(); }
function assignCover(floor, pid) { state.coverage[floor]=pid; state.coverageDay=todayKey(); save(); render(); }
function toggleUnit(uid) { const k=uid+'::perm'; if(state.completions[k])delete state.completions[k];else state.completions[k]=true; save(); render(); }
function toggleZone(zid, freq) { const k=zid+'::'+freqKey(freq); if(state.completions[k])delete state.completions[k];else state.completions[k]=true; save(); render(); }
function toggleFloorExpand(fid) { state.expandedFloors[fid]=!state.expandedFloors[fid]; save(); render(); }

// Where you came from. Deliberately NOT part of state: it is this device's history,
// it changes on every tap, and the state travels to every other device on every save.
let _navStack = [];

// WORK OUT THE DAYS FROM THE FREQUENCY.
// Saying "305 is every other day" is easy; saying "305 is Sat/Mon/Wed/Fri" is a
// chore sixty-six times over. So the office sets the frequency, as it always has,
// and this turns that into actual days — which is the part that stops the drift.
// Every-other-day rooms go onto one of the two alternating sets. Splitting them
// between the two is what keeps the week even: put them all on one and half the
// week is empty while the other half is unworkable.
// EVERY OTHER DAY, COUNTED FROM SATURDAY. Start on Saturday and step two at a time
// and you get Sat, Mon, Wed, Fri; everything else falls on Sun, Tue, Thu. The two
// sets between them cover the week exactly once, so a room is on one or the other and
// the estate splits evenly. Written Saturday-first because that is the order the week
// is worked in — the days themselves are unchanged, so nothing already pinned moves.
const EOD_SETS = [[6, 1, 3, 5], [0, 2, 4]];   // Sat/Mon/Wed/Fri and Sun/Tue/Thu
function suggestDaysFromFreq() {
  const rooms = (state.servicedUnits || []).filter((u) => !u.paused && onRollCall(u));
  const load = [0, 0, 0, 0, 0, 0, 0];
  // Count what is already pinned, so new suggestions balance around it rather than
  // against an imaginary empty week.
  rooms.forEach((u) => { const d = fixedDays(u); if (d) d.forEach((x) => { load[x] += 1; }); });
  // Judge a set by the WEEK IT LEAVES BEHIND: first the heaviest day, then how flat
  // the rest is. Scoring on total room-days instead quietly rewards the three-day set
  // for being smaller, and the every-other-day rooms pile onto Sun/Tue/Thu.
  const after = (set) => {
    const t = load.slice();
    set.forEach((x) => { t[x] += 1; });
    return [Math.max.apply(null, t), t.reduce((a, b) => a + b * b, 0)];
  };
  const flatter = (a, b) => (a[0] !== b[0]) ? a[0] - b[0] : a[1] - b[1];

  const proposals = [], skipped = [];
  rooms.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }))
    .forEach((u) => {
      if (fixedDays(u)) return;                       // already on days — never overrule that
      const f = u.freq || 'daily';
      let days = null;
      if (f === 'eod') {
        // A ROOM CLEANED TODAY IS NOT DUE TOMORROW. Neither set is a true every-other-day
        // — seven days don't divide by two — so Sat/Mon/Wed/Fri runs Fri→Sat back to back
        // and Sun/Tue/Thu leaves a three-day gap over the weekend. Which set a room wants
        // therefore depends on the day it was last cleaned: put a room cleaned on Friday
        // into Sat/Mon/Wed/Fri and it comes round again TOMORROW, so it gets cleaned two
        // days running and the extra work shows up as a heavier Saturday.
        //
        // How far the set puts the room's next clean from the two days it should be.
        const last = lastCleanDate(u);
        const beat = (set) => {
          if (!last) return 0;
          for (let i = 1; i <= 7; i += 1) if (set.indexOf(dowOf(shiftDay(last, i))) >= 0) return Math.abs(i - 2);
          return 0;
        };
        // A room cleaned in the last couple of days has a real rhythm and breaking it
        // means cleaning it twice over; one that has been sitting has no rhythm to keep,
        // so the week's shape decides. Peak day first either way — that is what "too
        // heavy" actually means — then the other consideration, then fine smoothing.
        const live = last && daysSince(last) <= 2;
        const score = (set) => after(set).concat(beat(set));
        const cmp = live
          ? (a, b) => (a[2] !== b[2]) ? a[2] - b[2] : (a[0] !== b[0]) ? a[0] - b[0] : a[1] - b[1]
          : (a, b) => (a[0] !== b[0]) ? a[0] - b[0] : (a[1] !== b[1]) ? a[1] - b[1] : a[2] - b[2];
        days = cmp(score(EOD_SETS[0]), score(EOD_SETS[1])) <= 0 ? EOD_SETS[0] : EOD_SETS[1];
      } else if (f === 'weekly') {
        // Walk the week in working order from Saturday, and consider all seven days.
        // The old loop started at 1 and stopped before 7, so Sunday was never even
        // looked at — a weekly room could not be put on a Sunday however light it was.
        let best = DOW_PICK_ORDER[0];
        DOW_PICK_ORDER.forEach((d) => { if (load[d] < load[best]) best = d; });
        days = [best];
      } else {
        // Daily and nightly are due every day, so they cannot drift and pinning them
        // says nothing. Monthly is too rare for a weekday to mean anything.
        skipped.push({ u, reason: FREQ_LABEL[f] || f });
        return;
      }
      days.forEach((x) => { load[x] += 1; });
      proposals.push({ u, days: days.slice() });
    });
  return { proposals, skipped, load };
}
// PUT THE ROOMS ON DAYS WITHOUT BEING ASKED. Working the days out was a button
// inside a collapsed drawer on the roll call, which meant the schedule went on
// drifting for anyone who never found it — and a drifting every-other-day group is
// exactly what makes one morning carry 38 rooms and the next 25. It runs on its own
// now, once a day, and only ever on rooms that are on a frequency with NO days set:
// a room somebody has put on days is a decision and is never overruled.
function autoPinDaysFromFreq() {
  if (TV_MODE) return { pinned: 0 };                 // the board cannot write
  if (state.autoDays === false) return { pinned: 0 };
  if (state.autoDaysOn === todayKey()) return { pinned: 0 };
  state.autoDaysOn = todayKey();

// ============================================================
// LEVEL THE WEEK
// Thirteen rooms tomorrow and twenty-four the day after is the same fortnight's
// work either way, but the heavy day cannot actually be finished and the light one
// wastes a crew. This replaced an earlier balancer that split each frequency group
// into equal blocks by room number: that evened out a group in isolation and said
// nothing about what the day as a whole ended up carrying, so the every-other-day
// split could land squarely on the day the weeklies already fell. It also delayed
// rooms, where this brings them forward, and the two pulled against each other
// depending on which had run last.
//
// This works from the projection the week-ahead view shows, so what gets levelled is
// the number the office is actually looking at, and it picks each room's place in
// its own cycle to flatten the daily totals.
//
// It only ever moves a clean EARLIER, never later — the same rule the rest of the
// scheduling keeps. Nothing waits longer than its frequency to be cleaned; a room
// simply takes its next turn a day or two sooner, and carries on from there.
// ============================================================
const LEVEL_HORIZON = 14;

// The projected count for each of the next n days as the schedule stands.
function projectedCounts(horizon) {
  const counts = {};
  projectDueDays(horizon).forEach((d) => { counts[d.day] = d.due.length; });
  return counts;
}

// Work out where each room would sit to make the days come out even. Returns the
// moves and the before/after shape, without touching anything.
function levelPlan(horizon) {
  const span = horizon || LEVEL_HORIZON;
  const start = workToday();
  const days = [];
  for (let i = 0; i < span; i += 1) days.push(shiftDay(start, i));
  const idx = {};
  days.forEach((d, i) => { idx[d] = i; });

  const before = projectedCounts(span);
  const walk = projectDueDays(span);
  const firstDueIdx = {};      // room -> the day it is next due, as an offset
  walk.forEach((d, i) => d.due.forEach((u) => { if (firstDueIdx[u.id] === undefined) firstDueIdx[u.id] = i; }));

  const units = (state.servicedUnits || []).filter((u) => !u.paused && onRollCall(u));
  const load = new Array(span).fill(0);
  const movable = [];
  units.forEach((u) => {
    const n = FREQ_DAYS[u.freq] || 1;
    const from = firstDueIdx[u.id];
    // A daily room is on every day whatever we do, and a room not due inside the
    // horizon has nothing to place. Both are fixed load to work around.
    if (n <= 1 || from === undefined) {
      if (from !== undefined) for (let i = from; i < span; i += n) load[i] += 1;
      return;
    }
    movable.push({ u, n, from });
  });

  // Fewest choices first: an every-other-day room can only sit on one of two days,
  // so it must pick before a weekly that can go anywhere fits itself around it.
  movable.sort((a, b) => (a.n - b.n)
    || String(a.u.unit).localeCompare(String(b.u.unit), undefined, { numeric: true }));

  const moves = [];
  movable.forEach((m) => {
    // A room already due today is the hard case, and the common one: when every
    // every-other-day room falls due together there is no earlier day to move any of
    // them to, so nothing can prise them apart. It is going to be cleaned today
    // whatever happens, so the way to split the clump is an EXTRA clean on the
    // opposite day — one more clean, once, after which the room runs on its new day
    // for good. Nothing is ever delayed to tidy the schedule.
    // Two ways to move a room, and never a third: bring its next turn FORWARD, or
    // leave that turn where it is and give it one EXTRA clean later in the cycle.
    // Nothing is ever held back. The extra clean is what prises apart a clump that
    // is due now — there is no earlier day to move any of them to, so the only way
    // to break it up is to clean some of them twice, once, and let them carry on
    // from the opposite day thereafter.
    const cands = [];
    for (let at = Math.min(1, m.from); at <= m.from; at += 1) cands.push({ at, kind: 'earlier', keep: [] });
    for (let at = m.from + 1; at <= m.from + m.n - 1 && at < span; at += 1) cands.push({ at, kind: 'extra', keep: [m.from] });

    const inSeries = (i, at) => i >= at && (i - at) % m.n === 0;
    let best = { at: m.from, kind: 'earlier', keep: [] }, bestCost = Infinity;
    cands.forEach((c) => {
      let peak = 0, sq = 0;
      for (let i = 0; i < span; i += 1) {
        const v = load[i] + ((inSeries(i, c.at) || c.keep.includes(i)) ? 1 : 0);
        if (v > peak) peak = v;
        sq += v * v;
      }
      // Flatten the worst day first, then the shape as a whole. An extra clean is
      // real work, so it has to beat staying put outright rather than merely tie.
      const cost = peak * 10000 + sq + (c.kind === 'extra' ? 1 : 0);
      if (cost < bestCost - 1e-9) { bestCost = cost; best = c; }
    });

    best.keep.forEach((i) => { if (!inSeries(i, best.at)) load[i] += 1; });
    for (let i = best.at; i < span; i += m.n) load[i] += 1;
    if (best.at !== m.from) {
