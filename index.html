  if (!people.length) { if (silent) return; hikSyncMsg = { err: true, text: 'No one clocked in to assign rooms to.' }; render(); return; }
  const inIds = new Set(people.map((p) => p.id));
  const load = {}; people.forEach((p) => { load[p.id] = (loadSeed && loadSeed[p.id]) || 0; });

  const pool = onlyRooms || todaysRoomList().filter((u) => !cleanedToday(u));
  const rooms = pool.slice().sort((a, b) =>   // due today, of the kinds roll call covers
    (slotRank(a) - slotRank(b))                            // 🌅 early-preference rooms first → earliest arrivals
    || (b.priority ? 1 : 0) - (a.priority ? 1 : 0)                               // then priority ⭐ rooms
    || String(a.time || '~').localeCompare(String(b.time || '~'))               // then earliest scheduled time
    || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  if (!rooms.length) { if (silent) return; hikSyncMsg = { err: true, text: 'No rooms are due for cleaning today.' }; render(); return; }

  // Nothing handed out yet is the normal morning — don't make the common case
  // pay for a confirm. Only ask when there is real work to lose.
  const held = rooms.filter((u) => u.assignedTo);
  const signed = held.filter((u) => assignConfirmedToday(u)).length;
  if (held.length && !silent) {
    showConfirm(
      `Reassign all ${rooms.length} rooms?`,
      `${held.length} ${held.length === 1 ? 'is' : 'are'} already handed out`
        + (signed ? `, ${signed} of them checked` : '')
        + `. Rooms with a permanent cleaner stay with that person. You can undo it.`,
      () => runAutoAssign(rooms, people, inIds, load, slotSeed, silent),
      'Reassign',
      'safe'
    );
    return;
  }
  runAutoAssign(rooms, people, inIds, load, slotSeed, silent);
}

function runAutoAssign(rooms, people, inIds, load, slotSeed, silent) {
  // Snapshot before reshuffling. Auto-assign silently discards a morning of manual
  // assignments, and it sits one mis-tap away from the room list, so it needs to be
  // reversible rather than merely careful.
  state.lastAutoAssign = {
    at: new Date().toISOString(),
    who: rooms.reduce((m, u) => { m[u.id] = u.assignedTo || null; return m; }, {}),
    confirmed: rooms.reduce((m, u) => { if (state.assignConfirmed[u.id]) m[u.id] = state.assignConfirmed[u.id]; return m; }, {}),
  };
  // Start fresh: every room it hands out is a new suggestion awaiting a yes/no,
  // so any earlier sign-off for today is void.
  rooms.forEach((u) => { u.assignedTo = null; delete state.assignConfirmed[u.id]; });

  const order = people.map((p) => p.id);   // clocked-in ids, earliest arrival first
  const staffById = {};
  for (const s of (state.staff || [])) staffById[s.id] = s;
  // Nobody gets handed a kind of room they aren't cleared for — a trainee kept off
  // offices must stay off them however the room reaches them.
  // A LEADER IS NOT A FULL CLEANING ROUND. Leaders run their floor and answer for it,
  // so they carry at most four rooms, and two of those should be the early ones the
  // customer asked for — the round they have to be on the floor for anyway. Enforced
  // as a preference with a hard stop: anyone under their limit always wins the room,
  // and a leader only goes past four when nobody else in today is cleared for it at
  // all. When that happens the hand-out says so instead of quietly overloading them.
  const LEADER_ROOMS = 4, LEADER_EARLY = 2;
  const isLeader = (id) => !!(staffById[id] && staffById[id].isLeader);
  const capOf = (id) => isLeader(id) ? LEADER_ROOMS : Infinity;
  const underCap = (id) => (load[id] || 0) < capOf(id);
  const ableFor = (u) => {
    const all = order.filter((id) => canCleanUnit(staffById[id], u));
    const spare = all.filter(underCap);
    return spare.length ? spare : all;      // nobody spare — the room still gets cleaned
  };
  // Rotation: don't hand a room straight back to whoever cleaned it last time, so
  // nobody spends every morning on the same patch. Kept as a TIE-BREAK, never ahead
  // of load — an even split is the thing that was actually asked for, and rotation
  // that unbalances the morning to achieve variety would be a worse deal. With most
  // days tying on load anyway, this is what decides them.
  const repeats = (id, u) => (u.lastCleanedBy && id === u.lastCleanedBy) ? 1 : 0;
  const bestFor = (u, pool) => (pool || ableFor(u)).slice().sort((a, b) =>
    (load[a] - load[b])
    || (repeats(a, u) - repeats(b, u))
    || (order.indexOf(a) - order.indexOf(b)))[0] || null;
  const lightestFor = (u) => bestFor(u);

  // Pass 1: rooms with a time the customer asked for. Handing every morning room to
  // whoever badged in first is how one person ends up with a wall of them and can't
  // physically get them all done before lunch — which is the complaint the early flag
  // exists to prevent. So they are dealt round the crew: fewest morning rooms so far
  // wins, and arrival order only breaks the tie. The earliest in still get the first
  // ones, but once everyone has had one it comes round again, and everybody ends up
  // with a mixture of asked-for and ordinary rooms rather than one lopsided round.
  const slotLoad = { early: {}, late: {} };
  people.forEach((p) => {
    // Seeded with any asked-for rooms already carried in from the plan, so a partial
    // deal doesn't hand somebody a second helping of the early round.
    slotLoad.early[p.id] = (slotSeed && slotSeed.early && slotSeed.early[p.id]) || 0;
    slotLoad.late[p.id] = (slotSeed && slotSeed.late && slotSeed.late[p.id]) || 0;
  });
  const spreadSlot = (slot) => {
    rooms.filter((u) => !u.assignedTo && timeSlot(u) === slot).forEach((u) => {
      // A leader still short of their two early rooms takes the next one going. Every
      // early room is dealt in this pass, so it is the only place the quota can be met.
      const owed = (id) => (slot === 'early' && isLeader(id) && slotLoad.early[id] < LEADER_EARLY) ? 0 : 1;
      const pick = ableFor(u).sort((a, b) =>
        (owed(a) - owed(b))                               // a leader owed their early rooms first
        || (slotLoad[slot][a] - slotLoad[slot][b])        // nobody carries them all
        || (load[a] - load[b])                            // then whoever has least overall
        || (repeats(a, u) - repeats(b, u))                // then not the same person as last time
        || (order.indexOf(a) - order.indexOf(b)))[0];     // then whoever got here first
      if (pick) { u.assignedTo = pick; load[pick]++; slotLoad[slot][pick]++; }
    });
  };
  spreadSlot('early');
  spreadSlot('late');
  // Pass 2: remaining rooms keep their usual cleaner if that person clocked in.
  let kept = 0;
  rooms.forEach((u) => {
    if (!u.assignedTo && u.usualTo && inIds.has(u.usualTo) && canCleanUnit(staffById[u.usualTo], u)
        && underCap(u.usualTo)) {
      u.assignedTo = u.usualTo; load[u.usualTo]++; kept++;
    }
  });
  // Pass 3: keep a room with whoever owns its floor, if they clocked in. Floors are
  // already how the building is divided up, and a cleaner working one floor walks a
  // lot less than one chasing rooms across eleven of them.
  let onFloor = 0;
  rooms.forEach((u) => {
    if (u.assignedTo) return;
    const owner = ownerOfFloor(floorOfUnit(u.unit));
    if (owner && inIds.has(owner.id) && canCleanUnit(owner, u) && underCap(owner.id)) {
      u.assignedTo = owner.id; load[owner.id]++; onFloor++;
    }
  });
  // Pass 4: rooms on a floor a TEAM owns go to that team, spread across whichever
  // of its members clocked in. The leader answers for the zone; the app just keeps
  // the work inside the right team rather than scattering it building-wide.
  let onTeam = 0;
  rooms.forEach((u) => {
    if (u.assignedTo) return;
    const t = teamOfFloor(floorOfUnit(u.unit));
    if (!t) return;
    const allMates = teamMembers(t.name).filter((p) => inIds.has(p.id) && canCleanUnit(p, u));
    const spareMates = allMates.filter((p) => underCap(p.id));
    const mates = spareMates.length ? spareMates : allMates;
    if (!mates.length) return;                    // nobody from that team in today who can take it
    const pick = mates.slice().sort((a, b) =>
      ((load[a.id] || 0) - (load[b.id] || 0))
      || (repeats(a.id, u) - repeats(b.id, u))
      || (order.indexOf(a.id) - order.indexOf(b.id)))[0];
    u.assignedTo = pick.id; load[pick.id]++; onTeam++;
  });
  // Pass 5: whatever is left goes to whoever's carrying the fewest (earliest breaks ties).
  let unstaffed = 0;
  rooms.filter((u) => !u.assignedTo).forEach((u) => {
    const pick = lightestFor(u);
    if (pick) { u.assignedTo = pick; load[pick]++; } else unstaffed++;   // nobody in today is cleared for it
  });
  // Pass 6: even it out. Keeping a cleaner on their own floor or inside their team's
  // zone saves a lot of walking, but those are preferences, not promises — left to
  // themselves they hand one person five rooms while four others carry two, because
  // ownership is decided before anything counts the load. So whatever is still
  // lopsided gets moved: rooms with a permanent cleaner stay put, and so do rooms the
  // customer asked a time for, since both were somebody's deliberate decision.
  // A room the customer asked a time for never moves — that is the customer's call,
  // not a load-balancing decision.
  // A PERMANENT CLEANER IS NOW ABSOLUTE. It used to be broken as a last resort when
  // nothing else could close the gap, on the reasoning that most pins were accidents
  // of having been assigned by hand once. That is no longer how they are set: rooms
  // are pinned deliberately, so the same person has the same rooms and knows them.
  // A hand-out that quietly moved them was undoing the decision every morning. The
  // cost is real and accepted — a day whose pins fall unevenly now STAYS uneven, and
  // the only fix is to re-pin, which is a decision for the office rather than the app.
  // A ROOM SITTING WITH ITS FLOOR'S OWNER STAYS THERE. Floors are how the building
  // is divided up, and a cleaner working one floor walks a fraction of what one
  // chasing rooms across eleven of them does. Levelling used to treat that as a
  // preference and move the room anyway, which put people back on the stairs every
  // morning. Only a room whose floor owner is not in today — so it never reached
  // them in the first place — is still free to move.
  const withFloorOwner = (u) => {
    const owner = ownerOfFloor(floorOfUnit(u.unit));
    return !!owner && u.assignedTo === owner.id;
  };
  const freeToMove = (u) => !u.usualTo && timeSlot(u) === 'any' && !withFloorOwner(u);
  let moved = 0;
  for (let guard = rooms.length * 4; guard > 0; guard -= 1) {
    const ranked = order.slice().sort((a, b) => load[a] - load[b]);
    const hi = ranked[ranked.length - 1];
    if (load[hi] - load[ranked[0]] <= 1) break;             // as even as it can get
    let done = false;
    // Unpinned rooms first, everywhere they can help, before disturbing any pin.
    for (const pass of [freeToMove]) {
      for (const lo of ranked) {
        if (load[hi] - load[lo] <= 1) break;
        if (!underCap(lo)) continue;   // never level a room ONTO a leader who is full
        const cands = rooms.filter((u) => u.assignedTo === hi && pass(u) && canCleanUnit(staffById[lo], u));
        // Of the rooms that could move, shift one this person didn't clean last time.
        const move = cands.find((u) => !repeats(lo, u)) || cands[0];
        if (!move) continue;
        move.assignedTo = lo; load[hi] -= 1; load[lo] += 1; moved += 1;
        done = true; break;
      }
      if (done) break;
    }
    if (!done) break;                                        // nothing left that can legally move
  }

  const notes = [];
  if (moved) notes.push(`${moved} moved to even it out`);
  // Pinned rooms do not move, so the split can end lopsided and the office needs to
  // know it did — a silent gap reads as an even morning that simply went wrong.
  {
    const counts = order.map((id) => load[id]);
    const gap = counts.length ? Math.max(...counts) - Math.min(...counts) : 0;
    if (gap > 1) notes.push(`still ${gap} apart — the rest are pinned to a cleaner or a floor`);
  }
  if (kept) notes.push(`${kept} kept with their usual crew`);
  if (onFloor) notes.push(`${onFloor} kept on their own floor`);
  if (onTeam) notes.push(`${onTeam} kept in their team's zone`);
  if (unstaffed) notes.push(`${unstaffed} left unassigned — nobody in today is cleared for them`);
  // THE RULES, CHECKED OUT LOUD. A leader over four rooms, or short of their two
  // early ones, is a day that needs a human decision — so it is said with the name
  // and the number rather than left for somebody to spot on the board.
  const breaches = [];
  const leaders = order.filter(isLeader);
  // Only hold the early quota against the deal when there were actually enough early
  // rooms to meet it. With six leaders on and three early rooms in the building, "everyone
  // is short of two" is not a fault in the hand-out — it is arithmetic, and reporting it
  // every morning would turn the one warning that matters into noise nobody reads.
  const earlyGoing = rooms.filter((u) => timeSlot(u) === 'early').length;
  const earlyEnough = earlyGoing >= leaders.length * LEADER_EARLY;
  leaders.forEach((id) => {
    const nm = String((staffById[id] || {}).name || '').split(' ')[0];
    if (load[id] > LEADER_ROOMS) breaches.push(`${nm} has ${load[id]} rooms, limit is ${LEADER_ROOMS}`);
    else if (earlyEnough && slotLoad.early[id] < LEADER_EARLY) breaches.push(`${nm} has ${slotLoad.early[id]} early of ${LEADER_EARLY}`);
  });
  // Everybody a leader means everybody capped, and the building can quietly stop fitting
  // in the people who are on. Say it once, here, rather than as a room nobody was given.
  if (leaders.length === order.length && rooms.length > order.length * LEADER_ROOMS) {
    breaches.push(`everyone on is tagged Leader, so the whole crew is capped at ${LEADER_ROOMS} — `
      + `${rooms.length} rooms will not fit into ${order.length * LEADER_ROOMS}`);
  }
  hikSyncMsg = breaches.length
    ? { err: true, text: `Handed out ${rooms.length} rooms, but the leader rules could not be met: `
        + `${breaches.join('; ')}. Tap a room to move it, or bring someone else in.` }
    : { text: (silent ? `${people.length} cleaner${people.length === 1 ? ' is' : 's are'} badged in, so ` : '')
        + `${silent ? 'the ' : 'Suggested '}${rooms.length} rooms ${silent ? 'were shared out again' : `for ${people.length} cleaners`}`
        + `${notes.length ? ` (${notes.join(', ')})` : ''} — check each one below.` };
  save(); render();
}

// --- Hik-Connect staff sync ---
let hikSyncMsg = null;
async function syncFromHik() {
  if (!db) { hikSyncMsg = { err: true, text: 'Server not connected.' }; render(); return; }
  hikSyncMsg = { text: 'Syncing staff from Hik-Connect…' };
  render();
  try {
    const { data, error } = await db.functions.invoke('hik-sync', { body: {} });
    if (error) throw error;
    if (!data || !data.ok) throw new Error(data && data.error ? data.error : 'Sync failed');
    const persons = data.persons || [];
    if (!Array.isArray(state.staff)) state.staff = [];
    const defaultCrew = (getTeams()[0] && getTeams()[0].name) || 'Team A';
    let added = 0, matched = 0;
    for (const p of persons) {
      // Match existing staff by Hik id, then badge code, then name — so re-syncs don't duplicate.
      const s = state.staff.find((x) => x.hikPersonId && x.hikPersonId === p.personId)
        || state.staff.find((x) => x.hikCode && p.personCode && x.hikCode === p.personCode)
        || state.staff.find((x) => (x.name || '').trim().toLowerCase() === (p.name || '').trim().toLowerCase());
      if (s) {
        s.hikPersonId = p.personId; s.hikCode = p.personCode; if (p.name) s.name = p.name;
        matched++;
      } else {
        state.staff.push({ id: 'p' + p.personId, name: p.name, crew: defaultCrew, color: teamColor(defaultCrew), floors: [], hikPersonId: p.personId, hikCode: p.personCode });
        added++;
      }
    }
    STAFF = state.staff;
    STAFF.forEach((pp) => { if (!state.attendance[pp.id]) state.attendance[pp.id] = 'present'; });
    save();
    await loadHikArrivals();
    const arr = Object.keys(hikArrivals).length;
    hikSyncMsg = { text: `Synced ${persons.length} staff — ${added} added, ${matched} matched. ${arr} badged in today${hikUnknown.length ? `, ${hikUnknown.length} unknown` : ''}.` };
    render();
  } catch (e) {
    hikSyncMsg = { err: true, text: 'Sync failed: ' + ((e && e.message) || e) };
    render();
  }
}

// Today's badge-in events → first arrival per person, matched to staff by name.
let hikArrivals = {};   // staff id -> { time }
let hikUnknown = [];    // [{ name, time }] badged in but no matching staff (the "unknown" alert)
let hikOther = [];      // [{ id, name, time }] known staff who badged in but aren't tagged as cleaners
let selectedDay = null; // which day Roll Call is showing (null = today)
function fmtEventTime(v) {
  if (!v) return '';
  const s = String(v);
  // Pull HH:MM straight from the string (EAT wall-clock) — no timezone shifting.
  const m = s.match(/(?:[ T])(\d{1,2}):(\d{2})/) || s.match(/^(\d{1,2}):(\d{2})/);
  if (m) { let h = parseInt(m[1], 10); const min = m[2]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + min + ' ' + ap; }
  const d = /^\d{10,}$/.test(s) ? new Date(Number(s)) : new Date(s);
  return isNaN(d.getTime()) ? s : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
// Load arrivals for the selected day (defaults to today), matched to staff by name.
async function loadHikArrivals() {
  if (!db) return;
  const res = await arrivalsForDay(selectedDay || todayKey());
  if (!res) return;               // read failed → keep the arrivals we already had
  hikArrivals = res.arrivals; hikUnknown = res.unknown; hikOther = res.other;
  hikLastPull = new Date();       // an empty roll call means "checked, nobody in" — not "no idea"
}

// One day's badge events, matched to staff, returned rather than stored. Any day
// can be looked up without disturbing what Roll Call is showing — recording last
// night's work needs yesterday's names while the tab still shows today's.
// Returns null when the read failed, so "nobody in" stays distinguishable.
async function arrivalsForDay(day) {
  if (!db) return null;
  try {
    const { data, error } = await db.from('hik_events')
      .select('person_name,person_code,event_time')
      .like('event_time', day + '%')              // only the selected day's scans
      .order('event_time', { ascending: true });  // earliest first
    if (error) throw error;
    const firstByName = {}, lastByName = {};
    for (const e of (data || [])) {
      const key = (e.person_name || '').trim().toLowerCase();
      if (!key) continue;
      if (!firstByName[key]) firstByName[key] = e;   // earliest (data ordered ascending) = In
      lastByName[key] = e;                           // keep overwriting → latest = Out
    }
    // Only surface CLEANERS on the roll call (once any cleaner is tagged). Everyone is
    // still matched, but non-cleaner staff (office/management) are dropped silently.
    const cleaners = (state.staff || []).filter((p) => p.isCleaner);
    const onlyCleaners = cleaners.length > 0;
    const cleanerByName = {};
    for (const s of cleaners) cleanerByName[(s.name || '').trim().toLowerCase()] = s;
    const staffByName = {};
    for (const s of (state.staff || [])) staffByName[(s.name || '').trim().toLowerCase()] = s;
    const arrivals = {}, unknown = [], other = [];
    for (const key in firstByName) {
      const e = firstByName[key];
      const t = fmtEventTime(e.event_time);
      const outE = lastByName[key];
      const outT = (outE && outE.event_time !== e.event_time) ? fmtEventTime(outE.event_time) : null;
      const s = onlyCleaners ? cleanerByName[key] : staffByName[key];   // case-insensitive name match
      if (s) arrivals[s.id] = { time: t, out: outT, raw: e.event_time };
      // The door reader sees everyone, cleaners or not. Keep the non-cleaners out
      // of the roll call, but don't drop them without trace — silently vanishing
      // makes an untagged cleaner look like someone who never turned up.
      else if (onlyCleaners && staffByName[key]) other.push({ id: staffByName[key].id, name: staffByName[key].name, time: t });
      else unknown.push({ name: e.person_name, time: t });
    }
    mergeManualArrivals(day, arrivals);   // people the office added by hand (forgot to badge)
    return { arrivals, unknown, other };
  } catch (e) { return null; }
}
// Work out each cleaner's rest days from the badge history instead of asking the
// office to type in eight rotas. Matched on name, the same way the roll call reads
// the door events, so what this infers and what shows up each morning agree.
//
// Judged per weekday, not overall: someone in every day but Friday is 86% present
// and would look like perfect attendance. A weekday needs enough occurrences in the
// window to mean anything, and only a clear result counts — anything in between is
// left alone rather than guessed at, because the office can see its own crew and a
// wrong rest day is worse than no rest day.
// Six weeks: long enough for an alternating Friday to show up as a pattern rather
// than a coincidence, and inside the 45 days the scrapes are kept for.
const ROTA_WINDOW_DAYS = 42;
const ROTA_MIN_SAMPLES = 3;      // fewer than this of a given weekday says nothing
const ROTA_OFF_AT = 0.2;         // in 20% of them or less → a rest day
const ROTA_ON_AT = 0.5;          // half or more → a working day
const ROTA_MIN_OVERALL = 0.35;   // below this they're too irregular to read at all
async function inferRotasFromAttendance(windowDays) {
  if (!db) return null;
  const from = shiftDay(todayKey(), -Math.abs(windowDays || 42));
  try {
    const { data, error } = await db.from('hik_events')
      .select('person_name,event_time')
      .gte('event_time', from)
      .order('event_time', { ascending: true });
    if (error) throw error;
    const seen = {};                                   // day -> Set of lowercased names
    for (const e of (data || [])) {
      const day = String(e.event_time || '').slice(0, 10);
      const key = (e.person_name || '').trim().toLowerCase();
      if (!day || !key) continue;
      (seen[day] = seen[day] || new Set()).add(key);
    }
    const days = Object.keys(seen).sort();
    if (!days.length) return { days: 0, proposals: [], skipped: [] };
    const dowTotal = {};
    days.forEach((d) => { const w = new Date(d + 'T00:00:00').getDay(); dowTotal[w] = (dowTotal[w] || 0) + 1; });
    const proposals = [], skipped = [];
    cleaningStaff().forEach((p) => {
      const key = (p.name || '').trim().toLowerCase();
      const hit = {};
      let total = 0;
      days.forEach((d) => {
        if (!seen[d].has(key)) return;
        total += 1;
        const w = new Date(d + 'T00:00:00').getDay();
        hit[w] = (hit[w] || 0) + 1;
      });
      if (total / days.length < ROTA_MIN_OVERALL) {
        skipped.push({ name: p.name, reason: 'in on only ' + Math.round((total / days.length) * 100) + '% of days' });
        return;
      }
      const worksOn = [], off = [], unclear = [];
      for (let w = 0; w < 7; w += 1) {
        const tot = dowTotal[w] || 0;
        if (tot < ROTA_MIN_SAMPLES) { worksOn.push(w); unclear.push(w); continue; }  // no evidence → leave them on
        const rate = (hit[w] || 0) / tot;
        if (rate <= ROTA_OFF_AT) off.push(w);
        else if (rate >= ROTA_ON_AT) worksOn.push(w);
        else { worksOn.push(w); unclear.push(w); }
      }
      if (!off.length) return;                          // nothing to change
      proposals.push({ id: p.id, name: p.name, worksOn, off, unclear });
    });
    return { days: days.length, proposals, skipped };
  } catch (e) { return null; }
}

function applyRotas(proposals) {
  proposals.forEach((r) => {
    const p = (state.staff || []).find((x) => x.id === r.id);
    if (p) p.worksOn = r.worksOn.length === 7 ? null : r.worksOn;
  });
  save(); render();
}

let hikLastPull = null;
// Roll call is read at 6am while people are still badging in, so re-check on a timer
// rather than making the office pull-to-refresh. Only redraws when something changed,
// so an open dropdown isn't yanked away mid-assignment.
let _arrivalPoll = null;
function startArrivalPolling() {
  clearInterval(_arrivalPoll);
  _arrivalPoll = setInterval(async () => {
    // Only the picker blocks a poll now. This used to stop unless you were sitting
    // on the Roll Call tab with the screen awake — but Hik's Time Card fills in

// Import a Hik export (Time Card or Access Record) → store check-ins → refresh Roll Call.
async function importAttendance(file) {
  hikSyncMsg = { text: 'Reading attendance file…' }; render();
  try {
    if (typeof XLSX === 'undefined') throw new Error('Spreadsheet reader not loaded — check your connection and retry.');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    let hdr = -1, C = {};
    for (let i = 0; i < rows.length; i++) {
      const r = (rows[i] || []).map((x) => String(x || '').trim().toLowerCase());
      if (r.includes('first name') && r.some((x) => x.includes('record'))) {
        hdr = i; C = { fmt: 'timecard', first: r.indexOf('first name'), last: r.indexOf('last name'), id: r.indexOf('id'), date: r.indexOf('date'), rec: r.findIndex((x) => x.includes('record')) }; break;
      }
      if (r.includes('name') && r.some((x) => x.includes('time'))) {
        hdr = i; C = { fmt: 'access', name: r.indexOf('name'), id: r.indexOf('id'), time: r.findIndex((x) => x.includes('time')) }; break;
      }
    }
    if (hdr < 0) throw new Error('Could not recognise the columns in this file.');
    const map = {};
    for (let i = hdr + 1; i < rows.length; i++) {
      const row = rows[i] || [];
      let name = '', code = '', date = '', times = [];
      if (C.fmt === 'timecard') {
        name = ((row[C.first] || '') + ' ' + (row[C.last] || '')).trim();
        code = String(row[C.id] || '').trim();
        date = String(row[C.date] || '').trim().slice(0, 10);
        times = String(row[C.rec] || '').split(/[;,]/).map((t) => t.trim()).filter((t) => /\d{1,2}:\d{2}/.test(t));
      } else {
        name = String(row[C.name] || '').trim();
        code = String(row[C.id] || '').trim();
        const ts = String(row[C.time] || '').trim();
        const dm = ts.match(/(\d{4}-\d{2}-\d{2})/); const tm = ts.match(/(\d{1,2}:\d{2})/);
        date = dm ? dm[1] : ''; times = tm ? [tm[1]] : [];
      }
      if (!name || !date || !times.length) continue;
      const first = times.slice().sort()[0];
      const et = date + ' ' + first;
      const key = name.toLowerCase() + '|' + date;
      if (!map[key] || et < map[key].event_time) map[key] = { person_name: name, person_code: code, event_time: et };
    }
    const records = Object.values(map);
    if (!records.length) throw new Error('No check-in rows found in the file.');
    if (db) {
      await db.from('hik_events').upsert(records.map((r) => ({ ...r, event_type: 'imported', raw: { source: 'import' } })), { onConflict: 'person_name,event_time', ignoreDuplicates: true });
    }
    const days = [...new Set(records.map((r) => r.event_time.slice(0, 10)))].sort();
    selectedDay = days[days.length - 1];   // show the latest day found in the file
    await loadHikArrivals();
    const matched = Object.keys(hikArrivals).length;
    let msg = `Imported ${records.length} check-ins (${days.length === 1 ? days[0] : days.length + ' days'}) — ${matched} matched.`;
    if (hikUnknown.length) msg += ` ${hikUnknown.length} not matched: ${hikUnknown.map((u) => u.name).join(', ')}.`;
    hikSyncMsg = { text: msg };
    render();
  } catch (e) {
    hikSyncMsg = { err: true, text: 'Import failed: ' + ((e && e.message) || e) };
    render();
  }
}
function editServicedUnit(id, newUnit, newGuest, lastCleaned, note, newType) {

      alert('Room ' + label + ' already exists — pick a different number.');
      return;
    }
    u.unit = label;
  }
  u.guest = (newGuest || '').trim();   // allow clearing the name too
  if (lastCleaned !== undefined) {
    // A date typed in here is a cleaning that happened, so log it like one. Setting
    // only the baseline moved the schedule but left that day missing from History,
    // which reads as "nobody cleaned this room" long after the fact.
    const wasLast = u.lastCleaned || null;
    u.lastCleaned = lastCleaned || null;                                // manual "last cleaned on" baseline
    if (u.lastCleaned && u.lastCleaned !== wasLast) logClean(u, u.lastCleaned);
  }
  if (note !== undefined) u.note = (note || '').trim();                 // free-text preference note

}
function startEditUnit(id) { state.editingUnit = id; render(); }
function cancelEditUnit() { state.editingUnit = null; render(); }
function toggleServicedDone(id) {
  // Keyed by the WORK day, not the calendar day: a tick at 00:30 belongs to the
  // round the crew is still on, not to the morning that has just started.
  const k = 'su:' + id + '::' + workToday();
  const unit = state.servicedUnits.find(u => u.id === id);
  if (!state.logRefs) state.logRefs = {};
  if (!state.lastCleanUndo) state.lastCleanUndo = {};
  if (!state.untick) state.untick = {};
  if (state.completions[k]) {
    // Un-mark: clear the checkmark and remove the history entry we created for it.
    delete state.completions[k];
    // AND LEAVE A HEADSTONE. Ticks now merge across devices rather than being
    // overwritten, so without a record of the un-tick it would simply travel back
    // from the next phone whose copy still had it.
    state.untick[k] = todayKey();
    const ref = state.logRefs[k];
    if (ref) { unlogClean(ref); delete state.logRefs[k]; }
    // Put the room's own record back to what it was before this tick — otherwise
    // an un-tick leaves today's date behind as the last clean.
    const undo = state.lastCleanUndo[k];
    if (unit && undo) {
      unit.lastCleaned = undo.date || null;
      unit.lastCleanedBy = undo.by || null;
      unit.lastCleanedByName = undo.byName || null;
      delete state.lastCleanUndo[k];
    }
    save(); render();
  } else {
    // Mark clean: check it off now, then log who + when to history.
    state.completions[k] = true;
    delete state.untick[k];          // ticked again — the headstone no longer applies
    if (unit) {
      // Stamp the room itself, not just the history log. The log holds only the
      // newest 1000 rows for the whole building, so a room cleaned rarely drops out
      // of it and the app forgets it was ever cleaned — which is what left rooms
      // sitting permanently "due" and made the last-cleaned line come and go.
      state.lastCleanUndo[k] = {
        date: unit.lastCleaned || null,
        by: unit.lastCleanedBy || null,
        byName: unit.lastCleanedByName || null,

      const who = resolveCleanerFor(unit, null);
      unit.lastCleaned = workToday();

    }
    save(); render();
    if (unit) logClean(unit).then((logId) => {

    });

}

// Everything still open on this morning's roll call, in the order the roll call
// itself shows it. Airbnb and anything else switched off in Settings stays out —
// onRollCall already excludes it, and it is a separate job with its own tab.
// THE PLAN IS TODAY'S LIST.
// The roll call used to work out its own rooms from each room's dates, while the
// plan lived in state.plans — two derivations of the same morning, which is why a
// day you planned last night turned up on the board with different rooms on it.
// When a plan exists for today it IS the list; without one, the schedule decides
// as it always did.
function plannedRoomsToday() {
  // The WORK day, like everything else that asks what the crew is on. Keyed by the
  // calendar day, a round still running at 1am read tomorrow's plan instead of its own.
  const day = workToday();
  const plan = (state.plans || {})[day];
  if (!plan) return null;
  const jobs = Object.values(plan);
  if (!jobs.length) return null;
  const byId = {};
  (state.servicedUnits || []).forEach((u) => { byId[u.id] = u; });
  const areasById = {};
  areasInterior().forEach((a) => { areasById[a.id] = a; });
  const rooms = jobs.filter((j) => j.kind === 'unit').map((j) => byId[j.refId])
    .filter((u) => u && onRollCall(u) && !u.paused);
  const areas = jobs.filter((j) => j.kind !== 'unit').map((j) => areasById[j.refId]).filter(Boolean);

  // WORK THAT WAS MISSED. A day ahead is planned from a projection that assumes
  // each day gets done — which is how it stops every-other-day rooms landing on all
  // seven days. But somebody does not come in, their rooms are not cleaned, and
  // tomorrow's plan was drawn up believing they were. Now that the plan IS the
  // board, such a room would simply disappear rather than be carried forward.
  // Anything planned on an earlier day and never done is added to today.
  const seen = new Set(rooms.map((u) => u.id));
  const seenA = new Set(areas.map((a) => a.id));
  Object.keys(state.plans || {}).forEach((d) => {
    if (d >= day) return;                       // only days already gone
    Object.values(state.plans[d]).forEach((j) => {
      if (j.kind === 'unit') {
        const u = byId[j.refId];
        if (!u || seen.has(u.id) || !onRollCall(u) || u.paused) return;
        if (fixedDays(u)) return;                          // pinned rooms live on their own days
        if (String(lastCleanDate(u) || '') >= d) return;   // it did get done, on the day or since
        seen.add(u.id); rooms.push(u);
      } else {
        const a = areasById[j.refId];
        if (!a || seenA.has(a.id) || areaDone(a)) return;
        seenA.add(a.id); areas.push(a);
      }
    });
  });
  return (rooms.length || areas.length) ? { rooms, areas } : null;
}
// PLANNED FOR TODAY, BUT DELIBERATELY NOT ON THE ROLL CALL. Airbnb is run as its
// own job — its own pair, after the offices — and it belongs off the morning board.
// But dropping those rooms in silence is indistinguishable from a plan that never
// saved: the banner says "from the plan you made for today" while part of that plan
// is nowhere on screen. So they are named instead of vanishing, and handed out from
// the roll call once the morning's own rooms are done.
function plannedOffRollCall() {
  const day = workToday();
  const plan = (state.plans || {})[day];
  if (!plan) return [];
  const byId = {};
  (state.servicedUnits || []).forEach((u) => { byId[u.id] = u; });
  const seen = new Set();
  return Object.values(plan)
    .filter((j) => j.kind === 'unit')
    .map((j) => byId[j.refId])
    .filter((u) => u && !onRollCall(u) && !u.paused && !seen.has(u.id) && seen.add(u.id))
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
}

// WHY IS THIS ROOM HERE? The commonest question asked of this screen, and until now
// the only way to answer it was to open the room, read its frequency, read its last
// clean, and do the arithmetic. The rule that put it on the list is known exactly —
// it is the same rule dueOnDayFrom applies — so it is simply said.
function dueReason(u) {
  const day = workToday();
  const last = lastCleanDate(u);
  const lastTxt = last ? 'Last cleaned ' + fmtDay(last) : 'No cleaning has ever been recorded';
  if (u.paused) return 'This room is paused, so it should not be on any list at all. ' + lastTxt + '.';
  if (extraCleanDue(u, day)) return 'An extra clean was asked for today (' + fmtDay(day) + '). ' + lastTxt + '.';
  if (heldBack(u, day)) return 'It is held back until ' + fmtDay(u.holdUntil) + ', so it should not be here. ' + lastTxt + '.';
  const days = fixedDays(u);
  if (days) {
    const named = DOW_PICK_ORDER.filter((d) => days.indexOf(d) >= 0).map((d) => DOW_LABEL[d]).join(', ');
    return 'It is pinned to fixed days: ' + named + '. Today is ' + DOW_LABEL[dowOf(day)] + ', so it is on.\n\n'
      + 'A pinned room goes by its days and nothing else — ' + lastTxt.toLowerCase()
      + ', and changing that date will not take it off today. Clear its days if you want it back on a cycle.';
  }
  if (!last) {
    return 'No cleaning has ever been recorded for this room, so it counts as due — the app cannot tell '
      + 'a room nobody has cleaned from one nobody has told it about.\n\n'
      + 'Set "Last cleaned" on it and it drops into its ' + String(FREQ_LABEL[u.freq] || 'Daily').toLowerCase() + ' cycle.';
  }
  if (cleanedToday(u)) {
    return 'It was cleaned today, and cleaned rooms stay on the list with a ✓ so the morning does not '
      + 'shrink as the crew works through it.\n\n' + lastTxt + ' · ' + (FREQ_LABEL[u.freq] || 'Daily') + '.';
  }
  const nd = nextDueDate(u);

function showDueReason(u) {

}

// Today's rooms, planned or derived — the one answer both the panel and the
// close-out read, so they can no longer disagree.
// EVERYTHING DUE, PLUS EVERYTHING PLANNED. It used to be one or the other: a plan
// for today REPLACED the roll call, so a room the schedule said was due but the plan
// had never listed simply vanished — and a room that was planned but not otherwise
// due vanished the other way, because the hand-out only ever deals from what is due.
// Both happened, days apart, to 105 and then 803, and neither showed up as late or
// missing anywhere: the room was just absent, which is the one failure the office
// cannot see. A union cannot lose a room in either direction. The cost is that a plan
// can no longer take a due room OFF the day — that is what the room's own schedule,
// pause, or hold is for.
function todaysRoomList() {
  const due = (state.servicedUnits || []).filter((u) => onRollCall(u) && onTodaysList(u));
  const planned = plannedRoomsToday();
  if (!planned) return due;
  const seen = new Set(due.map((u) => u.id));
  return due.concat(planned.rooms.filter((u) => u && !seen.has(u.id)));
}
// "Mark all 20 as cleaned" over fourteen rooms and six communal walks is a number

function markAllLabel(nRooms, nAreas) {

  if (nRooms) parts.push(nRooms + ' room' + (nRooms === 1 ? '' : 's'));
  if (nAreas) parts.push(nAreas + ' area' + (nAreas === 1 ? '' : 's'));
  return '✓ Mark all ' + (parts.join(' + ') || '0') + ' as cleaned';

function rollCallOutstanding() {
  const planned = plannedRoomsToday();
  if (planned) {
    return {
      rooms: planned.rooms.filter((u) => !cleanedToday(u)),
      areas: planned.areas.filter((a) => !areaDone(a)),
    };
  }

// Everything still outstanding on tonight's round. Unlike the morning roll call
// this is the whole night's work — Airbnb and anything else kept off roll call is
// still cleaned tonight, by its own crew. Built from suggestedJobsFor so tonight's
// list and the day plan can never disagree, and reused by the view that draws it.
function tonightOutstanding() {
  const day = workToday();
  const unitById = {}; (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const areaById = {}; (state.areas || []).forEach((a) => { areaById[a.id] = a; });
  // suggestedJobsFor already drops areas ticked off for this day; rooms need the
  // cleaned-today check because a room can be cleaned without its plan changing.
  const jobs = suggestedJobsFor(day).filter((j) =>
    j.kind === 'unit' ? (unitById[j.id] && !cleanedToday(unitById[j.id])) : !!areaById[j.id]);
  return {
    day,
    jobs,
    rooms: jobs.filter((j) => j.kind === 'unit').map((j) => unitById[j.id]),

// At hand-over the answer is nearly always "all of it", and ticking each job
// separately was one tap, one save and one insert per job. This closes a whole
// list in a single write. Each item keeps its own history reference, so any one of
// them can still be un-ticked afterwards exactly as if it had been ticked alone.
// Shared by the roll call and tonight's round — only the starting list differs.
function confirmBulkMarkDone(rooms, areas, what) {
  const total = rooms.length + areas.length;
  if (!total) return;
  const parts = [];
  if (rooms.length) parts.push(rooms.length + ' room' + (rooms.length === 1 ? '' : 's'));
  if (areas.length) parts.push(areas.length + ' communal area' + (areas.length === 1 ? '' : 's'));
  showConfirm(
    'Mark all ' + total + ' as cleaned?',
    'Everything still open on ' + what + ' — ' + parts.join(' and ') + ' — will be recorded as cleaned now, '
      + 'each credited to the person it is assigned to (anything unassigned goes down as Office). '
      + 'They all go into History, and you can un-tick any of them one by one.',
    () => runBulkMarkDone(rooms, areas),
    'Mark all cleaned',
    'safe'
  );
}

function markRollCallAllDone() {
  const { rooms, areas } = rollCallOutstanding();
  confirmBulkMarkDone(rooms, areas, "this morning's roll call");
}

function markTonightAllDone() {
  const { rooms, areas } = tonightOutstanding();
  confirmBulkMarkDone(rooms, areas, "tonight's round");
}

async function runBulkMarkDone(rooms, areas) {
  if (!state.logRefs) state.logRefs = {};
  if (!state.lastCleanUndo) state.lastCleanUndo = {};
  if (!state.untick) state.untick = {};
  // Same work day the single tick uses, so a close-out after midnight lands on the
  // round the crew is still on rather than the morning that has just started.
  const day = workToday();
  const entries = [];
  rooms.forEach((u) => {
    const k = 'su:' + u.id + '::' + day;
    state.lastCleanUndo[k] = {
      date: u.lastCleaned || null,
      by: u.lastCleanedBy || null,
      byName: u.lastCleanedByName || null,
    };
    const who = resolveCleanerFor(u, null);
    state.completions[k] = true;
    delete state.untick[k];
    u.lastCleaned = day;
    u.lastCleanedBy = who.id;
    u.lastCleanedByName = who.name;
    entries.push({ key: k, u, who: who.id });
  });
  areas.forEach((a) => {
    state.completions[areaDoneKey(a)] = true;
    delete state.untick[areaDoneKey(a)];
    entries.push({ key: areaDoneKey(a), u: areaAsUnit(a), who: a.assignedTo || 'office' });
  });
  // Show it done straight away — the write follows, and a failure surfaces its own
  // warning rather than holding the screen while the crew is waiting.
  save(); render();
  const ids = await logCleanMany(entries.map(({ u, who }) => ({ u, who })), null);
  // Ids come back in insert order. Only pair them up when the counts agree —
  // a mismatch would attach the wrong history row to the wrong tick.
  if (ids && ids.length === entries.length) {
    entries.forEach((e, i) => { state.logRefs[e.key] = ids[i]; });
    save();
  }
}

// One card for a communal area wherever it needs doing, so an area can't read as
// done in one place and open in another. presentOnly limits the names to whoever
// clocked in — right for Roll Call, wrong for the Buildings tab.
function areaWorkCard(a, opts) {
  opts = opts || {};
  const presentOnly = !!opts.presentOnly;
  const done = areaDone(a);
  const item = el(`<div class="area-item ${done ? 'done' : ''}"></div>`);

  // Renaming happens where the list is built, not where it's worked.
  if (opts.manage && state.editingArea === a.id) {
    const ed = el(`<div style="padding:8px 9px"></div>`);
    const inp = el(`<input id="bldArea_${a.id}" value="${esc(a.label)}" style="margin-bottom:8px">`);
    ed.appendChild(inp);
    const erow = el(`<div style="display:flex;gap:6px"></div>`);
    const sv = el(`<button class="freqmini on" style="padding:7px 10px">Save</button>`);
    sv.onclick = () => renameArea(a.id, document.getElementById('bldArea_' + a.id).value);
    const cn = el(`<button class="freqmini" style="padding:7px 10px">Cancel</button>`);
    cn.onclick = () => { state.editingArea = null; render(); };
    erow.appendChild(sv); erow.appendChild(cn);
    ed.appendChild(erow);
    item.appendChild(ed);
    return item;
  }

  const row = el(`<div class="area-row"></div>`);
  const tick = el(`<button class="area-tick ${done ? 'on' : ''}" title="${done ? 'Cleaned — tap to undo' : 'Mark clean'}">✓</button>`);
  tick.onclick = () => toggleAreaDone(a.id);
  row.appendChild(tick);
  const last = lastCleanedByUnit[areaLogId(a)];
  row.appendChild(el(`<div class="area-name su-unit">${esc(a.label)}`
    + `<span class="area-freq"> · ${esc(FREQ[a.freq].label.toUpperCase())}</span>`
    + (last ? `<span class="area-freq"> · ${esc(fmtWhen(last.cleaned_at))}</span>` : '')
    + `</div>`));

  const sel = el(`<select class="area-who"></select>`);
  sel.appendChild(el(`<option value="">Unassigned</option>`));
  // On a morning where attendance hasn't landed yet, an empty list would leave the
  // office unable to allocate at all — fall back to the full roster.
  const present = cleaningStaff().filter(p => hikArrivals[p.id]);
  const pool = (presentOnly && present.length) ? present : cleaningStaff();
  pool.forEach(p => {
    const o = el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`);
    if (a.assignedTo === p.id) o.setAttribute('selected', '');
    sel.appendChild(o);
  });
  // Someone holding an area who isn't in today would otherwise drop off the list and
  // the area would look unassigned when it isn't.
  if (a.assignedTo && !pool.some(p => p.id === a.assignedTo)) {
    const p = (state.staff || []).find(x => x.id === a.assignedTo);
    if (p) {
      const o = el(`<option value="${esc(p.id)}">${esc(p.name)} (not clocked in)</option>`);
      o.setAttribute('selected', '');
      sel.appendChild(o);
    }
  }
  sel.onchange = (e) => setAreaAssign(a.id, e.target.value);
  row.appendChild(sel);

  // The controls belong to one area at a time. Repeated on every row they tripled the
  // height of the list to show a frequency that's already printed next to the name.
  if (opts.manage) {
    const more = el(`<button class="area-more" title="Change or remove">⋯</button>`);
    more.onclick = () => { _areaCtlOpen = _areaCtlOpen === a.id ? null : a.id; render(); };
    row.appendChild(more);
  }
  item.appendChild(row);

  // Buildings tab only — on Roll Call these would be rows of controls nobody uses at 7am.
  if (opts.manage && _areaCtlOpen === a.id) {
    const ctl = el(`<div class="area-ctl"></div>`);
    ['daily', 'weekly', 'monthly'].forEach(fk => {
      const b = el(`<button class="freqmini ${a.freq === fk ? 'on' : ''}" style="padding:5px 4px;font-size:9px">${FREQ[fk].label}</button>`);
      b.onclick = () => setAreaFreq(a.id, fk);
      ctl.appendChild(b);
    });
    const edb = el(`<button class="freqmini" style="padding:5px 8px;font-size:9px">Rename</button>`);
    edb.onclick = () => { state.editingArea = a.id; render(); };
    const rm = el(`<button class="freqmini" style="padding:5px 8px;font-size:9px;color:#dc2626">Remove</button>`);
    rm.onclick = () => removeArea(a.id);
    ctl.appendChild(edb); ctl.appendChild(rm);
    item.appendChild(ctl);
  }
  return item;
}

// --- Team actions ---
const DEFAULT_TEAMS = [
  { name: 'Team A', color: '#0284c7' },
  { name: 'Team B', color: '#15803d' },
  { name: 'Team C', color: '#7c3aed' },
  { name: 'Lead',   color: '#b45309' },
];
const TEAM_PALETTE = ['#0284c7','#15803d','#7c3aed','#b45309','#dc2626','#ea580c','#a21caf','#0284c7','#15803d','#d97706'];
// ALWAYS ALPHABETICAL, from the one place every screen reads teams through.
// Teams were kept in the order they happened to be typed in, so deleting one and
// adding it back put it at the bottom of the list for good — Settings, the Team tab
// and the employee form each showed the same jumble, and the only way to get a
// sensible order back was to delete every team and re-add them in order.
// Numeric collation so Team 10 sits after Team 2 rather than after Team 1.
const byTeamName = (a, b) => String(a.name).localeCompare(String(b.name), undefined, { numeric: true, sensitivity: 'base' });
function getTeams() { return (state.teams || DEFAULT_TEAMS).slice().sort(byTeamName); }
function teamColor(name) { const t = getTeams().find(t => t.name === name); return t ? t.color : '#5b6a7f'; }
function addTeam(name) {
  if (!name || !name.trim()) return;
  const teams = getTeams();
  if (teams.find(t => t.name.toLowerCase() === name.trim().toLowerCase())) return;
  const usedColors = teams.map(t => t.color);
  const color = TEAM_PALETTE.find(c => !usedColors.includes(c)) || TEAM_PALETTE[teams.length % TEAM_PALETTE.length];
  teams.push({ name: name.trim(), color });
  state.teams = teams;
  save(); render();
}
// Teams own zones of the building; the leader divides the zone among whoever
// from their team turned up. Floors sit on the team, not the person, so the zone
// survives people coming and going.
function teamOfFloor(floor) {
  if (floor == null) return null;
  return getTeams().find(t => (t.floors || []).includes(floor)) || null;
}
function teamMembers(name) { return (state.staff || []).filter(p => p.crew === name); }
// WHO IS WITH THE LEADER. A leader answers for their team and works it with their
// assistants, but that pairing was readable only on the Team screen — so every other
// screen named one person and left the office to remember, from memory, who that
// actually meant on the floor. `present` narrows it to the people who count on the
// day being looked at: on the morning board an assistant who has not turned up is
// not with anybody, and printing their name would be a promise the day cannot keep.
function assistantsFor(p, present) {
  if (!p || !p.isLeader || !p.crew) return [];
  return teamMembers(p.crew)
    .filter((x) => x.id !== p.id && x.isCleaner && !x.isLeader && (!present || present(x)))
    .sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { sensitivity: 'base' }));
}
const withLabel = (p, present) => {
  const a = assistantsFor(p, present);
  return a.length ? 'with ' + a.map((x) => String(x.name).split(' ')[0]).join(', ') : '';
};
function setTeamFloors(name, floorsStr) {
  const t = getTeams().find(x => x.name === name);
  if (!t) return;
  t.floors = parseFloors(floorsStr);
  state.teams = getTeams();
  save(); render();
}
function removeTeam(name) {
  const members = STAFF.filter(p => p.crew === name);
  if (members.length) return;
  state.teams = getTeams().filter(t => t.name !== name);
  save(); render();
}

// ALLOCATING FLOORS WAS A TEXT BOX. You typed "1, 2, 3" into a field per person and
// hoped: nothing showed which floors were already spoken for, nothing stopped two
// people owning the same floor, and a typo silently gave somebody floor 12 in an
// eleven-floor building. Floors are a fixed, small set — so they are buttons.
const allFloors = () => Array.from({ length: (state.floors || DEFAULT_FLOORS) }, (_, i) => i + 1);
// A floor has ONE owner. Handing it to somebody therefore takes it off whoever had
// it, rather than leaving the building with two people who each think it is theirs.
function toggleFloorFor(pid, floor) {
  const p = (state.staff || []).find((x) => x.id === pid);
  if (!p) return;
  const mine = (p.floors || []).includes(floor);
  (state.staff || []).forEach((x) => {
    if (Array.isArray(x.floors) && x.floors.includes(floor)) x.floors = x.floors.filter((f) => f !== floor);
  });
  if (!mine) p.floors = (p.floors || []).concat(floor).sort((a, b) => a - b);
  save(); render();
}
function setFloorOwner(floor, pid) {
  (state.staff || []).forEach((x) => {
    if (Array.isArray(x.floors) && x.floors.includes(floor)) x.floors = x.floors.filter((f) => f !== floor);
  });
  const p = pid ? (state.staff || []).find((x) => x.id === pid) : null;
  if (p) p.floors = (p.floors || []).concat(floor).sort((a, b) => a - b);
  save(); render();
}
// The same allocation read the other way round: a person's row of floors.
function floorGrid(p) {
  const grid = el('<div class="fl-grid"></div>');
  allFloors().forEach((f) => {
    const owner = ownerOfFloor(f);
    const mine = owner && owner.id === p.id;
    const taken = owner && !mine;
    const b = el(`<button class="fl-btn ${mine ? 'on' : ''} ${taken ? 'taken' : ''}" `
      + `title="${taken ? esc(owner.name) + ' has floor ' + f : 'Floor ' + f}">${f}</button>`);
    b.onclick = () => toggleFloorFor(p.id, f);
    grid.appendChild(b);
  });
  return grid;
}
// And floor by floor, which is the question the office actually asks out loud:
// "who has six?" — not "which floors does Amina have?"
function floorAllocationBox() {
  const box = el('<div style="margin-bottom:16px"></div>');
  const crew = cleaningStaff();
  const unowned = allFloors().filter((f) => !ownerOfFloor(f)).length;
  box.appendChild(el(`<div class="section-label">Who cleans which floor</div>`));
  box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 8px">`
    + `${unowned ? `<b>${unowned}</b> floor${unowned === 1 ? '' : 's'} with nobody on ${unowned === 1 ? 'it' : 'them'}.` : 'Every floor has somebody.'} One person per floor.</div>`));
  allFloors().forEach((f) => {
    const owner = ownerOfFloor(f);
    const row = el(`<div class="sr-row" style="cursor:default"></div>`);
    row.appendChild(el(`<div style="font-size:13px;font-weight:800;color:#0f1a27;width:62px">Floor ${f}</div>`));
    const sel = el(`<select class="area-select" style="flex:1;min-width:0"></select>`);
    sel.appendChild(el(`<option value="">— nobody —</option>`));
    crew.forEach((c) => {
      const o = el(`<option value="${c.id}">${esc(c.name)}</option>`);
      if (owner && owner.id === c.id) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => setFloorOwner(f, sel.value);
    row.appendChild(sel);
    if (!owner) row.appendChild(el(`<div class="sr-kind" style="color:#b45309">OPEN</div>`));
    box.appendChild(row);
  });
  return box;
}

function parseFloors(str) {

}

// ONE ROLE PER PERSON. "Cleaner" and "Leader" were two independent switches, so a
// person could be a leader who was not a cleaner, both could be off with no word for
// what that meant, and the card never said "assistant" — which is the word the office
// actually uses. One picker, three states, and the rules hang off it.
// The star is how a leader is picked out everywhere else in the app — the roll call,
// the plan, the team list — so it belongs on the role too. One mark, one meaning.
const ROLES = {
  leader:    { label: 'Leader',      icon: '★ ', color: '#b45309', hint: 'Runs the floor · at most 4 rooms, 2 of them early' },
  assistant: { label: 'Assistant',   icon: '',   color: '#0369a1', hint: 'Cleans a full round' },

const ROLE_ORDER = ['leader', 'assistant', 'none'];
const roleOf = (p) => (!p || !p.isCleaner) ? 'none' : (p.isLeader ? 'leader' : 'assistant');
function setRole(id, role) {

// Team leader — mark as many as you like. This used to allow exactly one per team

// Shifts — a person works Day (default), Afternoon, or Night. Tapping the chip
// cycles through them. Purely a label so the office knows who's expected when
// (e.g. Hassan's 2 AM badge-in is normal for night staff).
const SHIFTS = {
  day:       { label: 'Day',       icon: '☀️', color: '#0284c7' },
  afternoon: { label: 'Afternoon', icon: '🌇', color: '#b45309' },
  night:     { label: 'Night',     icon: '🌙', color: '#7c3aed' },
};
const SHIFT_ORDER = ['day', 'afternoon', 'night'];
function shiftOf(p) { return (p && SHIFTS[p.shift]) ? p.shift : 'day'; }
function cycleShift(id) {

// Cleaner type — Inside (rooms/common areas), Outside (grounds/exterior), or Both.
// Tapping the chip cycles through. Used to keep exterior work with outside crews.
const CLEAN_TYPES = {
  inside:  { label: 'Inside',  icon: '🏠', color: '#0284c7' },
  outside: { label: 'Outside', icon: '🌳', color: '#15803d' },
  both:    { label: 'In + Out', icon: '🔁', color: '#7c3aed' },
};
const TYPE_ORDER = ['inside', 'outside', 'both'];
// Which kinds of room a person is cleared to clean. Trainees are often kept off
// offices while they learn, so "can this person take this room" has to be a
// property of the person, not something the office remembers each morning.
// No list set = cleared for everything, so existing staff are unaffected.
const canCleanType = (p, typeKey) => {
  const allowed = p && p.canClean;
  return !Array.isArray(allowed) || !allowed.length || allowed.includes(typeKey);
};
const canCleanUnit = (p, u) => canCleanType(p, unitType(u));
function toggleCanClean(id, typeKey) {
  const p = (state.staff || []).find((s) => s.id === id);
  if (!p) return;
  // Start from "everything" so the first tap removes one kind rather than
  // silently clearing the rest.
  let allowed = Array.isArray(p.canClean) && p.canClean.length ? p.canClean.slice() : UNIT_TYPE_ORDER.slice();
  allowed = allowed.includes(typeKey) ? allowed.filter((k) => k !== typeKey) : allowed.concat(typeKey);
  if (!allowed.length) return;            // never leave someone unable to clean anything
  p.canClean = allowed.length === UNIT_TYPE_ORDER.length ? null : allowed;
  save(); render();
}
function typeOf(p) { return (p && CLEAN_TYPES[p.cleanType]) ? p.cleanType : 'inside'; }
function cycleCleanType(id) {
  const p = state.staff.find((s) => s.id === id);
  if (!p) return;
  const i = TYPE_ORDER.indexOf(typeOf(p));
  p.cleanType = TYPE_ORDER[(i + 1) % TYPE_ORDER.length];
  save(); render();
}

// --- Backup actions ---
function exportBackup() {
  try {
    const data = localStorage.getItem(STORE);
    if (!data) { showBackupMsg('Nothing to export yet.', true); return; }
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cleaning-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showBackupMsg('Backup downloaded successfully.', false);
  } catch (e) { showBackupMsg('Export failed: ' + e.message, true); }
}
function importBackup(file) {
  if (!file) return;
  if (!file.name.endsWith('.json')) { showBackupMsg('Please select a .json backup file.', true); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== 'object' || parsed === null) throw new Error('Invalid backup format');
      showConfirm('Replace all data?', 'This will overwrite everything on this device with the backup file.', () => {
        localStorage.setItem(STORE, JSON.stringify(parsed));
        location.reload();
      });
    } catch (err) { showBackupMsg('Invalid file — could not read backup data.', true); }
  };
  reader.onerror = () => { showBackupMsg('Could not read the file. Please try again.', true); };
  reader.readAsText(file);
}
function showBackupMsg(msg, isErr) {
  const el = document.getElementById('backupMsg');
  if (!el) return;
  el.textContent = msg;
  el.className = 'backup-msg ' + (isErr ? 'err' : 'ok');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// Add-unit form. opts.types = which type buttons to show (single = locked, no picker);
// opts.showTime adds a checkout/target-time field (used on the Airbnb tab).
function addUnitForm(opts) {
  opts = opts || {};
  const types = opts.types || UNIT_TYPE_ORDER;
  let chosenType = opts.defaultType || types[0];
  const form = el(`<div class="addbox"></div>`);
  form.appendChild(el(`<div class="section-label" style="margin:0 0 10px">${opts.title || 'Add a unit to clean'}</div>`));
  const rowU = el(`<div style="display:flex;gap:6px;margin-bottom:8px"></div>`);
  const inU = el(`<input id="newUnit" placeholder="Unit (e.g. 906)" style="flex:1;min-width:0">`);
  const inG = el(`<input id="newGuest" placeholder="${opts.guestPlaceholder || 'Guest name (optional)'}" style="flex:1.4;min-width:0">`);
  rowU.appendChild(inU); rowU.appendChild(inG); form.appendChild(rowU);

  // Optional checkout / target-time field
  let inT = null;
  if (opts.showTime) {
    const rowT = el(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"></div>`);
    rowT.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:600;white-space:nowrap">${opts.timeLabel || 'Checkout time'}</div>`));
    inT = el(`<input id="newTime" type="time" style="flex:1;min-width:0;background:#f4f7fb;color:#15202e;border:1px solid #d8e0ea;border-radius:8px;padding:7px 10px">`);
    rowT.appendChild(inT); form.appendChild(rowT);
  }

  // Type picker (colour-coded) — only when more than one type is offered
  if (types.length > 1) {
    const typeRow = el(`<div style="display:flex;gap:6px;margin-bottom:8px"></div>`);
    const typeBtns = {};
    types.forEach(tk => {
      const t = UNIT_TYPES[tk];
      const on = tk === chosenType;
      const b = el(`<button class="freqpick ${on ? 'on' : ''}" style="${on ? `background:${t.color};border-color:${t.color};color:#ffffff` : ''}">${t.label}</button>`);
      b.onclick = () => {
        chosenType = tk;
        Object.values(typeBtns).forEach(x => { x.classList.remove('on'); x.style.background = ''; x.style.borderColor = ''; x.style.color = ''; });
        b.classList.add('on'); b.style.background = t.color; b.style.borderColor = t.color; b.style.color = '#f4f7fb';
      };
      typeBtns[tk] = b; typeRow.appendChild(b);
    });
    form.appendChild(typeRow);
  }

  const freqRow = el(`<div style="display:flex;gap:6px;margin-bottom:10px"></div>`);
  let chosenFreq = 'daily';
  const freqBtns = {};
  ['nightly','daily','eod','weekly'].forEach(fk => {
    const b = el(`<button class="freqpick ${fk==='daily'?'on':''}" data-f="${fk}">${FREQ_LABEL[fk]}</button>`);
    b.onclick = () => { chosenFreq = fk; Object.values(freqBtns).forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    freqBtns[fk] = b; freqRow.appendChild(b);
  });
  form.appendChild(freqRow);

  const addBtn = el(`<button class="add-btn">+ Add unit</button>`);
  addBtn.onclick = () => {
    const u = document.getElementById('newUnit').value;
    const g = document.getElementById('newGuest').value;
    const tm = inT ? inT.value : '';
    if (!u.trim()) { document.getElementById('newUnit').focus(); return; }
    addServicedUnit(u, g, chosenFreq, chosenType, tm);
  };
  form.appendChild(addBtn);
  return form;
}

// ============================================================
// SEARCH — one box for the whole app
// ============================================================
// You could not look anything up without first knowing where it lived: which of the
// four room tabs a unit was filed under, whether "Lift lobby" was a communal area or
// an exterior one, whether a name was on Team or Settings. This searches all of it
// at once and takes you to the thing, with the term already applied when you land.
let _search = null;      // null | { q }
let _roomSeek = null;    // term to seed the room list's own filter with on arrival
function openSearch() { _search = { q: '' }; render(); }
function closeSearch() { _search = null; render(); }

function searchHits(q) {
  const t = String(q || '').trim().toLowerCase();
  if (t.length < 1) return [];
  const out = [];
  (state.servicedUnits || []).forEach((u) => {
    const hay = [u.unit, u.guest, u.note].filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(t)) return;
    const kind = UNIT_TYPES[unitType(u)] ? UNIT_TYPES[unitType(u)].label : 'Room';
    out.push({
      group: 'ROOM',
      kind: kind.toUpperCase(),
      main: 'Unit ' + u.unit,
      sub: [u.guest, schedLabel(u), u.paused ? 'paused' : ''].filter(Boolean).join(' · '),
      go: () => { _roomSeek = u.unit; _search = null; setTab({ office: 'offices', building: 'buildings', airbnb: 'airbnb' }[unitType(u)] || 'rooms'); },
    });
  });
  (state.areas || []).forEach((a) => {
    if (!String(a.label || '').toLowerCase().includes(t)) return;
    out.push({
      group: 'AREA',
      kind: a.kind === 'exterior' ? 'EXTERIOR' : 'COMMUNAL',
      main: a.label,
      sub: (FREQ_LABEL[a.freq] || a.freq || 'daily') + (areaDone(a) ? ' · done' : ' · outstanding'),
      go: () => { _search = null; setTab(a.kind === 'exterior' ? 'exterior' : 'building'); },
    });
  });
  (state.staff || []).forEach((p) => {
    if (!String(p.name || '').toLowerCase().includes(t)) return;
    out.push({
      group: 'PERSON',
      kind: p.isCleaner ? (p.isLeader ? 'LEADER' : 'CLEANER') : 'STAFF',
      main: p.name,
      sub: [p.crew, (p.floors || []).length ? 'Floors ' + p.floors.join(', ') : 'no floors'].filter(Boolean).join(' · '),
      go: () => { _search = null; setTab('team'); },
    });
  });
  // Alphabetical inside each kind, so the same search always reads the same way.
  const byMain = (a, b) => String(a.main).localeCompare(String(b.main), undefined, { numeric: true, sensitivity: 'base' });
  const KIND_ORDER = ['ROOM', 'AREA', 'PERSON'];
  return out.sort((a, b) => (KIND_ORDER.indexOf(a.group) - KIND_ORDER.indexOf(b.group)) || byMain(a, b));
}

function searchSheet() {
  const bg = el('<div class="sheet-bg"></div>');
  bg.onclick = (e) => { if (e.target === bg) closeSearch(); };
  const sheet = el('<div class="sheet"></div>');
  const head = el('<div class="sheet-head"></div>');
  const row = el('<div style="display:flex;gap:8px;align-items:center"></div>');
  const box = el(`<input type="search" placeholder="Room, guest, area or person…" `
    + `style="flex:1;min-width:0;background:#f4f7fb;color:#15202e;border:1px solid #d8e0ea;`
    + `border-radius:10px;padding:11px 13px;font-size:16px">`);
  box.value = _search.q;
  const cancel = el('<button class="tb-btn">Close</button>');
  cancel.onclick = closeSearch;
  row.appendChild(box); row.appendChild(cancel);
  head.appendChild(row);
  sheet.appendChild(head);
  const body = el('<div class="sheet-body"></div>');
  sheet.appendChild(body);

  const draw = () => {
    body.innerHTML = '';
    const q = box.value;
    if (!q.trim()) {
      body.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">`
        + `Type a unit number, a guest, an area or a name.</div>`));
      return;
    }
    const hits = searchHits(q);
    if (!hits.length) {
      body.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">Nothing matches “${esc(q.trim())}”.</div>`));
      return;
    }
    body.appendChild(el(`<div class="section-label">${hits.length} match${hits.length === 1 ? '' : 'es'}</div>`));
    hits.slice(0, 40).forEach((h) => {
      const r = el('<div class="sr-row"></div>');
      const mid = el('<div style="flex:1;min-width:0"></div>');
      mid.appendChild(el(`<div class="sr-main">${esc(h.main)}</div>`));
      if (h.sub) mid.appendChild(el(`<div class="sr-sub">${esc(h.sub)}</div>`));
      r.appendChild(mid);
      r.appendChild(el(`<div class="sr-kind">${esc(h.kind)}</div>`));
      r.appendChild(el(`<div style="color:#5b6a7f;font-size:18px">›</div>`));
      r.onclick = h.go;
      body.appendChild(r);
    });
    if (hits.length > 40) body.appendChild(el(`<div class="sr-sub" style="text-align:center;padding:8px 0">`
      + `${hits.length - 40} more — keep typing to narrow it.</div>`));
  };
  // Redrawing only the results keeps the cursor and the keyboard where they are.
  box.oninput = () => { _search.q = box.value; draw(); };
  draw();
  bg.appendChild(sheet);
  setTimeout(() => box.focus(), 30);
  return bg;
}

// Render the type-grouped card list for the given type keys.
function unitGroups(wrap, typeKeys, emptyMsg) {
  const units = state.servicedUnits.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const relevant = units.filter(u => typeKeys.includes(unitType(u)));
  if (!relevant.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:30px 0">${emptyMsg || 'No units yet — add one above.'}</div>`));
    return;
  }

  // FIND A ROOM BY TYPING ITS NUMBER. These tabs are the reference list — you come
  // here to look one room up, and with sixty-six of them that meant scrolling. The
  // filter runs over the cards already on screen rather than re-drawing the page,
  // so the box keeps the cursor while you type.
  const rows = [];
  let q = '', freqPick = '';
  const search = el(`<input type="search" placeholder="Search a room, guest or note…" `
    + `style="width:100%;margin:6px 0 6px;background:#ffffff;color:#15202e;border:1px solid #d8e0ea;`
    + `border-radius:10px;padding:11px 13px;font-size:15px">`);
  // FILTER BY HOW OFTEN IT IS CLEANED. "Which rooms are weekly?" and "what is still
  // on a frequency rather than fixed days?" are the two questions this list is read
  // for, and both meant opening rooms one at a time to find out.
  const FREQ_FILTERS = [['', 'All'], ['pinned', 'On set days'], ['nightly', 'Nightly'], ['daily', 'Daily'],
    ['eod', 'Every other day'], ['weekly', 'Weekly'], ['monthly', 'Monthly']];
  const freqRow = el(`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px"></div>`);
  const freqBtns = {};
  const hits = el(`<div style="font-size:11px;color:#5f7189;font-weight:600;min-height:15px;margin-bottom:6px"></div>`);
  const apply = () => {
    let shown = 0;
    rows.forEach((g) => {
      let n = 0;
      g.cards.forEach(({ card, hay, freq, pinned }) => {
        const okText = !q || hay.includes(q);
        const okFreq = !freqPick || (freqPick === 'pinned' ? pinned : (!pinned && freq === freqPick));
        const on = okText && okFreq;
        card.style.display = on ? '' : 'none';
        if (on) n += 1;
      });
      g.head.style.display = n ? '' : 'none';
      g.count.textContent = (q || freqPick) ? n + ' of ' + g.cards.length : String(g.cards.length);
      shown += n;
    });
    Object.keys(freqBtns).forEach((k) => freqBtns[k].classList.toggle('on', k === freqPick));
    // A frequency with nothing in it is worth saying — it is usually the answer to
    // "why is nothing weekly?" (because every room got pinned to set days instead).
    if (!q && freqPick) {
      const lbl = (FREQ_FILTERS.find(([k]) => k === freqPick) || ['', ''])[1];
      hits.style.color = shown ? '#5f7189' : '#b45309';
      hits.textContent = shown ? shown + ' ' + lbl.toLowerCase() : 'No rooms are set to ' + lbl.toLowerCase() + '.';
      return;
    }
    hits.textContent = '';
    hits.style.color = '#5f7189';
    if (!q) return;
    const shownNow = shown;
    if (shownNow) { hits.textContent = shownNow + ' match' + (shownNow === 1 ? '' : 'es'); return; }
    // NOTHING HERE — BUT IS IT ON ANOTHER TAB? Rooms are split across Offices,
    // Buildings and Airbnb by type, and each tab only ever searched its own. Look for
    // 605 on Offices when it is filed as a building room and the answer was a blank
    // screen, which reads as "the room is gone" rather than "you are on the wrong tab".
    const TAB_OF = { office: 'offices', building: 'buildings', airbnb: 'airbnb' };
    const elsewhere = (state.servicedUnits || []).filter((u) =>
      !typeKeys.includes(unitType(u))
      && [u.unit, u.guest, u.note].filter(Boolean).join(' ').toLowerCase().includes(q));
    if (!elsewhere.length) { hits.textContent = 'No room matches “' + search.value.trim() + '”.'; return; }
    hits.style.color = '#b45309';
    const first = elsewhere[0];
    const tabName = UNIT_TYPES[unitType(first)].label;
    hits.textContent = elsewhere.length === 1
      ? 'Unit ' + first.unit + ' is filed as a ' + tabName + ' room — it is on the ' + tabName + ' tab.'
      : elsewhere.length + ' matching rooms are on other tabs (' + [...new Set(elsewhere.map((u) => UNIT_TYPES[unitType(u)].label))].join(', ') + ').';
    const go = el(`<button class="freqmini" style="margin-left:8px;padding:4px 10px;font-size:11px">`
      + `Go to ${esc(tabName)} →</button>`);
    go.onclick = () => setTab(TAB_OF[unitType(first)] || 'rooms');
    hits.appendChild(go);
  };
  // Arriving from the global search: land with the term already in the box and the
  // list already narrowed, rather than on the right tab and none the wiser.
  if (_roomSeek) {
    search.value = _roomSeek; q = String(_roomSeek).trim().toLowerCase(); _roomSeek = null;
    // A hit inside a folded group is a hit nobody can see. Only this view's own
    // groups are opened — the room list's drop-downs keep however they were left.
    Object.keys(state.shutGroups || {}).forEach((k) => {
      if (k.indexOf('rooms:') !== 0) delete state.shutGroups[k];
    });
  }
  search.oninput = () => { q = search.value.trim().toLowerCase(); apply(); };
  FREQ_FILTERS.forEach(([key, label]) => {
    const b = el(`<button class="freqmini${key === '' ? ' on' : ''}" style="flex:0 0 auto;padding:6px 10px;font-size:11px">${esc(label)}</button>`);
    b.onclick = () => { freqPick = (freqPick === key) ? '' : key; apply(); };
    freqBtns[key] = b;
    freqRow.appendChild(b);
  });
  // ABOVE EVERYTHING, INCLUDING THE ADD FORM. Appended in place it landed under a
  // full "add a unit" form, so finding a room meant scrolling past the thing you use
  // once a month to reach the thing you use every day — and it read as missing.
  const stick = el('<div class="stickbar"></div>');
  stick.appendChild(search); stick.appendChild(freqRow); stick.appendChild(hits);
  wrap.insertBefore(stick, wrap.firstChild);

  typeKeys.forEach(tk => {
    const t = UNIT_TYPES[tk];
    // UNIT ORDER, PLAINLY. This is the reference list, not a round to be worked, so
    // it reads 101, 102, 103 — an early or priority room jumping the queue here is
    // just a room you cannot find. The working order lives on the roll call and the
    // plan, which is where the order is an instruction.
    const group = relevant.filter(u => unitType(u) === tk)
      .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
    if (!group.length) return;
    // A GROUP YOU CAN SHUT. Scrolling past forty building units to reach the four
    // offices underneath is the whole complaint about this list; tapping the heading
    // folds it away, and which ones are folded is remembered.
    const shut = !!(state.shutGroups || {})[tk];
    const head = el(`<div class="crew-head grp-head" style="margin-top:18px"></div>`);
    head.appendChild(el(`<div class="grp-caret">${shut ? '▸' : '▾'}</div>`));
    head.appendChild(el(`<div class="crew-dot" style="background:${t.color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${t.label}</div>`));
    const count = el(`<div class="crew-sub">${group.length}${shut ? ' · hidden' : ''}</div>`);
    head.appendChild(count);
    head.onclick = () => {
      state.shutGroups = state.shutGroups || {};
      if (state.shutGroups[tk]) delete state.shutGroups[tk]; else state.shutGroups[tk] = true;
      save(); render();
    };
    wrap.appendChild(head);
    if (shut) { rows.push({ head, count, cards: [] }); return; }
    const cards = group.map((u) => {
      const card = servicedCard(u, onTodaysList(u));
      wrap.appendChild(card);
      return { card, freq: u.freq || 'daily', pinned: !!fixedDays(u),
        hay: [u.unit, u.guest, u.note, u.time].filter(Boolean).join(' ').toLowerCase() };
    });
    rows.push({ head, count, cards });
  });
  if (q || freqPick) apply();
}

// "More" menu — the less-used tabs live here so the bottom bar stays clean.
// ============================================================
// PLAN A DAY — build tomorrow's job list, then fill it with whoever badges in.
// ============================================================
let planDay = null;   // selected day in the Plan view (null => tomorrow)
// The day's jobs are what this tab is for, and the whole list has to fit on a screen
// so it can be screenshotted and sent to the crew. Everything else — the week chart,
// the pool of jobs to add, rebuilding — sits behind this.
let planMore = false;
// Anchored to the work day, not the clock day: at 00:20 the crew is still on the
// round that started last night, so "tomorrow" must not skip a day under them.
const tomorrowKey = () => shiftDay(workToday(), 1);
// OPENS ON THE DAY THE ROLL CALL IS SHOWING. It opened on tomorrow, so tapping Plan
// from the morning board landed you on a different day's rooms with a warning that
// these are not today's — two screens about the same building that never agreed.
// Tomorrow is one tap along, and the button under the picker plans it.
function curPlanDay() { return planDay || workToday(); }
// Tomorrow's list, computed from the schedule instead of typed in by hand. Rooms
// come from their own cycle (daily / every other day / weekly), interior areas
// from whether their period is still outstanding. Overdue work is carried in and
// flagged rather than quietly dropped.
function suggestedJobsFor(day) {
  const out = [];
  // TODAY'S PLAN IS TODAY'S WORK, INCLUDING WHAT IS ALREADY DONE. The roll call keeps
  // a cleaned room on the list with a tick so the morning does not shrink as the crew
  // work through it; the plan dropped it the moment it stopped being due. Same day,
  // same building, two different lists and two different totals — 22 rooms on one
  // screen and 13 on the other. A room cleaned today belongs on today's plan, ticked.
  const isToday = day === workToday();
  (state.servicedUnits || []).forEach(u => {
    if (!dueOnDay(u, day) && !(isToday && cleanedToday(u))) return;
    const due = lastCleanDate(u) ? nextDueDate(u) : null;
    out.push({
      kind: 'unit', id: u.id, label: 'Unit ' + u.unit,
      group: UNIT_TYPES[unitType(u)].label,
      why: !due ? 'No record yet' : (due < day ? 'Overdue since ' + due : schedLabel(u)),
      late: !!due && due < day,
    });
  });
  areasInterior().forEach(a => {
    if (state.completions[a.id + '::' + freqKeyOn(a.freq, day)]) return;
    out.push({ kind: 'area', id: a.id, label: a.label, group: 'Interior areas',
               why: FREQ_LABEL[a.freq] || (FREQ[a.freq] || {}).label || '', late: false });
  });
  return out;
}
// What the office plans and looks ahead at, as opposed to what gets cleaned. Kinds
// of room switched off in "Roll Call covers" are run as their own operation on their
// own tab — Airbnb is cleaned by its own pair after the offices — so planning them
// here is noise. Tonight's round deliberately does NOT use this: the night's work is
// the night's work, whatever the morning is organised around.
function planningJobsFor(day) {
  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const jobs = suggestedJobsFor(day).filter((j) => j.kind !== 'unit' || onRollCall(unitById[j.id]));
  // For a day still to come, take the rooms the schedule will actually have reached
  // by then rather than everything outstanding now — otherwise every-other-day rooms
  // land on all seven days and each day reads as the same full list.
  const dueIds = projectedDueIdsOn(day);
  if (!dueIds) return jobs;
  return jobs.filter((j) => j.kind !== 'unit' || dueIds.has(j.id));
}
// Fill a day's plan from the schedule. Additive: anything already on the plan
// keeps its assignee, so seeding can never wipe a hand-made list.
function applySuggestions(day, jobs) {
  const plan = getPlan(day);
  let added = 0;
  jobs.forEach(s => {
    const k = planKey(s.kind, s.id);
    if (plan[k]) return;
    // `auto` records that the schedule put this here, not a person. Only an
    // auto-placed job may be taken away again without asking.
    plan[k] = { kind: s.kind, refId: s.id, label: s.label, assignedTo: null, auto: true };
    added++;
  });
  return added;
}
// Lay a future day out by itself: who is rostered on, what is due, and an even split
// between them. Nobody has badged in for a day that hasn't happened, so this reads
