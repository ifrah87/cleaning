    const room = early.find((u) => u.assignedTo === over && !moves.some((m) => m.u.id === u.id)
      && canCleanUnit(staffById[under], u));
    if (!room) break;                                        // nothing of theirs the other may clean
    moves.push({ u: room, from: over, to: under });
    load[over] -= 1; load[under] += 1;
  }

  state.earlyEvenedOn = day;
  if (!moves.length) return { moved: 0 };
  moves.forEach((m) => {
    m.u.assignedTo = m.to;
    state.assignConfirmed[m.u.id] = todayKey();               // a decision: never re-dealt
    // AND THE PLAN MAY NOT CARRY IT BACK. applyPlannedAssignments honours a decision —
    // unless the room was already carried today, which every room has been by the time
    // this runs: carryPlanToBoardOnOpen goes first in the same pass. So the levelling
    // moved four asked-for rooms off one person, said so on the morning screen, and the
    // next carry put every one of them straight back on her. The exception exists to
    // stop a hasty 06:40 deal overwriting a plan made the night before; this is not a
    // deal, it is the round's own rule, and the room's carry is no longer the last thing
    // that happened to it. Clearing the marker lets the decision guard do its job.
    if (state.planCarried) delete state.planCarried[m.u.id];
  });
  // Said out loud on the morning screen, because a board that rearranges itself in
  // silence is one nobody trusts.
  state.lastEarlyEven = {
    day,
    moves: moves.map((m) => ({ unit: m.u.unit,
      from: (staffById[m.from] || {}).name || '—', to: (staffById[m.to] || {}).name || '—' })),
  };
  save();
  return { moved: moves.length };
}

// A NAME ON A GUEST FLAT IS ONLY EVER TODAY'S NAME.
// Nothing in the app has ever cleared a room's cleaner at the end of a day. For an
// office room it never showed, because the hand-out clears every room it deals before
// it deals it. A flat is never dealt — that is the whole point of it — so its cleaner
// was set once, by a person, and stayed set for ever. Four flats were still carrying
// names from three days earlier, which reads as the app having allocated them.
//
// (First written as "rooms off the roll call" and it did nothing at all: the flats are
// ON the roll call — they are on the board, they get ticked — so every one of them was
// skipped by the very guard meant to catch them.)
//
// Only a name that is not from today goes. A flat handed to somebody today is stamped
// with today (setUnitAssignee), one already cleaned keeps whoever did it, and one tied
// to a person permanently is a standing decision and is left alone.
//
// EVERY ROOM, NOT ONLY THE FLATS. Written for the guest flats because they are the ones
// never re-dealt, and it turned out the ordinary rooms had the same hole for a different
// reason: the morning hand-out clears a room before it deals it, but the hand-out does
// not run until somebody badges in (see the `!inNow.length` guard in maybeAutoAssign).
// On any morning before the first scan — which is every morning, for two hours — the
// whole board still wore the last round's names. Today's plan was right and invisible.
//
// A name from THIS round stays, whoever put it there. A name from an earlier one goes,
// and the room shows in NOBODY YET until the plan or the morning puts somebody on it.
function clearStaleHandouts() {
  (state.servicedUnits || []).forEach((u) => {
    if (!u || !u.assignedTo) return;
    if (assignedThisRound(u)) return;   // handed out this round, by a person or by the app
    if (cleanedToday(u)) return;        // done today — the name is the record of who did it
    u.assignedTo = null;
    delete state.assignConfirmed[u.id];
  });
}
function planningPass() {
  // THE BOARD PLANS NOTHING. maybeAutoAssign() has always known this — "a hand-out it
  // worked out would exist only on the TV, until the next pull wipes them" — but the
  // guard was on the dealing and not on the planning, and everything below this line
  // also writes: ensureWeekPlanned seeds days, topUpTodayPlan adds rooms to today, and
  // carryPlanToBoardOnOpen mirrors the plan onto the rooms and calls save().
  //
  // save() writes localStorage and then returns without pushing, so the television
  // built a private plan every minute that no phone and no other TV ever saw, and the
  // next pull sixty seconds later overwrote it. That is the churn in the 23 Aug
  // photos: 305 moving from nobody to Mahamed Nur Hassan, 1103 going Abdiwakiil →
  // Hassan Elmi → nobody. Nobody reassigned those rooms. The screen was arguing with
  // the server, once a minute, in front of the crew.
  if (TV_MODE) return;
  clearStaleHandouts();   // the last round's names come off before this one is laid on
  // Level first — it decides which rooms fall on which day, and planning ahead of it
  // would lay out days it is about to move.
  autoLevelIfLopsided();
  ensureWeekPlanned();   // the week ahead is laid out and handed round without anyone asking
  topUpTodayPlan();      // and anything the schedule says is due today but the frozen plan missed
  carryPlanToBoardOnOpen();   // and last night's plan for today is on the board already
  evenOutEarlyRooms();   // ...and nobody starts the day holding four asked-for rooms
  // AND THE ROUND IS PUT RIGHT IF IT IS PLAINLY WRONG. This belongs here rather than in
  // maybeAutoAssign for the same reason evenOutEarlyRooms does: the automatic hand-out
  // is switched OFF on this building (state.autoAssign === false), so anything hung off
  // it never runs at all. The plan still deals the day, so the day can still come out
  // lopsided — and the pass that exists to fix that was sitting behind a switch the
  // office had turned off for a different reason entirely.
  // It does nothing unless the round is three or more apart, and it only ever moves
  // rooms the app itself dealt — never a person's decision, never a finished room.
  rebalanceRoundIfLopsided();
}
// Only the crew who are actually here: somebody who has not badged in reads as the
// lightest person on the board and would be fed rooms they are not there to clean.
function rebalanceRoundIfLopsided() {
  if (TV_MODE) return { moved: [] };
  const here = new Set(Object.keys(hikArrivals).filter((id) => !isAway(id)));
  if (here.size < 2) return { moved: [] };
  const due = todaysRoomList().filter((u) => !cleanedToday(u));
  if (!due.length) return { moved: [] };
  return rebalanceNamedRooms(due, here);
}

let _plannedForDay = null;
let _dayWatch = null;
function startDayWatch() {
  clearInterval(_dayWatch);
  _dayWatch = setInterval(() => {
    // Top up every pass, not only at the rollover: a room can fall due because
    // somebody backdated a clean or changed a frequency on another device, and the
    // realtime update brings that in without any day having changed.
    const day = workToday();
    if (day !== _plannedForDay) {
      _plannedForDay = day;
      autoPinDaysFromFreq();
      autoLevelEodDays();     // and undo any clump the pinning has settled into
      planningPass();
      loadHikArrivals().then(() => { handOutAndLevel(); render(); });
      render();
      return;
    }
    if ((topUpTodayPlan().added || 0) > 0) { carryPlanToBoardOnOpen(); render(); }
  }, 300000);   // five minutes — a day boundary and a backdated clean are both slow news
}

async function boot() {
  load();
  route();              // login → app
  // "up to date" is a claim about DATA, not about having called the function. This
  // used to stamp unconditionally, and remotePull() swallows its own errors — so the
  // televisions spent the morning of 23 Aug reporting "up to date" in the corner
  // while showing a demo roster. A board nobody can tell is stale is worse than no
  // board; one that insists it is fresh is worse again.
  const pulled = await remotePull();   // wait for the staff roster before matching arrivals
  if (pulled) tvLastData = Date.now();
  _plannedForDay = workToday();
  // Days first: the planning pass reads the schedule, so the rooms need to be ON
  // their days before it runs, not after. It is a property of the rota rather than
  // of who has badged in, so it does not wait for the roll call.
  autoPinDaysFromFreq();
  // Pinning alone lands the whole estate on one of the two patterns, because they all
  // ask for the set their last clean points at. This spreads them back out.
  autoLevelEodDays();
  planningPass();
  loadHikArrivals().then(() => { handOutAndLevel(); route(); });
  startArrivalPolling();
  startDayWatch();
  if (!TV_MODE) startBuildWatch();   // the board has its own, and reloads itself
  subscribeRealtime();
  startStatePolling();   // the socket is the fast path, not the only one
  refreshHistory();
  subscribeHistory();
  if (TV_MODE) startTVLoop();
}

// Boot from the copy on the device. Everything that needs the server is left out —
// no pull, no realtime, no arrival polling — but the day still plans itself and the
// board is fully usable. Writes go to localStorage and are marked as owed, so the
// retry that already exists delivers them the moment the server answers again.
function bootOffline() {
  load();
  offlineMode = true;
  route();
  _plannedForDay = workToday();
  planningPass();
  startDayWatch();
  // Keep knocking. When the server comes back this promotes itself to a real session
  // without anybody reloading — and the first push carries everything done offline.
  clearInterval(_offlineWatch);
  _offlineWatch = setInterval(async () => {
    if (!db || !offlineMode) return;
    try {
      const { error } = await db.from('app_state').select('building').limit(1);
      if (error) throw error;
      offlineMode = false;
      clearInterval(_offlineWatch);
      // A session may still be live even though the project was refusing requests.
      let ok = false;
      try { const { data } = await db.auth.getSession(); ok = !!(data && data.session); } catch (e2) {}
      if (ok) { authed = true; boot(); }
      else renderLogin();
    } catch (e) { /* still down — keep the board up and try again */ }
  }, 60000);
}
let _offlineWatch = null;

// Startup: restore any existing Supabase session, then show the right screen.
async function startup() {
  if (!db) { if (isLoggedIn()) boot(); else renderLogin(); return; }
  try {
    const { data } = await db.auth.getSession();
    authed = !!(data && data.session);
  } catch (e) { authed = false; }
  db.auth.onAuthStateChange((_event, session) => {
    const was = authed;
    authed = !!session;
    if (!authed && was) renderLogin();   // signed out / session expired → back to login
  });
  if (authed) {
    // A stored session proves somebody signed in once, not that the server will
    // answer now. Ask it something cheap first: if the project is restricted or
    // unreachable, open the local copy rather than an app that cannot load anything.
    try {
      const { error } = await db.from('app_state').select('building').limit(1);
      if (error) throw error;
      boot();
    } catch (e) {
      if (isServerDown(e) && canWorkOffline()) bootOffline(); else boot();
    }
    return;
  }
  renderLogin();
}
startup();

// INSTALLABLE, AND OPENABLE WITH NO NETWORK. Registering the worker is what lets the
// app be added to a home screen and, more importantly, what lets it start at all when
// the connection is gone — the offline board is no use if the page cannot load to
// reach it. Registered after startup so it never delays the first paint.
// isSecureContext, not a protocol check: it is true for https AND for localhost, so
// the worker can be exercised in testing exactly as it runs in production, and still
// never registers from a file:// copy where the scope would be meaningless.
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
