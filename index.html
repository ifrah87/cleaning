    const box = el('<div style="margin-top:18px"></div>');
    box.appendChild(el(`<div class="section-label">Tomorrow (${rooms.length} room${rooms.length === 1 ? '' : 's'})</div>`));

    if (rooms.length) {
      box.appendChild(el(`<div style="font-size:12px;color:${named === rooms.length ? '#15803d' : '#b45309'};font-weight:600;margin:-4px 0 8px">`
        + (named === rooms.length ? 'All handed out' : `${named} of ${rooms.length} handed out`)
        + ` · ${cleaningStaff().filter((p) => worksOnDay(p, day)).length} rostered on</div>`));

      // TOMORROW AGAINST TODAY. The two lists are built by different routes — today
      // from the rooms' real last-clean dates, tomorrow from the projection — so
      // seeing them side by side is how you tell the plan is sane before the crew
      // arrives to it. A room on both days is normally a daily room, or one given an
      // extra clean to break up a clump; anything else on both is worth a look.
      {
        const todayRooms = (state.servicedUnits || []).filter((u) => onRollCall(u) && unitDueToday(u));
        const todayIds = new Set(todayRooms.map((u) => u.id));
        const tomIds = new Set(rooms.map((v) => v.refId));
        const unitById = {};
        (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
        const both = [...tomIds].filter((id) => todayIds.has(id));
        const finishing = todayRooms.filter((u) => !tomIds.has(u.id)).length;
        const fresh = [...tomIds].filter((id) => !todayIds.has(id)).length;
        // On both days for no good reason: not a daily room, and not one the leveller
        // gave a second clean to.
        const odd = both.filter((id) => {
          const u = unitById[id];
          if (!u) return false;
          const n = FREQ_DAYS[u.freq] || 1;
          return n > 1 && String(u.alsoCleanOn || '') !== day;
        }).map((id) => (unitById[id] || {}).unit);

        const cmp = el('<div style="font-size:11px;color:#5f7189;line-height:1.6;margin:-2px 0 8px"></div>');
        cmp.appendChild(el(`<div><b style="color:#0f1a27">Today ${todayRooms.length}</b> `
          + `→ <b style="color:#0f1a27">tomorrow ${rooms.length}</b>`
          + `${rooms.length > todayRooms.length ? ' · heavier' : rooms.length < todayRooms.length ? ' · lighter' : ' · the same'}</div>`));
        cmp.appendChild(el(`<div>${finishing} finish today and are not due again · ${fresh} come due tomorrow`
          + (both.length ? ` · ${both.length} on both days` : '') + `</div>`));
        if (odd.length) {
          cmp.appendChild(el(`<div style="color:#b45309;font-weight:600">`
            + `⚠ ${esc(odd.join(', '))} ${odd.length === 1 ? 'is' : 'are'} on both days without being daily `
            + `or split on purpose — worth checking.</div>`));
        }
        box.appendChild(cmp);
      }
      // Who has what, at a glance. Grouped by cleaner rather than listed by room —
      // the question in the evening is "has everyone got a fair morning", not
      // "what is happening to 305".
      const byWho = {};
      rooms.forEach((v) => {
        const key = v.assignedTo || '';
        (byWho[key] = byWho[key] || []).push(String(v.label || '').replace(/^Unit\s+/, ''));
      });
      const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>');
      Object.keys(byWho).sort((a, b) => (a === '' ? 1 : b === '' ? -1 : 0)).forEach((id) => {
        const who = id ? (staffById[id] || {}).name : null;
        const label = who ? who.split(' ')[0] : 'Nobody yet';
        chips.appendChild(el(`<div class="freqmini" style="flex:0 0 auto;padding:7px 11px;cursor:default`
          + (id ? '' : ';border-color:#b45309;color:#b45309') + `">`
          + `<b>${esc(label)}</b> · ${esc(byWho[id].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true })).join(', '))}</div>`));
      });
      box.appendChild(chips);
    } else {
      box.appendChild(el(`<div style="font-size:12px;color:#5f7189;margin:-4px 0 8px">Nothing laid out yet.</div>`));
    }

    const btn = el(`<button class="add-btn" style="background:#15803d">⚡ Plan tomorrow's rooms</button>`);
    // Switch tab first so planTomorrow's single render lands on the day it planned.
    btn.onclick = () => { state.tab = 'plan'; _assignPick = null; planTomorrow(); };
    box.appendChild(btn);
    box.appendChild(el(`<div style="font-size:10px;color:#5f7189;margin-top:4px">`
      + `Lays it out and hands it round, then opens it so you can change anything.</div>`));
    fold('tomorrow', 'Tomorrow', rooms.length + ' rooms', box, false);
  }

  wrap.appendChild(body);

  // "No" on an assignment → pick who should take it instead. Everyone clocked in is
  // listed with how many rooms they're already carrying, so the load stays visible.
  if (_assignPick) {
    const u = (state.servicedUnits || []).find((x) => x.id === _assignPick.unitId);
    if (!u) { _assignPick = null; return wrap; }
    const load = {};
    (state.servicedUnits || []).forEach((x) => { if (x.assignedTo) load[x.assignedTo] = (load[x.assignedTo] || 0) + 1; });
    const inNow = arrIds.map((id) => staffById[id]).filter(Boolean);
    const lightest = inNow.slice().sort((a, b) => (load[a.id] || 0) - (load[b.id] || 0))[0];
    const overlay = el('<div class="modal-overlay" id="assignPicker"></div>');
    const modal = el('<div class="modal"></div>');
    modal.appendChild(el(`<div class="modal-title">Who should take ${esc(u.unit)}?</div>`));
    modal.appendChild(el(`<div class="modal-sub">Currently suggested for ${esc((state.staff || []).find((p) => p.id === u.assignedTo) ? (state.staff || []).find((p) => p.id === u.assignedTo).name : 'nobody')}.</div>`));
    const picker = el('<div class="cover-picker" style="display:flex;flex-direction:column;gap:8px;margin-top:14px"></div>');
    if (!inNow.length) {
      picker.appendChild(el('<div class="empty">Nobody is clocked in yet.</div>'));
    }
    inNow.sort((a, b) => (load[a.id] || 0) - (load[b.id] || 0) || a.name.localeCompare(b.name)).forEach((p) => {
      const n = load[p.id] || 0;
      const isCur = p.id === u.assignedTo;
      // Someone not cleared for this kind of room shouldn't be offered it by mistake.
      if (!canCleanUnit(p, u)) {
        picker.appendChild(el(`<div class="cover-opt" style="opacity:0.5">${esc(p.name)}`
          + `<span class="cover-load">not cleared for ${esc(UNIT_TYPES[unitType(u)].label.toLowerCase())}</span></div>`));
        return;
      }
      const b = el(`<button class="cover-opt ${isCur ? 'on' : ''}">${esc(p.name)}`
        + `<span class="cover-load">${n} room${n === 1 ? '' : 's'}`
        + `${lightest && p.id === lightest.id && !isCur ? ' · lightest' : ''}${isCur ? ' · suggested' : ''}</span></button>`);
      b.onclick = () => setUnitAssignee(u.id, p.id, !!_assignPick.pin);
      picker.appendChild(b);
    });
    modal.appendChild(picker);
    // THE STANDING DECISION, ASKED FOR RATHER THAN ASSUMED. Off by default: the
    // common case is covering one morning, and that is the one that must not cost
    // anybody a permanent change they did not ask for.
    {
      const pinned = u.usualTo ? (state.staff || []).find((x) => x.id === u.usualTo) : null;
      const on = !!_assignPick.pin;
      const pinBtn = el(`<button class="freqmini ${on ? 'on' : ''}" style="width:100%;padding:10px;margin-top:12px">`
        + `${on ? '✓ ' : ''}Make them ${esc(u.unit)}'s cleaner every day</button>`);
      pinBtn.onclick = () => toggleAssignPin();
      modal.appendChild(pinBtn);
      modal.appendChild(el(`<div style="font-size:11px;color:#5f7189;line-height:1.5;margin-top:6px">`
        + (on
            ? `This room goes to them every morning from now on, ahead of the even split.`
            : `Just for today — the rota is unchanged.`)
        + (pinned ? ` Currently ${esc(pinned.name)}'s room every day.` : '')
        + `</div>`));
    }
    const btnRow = el('<div class="modal-btns"></div>');
    const back = el('<button class="modal-confirm" style="background:#b45309">Put it back in the pool</button>');
    back.onclick = () => setUnitAssignee(u.id, '');
    const cancel = el('<button class="modal-skip">Cancel</button>');
    cancel.onclick = () => dismissAssignPicker();
    btnRow.appendChild(cancel); btnRow.appendChild(back);
    modal.appendChild(btnRow);
    overlay.appendChild(modal);
    overlay.onclick = (e) => { if (e.target === overlay) dismissAssignPicker(); };
    wrap.appendChild(overlay);
  }

  // THE DRAWER. Shut unless you go looking, and it says how many things are inside
  // so nothing that used to be on the screen has simply disappeared.
  {
    const open = !!state.rcSetupOpen;
    // No count while it is shut: the two scans that decide what goes in there are
    // skipped when nobody is looking, so a number now would be a guess.
    const toggle = el(`<button class="reset-btn" style="margin:22px 0 0">`
      + (open ? `▾ Set-up &amp; tools (${setupBox.querySelectorAll('button').length})` : `▸ Set-up &amp; tools`)
      + `</button>`);
    toggle.onclick = () => { state.rcSetupOpen = !open; save(); render(); };
    body.appendChild(toggle);
    if (open) {
      body.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-8px 0 10px">`
        + `Roster, attendance file, and the one-off jobs. Nothing here is part of the morning.</div>`));
      body.appendChild(setupBox);
    }
  }

  return wrap;
}

function viewSettings() {
  const wrap = el('<div class="body"></div>');

  // --- What the app does on its own ---
  wrap.appendChild(el(`<div class="section-label">Automatic</div>`));
  const autoBox = el(`<div class="addbox"></div>`);
  [
    ['autoAssign', 'Hand out rooms each morning',
     'Shared out as the crew badge in, and again each time somebody new arrives. Rooms you handed out yourself stay put.'],
    ['autoConfirm', 'Hand them out without asking',
     'No list to approve each morning. You can still move any room by tapping it.', false],
    ['lockOnDeal', 'Keep rooms where they land',
     'Once a room is handed out it stays with that cleaner for the day, instead of being '
     + 'reshuffled each time somebody new badges in. Anyone marked away still frees theirs, '
     + 'and you can always move a room by tapping it.'],
    ['autoDays', 'Put rooms on set days',
     'Every-other-day and weekly rooms get fixed weekdays, split so no day is heavier. Days you set yourself are never changed.'],
    ['autoBalance', 'Keep the week level',
     'Spreads rooms that fall due together, so the days stop swinging between heavy and empty. Nothing waits longer than its frequency.'],
    ['eodSpread', 'Split the every-other-day rooms',
     'Keeps them on two patterns — Sat/Mon/Wed and Sun/Tue/Thu — so the same number falls due each day. Friday is left clear for you to pick.'],
  ].forEach(([k, label, why, defOn]) => {
    // Most of these are on unless switched off; a couple are off unless switched on.
    const offByDefault = defOn === false;
    const on = offByDefault ? !!state[k] : state[k] !== false;
    const row = el(`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #e7ecf3"></div>`);
    const info = el(`<div style="flex:1;min-width:0"></div>`);
    info.appendChild(el(`<div style="font-size:14px;font-weight:600;color:#0f1a27">${label}</div>`));
    info.appendChild(el(`<div style="font-size:11px;color:#5f7189;line-height:1.5;margin-top:2px">${why}</div>`));
    row.appendChild(info);
    const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:0 0 auto;padding:8px 14px">${on ? 'On' : 'Off'}</button>`);
    b.onclick = () => { state[k] = offByDefault ? (on ? undefined : true)
                                               : (on ? false : undefined); save(); render(); };
    row.appendChild(b);
    autoBox.appendChild(row);
  });
  // The early round: how many asked-for mornings one person carries before the next
  // person in starts on them. There are more early rooms than cleaners, so this is
  // the number that decides whether the first arrival is loaded up or spread thin.
  {
    const cap = earlyCap();
    const row = el(`<div style="padding:10px 0;border-top:1px solid #e7ecf3"></div>`);
    row.appendChild(el(`<div style="font-size:14px;font-weight:600;color:#0f1a27">Morning rooms per cleaner</div>`));
    row.appendChild(el(`<div style="font-size:11px;color:#5f7189;line-height:1.5;margin-top:2px">`
      + `Rooms the customer asked for in the morning go to whoever badged in first, up to this many each, `
      + `then the next person in starts on them. Anything over it is shared out evenly.</div>`));
    const btns = el(`<div style="display:flex;gap:6px;margin-top:8px"></div>`);
    [2, 3, 4].forEach((n) => {
      const b = el(`<button class="freqmini ${n === cap ? 'on' : ''}" style="flex:1;padding:9px 4px">${n === cap ? '✓ ' : ''}${n} each</button>`);
      b.onclick = () => { state.earlyCap = n; save(); render(); };
      btns.appendChild(b);
    });
    row.appendChild(btns);
    autoBox.appendChild(row);
  }
  autoBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;line-height:1.5;padding-top:10px;border-top:1px solid #e7ecf3;margin-top:4px">`
    + `<b>Marking rooms cleaned is never automatic</b> — only someone who saw it done can say so.</div>`));
  wrap.appendChild(autoBox);

  // --- What the morning roll call is about ---
  wrap.appendChild(el(`<div style="height:22px"></div>`));
  wrap.appendChild(el(`<div class="section-label">Roll Call covers</div>`));
  const rcBox = el(`<div class="addbox"></div>`);
  rcBox.appendChild(el(`<div style="font-size:13px;color:#5f7189;margin-bottom:10px">Which rooms the morning roll call covers. One switched off keeps its own tab and schedule.</div>`));
  const rcRow = el(`<div style="display:flex;gap:6px"></div>`);
  UNIT_TYPE_ORDER.forEach(tk => {
    // Airbnb is never on the roll call, so it is shown as settled rather than as a
    // switch that happens to be off — an off switch invites somebody to turn it on.
    const fixedOff = OFF_ROLL_CALL_TYPES.indexOf(tk) >= 0;
    const on = !fixedOff && (!Array.isArray(state.rollCallTypes) || state.rollCallTypes.includes(tk));
    const n = (state.servicedUnits || []).filter(u => unitType(u) === tk).length;
    const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:1;padding:9px 4px${fixedOff ? ';opacity:.6' : ''}">`
      + `${on ? '✓ ' : ''}${UNIT_TYPES[tk].label}<br><span style="font-weight:500;font-size:10px">`
      + `${fixedOff ? 'own tab' : n + ' rooms'}</span></button>`);
    if (!fixedOff) b.onclick = () => toggleRollCallType(tk);
    rcRow.appendChild(b);
  });
  rcBox.appendChild(rcRow);
  rcBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;line-height:1.5;margin-top:8px">`
    + `Airbnb is always a separate job — the office picks the flats and who does them on the Airbnb tab, `
    + `after the offices are done. It never appears on the morning roll call.</div>`));
  wrap.appendChild(rcBox);

  // --- Teams ---
  wrap.appendChild(el(`<div class="section-label" style="margin-top:22px">Teams</div>`));
  const tbox = el(`<div class="addbox"></div>`);
  const tRow = el(`<div style="display:flex;gap:8px;margin-bottom:10px"></div>`);
  const tIn = el(`<input id="newTeam" placeholder="New team name" style="flex:1">`);
  const tBtn = el(`<button class="add-btn" style="flex:0 0 auto;width:auto;padding:12px 18px">+ Add</button>`);
  tBtn.onclick = () => { const v = document.getElementById('newTeam').value; if (!v.trim()) { document.getElementById('newTeam').focus(); return; } addTeam(v); };
  tIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') tBtn.onclick(); });
  tRow.appendChild(tIn); tRow.appendChild(tBtn); tbox.appendChild(tRow);
  getTeams().forEach(t => {
    const memberCount = STAFF.filter(p => p.crew === t.name).length;
    const tr = el(`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #e7ecf3"></div>`);
    tr.appendChild(el(`<div class="crew-dot" style="background:${t.color}"></div>`));
    tr.appendChild(el(`<div style="flex:1;font-size:14px;font-weight:600;color:#0f1a27">${esc(t.name)}</div>`));
    tr.appendChild(el(`<div style="font-size:11px;color:#5b6a7f">${memberCount} member${memberCount!==1?'s':''}</div>`));
    if (memberCount === 0) {
      const rmBtn = el(`<button class="su-rm">Remove</button>`);
      rmBtn.onclick = () => removeTeam(t.name);
      tr.appendChild(rmBtn);
    }
    tbox.appendChild(tr);

    // The team's zone, and who answers for it.
    const leads = teamMembers(t.name).filter(p => p.isLeader);
    const zone = el(`<div style="display:flex;align-items:center;gap:8px;padding:0 0 10px 22px;flex-wrap:wrap"></div>`);
    zone.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:0 0 auto">Zone floors</div>`));
    const zIn = el(`<input value="${esc((t.floors || []).join(', '))}" placeholder="e.g. 10, 11" style="flex:1;min-width:90px;font-size:13px;padding:7px 9px">`);
    zIn.onchange = (e) => setTeamFloors(t.name, e.target.value);
    zone.appendChild(zIn);
    const roomCount = (state.servicedUnits || []).filter(u => (t.floors || []).includes(floorOfUnit(u.unit))).length;
    zone.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;flex:0 0 auto">${roomCount} room${roomCount === 1 ? '' : 's'}</div>`));
    zone.appendChild(el(`<div style="flex-basis:100%;height:0"></div>`));
    zone.appendChild(el(`<div style="font-size:11px;color:${leads.length ? '#b45309' : '#dc2626'};font-weight:600">`
      + (leads.length
        ? `★ ${esc(leads.map(p => p.name).join(', '))} lead${leads.length === 1 ? 's' : ''} this team`
        : 'No leader — tag one in the Team tab')
      + `</div>`));
    tbox.appendChild(zone);
  });
  wrap.appendChild(tbox);

  // --- Room assignments (permanent) ---
  const raCleaners = (state.staff || []).filter(p => p.isCleaner);
  // Only leaders. A room belongs to a leader and their assistant works it with them, so
  // offering the whole roster here is offering the wrong answer twenty times over.
  const raLeaders = raCleaners.filter((p) => p.isLeader);
  const raPool = raLeaders.length ? raLeaders : (raCleaners.length ? raCleaners : (state.staff || []));
  const rooms = (state.servicedUnits || []).slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  wrap.appendChild(el(`<div class="section-label" style="margin-top:22px">Room assignments</div>`));
  const rabox = el(`<div class="addbox"></div>`);
  rabox.appendChild(el(`<div style="font-size:13px;color:#5f7189;margin-bottom:10px">Pick a cleaner to give a room to permanently. Auto-assign always keeps the room with them.</div>`));
  if (!rooms.length) {
    rabox.appendChild(el(`<div class="empty">No rooms yet — add units on the Airbnb tab.</div>`));
  } else if (!raPool.length) {
    rabox.appendChild(el(`<div class="empty">No staff yet. Add employees below first.</div>`));
  } else {
    rooms.forEach(u => {
      const row = el(`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #e7ecf3"></div>`);
      row.appendChild(el(`<div style="flex:0 0 auto;min-width:64px;font-size:14px;font-weight:700;color:#0f1a27">Unit ${esc(u.unit)}</div>`));
      const sel = el(`<select class="area-select" style="flex:1;min-width:0;margin:0"></select>`);
      sel.appendChild(el(`<option value="">— Anyone —</option>`));
      raPool.forEach(p => {
        const o = el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`);
        if (u.usualTo === p.id) o.setAttribute('selected', '');
        sel.appendChild(o);
      });
      sel.onchange = (e) => setUnitUsual(u.id, e.target.value);
      row.appendChild(sel);
      rabox.appendChild(row);
    });
  }
  wrap.appendChild(rabox);

  // --- Employees ---
  wrap.appendChild(el(`<div class="section-label" style="margin-top:22px">Employees</div>`));
  wrap.appendChild(employeeAddForm());
  employeeGroups(wrap);

  // --- Floors ---
  wrap.appendChild(el(`<div class="section-label" style="margin-top:22px">Building · floors</div>`));
  const fbox = el(`<div class="addbox"></div>`);
  fbox.appendChild(el(`<div style="font-size:13px;color:#5f7189;margin-bottom:8px">Number of residential floors (6 units each)</div>`));
  const frow = el(`<div style="display:flex;gap:8px;align-items:center"></div>`);
  const fIn = el(`<input id="floorCount" type="number" min="1" max="99" value="${state.floors}" style="flex:1">`);
  const fBtn = el(`<button class="add-btn" style="flex:0 0 auto;width:auto;padding:12px 18px">Set</button>`);
  fBtn.onclick = () => setFloors(document.getElementById('floorCount').value);
  frow.appendChild(fIn); frow.appendChild(fBtn); fbox.appendChild(frow);
  fbox.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;margin-top:8px">Currently ${state.floors} floors · ${state.floors*6} units</div>`));
  wrap.appendChild(fbox);

  // --- Add area ---
  wrap.appendChild(el(`<div class="section-label" style="margin-top:20px">Add a cleaning area</div>`));
  const abox = el(`<div class="addbox"></div>`);
  const aName = el(`<input id="newArea" placeholder="Area name (e.g. Lift lobby, Bin store)" style="margin-bottom:8px">`);
  abox.appendChild(aName);
  let aKind = 'interior', aFreq = 'daily';
  const kindRow = el(`<div style="display:flex;gap:6px;margin-bottom:8px"></div>`);
  const kindBtns = {};
  [['interior','Interior'],['exterior','Exterior']].forEach(([k,lbl]) => {
    const b = el(`<button class="freqpick ${k==='interior'?'on':''}">${lbl}</button>`);
    b.onclick = () => { aKind=k; Object.values(kindBtns).forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    kindBtns[k]=b; kindRow.appendChild(b);
  });
  abox.appendChild(kindRow);
  const freqRow = el(`<div style="display:flex;gap:6px;margin-bottom:10px"></div>`);
  const freqBtns = {};
  ['daily','weekly','monthly'].forEach(fk => {
    const b = el(`<button class="freqpick ${fk==='daily'?'on':''}">${FREQ[fk].label}</button>`);
    b.onclick = () => { aFreq=fk; Object.values(freqBtns).forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    freqBtns[fk]=b; freqRow.appendChild(b);
  });
  abox.appendChild(freqRow);
  const aBtn = el(`<button class="add-btn">+ Add area</button>`);
  aBtn.onclick = () => { const v=document.getElementById('newArea').value; if(!v.trim()){document.getElementById('newArea').focus();return;} addArea(v, aKind, aFreq); };
  abox.appendChild(aBtn);
  wrap.appendChild(abox);

  // --- Existing areas (interior then exterior) ---
  [['interior','Interior areas'],['exterior','Exterior areas']].forEach(([kind,title]) => {
    const list = state.areas.filter(a => a.kind===kind);
    wrap.appendChild(el(`<div class="section-label" style="margin-top:20px">${title} (${list.length})</div>`));
    if (!list.length) wrap.appendChild(el(`<div class="empty">None yet.</div>`));
    list.forEach(a => wrap.appendChild(areaCard(a)));
  });

  // --- Backup & Restore ---
  wrap.appendChild(el(`<div class="section-label" style="margin-top:28px">Backup &amp; Restore</div>`));
  const bbox = el(`<div class="addbox"></div>`);
  bbox.appendChild(el(`<div style="font-size:13px;color:#5f7189;margin-bottom:12px">Export your data to a file, or import a backup from another device.</div>`));
  const expBtn = el(`<button class="backup-btn backup-export">↓ Export Backup</button>`);
  expBtn.onclick = () => exportBackup();
  bbox.appendChild(expBtn);
  const impBtn = el(`<button class="backup-btn backup-import">↑ Import Backup</button>`);
  const fileIn = el(`<input type="file" accept=".json" style="display:none" id="backupFileInput">`);
  fileIn.onchange = (e) => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; };
  impBtn.onclick = () => fileIn.click();
  bbox.appendChild(impBtn);
  bbox.appendChild(fileIn);
  bbox.appendChild(el(`<div class="backup-msg" id="backupMsg" style="display:none"></div>`));
  wrap.appendChild(bbox);

  // --- Logout ---
  wrap.appendChild(el(`<div style="margin-top:32px;padding-top:16px;border-top:1px solid #e7ecf3"></div>`));
  const logoutBtn = el(`<button class="reset-btn" style="color:#dc2626;border-color:#f6d5d5">Sign Out</button>`);
  logoutBtn.onclick = () => showConfirm('Sign out?', 'You will need to log in again.', () => logout());
  wrap.appendChild(logoutBtn);

  return wrap;
}

function areaCard(a) {
  const editing = state.editingArea === a.id;
  const card = el(`<div class="su-card"></div>`);

  if (editing) {
    const inp = el(`<input id="edArea_${a.id}" value="${esc(a.label)}" style="margin-bottom:10px">`);
    card.appendChild(inp);
    const row = el(`<div style="display:flex;gap:8px"></div>`);
    const sv = el(`<button class="add-btn" style="flex:1">Save</button>`);
    sv.onclick = () => renameArea(a.id, document.getElementById('edArea_'+a.id).value);
    const cn = el(`<button class="modal-skip">Cancel</button>`);
    cn.onclick = () => { state.editingArea=null; render(); };
    row.appendChild(sv); row.appendChild(cn); card.appendChild(row);
    return card;
  }

  const top = el(`<div class="su-top"></div>`);
  const info = el(`<div style="flex:1;min-width:0"></div>`);
  info.appendChild(el(`<div class="su-unit" style="font-size:15px">${esc(a.label)}</div>`));
  const assigned = a.assignedTo ? STAFF.find(p=>p.id===a.assignedTo) : null;
  info.appendChild(el(`<div class="su-assign" style="color:#5f7189">${FREQ[a.freq].label} · ${assigned ? esc(assigned.name.split(' ')[0]) : 'Unassigned'}</div>`));
  top.appendChild(info);
  card.appendChild(top);

  // freq row
  const fctl = el(`<div class="su-ctl" style="border-top:none;padding-top:8px;margin-top:4px"></div>`);
  ['daily','weekly','monthly'].forEach(fk => {
    const b = el(`<button class="freqmini ${a.freq===fk?'on':''}">${FREQ[fk].label}</button>`);
    b.onclick = () => setAreaFreq(a.id, fk);
    fctl.appendChild(b);
  });
  card.appendChild(fctl);

  // assignment dropdown
  const assignRow = el(`<div style="display:flex;gap:6px;margin-top:8px;align-items:center"></div>`);
  const sel = el(`<select class="area-select"></select>`);
  sel.appendChild(el(`<option value="">Unassigned</option>`));
  // Leaders only, for the same reason the room picker is: naming an assistant here
  // quietly moves the job off the leader whose round it belongs to.
  // The rota decides who is offered, here as everywhere work is handed out.
  const arPick = cleaningStaff().filter(p => p.isLeader && onDutyToday(p));
  arPick.forEach(p => {
    const o = el(`<option value="${p.id}">${esc(p.name)}</option>`);
    if (a.assignedTo===p.id) o.setAttribute('selected','');
    sel.appendChild(o);
  });
  if (a.assignedTo && !arPick.some(p => p.id === a.assignedTo)) {
    const p = (state.staff || []).find(x => x.id === a.assignedTo);
    if (p) {
      const o = el(`<option value="${esc(p.id)}">${esc(p.name)} (${esc(offDutyWhy(p))})</option>`);
      o.setAttribute('selected','');
      sel.appendChild(o);
    }
  }
  sel.onchange = (e) => setAreaAssign(a.id, e.target.value);
  assignRow.appendChild(sel);
  card.appendChild(assignRow);

  // edit + remove
  const ctl = el(`<div class="su-ctl"></div>`);
  const kindToggle = el(`<button class="freqmini ${a.kind==='exterior'?'on':''}" style="flex:0 0 auto;padding:7px 12px">${a.kind==='interior'?'→ Make exterior':'→ Make interior'}</button>`);
  kindToggle.onclick = () => setAreaKind(a.id, a.kind==='interior'?'exterior':'interior');
  ctl.appendChild(kindToggle);
  const ed = el(`<button class="su-edit">Rename</button>`);
  ed.onclick = () => startEditArea(a.id);
  ctl.appendChild(ed);
  const rm = el(`<button class="su-rm">Remove</button>`);
  rm.onclick = () => removeArea(a.id);
  ctl.appendChild(rm);
  card.appendChild(ctl);

  return card;
}

function viewBuilding() {
  const wrap = el('<div class="body"></div>');

  wrap.appendChild(el(`<div class="note">The daily walk-through. Add or change areas in Settings.</div>`));
  const editBtn = el(`<button class="reset-btn" style="color:#0284c7;border-color:#cfe8fb">⚙ Edit areas & floors (Settings)</button>`);

function floorResidential(f) {
  const units = buildUnits().filter(u => u.floor===f);
  const doneCount = units.filter(u => state.completions[u.id+'::perm']).length;
  const who = whoCleansFloor(f);
  const color = who ? who.person.color : '#5b6a7f';
  const fid = 'floor-'+f;
  const open = state.expandedFloors[fid];
  const card = el(`<div class="floor"></div>`);
  const head = el(`<button class="floor-head"></button>`);
  head.appendChild(el(`<div class="floor-badge" style="background:${color}">${f}</div>`));
  const info = el(`<div class="floor-info"></div>`);
  info.appendChild(el(`<div class="floor-name">Floor ${f}</div>`));
  let sub = `${doneCount}/6 units · `;
  sub += who ? esc(who.person.name.split(' ')[0]) + (who.covering?' (cover)':'') : 'Unassigned';
  info.appendChild(el(`<div class="floor-sub">${sub}</div>`));
  head.appendChild(info);
  const prog = el(`<div class="floor-prog"></div>`);
  prog.appendChild(el(`<div style="width:${(doneCount/6)*100}%;background:${doneCount===6?'#15803d':'#b45309'}"></div>`));
  head.appendChild(prog);
  head.appendChild(el(`<div class="chev">${open?'▲':'▼'}</div>`));
  head.onclick = () => toggleFloorExpand(fid);
  card.appendChild(head);
  if (open) {
    const grid = el(`<div class="unit-grid"></div>`);
    units.forEach(u => {
      const done = !!state.completions[u.id+'::perm'];
      const unit = el(`<div class="unit ${done?'done':''}"></div>`);
      unit.appendChild(el(`<div class="unit-num">${u.num}</div>`));
      const mark = el(`<button class="unit-mark">${done?'✓ Done':'Mark'}</button>`);
      mark.onclick = (e) => { e.stopPropagation(); toggleUnit(u.id); };
      unit.appendChild(mark); grid.appendChild(unit);
    });
    card.appendChild(grid);
  }
  return card;
}

function floorCommon(id, label, zones, icon) {
  const doneCount = zones.filter(z => state.completions[z.id+'::'+freqKey(z.freq)]).length;
  const open = state.expandedFloors[id];
  const card = el(`<div class="floor"></div>`);
  const head = el(`<button class="floor-head"></button>`);
  head.appendChild(el(`<div class="floor-badge" style="background:#eef2f8;color:#5b6a7f;font-size:18px">${icon}</div>`));
  const info = el(`<div class="floor-info"></div>`);
  info.appendChild(el(`<div class="floor-name">${esc(label)}</div>`));
  info.appendChild(el(`<div class="floor-sub">${doneCount}/${zones.length} zones complete</div>`));
  head.appendChild(info);
  const prog = el(`<div class="floor-prog"></div>`);
  prog.appendChild(el(`<div style="width:${(doneCount/zones.length)*100}%;background:${doneCount===zones.length?'#15803d':'#b45309'}"></div>`));
  head.appendChild(prog);
  head.appendChild(el(`<div class="chev">${open?'▲':'▼'}</div>`));
  head.onclick = () => toggleFloorExpand(id);
  card.appendChild(head);
  if (open) {
    const list = el(`<div style="padding:4px 14px 14px"></div>`);
    zones.forEach(z => {
      const done = !!state.completions[z.id+'::'+freqKey(z.freq)];
      const fr = FREQ[z.freq];
      const row = el(`<div class="zone ${done?'done':''}"></div>`);
      const zinfo = el(`<div class="zone-info"></div>`);
      zinfo.appendChild(el(`<div class="zone-freq" style="color:${fr.tint}">${fr.label}</div>`));
      zinfo.appendChild(el(`<div class="zone-name">${esc(z.label)}</div>`));
      row.appendChild(zinfo);
      const mark = el(`<button class="zone-mark">${done?'✓':'Mark'}</button>`);
      mark.onclick = (e) => { e.stopPropagation(); toggleZone(z.id, z.freq); };
      row.appendChild(mark); list.appendChild(row);
    });
    card.appendChild(list);
  }
  return card;
}

function viewExterior() {
  const wrap = el('<div class="body"></div>');
  wrap.appendChild(el(`<div class="section-label">Exterior / grounds</div>`));
  areasExterior().forEach(z => {
    const done = !!state.completions[z.id+'::'+freqKey(z.freq)];
    const fr = FREQ[z.freq];
    const row = el(`<div class="zone ${done?'done':''}"></div>`);
    const zinfo = el(`<div class="zone-info"></div>`);
    zinfo.appendChild(el(`<div class="zone-freq" style="color:${fr.tint}">${fr.label}</div>`));
    zinfo.appendChild(el(`<div class="zone-name">${esc(z.label)}</div>`));
    if (z.assignedTo) { const p = STAFF.find(s=>s.id===z.assignedTo); if (p) zinfo.appendChild(el(`<div class="su-assign" style="color:#5f7189">${esc(p.name.split(' ')[0])}</div>`)); }
    row.appendChild(zinfo);

// Shared editable employee card
function employeeCard(p) {
  const editing = state.editingEmp === p.id;
  const card = el(`<div class="person" style="flex-direction:column;align-items:stretch;gap:10px"></div>`);

  if (editing) {
    const nameIn = el(`<input id="eeName_${p.id}" value="${esc(p.name)}" placeholder="Name">`);
    card.appendChild(nameIn);
    let chosenTeam = p.crew;
    const teamRow = el(`<div style="display:flex;gap:6px;flex-wrap:wrap"></div>`);
    const teamBtns = {};
    getTeams().forEach(t => {
      const b = el(`<button class="freqpick ${t.name===p.crew?'on':''}" style="flex:1 1 22%">${esc(t.name)}</button>`);
      b.onclick = () => { chosenTeam = t.name; Object.values(teamBtns).forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
      teamBtns[t.name] = b; teamRow.appendChild(b);
    });
    card.appendChild(teamRow);
    // Floors are tapped on and off, and save as you tap — see floorGrid(). A dashed
    // amber number is a floor somebody else has; tapping it moves the floor over.
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-top:8px">Floors</div>`));
    card.appendChild(floorGrid(p));
    // Free text, shown on their column on the wall. Blank it to take it off again.
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-top:8px">Note on the board</div>`));
    const noteRow = el(`<div style="display:flex;gap:6px;align-items:center"></div>`);
    const noteIn = el(`<input value="${esc(p.note || '')}" maxlength="60" placeholder="e.g. Offsite - 2 Dhagax" `
      + `style="flex:1;min-width:0;font-size:13px;padding:7px 9px;border:1px solid #d8e0ea;border-radius:8px">`);
    noteIn.onchange = (e) => setEmpNote(p.id, e.target.value);
    // OFFSITE IS THE ONE THAT KEEPS BEING TYPED. It is still office work, just at
    // another of the buildings, so it is not a status and not a team - it is the same
    // note every time. One tap writes the word and leaves the cursor to add which
    // building, because "Offsite" alone answers half the question people ask.
    const offBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:7px 11px">Offsite</button>`);
    offBtn.onclick = () => {
      const cur = String(p.note || '');
      setEmpNote(p.id, /^offsite/i.test(cur) ? '' : (cur ? 'Offsite - ' + cur : 'Offsite - '));
    };
    if (/^offsite/i.test(String(p.note || ''))) offBtn.classList.add('on');
    noteRow.appendChild(noteIn); noteRow.appendChild(offBtn);
    card.appendChild(noteRow);
    // What this person is cleared to clean. Trainees are commonly kept off offices.
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-top:8px">Cleared to clean</div>`));
    const canRow = el(`<div style="display:flex;gap:6px;flex-wrap:wrap"></div>`);
    UNIT_TYPE_ORDER.forEach(tk => {
      const on = canCleanType(p, tk);
      const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:1 1 28%">${on ? '✓ ' : ''}${UNIT_TYPES[tk].label}</button>`);
      b.onclick = () => toggleCanClean(p.id, tk);
      canRow.appendChild(b);
    });
    card.appendChild(canRow);
    const row = el(`<div style="display:flex;gap:8px"></div>`);
    const sv = el(`<button class="add-btn" style="flex:1">Save</button>`);
    // null = leave the floors alone; the grid above has already saved them.
    sv.onclick = () => editEmployee(p.id, document.getElementById('eeName_'+p.id).value, chosenTeam, null);
    const cn = el(`<button class="modal-skip">Cancel</button>`);
    cn.onclick = () => cancelEditEmp();
    row.appendChild(sv); row.appendChild(cn);
    card.appendChild(row);
    return card;
  }

  const role = roleOf(p);
  const top = el(`<div style="display:flex;align-items:center;gap:10px"></div>`);
  const info = el(`<div class="person-info"></div>`);
  // The role is the first thing about a person, so it is on the name line — as a
  // word, not a star somebody has to be told the meaning of.
  info.appendChild(el(`<div class="person-name">${esc(p.name)}`
    + ` <span style="color:${ROLES[role].color};font-size:12px;font-weight:700">`
    + `${ROLES[role].icon}${ROLES[role].label}</span></div>`));
  info.appendChild(el(`<div class="person-floors">${esc(p.crew || 'No team')} · ${esc(personFloors(p))}</div>`));
  top.appendChild(info);
  card.appendChild(top);

  // ROLE: one picker, three states. Two independent toggles meant a leader who was
  // not a cleaner was possible and meaningless, and nothing ever said "assistant".
  const roleRow = el(`<div style="display:flex;gap:6px"></div>`);
  ROLE_ORDER.forEach((rk) => {
    const on = role === rk;
    const b = el(`<button class="freqmini ${on ? 'on' : ''}" title="${esc(ROLES[rk].hint)}" `
      + `style="flex:1 1 0;padding:8px 6px;font-size:12px`
      + (on ? `;border-color:${ROLES[rk].color};color:${ROLES[rk].color};font-weight:800` : '') + `">`
      + `${ROLES[rk].icon}${esc(ROLES[rk].label)}</button>`);
    b.onclick = () => setRole(p.id, rk);
    roleRow.appendChild(b);
  });
  card.appendChild(roleRow);
  card.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:-4px">${esc(ROLES[role].hint)}</div>`));

  // "Never deal them rooms" — for somebody who turns up late enough that a hand-out
  // based on badge-ins gets it wrong every time.
  if (p.isCleaner) {
    const naRow = el(`<div style="display:flex;align-items:center;gap:8px;margin-top:6px"></div>`);
    const on = noAuto(p);
    const nb = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:0 0 auto;padding:6px 10px;font-size:11px`
      + (on ? ';border-color:#b45309;color:#b45309;font-weight:800' : '') + `">`
      + `${on ? '✓ ' : ''}Rooms by hand only</button>`);
    nb.onclick = () => toggleNoAuto(p.id);
    naRow.appendChild(nb);
    naRow.appendChild(el(`<div style="font-size:11px;color:#5f7189;flex:1">`
      + (on ? 'Never dealt rooms automatically — you give them theirs.'
            : 'Include them in the morning hand-out.') + `</div>`));
    card.appendChild(naRow);
  }

  // TEAM: changed here, not three taps away inside Edit.
  const teamRow = el(`<div style="display:flex;align-items:center;gap:8px"></div>`);
  teamRow.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:700;flex:0 0 auto">Team</div>`));
  const teamSel = el(`<select style="flex:1;min-width:0;background:#ffffff;color:#15202e;`
    + `border:1px solid #d8e0ea;border-radius:8px;padding:8px 10px;font-size:14px"></select>`);
  getTeams().forEach((t) => {
    const o = el(`<option value="${esc(t.name)}"${t.name === p.crew ? ' selected' : ''}>${esc(t.name)}</option>`);
    teamSel.appendChild(o);
  });
  teamSel.onchange = (e) => editEmployee(p.id, p.name, e.target.value, (p.floors || []).join(', '));
  teamRow.appendChild(teamSel);
  card.appendChild(teamRow);

  const ctl = el(`<div class="su-ctl" style="border-top:none;padding-top:0;margin-top:0;flex-wrap:wrap"></div>`);
  const sh = shiftOf(p);
  const shift = el(`<button class="freqmini" title="Tap to change shift" style="flex:0 0 auto;padding:7px 12px;color:${SHIFTS[sh].color};border-color:${SHIFTS[sh].color}">${SHIFTS[sh].icon} ${SHIFTS[sh].label}</button>`);
  shift.onclick = () => cycleShift(p.id);
  const ct = typeOf(p);
  const ctype = el(`<button class="freqmini" title="Tap to change type" style="flex:0 0 auto;padding:7px 12px;color:${CLEAN_TYPES[ct].color};border-color:${CLEAN_TYPES[ct].color}">${CLEAN_TYPES[ct].icon} ${CLEAN_TYPES[ct].label}</button>`);
  ctype.onclick = () => cycleCleanType(p.id);
  const ed = el(`<button class="su-edit">Edit</button>`);
  ed.onclick = () => startEditEmp(p.id);
  const rm = el(`<button class="su-rm">Remove</button>`);
  rm.onclick = () => removeEmployee(p.id);
  ctl.appendChild(shift); ctl.appendChild(ctype); ctl.appendChild(ed); ctl.appendChild(rm);
  card.appendChild(ctl);

  // WORKS ON — only worth the room for cleaners; nobody is handing rooms to the
  // rest, so a rota for them is noise. All seven lit is the default and means
  // "every day", which is why nothing here needs setting up before it works.
  if (p.isCleaner) {
    // FOLDED AWAY UNLESS IT SAYS SOMETHING. Seven buttons on every card is most of
    // the height of the Team tab, and for almost everyone they all read "in". The
    // line states the rota; tap it to change it.
    const offCount = Array.isArray(p.worksOn) ? 7 - p.worksOn.length : 0;
    const rotaOpen = (state.expandedRota || {})[p.id];
    if (!rotaOpen) {
      const sum = el(`<button class="freqmini" style="width:100%;padding:7px;font-size:11px;text-align:left">`
        + `Works ${offCount ? WEEKDAYS.filter(([, d]) => worksStateOf(p, d) !== 'off').map(([l]) => l).join(' ') : 'every day'} · change</button>`);
      sum.onclick = () => { state.expandedRota = { ...(state.expandedRota || {}), [p.id]: true }; save(); render(); };
      card.appendChild(sum);
      return card;
    }
    const wRow = el('<div class="su-ctl" style="border-top:none;padding-top:6px;margin-top:2px;flex-wrap:wrap;align-items:center"></div>');
    const hide = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 9px;font-size:11px">▾</button>`);
    hide.onclick = () => { state.expandedRota = { ...(state.expandedRota || {}), [p.id]: false }; save(); render(); };
    wRow.appendChild(hide);
    wRow.appendChild(el(`<div style="flex:0 0 auto;font-size:11px;color:#5f7189;font-weight:700;margin-right:2px" `
      + `title="Which days this person is expected in">Works on${offCount ? '' : ' · every day'}</div>`));
    WEEKDAYS.forEach(([lbl, dow]) => {
      const rota = altRotaFor(p, dow);
      const st = rota ? 'rota' : worksStateOf(p, dow);
      const style = st === 'off' ? ';opacity:0.4'
        : st === 'rota' ? ';border-color:#7c3aed;color:#7c3aed' : '';
      const tip = st === 'off' ? 'Off every ' + lbl
        : st === 'on' ? 'In every ' + lbl
        : 'In on ' + rota.weeks.length + ' ' + lbl + 's out of every ' + rota.cycle;
      const b = el(`<button class="freqmini ${st === 'on' ? 'on' : ''}" title="${esc(tip)}" `
        + `style="flex:0 0 auto;padding:6px 9px;font-size:11px${style}">`
        + `${lbl}${rota ? ' ' + rota.weeks.length + '/' + rota.cycle : ''}</button>`);
      b.onclick = () => cycleWorksOn(p.id, dow);
      wRow.appendChild(b);
    });
    card.appendChild(wRow);
  }
  return card;
}

// Render staff grouped by team, using editable cards
function employeeGroups(wrap) {
  if (!STAFF.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">No employees yet. Add your first above.</div>`));
    return;
  }
  // Show only cleaners by default (once any are tagged); "All staff" reveals everyone.
  const anyCleaner = STAFF.some(p => p.isCleaner);
  const showAll = teamShowAll || !anyCleaner;
  const list = showAll ? STAFF : STAFF.filter(p => p.isCleaner);
  if (!list.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">No cleaners tagged yet. Switch to "All staff" and tap <b>+ Cleaner</b> on the cleaners.</div>`));
    return;
  }
  const crews = [...new Set(list.map(p => p.crew))]
    .sort((a, b) => String(a || '').localeCompare(String(b || ''), undefined, { numeric: true, sensitivity: 'base' }));
  crews.forEach(crewName => {
    const members = list.filter(p => p.crew===crewName)
      // Leader first, then by name. Without the name tie-break the crew appeared in
      // whatever order people were added, so a rehired cleaner sat at the bottom.
      .sort((a, b) => (b.isLeader?1:0) - (a.isLeader?1:0)
        || String(a.name).localeCompare(String(b.name), undefined, { numeric: true, sensitivity: 'base' }));
    const color = members[0].color;
    const group = el(`<div class="crew-group"></div>`);
    const head = el(`<div class="crew-head"></div>`);
    head.appendChild(el(`<div class="crew-dot" style="background:${color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${esc(crewName)}</div>`));
    head.appendChild(el(`<div class="crew-sub">${members.length}</div>`));
    group.appendChild(head);

    // WHO ANSWERS FOR THIS TEAM, AND WHO IS WITH THEM. A flat stack of identical
    // cards says nothing about how the team is actually shaped — you had to read
    // every card and remember which ones carried a star. The leader is named, and the
    // assistants read straight off the same line, so the team is one glance.
    const leaders = members.filter((x) => x.isLeader);
    const assistants = members.filter((x) => !x.isLeader && x.isCleaner);
    const first = (n) => String(n).split(' ')[0];
    const shape = el(`<div style="font-size:12px;font-weight:600;margin:-4px 0 8px;line-height:1.5"></div>`);
    shape.appendChild(el(leaders.length
      ? `<span style="color:#b45309">${leaders.map((l) => '★ ' + esc(l.name)).join(' · ')}</span>`
      : `<span style="color:#b45309">No leader yet</span>`));
    shape.appendChild(el(assistants.length
      ? `<span style="color:#5f7189"> with ${esc(assistants.map((a) => first(a.name)).join(', '))}</span>`
      : `<span style="color:#5f7189"> — no assistants</span>`));
    group.appendChild(shape);

    members.forEach(p => group.appendChild(employeeCard(p)));
    wrap.appendChild(group);
  });
}

function viewHistory() {
  const wrap = el('<div class="body"></div>');

  if (!db) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:30px 0">History needs the shared server, which isn't connected on this build.</div>`));
    return wrap;
  }

  // A night that never got entered is noticed here, so this is where you fix it.
  const pastBtn = el(`<button class="add-btn" style="width:100%;margin-bottom:14px">＋ Record a past day</button>`);
  pastBtn.onclick = () => openBackdate(historyDay && historyDay !== todayKey() ? historyDay : yesterdayKey());
  wrap.appendChild(pastBtn);

  // Room filter
  const sel = el(`<select class="area-select" style="margin-bottom:14px"></select>`);
  sel.appendChild(el(`<option value="all">All rooms</option>`));
  (state.servicedUnits || []).slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }))
    .forEach(u => {
      const o = el(`<option value="${esc(u.id)}">Unit ${esc(u.unit)}${u.guest ? ' · ' + esc(u.guest) : ''}</option>`);
      if (historyFilter === u.id) o.setAttribute('selected', '');
      sel.appendChild(o);
    });
  // Areas are logged like rooms, so they have to be findable like rooms.
  if (areasInterior().length) {
    const g = el(`<optgroup label="Communal areas"></optgroup>`);
    areasInterior().forEach(a => {
      const o = el(`<option value="${esc(areaLogId(a))}">${esc(a.label)}</option>`);
      if (historyFilter === areaLogId(a)) o.setAttribute('selected', '');
      g.appendChild(o);
    });
    sel.appendChild(g);
  }
  sel.onchange = (e) => { historyFilter = e.target.value; render(); };
  wrap.appendChild(sel);

  // Day picker — pick any past day to see what was cleaned that day (blank = every day).
  const dayRow = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"></div>');
  const dayIn = el(`<input type="date" value="${esc(historyDay)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#16233a;color:#eaf1fb;border:1px solid #3d557f;border-radius:8px;padding:8px 10px;font-size:14px">`);
  dayIn.onchange = (e) => { historyDay = e.target.value || ''; render(); };
  const calBtn = el('<button class="freqmini" title="Pick a date" style="flex:0 0 auto">📅</button>');
  calBtn.onclick = () => { try { dayIn.showPicker(); } catch (e) { dayIn.focus(); dayIn.click(); } };
  dayRow.appendChild(dayIn);
  dayRow.appendChild(calBtn);
  if (historyDay) {
    const clr = el('<button class="freqmini">✕ All days</button>');
    clr.onclick = () => { historyDay = ''; render(); };
    dayRow.appendChild(clr);
  }
  wrap.appendChild(dayRow);

  let rows = cleaningHistory;
  if (historyFilter !== 'all') rows = rows.filter(r => r.unit_id === historyFilter);
  if (historyDay) rows = rows.filter(r => dayKeyLocal(r.cleaned_at) === historyDay);

  const scope = historyDay ? ('on ' + historyDay) : 'in total';
  wrap.appendChild(el(`<div class="section-label">${rows.length} cleaning${rows.length === 1 ? '' : 's'} ${scope}</div>`));

  if (!rows.length) {
    const msg = historyDay ? 'Nothing was logged as cleaned on this day.' : 'Nothing logged yet. Mark a room clean and it shows up here.';
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">${msg}</div>`));
    return wrap;
  }

  // When viewing all days, break the list up with a header per day.
  let lastDay = null;
  rows.forEach(r => {
    if (!historyDay) {
      const dk = dayKeyLocal(r.cleaned_at);
      if (dk !== lastDay) {
        lastDay = dk;
        const dLabel = new Date(r.cleaned_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#5f7189">${esc(dLabel)}</div>`));
      }
    }
    const card = el(`<div class="su-card"></div>`);
    const top = el(`<div class="su-top"></div>`);
    const info = el(`<div style="flex:1;min-width:0"></div>`);
    // A communal area has a name, not a number — "Unit Main Lobby" reads as a fault.
    info.appendChild(el(`<div class="su-unit" style="font-size:15px">${isAreaLog(r.unit_id) ? '' : 'Unit '}${esc(r.unit_label || r.unit_id)}</div>`));
    info.appendChild(el(`<div class="su-guest">by ${esc(r.cleaner_name || 'Unknown')}</div>`));
    top.appendChild(info);
    top.appendChild(el(`<div class="su-next">${esc(fmtWhen(r.cleaned_at))}</div>`));
    card.appendChild(top);
    wrap.appendChild(card);
  });
  return wrap;
}

function viewTeam() {
  const wrap = el('<div class="body"></div>');
  const total = (state.staff || []).length;
  const cleaners = (state.staff || []).filter((p) => p.isCleaner).length;
  wrap.appendChild(el(`<div class="note">${cleaners ? `<b>${cleaners}</b> of ${total} tagged as cleaners.` : `None tagged as cleaners yet, so all ${total} show.`} Tap <b>Cleaner</b> on a person to add them.</div>`));

  // Filter: cleaners only (default) vs everyone. Lets you hide office/management after a sync.
  if (cleaners) {
    const seg = el('<div style="display:flex;gap:6px;margin-bottom:12px"></div>');
    const mk = (lbl, on, fn) => { const b = el(`<button class="freqpick ${on ? 'on' : ''}" style="flex:1">${lbl}</button>`); b.onclick = fn; return b; };
    seg.appendChild(mk(`Cleaners (${cleaners})`, !teamShowAll, () => { teamShowAll = false; render(); }));
    seg.appendChild(mk(`All staff (${total})`, teamShowAll, () => { teamShowAll = true; render(); }));
    wrap.appendChild(seg);
  }

  if (cleaners) wrap.appendChild(floorAllocationBox());

  // SHARE OUT THE REST DAY — the Friday off alternates, so half the crew is in one
  // week and half the next. Doing that by hand across a whole crew is where it drifts
  // and somebody quietly ends up working most Fridays.
  if (cleaners) {
    const fri = 5;
    const crew = cleaningStaff();
    const onRota = crew.filter((p) => altRotaFor(p, fri));
    const allTeams = rotaTeams();
    const byTeam = teamFridayBy === 'team' && allTeams.length > 1;
    const nextFri = nextDowKey(fri);
    const box = el('<div style="margin-bottom:14px"></div>');
    box.appendChild(el(`<div class="section-label">Friday rota</div>`));

    // IN TEAMS OR IN PEOPLE. A team is the unit the work is done in — an assistant works
    // their leader's round with them — so sharing the rest day person by person splits
    // pairs and leaves a round short of the hands it was planned for. Teams is the
    // honest default; people is still there for a crew that does not work in pairs.
    const modeRow = el('<div style="display:flex;gap:6px;margin-bottom:8px"></div>');
    [['team', 'By team'], ['person', 'By person']].forEach(([k, lbl]) => {
      if (k === 'team' && allTeams.length < 2) return;
      const b = el(`<button class="freqmini ${teamFridayBy === k ? 'on' : ''}" style="flex:1">${lbl}</button>`);
      b.onclick = () => { teamFridayBy = k; render(); };
      modeRow.appendChild(b);
    });
    box.appendChild(modeRow);

    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-2px 0 8px">`
      + (byTeam
        ? `The leaders work alternate Fridays with their assistants. Tap the teams that are in this coming Friday — everything else is in the one after.`
        : `Pick how many are in each Friday. Everyone then does the same number of them, `
          + `and the week is easier for having had the hands.`)
      + `</div>`));

    // No "how many in" in team mode: it alternates, so the split IS the choice. Whatever
    // is tapped is in this Friday and everything else is in the next one.
    if (!byTeam) {
      const pickRow = el('<div style="display:flex;gap:6px;margin-bottom:8px"></div>');
      [2, 3, 4].forEach((n) => {
        if (n > crew.length) return;
        const b = el(`<button class="freqmini ${teamFridayPer === n ? 'on' : ''}" style="flex:1">${n} in</button>`);
        b.onclick = () => { teamFridayPer = n; render(); };
        pickRow.appendChild(b);
      });
      box.appendChild(pickRow);
    }

    // WHO STARTS, CHOSEN RATHER THAN SHUFFLED INTO PLACE. "Put the other group on first"
    // rotates the whole line one notch at a time, which is fine for two groups and
    // useless for seven teams — finding the pair you want means tapping it until they
    // come round. Say which teams are in this Friday and the cycle is built to land
    // them there; everybody else follows in order behind them.
    if (byTeam) {
      box.appendChild(el(`<div style="font-size:11px;font-weight:800;color:#7f9abf;margin:2px 0 6px">`
        + `IN THIS COMING FRIDAY (${esc(fmtDay(nextFri))})</div>`));
      const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>');
      allTeams.forEach((t) => {
        const lead = teamMembers(t).find((x) => x.isLeader);
        const on = (teamFridayStart || []).indexOf(t) >= 0;
        const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:0 0 auto">`
          + `${esc(t)}${lead ? ' · ' + esc(lead.name.split(' ')[0]) : ''}</button>`);
        b.onclick = () => {
          const cur = (teamFridayStart || []).slice();
          const at = cur.indexOf(t);
          if (at >= 0) cur.splice(at, 1); else cur.push(t);
          teamFridayStart = cur;
          render();
        };
        chips.appendChild(b);
      });
      box.appendChild(chips);
    }

    const mkRota = () => byTeam
      ? buildTeamAltRota(fri, teamFridayStart, nextFri)
      : buildDayRota(fri, teamFridayPer, teamFridayShift, teamFridayOrder);
    const label = (wk) => (byTeam ? wk.map((t) => String(t)) : wk.map((x) => x.name.split(' ')[0])).join(', ');

    const btn = el(`<button class="add-btn" style="background:#7c3aed;color:#ffffff">`
      + (byTeam ? '⚖ Set the Friday rota by team' : '⚖ Share the Friday rota out evenly') + `</button>`);
    btn.onclick = () => {
      const rota = mkRota();
      if (!rota.cycle) { showInfo('Nothing to share out', 'No teams run a round yet — tag a leader on each team first.'); return; }
      const each = rota.byPerson[Object.keys(rota.byPerson)[0]];
      const slot = weekIndex(nextFri, rota.cycle);
      // Week 0 IS the coming Friday — the cycle was slid to put it there — so read the
      // teams off week 0 rather than off what was tapped. If fewer teams were picked
      // than are in each Friday, the rest of week 0 filled in behind them and the
      // office has to see that before it becomes the rota.
      const onNext = byTeam
        ? (rota.weeks[0] || [])
        : Object.keys(rota.byPerson)
            .filter((pid) => rota.byPerson[pid].weeks.indexOf(slot) >= 0)
            .map((pid) => rota.byPerson[pid].name.split(' ')[0]);
      const onNextTxt = onNext.join(', ') || 'nobody';
      const preview = byTeam
        ? (fmtDay(nextFri) + ': ' + label(rota.inNow)
           + '\n' + fmtDay(shiftDay(nextFri, 7)) + ': ' + label(rota.other)
           + '\n… and so on, every other Friday')
        : rota.weeks.slice(0, 4).map((wk, i) => 'Friday ' + (i + 1) + ': ' + label(wk)).join('\n');
      showConfirm(
        byTeam ? 'Alternate Fridays, by team?'
          : rota.perWeek + ' in every Friday?',
        'This coming Friday (' + fmtDay(nextFri) + '): ' + (onNextTxt || 'nobody')
          + (byTeam ? '' : '\n\nIf that is the same lot who were in last Friday, close this and tap '
              + '"↻ Put the other group on first", then set it.')
          + '\n\n' + preview + (!byTeam && rota.cycle > 4 ? '\n… and so on' : '')
          + (byTeam
            ? '\n\nEvery team works one Friday in two, and a leader is in with their own '
              + 'assistants. ' + (rota.crew || []).length + ' people covered. You can still '
              + 'change any one person by hand afterwards.'
            : '\n\nIt comes round every ' + rota.cycle + ' weeks, so each one of the '
              + (rota.crew || []).length + ' works ' + (each ? each.weeks.length : 0)
              + ' Fridays out of ' + rota.cycle
              + ' — the same for everybody. You can still change any one person by hand afterwards.'),
        () => applyDayRota(fri, rota),
        'Set the rota',
        'safe'
      );
    };
    box.appendChild(btn);

    if (!byTeam) {
      const shift = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:6px">`
        + `↻ Put the other group on first</button>`);
      shift.onclick = () => { teamFridayShift = (teamFridayShift + 1) % Math.max(2, cleaningStaff().length); render(); };
      box.appendChild(shift);
      const draw = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:6px">`
        + (teamFridayOrder ? '🎲 Draw again' : '🎲 Draw it at random') + `</button>`);
      draw.onclick = () => {
        const ids = cleaningStaff().map((p) => p.id);
        for (let i = ids.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
        }
        teamFridayOrder = ids;
        render();
      };
      box.appendChild(draw);
    }

    // The rota as it will be, before it is the rota.
    {
      const r = mkRota();
      if (r.cycle && (byTeam ? (teamFridayStart || []).length : teamFridayOrder)) {
        const b2 = el(`<div style="font-size:11px;font-weight:700;color:#b7c8de;background:#101c30;`
          + `border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.55"></div>`);
        b2.appendChild(el(`<div style="color:#38bdf8">Set out below — not saved yet</div>`));
        if (byTeam) {
          b2.appendChild(el(`<div style="color:#fcd34d">${esc(fmtDay(nextFri))}: ${esc(label(r.inNow) || 'nobody')}</div>`));
          b2.appendChild(el(`<div style="color:#7f9abf">${esc(fmtDay(shiftDay(nextFri, 7)))}: ${esc(label(r.other) || 'nobody')}</div>`));
          b2.appendChild(el(`<div style="color:#5f7189">… and so on, every other Friday</div>`));
        } else {
          r.weeks.slice(0, 4).forEach((wk, i) => b2.appendChild(
            el(`<div style="color:#7f9abf">Friday ${i + 1}: ${esc(label(wk))}</div>`)));
          if (r.cycle > 4) b2.appendChild(el(`<div style="color:#5f7189">… and so on, every ${r.cycle} weeks</div>`));
        }
        box.appendChild(b2);
      }
    }

    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
      + (onRota.length
        ? `${onRota.length} of ${crew.length} are on a Friday rota — <b>${crew.filter((p) => worksOnDay(p, nextDowKey(fri))).length}</b> in this coming Friday.`
        : `Nobody is on a Friday rota yet — everyone is down as working every one.`)
      + `</div>`));
    wrap.appendChild(box);
  }

  // WORK THE ROTA OUT FROM WHO ACTUALLY TURNS UP. The machinery for this has been
  // here all along — it reads six weeks of clock-ins and tells a rest day from a
  // sick day — but nothing ever called it, so the rota stayed hand-typed and drifted
  // out of step with the crew. It proposes; you see exactly what changes before it
  // is applied, and any one person can still be set by hand afterwards.
  if (cleaners) {
    const box = el('<div style="margin-bottom:14px"></div>');
    box.appendChild(el(`<div class="section-label">Work out the rota</div>`));
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 8px">`
      + `From the last ${ROTA_WINDOW_DAYS} days of clock-ins. Anyone too irregular to call is left alone.</div>`));
    const btn = el(`<button class="add-btn" style="background:#0284c7;color:#ffffff">🗓 Work out the rota from the clock-ins</button>`);
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = 'Reading the clock-ins…';
      const r = await inferRotasFromAttendance(ROTA_WINDOW_DAYS);
      btn.disabled = false; btn.textContent = '🗓 Work out the rota from the clock-ins';
      if (!r) { showInfo('Could not read the clock-ins', 'The server did not answer. Check the connection and try again.'); return; }
      if (!r.days) { showInfo('No clock-ins to read', 'Nothing has been recorded in the last ' + ROTA_WINDOW_DAYS + ' days, so there is nothing to work a rota out from.'); return; }
      if (!r.proposals.length) {
        showInfo('Nothing to change', 'Across ' + r.days + ' days of clock-ins, everybody reads as working every day they are already down for.'
          + (r.skipped.length ? '\n\nToo irregular to call: ' + r.skipped.map((x) => x.name.split(' ')[0] + ' (' + x.reason + ')').join(', ') : ''));
        return;
      }
      const lines = r.proposals.map((x) =>
        x.name.split(' ')[0] + ' — off ' + x.off.map((d) => DOW_LABEL[d]).join(', ')
        + (x.unclear.length ? ' (' + x.unclear.map((d) => DOW_LABEL[d]).join(', ') + ' left on, too few to judge)' : ''));
      showConfirm(
        'Set the rota for ' + r.proposals.length + ' ' + (r.proposals.length === 1 ? 'person' : 'people') + '?',
        'From ' + r.days + ' days of clock-ins:\n\n' + lines.join('\n')
          + (r.skipped.length ? '\n\nLeft alone, too irregular to read: ' + r.skipped.map((x) => x.name.split(' ')[0]).join(', ') : '')
          + '\n\nA rest day set here only stops rooms being handed out on it. Anyone who turns up anyway still shows on the roll call and can be given rooms.',
        () => applyRotas(r.proposals),
        'Set the rota',
        'safe'
      );
    };
    box.appendChild(btn);
    wrap.appendChild(box);
  }

  // Add-employee form only matters when viewing everyone.
  if (teamShowAll || !cleaners) wrap.appendChild(employeeAddForm());
  employeeGroups(wrap);
  return wrap;
}

// ============================================================
// CUSTOM CONFIRM MODAL
// ============================================================
let _confirmState = null;
// okLabel/okTone let a non-destructive confirm (e.g. changing a schedule) avoid the
// red "Remove" button, which reads as "you're about to delete something".
function showConfirm(title, message, onConfirm, okLabel, okTone, infoOnly) {
  _confirmState = { title, message, onConfirm, okLabel, okTone, infoOnly };
  renderConfirmModal();
}
// Something to read, not something to decide. One way out, so nobody has to work out
// what the difference between "Cancel" and "Close" is meant to be.
function showInfo(title, message) {
  showConfirm(title, message, () => {}, 'Close', 'safe', true);
}
function dismissConfirmModal() { _confirmState = null; const e = document.getElementById('confirmModal'); if (e) e.remove(); }
function renderConfirmModal() {
  if (!_confirmState) return;
  const existing = document.getElementById('confirmModal');
  if (existing) existing.remove();
  const overlay = el(`<div class="modal-overlay" id="confirmModal" style="align-items:center"></div>`);
  const modal = el(`<div class="modal" style="border-radius:16px"></div>`);
  modal.appendChild(el(`<div class="modal-title">${esc(_confirmState.title)}</div>`));
  modal.appendChild(el(`<div class="modal-sub">${esc(_confirmState.message)}</div>`));
  const btnRow = el(`<div class="modal-btns"></div>`);
  const cancelBtn = el(`<button class="modal-skip">Cancel</button>`);
  cancelBtn.onclick = () => dismissConfirmModal();
  if (_confirmState.infoOnly) cancelBtn.style.display = 'none';
  const confirmBtn = el(`<button class="${_confirmState.okTone === 'safe' ? 'modal-confirm' : 'modal-danger'}">${esc(_confirmState.okLabel || 'Remove')}</button>`);
  confirmBtn.onclick = () => { const cb = _confirmState.onConfirm; dismissConfirmModal(); cb(); };
  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(confirmBtn);
  modal.appendChild(btnRow);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) dismissConfirmModal(); };
  document.getElementById('app').appendChild(overlay);
}

// The sheet for recording a past day. Ticks and name-picks update the DOM in place
// rather than re-rendering: on a 60-room list a full redraw on every tap throws the
// office back to the top of the page mid-entry.
function backdateSheet() {
  const b = _backdate;
  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`<div class="modal" style="max-height:88vh;overflow-y:auto"></div>`);
  modal.appendChild(el(`<div class="modal-title">Record a past day</div>`));
  modal.appendChild(el(`<div class="modal-sub">Names offered are whoever badged in that day.</div>`));

  // --- which day ---
  modal.appendChild(el(`<div class="modal-label">Which day</div>`));
  const dayRow = el(`<div style="display:flex;gap:6px;align-items:center"></div>`);
  const dayIn = el(`<input type="date" value="${esc(b.day)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#16233a;color:#eaf1fb;border:1px solid #3d557f;border-radius:8px;padding:9px 10px;font-size:14px">`);
  dayIn.onchange = (e) => setBackdateDay(e.target.value);
  dayRow.appendChild(dayIn);
  [['Yesterday', yesterdayKey()], ['Today', todayKey()]].forEach(([lbl, d]) => {
    const btn = el(`<button class="freqmini ${b.day === d ? 'on' : ''}" style="flex:0 0 auto;padding:9px 10px">${lbl}</button>`);
    btn.onclick = () => setBackdateDay(d);
    dayRow.appendChild(btn);
  });
  modal.appendChild(dayRow);

  // --- who was in that day ---
  const crew = Object.keys(b.arrivals)
    .map(id => (state.staff || []).find(p => p.id === id))
    .filter(Boolean)
    .sort((x, y) => String(b.arrivals[x.id].raw || '').localeCompare(String(b.arrivals[y.id].raw || '')));
  let crewMsg, crewTone = '#5f7189';
  if (b.loading) crewMsg = 'Checking who badged in…';
  else if (b.failed) { crewMsg = 'Could not read attendance for this day — pick names by hand.'; crewTone = '#b45309'; }
  else if (!crew.length) { crewMsg = 'Nobody badged in on this day. Add them on Roll Call for that day, or record the rooms as Office.'; crewTone = '#b45309'; }
  else crewMsg = crew.length + ' badged in — ' + crew.map(p => p.name.split(' ')[0] + ' ' + (b.arrivals[p.id].time || '')).join(' · ');
  modal.appendChild(el(`<div style="font-size:12px;color:${crewTone};font-weight:600;margin-top:10px;line-height:1.5">${esc(crewMsg)}</div>`));

  // --- which rooms ---
  modal.appendChild(el(`<div class="modal-label">What was cleaned</div>`));
  const filterRow = el(`<div style="display:flex;gap:6px;margin-bottom:10px"></div>`);
  [['all', 'All'], ['airbnb', 'Airbnb'], ['office', 'Offices'], ['building', 'Buildings']].forEach(([k, lbl]) => {
    const btn = el(`<button class="freqmini ${b.type === k ? 'on' : ''}">${lbl}</button>`);
    btn.onclick = () => setBackdateType(k);
    filterRow.appendChild(btn);
  });
  modal.appendChild(filterRow);

  const rooms = backdateRooms();
  const openRooms = rooms.filter(u => !loggedOnDay(u.id, b.day));
  const countLbl = el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:1"></div>`);
  const selRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"></div>`);
  selRow.appendChild(countLbl);
  const allBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">Tick all</button>`);
  allBtn.onclick = () => backdateSelectAll(true);
  const noneBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">Clear</button>`);
  noneBtn.onclick = () => backdateSelectAll(false);
  selRow.appendChild(allBtn); selRow.appendChild(noneBtn);
  modal.appendChild(selRow);

  const saveBtn = el(`<button class="modal-confirm"></button>`);
  const tickedCount = () => openRooms.filter(u => b.chosen[u.id]).length;
  const refreshCount = () => {
    const n = tickedCount();
    countLbl.textContent = n + ' of ' + openRooms.length + ' ticked';
    saveBtn.textContent = b.saving ? 'Saving…' : (n ? 'Log ' + n + ' cleaning' + (n === 1 ? '' : 's') : 'Log cleanings');
  };

  if (!rooms.length) modal.appendChild(el(`<div class="empty" style="text-align:center;padding:18px 0">No rooms of this kind.</div>`));
  rooms.forEach(u => {
    const already = loggedOnDay(u.id, b.day);
    const card = el(`<div class="su-card" style="padding:10px 12px;${already ? 'opacity:0.55' : ''}"></div>`);
    card.style.borderLeft = '3px solid ' + UNIT_TYPES[unitType(u)].color;
    const top = el(`<div style="display:flex;align-items:center;gap:10px"></div>`);
    const label = el(`<div style="flex:1;min-width:0"><div class="su-unit" style="font-size:14px">Unit ${esc(u.unit)}</div>`
      + `<div class="su-guest">${esc(u.guest || UNIT_TYPES[unitType(u)].label)}</div></div>`);
    if (already) {
      top.appendChild(label);
      top.appendChild(el(`<div class="su-next">Already logged</div>`));
      card.appendChild(top);
      modal.appendChild(card);
      return;
    }
    const tick = el(`<button class="freqmini ${b.chosen[u.id] ? 'on' : ''}" style="flex:0 0 auto;width:38px;padding:9px 0;font-size:13px">${b.chosen[u.id] ? '✓' : '○'}</button>`);
    const setTicked = (on) => {
      b.chosen[u.id] = on;
      tick.classList.toggle('on', on);
      tick.textContent = on ? '✓' : '○';   // an empty box reads as a field to fill in, not a tick
      refreshCount();
    };
    tick.onclick = () => setTicked(!b.chosen[u.id]);
    top.appendChild(tick);
    top.appendChild(label);
    card.appendChild(top);

    const cands = backdateCandidates(u);
    const cur = backdatePick(u);
    const who = el(`<select class="area-select" style="width:100%;margin-top:8px"></select>`);
    who.appendChild(el(`<option value="">${cands.length ? '— who cleaned it? —' : '— nobody badged in —'}</option>`));
    cands.forEach(p => {
      const o = el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`);
      if (cur === p.id) o.setAttribute('selected', '');
      who.appendChild(o);
    });
    const off = el(`<option value="office">Office (nobody badged in for it)</option>`);
    if (cur === 'office') off.setAttribute('selected', '');
    who.appendChild(off);
    // Naming who did a room says it was done — tick it rather than making the
    // office tap twice for the same fact.
    who.onchange = (e) => { b.picks[u.id] = e.target.value; if (e.target.value && !b.chosen[u.id]) setTicked(true); };
    card.appendChild(who);
    modal.appendChild(card);
  });

  if (b.warn) modal.appendChild(el(`<div style="font-size:12px;color:#b45309;font-weight:600;margin-top:12px;line-height:1.5">${esc(b.warn)}</div>`));

  // Sticky: with 60 rooms on the list, a footer at the end of the scroll is a
  // long way from the room you just ticked.
  const btnRow = el(`<div class="modal-btns" style="position:sticky;bottom:0;background:#101c30;padding:10px 0 2px"></div>`);
  const cancel = el(`<button class="modal-skip">Cancel</button>`);
  cancel.onclick = () => { if (!b.saving) closeBackdate(); };
  saveBtn.onclick = () => saveBackdate();
  if (b.saving) saveBtn.disabled = true;
  btnRow.appendChild(cancel); btnRow.appendChild(saveBtn);
  modal.appendChild(btnRow);
  refreshCount();

  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay && !b.saving) closeBackdate(); };
  return overlay;
}

// ============================================================
// TV BOARD
// ============================================================
// The office TV. Nobody taps it, so it is a statement rather than a screen:
// who is in, what each of them has, what is done. It redraws itself on a timer
// and pulls from Supabase on its own, because there is no one to press refresh.
const TV_MODE = /[?&]tv\b/.test(location.search) || /^#tv\b/.test(location.hash);
// Five is as thin as a column can get before a name stops reading from the far side
// of the office. That is a limit on how WIDE a column may be, though, and it had been
// doing duty as a limit on how many people fit on the screen — so a crew of nine got
// split across two pages that swapped every fifteen seconds, and nobody could answer
// "who has 604?" without standing there waiting for the board to come back round.
// The columns are two-thirds air (nobody holds more than about five jobs), so it
// stacks into a second and third row instead, and only pages when even that is full.
const TV_MAX_ACROSS = 5;
const TV_MAX_ROWS = 3;
const TV_COLS_PER_PAGE = TV_MAX_ACROSS * TV_MAX_ROWS;

// Shorter columns need smaller type, or the job chips spill out of them. Indexed by
// row count so the single-row board is left at exactly the size it always was.
// Tuned against the real television rather than guessed: at 0.72 a two-row board
// with both an OFFICES and a COMMUNAL group ran off the bottom of the screen, and
// content falling off a wall display is worse than content being small on one.
const TV_ROW_SCALE = { 1: 1, 2: 0.62, 3: 0.46 };

// Squarest arrangement that holds n columns: 9 people is 5 across and 2 deep, not
// 5 and then a row of 4 hanging off the end at a different width.
function tvGrid(n) {
  const rows = Math.min(TV_MAX_ROWS, Math.max(1, Math.ceil(n / TV_MAX_ACROSS)));
  return { rows: rows, across: Math.max(1, Math.ceil(n / rows)), scale: TV_ROW_SCALE[rows] || 0.55 };
}
const TV_PAGE_MS = 15000;        // long enough to read a column before it moves
// PAGES DO NOT DESERVE EQUAL TIME. The board is what the office stands in front of;
// the separate job is a glance to confirm nothing has been forgotten. Equal airtime
// gave a twelve-room checklist the same standing as the whole morning round, and the
// page people actually needed was off screen half the time.
// Kept for the record rather than used: the board no longer rotates at all. These
// were the dwell times back when it did, and they are here so that anyone thinking of
// bringing rotation back knows what was tried and that it was turned off on purpose.
const TV_AIR_PAGE_MS = 6000;
const TV_HOLD_MS = 45000;
const TV_TICK_MS = 20000;        // redraw: clock, and anything realtime already dropped into state
// Belt and braces behind the socket. Fifteen seconds rather than sixty: this is the
// worst case the wall can be behind by, and a minute is long enough for the crew to
// tick a room, look up, and see it still sitting there unticked. The board only reads,
// so four times the reads costs nothing anybody can feel.
const TV_PULL_MS = 15000;
let tvPage = 0;
let tvLastData = 0;              // when the board last saw fresh numbers

// FULL NAMES. An earlier board cut every name to its first word to buy column
// width, which made two cleaners called Mahad into two identical headings. The
// office asked for the whole name and the team beside it: the board is the thing
// people point at when they are working out who is where, and half a name is the
// half of that question it cannot answer. Names wrap to a second line rather than
// being clipped — a truncated name is the same problem in a different disguise.
const tvName = (p) => String((p && p.name) || '').trim() || '—';
// TEAM AND FLOOR, IN ONE LINE. The team letter says who somebody works with; the
// floor says where they are, which is the thing an office actually shouts across a
// room ("who's got six?"). The board had the first and not the second, so the floor
// allocation existed in Settings and nowhere anybody looked. Contiguous floors are
// written as a range - "Floors 8-9", not "Floors 8, 9" - because that is how a
// building is spoken about.
const tvFloorLabel = (p) => {
  const f = (p && Array.isArray(p.floors) ? p.floors : []).slice().sort((a, b) => a - b);
  if (!f.length) return '';
  const runs = [];
  f.forEach((n) => {
    const last = runs[runs.length - 1];
    if (last && n === last[1] + 1) last[1] = n; else runs.push([n, n]);
  });
  const txt = runs.map(([a, b]) => (a === b ? a : a + '-' + b)).join(', ');
  return (f.length > 1 ? 'Floors ' : 'Floor ') + txt;
};
const tvTeam = (p) => {
  const crew = String((p && p.crew) || '').trim();
  const fl = tvFloorLabel(p);
  return fl ? (crew ? crew + ' \u00b7 ' + fl : fl) : crew;
};

// Every job on today's board, grouped by who is holding it. Rooms and communal
// areas together: from across the room a walk is another thing somebody has to
// get through, and splitting them into two lists hides half the load.
function tvJobsByPerson() {
  const buckets = {}, order = [];
  const bucket = (id) => {
    const k = id || '__none__';
    if (!buckets[k]) { buckets[k] = []; order.push(k); }
    return buckets[k];
  };
  // A NAME HOLDS ONLY WHILE THE ROTA HAS THEM IN. A room or a communal walk left on
  // somebody who is at home is not handed out, it is lost: it reads as theirs, it buys
  // them a column on a board they are not on, and nobody comes for it. The plan already
  // takes this view of a name put on by hand — "yours until the rota says you are not
  // in, then back in the box" — and the live board has to take it too, or the two
  // disagree about the same morning. So it falls back into NOBODY YET, where it can be
  // seen and given to somebody who is actually in.
  const staffById = {}; (state.staff || []).forEach((p) => { staffById[p.id] = p; });
  const heldBy = (id) => (id && onDutyToday(staffById[id])) ? id : null;
  todaysRoomList().forEach((u) => {
    // THE FLATS NOBODY HOLDS GO IN ONE BOX — and the ones somebody holds go to them.
    // Forcing every flat into NOBODY YET whatever its name said made the box a wall of
    // eleven chips that never emptied, and worse: drag one onto a cleaner and it stayed
    // put, because the display was pinning it there. The work moved and the board denied
    // it. Unhanded flats still sit together, which is what that box is for.
    const air = unitType(u) === 'airbnb';
    const holder = heldBy(u.assignedTo);
    const who = staffById[holder];
    bucket(holder).push({
      id: u.id,
      air,                               // its own colour, wherever it is handed
      late: timeSlot(u) === 'late',      // ...and after the morning round in the column
      kind: unitType(u),                 // ...and its own button, for looking at one job at a time
      label: u.unit + (air && who ? ' · ' + who.name.split(' ')[0] : ''),
      done: cleanedToday(u),
      early: timeSlot(u) === 'early',
      area: false,
    });
  });
  // THE GUEST FLATS GO ON THE BOARD WITH EVERYTHING ELSE. They are off the morning roll
