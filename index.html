          + `${readOnly ? ' style="visibility:hidden;pointer-events:none"' : ''}>⠿</button>`);
        let from = null, moved = false;

        grip.addEventListener('pointerdown', (e) => {
          if (readOnly) return;
          from = { x: e.clientX, y: e.clientY, mouse: e.pointerType === 'mouse' };
          moved = false;
          if (grip.setPointerCapture) grip.setPointerCapture(e.pointerId);
        });
        grip.addEventListener('pointermove', (e) => {
          if (!from) return;
          if (!moved && Math.abs(e.clientX - from.x) + Math.abs(e.clientY - from.y) < 8) return;
          moved = true;
          dragGhost(String(j.label));
          moveGhost(e.clientX, e.clientY);
          lightDrop(dropUnder(e.clientX, e.clientY));
          e.preventDefault();
        });
        grip.addEventListener('pointerup', (e) => {
          clearGhost();
          if (moved) {
            const t = document.elementFromPoint(e.clientX, e.clientY);
            const drop = t && t.closest && t.closest('[data-drop]');
            if (drop) assignPicked(kind, j.id, drop.getAttribute('data-drop'));
          } else {
            // A tap on the grip: pick it up, or put down the one already in hand.
            e.stopPropagation();   // a tap on a chip is about that chip, never a drop
            _picked = (_picked && _picked.id === j.id) ? null : { kind, id: j.id, label: j.label };
            render();
          }
          from = null; moved = false;
        });
        grip.addEventListener('pointercancel', () => { clearGhost(); from = null; moved = false; });
        chip.appendChild(grip);

        // THE WHOLE CHIP IS THE GRIP, FOR A MOUSE.
        // Aiming a mouse at a 14px ⠿ to move a room is a fiddle, and the room you were
        // trying to move looked like it refused to move at all: press anywhere else on
        // the chip and nothing happens, press the label and it ticks itself off. With a
        // pointer you can see, the whole chip is the handle. A FINGER dragging a chip is
        // the board being scrolled — which is the entire reason the grip exists — so
        // touch is left exactly as it was.
        let cFrom = null, cMoved = false;
        chip.addEventListener('pointerdown', (e) => {
          if (readOnly) return;
          if (e.pointerType !== 'mouse') return;
          if (e.target.closest && e.target.closest('.bd-grip')) return;   // the grip has its own
          cFrom = { x: e.clientX, y: e.clientY }; cMoved = false;
          // NOT captured yet. Capturing on pointerdown makes the chip the target of the
          // click that follows, so the click never reaches the label inside it and a tap
          // stops ticking the room off — the one thing on this board done twenty times a
          // day. Capture only once the pointer has actually travelled, by which point it
          // is a drag and there is no tap left to break.
        });
        chip.addEventListener('pointermove', (e) => {
          if (!cFrom) return;
          if (!cMoved && Math.abs(e.clientX - cFrom.x) + Math.abs(e.clientY - cFrom.y) < 8) return;
          if (!cMoved && chip.setPointerCapture) { try { chip.setPointerCapture(e.pointerId); } catch (err) {} }
          cMoved = true;
          dragGhost(String(j.label));
          moveGhost(e.clientX, e.clientY);
          lightDrop(dropUnder(e.clientX, e.clientY));
          e.preventDefault();
        });
        chip.addEventListener('pointerup', (e) => {
          if (!cFrom) return;
          clearGhost();
          if (cMoved) {
            swallowClick = true;
            const t = document.elementFromPoint(e.clientX, e.clientY);
            const drop = t && t.closest && t.closest('[data-drop]');
            if (drop) assignPicked(kind, j.id, drop.getAttribute('data-drop'));
          }
          cFrom = null; cMoved = false;
        });
        chip.addEventListener('pointercancel', () => { clearGhost(); cFrom = null; cMoved = false; });

        row.appendChild(chip);
      });
      col.appendChild(row);
    };
    put(rooms, 'ROOMS');
    put(areas, 'COMMUNAL');

    if (!c.none && !readOnly) {
      const more = el(`<button class="bd-more">`
        + (giving ? '✕ Done adding' : '＋ Give ' + esc(String(c.name).split(' ')[0]) + ' more work') + `</button>`);
      more.onclick = (e) => { e.stopPropagation(); _giveTo = giving ? null : c.key; render(); };
      col.appendChild(more);
      if (giving) {
        // WHAT THE BOARD SHOWS, THE BOARD HAS TO BE ABLE TO HAND OUT. This asked
        // onRollCall, which answers "is this part of the morning round" — and the guest
        // flats deliberately are not. But they ARE on the board, sitting in NOBODY YET by
        // design, so the office looked at eleven flats waiting for somebody and had no
        // way to give a single one of them to anybody: the one column that exists to be
        // handed out was the one column this list refused to offer.
        //
        // Being dealt AUTOMATICALLY is what Airbnb is kept out of, and neverAutoDealt is
        // what says so. By hand, off the board, is exactly how the office says it wants
        // the flats done — two people, after the offices, whichever ones checked out.
        const spareRooms = (state.servicedUnits || []).filter((u) =>
          !u.paused && !u.assignedTo && !cleanedToday(u) && keep({ area: false, kind: unitType(u) }));
        const spareAreas = areasInterior().filter((a) => !a.assignedTo && !areaDone(a) && keep({ area: true, kind: 'area' }));
        const pick = el('<div class="givelist bd-jobs" style="margin-top:8px"></div>');
        if (!spareRooms.length && !spareAreas.length) {
          pick.appendChild(el(`<div style="font-size:12px;color:#6f8ab0">Everything here is handed out.</div>`));
        }
        const add = (label, id, kind) => {
          const b = el(`<button class="bd-job" style="border-left-color:#38bdf8;background:#14243d">`
            + `＋ ${esc(label)}</button>`);
          b.onclick = (e) => { e.stopPropagation(); assignPicked(kind, id, c.key); };
          pick.appendChild(b);
        };
        spareRooms
          .sort((x, y) => (slotRank(x) - slotRank(y)) || String(x.unit).localeCompare(String(y.unit), undefined, { numeric: true }))
          .forEach((u) => add(u.unit, u.id, 'unit'));
        spareAreas.forEach((a) => add(a.label, a.id, 'area'));
        col.appendChild(pick);
      }
    }
    cols_.appendChild(col);
  });
  // A DAY WITH NOTHING ON IT SAYS SO. Today's board is never empty in practice, but
  // tomorrow's can be — the week is seeded ahead, and a day that has not been reached
  // yet would otherwise render as a blank screen that reads like a bug.
  if (!cols_.children.length && readOnly) {
    cols_.appendChild(el(`<div class="bd-col none"><div class="bd-who">NOTHING PLANNED YET</div>`
      + `<div class="bd-sub">Tomorrow has not been laid out. Open Plan a Day to build it.</div></div>`));
  }
  wrap.appendChild(grid);
  // THE INSTRUCTIONS HAVE TO BE TRUE OF THE SCREEN THEY ARE ON. This told you to tap a
  // chip to mark it clean and drag it by the grip — on TOMORROW, where every one of
  // those is deliberately inert, and directly contradicting the line at the top of the
  // same screen saying nothing here can be ticked or moved. Somebody would tap, get
  // nothing, and reasonably conclude the board was broken.
  wrap.appendChild(el(`<div class="note" style="font-size:11px;color:#6f8ab0;margin-top:12px">`
    + (readOnly
      ? `Tomorrow's round, as it has been laid out. Nothing here is ticked because nobody `
        + `has worked it yet — open Plan a Day to change who has what, or ‹ Today to get back `
        + `to the round in front of you.`
      : `Tap a chip to mark it clean. Drag it by the ⠿ grip — or tap the grip, then tap a `
        + `person — to move it. Tap a name to give them more. The TV follows within a minute.`)
    + `</div>`));
  return wrap;
}

// What still has to be cleaned on tonight's round. The roll call is a morning
// tool; the crew works into the night, so "what's left" needs its own screen that
// uses the work day (rolling over at 3am) rather than the calendar day.
function viewTonight() {
  const wrap = el('<div class="body"></div>');
  const unitById = {};
  (state.servicedUnits || []).forEach(u => { unitById[u.id] = u; });
  const areaById = {};
  (state.areas || []).forEach(a => { areaById[a.id] = a; });

  // The list and the button that clears it read from one place, so the count on
  // the button can never disagree with the number of cards under it.
  const outstanding = tonightOutstanding();
  const day = outstanding.day;
  const jobs = outstanding.jobs;

  const dayLabel = new Date(day + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  wrap.appendChild(el(`<div class="note">Still outstanding for <b>${esc(dayLabel)}</b>. Tick them off as the round goes.</div>`));

  if (!jobs.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:28px 0;color:#15803d;font-weight:700">✓ Nothing outstanding — the round is done.</div>`));
    return wrap;
  }

  // CLOSE OUT THE ROUND — the whole night in one tap, at the top where it can't be
  // missed. Unlike the roll call button this does cover Airbnb: it is off the
  // morning roll call, but it is still part of tonight's work and shows in this list.
  {
    const nRooms = outstanding.rooms.length, nAreas = outstanding.areas.length;
    const allBox = el('<div style="margin-bottom:16px"></div>');
    const allBtn = el(`<button class="add-btn" style="background:#15803d;color:#ffffff">✓ Mark all ${jobs.length} as cleaned</button>`);
    allBtn.onclick = () => markTonightAllDone();
    allBox.appendChild(allBtn);
    allBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
      + `${nRooms} room${nRooms === 1 ? '' : 's'}`
      + (nAreas ? ` · ${nAreas} communal area${nAreas === 1 ? '' : 's'}` : '')
      + ` — goes straight to History, and you can un-tick any of them one by one.</div>`));
    wrap.appendChild(allBox);
  }

  const late = jobs.filter(j => j.late).length;
  wrap.appendChild(el(`<div class="section-label">${jobs.length} to clean tonight${late ? ` · <span style="color:#b45309">${late} overdue</span>` : ''}</div>`));

  const groups = {};
  jobs.forEach(j => { (groups[j.group] = groups[j.group] || []).push(j); });
  Object.keys(groups).forEach(g => {
    wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#5f7189">${esc(g)} (${groups[g].length})</div>`));
    const list = el(`<div class="area-list"></div>`);
    groups[g].forEach(j => {
      const item = el(`<div class="area-item"></div>`);
      const row = el(`<div class="area-row"></div>`);
      const tick = el(`<button class="area-tick" title="Mark clean">✓</button>`);
      tick.onclick = () => { if (j.kind === 'unit') toggleServicedDone(j.id); else toggleAreaDone(j.id); };
      row.appendChild(tick);
      const who = j.kind === 'unit' ? cleanerForUnit(unitById[j.id]) : null;
      const whoName = who ? who.person.name.split(' ')[0] : (areaById[j.id] && areaById[j.id].assignedTo
        ? ((state.staff || []).find(p => p.id === areaById[j.id].assignedTo) || {}).name : null);
      row.appendChild(el(`<div class="area-name su-unit">${esc(j.label)}`
        + `<span class="area-freq" style="${j.late ? 'color:#b45309' : ''}"> · ${esc(j.why)}</span>`
        + (whoName ? `<span class="area-freq"> · ${esc(String(whoName).split(' ')[0])}</span>` : '')
        + `</div>`));
      item.appendChild(row);
      list.appendChild(item);
    });
    wrap.appendChild(list);
  });
  return wrap;
}

// A kind of room kept off the morning roll call is a separate job, done by its own
// people after the main round. Say so on its own tab — otherwise "it never appears
// in Roll Call" reads as a fault, and nobody records the work.
function offRollCallNote(typeKey) {
  if (!Array.isArray(state.rollCallTypes) || state.rollCallTypes.includes(typeKey)) return el('<div></div>');
  const cleared = (state.staff || []).filter((p) => p.isCleaner && canCleanType(p, typeKey)
    && Array.isArray(p.canClean) && p.canClean.includes(typeKey));
  const box = el('<div class="alert" style="background:#eef6fd;border-color:#cfe8fb"></div>');
  box.appendChild(el(`<div class="alert-title" style="color:#0369a1">Not on the morning roll call</div>`));
  box.appendChild(el(`<div class="alert-body">A separate job, after the main round. `
    + (cleared.length ? `<b>${esc(cleared.map((p) => p.name.split(' ')[0]).join(' and '))}</b>. ` : '')
    + `Tick them off here.</div>`));
  return box;
}

function servicedCard(u, isDue) {
  const done = servicedDone(u.id);
  const doneToday = cleanedToday(u);        // includes cleans logged from another phone
  const c = cleanerForUnit(u);
  const pendingAbsent = c && c.reason === 'owner-absent';
  const editing = state.editingUnit === u.id;
  const card = el(`<div class="su-card ${doneToday?'done':''} ${pendingAbsent?'needs-cover':''}"></div>`);
  card.style.borderLeft = '3px solid ' + UNIT_TYPES[unitType(u)].color;   // colour-code by type

  // --- EDIT MODE ---
  if (editing) {
    card.appendChild(el(`<div class="section-label" style="margin:0 0 8px">Edit unit</div>`));
    const eU = el(`<input id="edUnit_${u.id}" value="${esc(u.unit)}" placeholder="Unit number" style="margin-bottom:8px">`);
    const eG = el(`<input id="edGuest_${u.id}" value="${esc(u.guest||'')}" placeholder="Guest / customer name" style="margin-bottom:10px">`);
    card.appendChild(eU); card.appendChild(eG);
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:4px">Last cleaned on (optional — sets the schedule)</div>`));
    const eL = el(`<input id="edLast_${u.id}" type="date" value="${esc(u.lastCleaned||'')}" max="${esc(todayKey())}" style="margin-bottom:10px;width:100%">`);
    card.appendChild(eL);
    // WHICH TAB THIS ROOM LIVES ON. A room's kind was fixed at the moment it was
    // added and could never be changed, so one filed wrong — or filed nowhere, which
    // silently means "building" — could only be corrected by deleting it and adding
    // it again, losing its history with it.
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:4px">Kind of room (which tab it appears on)</div>`));
    let chosenType = unitType(u);
    const typeRow = el(`<div style="display:flex;gap:6px;margin-bottom:10px"></div>`);
    const typeBtns = {};
    UNIT_TYPE_ORDER.forEach((tk) => {
      const b = el(`<button class="freqmini ${chosenType === tk ? 'on' : ''}" style="flex:1 1 0;padding:8px 6px">${esc(UNIT_TYPES[tk].label)}</button>`);
      b.onclick = () => {
        chosenType = tk;
        Object.values(typeBtns).forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
      };
      typeBtns[tk] = b;
      typeRow.appendChild(b);
    });
    card.appendChild(typeRow);
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:4px">Note (e.g. guest preference)</div>`));
    const eN = el(`<input id="edNote_${u.id}" value="${esc(u.note||'')}" placeholder="e.g. Guest leaves by 9am — clean first" style="margin-bottom:10px;width:100%">`);
    card.appendChild(eN);
    const row = el(`<div style="display:flex;gap:8px"></div>`);
    const saveB = el(`<button class="add-btn" style="flex:1">Save</button>`);
    saveB.onclick = () => editServicedUnit(u.id, document.getElementById('edUnit_'+u.id).value, document.getElementById('edGuest_'+u.id).value, document.getElementById('edLast_'+u.id).value, document.getElementById('edNote_'+u.id).value, chosenType);
    const cancelB = el(`<button class="modal-skip">Cancel</button>`);
    cancelB.onclick = () => cancelEditUnit();
    row.appendChild(saveB); row.appendChild(cancelB);
    card.appendChild(row);
    return card;
  }

  const top = el(`<div class="su-top"></div>`);
  const info = el(`<div style="flex:1;min-width:0"></div>`);
  info.appendChild(el(`<div class="su-unit">${u.priority?'⭐ ':''}${u.preferEarly?'🌅 ':u.preferLate?'🌇 ':''}Unit ${esc(u.unit)}`
    + `${u.preferEarly?' <span style="font-size:11px;color:#b45309;font-weight:700">Morning</span>':''}`
    + `${u.preferLate?' <span style="font-size:11px;color:#7c3aed;font-weight:700">Afternoon</span>':''}</div>`));
  if (u.guest) info.appendChild(el(`<div class="su-guest">${esc(u.guest)}</div>`));
  if (u.time) info.appendChild(el(`<div class="su-guest" style="color:#dc2626">🕐 Checkout ${esc(u.time)}</div>`));
  if (u.note) info.appendChild(el(`<div class="su-guest" style="color:#7c3aed">📝 ${esc(u.note)}</div>`));
  if (u.usualTo) { const usual = (state.staff||[]).find(x=>x.id===u.usualTo); if (usual) info.appendChild(el(`<div class="su-assign" style="color:#7c3aed">★ Usual: ${esc(usual.name.split(' ')[0])}</div>`)); }

  // Last cleaned — always shown. It used to render only when the room happened to
  // still be inside the newest-1000 history rows, so the line appeared and vanished
  // for no reason the office could see. "No record yet" is information too.
  const last = lastCleanInfo(u);
  info.appendChild(last
    ? el(`<div class="su-assign" style="color:#5f7189">🧹 Last: ${esc(last.when)}${last.who ? ' · ' + esc(last.who) : ''}</div>`)
    : el(`<div class="su-assign" style="color:#b45309">🧹 Last: no record yet</div>`));

  // Assigned cleaner line
  if (c) {
    const fname = c.person.name.split(' ')[0];
    if (pendingAbsent) {
      info.appendChild(el(`<div class="su-assign" style="color:#dc2626">⚠ ${esc(fname)} absent — needs cover</div>`));
    } else if (c.reason === 'cover') {
      info.appendChild(el(`<div class="su-assign" style="color:#15803d">↪ Covered by ${esc(fname)}</div>`));
    } else if (c.reason === 'override') {
      info.appendChild(el(`<div class="su-assign" style="color:#5f7189">Assigned: ${esc(fname)}</div>`));
    } else {
      info.appendChild(el(`<div class="su-assign" style="color:#5f7189">${esc(fname)} (Floor ${floorOfUnit(u.unit)})</div>`));
    }
  } else {
    info.appendChild(el(`<div class="su-assign" style="color:#5b6a7f">No cleaner assigned to Floor ${floorOfUnit(u.unit)||'?'}</div>`));
  }
  top.appendChild(info);

  if (done) {
    // We ticked it off here, so it can be un-ticked here.
    const mark = el(`<button class="su-mark">✓ Cleaned</button>`);
    mark.onclick = () => toggleServicedDone(u.id);
    top.appendChild(mark);
  } else if (doneToday) {
    // Cleaned today according to the shared log (another phone) — show it, don't offer an undo we can't honour.
    top.appendChild(el(`<div class="su-next" style="color:#15803d;background:#e7f6ec;border-color:#bfe6cd">✓ Done today</div>`));
  } else if (isDue) {
    const mark = el(`<button class="su-mark">Mark clean</button>`);
    mark.onclick = () => toggleServicedDone(u.id);
    top.appendChild(mark);
  } else {
    const nd = nextDueDate(u);
    const label = nd === tomorrowKey() ? 'Next: tomorrow'
      : nd ? 'Next: ' + new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      : schedLabel(u);
    top.appendChild(el(`<div class="su-next" title="${esc(schedLabel(u))}">${esc(label)}</div>`));
  }
  card.appendChild(top);

  // Who cleans this room (recorded in history when marked clean)
  const assignRow = el(`<div style="display:flex;align-items:center;gap:8px;margin-top:10px"></div>`);
  assignRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;white-space:nowrap">Cleaned by</div>`));
  const asel = el(`<select class="area-select" style="flex:1"></select>`);
  asel.appendChild(el(`<option value="">Auto (by floor)</option>`));
  // Only people cleared for this kind of room, and only leaders. Where a pair swaps
  // rooms day to day this turns "who cleaned it" into a two-name choice rather than a
  // list of twenty — and an assistant should never be the answer, because the room is
  // the leader's and the assistant is there to work it with them. Naming the assistant
  // here would quietly move the room off the leader it belongs to.
  // And only the ones the rota has in today — naming somebody who is at home is the
  // same mistake as naming an assistant, made one step earlier.
  const rmPick = cleaningStaff().filter(p => canCleanUnit(p, u) && p.isLeader && onDutyToday(p));
  rmPick.forEach(p => {
    const o = el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`);
    if (u.assignedTo === p.id) o.setAttribute('selected', '');
    asel.appendChild(o);
  });
  // Whoever is holding it stays on the list, said out loud. Dropping them would show
  // "Auto (by floor)" against a room that is on somebody's name.
  if (u.assignedTo && !rmPick.some(p => p.id === u.assignedTo)) {
    const p = (state.staff || []).find(x => x.id === u.assignedTo);
    if (p) {
      const o = el(`<option value="${esc(p.id)}">${esc(p.name)} (${esc(offDutyWhy(p))})</option>`);
      o.setAttribute('selected', '');
      asel.appendChild(o);
    }
  }
  asel.onchange = (e) => setUnitAssignee(u.id, e.target.value);
  assignRow.appendChild(asel);
  card.appendChild(assignRow);

  // WHICH DAYS. Pinning a room to weekdays stops its schedule drifting every time a
  // clean lands late or early. While days are set the frequency is not what decides
  // when the room comes round, so it is shown greyed rather than removed — clearing
  // the days hands the room straight back to it.
  const pinned = fixedDays(u);
  const dayRow = el(`<div class="su-ctl" style="margin-top:8px;align-items:center"></div>`);
  dayRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:700;white-space:nowrap">On</div>`));
  DOW_PICK_ORDER.forEach((d) => {
    const on = !!pinned && pinned.indexOf(d) >= 0;
    const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="padding:6px 9px" title="${esc(DOW_LABEL[d])}">${esc(DOW_SHORT[d])}</button>`);
    b.onclick = () => toggleUnitDay(u.id, d);
    dayRow.appendChild(b);
  });
  if (pinned) {
    const clr = el(`<button class="freqmini" style="padding:6px 9px" title="Back to a rolling cycle">✕ Days</button>`);
    clr.onclick = () => clearUnitDays(u.id);
    dayRow.appendChild(clr);
  }
  card.appendChild(dayRow);

  // frequency selector + edit + remove
  const ctl = el(`<div class="su-ctl"></div>`);
  ['nightly','daily','eod','weekly'].forEach(fk => {
    const b = el(`<button class="freqmini ${!pinned && u.freq===fk?'on':''}" style="${pinned?'opacity:0.45':''}" title="${pinned?'Set by days above':''}">${FREQ_LABEL[fk]}</button>`);
    b.onclick = () => setUnitFreq(u.id, fk);
    ctl.appendChild(b);
  });
  const pri = el(`<button class="freqmini ${u.priority?'on':''}" title="Priority">${u.priority?'⭐ Priority':'☆ Priority'}</button>`);
  pri.onclick = () => setUnitPriority(u.id, !u.priority);
  ctl.appendChild(pri);
  const early = el(`<button class="freqmini ${u.preferEarly?'on':''}" title="Customer wants this done in the morning">${u.preferEarly?'🌅 Morning':'🌅 Prefers morning'}</button>`);
  early.onclick = () => setUnitPreferEarly(u.id, !u.preferEarly);
  ctl.appendChild(early);
  const late = el(`<button class="freqmini ${u.preferLate?'on':''}" title="Customer would rather this was left until the afternoon">${u.preferLate?'🌇 Afternoon':'🌇 Prefers afternoon'}</button>`);
  late.onclick = () => setUnitPreferLate(u.id, !u.preferLate);
  ctl.appendChild(late);
  const edit = el(`<button class="su-edit">Edit</button>`);
  edit.onclick = () => startEditUnit(u.id);
  ctl.appendChild(edit);
  const rm = el(`<button class="su-rm">Remove</button>`);
  rm.onclick = () => removeServicedUnit(u.id);
  ctl.appendChild(rm);
  card.appendChild(ctl);

  return card;
}

function viewRollCall(opts) {
  const embedded = !!(opts && opts.embedded);
  const s = statsBar();
  const wrap = el('<div></div>');
  const body = el('<div class="body"></div>');
  // SET-UP LIVES AT THE BOTTOM, SHUT. This screen is opened every morning by whoever
  // is on, and it had twenty-six buttons on it — most of them one-off jobs that will
  // never be pressed twice: sync the roster, import a file, work out the days, free
  // up the pinned rooms, empty the board. They pushed the actual morning — the rooms,
  // the hand-out, the close-out — down the page and made the screen unreadable to
  // anyone who had not been shown it. Anything that is not part of today goes in
  // here, collapsed, and the morning is what is left.
  const setupBox = el('<div style="display:flex;flex-direction:column;gap:8px"></div>');

  // CLOSE OUT THE MORNING — first thing on the page, because at hand-over the
  // answer is nearly always "all of it" and it should not need scrolling for.
  // Today only: on a past day the rooms have long since been ticked or missed, and
  // a bulk tick there would silently backdate a whole morning.
  if ((selectedDay || todayKey()) === todayKey()) {
    const all = rollCallOutstanding();
    // Only close out what somebody was actually holding. Sweeping in rooms nobody
    // was given records them as cleaned and credits them to "Office", which is how
    // a room nobody did ends up in History as done — and it is why the number on
    // the button never matched the number handed out.
    // Rooms only. A communal walk is routinely done without a name against it, so
    // excluding unnamed areas would quietly drop them from the close-out entirely.
  }

  // Sync staff roster · Import attendance file · pick the day
  const syncBox = el('<div style="margin-bottom:16px"></div>');
  const syncBtn = el('<button class="add-btn" style="background:#0284c7">⟳ Sync Staff (Hik-Connect)</button>');
  syncBtn.onclick = () => syncFromHik();
  syncBox.appendChild(syncBtn);
  const impBtn = el('<button class="add-btn" style="background:#101c30;color:#7ea6dc;border:1px solid #3d557f;margin-top:8px">↑ Import Attendance File</button>');
  const impInput = el('<input type="file" accept=".xlsx,.xls,.csv" style="display:none">');
  impInput.onchange = (e) => { if (e.target.files[0]) importAttendance(e.target.files[0]); e.target.value = ''; };
  impBtn.onclick = () => impInput.click();
  syncBox.appendChild(impBtn);
  syncBox.appendChild(impInput);
  const cur = selectedDay || todayKey();
  const pickDay = (d) => { selectedDay = d || todayKey(); loadHikArrivals().then(() => render()); };
  const dayRow = el('<div style="display:flex;align-items:center;gap:8px;margin-top:10px"></div>');
  // "Showing day" read as if it drove the whole screen, so picking a date and then
  // finding auto-assign still dealt today's rooms looked broken. It only ever chose
  // whose badge-ins to show, and it cannot go forward at all — nobody has clocked in
  // for a day that has not happened. Planning a day ahead is the Plan tab's job.
  dayRow.appendChild(el('<div style="font-size:12px;color:#5f7189;font-weight:600;white-space:nowrap">Attendance for</div>'));
  const dayIn = el(`<input type="date" value="${esc(cur)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#16233a;color:#eaf1fb;border:1px solid #3d557f;border-radius:8px;padding:8px 10px;font-size:14px">`);
  dayIn.onchange = (e) => pickDay(e.target.value);
  const calBtn = el('<button class="freqmini" title="Pick a date" style="flex:0 0 auto">📅</button>');
  calBtn.onclick = () => { try { dayIn.showPicker(); } catch (e) { dayIn.focus(); dayIn.click(); } };
  dayRow.appendChild(dayIn);
  dayRow.appendChild(calBtn);
  syncBox.appendChild(dayRow);
  // Quick jumps
  const quick = el('<div style="display:flex;gap:6px;margin-top:8px"></div>');
  const yday = shiftDay(todayKey(), -1);
  [['Today', todayKey()], ['Yesterday', yday]].forEach(([lbl, d]) => {
    const b = el(`<button class="freqmini ${cur === d ? 'on' : ''}">${lbl}</button>`);
    b.onclick = () => pickDay(d);
    quick.appendChild(b);
  });
  syncBox.appendChild(quick);
  // When was attendance last read? Without this, "nobody clocked in" and "we haven't
  // looked since you opened the page" are indistinguishable.
  const pullRow = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"></div>');
  pullRow.appendChild(el(`<div id="lastPull" style="flex:1;min-width:0;font-size:11px;color:#5b6a7f;font-weight:600">${esc(lastPullLabel())}</div>`));
  const refreshBtn = el('<button class="freqmini" style="flex:0 0 auto;padding:6px 12px">↻ Check now</button>');
  refreshBtn.onclick = async () => { refreshBtn.textContent = '…'; await loadHikArrivals(); render(); };
  pullRow.appendChild(refreshBtn);
  // STAYS ON THE MORNING SCREEN. "Nobody has clocked in" and "we have not looked
  // since you opened the page" are different problems with the same empty board, and
  // this line is the only thing that tells them apart — so it does not go in the
  // drawer with the roster sync and the file import, which are set-up jobs.
  body.appendChild(pullRow);
  setupBox.appendChild(syncBox);
  // What the last hand-out actually did stays on the morning screen, not in the
  // drawer with the thing that triggered it — it is the answer to "did that work?".
  if (hikSyncMsg) {
    body.appendChild(el(`<div style="font-size:13px;margin-bottom:14px;font-weight:700;color:${hikSyncMsg.err ? '#dc2626' : '#15803d'}">${esc(hikSyncMsg.text)}</div>`));
  }

  // Unknown-staff alert: badged in but not in the staff list
  if (hikUnknown.length) {
    const al = el(`<div class="alert"></div>`);
    al.appendChild(el(`<div class="alert-title">⚠ ${hikUnknown.length} badged in but not in your staff list</div>`));
    al.appendChild(el(`<div class="alert-body">${esc(hikUnknown.map((u) => u.name + (u.time ? ` (${u.time})` : '')).join(', '))}</div>`));
    body.appendChild(al);
  }

  // FIFTEEN SECTIONS DOWN ONE COLUMN IS NOT A SCREEN, IT IS AN ARCHIVE.
  // Everything on this page earns its place once a day — the hand-out, the communal
  // walks, who is in, what tomorrow looks like — and none of it earns being scrolled
  // past on the way to the one thing you opened the app for. Each is a heading you can
  // tap: shut, it is one line; open, it is exactly what it always was. What is open is
  // remembered, so the office arranges the screen once and it stays arranged.
  const fold = (key, title, meta, node, openByDefault) => {
    if (!state.rcFold) state.rcFold = {};
    const open = state.rcFold[key] === undefined ? !!openByDefault : !!state.rcFold[key];
    const box = el('<div style="margin-bottom:8px;border:1px solid #1e2f4d;border-radius:10px;overflow:hidden;background:#101c30"></div>');
    const hd = el(`<button style="display:flex;align-items:center;gap:8px;width:100%;padding:13px 12px;`
      + `border:0;background:${open ? '#16233a' : '#101c30'};text-align:left;cursor:pointer">`
      + `<span style="font-size:12px;color:#8a99ab;width:12px">${open ? '▾' : '▸'}</span>`
      + `<span style="flex:1;min-width:0;font-size:13px;font-weight:800;color:#eaf1fb">${esc(title)}</span>`
      + (meta ? `<span style="font-size:11px;font-weight:700;color:#5f7189">${esc(meta)}</span>` : '')
      + `</button>`);
    hd.onclick = () => { state.rcFold[key] = !open; save(); render(); };
    box.appendChild(hd);
    if (open) {
      const inner = el('<div style="padding:10px 12px 12px"></div>');
      inner.appendChild(node);
      box.appendChild(inner);
    }
    body.appendChild(box);
  };

  const arrIds = Object.keys(hikArrivals);
  const staffById = {};
  for (const s of (state.staff || [])) staffById[s.id] = s;

  // TODAY'S ROOMS — surfaced up front so the office sees the actual workload when roll
  // call opens, instead of only finding out after tapping auto-assign.
  // Same order auto-assign uses: 🌅 early first, then ⭐ priority, then room number —
  // so what you see at the top is what gets handed out first.
  const todaysRooms = todaysRoomList().slice()
    .sort((a, b) => (slotRank(a) - slotRank(b))
      || (b.priority ? 1 : 0) - (a.priority ? 1 : 0)
      || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const flags = (u) => (u.preferEarly ? '🌅 ' : u.preferLate ? '🌇 ' : '') + (u.priority ? '⭐ ' : '');
  if (todaysRooms.length) {
    const doneR = todaysRooms.filter(cleanedToday);
    const openR = todaysRooms.filter((u) => !cleanedToday(u));
    const unass = openR.filter((u) => !u.assignedTo);
    const toCheck = openR.filter((u) => u.assignedTo && !assignConfirmedToday(u));
    const okCount = openR.filter((u) => u.assignedTo && assignConfirmedToday(u)).length;
    const box = el('<div style="margin-bottom:18px"></div>');
    box.appendChild(el(`<div class="section-label">◷ Rooms to clean today (${todaysRooms.length})</div>`));
    // WHERE THIS LIST CAME FROM. A plan made the night before either drives the roll
    // call or it does not, and until now the screen looked identical either way — so
    // "I planned it and it isn't here" could not be told apart from "the plan is here
    // and it is what I planned". Say which, and if there is no plan for today, say
    // which days DO have one, because a plan filed against the wrong date is the
    // usual reason it went missing.
    {
      const planned = plannedRoomsToday();
      const days = Object.keys(state.plans || {}).filter((d) => Object.keys(state.plans[d] || {}).length).sort();
      const ahead = days.filter((d) => d > workToday());
      box.appendChild(planned
        ? el(`<div style="font-size:12px;color:#15803d;font-weight:700;margin:-6px 0 4px">`
            + `✓ From the plan you made for today (${esc(workToday())})</div>`)
        : el(`<div style="font-size:12px;color:#b45309;font-weight:700;margin:-6px 0 4px">`
            + `⚠ No plan for today (${esc(workToday())}) — showing everything the schedule says is due.`
            + (ahead.length ? ` You have a plan for ${esc(ahead.slice(0, 3).join(', '))}.` : '')
            + `</div>`));
    }
    // The early round gets its own number. It is the part of the morning with a
    // deadline on it, and a count is the only way to see it is not all on one person.
    const earlyOpen = openR.filter((u) => timeSlot(u) === 'early').length;
    box.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin:-6px 0 10px">`
      + (earlyOpen ? `<b style="color:#b91c1c">${earlyOpen} early</b> · ` : '')
      + `${openR.length - unass.length} handed out`
      + ` · <b style="color:${unass.length ? '#b45309' : '#15803d'}">${unass.length} still to hand out</b>`
      + (toCheck.length ? ` · <b style="color:#b45309">${toCheck.length} to check</b>` : '')
      + (doneR.length ? ` · <span style="color:#15803d">${doneR.length} done</span>` : '')
      + `</div>`));
    // ONE SCREEN, ONE JOB. This screen decides the morning — who is in, who gets what,
    // what the schedule is doing — and Tick off records the work. They used to be the
    // same page, so the office scrolled past eight blocks of ticking to reach the
    // hand-out, and past the hand-out to reach the ticking, twenty times a day.
    // What is left here is the sentence that matters at a glance, and the way through.
    {
      const cols = tvColumns();
      const counted = countJobs(cols);
      const all = counted.all, doneN = counted.done;
      const sum = el('<div style="display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:12px 14px;'
        + 'border-radius:10px;background:#101c30;border:1px solid #1e2f4d"></div>');
      sum.appendChild(el(`<div><div style="font-size:22px;font-weight:800;color:${all - doneN ? '#b45309' : '#15803d'}">`
        + `${all - doneN}</div><div style="font-size:11px;font-weight:700;color:#5f7189">LEFT TODAY</div></div>`));
      sum.appendChild(el(`<div><div style="font-size:22px;font-weight:800;color:#15803d">${doneN}</div>`
        + `<div style="font-size:11px;font-weight:700;color:#5f7189">DONE</div></div>`));
      if (state.lastEarlyEven && state.lastEarlyEven.day === workToday() && state.lastEarlyEven.moves.length) {
        const m = state.lastEarlyEven.moves;
        box.appendChild(el(`<div style="font-size:11px;color:#7ea6dc;font-weight:700;margin:-4px 0 8px">`
          + `🌅 Early round levelled: `
          + esc(m.map((x) => x.unit + ' → ' + String(x.to).split(' ')[0]).join(', '))
          + ` — nobody starts on more than ${earlyCap()}.</div>`));
      }
      const go = el(`<button class="freqmini" style="margin-left:auto;flex:0 0 auto;padding:10px 14px;`
        + `background:#15803d;border-color:#15803d;color:#ffffff;font-size:13px">✓ Tick off →</button>`);
      go.onclick = () => setTab('board');
      sum.appendChild(go);
      box.appendChild(sum);
    }
    // Sits under the chips so the counts above stay the first thing read.
    // WHY THE LIST IS THIS LONG, NAMED. "Why is 102 coming up?" was being asked room
    // by room, and the answer was only ever available by opening each one. Every room
    // here is on the list for one of three reasons, so the list says which — and names
    // the rooms in the one category that is actually a mistake.
    {
      const never = openR.filter((u) => !lastCleanDate(u));
      const pinned = openR.filter((u) => lastCleanDate(u) && fixedDays(u));
      const cycle = openR.filter((u) => lastCleanDate(u) && !fixedDays(u));
      const nums = (list) => list.slice(0, 14).map((u) => u.unit).join(', ')
        + (list.length > 14 ? ' +' + (list.length - 14) + ' more' : '');
      const line = (txt, colour) => el(`<div style="font-size:11px;color:${colour};font-weight:600;margin-top:6px">${txt}</div>`);
      if (pinned.length) box.appendChild(line(`${pinned.length} pinned to ${DOW_LABEL[dowOf(workToday())]}: ${esc(nums(pinned))}`, '#5f7189'));
      if (cycle.length) box.appendChild(line(`${cycle.length} due on their cycle: ${esc(nums(cycle))}`, '#5f7189'));
      if (never.length) {
        box.appendChild(line(`⚠ ${never.length} never recorded as cleaned, so ${never.length === 1 ? 'it shows' : 'they show'} `
          + `every day: <b>${esc(nums(never))}</b>`, '#b45309'));
        box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:2px">`
          + `Give ${never.length === 1 ? 'it a date and it drops' : 'them a date and they drop'} into the cycle.</div>`));
        const fix = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:6px;border-color:#b45309;color:#b45309">`
          + `Set the ${never.length} never-recorded room${never.length === 1 ? '' : 's'} as cleaned today</button>`);
        fix.onclick = () => setUnitsLastCleanedBulk(never.map((u) => u.id), workToday(), 'the rooms with no cleaning on record');
        box.appendChild(fix);
      }
      // Tapping any room still gives the full reason for that one room.
      box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
        + `Rooms are ticked off on the <b>Tick off</b> tab — this screen is for deciding `
        + `the morning.</div>`));
    }

    // The button that hands rooms out belongs above the list it produces.
    if (arrIds.length) {
      const autoBtn = el('<button class="add-btn" style="background:#15803d;color:#ffffff;margin:12px 0 4px">⚡ Auto-assign today\'s rooms evenly</button>');
      autoBtn.onclick = () => autoAssignRooms();
      box.appendChild(autoBtn);
    }
    // Tying rooms one at a time is why hardly any are tied. The log already knows who
    // has been doing what, so offer to read it — but only when it has something to say.
    // ONLY WHEN THE DRAWER IS OPEN. Both of these walk every room — one of them the
    // whole history log as well — and they existed to decide whether a button that is
    // now inside the drawer is worth showing. Run on every render they were most of
    // the cost of opening the morning screen, for an answer nobody was looking at.
    if (state.rcSetupOpen) {
      const lu = learnUsualPlan(LEARN_DAYS);
      if (lu.proposals.length) {
        const learnBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px;border-color:#7c3aed;color:#7c3aed">`
          + `★ Keep ${lu.proposals.length} room${lu.proposals.length === 1 ? '' : 's'} with whoever has been doing them</button>`);
        learnBtn.onclick = () => learnUsualCleaners();
        setupBox.appendChild(learnBtn);
        setupBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-2px 0 8px">`
          + `From the last ${LEARN_DAYS} days of the log.</div>`));
      }
    }
    // Turning frequencies into actual days is the one-off that stops the schedule
    // drifting. Only offered while there are rooms it would still change.
    if (state.rcSetupOpen) {
      const sd = suggestDaysFromFreq();
      if (sd.proposals.length) {
        const dBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px;border-color:#0284c7;color:#0284c7">`
          + `🗓 Work out the days for ${sd.proposals.length} room${sd.proposals.length === 1 ? '' : 's'}</button>`);
        dBtn.onclick = () => suggestDaysFromFreqConfirm();
        setupBox.appendChild(dBtn);
        setupBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-2px 0 8px">`
          + `Split so the week comes out even.</div>`));
      }
    }
    // The every-other-day rooms settle onto one of the two patterns and stay there,
    // which is what makes three mornings heavy and three light. Only offered while
    // there is a real difference to be had.
    if (state.rcSetupOpen) {
      const ep = levelEodPlan();
      const peakBefore = Math.max.apply(null, ep.before);
      const peakAfter = Math.max.apply(null, ep.load);
      if (ep.moves.length && ((peakBefore - peakAfter) >= 1 || ep.frees)) {
        const eBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px;border-color:#0284c7;color:#0284c7">`
          + `⚖ Spread ${ep.moves.length} every-other-day room${ep.moves.length === 1 ? '' : 's'} across the week</button>`);
        eBtn.onclick = () => levelEodDaysConfirm();
        setupBox.appendChild(eBtn);
        setupBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-2px 0 8px">`
          + (ep.frees ? `${ep.frees} of them come off ${MANUAL_DAYS.map((d) => DOW_LABEL[d]).join('/')}, which you pick yourself. ` : '')
          + `Worst morning goes from ${peakBefore} to ${peakAfter} of them.</div>`));
      }
    }
    // Pinned rooms go back to the same person every morning, so once there are a lot
    // of them the hand-out stops rotating. Only worth mentioning when it's a real share.
    const pinnedCount = (state.servicedUnits || []).filter((u) => onRollCall(u) && u.usualTo).length;
    const rollTotal = (state.servicedUnits || []).filter((u) => onRollCall(u)).length;
    if (pinnedCount && pinnedCount >= rollTotal / 3) {
      const pinBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px;border-color:#7c3aed;color:#7c3aed">⟲ Free up ${pinnedCount} room${pinnedCount === 1 ? '' : 's'} tied to one cleaner</button>`);
      pinBtn.onclick = () => clearAllUsualCleaners();
      setupBox.appendChild(pinBtn);
      setupBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-2px 0 8px">`
        + `${pinnedCount} of ${rollTotal} go to the same person every day. That is the point now — `
        + `this is only here to undo it.</div>`));
    }
    // Clearing the board only makes sense when something is actually on it.
    const heldNow = openR.filter((u) => u.assignedTo && !u.usualTo);
    if (heldNow.length) {
      const clearBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px;border-color:#b45309;color:#b45309">✕ Put all ${heldNow.length} room${heldNow.length === 1 ? '' : 's'} back in the pool</button>`);
      clearBtn.onclick = () => unassignAllRooms();
      setupBox.appendChild(clearBtn);
    }
    // Reversible while today's shuffle is still the last thing that happened.
    if (state.lastAutoAssign && String(state.lastAutoAssign.at).slice(0, 10) === todayKey()) {
      const undoBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px">${lastBoardChangeLabel()}</button>`);
      undoBtn.onclick = () => undoAutoAssign();
      box.appendChild(undoBtn);
    }

    // SIGN-OFF: auto-assign hands rooms out straight away, but every one it picked
    // still needs a yes/no. "No" opens the picker so the room goes somewhere else.
    if (toCheck.length) {
      // One line and two buttons by default. The full list is a page of cards, and
      // it was appearing every morning whether or not anything was actually wrong.
      const hdr = el('<div style="display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap"></div>');
      hdr.appendChild(el(`<div class="section-label" style="margin:0;flex:1;min-width:150px;color:#b45309">`
        + `⚠ ${toCheck.length} assignment${toCheck.length === 1 ? '' : 's'} to check</div>`));
      const yesAll = el('<button class="freqmini" style="flex:0 0 auto;padding:9px 14px;background:#15803d;border-color:#15803d;color:#ffffff">✓ Yes to all</button>');
      yesAll.onclick = () => confirmAllAssignments(toCheck.map((u) => u.id));
      hdr.appendChild(yesAll);
      const always = el('<button class="freqmini" style="flex:0 0 auto;padding:9px 12px;border-color:#0284c7;color:#0284c7">✓ Always — stop asking</button>');
      always.onclick = () => showConfirm(
        'Hand the rooms out without asking?',
        'No list to check each morning. You can still move any room, and switch this back off in Settings.',
        () => { state.autoConfirm = true; save(); render(); },
        'Yes, run it automatically', 'safe');
      hdr.appendChild(always);
      const toggle = el(`<button class="freqmini" style="flex:0 0 auto;padding:9px 12px">${state.checkExpanded ? 'Hide the list' : 'Go through them'}</button>`);
      toggle.onclick = () => { state.checkExpanded = !state.checkExpanded; save(); render(); };
      hdr.appendChild(toggle);
      box.appendChild(hdr);
      if (!state.checkExpanded) {
        box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:4px">`
          + `Dealt out automatically and even. Take the lot, or go through them to move any.</div>`));
      }
      const grid = el('<div class="rc-grid"></div>');
      if (state.checkExpanded) toCheck.forEach((u) => {
        const who = (state.staff || []).find((p) => p.id === u.assignedTo);
        const row = el('<div class="su-card" style="display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px"></div>');
        const info = el('<div style="flex:1;min-width:0"></div>');
        info.appendChild(el(`<div style="font-size:15px;font-weight:800;color:#0f1a27">${flags(u)}${esc(u.unit)}</div>`));
        info.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600">→ ${esc(who ? who.name : 'unknown')}</div>`));
        row.appendChild(info);
        const yes = el('<button class="freqmini" style="flex:0 0 auto;padding:9px 14px;background:#15803d;border-color:#15803d;color:#ffffff">✓ Yes</button>');
        yes.onclick = () => confirmAssignment(u.id);
        const no = el('<button class="freqmini" style="flex:0 0 auto;padding:9px 14px">✕ No</button>');
        no.onclick = () => openAssignPicker(u.id);
        row.appendChild(yes); row.appendChild(no);
        grid.appendChild(row);
      });
      if (state.checkExpanded) box.appendChild(grid);
    } else if (okCount) {
      box.appendChild(el(`<div style="font-size:12px;color:#15803d;font-weight:700;margin-top:12px">✓ All ${okCount} assignment${okCount === 1 ? '' : 's'} confirmed</div>`));
    }
    body.appendChild(box);
  }

  // THE SEPARATE JOB. Rooms planned for today that the roll call is not about —
  // Airbnb, cleaned after the offices by its own pair. Off the board, as it should
  // be, but SAID rather than silently dropped. It stays quiet while the morning's own
  // rooms are still open, then turns into the hand-out, so nobody has to remember to
  // go and deal it once the offices are finished.
  {
    const off = plannedOffRollCall();
    if (off.length) {
      const kinds = [...new Set(off.map((u) => UNIT_TYPES[unitType(u)].label))].join(' + ');
      const openNow = todaysRoomList().filter((u) => !cleanedToday(u)).length;
      const offOpen = off.filter((u) => !cleanedToday(u));
      const oBox = el('<div style="margin-bottom:18px"></div>');
      oBox.appendChild(el(`<div class="section-label">${esc(kinds)} — a separate job (${off.length})</div>`));
      oBox.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin:-6px 0 8px">`
        + `Planned for today and kept off the roll call on purpose. Cleaned after the offices, by its own crew.</div>`));
      const oChips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
      off.forEach((u) => {
        const done = cleanedToday(u);
        const who = (state.staff || []).find((p) => p.id === u.assignedTo);
        const tone = done ? 'background:#eaf7ee;border-color:#bfe3ca;color:#15803d'
          : who ? 'background:#eef6fd;border-color:#cfe8fb;color:#0369a1'
          : 'background:#fff7ed;border-color:#fcd9a8;color:#b45309';
        oChips.appendChild(el(`<div class="freqmini" style="flex:0 0 auto;padding:6px 10px;${tone}" `
          + `title="${esc(done ? 'Cleaned today' : who ? 'With ' + who.name : 'Not handed out yet')}">`
          + `${esc(u.unit)}${done ? ' ✓' : who ? ' · ' + esc(who.name.split(' ')[0]) : ''}</div>`));
      });
      oBox.appendChild(oChips);
      if (!offOpen.length) {
        oBox.appendChild(el(`<div style="font-size:12px;color:#15803d;font-weight:700;margin-top:8px">`
          + `✓ All ${off.length} done.</div>`));
      } else if (openNow === 0 && arrIds.length) {
        const hand = el(`<button class="add-btn" style="background:#15803d;color:#ffffff;margin-top:10px">`
          + `⚡ Hand out the ${offOpen.length} ${esc(kinds)} room${offOpen.length === 1 ? '' : 's'}</button>`);
        hand.onclick = () => autoAssignRooms(offOpen);
        oBox.appendChild(hand);
        oBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
          + `The morning's rooms are all done — this is the job that follows them. `
          + `Tick these off on the ${esc(kinds)} tab.</div>`));
      } else {
        oBox.appendChild(el(`<div style="font-size:12px;color:#b45309;font-weight:700;margin-top:8px">`
          + (openNow === 0 ? `Nobody is clocked in to hand these to yet.`
                           : `Handed out once the morning's rooms are done — ${openNow} still open.`)
          + `</div>`));
      }
      fold('offroll', 'Off the roll call', '', oBox, false);
    }
  }

  // NOT DUE TODAY — every-other-day and weekly rooms vanish from the roll call on
  // their off day, which reads as "a room has gone missing" rather than "it isn't
  // due yet". Listing them greyed out, with the day they come round, keeps the whole
  // estate accounted for. Outside the block above on purpose, twice over: they must
  // never join the count, the hand-out or the close-out, and a morning with nothing
  // due is exactly when "here is what is coming" is worth reading.
  {
    const notDue = (state.servicedUnits || []).filter((u) => onRollCall(u) && !onTodaysList(u) && !u.paused).slice()
      .sort((a, b) => String(nextDueDate(a) || '~').localeCompare(String(nextDueDate(b) || '~'))
        || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
    if (notDue.length) {
      const ndBox = el('<div style="margin-bottom:18px"></div>');
      ndBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:700">`
        + `Not due today (${notDue.length}) — tap one to add it to today</div>`));
      const ndChips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>');
      notDue.forEach((u) => {
        const nd = nextDueDate(u);
        const when = !nd ? 'no date yet'
          : nd === shiftDay(todayKey(), 1) ? 'tomorrow'
          : new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
        // TAP ONE AND IT IS ON TODAY. A room off its day still gets cleaned — a guest
        // checks out, somebody asks — and the only way to record that was to open the
        // room and move its dates, which moves every clean after it too. This is the
        // one-off extra clean: on today's list, on the board, back on its own rhythm
        // tomorrow. The ＋ is there because a phone has no hover to reveal a title.
        const chip = el(`<button class="freqmini" style="flex:0 0 auto;padding:7px 10px;opacity:0.75;font-size:11px" `
          + `title="${esc((FREQ_LABEL[u.freq] || 'Daily') + (nd ? ' · next due ' + nd : '') + ' — tap to clean it today as a one-off')}">`
          + `＋ ${esc(u.unit)} · ${esc(when)}</button>`);
        chip.onclick = () => toggleRoomOnToday(u.id);
        ndChips.appendChild(chip);
      });
      ndBox.appendChild(ndChips);
      fold('notdue', 'Not due today', String(notDue.length), ndBox, false);
    }

    // WHAT WAS ADDED BY HAND, AND HOW TO TAKE IT BACK OFF. A mis-tap on the list above
    // otherwise puts a room on the morning with no way to undo it short of finding the
    // room and clearing a date nobody knows is set. Ticked rooms are not offered: the
    // clean happened, and removing it would leave the work with nowhere to show.
    {
      const added = (state.servicedUnits || []).filter((u) => addedToToday(u) && !u.paused).slice()
        .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
      if (added.length) {
        const aBox = el('<div style="margin-bottom:18px"></div>');
        aBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:700">`
          + `Added to today by hand (${added.length}) — tap to take one back off</div>`));
        const aChips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>');
        added.forEach((u) => {
          const done = cleanedToday(u);
          const chip = el(`<button class="freqmini" style="flex:0 0 auto;padding:7px 10px;font-size:11px;`
            + (done ? 'background:#eaf7ee;border-color:#bfe3ca;color:#15803d' : 'border-color:#0284c7;color:#0369a1')
            + `" title="${esc(done ? 'Cleaned today — it stays on the list' : 'Added to today — tap to remove it again')}">`
            + `${esc(u.unit)}${done ? ' ✓' : ' ✕'}</button>`);
          if (!done) chip.onclick = () => toggleRoomOnToday(u.id);
          aChips.appendChild(chip);
        });
        aBox.appendChild(aChips);
        fold('added', 'Added to today by hand', String(added.length), aBox, true);
      }
    }

    // OFF THE ROLL CALL, BUT WANTED TODAY. Airbnb is a separate job with its own pair,
    // its own tab and its own page on the board, and that rule is not what this is. This
    // is the single room: one guest checks out, it is cleaned with the morning round, and
    // the office wants it on the phone list and in somebody's column on the wall like any
    // other room. Tapping one puts it there for today and today only — tomorrow it is
    // back on its own tab, and the kind is still off the roll call.
    {
      const offRoll = (state.servicedUnits || []).filter((u) => !onRollCall(u) && !u.paused).slice()
        .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
      if (offRoll.length) {
        const offKinds = [...new Set(offRoll.map((u) => UNIT_TYPES[unitType(u)].label))].join(' / ');
        const offBox = el('<div style="margin-bottom:18px"></div>');
        offBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:700">`
          + `${esc(offKinds)} — off the roll call (${offRoll.length}) — tap one to put it on today's board</div>`));
        const offChips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>');
        offRoll.forEach((u) => {
          const chip = el(`<button class="freqmini" style="flex:0 0 auto;padding:7px 10px;font-size:11px;opacity:0.85" `
            + `title="${esc('Put ' + u.unit + " on today's roll call and TV board — today only")}">`
            + `＋ ${esc(u.unit)}${u.guest ? ' · ' + esc(u.guest.split(' ')[0]) : ''}</button>`);
          chip.onclick = () => toggleRoomOnToday(u.id);
          offChips.appendChild(chip);
        });
        offBox.appendChild(offChips);
        offBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
          + `Today only. It joins the rooms above and its cleaner's column on the TV; `
          + `tomorrow it is back on the ${esc(offKinds)} tab.</div>`));
        fold('offkinds', offKinds + ' — off the roll call', String(offRoll.length), offBox, false);
      }
    }
  }

  // COMMUNAL AREAS — the corridors, stairs and lobby still have to be given to
  // someone each morning. Hand-assigned on purpose: an area is a walk of the
  // building rather than a room on a count, so auto-assign leaves them alone.
  if (areasInterior().length) {
    const openA = areasOutstanding();
    const doneA = areasInterior().filter(areaDone);
    const abox = el('<div style="margin-bottom:18px"></div>');
    abox.appendChild(el(`<div class="section-label">▦ Communal areas (${openA.length} to do)</div>`));
    abox.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin:-6px 0 10px">`
      + `Hand these out yourself — auto-assign only spreads rooms.`
      + (doneA.length ? ` · <span style="color:#15803d">${doneA.length} done</span>` : '')
      + `</div>`));
    // Only what's left gets a card. A finished area collapses to a chip, so the
    // section shrinks through the morning instead of staying a wall of nine.
    if (openA.length) {
      const list = el(`<div class="area-list"></div>`);
      openA.forEach(a => list.appendChild(areaWorkCard(a, { presentOnly: true })));
      abox.appendChild(list);
    }
    if (!openA.length) abox.appendChild(el(`<div style="font-size:12px;color:#15803d;font-weight:700;margin-bottom:8px">✓ Every communal area is done</div>`));
    if (doneA.length) {
      const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>');
      doneA.forEach(a => {
        const who = (state.staff || []).find(p => p.id === a.assignedTo);
        const chip = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px;background:#eaf7ee;border-color:#bfe3ca;color:#15803d" `
          + `title="Tap to undo">${esc(a.label)}${who ? ' · ' + esc(who.name.split(' ')[0]) : ''} ✓</button>`);
        chip.onclick = () => toggleAreaDone(a.id);   // a mis-tap has to be undoable
        chips.appendChild(chip);
      });
      abox.appendChild(chips);
    }

    // RAISE A JOB THAT IS NOT A ROOM. The electrician, two flats being done off site,
    // something to be shifted out of a stairwell. It goes to somebody, it shows in their
    // column on the wall, it is ticked off here with everything else, and it is gone
    // tomorrow — unlike the communal area the office used to add for it, which then came
    // round every morning for ever until somebody remembered to delete it.
    {
      const jbox = el('<div style="margin-top:10px;padding:8px 10px;border-radius:8px;background:#101c30;border:1px solid #1e2f4d"></div>');
      jbox.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:700;margin-bottom:6px">`
        + `Something else today — the electrician, work off site, a one-off</div>`));
      const jIn = el(`<input id="oneOffLabel" placeholder="What has to be done" style="width:100%;margin-bottom:6px">`);
      jbox.appendChild(jIn);
      // Handed to whoever it is handed to, from the same list the areas use — leaders,
      // and only the ones actually in when there are any.
      const leaders = cleaningStaff().filter((p) => p.isLeader && onDutyToday(p));
      const inNow = leaders.filter((p) => hikArrivals[p.id]);
      const pool = inNow.length ? inNow : leaders;
      let jWho = '';
      const jRow = el('<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px"></div>');
      const jBtns = {};
      pool.forEach((p) => {
        const b = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px;font-size:11px">${esc(p.name.split(' ')[0])}</button>`);
        b.onclick = () => {
          jWho = (jWho === p.id) ? '' : p.id;
          Object.values(jBtns).forEach((x) => x.classList.remove('on'));
          if (jWho) b.classList.add('on');
        };
        jBtns[p.id] = b;
        jRow.appendChild(b);
      });
      jbox.appendChild(jRow);
      const jAdd = el(`<button class="add-btn" style="width:100%">＋ Add it to today</button>`);
      jAdd.onclick = () => {
        const v = document.getElementById('oneOffLabel');
        if (!v || !v.value.trim()) { if (v) v.focus(); return; }
        addOneOffJob(v.value, jWho);
      };
      jbox.appendChild(jAdd);
      abox.appendChild(jbox);
    }
    fold('areas', '▦ Communal areas', areasOutstanding().length + ' to do', abox, false);
  }

  // THE GUEST FLATS, ON THE MORNING SCREEN, MOVED BY HAND.
  // Which flats were done and by whom is decided by who checked out and who was free —
  // never by a schedule — so it is always somebody moving work onto somebody. That was
  // a dropdown inside a card you had to find first. Here they are, all of them, and a
  // flat goes to a person by being dropped on them or tapped onto them.
  {
    const flats = (state.servicedUnits || []).filter((u) => !u.paused && unitType(u) === 'airbnb')
      .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
    if (flats.length) {
      const fbox = el('<div style="margin-bottom:18px"></div>');
      const doneN = flats.filter(cleanedToday).length;
      fbox.appendChild(el(`<div class="section-label">🏠 Airbnb (${doneN}/${flats.length} done)</div>`));
      fbox.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin:-6px 0 10px">`
        + (_picked
            ? `<b style="color:#0369a1">${esc(_picked.label)} is in your hand</b> — tap whoever cleaned it, below. Tap it again to put it down.`
            : `Tap a flat, then tap whoever cleaned it. On a computer you can drag it onto them.`)
        + `</div>`));
      const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
      flats.forEach((u) => {
        const done = cleanedToday(u);
        const who = (state.staff || []).find((p) => p.id === u.assignedTo);
        const held = _picked && _picked.id === u.id;
        const chip = el(`<button class="freqmini" style="flex:0 0 auto;padding:9px 12px;font-size:13px;`
          + `touch-action:manipulation;`
          + (held ? 'background:#0284c7;border-color:#0284c7;color:#ffffff;font-weight:800'
             : done ? 'background:#eaf7ee;border-color:#bfe3ca;color:#15803d'
             : 'background:#f3efff;border-color:#ddd0fb;color:#6d28d9;font-weight:700') + `">`
          + `${esc(u.unit)}${done ? ' ✓' : ''}${who ? ' · ' + esc(who.name.split(' ')[0]) : ''}</button>`);
        dragToAssign(chip, 'unit', u.id, u.unit);
        chips.appendChild(chip);
      });
      fbox.appendChild(chips);
      fold('airbnb', '🏠 Airbnb', doneN + '/' + flats.length + ' done', fbox, true);
    }
  }

  // WHO'S IN TODAY — only people who badged in, with clock-in times + room assignment.
  const whoIn = el('<div style="margin-bottom:18px"></div>');
  const dayLbl = (selectedDay && selectedDay !== todayKey()) ? ('on ' + selectedDay) : 'today';
  const cleanersTagged = (state.staff || []).some((p) => p.isCleaner);
  whoIn.appendChild(el(`<div class="section-label" style="color:#15803d">✓ ${cleanersTagged ? 'Cleaners' : 'Staff'} clocked in ${dayLbl} (${arrIds.length})</div>`));
  // EXPECTED vs ACTUALLY IN — the badge-ins alone can't tell "hasn't arrived yet"
  // from "isn't working today", so a quiet morning reads as everyone being late.
  // Only shown once somebody actually has a rota; until then it would say nothing.
  {
    const shownDay = selectedDay || todayKey();
    const roster = cleaningStaff();
    if (roster.some((p) => Array.isArray(p.worksOn))) {
      const expected = roster.filter((p) => worksOnDay(p, shownDay));
      const off = roster.filter((p) => !worksOnDay(p, shownDay));
      const inCount = expected.filter((p) => hikArrivals[p.id]).length;
      whoIn.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:600;margin:-6px 0 10px">`
        + `<b style="color:${inCount >= expected.length ? '#15803d' : '#b45309'}">${inCount} of ${expected.length}</b> expected in`
        + (off.length ? ` · off today: ${esc(off.map((p) => p.name.split(' ')[0]).join(', '))}` : '')
        + `</div>`));
    }
  }
  if (!cleanersTagged) whoIn.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 10px">Tip: tag people as <b>Cleaner</b> in the Team tab so sync only shows cleaners.</div>`));
  // Manually add a cleaner who forgot to badge in. Someone who isn't working today
  // didn't forget, so offering them here is how a day off turns into a hand-out by
  // mistake. Badging in still wins over the rota everywhere else: if they turn up on
  // their day off they appear as present and get rooms like anyone else.
  // THE FRIDAY PROBLEM. This offered only people the rota says are working — which on
  // a Friday is half the crew, because the rest day alternates. So somebody who came
  // in on their off-Friday could not be added at all: not badged, not on the rota,
  // not on the list, and no way to say they were there. Everybody who isn't already
  // in is offered now; the rota decides which GROUP they appear under, so putting an
  // off-duty person in is still a deliberate act rather than a mis-tap.
  const addDay = selectedDay || todayKey();
  const byName = (a, b) => String(a.name).localeCompare(String(b.name), undefined, { numeric: true, sensitivity: 'base' });
  const notIn = cleaningStaff().filter((p) => !hikArrivals[p.id]);
  const onRota = notIn.filter((p) => worksOnDay(p, addDay)).sort(byName);
  const offRota = notIn.filter((p) => !worksOnDay(p, addDay)).sort(byName);
  if (notIn.length) {
    const addSel = el('<select class="area-select" style="margin-bottom:12px"></select>');
    addSel.appendChild(el('<option value="">＋ Add someone who came in but didn’t clock in…</option>'));
    const group = (label, list) => {
      if (!list.length) return;
      const g = el(`<optgroup label="${esc(label)}"></optgroup>`);
      list.forEach((p) => g.appendChild(el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`)));
      addSel.appendChild(g);
    };
    group('Down to work today', onRota);
    group('Off today — came in anyway', offRota);
    addSel.onchange = (e) => { if (e.target.value) addManualArrival(e.target.value); };
    whoIn.appendChild(addSel);
    if (offRota.length) whoIn.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-8px 0 12px">`
      + `${offRota.length} down as off today — add one and they get rooms like anyone else.</div>`));
  }
  if (!arrIds.length) {
    whoIn.appendChild(el(`<div class="empty" style="text-align:center;padding:16px 0;color:#5b6a7f">No clock-ins for this day. Tap "Import Attendance File" and pick your Hik export.</div>`));
  } else {
    // AN ASSISTANT IS NOT A SECOND ROUND, SO THEY ARE NOT A SECOND CARD.
    // They work the leader's round with them — the whole reason their name is printed
    // beside that leader's, here and on the wall. Given a card of their own they also
    // got a "+ Assign a room or area…", which is an invitation to do the one thing the
    // hand-out refuses to do: deal a room to somebody who is not running a round. Every
    // room dealt that way then has to be unpicked. So they are named where they belong
    // and nowhere else, exactly as the board has always done it (tvNamedElsewhere).
    //
    // Holding something of their own makes them their own round for the day, and then
    // they get the card: work with a name against it has to be visible somewhere.
    // THE ROLL CALL IS A LIST OF ROUNDS, AND A ROUND IS A LEADER'S.
    // Rooms are dealt to leaders; everybody else works a leader's round with them. So a
    // card each for eighteen people — most of them with an empty "+ Assign a room or
    // area…" under their name — is eighteen invitations to do the one thing the hand-out
    // refuses to do, and fifteen screens of scrolling to reach the three that matter.
    // Leaders get the cards. Everyone else who badged in is named in one line, so the
    // office can still see they are here.
    const holdsWork = (p) => (state.servicedUnits || []).some((u) => u.assignedTo === p.id)
      || areasInterior().some((a) => a.assignedTo === p.id);
    const namedUnderLeader = (p) => !!p && !p.isLeader;
    const assistants = arrIds.map((id) => staffById[id]).filter(namedUnderLeader);
    // Named, though. Somebody who badged in and then appears nowhere on the screen
    // reads as the door reader having missed them, which is a different problem the
    // office would go looking for.
    // WITH THE TIME THEY BADGED IN, AND THEIR WHOLE NAME.
    //
    // This line is the only place most of the crew appears on the roll call — leaders
    // get cards, non-cleaners get chips, and everybody else is here — and it named them
    // without the one fact the roll call exists to report. "What time did Abdirisaq get
    // in?" could not be answered on this screen at all; you had to find whichever leader
    // he was printed beside on the board. An assistant's badge-in is as real as a
    // leader's and the door reader records it the same way.
    //
    // Full names, not first names. This roster has Mahad Hussein Hassan, Mahad Abdi
    // Mohamed, Mahamed Nur Hassan, Mohamed Salaal, Mahamed Abdi Amin and Mahamed Deeq
    // Aadan on it — six people whose first names differ by a vowel, and a list of them
    // cut to the first word is not a list of who is in.
    //
    // Earliest first, the same order the cards above are in, so the two read as one
    // list rather than two orderings of the same morning.
    if (assistants.length) whoIn.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-8px 0 12px">`
      + `Also in, working a leader's round: `
      + `<b>${assistants.slice()
          .sort((a, b) => String((hikArrivals[a.id] || {}).raw || '')
            .localeCompare(String((hikArrivals[b.id] || {}).raw || '')))
          .map((p) => esc(p.name)
            + ((hikArrivals[p.id] || {}).time
                ? ` <span style="color:#7ea6dc">${esc(hikArrivals[p.id].time)}</span>` : '')
            + (holdsWork(p) ? ' (holding work)' : '')).join(', ')}</b>`
      + ` — rooms are dealt to leaders, so they are named on their leader rather than given a round of their own.</div>`));
    arrIds
      .map((id) => ({ s: staffById[id], t: hikArrivals[id].time, out: hikArrivals[id].out, raw: hikArrivals[id].raw }))
      .filter((x) => x.s && !namedUnderLeader(x.s))
      .sort((a, b) => String(a.raw || '').localeCompare(String(b.raw || '')))   // earliest badge-in first
      .forEach(({ s, t, out }) => {
        const manual = hikArrivals[s.id] && hikArrivals[s.id].manual;
        const card = el('<div class="person" style="flex-direction:column;align-items:stretch;gap:8px"></div>');
        // Somebody who is in can be given a job: dropped on with a mouse, or tapped
        // while a job is in hand. The card is the target because the card is the person.
        makeDropTarget(card, s.id);
        if (_picked) card.style.outline = '2px dashed #93c5fd';
        const info = el('<div class="person-info"></div>');
        const lead = s.isLeader ? ` <span style="color:#d97706;font-size:12px;font-weight:700">★</span>` : '';
        const shk = shiftOf(s);
        const shiftBadge = shk !== 'day' ? ` <span style="color:${SHIFTS[shk].color};font-size:11px;font-weight:700">${SHIFTS[shk].icon} ${SHIFTS[shk].label}</span>` : '';
        const nameRow = el(`<div style="display:flex;align-items:center;gap:8px"></div>`);
        const withWho = withLabel(s, (x) => !!hikArrivals[x.id]);
        nameRow.appendChild(el(`<div class="person-name" style="flex:1">${esc(s.name)}${lead}${shiftBadge}`
          + (withWho ? ` <span style="font-size:12px;font-weight:600;color:#5f7189">${esc(withWho)}</span>` : '')
          + `</div>`));
        if (manual) {
          const rm = el(`<button class="su-rm" style="flex:0 0 auto">✕ Remove</button>`);
          rm.onclick = () => removeManualArrival(s.id);
          nameRow.appendChild(rm);
        }
        info.appendChild(nameRow);
        const timecard = manual
          ? `✚ Added by office <span style="color:#5b6a7f">· didn't badge</span>`
          : out
          ? `✓ In ${esc(t)} <span style="color:#5b6a7f">·</span> Out ${esc(out)}`
          : `✓ In ${esc(t)} <span style="color:#5b6a7f">· still in</span>`;
        info.appendChild(el(`<div class="person-floors" style="color:#15803d;font-weight:600">${timecard}</div>`));
        card.appendChild(info);
        const mine = (state.servicedUnits || []).filter((u) => u.assignedTo === s.id);
        const myAreas = areasInterior().filter((a) => a.assignedTo === s.id);
        if (mine.length || myAreas.length) {
          const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
          mine.forEach((u) => {
            const chip = el(`<button class="freqmini on" style="flex:0 0 auto;padding:6px 11px">${esc(u.unit)} ✕</button>`);
            chip.onclick = () => setUnitAssignee(u.id, '');
            chips.appendChild(chip);
          });
          // Areas carry their name, not a number, so they read differently from rooms
          // in the same row — which is the point: you can see what someone is holding.
          myAreas.forEach((a) => {
            const chip = el(`<button class="freqmini on" style="flex:0 0 auto;padding:6px 11px;background:#15803d;border-color:#15803d">${esc(a.label)}${areaDone(a) ? ' ✓' : ''} ✕</button>`);
            chip.onclick = () => setAreaAssign(a.id, '');
            chips.appendChild(chip);
          });
          card.appendChild(chips);
        }
        // Rooms still to hand out — due-today ones suggested first, everything else
        // tucked below so an out-of-schedule room is a deliberate choice, not an accident.
        // Kinds of room roll call doesn't cover must not be offered here either —
        // otherwise they're off the board but still handed out one by one.
        const free = (state.servicedUnits || []).filter((u) => onRollCall(u) && !u.assignedTo && !cleanedToday(u));
        const byUnit = (a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true });
        const freeDue = free.filter(unitDueToday).sort((a, b) =>
          (slotRank(a) - slotRank(b))
          || (b.priority ? 1 : 0) - (a.priority ? 1 : 0)
          || byUnit(a, b));
        const freeLater = free.filter((u) => !unitDueToday(u)).sort(byUnit);
        // Areas are handed out from the same place as rooms — a separate control for
        // them would mean remembering to use it.
        const freeAreas = areasInterior().filter((a) => !a.assignedTo && !areaDone(a));
        if (free.length || freeAreas.length) {
          const sel = el('<select class="area-select"></select>');
          sel.appendChild(el(`<option value="">+ Assign a room or area…${freeDue.length ? ` (${freeDue.length} due today)` : ''}</option>`));
          const optFor = (u, suffix) => el(`<option value="${esc(u.id)}">${flags(u)}Room ${esc(u.unit)}${suffix}</option>`);
          if (freeDue.length) {
            const g = el(`<optgroup label="Due today (${freeDue.length})"></optgroup>`);
            freeDue.forEach((u) => g.appendChild(optFor(u, '')));
            sel.appendChild(g);
          }
          if (freeLater.length) {
            const g = el(`<optgroup label="Not due yet (${freeLater.length})"></optgroup>`);
            freeLater.forEach((u) => {
              const nd = nextDueDate(u);
              g.appendChild(optFor(u, nd ? ' — next ' + new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''));
            });
            sel.appendChild(g);
          }
          if (freeAreas.length) {
            const g = el(`<optgroup label="Communal areas (${freeAreas.length})"></optgroup>`);
            freeAreas.forEach((a) => g.appendChild(el(`<option value="${esc(areaLogId(a))}">${esc(a.label)} — ${esc(FREQ[a.freq].label)}</option>`)));
            sel.appendChild(g);
          }
          sel.onchange = (e) => {
            const v = e.target.value;
            if (!v) return;
            if (isAreaLog(v)) setAreaAssign(v.slice(5), s.id); else setUnitAssignee(v, s.id);
          };
          card.appendChild(sel);
        } else if (!mine.length && !myAreas.length) {
          card.appendChild(el('<div style="font-size:11px;color:#5b6a7f">No rooms yet — add units on the Cleaning tab, then assign here.</div>'));
        }
        whoIn.appendChild(card);
      });
  }
  // Everyone else the door reader saw. Kept out of the roll call, but visible — and
  // one tap fixes the common case, which is a cleaner nobody tagged as one.
  if (hikOther.length) {
    const other = el('<div style="margin-bottom:18px"></div>');
    other.appendChild(el(`<div class="section-label">Also badged in — not cleaners (${hikOther.length})</div>`));
    other.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 10px">The door reader sees all staff. Tap someone to add them to the cleaning roll call.</div>`));
    const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
    hikOther.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach((o) => {
      const c = el(`<button class="freqmini" style="flex:0 0 auto;padding:7px 11px">${esc(o.name)} <span style="color:#5b6a7f">${esc(o.time)}</span> +</button>`);
      c.onclick = () => { toggleCleaner(o.id); loadHikArrivals().then(() => render()); };
      chips.appendChild(c);
    });
    other.appendChild(chips);
    // OPEN. Who the door reader saw is the question this screen exists to answer, and
    // it was folded away behind a chevron — so the five people who badged in but are
    // not tagged as cleaners were invisible unless somebody thought to go looking.
    // One of them was on a cleaning team.
    fold('badged', 'Also badged in — not cleaners', String(hikOther.length), other, true);
  }

  // OPEN TOO, AND FOR THE SAME REASON. "Cleaners clocked in today" IS the clock-in
  // times — the office wants them on the screen, not one tap away behind a heading
  // that does not say a time is under it. Anybody who prefers it shut can shut it, and
  // that choice is remembered on their own device (rcFold is device-local now).
  fold('whoin', '✓ Cleaners clocked in today', String(arrIds.length), whoIn, true);

  // TOMORROW, ON THE ROLL CALL. The roll call is the screen the office actually
  // lives on; tomorrow was a tab away, so "is tomorrow sorted?" meant going to look.
  // It lays itself out when the app opens, so this is normally just showing it —
  // and the one button is there for when it is not.
  {
    const day = tomorrowKey();
    // Read it without creating it: getPlan() would leave an empty day behind, and an
    // empty day that has been seeded is how "cleared on purpose" is recorded.
    const plan = (state.plans || {})[day] || {};
    const rooms = Object.values(plan).filter((v) => v.kind === 'unit');
    const named = rooms.filter((v) => v.assignedTo).length;
    const staffById = {};
    (state.staff || []).forEach((s) => { staffById[s.id] = s; });
