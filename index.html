      setPlanAssignee(day, _picked.planKey, none ? '' : pid);
      _picked = null;
    });
    const hd = el('<div class="bd-hd"></div>');
    const who = people.find((p) => p.id === pid);
    hd.appendChild(el(`<div class="bd-who">${esc(none ? 'NOT HANDED OUT' : who.name)}</div>`));
    hd.appendChild(el(`<div class="bd-count">${mine.length}</div>`));
    col.appendChild(hd);
    const row = el('<div class="bd-jobs"></div>');
    mine.sort((a, b) => String(a.label).localeCompare(String(b.label), undefined, { numeric: true }))
      .forEach((j) => {
        const u = j.kind === 'unit' ? byId[j.refId] : null;
        const air = u && unitType(u) === 'airbnb';
        const cls = j.kind !== 'unit' ? 'area' : air ? 'air' : '';
        const held = _picked && _picked.planKey === j.key;
        const chip = el(`<div class="bd-job ${cls}${held ? ' held' : ''}"></div>`);
        chip.appendChild(el(`<span class="bd-lbl" style="cursor:default">`
          + `${esc(String(j.label).replace(/^Unit\s+/, ''))}</span>`));
        const grip = el(`<button class="bd-grip" title="Drag onto somebody, or tap then tap a person">⠿</button>`);
        let from = null, moved = false;

        grip.addEventListener('pointerdown', (e) => {
          from = { x: e.clientX, y: e.clientY }; moved = false;
          if (grip.setPointerCapture) grip.setPointerCapture(e.pointerId);
        });
        grip.addEventListener('pointermove', (e) => {
          if (!from) return;
          if (!moved && Math.abs(e.clientX - from.x) + Math.abs(e.clientY - from.y) < 8) return;
          moved = true;
          dragGhost(String(j.label).replace(/^Unit\s+/, ''));
          moveGhost(e.clientX, e.clientY);
          e.preventDefault();
        });
        grip.addEventListener('pointerup', (e) => {
          clearGhost();
          if (moved) {
            const t = document.elementFromPoint(e.clientX, e.clientY);
            const drop = t && t.closest && t.closest('[data-plandrop]');
            if (drop) {
              const to = drop.getAttribute('data-plandrop');
              setPlanAssignee(day, j.key, to === '__none__' ? '' : to);
            }
          } else {
            _picked = (_picked && _picked.planKey === j.key) ? null : { planKey: j.key, label: j.label };
            render();
          }
          from = null; moved = false;
        });
        grip.addEventListener('pointercancel', () => { clearGhost(); from = null; moved = false; });
        chip.appendChild(grip);
        row.appendChild(chip);
      });
    col.appendChild(row);
    cols.appendChild(col);
  });
  wrap.appendChild(cols);
  wrap.appendChild(el(`<div style="font-size:11px;color:#6f8ab0;margin-top:10px">`
    + `Drag a job by its ⠿ grip onto whoever should have it — or tap the grip, then tap a person. `
    + `Drop it on NOT HANDED OUT to take it off somebody.</div>`));
  return wrap;
}

function viewPlan() {
  const wrap = el('<div class="body"></div>');
  const day = curPlanDay();
  const isTomorrow = day === tomorrowKey();
  // "Today" means the WORK day, the same day Roll Call, the close-out and the
  // automatic planning pass all use. It used to mean the calendar day here alone, so
  // a plan made between midnight and the 3am cutoff was filed one date FORWARD of the
  // one Roll Call reads — the plan was made, saved, and simply never appeared on the
  // morning it was made for. Daytime the two dates are identical and nothing changes.
  const isToday = day === workToday() || day === todayKey();
  const dt = new Date(day + 'T00:00:00');

  // Fill the day from the schedule before drawing it, so the list is already
  // there on arrival instead of being an empty screen the office has to type in.
  // A day already laid out is re-checked rather than left as drawn, so what is on
  // screen is what the schedule says now — not what it said when it was first opened.
  // A PAST DAY IS A RECORD, NOT A PLAN. Filling one in from the schedule would
  // invent a morning that never happened, so days behind the current one are opened
  // exactly as they were left — or empty, if they were never planned at all.
  const past = day < workToday();
  const seeded = past ? 0 : seedPlanOnce(day);
  if (!past && !seeded && day > todayKey()) resyncPlanDay(day);

  // WHICH DAY, IN THE CORNER. It belongs where the eye goes first and takes as little
  // room as it can, because everything under it is that day's work — and what is under
  // it now is the board, so the day picker must not be the biggest thing on the screen.
  const quick = el('<div style="display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end"></div>');
  const jump = (lbl, key, on) => { const b = el(`<button class="bd-tab ${on ? 'on' : ''}" style="flex:0 1 auto;min-width:0;padding:8px 12px;font-size:12px">${lbl}</button>`); b.onclick = () => { planDay = key; render(); }; return b; };
  // Backwards as well as forwards: "what was 704 actually put on?" is a question
  // worth being able to answer, and the day picker used to refuse to go behind today.
  const yday = shiftDay(workToday(), -1);
  quick.appendChild(jump('Yesterday', yday, day === yday));
  quick.appendChild(jump('Today', workToday(), isToday));
  quick.appendChild(jump('Tomorrow', tomorrowKey(), isTomorrow));
  const dayIn = el(`<input type="date" value="${esc(day)}" min="${esc(shiftDay(workToday(), -120))}" style="flex:0 0 auto;width:150px;background:#16233a;color:#eaf1fb;border:1px solid #3d557f;border-radius:8px;padding:7px 9px;font-size:13px">`);
  dayIn.onchange = (e) => { planDay = e.target.value || null; render(); };
  quick.appendChild(dayIn);
  wrap.appendChild(quick);

  // One tap between planning the day and the sheet that gets photographed.
  const sheetBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:10px;`
    + `border-color:#0284c7;color:#0284c7">${_planSheet ? '‹ Back to planning' : '📋 Hand-out sheet — fits one screen'}</button>`);
  sheetBtn.onclick = () => { _planSheet = !_planSheet; render(); };
  wrap.appendChild(sheetBtn);
  if (_planSheet) { wrap.appendChild(planHandoutSheet(day)); return wrap; }

  // THE DAY, AS THE BOARD. The same columns, chips and grips as today's screen, so
  // moving a room from one person to another is one gesture wherever you are.
  wrap.appendChild(planBoard(day));

  // THE ONE BUTTON.
  const planBtn = el(`<button class="add-btn" style="background:#15803d;margin-bottom:10px;font-size:15px;padding:12px">`
    + (isTomorrow ? `⚡ Plan tomorrow's rooms` : `⚡ Plan this day`) + `</button>`);
  planBtn.onclick = () => {
    if (isTomorrow) { planTomorrow(); return; }
    ensureDayPlanned(day);
    const plan = getPlan(day);
    const loose = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && !plan[k].assignedTo);
    if (loose.length && !isToday) assignNewPlanJobs(day, loose);
    mirrorPlanToBoard(day);
    save();
    const rooms = Object.values(plan).filter((v) => v.kind === 'unit');
    hikSyncMsg = { text: rooms.length + ' room' + (rooms.length === 1 ? '' : 's') + ' on this day, '
      + rooms.filter((v) => v.assignedTo).length + ' handed out.' };
    render();
  };
  wrap.appendChild(planBtn);

  if (hikSyncMsg) wrap.appendChild(el(`<div class="section-label" style="color:${hikSyncMsg.err ? '#dc2626' : '#15803d'}">${esc(hikSyncMsg.text)}</div>`));

  // THE DAY'S WORK, as one block. Grouped under each cleaner rather than listed
  // room by room with a dropdown each: the old layout was two rows and a full-width
  // select per room, so fourteen rooms was a long scroll and no use as a picture.
  // This is what gets sent to the crew, so it reads as a rota — name, count, rooms.
  const jobs = planJobs(day);
  const rooms = jobs.filter((j) => j.kind === 'unit');
  const areas = jobs.filter((j) => j.kind !== 'unit');
  const staffById = {};
  (state.staff || []).forEach((p) => { staffById[p.id] = p; });

  const head = el('<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"></div>');
  head.appendChild(el(`<div class="section-label" style="margin:0">${esc(dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }))}</div>`));
  head.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:700;flex:0 0 auto">`
    + `${rooms.length} room${rooms.length === 1 ? '' : 's'}${areas.length ? ` · ${areas.length} area${areas.length === 1 ? '' : 's'}` : ''}</div>`));
  wrap.appendChild(head);

  if (!jobs.length) {
    wrap.appendChild(el(`<div class="empty" style="padding:14px 0">Nothing on this day yet. Press the button above.</div>`));
  } else {
    // Areas sit with whoever is doing them, not in a bucket of their own — the
    // question is what one person's morning looks like, rooms and walks together.
    const byWho = {};
    [...rooms, ...areas].forEach((j) => { (byWho[j.assignedTo || ''] = byWho[j.assignedTo || ''] || []).push(j); });
    const order = Object.keys(byWho).sort((a, b) => {
      if (a === '') return 1; if (b === '') return -1;   // unhanded last, where it is noticed
      return String((staffById[a] || {}).name || a).localeCompare(String((staffById[b] || {}).name || b));
    });
    const box = el('<div style="margin-top:6px"></div>');
    order.forEach((id) => {
      // Order is the instruction: the rooms a customer asked for first thing come
      // first, so the list can be read top to bottom and worked in that order.
      const slotOf = (j) => j.kind === 'unit'
        ? timeSlot((state.servicedUnits || []).find((u) => u.id === j.refId)) : 'any';
      const rank = (j) => slotOf(j) === 'early' ? 0 : j.kind === 'unit' ? 1 : 3;   // early, rooms, walks
      const list = byWho[id].slice().sort((x, y) =>
        (rank(x) - rank(y))
        || String(x.label).localeCompare(String(y.label), undefined, { numeric: true }));
      const nRooms = list.filter((j) => j.kind === 'unit').length;
      const nAreas = list.length - nRooms;
      const none = !id;
      const p = staffById[id];
      const name = none ? 'Not handed out' : ((p || {}).name || id);
      // Same card as the roll call's clocked-in cleaners: name, a line under it,
      // then the rooms as chips. That block is the one the office reads fastest.
      const card = el(`<div class="person" data-plan-target="${esc(id)}" style="flex-direction:column;align-items:stretch;gap:8px"></div>`);
      const info = el('<div class="person-info"></div>');
      const lead = (p && p.isLeader) ? ` <span style="color:#d97706;font-size:12px;font-weight:700">★</span>` : '';
      const nameRow = el(`<div style="display:flex;align-items:center;gap:8px"></div>`);
      const withWho = none ? '' : withLabel(p, (x) => worksOnDay(x, day));
      nameRow.appendChild(el(`<div class="person-name" style="flex:1">${esc(name)}${lead}`
        + (withWho ? ` <span style="font-size:12px;font-weight:600;color:#5f7189">${esc(withWho)}</span>` : '')
        + `</div>`));
      // The sick-day button. Without it, moving five rooms means five taps and the
      // plan gets abandoned in favour of improvising the morning.
      if (!none) {
        const off = el(`<button class="su-rm" style="flex:0 0 auto">Off — share out</button>`);
        off.onclick = () => showConfirm(
          name.split(' ')[0] + ' is off?',
          `Their ${list.length} room${list.length === 1 ? '' : 's'} go back and are dealt round whoever else is `
            + `on that day, evenly. Anything nobody is cleared for is left unhanded so you can see it.`,
          () => {
            const r = sharePersonsRoomsOut(day, id);
            hikSyncMsg = r.stranded
              ? { err: true, text: 'Shared out ' + r.moved + ' — ' + r.stranded + ' left for you to place.' }
              : { text: 'Shared ' + r.moved + ' room' + (r.moved === 1 ? '' : 's') + ' round the rest.' };
            render();
          },
          'Share them out', 'safe');
        nameRow.appendChild(off);
      }
      info.appendChild(nameRow);
      // On today, what the door reader saw — the same line the roll call shows, so
      // you can tell at a glance who is actually in before moving work around.
      const arr = (isToday && id) ? hikArrivals[id] : null;
      const badged = arr
        ? (arr.out ? `✓ In ${esc(arr.time)} <span style="color:#5b6a7f">·</span> Out ${esc(arr.out)}`
                   : `✓ In ${esc(arr.time)} <span style="color:#5b6a7f">· still in</span>`)
        : null;
      const doneN = list.filter((j) => isToday && planJobDone(j)).length;
      const earlyN = list.filter((j) => j.kind === 'unit'
        && timeSlot((state.servicedUnits || []).find((u) => u.id === j.refId)) === 'early').length;
      const counts = none ? `${list.length} still to hand out`
        : `${nRooms} room${nRooms === 1 ? '' : 's'}${nAreas ? ` · ${nAreas} area${nAreas === 1 ? '' : 's'}` : ''}`
          + (earlyN ? ` · <span style="color:#b91c1c">${earlyN} early</span>` : '')
          + (doneN ? ` · ${doneN} done` : '');
      if (badged) info.appendChild(el(`<div class="person-floors" style="color:#15803d;font-weight:600">${badged}</div>`));
      else if (isToday && id && !badged) info.appendChild(el(`<div class="person-floors" style="color:#b45309;font-weight:600">Not badged in yet</div>`));
      info.appendChild(el(`<div class="person-floors" style="color:${none ? '#b45309' : '#5f7189'};font-weight:600">${counts}</div>`));
      card.appendChild(info);
      const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
      list.forEach((j) => {
        const short = String(j.label).replace(/^Unit\s+/, '');
        const isArea = j.kind !== 'unit';
        const done = isToday && planJobDone(j);
        // A room the customer asked for first thing. Called out wherever it is
        // listed, so an uneven early round is visible rather than something you
        // work out by reading every chip.
        const early = j.kind === 'unit'
          && timeSlot((state.servicedUnits || []).find((u) => u.id === j.refId)) === 'early';
        // Exactly the roll call's chip: the room, and an ✕ that takes it off them.
        // A walk of the building is green so it reads differently from a number.
        const style = done ? ';background:#eef7f0;border-color:#15803d;color:#15803d;opacity:0.75'
          : early ? ';background:#fee2e2;border-color:#dc2626;color:#b91c1c;font-weight:800'
          : none ? ';border-color:#b45309;color:#b45309'
          : isArea ? ';background:#15803d;border-color:#15803d;color:#ffffff' : '';
        const mark = done ? ' ✓' : (none ? '' : ' ✕');
        const c = el(`<button class="freqmini${none || isArea || done || early ? '' : ' on'}" style="flex:0 0 auto;padding:6px 11px;touch-action:none${style}">${early ? '🌅 ' : ''}${esc(short)}${mark}</button>`);
        makeRoomDraggable(c, day, j.key, j.label, none);
        chips.appendChild(c);
      });
      card.appendChild(chips);

      // ...and the roll call's "+ Assign a room or area…", so a person can be given
      // something without going and finding it first.
      const spare = jobs.filter((x) => !x.assignedTo);
      if (!none && spare.length) {
        const sel = el('<select class="area-select"></select>');
        sel.appendChild(el(`<option value="">+ Assign a room or area… (${spare.length} spare)</option>`));
        const rms = spare.filter((x) => x.kind === 'unit');
        const ars = spare.filter((x) => x.kind !== 'unit');
        if (rms.length) {
          const g = el(`<optgroup label="Rooms (${rms.length})"></optgroup>`);
          rms.forEach((x) => g.appendChild(el(`<option value="${esc(x.key)}">${esc(x.label)}</option>`)));
          sel.appendChild(g);
        }
        if (ars.length) {
          const g = el(`<optgroup label="Communal areas (${ars.length})"></optgroup>`);
          ars.forEach((x) => g.appendChild(el(`<option value="${esc(x.key)}">${esc(x.label)}</option>`)));
          sel.appendChild(g);
        }
        sel.onchange = (e) => { if (e.target.value) setPlanAssignee(day, e.target.value, id); };
        card.appendChild(sel);
      }
      box.appendChild(card);
    });
    wrap.appendChild(box);

    // Closing out the plan you made last night. Ticking fourteen rooms one at a time
    // is the same tap-per-job the roll call's close-out exists to avoid, and this is
    // the screen the plan was made on — so it closes here too, over exactly the jobs
    // that were planned rather than everything the roll call happens to think is due.
    if (isToday) {
      const openRooms = rooms.filter((j) => !planJobDone(j))
        .map((j) => (state.servicedUnits || []).find((u) => u.id === j.refId)).filter(Boolean);
      const openAreas = areas.filter((j) => !planJobDone(j))
        .map((j) => areasInterior().find((a) => a.id === j.refId)).filter(Boolean);
      const openTotal = openRooms.length + openAreas.length;
      if (openTotal) {
        const allBtn = el(`<button class="add-btn" style="background:#15803d;color:#ffffff;margin-top:10px">`
          + `${esc(markAllLabel(openRooms.length, openAreas.length))}</button>`);
        allBtn.onclick = () => confirmBulkMarkDone(openRooms, openAreas, "today's plan");
        wrap.appendChild(allBtn);
      } else if (jobs.length) {
        wrap.appendChild(el(`<div class="section-label" style="color:#15803d;margin-top:10px">`
          + `All ${jobs.length} planned job${jobs.length === 1 ? '' : 's'} are done.</div>`));
      }
    }

    // One auto-assign, which reads the right thing for the day it is on. Today the
    // door reader decides who is in; on a day that has not happened nobody has
    // badged in at all, and the old button simply failed with "no one clocked in".
    const auto = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:10px">`
      + (isToday ? `⚡ Auto-assign to who's clocked in` : `⚡ Auto-assign to whoever is rostered on`)
      + `</button>`);
    auto.onclick = () => {
      if (isToday) { autoAssignPlan(day); return; }
      const r = autoPlanDay(day);
      hikSyncMsg = r.assigned
        ? { text: 'Handed ' + r.assigned + ' room' + (r.assigned === 1 ? '' : 's') + ' to the ' + r.crew + ' rostered on that day.' }
        : { err: true, text: 'Nothing to hand out — ' + (r.reason || 'no rooms on the plan') + '.' };
      render();
    };
    wrap.appendChild(auto);
  }

  // Due but not on the plan is a discrepancy, not a detail — it stays in the open.
  const plan0 = getPlan(day);
  const missing = planningJobsFor(day).filter((s) => !plan0[planKey(s.kind, s.id)]);
  if (missing.length) {
    wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#b45309">Due but not planned (${missing.length})</div>`));
    const addAll = el(`<button class="freqmini" style="width:100%;padding:9px;border-color:#b45309;color:#b45309">＋ Add all ${missing.length} due job${missing.length === 1 ? '' : 's'}</button>`);
    addAll.onclick = () => { applySuggestions(day, missing); save(); render(); };
    wrap.appendChild(addAll);
  }

  // EVERYTHING ELSE, folded away. None of it is part of the day's list, and all of
  // it was pushing that list off the screen.
  const moreBtn = el(`<button class="reset-btn" style="margin-top:16px">${planMore ? '⌄ Hide' : '› Show more'}</button>`);
  moreBtn.onclick = () => { planMore = !planMore; render(); };
  wrap.appendChild(moreBtn);

  if (planMore) {
    // THE DAYS AHEAD — which day is heavy, before it arrives.
    const ahead = scheduleAhead(7);
    const peak = Math.max(1, ...ahead.map((d) => d.count));
    const box = el('<div style="margin:12px 0 16px"></div>');
    box.appendChild(el(`<div class="section-label">The week ahead</div>`));
    ahead.forEach((d, i) => {
      const ddt = new Date(d.day + 'T00:00:00');
      const lbl = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : ddt.toLocaleDateString('en-US', { weekday: 'long' });
      const row = el(`<div class="su-card" style="display:flex;align-items:center;gap:10px;padding:8px 11px;margin-bottom:5px;cursor:pointer${d.day === day ? ';border-color:#0284c7' : ''}"></div>`);
      row.appendChild(el(`<div style="flex:0 0 84px;font-size:12px;font-weight:800;color:#0f1a27">${esc(lbl)}</div>`));
      const bar = el('<div style="flex:1;height:8px;background:#eef2f7;border-radius:4px;overflow:hidden"></div>');
      const heavy = d.count >= peak * 0.85 && peak > 1;
      bar.appendChild(el(`<div style="height:100%;width:${Math.round((d.count / peak) * 100)}%;background:${heavy ? '#b45309' : '#0284c7'}"></div>`));
      row.appendChild(bar);
      row.appendChild(el(`<div style="flex:0 0 auto;font-size:15px;font-weight:800;color:${heavy ? '#b45309' : '#0f1a27'}">${d.count}</div>`));
      row.onclick = () => { planDay = d.day; render(); };
      box.appendChild(row);
    });
    if (state.lastAutoLevel && state.lastAutoLevel.day === todayKey() && state.lastAutoLevel.moves) {
      const al = state.lastAutoLevel;
      box.appendChild(el(`<div style="font-size:11px;color:#15803d;font-weight:600;margin-top:6px">`
        + `✓ Levelled today — ${al.moves} room${al.moves === 1 ? '' : 's'} spread across the cycle, `
        + `heaviest day ${al.from} → ${al.to}`
        + (al.extras ? `. ${al.extras} got one extra clean to break up the clump` : '') + `.</div>`));
    }
    const pv = planAheadPreview(PLAN_AHEAD_DAYS);
    const wkBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:6px;border-color:#b45309;color:#b45309">`
      + `⚡ Get the next ${pv.span} days ready</button>`);
    wkBtn.onclick = planAhead;
    box.appendChild(wkBtn);
    wrap.appendChild(box);

    if (!isToday) {
      const onDuty = cleaningStaff().filter((p) => worksOnDay(p, day));
      wrap.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin-bottom:8px">`
        + `<b style="color:${onDuty.length ? '#15803d' : '#b45309'}">${onDuty.length}</b> rostered on`
        + (onDuty.length ? ` · ${esc(onDuty.map((p) => p.name.split(' ')[0]).join(', '))}` : '') + `</div>`));
      // A day built before the schedule changed keeps whatever it was given, so there
      // has to be a way to say "do this one again from scratch".
      const rb = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:6px;border-color:#b45309;color:#b45309">⟳ Rebuild this day from the schedule</button>`);
      rb.onclick = () => {
        showConfirm(
          'Rebuild ' + day + '?',
          'The rooms on this day are set back to exactly what the schedule says is due, and handed out again. '
            + 'Rooms you added or removed by hand for this day are lost. Communal areas are left as they are.',
          () => {
            const r = rebuildPlanDay(day);
            hikSyncMsg = { text: 'Rebuilt: ' + r.added + ' added, ' + r.removed + ' dropped, ' + r.assigned + ' handed out.' };
            render();
          },
          'Rebuild it', 'safe'
        );
      };
      wrap.appendChild(rb);
    }
    if (jobs.length) {
      const clr = el(`<button class="reset-btn">Clear this day's plan</button>`);
      clr.onclick = () => clearPlanDay(day);
      wrap.appendChild(clr);
    }

    // Add jobs — grouped pool with toggles
    wrap.appendChild(el(`<div class="section-label" style="margin-top:16px">Add jobs to this day</div>`));
    const pool = planPool();
    if (!pool.length) {
      wrap.appendChild(el(`<div class="empty">No rooms or areas yet — add some on the Airbnb / Buildings / Offices tabs first.</div>`));
    } else {
      [...new Set(pool.map((x) => x.group))].forEach((g) => {
        wrap.appendChild(el(`<div class="section-label" style="margin-top:10px;color:#5b6a7f">${esc(g)}</div>`));
        const box2 = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
        pool.filter((x) => x.group === g).forEach((x) => {
          const on = !!plan0[planKey(x.kind, x.id)];
          const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:0 0 auto;padding:8px 12px">${on ? '✓ ' : '+ '}${esc(x.label)}</button>`);
          b.onclick = () => togglePlanJob(day, x.kind, x.id, x.label);
          box2.appendChild(b);
        });
        wrap.appendChild(box2);
      });
    }
  }

  const sheet = moveJobSheet(day);
  if (sheet) wrap.appendChild(sheet);

  return wrap;
}

// One tab, four filters — see ROOM_TAB_TYPE. The counts sit on the buttons so the
// shape of the building is readable without opening anything.
// Airbnb is cleaned by its own pair after the offices and is off the morning roll
// call, so on the room list it opens shut rather than sitting in the way.
const SHUT_BY_DEFAULT = ['airbnb'];
const GROUP_SUB = { airbnb: 'a separate job, after the main round' };
const ROOM_SEGMENTS = [['all', 'All'], ['airbnb', 'Airbnb'], ['office', 'Offices'], ['building', 'Buildings']];
function roomsFilter() { return ROOM_SEGMENTS.some(([k]) => k === state.roomsFilter) ? state.roomsFilter : 'all'; }
function viewRoomsHub() {
  const wrap = el('<div class="body"></div>');
  const cur = roomsFilter();
  const seg = el('<div class="seg"></div>');
  ROOM_SEGMENTS.forEach(([k, label]) => {
    const n = (state.servicedUnits || []).filter((u) => k === 'all' || unitType(u) === k).length;
    const b = el(`<button class="segbtn ${k === cur ? 'on' : ''}">${label}<span class="segn">${n}</span></button>`);
    b.onclick = () => { state.roomsFilter = k; save(); render(); };
    seg.appendChild(b);
  });
  wrap.appendChild(seg);
  const body = cur === 'all' ? viewRooms()
    : cur === 'airbnb' ? viewAirbnb()
    : cur === 'office' ? viewOffices() : viewBuildings();
  // Each sub-view returns its own .body, and a .body inside a .body doubles the
  // page padding — so take the contents rather than the wrapper.
  while (body.firstChild) wrap.appendChild(body.firstChild);
  return wrap;
}

function viewRooms() {
  const wrap = el('<div class="body"></div>');
  const units = (state.servicedUnits || []).slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  wrap.appendChild(el(`<div class="note"><b>${units.length}</b> rooms. Tap a frequency on any room to change it, or <b>Set all</b> for a whole group.</div>`));
  const pastBtn = el(`<button class="add-btn" style="width:100%;margin-bottom:14px">＋ Record a past day</button>`);
  pastBtn.onclick = () => openBackdate(yesterdayKey());
  wrap.appendChild(pastBtn);
  // SIXTY-SIX ROOMS IS A LOT OF SCROLLING. This screen is where a room's schedule is
  // changed, so it is read one room at a time — and it was the one room list with no
  // way to search it. The box is pinned under the header so it is still there when
  // you are forty rooms down, and it filters the cards already drawn rather than
  // re-rendering, which would take the cursor with it.
  const cards = [];
  let q = '';
  const stick = el('<div class="stickbar"></div>');
  const search = el(`<input type="search" placeholder="Search a room, guest or note…" `
    + `style="width:100%;background:#16233a;color:#eaf1fb;border:1px solid #3d557f;`
    + `border-radius:10px;padding:11px 13px;font-size:15px">`);
  const hits = el(`<div style="font-size:11px;color:#5f7189;font-weight:600;min-height:15px;margin-top:5px"></div>`);
  const applyFilter = () => {
    let shown = 0;
    cards.forEach((c) => {
      const on = !q || c.hay.includes(q);
      c.card.style.display = on ? '' : 'none';
      if (on) shown += 1;
    });
    // With a search running, a group heading and its bulk controls are noise unless
    // something in that group matched.
    groupBlocks.forEach((g) => {
      const n = cards.filter((c) => c.tk === g.tk && c.card.style.display !== 'none').length;
      g.els.forEach((e) => { e.style.display = (!q || n) ? '' : 'none'; });
    });
    hits.textContent = q ? (shown ? shown + ' match' + (shown === 1 ? '' : 'es') : 'No room matches “' + search.value.trim() + '”.') : '';
    hits.style.color = (q && !shown) ? '#b45309' : '#5f7189';
  };
  search.oninput = () => { q = search.value.trim().toLowerCase(); applyFilter(); };
  stick.appendChild(search); stick.appendChild(hits);
  wrap.appendChild(stick);
  const groupBlocks = [];
  if (!units.length) { wrap.appendChild(el(`<div class="empty">No rooms yet.</div>`)); return wrap; }

  // A whole frequency group falling due on the same day is what makes the week swing
  // between a light day and a heavy one. "Even out the days" can't fix it: it delays a
  // room from its last clean, and rooms that come due together are overdue together,
  // so there is nothing for the delay to act on. Splitting them needs a hold-back.
  ['eod', 'weekly'].forEach((fk) => {
    const span = FREQ_DAYS[fk] || 1;
    const dueNow = (state.servicedUnits || []).filter((u) =>
      onRollCall(u) && !u.paused && (u.freq || 'daily') === fk && unitDueToday(u));
    if (span < 2 || dueNow.length <= span) return;
    const box = el('<div class="su-card" style="margin-bottom:14px;padding:12px"></div>');
    box.appendChild(el(`<div style="font-size:12px;font-weight:800;color:#b45309">`
      + `⚠ all ${dueNow.length} ${esc((FREQ_LABEL[fk] || fk).toLowerCase())} rooms are due the same day</div>`));
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:4px">`
      + `Clean them together and they stay together, so the week keeps swinging between a heavy day and a light one.</div>`));
    const btn = el(`<button class="freqmini" style="width:100%;margin-top:8px;padding:9px;border-color:#7c3aed;color:#7c3aed">⇄ Split them over ${span} days</button>`);
    btn.onclick = () => {
      const preview = staggerFrequencyGroup(fk, true);
      const extra = preview.groups.slice(1).reduce((n, g) => n + g.units.length, 0);
      showConfirm(
        'Split ' + dueNow.length + ' rooms over ' + span + ' days?',
        preview.groups.map((g, i) => (i === 0 ? 'Today, as normal' : 'Today AND again on ' + g.day) + ': ' + g.units.join(', ')).join('\n\n')
          + '\n\nAll cleaned today; ' + extra + ' cleaned again tomorrow to move them onto the opposite day. '
          + 'Costs ' + extra + ' extra cleans once. Nothing is delayed or skipped.',
        () => { staggerFrequencyGroup(fk); },
        'Split them',
        'safe'
      );
    };
    box.appendChild(btn);
    wrap.appendChild(box);
  });
  const groups = {};
  units.forEach(u => { const t = unitType(u); (groups[t] = groups[t] || []).push(u); });
  ['airbnb', 'office', 'building'].forEach(tk => {
    const list = groups[tk]; if (!list || !list.length) return;
    const t = UNIT_TYPES[tk];
    // EACH KIND OF ROOM IS ITS OWN DROP-DOWN. Airbnb starts shut: it is a separate
    // job, run by its own pair after the main round, so on a screen about the
    // building's schedule it is a section you open when you want it — not thirty
    // rooms to scroll past to reach the ones the morning is actually about.
    const gk = 'rooms:' + tk;
    const saved = (state.shutGroups || {})[gk];
    const shut = saved === undefined ? SHUT_BY_DEFAULT.includes(tk) : !!saved;
    const head = el(`<button class="grp-btn"></button>`);
    head.appendChild(el(`<div class="grp-caret">${shut ? '▸' : '▾'}</div>`));
    head.appendChild(el(`<div class="crew-dot" style="background:${t.color}"></div>`));
    const gt = el(`<div style="flex:1;min-width:0;text-align:left"></div>`);
    gt.appendChild(el(`<div class="grp-title">${t.label}</div>`));
    if (GROUP_SUB[tk]) gt.appendChild(el(`<div class="grp-sub">${GROUP_SUB[tk]}</div>`));
    head.appendChild(gt);
    head.appendChild(el(`<div class="grp-count">${list.length}</div>`));
    head.onclick = () => {
      state.shutGroups = state.shutGroups || {};
      state.shutGroups[gk] = !shut;      // stored either way, so "opened" survives too
      save(); render();
    };
    wrap.appendChild(head);
    const block = { tk, els: [] };
    groupBlocks.push(block);

    // Group-level schedule flip + a breakdown of what this group is currently on,
    // so an odd room out ("13 on every-other-day") is visible instead of hidden.
    const ids = list.map(u => u.id);
    const tally = {};
    list.forEach(u => { const f = u.freq || 'daily'; tally[f] = (tally[f] || 0) + 1; });
    const spread = Object.keys(tally).sort((a, b) => tally[b] - tally[a])
      .map(f => `${tally[f]} ${FREQ_LABEL[f] || f}`).join(' · ');
    const bulk = el(`<div style="margin:6px 0 4px"></div>`);
    bulk.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:6px">Now: ${esc(spread)} · <b>Set all:</b></div>`));
    const bulkBtns = el(`<div style="display:flex;gap:6px"></div>`);
    [['daily', 'Daily'], ['eod', 'Every other day'], ['weekly', 'Weekly']].forEach(([fk, lbl]) => {
      const allOn = tally[fk] === list.length;
      const b = el(`<button class="freqmini ${allOn ? 'on' : ''}">${lbl}</button>`);
      b.onclick = () => setUnitsFreqBulk(ids, fk, t.label.toLowerCase());
      bulkBtns.appendChild(b);
    });
    bulk.appendChild(bulkBtns);

    // ...or pin the whole group to fixed weekdays, which is what stops the drift.
    const pinnedN = list.filter((u) => fixedDays(u)).length;
    const dayBulk = el(`<div style="margin-top:8px"></div>`);
    dayBulk.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:6px">`
      + `${pinnedN} of ${list.length} on fixed days · <b>Put all on:</b></div>`));
    const dayBtns = el(`<div style="display:flex;gap:5px;flex-wrap:wrap"></div>`);
    let picking = [];
    DOW_PICK_ORDER.forEach((d) => {
      const b = el(`<button class="freqmini" style="padding:6px 9px" title="${esc(DOW_LABEL[d])}">${esc(DOW_SHORT[d])}</button>`);
      b.onclick = () => {
        const at = picking.indexOf(d);
        if (at >= 0) { picking.splice(at, 1); b.classList.remove('on'); }
        else { picking.push(d); b.classList.add('on'); }
        apply.style.display = picking.length ? '' : 'none';
      };
      dayBtns.appendChild(b);
    });
    const apply = el(`<button class="freqmini on" style="padding:6px 11px;display:none">Apply</button>`);
    apply.onclick = () => setUnitsDaysBulk(ids, picking.slice().sort((a, b2) => a - b2), t.label.toLowerCase());
    dayBtns.appendChild(apply);
    if (pinnedN) {
      const off = el(`<button class="freqmini" style="padding:6px 9px">✕ Clear</button>`);
      off.onclick = () => setUnitsDaysBulk(ids, null, t.label.toLowerCase());
      dayBtns.appendChild(off);
    }
    dayBulk.appendChild(dayBtns);
    bulk.appendChild(dayBulk);

    const cleanedCount = list.filter(cleanedToday).length;
    const markRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
    markRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:0 0 auto">`
      + `${cleanedCount} of ${list.length} cleaned today · <b>Mark all:</b></div>`));
    const markToday = el(`<button class="freqmini ${cleanedCount === list.length ? 'on' : ''}" style="flex:0 0 auto;padding:6px 10px">✓ Cleaned today</button>`);
    markToday.onclick = () => setUnitsLastCleanedBulk(ids, todayKey(), t.label.toLowerCase());
    markRow.appendChild(markToday);
    // A past night can't be bulk-stamped with today's assignment — it goes through
    // the sheet, where the names come from who badged in that day.
    const markPast = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">↺ A past day…</button>`);
    markPast.onclick = () => openBackdateForType(tk, yesterdayKey());
    markRow.appendChild(markPast);
    bulk.appendChild(markRow);
    if (shut) return;

    // Show the coming week's load, and offer to flatten it when one day spikes.
    const upcoming = {};
    list.forEach(u => { const d = nextDueDate(u) || todayKey(); upcoming[d] = (upcoming[d] || 0) + 1; });
    const days = Object.keys(upcoming).sort().slice(0, 4);
    const dayLabel = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    if (days.length) {
      const peak = Math.max(...days.map(d => upcoming[d]));
      const lightest = Math.min(...days.map(d => upcoming[d]));
      // Everything landing on ONE day is the worst case, not a balanced one —
      // don't let a single-day spread look like nothing is wrong.
      const allOnOneDay = days.length === 1 && upcoming[days[0]] > 1;
      const lopsided = allOnOneDay || peak - lightest > 1;
      const loadRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
      loadRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:0 0 auto">Next days: `
        + days.map(d => `<b>${upcoming[d]}</b> ${dayLabel(d)}`).join(' · ')
        + `</div>`));
      // Evening the days out is one job with one rule, done by the leveller — which
      // splits rooms across the cycle and never leaves one longer than its frequency.
      // This used to have its own balancer that delayed rooms instead, so the two
      // pulled against each other depending on which had run last.
      if (lopsided) {
        const lp = levelPlan(LEVEL_HORIZON);
        loadRow.appendChild(el(`<div style="flex-basis:100%;height:0"></div>`));
        loadRow.appendChild(el(`<div style="font-size:11px;color:#b45309;font-weight:700;flex:0 0 auto">`
          + (allOnOneDay ? `⚠ all ${upcoming[days[0]]} land on ${dayLabel(days[0])}` : `⚠ ${peak} on one day vs ${lightest} on another`)
          + `</div>`));
        if (lp.moves.length) {
          const balBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">⚖ Even out the days</button>`);
          balBtn.onclick = () => {
            const r = levelPlan(LEVEL_HORIZON);
            applyLevelPlan(r);
            hikSyncMsg = { text: 'Spread ' + r.moves.length + ' room' + (r.moves.length === 1 ? '' : 's')
              + ' across the cycle — heaviest day ' + r.settledBefore + ' → ' + r.settledAfter + '.' };
            render();
          };
          loadRow.appendChild(balBtn);
        }
      }
      bulk.appendChild(loadRow);
    }
    wrap.appendChild(bulk);

    list.forEach(u => {
      const due = unitDueToday(u);
      const nd = nextDueDate(u);
      const who = (state.staff || []).find(p => p.id === (u.usualTo || u.assignedTo));
      const lastBase = lastCleanDate(u);
      const card = el(`<div class="su-card"></div>`);

      // Row 1: number + status
      const top = el(`<div style="display:flex;align-items:center;gap:10px"></div>`);
      top.appendChild(el(`<div style="font-size:16px;font-weight:800;min-width:56px;color:#0f1a27">${esc(u.unit)}</div>`));
      const mid = el(`<div style="flex:1;min-width:0"></div>`);
      mid.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600">${esc(t.label)}${who ? ' · ' + esc(who.name.split(' ')[0]) : ''}</div>`));
      const doneToday = cleanedToday(u);
      // "Due" and "we have no idea" are different things, and mixing them makes the
      // whole list untrustworthy: a room nobody has ever recorded looks identical to
      // one that genuinely came round again today.
      const noRecord = !lastCleanDate(u);
      const dueLabel = doneToday ? '✓ Cleaned today'
        : noRecord ? 'No record yet — set when it was last cleaned'
        : due ? 'Due today'
        : nd ? 'Next: ' + new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        : '';
      const tone = doneToday ? '#15803d' : noRecord ? '#b45309' : due ? '#15803d' : '#5b6a7f';
      mid.appendChild(el(`<div style="font-size:11px;color:${tone};font-weight:600">${esc(dueLabel)}</div>`));
      top.appendChild(mid);
      card.appendChild(top);

      // Row 2: frequency chips (set while allocating — remembered per room)
      const freqRow = el(`<div class="su-ctl" style="border-top:none;padding-top:8px;margin-top:6px"></div>`);
      [['daily', 'Daily'], ['eod', 'Every other day'], ['weekly', 'Weekly']].forEach(([fk, lbl]) => {
        const b = el(`<button class="freqmini ${u.freq === fk ? 'on' : ''}">${lbl}</button>`);
        b.onclick = () => setUnitFreq(u.id, fk);
        freqRow.appendChild(b);
      });
      card.appendChild(freqRow);

      // Row 3: last-cleaned quick set
      const lcRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
      lcRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600">Last cleaned:${lastBase ? ' ' + new Date(lastBase + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ' —'}</div>`));
      const yb = el(`<button class="freqmini ${lastBase === yesterdayKey() ? 'on' : ''}" style="flex:0 0 auto;padding:6px 12px">Yesterday</button>`);
      yb.onclick = () => markCleanedOn(u.id, yesterdayKey());
      const tb = el(`<button class="freqmini ${lastBase === todayKey() ? 'on' : ''}" style="flex:0 0 auto;padding:6px 12px">Today</button>`);
      tb.onclick = () => setUnitLastCleaned(u.id, todayKey());
      lcRow.appendChild(yb); lcRow.appendChild(tb);
      if (u.lastCleaned) {
        const cb = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">✕</button>`);
        cb.onclick = () => setUnitLastCleaned(u.id, null);
        lcRow.appendChild(cb);
      }
      card.appendChild(lcRow);
      wrap.appendChild(card);
      cards.push({ card, tk, hay: [u.unit, u.guest, u.note, schedLabel(u)].filter(Boolean).join(' ').toLowerCase() });
    });
  });
  return wrap;
}

// A MONTH YOU CAN TAP THROUGH.
// "Plan a day" answers "what is on the 27th?" only if you already know to go looking
// for the 27th. The question the office actually asks is the shape of the week — which
// days are heavy, which are thin, what is coming — and that is a calendar, not a date
// field. Every day the schedule knows about is on one screen with its size on it; tap
// one and the round for that day opens underneath, named person by person.
let _calMonth = null;              // first of the month being shown (device-local)
let _calDay = null;                // the day whose round is open underneath
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
  + '-' + String(d.getDate()).padStart(2, '0');

// What a day holds, without laying anything out: the plan if there is one, otherwise
// what the schedule says would be due. A month of empty squares answers nothing.
function calDayInfo(day) {
  const plan = (state.plans || {})[day];
  if (plan && Object.keys(plan).length) {
    const jobs = Object.values(plan);
    return {
      planned: true,
      rooms: jobs.filter((j) => j.kind === 'unit').length,
      areas: jobs.filter((j) => j.kind !== 'unit').length,
      loose: jobs.filter((j) => !j.assignedTo).length,
      jobs,
    };
  }
  const due = (state.servicedUnits || []).filter((u) => u && !u.paused && onRollCall(u) && dueOnDay(u, day));
  return { planned: false, rooms: due.length, areas: 0, loose: due.length, jobs: null, due };
}

function viewCalendar() {
  const wrap = el('<div class="body"></div>');
  const today = workToday();
  if (!_calMonth) { const t = new Date(today + 'T00:00:00'); _calMonth = new Date(t.getFullYear(), t.getMonth(), 1); }
  const first = _calMonth;
  const monthName = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  // --- month header, with a way back and forward ---
  const head = el('<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"></div>');
  const step = (n, lbl) => {
    const b = el(`<button class="tb-btn" style="padding:8px 14px">${lbl}</button>`);
    b.onclick = () => { _calMonth = new Date(first.getFullYear(), first.getMonth() + n, 1); _calDay = null; render(); };
    return b;
  };
  head.appendChild(step(-1, '‹'));
  head.appendChild(el(`<div style="flex:1;text-align:center;font-size:17px;font-weight:800;color:#eaf1fb">${esc(monthName)}</div>`));
  head.appendChild(step(1, '›'));
  // A way back to today from three months out, without counting arrows. Lit only when
  // it would actually go somewhere.
  const onThisMonth = first.getFullYear() === new Date(today + 'T00:00:00').getFullYear()
    && first.getMonth() === new Date(today + 'T00:00:00').getMonth();
  const jump = (label, day) => {
    const b = el(`<button class="tb-btn" style="padding:8px 12px;font-size:12px;font-weight:800`
      + `${_calDay === day ? '' : ';border-color:#0284c7;color:#38bdf8'}">${label}</button>`);
    b.onclick = () => {
      const t = new Date(day + 'T00:00:00');
      _calMonth = new Date(t.getFullYear(), t.getMonth(), 1); _calDay = day; render();
    };
    return b;
  };
  head.appendChild(jump('Today', today));
  // Tomorrow is the day the office actually looks at — the round it can still change
  // before anybody works it — so it gets its own button rather than a hunt for the
  // right square.
  head.appendChild(jump('Tomorrow', shiftDay(today, 1)));
  wrap.appendChild(head);

  // --- weekday strip ---
  const dowRow = el('<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px"></div>');
  ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((d) => dowRow.appendChild(
    el(`<div style="text-align:center;font-size:10px;font-weight:800;letter-spacing:.1em;color:#5f7189">${d}</div>`)));
  wrap.appendChild(dowRow);

  // --- the grid ---
  const grid = el('<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px"></div>');
  for (let i = 0; i < first.getDay(); i += 1) grid.appendChild(el('<div></div>'));
  const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  // The heaviest day in view sets the bar, so the shape of the month is readable at a
  // glance rather than every day looking the same size.
  let peak = 1;
  for (let n = 1; n <= daysInMonth; n += 1) peak = Math.max(peak, calDayInfo(ymd(new Date(first.getFullYear(), first.getMonth(), n))).rooms);
  for (let n = 1; n <= daysInMonth; n += 1) {
    const day = ymd(new Date(first.getFullYear(), first.getMonth(), n));
    const info = calDayInfo(day);
    const isToday = day === today, past = day < today, open = day === _calDay;
    const cell = el(`<button style="display:flex;flex-direction:column;gap:4px;align-items:stretch;
      padding:8px 6px 7px;border-radius:9px;cursor:pointer;text-align:left;
      background:${open ? '#16344f' : past ? '#0e1725' : '#16233a'};
      border:1px solid ${open ? '#0284c7' : isToday ? '#38bdf8' : '#1e2f4d'};
      opacity:${past && !open ? '.55' : '1'}"></button>`);
    cell.appendChild(el(`<div style="font-size:13px;font-weight:800;color:${isToday ? '#38bdf8' : '#eaf1fb'}">${n}</div>`));
    if (info.rooms) {
      const bar = el('<div style="height:5px;background:#0b1220;border-radius:3px;overflow:hidden"></div>');
      bar.appendChild(el(`<div style="height:100%;width:${Math.round((info.rooms / peak) * 100)}%;
        background:${info.planned ? '#0284c7' : '#3d557f'}"></div>`));
      cell.appendChild(bar);
      cell.appendChild(el(`<div style="font-size:10px;font-weight:800;color:${info.loose ? '#fbbf24' : '#5f7189'}">`
        + `${info.rooms}${info.loose ? ' · ' + info.loose + ' free' : ''}</div>`));
    } else {
      cell.appendChild(el('<div style="font-size:10px;color:#3d557f">—</div>'));
    }
    cell.onclick = () => { _calDay = (_calDay === day) ? null : day; render(); };
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  wrap.appendChild(el('<div style="font-size:11px;color:#5f7189;margin:10px 0 0">'
    + 'Blue is laid out and handed round · grey is what the schedule says is due · amber is work nobody has yet.</div>'));

  // --- the day itself, underneath ---
  if (_calDay) wrap.appendChild(calDayPanel(_calDay));
  return wrap;
}

// One day, named person by person — the same answer the board gives, for any date.
function calDayPanel(day) {
  const box = el('<div style="margin-top:18px"></div>');
  const d = new Date(day + 'T00:00:00');
  const info = calDayInfo(day);
  box.appendChild(el(`<div class="section-label">${esc(d.toLocaleDateString('en-US',
    { weekday: 'long', month: 'long', day: 'numeric' }))}</div>`));

  if (!info.planned) {
    box.appendChild(el(`<div style="font-size:13px;color:#7f9abf;margin-bottom:10px">`
      + `Not laid out yet — ${info.rooms} room${info.rooms === 1 ? '' : 's'} due by the schedule.</div>`));
    if (info.due && info.due.length) {
      const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
      info.due.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }))
        .forEach((u) => chips.appendChild(el(`<span class="freqmini" style="padding:6px 10px">${esc(u.unit)}</span>`)));
      box.appendChild(chips);
    }
    const go = el(`<button class="freqmini" style="width:100%;padding:10px;margin-top:12px;border-color:#0284c7;color:#0284c7">Lay this day out →</button>`);
    go.onclick = () => { planDay = day; setTab('plan'); };
    box.appendChild(go);
    return box;
  }

  const byId = {}; (state.staff || []).forEach((p) => { byId[p.id] = p; });
  const buckets = {}; const order = [];
  info.jobs.forEach((j) => {
    const k = j.assignedTo || '__none__';
    if (!buckets[k]) { buckets[k] = []; order.push(k); }
    buckets[k].push(j);
  });
  order.sort((a, b) => (a === '__none__' ? 1 : 0) - (b === '__none__' ? 1 : 0)
    || buckets[b].length - buckets[a].length);
  order.forEach((k) => {
    const who = byId[k];
    const card = el('<div class="su-card" style="padding:11px 13px;margin-bottom:7px"></div>');
    const hd = el('<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:7px"></div>');
    // #0f1a27 is the ink of a LIGHT card. On this screen it was near-black text on a
    // near-black panel — the names were there and unreadable.
    hd.appendChild(el(`<div style="font-size:14px;font-weight:800;color:${who ? '#eaf1fb' : '#fbbf24'}">`
      + `${esc(who ? who.name : 'NOBODY YET')}</div>`));
    if (who && (who.floors || []).length) hd.appendChild(el(`<div style="font-size:11px;font-weight:700;color:#5f7189">`
      + `Floor${who.floors.length > 1 ? 's' : ''} ${who.floors.join(', ')}</div>`));
    hd.appendChild(el(`<div style="margin-left:auto;font-size:13px;font-weight:800;color:#5f7189">${buckets[k].length}</div>`));
    card.appendChild(hd);
    const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
    buckets[k].slice().sort((a, b) => (a.kind === 'unit' ? 0 : 1) - (b.kind === 'unit' ? 0 : 1)
      || String(a.label).localeCompare(String(b.label), undefined, { numeric: true }))
      .forEach((j) => chips.appendChild(el(`<span class="freqmini" style="padding:6px 10px;`
        + `${j.kind !== 'unit' ? 'border-style:dashed;' : ''}">${esc(String(j.label).replace(/^Unit /, ''))}</span>`)));
    card.appendChild(chips);
    box.appendChild(card);
  });
  const go = el(`<button class="freqmini" style="width:100%;padding:10px;margin-top:6px;border-color:#0284c7;color:#0284c7">Open this day to change it →</button>`);
  go.onclick = () => { planDay = day; setTab('plan'); };
  box.appendChild(go);
  return box;
}

// TICKING OFF IS ITS OWN SCREEN.
// The roll call is where the morning is decided: who is in, who gets what, what the
// schedule is doing, what is not due. All of it is worth reading once a day. None of it
// is worth scrolling past on the twentieth time somebody says "204 is done" — and that
// is the thing the office does all day, standing up, on a phone, one hand.
//
// So the same board, with everything else taken away: a row per job, big enough to hit,
// grouped by the cleaner it belongs to, in the same order as the wall. Same source as
// the roll call and the TV (tvColumns), so no screen can disagree with another about
// who has what.
// TODAY IS ONE SCREEN. The board is what the day looks like; the decisions that made it
// — who is in, what was not due, what is coming tomorrow — sit underneath it, folded, in
// the order they are needed. They were a separate tab, which meant the two halves of the
// same morning were in two places and neither screen was the answer on its own.
function viewToday() {
  const w = el('<div></div>');
  w.appendChild(viewTick());
  return w;
}

// EVERYTHING THAT IS NOT TODAY'S WORK.
// One list, in the order somebody would look for it: the estate, then the people, then
// the record, then the machinery. It is a sheet rather than a screen because it is
// always a detour — you came here to get somewhere, and the board is still behind it.
let _menuOpen = false;
function menuSheet() {
  const overlay = el('<div style="position:fixed;inset:0;z-index:900;background:rgba(10,18,32,0.55);'
    + 'display:flex;align-items:flex-end;justify-content:center"></div>');
  overlay.onclick = (e) => { if (e.target === overlay) { _menuOpen = false; render(); } };
  const sheet = el('<div style="width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#101c30;'
    + 'border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0))"></div>');
  sheet.appendChild(el(`<div style="display:flex;align-items:center;margin-bottom:10px">`
    + `<div style="flex:1;font-size:15px;font-weight:800;color:#eaf1fb">Everything else</div></div>`));
  const group = (label, items) => {
    sheet.appendChild(el(`<div style="font-size:10px;font-weight:800;letter-spacing:0.12em;color:#8a99ab;`
      + `margin:14px 0 6px">${esc(label)}</div>`));
    items.forEach(([tab, name, sub]) => {
      const b = el(`<button style="display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;`
        + `border:0;border-bottom:1px solid #1e2f4d;background:transparent;text-align:left;cursor:pointer">`
        + `<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;color:#eaf1fb">${esc(name)}</div>`
        + (sub ? `<div style="font-size:11px;color:#7f9abf">${esc(sub)}</div>` : '')
        + `</div><div style="color:#8a99ab;font-size:18px">›</div></button>`);
      b.onclick = () => { _menuOpen = false; setTab(tab); };
      sheet.appendChild(b);
    });
  };
  group('THE MORNING', [
    ['rollcall', 'Morning set-up', 'Attendance, hand-out, what is not due, one-off jobs, tomorrow'],
    ['calendar', 'Calendar', 'Tap through the month and see any day\u2019s round'],
    ['plan', 'Plan a day', 'Lay tomorrow out and hand it round'],
  ]);
  group('THE ESTATE', [
    ['rooms', 'Rooms & schedules', 'Add a room, change how often it is cleaned'],
    ['building', 'Floors & common areas', 'The rooftop-to-ground checklist'],
    ['exterior', 'Exterior', 'Outside areas and their frequencies'],
  ]);
  group('THE CREW', [['team', 'Team', 'Cleaners, teams, floors and the rota']]);
  group('THE RECORD', [
    ['history', 'Cleaning history', 'What was cleaned, by day'],
    ['tonight', 'Tonight’s round', 'What is still outstanding late on'],
  ]);
  group('THE MACHINERY', [['settings', 'Settings', 'Switches, kinds of room, the board itself']]);
  const built = (() => {
    try { const d = new Date(document.lastModified);
      return isNaN(d) ? '' : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  })();
  sheet.appendChild(el(`<div style="font-size:10px;color:#8a99ab;margin-top:16px;text-align:center">`
    + `66-unit building · 11 floors${built ? ' · build ' + esc(built) : ''}</div>`));
  const shut = el(`<button class="modal-skip" style="width:100%;margin-top:12px">Close</button>`);
  shut.onclick = () => { _menuOpen = false; render(); };
  sheet.appendChild(shut);
  overlay.appendChild(sheet);
  return overlay;
}

let _giveTo = null;        // whose card is showing the "give them more work" list

// MOVING A JOB ONTO A PERSON.
// On a desktop this is a drag: pick the flat up with the mouse and drop it on whoever
// cleaned it. On a phone it cannot be — a finger dragging down the screen is a scroll,
// and a page that refuses to scroll because you started on a chip is worse than no
// dragging at all. So the same gesture degrades honestly: TAP the job to pick it up,
// tap the person to put it down. One rule, two devices, and the tap works on both.
let _picked = null;        // { kind, id, label } — a job in the hand, waiting for a name

// THE THING UNDER YOUR FINGER, AND ONLY ONE OF THEM.
// The ghost used to be created by whichever chip you grabbed and removed by that same
// chip on pointerup. Re-render mid-drag — a sync landing, a tick saving — and that chip
// is rebuilt, its listeners go with it, and the ghost is left floating over the board
// for ever: 1102 stuck across Mahad Hussein's card at nine in the morning. One ghost
// now, owned by the page, cleared on every render and on any pointerup anywhere.
let _ghost = null;
function dragGhost(label) {
  if (!_ghost) {
    _ghost = el(`<div style="position:fixed;left:0;top:0;z-index:9999;pointer-events:none;`
      + `padding:9px 13px;border-radius:9px;background:#0284c7;color:#fff;font-weight:800;`
      + `font-size:14px;box-shadow:0 8px 22px rgba(0,0,0,0.45);will-change:transform"></div>`);
    document.body.appendChild(_ghost);
  }
  _ghost.textContent = label;
  return _ghost;
}
function moveGhost(x, y) {
  // transform, not left/top: the browser can move it without laying the page out again,
  // which is the difference between the chip following your hand and lagging behind it.
  if (_ghost) _ghost.style.transform = `translate3d(${x + 12}px, ${y - 16}px, 0)`;
}
function clearGhost() { if (_ghost) { _ghost.remove(); _ghost = null; } lightDrop(null); }
// WHERE THIS ROOM WILL LAND IF I LET GO. The stylesheet has carried a highlight for a
// drop target since the drag went in (.bd-col.drop, .drop-live) and nothing ever put
// the class on anything, so a drag showed you a chip floating over a board that never
// reacted to it. Letting go over the right card and letting go over the gap next to it
// looked identical, and a move that missed read as a move that was refused.
let _litDrop = null;
function lightDrop(node) {
  if (_litDrop === node) return;
  if (_litDrop) _litDrop.classList.remove('drop', 'drop-live');
  _litDrop = node || null;
  if (_litDrop) _litDrop.classList.add(_litDrop.classList.contains('bd-col') ? 'drop' : 'drop-live');
}
// The card under the pointer that can take a job, if there is one.
function dropUnder(x, y) {
  const t = document.elementFromPoint(x, y);
  return (t && t.closest && t.closest('[data-drop]')) || null;
}
window.addEventListener('pointerup', () => { setTimeout(clearGhost, 0); });
window.addEventListener('pointercancel', clearGhost);
// MOVING A ROOM IS UNDOABLE, LIKE DEALING THEM ALL IS. Auto-assign has been reversible
// from the day it went in, on the reasoning that it "sits one mis-tap away from the room
// list". Moving one room by hand is the tap people actually make, dozens of times a
// morning, and it was the one thing on the board that could not be taken back: the only
// way to put a room right was to remember who had it and move it again.
// Same snapshot, same button, so there is nothing new to learn.
function assignPicked(kind, id, pid) {
  const u = (kind === 'area') ? (state.areas || []).find((x) => x.id === id)
                              : (state.servicedUnits || []).find((x) => x.id === id);
  if (u) {
    state.lastAutoAssign = {
      at: new Date().toISOString(),
      kind: 'move',
      label: (kind === 'area') ? (u.label || 'the job') : ('Room ' + u.unit),
      who: { [id]: u.assignedTo || null },
      confirmed: (state.assignConfirmed || {})[id] ? { [id]: state.assignConfirmed[id] } : {},
    };
  }
  // Put the room down BEFORE handing it over. setUnitAssignee renders, and the hand was
  // being emptied after that render — so the board painted one frame still showing the
  // room held, and anything that re-rendered in between put it back in your hand.
  _picked = null;
  if (kind === 'area') setAreaAssign(id, pid);
  else setUnitAssignee(id, pid);
}
function dragToAssign(node, kind, id, label) {
  let from = null, moved = false;

  node.addEventListener('pointerdown', (e) => {
    from = { x: e.clientX, y: e.clientY, mouse: e.pointerType === 'mouse' };
    moved = false;
    if (from.mouse && node.setPointerCapture) node.setPointerCapture(e.pointerId);
  });
  node.addEventListener('pointermove', (e) => {
    if (!from || !from.mouse) return;                 // a finger moving is the page scrolling
    if (!moved && Math.abs(e.clientX - from.x) + Math.abs(e.clientY - from.y) < 8) return;
    moved = true;
    dragGhost(String(label));
    moveGhost(e.clientX, e.clientY);
    lightDrop(dropUnder(e.clientX, e.clientY));
    e.preventDefault();
  });
  node.addEventListener('pointerup', (e) => {
    clearGhost();
    if (moved) {
      // Whatever is under the pointer, or the nearest thing above it that accepts a job.
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const drop = t && t.closest && t.closest('[data-drop]');
      if (drop) assignPicked(kind, id, drop.getAttribute('data-drop'));
    } else {
      // A tap: pick it up, or put down the one already in hand.
      e.stopPropagation();   // a tap on a chip is about that chip, never a drop
      _picked = (_picked && _picked.id === id) ? null : { kind, id, label };
      render();
    }
    from = null; moved = false;
  });
  node.addEventListener('pointercancel', () => { clearGhost(); from = null; moved = false; });
}
// Anything that can be given a job says so, once, in one place.
function makeDropTarget(node, pid) {
  node.setAttribute('data-drop', pid);
  node.addEventListener('click', () => { if (_picked) assignPicked(_picked.kind, _picked.id, pid); });
}

// WHICH DAY THE BOARD IS SHOWING. 0 is today's live board — ticks, badge-ins, the lot.
// 1 is tomorrow's plan, which is the day the office can still change before anybody
// works it and until now meant leaving the board for the calendar to look at. Kept in a
// variable and NOT in state on purpose: it is which day this screen is pointed at, not
// something true of the building, and syncing it would swing every phone and both
// televisions to tomorrow because somebody glanced ahead on one of them.
let _boardDay = 0, _boardDayOn = null;
function setBoardDay(n) { _boardDay = n; _giveTo = null; _picked = null; render(); }
function viewTick() {
  const wrap = el('<div class="body"></div>');
  // A new work day is its own today. Left alone, a board parked on Tomorrow overnight
  // would open on the day after, which is nobody's idea of what that button means.
  if (_boardDayOn && _boardDayOn !== workToday()) _boardDay = 0;
  _boardDayOn = workToday();
  // Tomorrow is READ-ONLY. Every control on this board acts on TODAY — a tick goes to
  // today's completions, a drag calls setUnitAssignee on the room itself — so leaving
  // them live while showing another day would let somebody tick off a room tomorrow and
  // silently clean it today. Tomorrow's round is edited on Plan a Day, which is built
  // for it; here it is something to look at.
  const readOnly = _boardDay !== 0;
  const cols = readOnly ? tvColumnsForDay(shiftDay(workToday(), _boardDay)) : tvColumns();

  // ONE JOB AT A TIME, ON ITS OWN BUTTON. The offices and the guest flats are two
  // different rounds done by different people at different hours, and reading them as
  // one mixed list is how the flats became hard to navigate. A button each, and the
  // screen holds one kind of work at a time — which is also the only place a whole
  // GROUP's frequency can sensibly be changed, because a group is what you are looking at.
  const filter = state.tickFilter || 'all';
  const keep = (j) => filter === 'all' ? true : filter === 'area' ? !!j.area : (!j.area && j.kind === filter);
  const kcols = cols.map((c) => Object.assign({}, c, { jobs: c.jobs.filter(keep) }));
  // THE TALLY COUNTS THE WHOLE ROUND, whatever the board is showing. Hiding the done
  // rooms must not make the morning look like it has not been started — the counts are
  // the one thing on this screen that has to mean the same at nine as it does at six.
  const counted = countJobs(kcols);
  const all = counted.all, done = counted.done, left = all - done;
  // CLEARING THE WALL. A ticked room stays on the board all day so the morning can be
  // read off it in one look, which is right until the board is mostly ✓ and the work
  // that is LEFT is the thing you cannot find. A switch, not a rule: the rooms are still
  // there, and one tap brings them back.
  const fcols = state.hideDone
    ? kcols.map((c) => Object.assign({}, c, { jobs: c.jobs.filter((j) => !j.done) }))
    : kcols;

  // ONE SURFACE. The counts, the buttons and the close-out used to be pale controls
  // stacked above a dark board, so the screen read as two designs meeting in the middle.
  // They are part of the board and they look it.
  const grid = el('<div class="board"><div class="bd-cols"></div></div>');
  const cols_ = grid.firstChild;
  const top = el('<div style="display:flex;flex-direction:column;gap:10px"></div>');

  // The day is switched from the corner of the header, next to the sync dot — a row of
  // its own here would push the round down the screen to say something the header is
  // already saying. All this needs to add is why nothing responds to a tap.
  if (readOnly) top.appendChild(el(`<div class="bd-tally" style="color:#94a3b8">`
    + `Tomorrow's plan — nothing here can be ticked or moved. Edit it on Plan a Day.</div>`));

  {
    const kinds = [['all', 'All']];
    UNIT_TYPE_ORDER.forEach((tk) => {
      if ((state.servicedUnits || []).some((u) => !u.paused && unitType(u) === tk)) kinds.push([tk, UNIT_TYPES[tk].label]);
    });
    if (areasInterior().length) kinds.push(['area', 'Communal']);
    const seg = el('<div class="bd-bar"></div>');
    kinds.forEach(([k, lbl]) => {
      const b = el(`<button class="bd-tab ${filter === k ? 'on' : ''}">${esc(lbl)}</button>`);
      b.onclick = () => { state.tickFilter = k; _giveTo = null; save(); render(); };
      seg.appendChild(b);
    });
    top.appendChild(seg);
  }

  const tally = el('<div class="bd-tally"></div>');
  tally.appendChild(el(`<b style="color:${left ? '#fbbf24' : '#22c55e'}">${left}</b>`));
  tally.appendChild(el(`<span>left</span>`));
  tally.appendChild(el(`<span style="margin-left:auto;color:#22c55e">${done} done</span>`));
  if (done || state.hideDone) {
    const hd = el(`<button class="bd-tab ${state.hideDone ? 'on' : ''}" style="flex:0 0 auto;margin-left:10px">`
      + (state.hideDone ? `Show ${done} done` : `Hide ${done} done`) + `</button>`);
    hd.onclick = () => { state.hideDone = !state.hideDone; save(); render(); };
    tally.appendChild(hd);
  }
  top.appendChild(tally);

  // WHO THE DOOR SAW, AND WHO IT DID NOT — ON THE BOARD.
  //
  // The board named a badge-in only where somebody had a column: a leader's own time in
  // their header, an assistant's beside their leader in the "with" line. Anybody who
  // held no work that morning appeared nowhere at all, so the outside pair could badge
  // in at 07:27 and 07:39 and the board would not admit either of them existed. And
  // "who is NOT here" was never on this screen in any form — the one question you ask
  // standing in front of it at seven in the morning.
  //
  // Both halves, one strip, above the round. IN is a fact and stays quiet. NOT IN is
  // sorted by how much it should worry you: somebody rostered on with no scan is the
  // only line here that might mean a room goes uncleaned, so it is amber and first;
  // sick and no-show are known gaps; off and off-rota are nobody's problem and sit in
  // slate, the same slate their column wears.
  if (!readOnly) {
    const staffById2 = {};
    (state.staff || []).forEach((x) => { staffById2[x.id] = x; });
    const inRows = Object.keys(hikArrivals)
      .filter((id) => staffById2[id])
      .map((id) => ({ name: staffById2[id].name, time: hikArrivals[id].time, raw: hikArrivals[id].raw }))
      .concat((hikOther || []).map((o) => ({ name: o.name, time: o.time, raw: o.time })))
      .concat((hikUnknown || []).map((o) => ({ name: o.name + ' (not on roster)', time: o.time, raw: o.time })))
      .sort((a, b) => String(a.raw || '').localeCompare(String(b.raw || '')));

    // Only the cleaning crew. A building full of office staff who did not badge in is
    // not a hole in the morning, and listing them would bury the three names that are.
    const RANK = { 'NO SCAN': 0, 'SICK': 1, 'NO-SHOW': 2, 'OFF': 3, 'OFF ROTA': 4 };
    const COLOR = { 'NO SCAN': '#fbbf24', 'SICK': '#9333ea', 'NO-SHOW': '#dc2626', 'OFF': '#94a3b8', 'OFF ROTA': '#94a3b8' };
    const outRows = cleaningStaff()
      .filter((x) => !hikArrivals[x.id])
      .map((x) => {
        const st = state.attendance[x.id] || 'present';
        const why = !worksToday(x) ? 'OFF ROTA'
          : st === 'off' ? 'OFF' : st === 'sick' ? 'SICK' : st === 'noshow' ? 'NO-SHOW' : 'NO SCAN';
        return { name: x.name, why };
      })
      .sort((a, b) => (RANK[a.why] - RANK[b.why]) || String(a.name).localeCompare(String(b.name)));

    if (inRows.length || outRows.length) {
      const box = el('<div class="bd-panel"></div>');
      const chips = (label, colour, items, render) => {
        if (!items.length) return;
        const row = el(`<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px"></div>`);
        row.appendChild(el(`<div style="font-size:11px;font-weight:800;letter-spacing:0.06em;color:${colour};`
          + `flex:0 0 auto;min-width:74px">${label} ${items.length}</div>`));
        items.forEach((it) => row.appendChild(el(render(it))));
        box.appendChild(row);
      };
      chips('IN', '#22c55e', inRows, (r) => `<div style="font-size:11px;font-weight:700;color:#b7c8de;`
        + `background:#101c30;border-radius:7px;padding:4px 8px">${esc(r.name)}`
        + (r.time ? ` <span style="color:#7ea6dc">${esc(r.time)}</span>` : '') + `</div>`);
      chips('NOT IN', '#fbbf24', outRows, (r) => `<div style="font-size:11px;font-weight:700;color:#b7c8de;`
        + `background:#101c30;border-radius:7px;padding:4px 8px">${esc(r.name)}`
        + ` <span style="color:${COLOR[r.why]}">${esc(r.why)}</span></div>`);
      top.appendChild(box);
    }
  }

  // HOW OFTEN THIS KIND IS CLEANED, from the screen where you are looking at it. Offered
  // on a single kind only: "every room in the building is now weekly" is not a thing
  // anybody means to say.
  if (filter !== 'all' && filter !== 'area') {
    const group = (state.servicedUnits || []).filter((u) => !u.paused && unitType(u) === filter);
    if (group.length) {
      const box = el('<div class="bd-panel"></div>');
      const counts = {};
      group.forEach((u) => { const f = u.freq || 'daily'; counts[f] = (counts[f] || 0) + 1; });
      const now = Object.keys(counts).sort((a, b) => counts[b] - counts[a])
        .map((f) => `${counts[f]} ${FREQ_LABEL[f] || f}`).join(' · ');
      box.appendChild(el(`<div class="lbl">All ${group.length} ${esc(UNIT_TYPES[filter].label.toLowerCase())}`
        + ` — how often: ${esc(now)}</div>`));
      const row = el('<div class="bd-bar"></div>');
      [['daily', 'Daily'], ['eod', 'Every other day'], ['weekly', 'Weekly']].forEach(([fk, lbl]) => {
        const b = el(`<button class="bd-tab">${lbl}</button>`);
        b.onclick = () => setUnitsFreqBulk(group.map((u) => u.id), fk, 'every ' + UNIT_TYPES[filter].label.toLowerCase());
        row.appendChild(b);
      });
      box.appendChild(row);
      top.appendChild(box);
    }
  }

  // CLOSING THE WHOLE ROUND OUT, on the screen where the round is ticked.
  if (filter === 'all') {
    const out = rollCallOutstanding();
    const openRooms = out.rooms.filter((u) => u.assignedTo);
    const loose = out.rooms.length - openRooms.length;
    if (openRooms.length + out.areas.length) {
      const allBtn = el(`<button class="bd-close">${esc(markAllLabel(openRooms.length, out.areas.length))}</button>`);
      allBtn.onclick = () => markRollCallAllDone();
      top.appendChild(allBtn);
      if (loose) top.appendChild(el(`<div class="lbl" style="color:#fbbf24">`
        + `${loose} more nobody has been given.</div>`));
    }
  }
  // A CAP THAT IS BREACHED IN SILENCE IS NOT A CAP. The overnight plan can name more
  // rooms against somebody than a leader's round allows; the carry stops at the round
  // and leaves the rest unhanded, and this is where it says so. Without it the morning
  // simply looks short of a few rooms and nobody knows why.
  {
    const cb = state.lastCapBreach;
    if (cb && cb.day === todayKey() && (cb.over || []).length) {
      const who = cb.over.map((x) => x.name.split(' ')[0] + ' +' + x.n).join(', ');
      const n = cb.over.reduce((t, x) => t + x.n, 0);
      top.appendChild(el(`<div class="lbl" style="color:#fbbf24;font-weight:700">`
        + `⚠ Last night's plan went over the ${cb.cap}-room round: ${esc(who)}. `
        + `${n} room${n === 1 ? '' : 's'} left unhanded for whoever has space.</div>`));
    }
  }
  // ...and when the morning has taken work off somebody to even the round up, it says
  // that too. A board that rearranges itself in silence is one nobody trusts.
  {
    const rb = state.lastRebalance;
    if (rb && rb.day === todayKey() && (rb.moves || []).length) {
      const m = rb.moves.map((x) => x.unit + ' → ' + String(x.to).split(' ')[0]).join(', ');
      top.appendChild(el(`<div class="lbl" style="color:#7ea6dc;font-weight:700">`
        + `⚖ Round was ${rb.gapBefore} apart — moved ${esc(m)}.</div>`));
    }
  }
  grid.insertBefore(top, cols_);

  if (!all) {
    cols_.appendChild(el(`<div style="grid-column:1/-1;text-align:center;padding:28px 0;color:#86efac;font-weight:800">`
      + `✓ Nothing on today.</div>`));
    wrap.appendChild(grid);
    return wrap;
  }

  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const areaById = {};
  (state.areas || []).forEach((a) => { areaById[a.id] = a; });

  fcols.forEach((c) => {
    const giving = _giveTo === c.key;
    // A PERSON HOLDING NOTHING IS THE ONE YOU MOST NEED TO SEE. This dropped every empty
    // column — "nothing to tick is nothing to show here" — which is true of ticking and
    // false of everything else this screen is for. The wall keeps them (sorted last, so an
    // empty column never leads), the office screen did not, and the same morning therefore
    // looked different on the TV and on the laptop standing next to it.
    //
    // Worse than cosmetic: giving somebody work goes through their own column's "Give X
    // more work" button, so a person holding nothing had no column and could not be given
    // anything — the one person on the board with room to take it. Ahmed Daahir is offsite
    // today with the offsite job sitting unassigned two feet away in NOBODY YET.
    //
    // An empty NOBODY YET still goes: no work with nobody behind it IS nothing to show.
    if (!c.jobs.length && !giving && c.none) return;
    const col = el(`<div class="bd-col${c.none ? ' none' : ''}${c.out ? ' out' : ''}`
      + `${c.status === 'off' ? ' off' : ''}`
      + `${c.none && c.jobs.length > 8 ? ' wide3' : c.none && c.jobs.length > 3 ? ' wide2' : ''}${_picked ? ' drop' : ''}"></div>`);
    // NOBODY YET TAKES A DROP TOO. Dragging only ever went one way: a room could be put
    // ON somebody and never taken back off, so correcting a hand-out meant finding the
    // room in a list somewhere and using a different control entirely. The box the
    // unhanded work sits in is the obvious place to drop work you are taking back, and
    // it was the one column on the board that refused. An empty target means "no
    // cleaner", which is what setUnitAssignee already does with a blank id.
    if (!readOnly) makeDropTarget(col, c.none ? '' : c.key);

    const hd = el('<div class="bd-hd"></div>');
    const whoEl = el(`<div class="bd-who" style="${c.none ? '' : 'cursor:pointer'}">${esc(c.none ? 'NOBODY YET' : c.name)}</div>`);
    // TAP THE NAME TO GIVE THEM WORK. The button below says so in words for anybody who
    // has not found that out yet; the name is where the thumb goes first.
    if (!c.none && !readOnly) whoEl.onclick = (e) => {
      if (_picked) return;                       // the column is already a place to drop
      e.stopPropagation();
      _giveTo = (_giveTo === c.key) ? null : c.key;
      render();
    };
    hd.appendChild(whoEl);
    const cDone = c.jobs.filter((j) => j.done).length;
    hd.appendChild(el(`<div class="bd-count">${cDone}/${c.jobs.length}</div>`));
    const sub = [c.team || '', c.with || ''].filter(Boolean).join(' · ');
    if (sub) hd.appendChild(el(`<div class="bd-sub">${sub}</div>`));
    if (c.at || c.left) hd.appendChild(el(`<div class="bd-at" style="width:100%">`
      + (c.at ? 'IN ' + esc(c.at) : '')
      + (c.at && c.left ? ' · ' : '')
      + (c.left ? 'OUT ' + esc(c.left) : '') + `</div>`));
    // "NO SCAN YET" AT SOMEBODY WHO IS NOT COMING IS A LIE. It reads as "still on
    // their way" and it was shown to every away person, off included — so a cleaner
    // the office had already marked off looked merely late all morning. Say what
    // they are instead.
    else if (c.out) hd.appendChild(el(`<div class="bd-at none" style="width:100%">`
      + esc((STATUS[c.status] || {}).label || 'AWAY') + `</div>`));
    else if (!c.none && !readOnly) hd.appendChild(el(`<div class="bd-at none" style="width:100%">NO SCAN YET</div>`));
    col.appendChild(hd);

    // Rooms, then the communal walks — the order the board has always used, and the
    // order the work is done in. Headed only when there are both, because a heading
    // over a single list is noise.
    const rooms = c.jobs.filter((j) => !j.area);
    const areas = c.jobs.filter((j) => j.area);
    const put = (list, label) => {
      if (!list.length) return;
      if (rooms.length && areas.length) col.appendChild(el(`<div class="bd-grp">${esc(label)}</div>`));
      const row = el('<div class="bd-jobs"></div>');
      list.forEach((j) => {
        const u = j.area ? null : unitById[j.id];
        const a = j.area ? areaById[j.id] : null;
        if (!u && !a) return;
        const held = _picked && _picked.id === j.id;
        const cls = j.done ? 'done' : j.early ? 'early' : j.air ? 'air' : j.area ? 'area' : '';
        const kind = j.area ? 'area' : 'unit';
        const chip = el(`<div class="bd-job ${cls}${held ? ' held' : ''}"></div>`);

        // THE LABEL IS THE TICK. Twenty times a day, one tap, no thought.
        const lbl = el(`<button class="bd-lbl" style="touch-action:manipulation">`
          + `${j.early && !j.done ? '🌅 ' : ''}${esc(j.label)}${j.done ? ' ✓' : ''}</button>`);
        // ...unless the tap was the end of a drag. Letting go of a room over somebody
        // else's column fires a click on the label on the way out, and the room you just
        // moved would tick itself off as done. Swallow exactly that one click.
        let swallowClick = false;
        lbl.onclick = () => {
          if (readOnly) return;                     // another day's board is not today's work
          if (swallowClick) { swallowClick = false; return; }
          if (_picked && _picked.id === j.id) { _picked = null; render(); return; }
          if (j.area) toggleAreaDone(a.id); else toggleServicedDone(u.id);
        };
        chip.appendChild(lbl);

        // THE GRIP IS THE MOVE. Drag it with a mouse, or tap it and then tap whoever
        // should have the room — a finger dragging down a screen is the page scrolling,
        // so touch gets the two-tap version of the same gesture.
        const grip = el(`<button class="bd-grip" title="Drag to move, or tap then tap a person"`
