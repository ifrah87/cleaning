// the rota where the morning reads the door — otherwise the rules are the same ones:
// the times customers asked for come first and get spread, then load, then don't give
// somebody the room they cleaned last time, and finally even out whatever is lopsided.
//
// Communal areas are left alone on purpose, as auto-assign leaves them alone: an area
// is a walk of the building rather than a room on a count, and who does it is a call
// for the morning.
function autoPlanDay(day) {
  const plan = getPlan(day);
  // Marked sick or off is a statement about today, so it only overrides the rota
  // for today — a rota says who is expected next Thursday, not who is ill now.
  const crew = cleaningStaff().filter((p) => worksOnDay(p, day) && !(day === todayKey() && isAway(p.id)))
    .slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (!crew.length) return { assigned: 0, crew: 0, reason: 'nobody is rostered on' };
  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const keys = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && unitById[plan[k].refId]);
  if (!keys.length) return { assigned: 0, crew: crew.length, reason: 'nothing on the plan' };

  const order = crew.map((p) => p.id);
  const staffById = {};
  crew.forEach((p) => { staffById[p.id] = p; });
  const load = {}, slotLoad = { early: {}, late: {} };
  order.forEach((id) => { load[id] = 0; slotLoad.early[id] = 0; slotLoad.late[id] = 0; });
  const roomOf = (k) => unitById[plan[k].refId];
  // The same leader rules the morning hand-out works to — a plan that ignored them
  // would simply hand the breach to the morning to discover.
  const LEADER_ROOMS = 4, LEADER_EARLY = 2;
  const isLeader = (id) => !!(staffById[id] && staffById[id].isLeader);
  const underCap = (id) => (load[id] || 0) < (isLeader(id) ? LEADER_ROOMS : Infinity);
  const ableFor = (u) => {
    const all = order.filter((id) => canCleanUnit(staffById[id], u));
    const spare = all.filter(underCap);
    return spare.length ? spare : all;
  };
  const repeats = (id, u) => (u.lastCleanedBy && id === u.lastCleanedBy) ? 1 : 0;

  keys.forEach((k) => { plan[k].assignedTo = null; });
  const deal = (slot) => {
    keys.filter((k) => !plan[k].assignedTo && (slot ? timeSlot(roomOf(k)) === slot : true)).forEach((k) => {
      const u = roomOf(k);
      const owed = (id) => (slot === 'early' && isLeader(id) && slotLoad.early[id] < LEADER_EARLY) ? 0 : 1;
      const pick = ableFor(u).slice().sort((a, b) =>
        (owed(a) - owed(b))
        || (slot ? slotLoad[slot][a] - slotLoad[slot][b] : 0)
        || (load[a] - load[b])
        || (repeats(a, u) - repeats(b, u))
        || (order.indexOf(a) - order.indexOf(b)))[0];
      if (!pick) return;                               // nobody rostered on is cleared for it
      plan[k].assignedTo = pick; load[pick] += 1;
      if (slot) slotLoad[slot][pick] += 1;
    });
  };
  deal('early'); deal('late'); deal(null);
  // Communal areas go out too. They were left for the morning to decide, which in
  // practice meant nobody was named on them and they got missed. No clearance test:
  // an area is a walk of the building, not a kind of room somebody is signed off on.
  const areaKeys = Object.keys(plan).filter((k) => plan[k].kind !== 'unit');
  areaKeys.forEach((k) => { plan[k].assignedTo = null; });
  areaKeys.forEach((k) => {
    const pick = order.slice().sort((a, b) => (load[a] - load[b]) || (order.indexOf(a) - order.indexOf(b)))[0];
    if (!pick) return;
    plan[k].assignedTo = pick; load[pick] += 1;
  });

  // Even it out, exactly as the morning does. A room the customer asked a time for
  // stays where it is; that was their decision, not a balancing one.
  const movable = (k) => timeSlot(roomOf(k)) === 'any';
  for (let guard = keys.length * 4; guard > 0; guard -= 1) {
    const ranked = order.slice().sort((a, b) => load[a] - load[b]);
    const hi = ranked[ranked.length - 1];
    if (load[hi] - load[ranked[0]] <= 1) break;
    let done = false;
    for (const lo of ranked) {
      if (load[hi] - load[lo] <= 1) break;
      const cands = keys.filter((k) => plan[k].assignedTo === hi && movable(k) && canCleanUnit(staffById[lo], roomOf(k)));
      const move = cands.find((k) => !repeats(lo, roomOf(k))) || cands[0];
      if (!move) continue;
      plan[move].assignedTo = lo; load[hi] -= 1; load[lo] += 1; done = true; break;
    }
    if (!done) break;
  }
  save();
  return { assigned: keys.filter((k) => plan[k].assignedTo).length, crew: crew.length };
}

// Seed a day once, the first time it's looked at. Recorded per day so that
// clearing a plan on purpose stays cleared instead of springing back on re-render.
// The hand-out goes in at the same time: a plan nobody is named on is half a plan,
// and the whole point is that tomorrow is already laid out without being asked.
function seedPlanOnce(day) {
  if (!state.planSeeded) state.planSeeded = {};
  if (state.planSeeded[day]) return 0;
  state.planSeeded[day] = true;
  const added = applySuggestions(day, planningJobsFor(day));
  // Today is the morning's business — the door reader decides who is actually in,
  // and overwriting that from a rota would undo real hand-outs.
  if (day !== todayKey() && added) autoPlanDay(day);
  save();
  return added;
}
// Build a day again from scratch. A day is seeded once and then left alone, which is
// right for a plan somebody has edited — but it also means a day built under an older
// idea of what was due keeps that list for good. Anything already opened before the
// every-other-day fix still carries the full room list, and no amount of re-opening
// will correct it. This re-syncs the rooms to what the schedule now says and hands
// them out again.
function rebuildPlanDay(day) {
  const plan = getPlan(day);
  const want = planningJobsFor(day);
  const wantKeys = new Set(want.map((s) => planKey(s.kind, s.id)));
  let removed = 0;
  Object.keys(plan).forEach((k) => {
    // Only rooms are re-synced. A communal area put on a day by hand was somebody's
    // decision, and the schedule has no opinion to overrule it with.
    if (plan[k].kind !== 'unit') return;
    if (!wantKeys.has(k)) { delete plan[k]; removed += 1; }
  });
  const added = applySuggestions(day, want);
  const dealt = (day === todayKey()) ? { assigned: 0 } : autoPlanDay(day);
  save();
  return { added, removed, assigned: dealt.assigned || 0 };
}

// Break a clump of same-frequency rooms into equal groups, one group starting each
// day of the cycle. Eleven every-other-day rooms that all fall due together give
// 23 rooms one day and 12 the next; split five and six across two days and every day
// is about 17. Only ever holds a room back — a clean is never pulled forward — and
// the hold lapses as soon as the room is done, so the new rhythm carries itself.
function staggerFrequencyGroup(freqKeyName, dryRun) {
  const start = workToday();
  const rooms = (state.servicedUnits || [])
    .filter((u) => onRollCall(u) && !u.paused && (u.freq || 'daily') === freqKeyName && unitDueToday(u))
    .slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const span = FREQ_DAYS[freqKeyName] || 1;
  if (rooms.length < 2 || span < 2) return { moved: 0, groups: [] };
  const groups = [];
  for (let g = 0; g < span; g += 1) groups.push([]);
  rooms.forEach((u, i) => groups[i % span].push(u));
  let moved = 0;
  groups.forEach((grp, g) => {
    const day = shiftDay(start, g);
    grp.forEach((u) => {
      if (g === 0) {
        if (!dryRun) { delete u.holdUntil; delete u.alsoCleanOn; }   // first group is due today as normal
        return;
      }
      // Every group after the first gets an extra clean on its day. They are all due
      // today too, so those rooms are cleaned twice inside the cycle — once now, once
      // on their new day — and come out of it landing on the opposite day for good.
      if (!dryRun) { u.alsoCleanOn = day; delete u.holdUntil; }
      moved += 1;
    });
  });
  if (!dryRun) { save(); render(); }
  return { moved, groups: groups.map((grp, g) => ({ day: shiftDay(start, g), units: grp.map((u) => u.unit) })) };
}

// ============================================================
// TOMORROW, WITHOUT BEING ASKED
// The Plan tab lays a day out the moment somebody opens it. That is too late to
// be useful: if nobody opens it, tomorrow does not exist until tomorrow. This
// builds it on app open instead, and — because a day was only ever laid out once,
// then left alone for good — brings it back in line every time it is looked at,
// so a plan drawn up this morning still matches what the schedule says tonight.
// ============================================================
function ensureDayPlanned(day) {
  if (!state.planSeeded) state.planSeeded = {};
  if (!state.planSeeded[day]) return { day, seeded: seedPlanOnce(day), added: 0, removed: 0, assigned: 0 };
  return { day, seeded: 0, ...resyncPlanDay(day) };
}
function ensureTomorrowPlanned() { return ensureDayPlanned(tomorrowKey()); }

// TODAY, which the week-ahead loop skips because it starts at tomorrow. Today's plan
// was drawn up days ago from a projection that assumes every day gets done. Clean a
// room by hand, backdate one, change a frequency, add a room — and the schedule now
// says something is due today that the frozen plan never listed. The plan IS the roll
// call, and the carry-forward only rescues rooms that were on an EARLIER day's plan,
// so a room in that gap appears nowhere at all and is quietly skipped. Every-other-day
// rooms are the ones this catches: a daily room is on every plan, so it cannot fall
// down the gap. Add-only — today never loses a room this way.
function topUpTodayPlan() { return resyncPlanDay(workToday(), true); }

// The whole week, not just tomorrow. Tomorrow laid itself out and the rest of the
// week waited to be asked, so Thursday only existed once somebody went to Thursday.
// Every day ahead is laid out and handed round when the app opens, and kept in line
// after that — the same rules as tomorrow, so an edit is never undone: an existing
// hand-out stays, an area put on a day by hand stays, a job taken off stays off.
function ensureWeekPlanned(nDays) {
  const span = nDays || PLAN_AHEAD_DAYS;
  let jobs = 0, assigned = 0, days = 0;
  // FROM TODAY, NOT FROM TOMORROW. Every day ahead was laid out and today was skipped,
  // so today was the one day that never had a plan at all: Plan a Day showed an empty
  // screen for it while Roll Call showed twenty-two rooms, and the roll call carried a
  // standing warning that there was no plan for today and it was falling back to the
  // raw schedule. topUpTodayPlan could not rescue it either — it re-syncs an existing
  // plan, and bails on an empty one so that a day cleared on purpose stays cleared.
  // Seeding today is safe: seedPlanOnce deliberately does not hand today's rooms round
  // from the rota, because the door reader decides who is actually in.
  for (let i = 0; i <= span; i += 1) {
    const r = ensureDayPlanned(shiftDay(workToday(), i));
    const n = (r.seeded || 0) + (r.added || 0);
    if (n || r.assigned) days += 1;
    jobs += n; assigned += (r.assigned || 0);
  }
  return { jobs, assigned, days, span };
}

// ============================================================
// PLAN THE WEEK AHEAD — one button
// Getting a week ready meant levelling the fortnight, then opening each day in
// turn so it would lay itself out, then checking each was handed round. That is
// four or five taps and knowing which order they go in. This is the whole thing:
// level the days if they are lopsided, lay every day out from the schedule, hand
// each one to whoever is rostered on it.
// ============================================================
const PLAN_AHEAD_DAYS = 7;

// What one tap would do, worked out without changing anything.
function planAheadPreview(nDays) {
  const span = nDays || PLAN_AHEAD_DAYS;
  const lp = levelPlan(LEVEL_HORIZON);
  const worthLevelling = lp.moves.length > 0 && (lp.settledBefore - lp.settledAfter) >= 2;
  let toPlan = 0, days = 0;
  for (let i = 1; i <= span; i += 1) {
    const day = shiftDay(workToday(), i);
    const already = Object.keys(getPlan(day)).length;
    const want = planningJobsFor(day).length;
    if (want > already) toPlan += want - already;
    if (want || already) days += 1;
  }
  return { span, lp, worthLevelling, toPlan, days };
}

function runPlanAhead(nDays, doLevel) {
  const span = nDays || PLAN_AHEAD_DAYS;
  // Levelling first: it changes which rooms fall on which day, and laying the days
  // out before that would plan the days it is about to move.
  if (doLevel) applyLevelPlan(levelPlan(LEVEL_HORIZON));
  let jobs = 0, assigned = 0;
  for (let i = 1; i <= span; i += 1) {
    const r = ensureDayPlanned(shiftDay(workToday(), i));
    jobs += (r.seeded || 0) + (r.added || 0);
    assigned += (r.assigned || 0);
  }
  save();
  return { jobs, assigned, span };
}

// Level the days without being asked. Waiting to be asked meant the every-other-day
// rooms went on stacking onto one morning until somebody noticed the chart and went
// looking for the button — which is the same as not having it. Governed by the
// existing "Keep the week level" setting, and only when it is genuinely lopsided:
// a room or two of difference is just how they fall and is not worth an extra clean.
function autoLevelIfLopsided() {
  if (state.autoBalance === false) return { moves: 0 };
  if (state.autoLevelledOn === todayKey()) return { moves: 0 };   // once a day is plenty
  const lp = levelPlan(LEVEL_HORIZON);
  if (!lp.moves.length || (lp.settledBefore - lp.settledAfter) < 2) return { moves: 0 };
  state.autoLevelledOn = todayKey();
  // Kept so the week-ahead panel can say what happened. Levelling changes the shape
  // of the fortnight on its own, and a change nobody can see is one nobody trusts.
  state.lastAutoLevel = {
    day: todayKey(),
    moves: lp.moves.length,
    extras: lp.moves.filter((m) => m.kind === 'extra').length,
    from: lp.settledBefore,
    to: lp.settledAfter,
  };
  applyLevelPlan(lp);
  return { moves: lp.moves.length };
}

// Plan tomorrow, in one press, and land on it ready to be edited. Tomorrow lays
// itself out when the app opens, but there was no way to simply ASK for it — you had
// to know that, trust it, and go looking. This is the asking.
//
// It never wipes an edit: anything already on the day stays, anything already handed
// out keeps its cleaner. To start the day over there is "Rebuild this day" below.
function planTomorrow() {
  const day = tomorrowKey();
  ensureDayPlanned(day);
  const plan = getPlan(day);
  const loose = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && !plan[k].assignedTo);
  if (loose.length) assignNewPlanJobs(day, loose);
  save();
  planDay = day;                       // land on it, so the next tap is an edit
  const rooms = Object.values(plan).filter((v) => v.kind === 'unit');
  const named = rooms.filter((v) => v.assignedTo).length;
  hikSyncMsg = rooms.length
    ? { text: 'Tomorrow is planned — ' + rooms.length + ' room' + (rooms.length === 1 ? '' : 's') + ', '
        + named + ' handed out. Change anything below.' }
    : { err: true, text: 'Nothing is due tomorrow. Add a job below if something needs doing.' };
  render();
}

function planAhead() {
  const pv = planAheadPreview(PLAN_AHEAD_DAYS);
  const bits = [];
  if (pv.worthLevelling) {
    const extras = pv.lp.moves.filter((m) => m.kind === 'extra').length;
    bits.push('Evens the days out — the heaviest goes from ' + pv.lp.settledBefore + ' rooms to '
      + pv.lp.settledAfter + ', by spreading ' + pv.lp.moves.length + ' across the cycle'
      + (extras ? ' (' + extras + ' get one extra clean to break up the clump)' : '')
      + '. Nothing waits longer than its frequency.');
  }
  bits.push('Lays out the next ' + pv.span + ' days'
    + (pv.toPlan ? ' — about ' + pv.toPlan + ' more job' + (pv.toPlan === 1 ? '' : 's') : '')
    + ', handed to whoever is rostered on. Anything already handed out stays.');
  showConfirm(
    'Get the next ' + pv.span + ' days ready?',
    bits.join(' '),
    () => {
      const r = runPlanAhead(PLAN_AHEAD_DAYS, pv.worthLevelling);
      hikSyncMsg = { text: 'Next ' + r.span + ' days are ready — ' + r.jobs + ' job'
        + (r.jobs === 1 ? '' : 's') + ' laid out, ' + r.assigned + ' handed round.' };
      render();
    },
    'Get them ready',
    'safe'
  );
}

// Bring a already-laid-out day back in line with what the schedule now says, without
// undoing anybody's decisions. A room that has become due is added and handed to
// whoever is carrying least; a room that is no longer due is dropped only if the
// schedule was what put it there and nobody has been given it. Assignments already
// made are never shuffled — that is the difference between this and a rebuild.
// addOnly: for TODAY. A day still to come can have rooms taken back off it when the
// schedule moves, but today is being worked — a room already cleaned drops out of
// "what's due", and pruning against that would delete the morning's finished work off
// the board. Today only ever gains rooms.
function resyncPlanDay(day, addOnly) {
  const plan = getPlan(day);
  // Emptied on purpose ("Clear this day's plan") — an automatic refill would
  // override a deliberate act, so a cleared day stays cleared.
  if (!Object.keys(plan).length) return { added: 0, removed: 0, assigned: 0 };

  const want = planningJobsFor(day);
  const wantKeys = new Set(want.map((j) => planKey(j.kind, j.id)));
  let removed = 0;
  if (!addOnly) Object.keys(plan).forEach((k) => {
    if (plan[k].kind !== 'unit') return;        // an area on a day was somebody's call
    if (wantKeys.has(k)) return;                // still due on this day — it stays
    if (!plan[k].auto) return;                  // somebody put this room on the day by hand
    // A NAME ON A ROOM IS NOT A REASON TO KEEP IT. This used to skip anything with an
    // assignee at all, and seeding a future day hands every room out immediately — so
    // every auto-added room had a name from the moment it existed and could never be
    // removed again. Clean an every-other-day room today and its next due moves past
    // tomorrow, the re-sync correctly drops it from what is wanted, and then refused
    // to delete it: 701 and 704 sat on today AND tomorrow, and the day's own warning
    // ("on both days without being daily") was the app noticing its own bug.
    // Only a hand-out somebody actually made is protected now. Rooms dealt by the
    // machine have no such claim, and jobs from before this flag existed carry no
    // mark — which is what lets the days already wrong put themselves right.
    if (plan[k].byHand) return;
    delete plan[k]; removed += 1;
  });

  const dropped = droppedFor(day);
  const added = [];
  want.forEach((j) => {
    const k = planKey(j.kind, j.id);
    if (plan[k] || (dropped && dropped[k])) return;   // already there, or taken off by hand
    plan[k] = { kind: j.kind, refId: j.id, label: j.label, assignedTo: null, auto: true };
    added.push(k);
  });

  const assigned = assignNewPlanJobs(day, added);
  if (removed || added.length) save();
  return { added: added.length, removed, assigned };
}

// Hand out only the jobs just added, fitting them around what is already dealt.
// autoPlanDay deals the whole day from scratch and would wipe existing hand-outs.
function assignNewPlanJobs(day, keys, skip) {
  const plan = getPlan(day);
  const roomKeys = keys.filter((k) => plan[k] && plan[k].kind === 'unit');
  if (!keys.some((k) => plan[k])) return 0;
  // skip = whoever cannot take work today, so somebody off sick does not get handed
  // their own rooms straight back.
  const out = skip instanceof Set ? skip : new Set(skip ? [skip] : []);
  const crew = cleaningStaff().filter((p) => worksOnDay(p, day) && !out.has(p.id)
      && !(day === todayKey() && isAway(p.id)))
    .slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (!crew.length) return 0;

  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const staffById = {}, load = {};
  const slotLoad = { early: {}, late: {} };
  crew.forEach((p) => { staffById[p.id] = p; load[p.id] = 0; slotLoad.early[p.id] = 0; slotLoad.late[p.id] = 0; });
  // Count what each of them is already carrying, so the new work lands on whoever
  // has the least rather than on top of the person who is already fullest. Counted
  // per time slot as well as overall: an even total is no use if one person is
  // holding every room the customer asked for first thing.
  Object.keys(plan).forEach((k) => {
    const who = plan[k].assignedTo;
    if (!who || load[who] === undefined) return;
    load[who] += 1;
    const u = plan[k].kind === 'unit' ? unitById[plan[k].refId] : null;
    const slot = u ? timeSlot(u) : 'any';
    if (slot !== 'any') slotLoad[slot][who] += 1;
  });

  // Asked-for times go out first and are spread on their own count, exactly as the
  // morning deals them — otherwise the early rooms stack on whoever happens to be
  // lightest overall and one person carries the whole first hour.
  const order = crew.map((p) => p.id);
  const give = (k) => {
    const u = unitById[plan[k].refId];
    if (!u) return false;
    const slot = timeSlot(u);
    const pick = order
      .filter((id) => canCleanUnit(staffById[id], u))
      .sort((a, b) => (slot !== 'any' ? slotLoad[slot][a] - slotLoad[slot][b] : 0)
        || (load[a] - load[b])
        || ((u.lastCleanedBy === a ? 1 : 0) - (u.lastCleanedBy === b ? 1 : 0))
        || (order.indexOf(a) - order.indexOf(b)))[0];
    if (!pick) return false;                    // nobody rostered on is cleared for it
    plan[k].assignedTo = pick; load[pick] += 1;
    if (slot !== 'any') slotLoad[slot][pick] += 1;
    return true;
  };
  let n = 0;
  const inSlot = (s) => roomKeys.filter((k) => unitById[plan[k].refId] && timeSlot(unitById[plan[k].refId]) === s);
  [...inSlot('early'), ...inSlot('late'), ...inSlot('any')].forEach((k) => { if (give(k)) n += 1; });
  // Communal areas as well — see autoPlanDay. Balanced on the same count, so a walk
  // of the building counts against the person doing it.
  keys.filter((k) => plan[k] && plan[k].kind !== 'unit' && !plan[k].assignedTo).forEach((k) => {
    const pick = order.slice().sort((a, b) => (load[a] - load[b]) || (order.indexOf(a) - order.indexOf(b)))[0];
    if (!pick) return;
    plan[k].assignedTo = pick; load[pick] += 1; n += 1;
  });
  return n;
}

// ============================================================
// DRAG A ROOM ONTO SOMEBODY ELSE
// Tapping a room and picking from a list is fine for one room. Shuffling a
// morning around — which is what happens when somebody is late or ill — is faster
// with your thumb: hold a room, drag it onto whoever should have it, let go.
// Pointer events rather than HTML5 drag-and-drop, which does not exist on touch.
// The hold is what separates a drag from a tap, so both still work.
// ============================================================
const DRAG_HOLD_MS = 300;
let _movePick = null;   // {day, key} while "move this to…" is open

// Hold a room to move it. Dragging it onto somebody was worse than it sounds: on a
// phone the list scrolls under your thumb, the target sits beneath your hand where
// you cannot see it, and a miss puts the room somewhere you did not intend. Same
// gesture, but it opens a list of names instead of asking you to aim.
function makeRoomDraggable(chipEl, day, key, label, isSpare) {
  let timer = null, startX = 0, startY = 0, moved = false, held = false;

  chipEl.addEventListener('pointerdown', (e) => {
    if (e.button != null && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY; moved = false; held = false;
    timer = setTimeout(() => {
      held = true;
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
      _movePick = { day, key };
      render();
    }, DRAG_HOLD_MS);
  });
  // Moving means the page is being scrolled, not that a room is being picked up.
  chipEl.addEventListener('pointermove', (e) => {
    if (held) return;
    if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) {
      moved = true; clearTimeout(timer); timer = null;
    }
  });
  const stop = () => { clearTimeout(timer); timer = null; };
  chipEl.addEventListener('pointerup', stop);
  chipEl.addEventListener('pointercancel', stop);

  // On today, a tap ticks the job off — planning today and working today are the
  // same thing. On a day ahead there is nothing to tick, so a tap takes the room
  // off that person. The ✕ or ✓ on the chip says which it will be.
  chipEl.addEventListener('click', (e) => {
    if (moved || held) { e.preventDefault(); e.stopPropagation(); return; }
    if (day === todayKey() || day === workToday()) {
      const j = getPlan(day)[key];
      if (!j) return;
      if (j.kind === 'unit') toggleServicedDone(j.refId); else toggleAreaDone(j.refId);
      return;
    }
    if (isSpare) return;
    setPlanAssignee(day, key, '');
  });
}

// The sheet the hold opens: who should have this one instead.
function moveJobSheet(day) {
  if (!_movePick || _movePick.day !== day) return null;
  const plan = getPlan(day);
  const j = plan[_movePick.key];
  if (!j) { _movePick = null; return null; }
  const isToday = day === todayKey() || day === workToday();
  const arrived = new Set(Object.keys(hikArrivals));
  const load = {};
  Object.values(plan).forEach((v) => { if (v.assignedTo) load[v.assignedTo] = (load[v.assignedTo] || 0) + 1; });

  const overlay = el('<div class="modal-overlay"></div>');
  const modal = el('<div class="modal"></div>');
  modal.appendChild(el(`<div class="modal-title">Move ${esc(String(j.label).replace(/^Unit\s+/, ''))}</div>`));
  modal.appendChild(el(`<div class="modal-sub">Who should have it?</div>`));
  const picker = el('<div class="cover-picker"></div>');
  cleaningStaff().slice()
    .sort((a, b) => (isToday ? (arrived.has(b.id) ? 1 : 0) - (arrived.has(a.id) ? 1 : 0) : 0)
      || ((load[a.id] || 0) - (load[b.id] || 0))
      || String(a.name).localeCompare(String(b.name)))
    .forEach((p) => {
      const n = load[p.id] || 0;
      const b = el(`<button class="cover-pick${j.assignedTo === p.id ? ' on' : ''}">`
        + `<span>${isToday && arrived.has(p.id) ? '✓ ' : ''}${esc(p.name)}</span>`
        + `<span class="cover-load">${n} room${n === 1 ? '' : 's'}</span></button>`);
      b.onclick = () => { const k = _movePick.key; _movePick = null; setPlanAssignee(day, k, p.id); };
      picker.appendChild(b);
    });
  modal.appendChild(picker);
  const row = el('<div class="modal-btns"></div>');
  const pool = el('<button class="modal-skip">Nobody yet</button>');
  pool.onclick = () => { const k = _movePick.key; _movePick = null; setPlanAssignee(day, k, ''); };
  const off = el('<button class="modal-confirm" style="background:#b45309">Take it off this day</button>');
  off.onclick = () => { _movePick = null; togglePlanJob(day, j.kind, j.refId, j.label); };
  row.appendChild(pool); row.appendChild(off);
  modal.appendChild(row);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) { _movePick = null; render(); } };
  return overlay;
}

// Somebody is off. Take their rooms back and deal them round whoever is left,
// rather than making the office move them one at a time — which is the moment the
// plan gets abandoned and the morning is improvised instead.
function sharePersonsRoomsOut(day, personId) {
  const plan = getPlan(day);
  const theirs = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && plan[k].assignedTo === personId);
  if (!theirs.length) return { moved: 0, stranded: 0 };
  theirs.forEach((k) => { plan[k].assignedTo = null; });
  const dealt = assignNewPlanJobs(day, theirs, personId);
  mirrorPlanToBoard(day);
  save();
  return { moved: dealt, stranded: theirs.length - dealt };
}

function getPlan(day) { if (!state.plans) state.plans = {}; if (!state.plans[day]) state.plans[day] = {}; return state.plans[day]; }
function planJobs(day) { return Object.entries(getPlan(day)).map(([key, v]) => ({ key, ...v })); }
const planKey = (kind, id) => kind + ':' + id;
// All cleanable things you can put on a plan: serviced units (by type) + areas.
function planPool() {
  const rooms = (state.servicedUnits || []).map(u => ({ kind: 'unit', id: u.id, label: 'Unit ' + u.unit, group: UNIT_TYPES[unitType(u)].label }));
  const areas = (state.areas || []).map(a => ({ kind: 'area', id: a.id, label: a.label, group: a.kind === 'exterior' ? 'Exterior areas' : 'Interior areas' }));
  return [...rooms, ...areas];
}
function togglePlanJob(day, kind, id, label) {
  const plan = getPlan(day); const k = planKey(kind, id);
  // Taking a job off a day is a decision, and it has to outlast the next re-sync —
  // otherwise the schedule quietly puts it back and it looks like the tap did nothing.
  if (plan[k]) { delete plan[k]; markPlanDropped(day, k); }
  else { plan[k] = { kind, refId: id, label, assignedTo: null }; unmarkPlanDropped(day, k); }
  save(); render();
}
function droppedFor(day) { if (!state.planDropped) state.planDropped = {}; return state.planDropped[day] || null; }
function markPlanDropped(day, k) {
  if (!state.planDropped) state.planDropped = {};
  if (!state.planDropped[day]) state.planDropped[day] = {};
  state.planDropped[day][k] = true;
}
function unmarkPlanDropped(day, k) {
  const d = droppedFor(day);
  if (!d) return;
  delete d[k];
  if (!Object.keys(d).length) delete state.planDropped[day];
}
function setPlanAssignee(day, k, pid) {
  const plan = getPlan(day);
  // MARK IT AS A HUMAN DECISION. Every hand move — the drag, the move sheet, the
  // dropdown — comes through here, and the re-sync needs to tell a room somebody
  // deliberately gave to a person from one the machine dealt out on its own.
  if (plan[k]) {
    plan[k].assignedTo = pid || null;
    if (pid) plan[k].byHand = true; else delete plan[k].byHand;
  }
  mirrorPlanToBoard(day, k);
  save(); render();
}
// Planning TODAY and the morning roll call are the same job. They were separate:
// the plan lived in state.plans and the roll call read the room's own assignedTo,
// so planning today changed nothing the crew could see. Anything set on today's
// plan is written straight onto the room (or area) the roll call reads.
function mirrorPlanToBoard(day, key, keepBoard) {
  if (day !== todayKey() && day !== workToday()) return;
  const plan = getPlan(day);
  const keys = key ? [key] : Object.keys(plan);
  keys.forEach((k) => {
    const j = plan[k];
    if (!j) return;
    if (j.kind === 'unit') {
      const u = (state.servicedUnits || []).find((x) => x.id === j.refId);
      if (!u) return;
      if (keepBoard && u.assignedTo) return;   // the board was changed since; it wins
      u.assignedTo = j.assignedTo || null;
      // Handing a room out on purpose is the sign-off, exactly as it is on the board.
      // Marked as having come from the PLAN, though, not from somebody at the screen:
      // a plan is drawn for whoever is rostered, and the crew who actually turn up is
      // a different set. Without the mark the morning could not tell the two apart and
      // treated every planned room as a decision no automatic level was allowed to
      // touch — which is how two early birds ended up holding eleven rooms each while
      // three people stood there with nothing.
      if (j.assignedTo) {
        state.assignConfirmed[u.id] = todayKey();
        state.planCarried = state.planCarried || {};
        state.planCarried[u.id] = todayKey();
      } else {
        delete state.assignConfirmed[u.id];
      }
    } else {
      const a = areasInterior().find((x) => x.id === j.refId);
      if (!a || (keepBoard && a.assignedTo)) return;
      a.assignedTo = j.assignedTo || null;
    }
  });
}

// The morning the planned day arrives. A plan made last night for today only
// reached the board if somebody edited it again, or if the automatic hand-out
// happened to run — which needs badge-ins and only fires once. So the crew could
// open the app to an empty board and a plan sitting one tab away. This puts it on
// the roll call as the app opens, without touching anything already handed out
// there: a change made on the board is newer than the plan and wins.
function carryPlanToBoardOnOpen() {
  // BOTH DAYS, NOT JUST THE CALENDAR ONE. Everything else that asks what the crew is
  // on today asks workToday(), which between midnight and 3am is still YESTERDAY's
  // date — a round that runs late is on the day it started. This looked only at the
  // calendar day, so a plan filed while the round was still going was never carried
  // onto the board, and the morning opened empty with the plan one tab away. The two
  // dates are identical outside that window, so in daylight nothing changes.
  const days = [...new Set([workToday(), todayKey()])];
  if (!state.plans || !days.some((d) => state.plans[d])) return 0;
  const before = (state.servicedUnits || []).filter((u) => u.assignedTo).length;
  days.forEach((d) => { if (state.plans[d]) mirrorPlanToBoard(d, null, true); });
  const after = (state.servicedUnits || []).filter((u) => u.assignedTo).length;
  if (after !== before) save();
  return after - before;
}
// Whether a planned job has actually been done, read from the same place the roll
// call reads it, so a plan for today shows the morning's real progress.
function planJobDone(j) {
  if (j.kind === 'unit') return servicedDone(j.refId);
  const a = areasInterior().find((x) => x.id === j.refId);
  return a ? areaDone(a) : false;
}
function clearPlanDay(day) { showConfirm('Clear this day’s plan?', 'Removes every planned job for ' + day + '.', () => { if (state.plans) delete state.plans[day]; save(); render(); }); }
// Auto-spread the planned jobs evenly across whoever's clocked in.
function autoAssignPlan(day) {
  const inIds = Object.keys(hikArrivals).filter(id => (state.staff || []).some(s => s.id === id));
  if (!inIds.length) { hikSyncMsg = { err: true, text: 'No one clocked in yet to assign these jobs to.' }; render(); return; }
  const jobs = planJobs(day);
  if (!jobs.length) { hikSyncMsg = { err: true, text: 'No jobs planned for this day yet — add some below.' }; render(); return; }
  const plan = getPlan(day);
  const load = {}; inIds.forEach(id => load[id] = 0);
  jobs.forEach(j => { const pick = inIds.slice().sort((a, b) => load[a] - load[b])[0]; plan[j.key].assignedTo = pick; load[pick]++; });
  hikSyncMsg = { text: `Spread ${jobs.length} jobs across ${inIds.length} clocked-in.` };
  save(); render();
}

// THE SHEET THAT GETS HANDED OUT. The plan screen is built for editing a day —
// pickers, day jumps, a control on every job — none of which survives being
// photographed and sent to the security desk, who only need to know which rooms go
// to which person. This is the same day with everything else taken off: names down
// the side, their rooms beside them, sized to fit one screen so a screenshot is the
// whole day rather than the top third of it.
let _planSheet = false;
function planHandoutSheet(day) {
  const wrap = el('<div class="sheet-paper"></div>');
  const staffById = {};
  (state.staff || []).forEach((p) => { staffById[p.id] = p; });
  const byPerson = {}, loose = [];
  planJobs(day).forEach((j) => {
    const label = j.kind === 'unit' ? String(j.label || '').replace(/^Unit\s+/, '') : String(j.label || '');
    const item = { label, area: j.kind !== 'unit' };
    if (j.assignedTo && staffById[j.assignedTo]) (byPerson[j.assignedTo] = byPerson[j.assignedTo] || []).push(item);
    else loose.push(item);
  });
  const byLbl = (a, b) => String(a.label).localeCompare(String(b.label), undefined, { numeric: true, sensitivity: 'base' });
  const ids = Object.keys(byPerson).sort((a, b) =>
    String(staffById[a].name).localeCompare(String(staffById[b].name), undefined, { sensitivity: 'base' }));

  const dt = new Date(day + 'T00:00:00');
  const total = Object.values(byPerson).reduce((n, l) => n + l.length, 0) + loose.length;
  const head = el('<div class="sp-head"></div>');
  head.appendChild(el(`<div class="sp-date">${esc(dt.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' }))}</div>`));
  head.appendChild(el(`<div class="sp-meta">${ids.length} cleaner${ids.length === 1 ? '' : 's'} · ${total} job${total === 1 ? '' : 's'}</div>`));
  wrap.appendChild(head);

  if (!total) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:22px 0">Nothing planned for this day yet.</div>`));
    return wrap;
  }
  ids.forEach((id) => {
    const list = byPerson[id].slice().sort(byLbl);
    const row = el('<div class="sp-row"></div>');
    const p = staffById[id];
    const mates = assistantsFor(p, (x) => byPerson[x.id] === undefined)
      .map((x) => String(x.name).split(' ')[0]);
    const who = el(`<div class="sp-who">${esc(String(p.name).split(' ')[0])}`
      + `${p.isLeader ? ' <span class="sp-lead">★</span>' : ''}`
      + `<span class="sp-n">${list.length}</span></div>`);
    // Only assistants who have no rooms of their own on the sheet: one with their own
    // line is already accounted for, and naming them twice reads as two hand-outs.
    if (mates.length) who.appendChild(el(`<div class="sp-with">+ ${esc(mates.join(', '))}</div>`));
    row.appendChild(who);
    row.appendChild(el(`<div class="sp-jobs">${list.map((x) =>
      `<span class="sp-job${x.area ? ' area' : ''}">${esc(x.label)}</span>`).join('')}</div>`));
    wrap.appendChild(row);
  });
  if (loose.length) {
    const row = el('<div class="sp-row sp-loose"></div>');
    row.appendChild(el(`<div class="sp-who">Nobody<span class="sp-n">${loose.length}</span></div>`));
    row.appendChild(el(`<div class="sp-jobs">${loose.slice().sort(byLbl).map((x) =>
      `<span class="sp-job${x.area ? ' area' : ''}">${esc(x.label)}</span>`).join('')}</div>`));
    wrap.appendChild(row);
  }
  return wrap;
}

function viewPlan() {
  const wrap = el('<div class="body"></div>');
  const day = curPlanDay();
  const isTomorrow = day === tomorrowKey();
  // "Today" means the WORK day, the same day Roll Call, the close-out and the
  // automatic planning pass all use. It used to mean the calendar day here alone, so
  // a plan made between midnight and the 3am cutoff was filed one date FORWARD of the
  // one Roll Call reads — the plan was made, saved, and simply never appeared on the
  // morning it was made for. Daytime the two dates are identical and nothing changes.
  const isToday = day === workToday() || day === todayKey();
  const dt = new Date(day + 'T00:00:00');

  // Fill the day from the schedule before drawing it, so the list is already
  // there on arrival instead of being an empty screen the office has to type in.
  // A day already laid out is re-checked rather than left as drawn, so what is on
  // screen is what the schedule says now — not what it said when it was first opened.
  // A PAST DAY IS A RECORD, NOT A PLAN. Filling one in from the schedule would
  // invent a morning that never happened, so days behind the current one are opened
  // exactly as they were left — or empty, if they were never planned at all.
  const past = day < workToday();
  const seeded = past ? 0 : seedPlanOnce(day);
  if (!past && !seeded && day > todayKey()) resyncPlanDay(day);

  // WHICH DAY. First, because everything under it is that day's work.
  const quick = el('<div style="display:flex;gap:6px;margin-bottom:8px"></div>');
  const jump = (lbl, key, on) => { const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:1">${lbl}</button>`); b.onclick = () => { planDay = key; render(); }; return b; };
  // Backwards as well as forwards: "what was 704 actually put on?" is a question
  // worth being able to answer, and the day picker used to refuse to go behind today.
  const yday = shiftDay(workToday(), -1);
  quick.appendChild(jump('Yesterday', yday, day === yday));
  quick.appendChild(jump('Today', workToday(), isToday));
  quick.appendChild(jump('Tomorrow', tomorrowKey(), isTomorrow));
  const dayIn = el(`<input type="date" value="${esc(day)}" min="${esc(shiftDay(workToday(), -120))}" style="flex:1;min-width:0;background:#ffffff;color:#15202e;border:1px solid #d8e0ea;border-radius:8px;padding:7px 9px;font-size:13px">`);
  dayIn.onchange = (e) => { planDay = e.target.value || null; render(); };
  quick.appendChild(dayIn);
  wrap.appendChild(quick);

  // One tap between planning the day and the sheet that gets photographed.
  const sheetBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:10px;`
    + `border-color:#0284c7;color:#0284c7">${_planSheet ? '‹ Back to planning' : '📋 Hand-out sheet — fits one screen'}</button>`);
  sheetBtn.onclick = () => { _planSheet = !_planSheet; render(); };
  wrap.appendChild(sheetBtn);
  if (_planSheet) { wrap.appendChild(planHandoutSheet(day)); return wrap; }

  // THE ONE BUTTON.
  const planBtn = el(`<button class="add-btn" style="background:#15803d;margin-bottom:10px;font-size:15px;padding:12px">`
    + (isTomorrow ? `⚡ Plan tomorrow's rooms` : `⚡ Plan this day`) + `</button>`);
  planBtn.onclick = () => {
    if (isTomorrow) { planTomorrow(); return; }
    ensureDayPlanned(day);
    const plan = getPlan(day);
    const loose = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && !plan[k].assignedTo);
    if (loose.length && !isToday) assignNewPlanJobs(day, loose);
    mirrorPlanToBoard(day);
    save();
    const rooms = Object.values(plan).filter((v) => v.kind === 'unit');
    hikSyncMsg = { text: rooms.length + ' room' + (rooms.length === 1 ? '' : 's') + ' on this day, '
      + rooms.filter((v) => v.assignedTo).length + ' handed out.' };
    render();
  };
  wrap.appendChild(planBtn);

  if (hikSyncMsg) wrap.appendChild(el(`<div class="section-label" style="color:${hikSyncMsg.err ? '#dc2626' : '#15803d'}">${esc(hikSyncMsg.text)}</div>`));

  // THE DAY'S WORK, as one block. Grouped under each cleaner rather than listed
  // room by room with a dropdown each: the old layout was two rows and a full-width
  // select per room, so fourteen rooms was a long scroll and no use as a picture.
  // This is what gets sent to the crew, so it reads as a rota — name, count, rooms.
  const jobs = planJobs(day);
  const rooms = jobs.filter((j) => j.kind === 'unit');
  const areas = jobs.filter((j) => j.kind !== 'unit');
  const staffById = {};
  (state.staff || []).forEach((p) => { staffById[p.id] = p; });

  const head = el('<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"></div>');
  head.appendChild(el(`<div class="section-label" style="margin:0">${esc(dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }))}</div>`));
  head.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:700;flex:0 0 auto">`
    + `${rooms.length} room${rooms.length === 1 ? '' : 's'}${areas.length ? ` · ${areas.length} area${areas.length === 1 ? '' : 's'}` : ''}</div>`));
  wrap.appendChild(head);

  if (!jobs.length) {
    wrap.appendChild(el(`<div class="empty" style="padding:14px 0">Nothing on this day yet. Press the button above.</div>`));
  } else {
    // Areas sit with whoever is doing them, not in a bucket of their own — the
    // question is what one person's morning looks like, rooms and walks together.
    const byWho = {};
    [...rooms, ...areas].forEach((j) => { (byWho[j.assignedTo || ''] = byWho[j.assignedTo || ''] || []).push(j); });
    const order = Object.keys(byWho).sort((a, b) => {
      if (a === '') return 1; if (b === '') return -1;   // unhanded last, where it is noticed
      return String((staffById[a] || {}).name || a).localeCompare(String((staffById[b] || {}).name || b));
    });
    const box = el('<div style="margin-top:6px"></div>');
    order.forEach((id) => {
      // Order is the instruction: the rooms a customer asked for first thing come
      // first, so the list can be read top to bottom and worked in that order.
      const slotOf = (j) => j.kind === 'unit'
        ? timeSlot((state.servicedUnits || []).find((u) => u.id === j.refId)) : 'any';
      const rank = (j) => slotOf(j) === 'early' ? 0 : j.kind === 'unit' ? 1 : 3;   // early, rooms, walks
      const list = byWho[id].slice().sort((x, y) =>
        (rank(x) - rank(y))
        || String(x.label).localeCompare(String(y.label), undefined, { numeric: true }));
      const nRooms = list.filter((j) => j.kind === 'unit').length;
      const nAreas = list.length - nRooms;
      const none = !id;
      const p = staffById[id];
      const name = none ? 'Not handed out' : ((p || {}).name || id);
      // Same card as the roll call's clocked-in cleaners: name, a line under it,
      // then the rooms as chips. That block is the one the office reads fastest.
      const card = el(`<div class="person" data-plan-target="${esc(id)}" style="flex-direction:column;align-items:stretch;gap:8px"></div>`);
      const info = el('<div class="person-info"></div>');
      const lead = (p && p.isLeader) ? ` <span style="color:#d97706;font-size:12px;font-weight:700">★</span>` : '';
      const nameRow = el(`<div style="display:flex;align-items:center;gap:8px"></div>`);
      const withWho = none ? '' : withLabel(p, (x) => worksOnDay(x, day));
      nameRow.appendChild(el(`<div class="person-name" style="flex:1">${esc(name)}${lead}`
        + (withWho ? ` <span style="font-size:12px;font-weight:600;color:#5f7189">${esc(withWho)}</span>` : '')
        + `</div>`));
      // The sick-day button. Without it, moving five rooms means five taps and the
      // plan gets abandoned in favour of improvising the morning.
      if (!none) {
        const off = el(`<button class="su-rm" style="flex:0 0 auto">Off — share out</button>`);
        off.onclick = () => showConfirm(
          name.split(' ')[0] + ' is off?',
          `Their ${list.length} room${list.length === 1 ? '' : 's'} go back and are dealt round whoever else is `
            + `on that day, evenly. Anything nobody is cleared for is left unhanded so you can see it.`,
          () => {
            const r = sharePersonsRoomsOut(day, id);
            hikSyncMsg = r.stranded
              ? { err: true, text: 'Shared out ' + r.moved + ' — ' + r.stranded + ' left for you to place.' }
              : { text: 'Shared ' + r.moved + ' room' + (r.moved === 1 ? '' : 's') + ' round the rest.' };
            render();
          },
          'Share them out', 'safe');
        nameRow.appendChild(off);
      }
      info.appendChild(nameRow);
      // On today, what the door reader saw — the same line the roll call shows, so
      // you can tell at a glance who is actually in before moving work around.
      const arr = (isToday && id) ? hikArrivals[id] : null;
      const badged = arr
        ? (arr.out ? `✓ In ${esc(arr.time)} <span style="color:#5b6a7f">·</span> Out ${esc(arr.out)}`
                   : `✓ In ${esc(arr.time)} <span style="color:#5b6a7f">· still in</span>`)
        : null;
      const doneN = list.filter((j) => isToday && planJobDone(j)).length;
      const earlyN = list.filter((j) => j.kind === 'unit'
        && timeSlot((state.servicedUnits || []).find((u) => u.id === j.refId)) === 'early').length;
      const counts = none ? `${list.length} still to hand out`
        : `${nRooms} room${nRooms === 1 ? '' : 's'}${nAreas ? ` · ${nAreas} area${nAreas === 1 ? '' : 's'}` : ''}`
          + (earlyN ? ` · <span style="color:#b91c1c">${earlyN} early</span>` : '')
          + (doneN ? ` · ${doneN} done` : '');
      if (badged) info.appendChild(el(`<div class="person-floors" style="color:#15803d;font-weight:600">${badged}</div>`));
      else if (isToday && id && !badged) info.appendChild(el(`<div class="person-floors" style="color:#b45309;font-weight:600">Not badged in yet</div>`));
      info.appendChild(el(`<div class="person-floors" style="color:${none ? '#b45309' : '#5f7189'};font-weight:600">${counts}</div>`));
      card.appendChild(info);
      const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
      list.forEach((j) => {
        const short = String(j.label).replace(/^Unit\s+/, '');
        const isArea = j.kind !== 'unit';
        const done = isToday && planJobDone(j);
        // A room the customer asked for first thing. Called out wherever it is
        // listed, so an uneven early round is visible rather than something you
        // work out by reading every chip.
        const early = j.kind === 'unit'
          && timeSlot((state.servicedUnits || []).find((u) => u.id === j.refId)) === 'early';
        // Exactly the roll call's chip: the room, and an ✕ that takes it off them.
        // A walk of the building is green so it reads differently from a number.
        const style = done ? ';background:#eef7f0;border-color:#15803d;color:#15803d;opacity:0.75'
          : early ? ';background:#fee2e2;border-color:#dc2626;color:#b91c1c;font-weight:800'
          : none ? ';border-color:#b45309;color:#b45309'
          : isArea ? ';background:#15803d;border-color:#15803d;color:#ffffff' : '';
        const mark = done ? ' ✓' : (none ? '' : ' ✕');
        const c = el(`<button class="freqmini${none || isArea || done || early ? '' : ' on'}" style="flex:0 0 auto;padding:6px 11px;touch-action:none${style}">${early ? '🌅 ' : ''}${esc(short)}${mark}</button>`);
        makeRoomDraggable(c, day, j.key, j.label, none);
        chips.appendChild(c);
      });
      card.appendChild(chips);

      // ...and the roll call's "+ Assign a room or area…", so a person can be given
      // something without going and finding it first.
      const spare = jobs.filter((x) => !x.assignedTo);
      if (!none && spare.length) {
        const sel = el('<select class="area-select"></select>');
        sel.appendChild(el(`<option value="">+ Assign a room or area… (${spare.length} spare)</option>`));
        const rms = spare.filter((x) => x.kind === 'unit');
        const ars = spare.filter((x) => x.kind !== 'unit');
        if (rms.length) {
          const g = el(`<optgroup label="Rooms (${rms.length})"></optgroup>`);
          rms.forEach((x) => g.appendChild(el(`<option value="${esc(x.key)}">${esc(x.label)}</option>`)));
          sel.appendChild(g);
        }
        if (ars.length) {
          const g = el(`<optgroup label="Communal areas (${ars.length})"></optgroup>`);
          ars.forEach((x) => g.appendChild(el(`<option value="${esc(x.key)}">${esc(x.label)}</option>`)));
          sel.appendChild(g);
        }
        sel.onchange = (e) => { if (e.target.value) setPlanAssignee(day, e.target.value, id); };
        card.appendChild(sel);
      }
      box.appendChild(card);
    });
    wrap.appendChild(box);

    // Closing out the plan you made last night. Ticking fourteen rooms one at a time
    // is the same tap-per-job the roll call's close-out exists to avoid, and this is
    // the screen the plan was made on — so it closes here too, over exactly the jobs
    // that were planned rather than everything the roll call happens to think is due.
    if (isToday) {
      const openRooms = rooms.filter((j) => !planJobDone(j))
        .map((j) => (state.servicedUnits || []).find((u) => u.id === j.refId)).filter(Boolean);
      const openAreas = areas.filter((j) => !planJobDone(j))
        .map((j) => areasInterior().find((a) => a.id === j.refId)).filter(Boolean);
      const openTotal = openRooms.length + openAreas.length;
      if (openTotal) {
        const allBtn = el(`<button class="add-btn" style="background:#15803d;color:#ffffff;margin-top:10px">`
          + `${esc(markAllLabel(openRooms.length, openAreas.length))}</button>`);
        allBtn.onclick = () => confirmBulkMarkDone(openRooms, openAreas, "today's plan");
        wrap.appendChild(allBtn);
      } else if (jobs.length) {
        wrap.appendChild(el(`<div class="section-label" style="color:#15803d;margin-top:10px">`
          + `All ${jobs.length} planned job${jobs.length === 1 ? '' : 's'} are done.</div>`));
      }
    }

    // One auto-assign, which reads the right thing for the day it is on. Today the
    // door reader decides who is in; on a day that has not happened nobody has
    // badged in at all, and the old button simply failed with "no one clocked in".
    const auto = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:10px">`
      + (isToday ? `⚡ Auto-assign to who's clocked in` : `⚡ Auto-assign to whoever is rostered on`)
      + `</button>`);
    auto.onclick = () => {
      if (isToday) { autoAssignPlan(day); return; }
      const r = autoPlanDay(day);
      hikSyncMsg = r.assigned
        ? { text: 'Handed ' + r.assigned + ' room' + (r.assigned === 1 ? '' : 's') + ' to the ' + r.crew + ' rostered on that day.' }
        : { err: true, text: 'Nothing to hand out — ' + (r.reason || 'no rooms on the plan') + '.' };
      render();
    };
    wrap.appendChild(auto);
  }

  // Due but not on the plan is a discrepancy, not a detail — it stays in the open.
  const plan0 = getPlan(day);
  const missing = planningJobsFor(day).filter((s) => !plan0[planKey(s.kind, s.id)]);
  if (missing.length) {
    wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#b45309">Due but not planned (${missing.length})</div>`));
    const addAll = el(`<button class="freqmini" style="width:100%;padding:9px;border-color:#b45309;color:#b45309">＋ Add all ${missing.length} due job${missing.length === 1 ? '' : 's'}</button>`);
    addAll.onclick = () => { applySuggestions(day, missing); save(); render(); };
    wrap.appendChild(addAll);
  }

  // EVERYTHING ELSE, folded away. None of it is part of the day's list, and all of
  // it was pushing that list off the screen.
  const moreBtn = el(`<button class="reset-btn" style="margin-top:16px">${planMore ? '⌄ Hide' : '› Show more'}</button>`);
  moreBtn.onclick = () => { planMore = !planMore; render(); };
  wrap.appendChild(moreBtn);

  if (planMore) {
    // THE DAYS AHEAD — which day is heavy, before it arrives.
    const ahead = scheduleAhead(7);
    const peak = Math.max(1, ...ahead.map((d) => d.count));
    const box = el('<div style="margin:12px 0 16px"></div>');
    box.appendChild(el(`<div class="section-label">The week ahead</div>`));
    ahead.forEach((d, i) => {
      const ddt = new Date(d.day + 'T00:00:00');
      const lbl = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : ddt.toLocaleDateString('en-US', { weekday: 'long' });
      const row = el(`<div class="su-card" style="display:flex;align-items:center;gap:10px;padding:8px 11px;margin-bottom:5px;cursor:pointer${d.day === day ? ';border-color:#0284c7' : ''}"></div>`);
      row.appendChild(el(`<div style="flex:0 0 84px;font-size:12px;font-weight:800;color:#0f1a27">${esc(lbl)}</div>`));
      const bar = el('<div style="flex:1;height:8px;background:#eef2f7;border-radius:4px;overflow:hidden"></div>');
      const heavy = d.count >= peak * 0.85 && peak > 1;
      bar.appendChild(el(`<div style="height:100%;width:${Math.round((d.count / peak) * 100)}%;background:${heavy ? '#b45309' : '#0284c7'}"></div>`));
      row.appendChild(bar);
      row.appendChild(el(`<div style="flex:0 0 auto;font-size:15px;font-weight:800;color:${heavy ? '#b45309' : '#0f1a27'}">${d.count}</div>`));
      row.onclick = () => { planDay = d.day; render(); };
      box.appendChild(row);
    });
    if (state.lastAutoLevel && state.lastAutoLevel.day === todayKey() && state.lastAutoLevel.moves) {
      const al = state.lastAutoLevel;
      box.appendChild(el(`<div style="font-size:11px;color:#15803d;font-weight:600;margin-top:6px">`
        + `✓ Levelled today — ${al.moves} room${al.moves === 1 ? '' : 's'} spread across the cycle, `
        + `heaviest day ${al.from} → ${al.to}`
        + (al.extras ? `. ${al.extras} got one extra clean to break up the clump` : '') + `.</div>`));
    }
    const pv = planAheadPreview(PLAN_AHEAD_DAYS);
    const wkBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:6px;border-color:#b45309;color:#b45309">`
      + `⚡ Get the next ${pv.span} days ready</button>`);
    wkBtn.onclick = planAhead;
    box.appendChild(wkBtn);
    wrap.appendChild(box);

    if (!isToday) {
      const onDuty = cleaningStaff().filter((p) => worksOnDay(p, day));
      wrap.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin-bottom:8px">`
        + `<b style="color:${onDuty.length ? '#15803d' : '#b45309'}">${onDuty.length}</b> rostered on`
        + (onDuty.length ? ` · ${esc(onDuty.map((p) => p.name.split(' ')[0]).join(', '))}` : '') + `</div>`));
      // A day built before the schedule changed keeps whatever it was given, so there
      // has to be a way to say "do this one again from scratch".
      const rb = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:6px;border-color:#b45309;color:#b45309">⟳ Rebuild this day from the schedule</button>`);
      rb.onclick = () => {
        showConfirm(
          'Rebuild ' + day + '?',
          'The rooms on this day are set back to exactly what the schedule says is due, and handed out again. '
            + 'Rooms you added or removed by hand for this day are lost. Communal areas are left as they are.',
          () => {
            const r = rebuildPlanDay(day);
            hikSyncMsg = { text: 'Rebuilt: ' + r.added + ' added, ' + r.removed + ' dropped, ' + r.assigned + ' handed out.' };
            render();
          },
          'Rebuild it', 'safe'
        );
      };
      wrap.appendChild(rb);
    }
    if (jobs.length) {
      const clr = el(`<button class="reset-btn">Clear this day's plan</button>`);
      clr.onclick = () => clearPlanDay(day);
      wrap.appendChild(clr);
    }

    // Add jobs — grouped pool with toggles
    wrap.appendChild(el(`<div class="section-label" style="margin-top:16px">Add jobs to this day</div>`));
    const pool = planPool();
    if (!pool.length) {
      wrap.appendChild(el(`<div class="empty">No rooms or areas yet — add some on the Airbnb / Buildings / Offices tabs first.</div>`));
    } else {
      [...new Set(pool.map((x) => x.group))].forEach((g) => {
        wrap.appendChild(el(`<div class="section-label" style="margin-top:10px;color:#5b6a7f">${esc(g)}</div>`));
        const box2 = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
        pool.filter((x) => x.group === g).forEach((x) => {
          const on = !!plan0[planKey(x.kind, x.id)];
          const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:0 0 auto;padding:8px 12px">${on ? '✓ ' : '+ '}${esc(x.label)}</button>`);
          b.onclick = () => togglePlanJob(day, x.kind, x.id, x.label);
          box2.appendChild(b);
        });
        wrap.appendChild(box2);
      });
    }
  }

  const sheet = moveJobSheet(day);
  if (sheet) wrap.appendChild(sheet);

  return wrap;
}

// One tab, four filters — see ROOM_TAB_TYPE. The counts sit on the buttons so the
// shape of the building is readable without opening anything.
// Airbnb is cleaned by its own pair after the offices and is off the morning roll
// call, so on the room list it opens shut rather than sitting in the way.
const SHUT_BY_DEFAULT = ['airbnb'];
const GROUP_SUB = { airbnb: 'a separate job, after the main round' };
const ROOM_SEGMENTS = [['all', 'All'], ['airbnb', 'Airbnb'], ['office', 'Offices'], ['building', 'Buildings']];
function roomsFilter() { return ROOM_SEGMENTS.some(([k]) => k === state.roomsFilter) ? state.roomsFilter : 'all'; }
function viewRoomsHub() {
  const wrap = el('<div class="body"></div>');
  const cur = roomsFilter();
  const seg = el('<div class="seg"></div>');
  ROOM_SEGMENTS.forEach(([k, label]) => {
    const n = (state.servicedUnits || []).filter((u) => k === 'all' || unitType(u) === k).length;
    const b = el(`<button class="segbtn ${k === cur ? 'on' : ''}">${label}<span class="segn">${n}</span></button>`);
    b.onclick = () => { state.roomsFilter = k; save(); render(); };
    seg.appendChild(b);
  });
  wrap.appendChild(seg);
  const body = cur === 'all' ? viewRooms()
    : cur === 'airbnb' ? viewAirbnb()
    : cur === 'office' ? viewOffices() : viewBuildings();
  // Each sub-view returns its own .body, and a .body inside a .body doubles the
  // page padding — so take the contents rather than the wrapper.
  while (body.firstChild) wrap.appendChild(body.firstChild);
  return wrap;
}

function viewRooms() {
  const wrap = el('<div class="body"></div>');
  const units = (state.servicedUnits || []).slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  wrap.appendChild(el(`<div class="note"><b>${units.length}</b> rooms. Tap a frequency on any room to change it, or <b>Set all</b> for a whole group.</div>`));
  const pastBtn = el(`<button class="add-btn" style="width:100%;margin-bottom:14px">＋ Record a past day</button>`);
  pastBtn.onclick = () => openBackdate(yesterdayKey());
  wrap.appendChild(pastBtn);
  // SIXTY-SIX ROOMS IS A LOT OF SCROLLING. This screen is where a room's schedule is
  // changed, so it is read one room at a time — and it was the one room list with no
  // way to search it. The box is pinned under the header so it is still there when
  // you are forty rooms down, and it filters the cards already drawn rather than
  // re-rendering, which would take the cursor with it.
  const cards = [];
  let q = '';
  const stick = el('<div class="stickbar"></div>');
  const search = el(`<input type="search" placeholder="Search a room, guest or note…" `
    + `style="width:100%;background:#ffffff;color:#15202e;border:1px solid #d8e0ea;`
    + `border-radius:10px;padding:11px 13px;font-size:15px">`);
  const hits = el(`<div style="font-size:11px;color:#5f7189;font-weight:600;min-height:15px;margin-top:5px"></div>`);
  const applyFilter = () => {
    let shown = 0;
    cards.forEach((c) => {
      const on = !q || c.hay.includes(q);
      c.card.style.display = on ? '' : 'none';
      if (on) shown += 1;
    });
    // With a search running, a group heading and its bulk controls are noise unless
    // something in that group matched.
    groupBlocks.forEach((g) => {
      const n = cards.filter((c) => c.tk === g.tk && c.card.style.display !== 'none').length;
      g.els.forEach((e) => { e.style.display = (!q || n) ? '' : 'none'; });
    });
    hits.textContent = q ? (shown ? shown + ' match' + (shown === 1 ? '' : 'es') : 'No room matches “' + search.value.trim() + '”.') : '';
    hits.style.color = (q && !shown) ? '#b45309' : '#5f7189';
  };
  search.oninput = () => { q = search.value.trim().toLowerCase(); applyFilter(); };
  stick.appendChild(search); stick.appendChild(hits);
  wrap.appendChild(stick);
  const groupBlocks = [];
  if (!units.length) { wrap.appendChild(el(`<div class="empty">No rooms yet.</div>`)); return wrap; }

  // A whole frequency group falling due on the same day is what makes the week swing
  // between a light day and a heavy one. "Even out the days" can't fix it: it delays a
  // room from its last clean, and rooms that come due together are overdue together,
  // so there is nothing for the delay to act on. Splitting them needs a hold-back.
  ['eod', 'weekly'].forEach((fk) => {
    const span = FREQ_DAYS[fk] || 1;
    const dueNow = (state.servicedUnits || []).filter((u) =>
      onRollCall(u) && !u.paused && (u.freq || 'daily') === fk && unitDueToday(u));
    if (span < 2 || dueNow.length <= span) return;
    const box = el('<div class="su-card" style="margin-bottom:14px;padding:12px"></div>');
    box.appendChild(el(`<div style="font-size:12px;font-weight:800;color:#b45309">`
      + `⚠ all ${dueNow.length} ${esc((FREQ_LABEL[fk] || fk).toLowerCase())} rooms are due the same day</div>`));
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:4px">`
      + `Clean them together and they stay together, so the week keeps swinging between a heavy day and a light one.</div>`));
    const btn = el(`<button class="freqmini" style="width:100%;margin-top:8px;padding:9px;border-color:#7c3aed;color:#7c3aed">⇄ Split them over ${span} days</button>`);
    btn.onclick = () => {
      const preview = staggerFrequencyGroup(fk, true);
      const extra = preview.groups.slice(1).reduce((n, g) => n + g.units.length, 0);
      showConfirm(
        'Split ' + dueNow.length + ' rooms over ' + span + ' days?',
        preview.groups.map((g, i) => (i === 0 ? 'Today, as normal' : 'Today AND again on ' + g.day) + ': ' + g.units.join(', ')).join('\n\n')
          + '\n\nAll cleaned today; ' + extra + ' cleaned again tomorrow to move them onto the opposite day. '
          + 'Costs ' + extra + ' extra cleans once. Nothing is delayed or skipped.',
        () => { staggerFrequencyGroup(fk); },
        'Split them',
        'safe'
      );
    };
    box.appendChild(btn);
    wrap.appendChild(box);
  });
  const groups = {};
  units.forEach(u => { const t = unitType(u); (groups[t] = groups[t] || []).push(u); });
  ['airbnb', 'office', 'building'].forEach(tk => {
    const list = groups[tk]; if (!list || !list.length) return;
    const t = UNIT_TYPES[tk];
    // EACH KIND OF ROOM IS ITS OWN DROP-DOWN. Airbnb starts shut: it is a separate
    // job, run by its own pair after the main round, so on a screen about the
    // building's schedule it is a section you open when you want it — not thirty
    // rooms to scroll past to reach the ones the morning is actually about.
    const gk = 'rooms:' + tk;
    const saved = (state.shutGroups || {})[gk];
    const shut = saved === undefined ? SHUT_BY_DEFAULT.includes(tk) : !!saved;
    const head = el(`<button class="grp-btn"></button>`);
    head.appendChild(el(`<div class="grp-caret">${shut ? '▸' : '▾'}</div>`));
    head.appendChild(el(`<div class="crew-dot" style="background:${t.color}"></div>`));
    const gt = el(`<div style="flex:1;min-width:0;text-align:left"></div>`);
    gt.appendChild(el(`<div class="grp-title">${t.label}</div>`));
    if (GROUP_SUB[tk]) gt.appendChild(el(`<div class="grp-sub">${GROUP_SUB[tk]}</div>`));
    head.appendChild(gt);
    head.appendChild(el(`<div class="grp-count">${list.length}</div>`));
    head.onclick = () => {
      state.shutGroups = state.shutGroups || {};
      state.shutGroups[gk] = !shut;      // stored either way, so "opened" survives too
      save(); render();
    };
    wrap.appendChild(head);
    const block = { tk, els: [] };
    groupBlocks.push(block);

    // Group-level schedule flip + a breakdown of what this group is currently on,
    // so an odd room out ("13 on every-other-day") is visible instead of hidden.
    const ids = list.map(u => u.id);
    const tally = {};
    list.forEach(u => { const f = u.freq || 'daily'; tally[f] = (tally[f] || 0) + 1; });
    const spread = Object.keys(tally).sort((a, b) => tally[b] - tally[a])
      .map(f => `${tally[f]} ${FREQ_LABEL[f] || f}`).join(' · ');
    const bulk = el(`<div style="margin:6px 0 4px"></div>`);
    bulk.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:6px">Now: ${esc(spread)} · <b>Set all:</b></div>`));
    const bulkBtns = el(`<div style="display:flex;gap:6px"></div>`);
    [['daily', 'Daily'], ['eod', 'Every other day'], ['weekly', 'Weekly']].forEach(([fk, lbl]) => {
      const allOn = tally[fk] === list.length;
      const b = el(`<button class="freqmini ${allOn ? 'on' : ''}">${lbl}</button>`);
      b.onclick = () => setUnitsFreqBulk(ids, fk, t.label.toLowerCase());
      bulkBtns.appendChild(b);
    });
    bulk.appendChild(bulkBtns);

    // ...or pin the whole group to fixed weekdays, which is what stops the drift.
    const pinnedN = list.filter((u) => fixedDays(u)).length;
    const dayBulk = el(`<div style="margin-top:8px"></div>`);
    dayBulk.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:6px">`
      + `${pinnedN} of ${list.length} on fixed days · <b>Put all on:</b></div>`));
    const dayBtns = el(`<div style="display:flex;gap:5px;flex-wrap:wrap"></div>`);
    let picking = [];
    DOW_PICK_ORDER.forEach((d) => {
      const b = el(`<button class="freqmini" style="padding:6px 9px" title="${esc(DOW_LABEL[d])}">${esc(DOW_SHORT[d])}</button>`);
      b.onclick = () => {
        const at = picking.indexOf(d);
        if (at >= 0) { picking.splice(at, 1); b.classList.remove('on'); }
        else { picking.push(d); b.classList.add('on'); }
        apply.style.display = picking.length ? '' : 'none';
      };
      dayBtns.appendChild(b);
    });
    const apply = el(`<button class="freqmini on" style="padding:6px 11px;display:none">Apply</button>`);
    apply.onclick = () => setUnitsDaysBulk(ids, picking.slice().sort((a, b2) => a - b2), t.label.toLowerCase());
    dayBtns.appendChild(apply);
    if (pinnedN) {
      const off = el(`<button class="freqmini" style="padding:6px 9px">✕ Clear</button>`);
      off.onclick = () => setUnitsDaysBulk(ids, null, t.label.toLowerCase());
      dayBtns.appendChild(off);
    }
    dayBulk.appendChild(dayBtns);
    bulk.appendChild(dayBulk);

    const cleanedCount = list.filter(cleanedToday).length;
    const markRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
    markRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:0 0 auto">`
      + `${cleanedCount} of ${list.length} cleaned today · <b>Mark all:</b></div>`));
    const markToday = el(`<button class="freqmini ${cleanedCount === list.length ? 'on' : ''}" style="flex:0 0 auto;padding:6px 10px">✓ Cleaned today</button>`);
    markToday.onclick = () => setUnitsLastCleanedBulk(ids, todayKey(), t.label.toLowerCase());
    markRow.appendChild(markToday);
    // A past night can't be bulk-stamped with today's assignment — it goes through
    // the sheet, where the names come from who badged in that day.
    const markPast = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">↺ A past day…</button>`);
    markPast.onclick = () => openBackdateForType(tk, yesterdayKey());
    markRow.appendChild(markPast);
    bulk.appendChild(markRow);
    if (shut) return;

    // Show the coming week's load, and offer to flatten it when one day spikes.
    const upcoming = {};
    list.forEach(u => { const d = nextDueDate(u) || todayKey(); upcoming[d] = (upcoming[d] || 0) + 1; });
    const days = Object.keys(upcoming).sort().slice(0, 4);
    const dayLabel = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    if (days.length) {
      const peak = Math.max(...days.map(d => upcoming[d]));
      const lightest = Math.min(...days.map(d => upcoming[d]));
      // Everything landing on ONE day is the worst case, not a balanced one —
      // don't let a single-day spread look like nothing is wrong.
      const allOnOneDay = days.length === 1 && upcoming[days[0]] > 1;
      const lopsided = allOnOneDay || peak - lightest > 1;
      const loadRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
      loadRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:0 0 auto">Next days: `
        + days.map(d => `<b>${upcoming[d]}</b> ${dayLabel(d)}`).join(' · ')
        + `</div>`));
      // Evening the days out is one job with one rule, done by the leveller — which
      // splits rooms across the cycle and never leaves one longer than its frequency.
      // This used to have its own balancer that delayed rooms instead, so the two
      // pulled against each other depending on which had run last.
      if (lopsided) {
        const lp = levelPlan(LEVEL_HORIZON);
        loadRow.appendChild(el(`<div style="flex-basis:100%;height:0"></div>`));
        loadRow.appendChild(el(`<div style="font-size:11px;color:#b45309;font-weight:700;flex:0 0 auto">`
          + (allOnOneDay ? `⚠ all ${upcoming[days[0]]} land on ${dayLabel(days[0])}` : `⚠ ${peak} on one day vs ${lightest} on another`)
          + `</div>`));
        if (lp.moves.length) {
          const balBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">⚖ Even out the days</button>`);
          balBtn.onclick = () => {
            const r = levelPlan(LEVEL_HORIZON);
            applyLevelPlan(r);
            hikSyncMsg = { text: 'Spread ' + r.moves.length + ' room' + (r.moves.length === 1 ? '' : 's')
              + ' across the cycle — heaviest day ' + r.settledBefore + ' → ' + r.settledAfter + '.' };
            render();
          };
          loadRow.appendChild(balBtn);
        }
      }
      bulk.appendChild(loadRow);
    }
    wrap.appendChild(bulk);

    list.forEach(u => {
      const due = unitDueToday(u);
      const nd = nextDueDate(u);
      const who = (state.staff || []).find(p => p.id === (u.usualTo || u.assignedTo));
      const lastBase = lastCleanDate(u);
      const card = el(`<div class="su-card"></div>`);

      // Row 1: number + status
      const top = el(`<div style="display:flex;align-items:center;gap:10px"></div>`);
      top.appendChild(el(`<div style="font-size:16px;font-weight:800;min-width:56px;color:#0f1a27">${esc(u.unit)}</div>`));
      const mid = el(`<div style="flex:1;min-width:0"></div>`);
      mid.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600">${esc(t.label)}${who ? ' · ' + esc(who.name.split(' ')[0]) : ''}</div>`));
      const doneToday = cleanedToday(u);
      // "Due" and "we have no idea" are different things, and mixing them makes the
      // whole list untrustworthy: a room nobody has ever recorded looks identical to
      // one that genuinely came round again today.
      const noRecord = !lastCleanDate(u);
      const dueLabel = doneToday ? '✓ Cleaned today'
        : noRecord ? 'No record yet — set when it was last cleaned'
        : due ? 'Due today'
        : nd ? 'Next: ' + new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        : '';
      const tone = doneToday ? '#15803d' : noRecord ? '#b45309' : due ? '#15803d' : '#5b6a7f';
      mid.appendChild(el(`<div style="font-size:11px;color:${tone};font-weight:600">${esc(dueLabel)}</div>`));
      top.appendChild(mid);
      card.appendChild(top);

      // Row 2: frequency chips (set while allocating — remembered per room)
      const freqRow = el(`<div class="su-ctl" style="border-top:none;padding-top:8px;margin-top:6px"></div>`);
      [['daily', 'Daily'], ['eod', 'Every other day'], ['weekly', 'Weekly']].forEach(([fk, lbl]) => {
        const b = el(`<button class="freqmini ${u.freq === fk ? 'on' : ''}">${lbl}</button>`);
        b.onclick = () => setUnitFreq(u.id, fk);
        freqRow.appendChild(b);
      });
      card.appendChild(freqRow);

      // Row 3: last-cleaned quick set
      const lcRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
      lcRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600">Last cleaned:${lastBase ? ' ' + new Date(lastBase + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ' —'}</div>`));
      const yb = el(`<button class="freqmini ${lastBase === yesterdayKey() ? 'on' : ''}" style="flex:0 0 auto;padding:6px 12px">Yesterday</button>`);
      yb.onclick = () => markCleanedOn(u.id, yesterdayKey());
      const tb = el(`<button class="freqmini ${lastBase === todayKey() ? 'on' : ''}" style="flex:0 0 auto;padding:6px 12px">Today</button>`);
      tb.onclick = () => setUnitLastCleaned(u.id, todayKey());
      lcRow.appendChild(yb); lcRow.appendChild(tb);
      if (u.lastCleaned) {
        const cb = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">✕</button>`);
        cb.onclick = () => setUnitLastCleaned(u.id, null);
        lcRow.appendChild(cb);
      }
      card.appendChild(lcRow);
      wrap.appendChild(card);
      cards.push({ card, tk, hay: [u.unit, u.guest, u.note, schedLabel(u)].filter(Boolean).join(' ').toLowerCase() });
    });
  });
  return wrap;
}

// What still has to be cleaned on tonight's round. The roll call is a morning
// tool; the crew works into the night, so "what's left" needs its own screen that
// uses the work day (rolling over at 3am) rather than the calendar day.
function viewTonight() {
  const wrap = el('<div class="body"></div>');
  const unitById = {};
  (state.servicedUnits || []).forEach(u => { unitById[u.id] = u; });
  const areaById = {};
  (state.areas || []).forEach(a => { areaById[a.id] = a; });

  // The list and the button that clears it read from one place, so the count on
  // the button can never disagree with the number of cards under it.
  const outstanding = tonightOutstanding();
  const day = outstanding.day;
  const jobs = outstanding.jobs;

  const dayLabel = new Date(day + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  wrap.appendChild(el(`<div class="note">Still outstanding for <b>${esc(dayLabel)}</b>. Tick them off as the round goes.</div>`));

  if (!jobs.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:28px 0;color:#15803d;font-weight:700">✓ Nothing outstanding — the round is done.</div>`));
    return wrap;
  }

  // CLOSE OUT THE ROUND — the whole night in one tap, at the top where it can't be
  // missed. Unlike the roll call button this does cover Airbnb: it is off the
  // morning roll call, but it is still part of tonight's work and shows in this list.
  {
    const nRooms = outstanding.rooms.length, nAreas = outstanding.areas.length;
    const allBox = el('<div style="margin-bottom:16px"></div>');
    const allBtn = el(`<button class="add-btn" style="background:#15803d;color:#ffffff">✓ Mark all ${jobs.length} as cleaned</button>`);
    allBtn.onclick = () => markTonightAllDone();
    allBox.appendChild(allBtn);
    allBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
      + `${nRooms} room${nRooms === 1 ? '' : 's'}`
      + (nAreas ? ` · ${nAreas} communal area${nAreas === 1 ? '' : 's'}` : '')
      + ` — goes straight to History, and you can un-tick any of them one by one.</div>`));
    wrap.appendChild(allBox);
  }

  const late = jobs.filter(j => j.late).length;
  wrap.appendChild(el(`<div class="section-label">${jobs.length} to clean tonight${late ? ` · <span style="color:#b45309">${late} overdue</span>` : ''}</div>`));

  const groups = {};
  jobs.forEach(j => { (groups[j.group] = groups[j.group] || []).push(j); });
  Object.keys(groups).forEach(g => {
    wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#5f7189">${esc(g)} (${groups[g].length})</div>`));
    const list = el(`<div class="area-list"></div>`);
    groups[g].forEach(j => {
      const item = el(`<div class="area-item"></div>`);
      const row = el(`<div class="area-row"></div>`);
      const tick = el(`<button class="area-tick" title="Mark clean">✓</button>`);
      tick.onclick = () => { if (j.kind === 'unit') toggleServicedDone(j.id); else toggleAreaDone(j.id); };
      row.appendChild(tick);
      const who = j.kind === 'unit' ? cleanerForUnit(unitById[j.id]) : null;
      const whoName = who ? who.person.name.split(' ')[0] : (areaById[j.id] && areaById[j.id].assignedTo
        ? ((state.staff || []).find(p => p.id === areaById[j.id].assignedTo) || {}).name : null);
      row.appendChild(el(`<div class="area-name su-unit">${esc(j.label)}`
        + `<span class="area-freq" style="${j.late ? 'color:#b45309' : ''}"> · ${esc(j.why)}</span>`
