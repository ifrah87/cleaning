// Today's badge-in events → first arrival per person, matched to staff by name.
let hikArrivals = {};   // staff id -> { time }
let hikUnknown = [];    // [{ name, time }] badged in but no matching staff (the "unknown" alert)
let hikOther = [];      // [{ id, name, time }] known staff who badged in but aren't tagged as cleaners
let selectedDay = null; // which day Roll Call is showing (null = today)
function fmtEventTime(v) {
  if (!v) return '';
  const s = String(v);
  // Pull HH:MM straight from the string (EAT wall-clock) — no timezone shifting.
  const m = s.match(/(?:[ T])(\d{1,2}):(\d{2})/) || s.match(/^(\d{1,2}):(\d{2})/);
  if (m) { let h = parseInt(m[1], 10); const min = m[2]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + min + ' ' + ap; }
  const d = /^\d{10,}$/.test(s) ? new Date(Number(s)) : new Date(s);
  return isNaN(d.getTime()) ? s : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
// Load arrivals for the selected day (defaults to today), matched to staff by name.
async function loadHikArrivals() {
  if (!db) return;
  const res = await arrivalsForDay(selectedDay || todayKey());
  if (!res) return;               // read failed → keep the arrivals we already had
  hikArrivals = res.arrivals; hikUnknown = res.unknown; hikOther = res.other;
  hikLastPull = new Date();       // an empty roll call means "checked, nobody in" — not "no idea"
}

// One day's badge events, matched to staff, returned rather than stored. Any day
// can be looked up without disturbing what Roll Call is showing — recording last
// night's work needs yesterday's names while the tab still shows today's.
// Returns null when the read failed, so "nobody in" stays distinguishable.
async function arrivalsForDay(day) {
  if (!db) return null;
  try {
    const { data, error } = await db.from('hik_events')
      .select('person_name,person_code,event_time')
      .like('event_time', day + '%')              // only the selected day's scans
      .order('event_time', { ascending: true });  // earliest first
    if (error) throw error;
    const firstByName = {}, lastByName = {};
    for (const e of (data || [])) {
      const key = (e.person_name || '').trim().toLowerCase();
      if (!key) continue;
      if (!firstByName[key]) firstByName[key] = e;   // earliest (data ordered ascending) = In
      lastByName[key] = e;                           // keep overwriting → latest = Out
    }
    // Only surface CLEANERS on the roll call (once any cleaner is tagged). Everyone is
    // still matched, but non-cleaner staff (office/management) are dropped silently.
    const cleaners = (state.staff || []).filter((p) => p.isCleaner);
    const onlyCleaners = cleaners.length > 0;
    const cleanerByName = {};
    for (const s of cleaners) cleanerByName[(s.name || '').trim().toLowerCase()] = s;
    const staffByName = {};
    for (const s of (state.staff || [])) staffByName[(s.name || '').trim().toLowerCase()] = s;
    const arrivals = {}, unknown = [], other = [];
    for (const key in firstByName) {
      const e = firstByName[key];
      const t = fmtEventTime(e.event_time);
      const outE = lastByName[key];
      const outT = (outE && outE.event_time !== e.event_time) ? fmtEventTime(outE.event_time) : null;
      const s = onlyCleaners ? cleanerByName[key] : staffByName[key];   // case-insensitive name match
      if (s) arrivals[s.id] = { time: t, out: outT, raw: e.event_time };
      // The door reader sees everyone, cleaners or not. Keep the non-cleaners out
      // of the roll call, but don't drop them without trace — silently vanishing
      // makes an untagged cleaner look like someone who never turned up.
      else if (onlyCleaners && staffByName[key]) other.push({ id: staffByName[key].id, name: staffByName[key].name, time: t });
      else unknown.push({ name: e.person_name, time: t });
    }
    mergeManualArrivals(day, arrivals);   // people the office added by hand (forgot to badge)
    return { arrivals, unknown, other };
  } catch (e) { return null; }
}
// Work out each cleaner's rest days from the badge history instead of asking the

// the door events, so what this infers and what shows up each morning agree.
//
// Judged per weekday, not overall: someone in every day but Friday is 86% present
// and would look like perfect attendance. A weekday needs enough occurrences in the
// window to mean anything, and only a clear result counts — anything in between is
// left alone rather than guessed at, because the office can see its own crew and a
// wrong rest day is worse than no rest day.
const ROTA_MIN_SAMPLES = 3;      // fewer than this of a given weekday says nothing
const ROTA_OFF_AT = 0.2;         // in 20% of them or less → a rest day
const ROTA_ON_AT = 0.5;          // half or more → a working day
const ROTA_MIN_OVERALL = 0.35;   // below this they're too irregular to read at all
async function inferRotasFromAttendance(windowDays) {

  try {
    const { data, error } = await db.from('hik_events')
      .select('person_name,event_time')
      .gte('event_time', from)
      .order('event_time', { ascending: true });
    if (error) throw error;
    const seen = {};                                   // day -> Set of lowercased names
    for (const e of (data || [])) {
      const day = String(e.event_time || '').slice(0, 10);
      const key = (e.person_name || '').trim().toLowerCase();
      if (!day || !key) continue;
      (seen[day] = seen[day] || new Set()).add(key);
    }
    const days = Object.keys(seen).sort();
    if (!days.length) return { days: 0, proposals: [], skipped: [] };
    const dowTotal = {};
    days.forEach((d) => { const w = new Date(d + 'T00:00:00').getDay(); dowTotal[w] = (dowTotal[w] || 0) + 1; });
    const proposals = [], skipped = [];
    cleaningStaff().forEach((p) => {
      const key = (p.name || '').trim().toLowerCase();
      const hit = {};
      let total = 0;
      days.forEach((d) => {
        if (!seen[d].has(key)) return;
        total += 1;
        const w = new Date(d + 'T00:00:00').getDay();
        hit[w] = (hit[w] || 0) + 1;
      });
      if (total / days.length < ROTA_MIN_OVERALL) {
        skipped.push({ name: p.name, reason: 'in on only ' + Math.round((total / days.length) * 100) + '% of days' });
        return;
      }
      const worksOn = [], off = [], unclear = [];
      for (let w = 0; w < 7; w += 1) {
        const tot = dowTotal[w] || 0;
        if (tot < ROTA_MIN_SAMPLES) { worksOn.push(w); unclear.push(w); continue; }  // no evidence → leave them on
        const rate = (hit[w] || 0) / tot;
        if (rate <= ROTA_OFF_AT) off.push(w);
        else if (rate >= ROTA_ON_AT) worksOn.push(w);
        else { worksOn.push(w); unclear.push(w); }
      }
      if (!off.length) return;                          // nothing to change
      proposals.push({ id: p.id, name: p.name, worksOn, off, unclear });
    });
    return { days: days.length, proposals, skipped };
  } catch (e) { return null; }
}

// Import a Hik export (Time Card or Access Record) → store check-ins → refresh Roll Call.
async function importAttendance(file) {
  hikSyncMsg = { text: 'Reading attendance file…' }; render();
  try {
    if (typeof XLSX === 'undefined') throw new Error('Spreadsheet reader not loaded — check your connection and retry.');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    let hdr = -1, C = {};
    for (let i = 0; i < rows.length; i++) {
      const r = (rows[i] || []).map((x) => String(x || '').trim().toLowerCase());
      if (r.includes('first name') && r.some((x) => x.includes('record'))) {
        hdr = i; C = { fmt: 'timecard', first: r.indexOf('first name'), last: r.indexOf('last name'), id: r.indexOf('id'), date: r.indexOf('date'), rec: r.findIndex((x) => x.includes('record')) }; break;
      }
      if (r.includes('name') && r.some((x) => x.includes('time'))) {
        hdr = i; C = { fmt: 'access', name: r.indexOf('name'), id: r.indexOf('id'), time: r.findIndex((x) => x.includes('time')) }; break;
      }
    }
    if (hdr < 0) throw new Error('Could not recognise the columns in this file.');
    const map = {};
    for (let i = hdr + 1; i < rows.length; i++) {
      const row = rows[i] || [];
      let name = '', code = '', date = '', times = [];
      if (C.fmt === 'timecard') {
        name = ((row[C.first] || '') + ' ' + (row[C.last] || '')).trim();
        code = String(row[C.id] || '').trim();
        date = String(row[C.date] || '').trim().slice(0, 10);
        times = String(row[C.rec] || '').split(/[;,]/).map((t) => t.trim()).filter((t) => /\d{1,2}:\d{2}/.test(t));
      } else {
        name = String(row[C.name] || '').trim();
        code = String(row[C.id] || '').trim();
        const ts = String(row[C.time] || '').trim();
        const dm = ts.match(/(\d{4}-\d{2}-\d{2})/); const tm = ts.match(/(\d{1,2}:\d{2})/);
        date = dm ? dm[1] : ''; times = tm ? [tm[1]] : [];
      }
      if (!name || !date || !times.length) continue;
      const first = times.slice().sort()[0];
      const et = date + ' ' + first;
      const key = name.toLowerCase() + '|' + date;
      if (!map[key] || et < map[key].event_time) map[key] = { person_name: name, person_code: code, event_time: et };
    }
    const records = Object.values(map);
    if (!records.length) throw new Error('No check-in rows found in the file.');
    if (db) {
      await db.from('hik_events').upsert(records.map((r) => ({ ...r, event_type: 'imported', raw: { source: 'import' } })), { onConflict: 'person_name,event_time', ignoreDuplicates: true });
    }
    const days = [...new Set(records.map((r) => r.event_time.slice(0, 10)))].sort();
    selectedDay = days[days.length - 1];   // show the latest day found in the file
    await loadHikArrivals();
    const matched = Object.keys(hikArrivals).length;
    let msg = `Imported ${records.length} check-ins (${days.length === 1 ? days[0] : days.length + ' days'}) — ${matched} matched.`;
    if (hikUnknown.length) msg += ` ${hikUnknown.length} not matched: ${hikUnknown.map((u) => u.name).join(', ')}.`;
    hikSyncMsg = { text: msg };
    render();
  } catch (e) {
    hikSyncMsg = { err: true, text: 'Import failed: ' + ((e && e.message) || e) };
    render();
  }
}

      state.lastCleanUndo[k] = {

// Everything still open on this morning's roll call, in the order the roll call
// itself shows it. Airbnb and anything else switched off in Settings stays out —
// onRollCall already excludes it, and it is a separate job with its own tab.
function rollCallOutstanding() {

  return { rooms, areas: areasOutstanding() };

// Everything still outstanding on tonight's round. Unlike the morning roll call
// this is the whole night's work — Airbnb and anything else kept off roll call is
// still cleaned tonight, by its own crew. Built from suggestedJobsFor so tonight's
// list and the day plan can never disagree, and reused by the view that draws it.
function tonightOutstanding() {
  const day = workToday();
  const unitById = {}; (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const areaById = {}; (state.areas || []).forEach((a) => { areaById[a.id] = a; });
  // suggestedJobsFor already drops areas ticked off for this day; rooms need the
  // cleaned-today check because a room can be cleaned without its plan changing.
  const jobs = suggestedJobsFor(day).filter((j) =>
    j.kind === 'unit' ? (unitById[j.id] && !cleanedToday(unitById[j.id])) : !!areaById[j.id]);
  return {
    day,
    jobs,
    rooms: jobs.filter((j) => j.kind === 'unit').map((j) => unitById[j.id]),
    areas: jobs.filter((j) => j.kind === 'area').map((j) => areaById[j.id]),
  };
}

// At hand-over the answer is nearly always "all of it", and ticking each job
// separately was one tap, one save and one insert per job. This closes a whole
// list in a single write. Each item keeps its own history reference, so any one of
// them can still be un-ticked afterwards exactly as if it had been ticked alone.
// Shared by the roll call and tonight's round — only the starting list differs.
function confirmBulkMarkDone(rooms, areas, what) {
  const total = rooms.length + areas.length;
  if (!total) return;
  const parts = [];
  if (rooms.length) parts.push(rooms.length + ' room' + (rooms.length === 1 ? '' : 's'));
  if (areas.length) parts.push(areas.length + ' communal area' + (areas.length === 1 ? '' : 's'));
  showConfirm(
    'Mark all ' + total + ' as cleaned?',
    'Everything still open on ' + what + ' — ' + parts.join(' and ') + ' — will be recorded as cleaned now, '
      + 'each credited to the person it is assigned to (anything unassigned goes down as Office). '
      + 'They all go into History, and you can un-tick any of them one by one.',
    () => runBulkMarkDone(rooms, areas),
    'Mark all cleaned',
    'safe'
  );
}

function markRollCallAllDone() {
  const { rooms, areas } = rollCallOutstanding();
  confirmBulkMarkDone(rooms, areas, "this morning's roll call");
}

function markTonightAllDone() {
  const { rooms, areas } = tonightOutstanding();

async function runBulkMarkDone(rooms, areas) {
  if (!state.logRefs) state.logRefs = {};
  if (!state.lastCleanUndo) state.lastCleanUndo = {};
  // Same work day the single tick uses, so a close-out after midnight lands on the
  // round the crew is still on rather than the morning that has just started.
  const day = workToday();
  const entries = [];
  rooms.forEach((u) => {
    const k = 'su:' + u.id + '::' + day;
    state.lastCleanUndo[k] = {
      date: u.lastCleaned || null,
      by: u.lastCleanedBy || null,
      byName: u.lastCleanedByName || null,
    };
    const who = resolveCleanerFor(u, null);
    state.completions[k] = true;
    u.lastCleaned = day;
    u.lastCleanedBy = who.id;
    u.lastCleanedByName = who.name;
    entries.push({ key: k, u, who: who.id });
  });
  areas.forEach((a) => {
    state.completions[areaDoneKey(a)] = true;
    entries.push({ key: areaDoneKey(a), u: areaAsUnit(a), who: a.assignedTo || 'office' });
  });
  // Show it done straight away — the write follows, and a failure surfaces its own
  // warning rather than holding the screen while the crew is waiting.
  save(); render();
  const ids = await logCleanMany(entries.map(({ u, who }) => ({ u, who })), null);
  // Ids come back in insert order. Only pair them up when the counts agree —
  // a mismatch would attach the wrong history row to the wrong tick.
  if (ids && ids.length === entries.length) {
    entries.forEach((e, i) => { state.logRefs[e.key] = ids[i]; });
    save();
  }
}

    more.onclick = () => { _areaCtlOpen = _areaCtlOpen === a.id ? null : a.id; render(); };

// Shifts — a person works Day (default), Afternoon, or Night. Tapping the chip
// cycles through them. Purely a label so the office knows who's expected when
// (e.g. Hassan's 2 AM badge-in is normal for night staff).
const SHIFTS = {
  day:       { label: 'Day',       icon: '☀️', color: '#0284c7' },
  afternoon: { label: 'Afternoon', icon: '🌇', color: '#b45309' },
  night:     { label: 'Night',     icon: '🌙', color: '#7c3aed' },
};
const SHIFT_ORDER = ['day', 'afternoon', 'night'];
function shiftOf(p) { return (p && SHIFTS[p.shift]) ? p.shift : 'day'; }
function cycleShift(id) {
  const p = state.staff.find((s) => s.id === id);
  if (!p) return;
  const i = SHIFT_ORDER.indexOf(shiftOf(p));
  p.shift = SHIFT_ORDER[(i + 1) % SHIFT_ORDER.length];
  save(); render();
}
// Cleaner type — Inside (rooms/common areas), Outside (grounds/exterior), or Both.
// Tapping the chip cycles through. Used to keep exterior work with outside crews.
const CLEAN_TYPES = {
  inside:  { label: 'Inside',  icon: '🏠', color: '#0284c7' },
  outside: { label: 'Outside', icon: '🌳', color: '#15803d' },
  both:    { label: 'In + Out', icon: '🔁', color: '#7c3aed' },
};
const TYPE_ORDER = ['inside', 'outside', 'both'];
// Which kinds of room a person is cleared to clean. Trainees are often kept off
// offices while they learn, so "can this person take this room" has to be a
// property of the person, not something the office remembers each morning.
// No list set = cleared for everything, so existing staff are unaffected.
const canCleanType = (p, typeKey) => {
  const allowed = p && p.canClean;
  return !Array.isArray(allowed) || !allowed.length || allowed.includes(typeKey);
};
const canCleanUnit = (p, u) => canCleanType(p, unitType(u));
function toggleCanClean(id, typeKey) {
  const p = (state.staff || []).find((s) => s.id === id);
  if (!p) return;
  // Start from "everything" so the first tap removes one kind rather than
  // silently clearing the rest.
  let allowed = Array.isArray(p.canClean) && p.canClean.length ? p.canClean.slice() : UNIT_TYPE_ORDER.slice();
  allowed = allowed.includes(typeKey) ? allowed.filter((k) => k !== typeKey) : allowed.concat(typeKey);
  if (!allowed.length) return;            // never leave someone unable to clean anything
  p.canClean = allowed.length === UNIT_TYPE_ORDER.length ? null : allowed;
  save(); render();
}
function typeOf(p) { return (p && CLEAN_TYPES[p.cleanType]) ? p.cleanType : 'inside'; }
function cycleCleanType(id) {
  const p = state.staff.find((s) => s.id === id);
  if (!p) return;
  const i = TYPE_ORDER.indexOf(typeOf(p));
  p.cleanType = TYPE_ORDER[(i + 1) % TYPE_ORDER.length];
  save(); render();
}

// --- Backup actions ---
function exportBackup() {
  try {
    const data = localStorage.getItem(STORE);
    if (!data) { showBackupMsg('Nothing to export yet.', true); return; }
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cleaning-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showBackupMsg('Backup downloaded successfully.', false);
  } catch (e) { showBackupMsg('Export failed: ' + e.message, true); }
}
function importBackup(file) {
  if (!file) return;
  if (!file.name.endsWith('.json')) { showBackupMsg('Please select a .json backup file.', true); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== 'object' || parsed === null) throw new Error('Invalid backup format');
      showConfirm('Replace all data?', 'This will overwrite everything on this device with the backup file.', () => {
        localStorage.setItem(STORE, JSON.stringify(parsed));
        location.reload();
      });
    } catch (err) { showBackupMsg('Invalid file — could not read backup data.', true); }
  };
  reader.onerror = () => { showBackupMsg('Could not read the file. Please try again.', true); };
  reader.readAsText(file);
}
function showBackupMsg(msg, isErr) {
  const el = document.getElementById('backupMsg');
  if (!el) return;
  el.textContent = msg;
  el.className = 'backup-msg ' + (isErr ? 'err' : 'ok');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// Render the type-grouped card list for the given type keys.
function unitGroups(wrap, typeKeys, emptyMsg) {
  const units = state.servicedUnits.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const relevant = units.filter(u => typeKeys.includes(unitType(u)));
  if (!relevant.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:30px 0">${emptyMsg || 'No units yet — add one above.'}</div>`));
    return;
  }
  typeKeys.forEach(tk => {
    const t = UNIT_TYPES[tk];
    const group = relevant.filter(u => unitType(u) === tk).sort((a, b) =>
      (slotRank(a) - slotRank(b))                           // 🌅 early first
      || (b.priority ? 1 : 0) - (a.priority ? 1 : 0)                              // then priority ⭐
      || String(a.time || '~').localeCompare(String(b.time || '~'))               // then earliest time
      || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
    if (!group.length) return;
    const head = el(`<div class="crew-head" style="margin-top:18px"></div>`);
    head.appendChild(el(`<div class="crew-dot" style="background:${t.color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${t.label}</div>`));
    head.appendChild(el(`<div class="crew-sub">${group.length}</div>`));
    wrap.appendChild(head);
    group.forEach(u => wrap.appendChild(servicedCard(u, onTodaysList(u))));
  });
}

// "More" menu — the less-used tabs live here so the bottom bar stays clean.
// ============================================================
// PLAN A DAY — build tomorrow's job list, then fill it with whoever badges in.
// ============================================================
let planDay = null;   // selected day in the Plan view (null => tomorrow)
// Anchored to the work day, not the clock day: at 00:20 the crew is still on the
// round that started last night, so "tomorrow" must not skip a day under them.
const tomorrowKey = () => shiftDay(workToday(), 1);
function curPlanDay() { return planDay || tomorrowKey(); }
// Tomorrow's list, computed from the schedule instead of typed in by hand. Rooms
// come from their own cycle (daily / every other day / weekly), interior areas
// from whether their period is still outstanding. Overdue work is carried in and
// flagged rather than quietly dropped.
function suggestedJobsFor(day) {
  const out = [];
  (state.servicedUnits || []).forEach(u => {
    if (!dueOnDay(u, day)) return;
    const due = lastCleanDate(u) ? nextDueDate(u) : null;
    out.push({
      kind: 'unit', id: u.id, label: 'Unit ' + u.unit,
      group: UNIT_TYPES[unitType(u)].label,
      why: !due ? 'No record yet' : (due < day ? 'Overdue since ' + due : (FREQ_LABEL[u.freq] || 'Daily')),
      late: !!due && due < day,
    });
  });
  areasInterior().forEach(a => {
    if (state.completions[a.id + '::' + freqKeyOn(a.freq, day)]) return;
    out.push({ kind: 'area', id: a.id, label: a.label, group: 'Interior areas',
               why: FREQ_LABEL[a.freq] || (FREQ[a.freq] || {}).label || '', late: false });
  });
  return out;
}
// What the office plans and looks ahead at, as opposed to what gets cleaned. Kinds
// of room switched off in "Roll Call covers" are run as their own operation on their
// own tab — Airbnb is cleaned by its own pair after the offices — so planning them
// here is noise. Tonight's round deliberately does NOT use this: the night's work is
// the night's work, whatever the morning is organised around.
function planningJobsFor(day) {
  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const jobs = suggestedJobsFor(day).filter((j) => j.kind !== 'unit' || onRollCall(unitById[j.id]));
  // For a day still to come, take the rooms the schedule will actually have reached
  // by then rather than everything outstanding now — otherwise every-other-day rooms
  // land on all seven days and each day reads as the same full list.
  const dueIds = projectedDueIdsOn(day);
  if (!dueIds) return jobs;
  return jobs.filter((j) => j.kind !== 'unit' || dueIds.has(j.id));
}
// Fill a day's plan from the schedule. Additive: anything already on the plan
// keeps its assignee, so seeding can never wipe a hand-made list.
function applySuggestions(day, jobs) {
  const plan = getPlan(day);
  let added = 0;
  jobs.forEach(s => {
    const k = planKey(s.kind, s.id);
    if (plan[k]) return;
    // `auto` records that the schedule put this here, not a person. Only an
    // auto-placed job may be taken away again without asking.
    plan[k] = { kind: s.kind, refId: s.id, label: s.label, assignedTo: null, auto: true };
    added++;
  });
  return added;
}
// Lay a future day out by itself: who is rostered on, what is due, and an even split
// between them. Nobody has badged in for a day that hasn't happened, so this reads
// the rota where the morning reads the door — otherwise the rules are the same ones:
// the times customers asked for come first and get spread, then load, then don't give
// somebody the room they cleaned last time, and finally even out whatever is lopsided.
//
// Communal areas are left alone on purpose, as auto-assign leaves them alone: an area
// is a walk of the building rather than a room on a count, and who does it is a call
// for the morning.
function autoPlanDay(day) {
  const plan = getPlan(day);
  const crew = cleaningStaff().filter((p) => worksOnDay(p, day))
    .slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (!crew.length) return { assigned: 0, crew: 0, reason: 'nobody is rostered on' };
  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const keys = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && unitById[plan[k].refId]);
  if (!keys.length) return { assigned: 0, crew: crew.length, reason: 'nothing on the plan' };

  const order = crew.map((p) => p.id);
  const staffById = {};
  crew.forEach((p) => { staffById[p.id] = p; });
  const load = {}, slotLoad = { early: {}, late: {} };
  order.forEach((id) => { load[id] = 0; slotLoad.early[id] = 0; slotLoad.late[id] = 0; });
  const roomOf = (k) => unitById[plan[k].refId];
  const ableFor = (u) => order.filter((id) => canCleanUnit(staffById[id], u));
  const repeats = (id, u) => (u.lastCleanedBy && id === u.lastCleanedBy) ? 1 : 0;

  keys.forEach((k) => { plan[k].assignedTo = null; });
  const deal = (slot) => {
    keys.filter((k) => !plan[k].assignedTo && (slot ? timeSlot(roomOf(k)) === slot : true)).forEach((k) => {
      const u = roomOf(k);
      const pick = ableFor(u).slice().sort((a, b) =>
        (slot ? slotLoad[slot][a] - slotLoad[slot][b] : 0)
        || (load[a] - load[b])
        || (repeats(a, u) - repeats(b, u))
        || (order.indexOf(a) - order.indexOf(b)))[0];
      if (!pick) return;                               // nobody rostered on is cleared for it
      plan[k].assignedTo = pick; load[pick] += 1;
      if (slot) slotLoad[slot][pick] += 1;
    });
  };
  deal('early'); deal('late'); deal(null);

  // Even it out, exactly as the morning does. A room the customer asked a time for
  // stays where it is; that was their decision, not a balancing one.
  const movable = (k) => timeSlot(roomOf(k)) === 'any';
  for (let guard = keys.length * 4; guard > 0; guard -= 1) {
    const ranked = order.slice().sort((a, b) => load[a] - load[b]);
    const hi = ranked[ranked.length - 1];
    if (load[hi] - load[ranked[0]] <= 1) break;
    let done = false;
    for (const lo of ranked) {
      if (load[hi] - load[lo] <= 1) break;
      const cands = keys.filter((k) => plan[k].assignedTo === hi && movable(k) && canCleanUnit(staffById[lo], roomOf(k)));
      const move = cands.find((k) => !repeats(lo, roomOf(k))) || cands[0];
      if (!move) continue;
      plan[move].assignedTo = lo; load[hi] -= 1; load[lo] += 1; done = true; break;
    }
    if (!done) break;
  }
  save();
  return { assigned: keys.filter((k) => plan[k].assignedTo).length, crew: crew.length };
}

// Seed a day once, the first time it's looked at. Recorded per day so that
// clearing a plan on purpose stays cleared instead of springing back on re-render.
// The hand-out goes in at the same time: a plan nobody is named on is half a plan,
// and the whole point is that tomorrow is already laid out without being asked.
function seedPlanOnce(day) {
  if (!state.planSeeded) state.planSeeded = {};
  if (state.planSeeded[day]) return 0;
  state.planSeeded[day] = true;
  const added = applySuggestions(day, planningJobsFor(day));
  // Today is the morning's business — the door reader decides who is actually in,
  // and overwriting that from a rota would undo real hand-outs.
  if (day !== todayKey() && added) autoPlanDay(day);
  save();
  return added;
}
// Build a day again from scratch. A day is seeded once and then left alone, which is
// right for a plan somebody has edited — but it also means a day built under an older
// idea of what was due keeps that list for good. Anything already opened before the
// every-other-day fix still carries the full room list, and no amount of re-opening
// will correct it. This re-syncs the rooms to what the schedule now says and hands
// them out again.
function rebuildPlanDay(day) {
  const plan = getPlan(day);
  const want = planningJobsFor(day);
  const wantKeys = new Set(want.map((s) => planKey(s.kind, s.id)));
  let removed = 0;
  Object.keys(plan).forEach((k) => {
    // Only rooms are re-synced. A communal area put on a day by hand was somebody's
    // decision, and the schedule has no opinion to overrule it with.
    if (plan[k].kind !== 'unit') return;
    if (!wantKeys.has(k)) { delete plan[k]; removed += 1; }
  });
  const added = applySuggestions(day, want);
  const dealt = (day === todayKey()) ? { assigned: 0 } : autoPlanDay(day);
  save();
  return { added, removed, assigned: dealt.assigned || 0 };
}

// Break a clump of same-frequency rooms into equal groups, one group starting each
// day of the cycle. Eleven every-other-day rooms that all fall due together give
// 23 rooms one day and 12 the next; split five and six across two days and every day
// is about 17. Only ever holds a room back — a clean is never pulled forward — and
// the hold lapses as soon as the room is done, so the new rhythm carries itself.
function staggerFrequencyGroup(freqKeyName, dryRun) {
  const start = workToday();
  const rooms = (state.servicedUnits || [])
    .filter((u) => onRollCall(u) && !u.paused && (u.freq || 'daily') === freqKeyName && unitDueToday(u))
    .slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const span = FREQ_DAYS[freqKeyName] || 1;
  if (rooms.length < 2 || span < 2) return { moved: 0, groups: [] };
  const groups = [];
  for (let g = 0; g < span; g += 1) groups.push([]);
  rooms.forEach((u, i) => groups[i % span].push(u));
  let moved = 0;
  groups.forEach((grp, g) => {
    const day = shiftDay(start, g);
    grp.forEach((u) => {
      if (g === 0) {
        if (!dryRun) { delete u.holdUntil; delete u.alsoCleanOn; }   // first group is due today as normal
        return;
      }
      // Every group after the first gets an extra clean on its day. They are all due
      // today too, so those rooms are cleaned twice inside the cycle — once now, once
      // on their new day — and come out of it landing on the opposite day for good.
      if (!dryRun) { u.alsoCleanOn = day; delete u.holdUntil; }
      moved += 1;
    });
  });
  if (!dryRun) { save(); render(); }
  return { moved, groups: groups.map((grp, g) => ({ day: shiftDay(start, g), units: grp.map((u) => u.unit) })) };
}

// ============================================================
// TOMORROW, WITHOUT BEING ASKED
// The Plan tab lays a day out the moment somebody opens it. That is too late to
// be useful: if nobody opens it, tomorrow does not exist until tomorrow. This
// builds it on app open instead, and — because a day was only ever laid out once,
// then left alone for good — brings it back in line every time it is looked at,
// so a plan drawn up this morning still matches what the schedule says tonight.
// ============================================================
function ensureDayPlanned(day) {
  if (!state.planSeeded) state.planSeeded = {};
  if (!state.planSeeded[day]) return { day, seeded: seedPlanOnce(day), added: 0, removed: 0, assigned: 0 };
  return { day, seeded: 0, ...resyncPlanDay(day) };
}
function ensureTomorrowPlanned() { return ensureDayPlanned(tomorrowKey()); }

// ============================================================
// PLAN THE WEEK AHEAD — one button
// Getting a week ready meant levelling the fortnight, then opening each day in
// turn so it would lay itself out, then checking each was handed round. That is
// four or five taps and knowing which order they go in. This is the whole thing:
// level the days if they are lopsided, lay every day out from the schedule, hand
// each one to whoever is rostered on it.
// ============================================================
const PLAN_AHEAD_DAYS = 7;

// What one tap would do, worked out without changing anything.
function planAheadPreview(nDays) {
  const span = nDays || PLAN_AHEAD_DAYS;
  const lp = levelPlan(LEVEL_HORIZON);
  const worthLevelling = lp.moves.length > 0 && (lp.settledBefore - lp.settledAfter) >= 2;
  let toPlan = 0, days = 0;
  for (let i = 1; i <= span; i += 1) {
    const day = shiftDay(workToday(), i);
    const already = Object.keys(getPlan(day)).length;
    const want = planningJobsFor(day).length;
    if (want > already) toPlan += want - already;
    if (want || already) days += 1;
  }
  return { span, lp, worthLevelling, toPlan, days };
}

function runPlanAhead(nDays, doLevel) {
  const span = nDays || PLAN_AHEAD_DAYS;
  // Levelling first: it changes which rooms fall on which day, and laying the days
  // out before that would plan the days it is about to move.
  if (doLevel) applyLevelPlan(levelPlan(LEVEL_HORIZON));
  let jobs = 0, assigned = 0;
  for (let i = 1; i <= span; i += 1) {
    const r = ensureDayPlanned(shiftDay(workToday(), i));
    jobs += (r.seeded || 0) + (r.added || 0);
    assigned += (r.assigned || 0);
  }
  save();
  return { jobs, assigned, span };
}

// Plan tomorrow, in one press, and land on it ready to be edited. Tomorrow lays
// itself out when the app opens, but there was no way to simply ASK for it — you had
// to know that, trust it, and go looking. This is the asking.
//
// It never wipes an edit: anything already on the day stays, anything already handed
// out keeps its cleaner. To start the day over there is "Rebuild this day" below.
function planTomorrow() {
  const day = tomorrowKey();
  ensureDayPlanned(day);
  const plan = getPlan(day);
  const loose = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && !plan[k].assignedTo);
  if (loose.length) assignNewPlanJobs(day, loose);
  save();
  planDay = day;                       // land on it, so the next tap is an edit
  const rooms = Object.values(plan).filter((v) => v.kind === 'unit');
  const named = rooms.filter((v) => v.assignedTo).length;
  hikSyncMsg = rooms.length
    ? { text: 'Tomorrow is planned — ' + rooms.length + ' room' + (rooms.length === 1 ? '' : 's') + ', '
        + named + ' handed out. Change anything below.' }
    : { err: true, text: 'Nothing is due tomorrow. Add a job below if something needs doing.' };
  render();
}

function planAhead() {
  const pv = planAheadPreview(PLAN_AHEAD_DAYS);
  const bits = [];
  if (pv.worthLevelling) {
    const extras = pv.lp.moves.filter((m) => m.kind === 'extra').length;
    bits.push('Evens the days out — the heaviest goes from ' + pv.lp.settledBefore + ' rooms to '
      + pv.lp.settledAfter + ', by spreading ' + pv.lp.moves.length + ' across the cycle'
      + (extras ? ' (' + extras + ' get one extra clean to break up the clump)' : '')
      + '. Nothing waits longer than its frequency.');
  }
  bits.push(pv.toPlan
    ? 'Lays out the next ' + pv.span + ' days — about ' + pv.toPlan + ' more job'
      + (pv.toPlan === 1 ? '' : 's') + ' from the schedule — and hands each day to whoever is rostered on it.'
    : 'Lays out the next ' + pv.span + ' days and hands each one to whoever is rostered on it.');
  bits.push('Anything already handed out stays where it is.');
  showConfirm(
    'Get the next ' + pv.span + ' days ready?',
    bits.join(' '),
    () => {
      const r = runPlanAhead(PLAN_AHEAD_DAYS, pv.worthLevelling);
      hikSyncMsg = { text: 'Next ' + r.span + ' days are ready — ' + r.jobs + ' job'
        + (r.jobs === 1 ? '' : 's') + ' laid out, ' + r.assigned + ' handed round.' };
      render();
    },
    'Get them ready',
    'safe'
  );
}

// Bring a already-laid-out day back in line with what the schedule now says, without
// undoing anybody's decisions. A room that has become due is added and handed to
// whoever is carrying least; a room that is no longer due is dropped only if the
// schedule was what put it there and nobody has been given it. Assignments already
// made are never shuffled — that is the difference between this and a rebuild.
function resyncPlanDay(day) {
  const plan = getPlan(day);
  // Emptied on purpose ("Clear this day's plan") — an automatic refill would
  // override a deliberate act, so a cleared day stays cleared.
  if (!Object.keys(plan).length) return { added: 0, removed: 0, assigned: 0 };

  const want = planningJobsFor(day);
  const wantKeys = new Set(want.map((j) => planKey(j.kind, j.id)));
  let removed = 0;
  Object.keys(plan).forEach((k) => {
    if (plan[k].kind !== 'unit') return;        // an area on a day was somebody's call
    if (wantKeys.has(k) || plan[k].assignedTo || !plan[k].auto) return;
    delete plan[k]; removed += 1;
  });

  const dropped = droppedFor(day);
  const added = [];
  want.forEach((j) => {
    const k = planKey(j.kind, j.id);
    if (plan[k] || (dropped && dropped[k])) return;   // already there, or taken off by hand
    plan[k] = { kind: j.kind, refId: j.id, label: j.label, assignedTo: null, auto: true };
    added.push(k);
  });

  const assigned = assignNewPlanJobs(day, added);
  if (removed || added.length) save();
  return { added: added.length, removed, assigned };
}

// Hand out only the jobs just added, fitting them around what is already dealt.
// autoPlanDay deals the whole day from scratch and would wipe existing hand-outs.
function assignNewPlanJobs(day, keys) {
  const plan = getPlan(day);
  const roomKeys = keys.filter((k) => plan[k] && plan[k].kind === 'unit');
  if (!roomKeys.length) return 0;
  const crew = cleaningStaff().filter((p) => worksOnDay(p, day))
    .slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (!crew.length) return 0;

  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const staffById = {}, load = {};
  const slotLoad = { early: {}, late: {} };
  crew.forEach((p) => { staffById[p.id] = p; load[p.id] = 0; slotLoad.early[p.id] = 0; slotLoad.late[p.id] = 0; });
  // Count what each of them is already carrying, so the new work lands on whoever
  // has the least rather than on top of the person who is already fullest. Counted
  // per time slot as well as overall: an even total is no use if one person is
  // holding every room the customer asked for first thing.
  Object.keys(plan).forEach((k) => {
    const who = plan[k].assignedTo;
    if (!who || load[who] === undefined) return;
    load[who] += 1;
    const u = plan[k].kind === 'unit' ? unitById[plan[k].refId] : null;
    const slot = u ? timeSlot(u) : 'any';
    if (slot !== 'any') slotLoad[slot][who] += 1;
  });

  // Asked-for times go out first and are spread on their own count, exactly as the
  // morning deals them — otherwise the early rooms stack on whoever happens to be
  // lightest overall and one person carries the whole first hour.
  const order = crew.map((p) => p.id);
  const give = (k) => {
    const u = unitById[plan[k].refId];
    if (!u) return false;
    const slot = timeSlot(u);
    const pick = order
      .filter((id) => canCleanUnit(staffById[id], u))
      .sort((a, b) => (slot !== 'any' ? slotLoad[slot][a] - slotLoad[slot][b] : 0)
        || (load[a] - load[b])
        || ((u.lastCleanedBy === a ? 1 : 0) - (u.lastCleanedBy === b ? 1 : 0))
        || (order.indexOf(a) - order.indexOf(b)))[0];
    if (!pick) return false;                    // nobody rostered on is cleared for it
    plan[k].assignedTo = pick; load[pick] += 1;
    if (slot !== 'any') slotLoad[slot][pick] += 1;
    return true;
  };
  let n = 0;
  const inSlot = (s) => roomKeys.filter((k) => unitById[plan[k].refId] && timeSlot(unitById[plan[k].refId]) === s);
  [...inSlot('early'), ...inSlot('late'), ...inSlot('any')].forEach((k) => { if (give(k)) n += 1; });
  return n;
}

function getPlan(day) { if (!state.plans) state.plans = {}; if (!state.plans[day]) state.plans[day] = {}; return state.plans[day]; }
function planJobs(day) { return Object.entries(getPlan(day)).map(([key, v]) => ({ key, ...v })); }
const planKey = (kind, id) => kind + ':' + id;
// All cleanable things you can put on a plan: serviced units (by type) + areas.
function planPool() {
  const rooms = (state.servicedUnits || []).map(u => ({ kind: 'unit', id: u.id, label: 'Unit ' + u.unit, group: UNIT_TYPES[unitType(u)].label }));
  const areas = (state.areas || []).map(a => ({ kind: 'area', id: a.id, label: a.label, group: a.kind === 'exterior' ? 'Exterior areas' : 'Interior areas' }));
  return [...rooms, ...areas];
}
function togglePlanJob(day, kind, id, label) {
  const plan = getPlan(day); const k = planKey(kind, id);
  // Taking a job off a day is a decision, and it has to outlast the next re-sync —
  // otherwise the schedule quietly puts it back and it looks like the tap did nothing.
  if (plan[k]) { delete plan[k]; markPlanDropped(day, k); }
  else { plan[k] = { kind, refId: id, label, assignedTo: null }; unmarkPlanDropped(day, k); }
  save(); render();
}
function droppedFor(day) { if (!state.planDropped) state.planDropped = {}; return state.planDropped[day] || null; }
function markPlanDropped(day, k) {
  if (!state.planDropped) state.planDropped = {};
  if (!state.planDropped[day]) state.planDropped[day] = {};
  state.planDropped[day][k] = true;
}
function unmarkPlanDropped(day, k) {
  const d = droppedFor(day);
  if (!d) return;
  delete d[k];
  if (!Object.keys(d).length) delete state.planDropped[day];
}
function setPlanAssignee(day, k, pid) { const plan = getPlan(day); if (plan[k]) plan[k].assignedTo = pid || null; save(); render(); }
function clearPlanDay(day) { showConfirm('Clear this day’s plan?', 'Removes every planned job for ' + day + '.', () => { if (state.plans) delete state.plans[day]; save(); render(); }); }
// Auto-spread the planned jobs evenly across whoever's clocked in.
function autoAssignPlan(day) {
  const inIds = Object.keys(hikArrivals).filter(id => (state.staff || []).some(s => s.id === id));
  if (!inIds.length) { hikSyncMsg = { err: true, text: 'No one clocked in yet to assign these jobs to.' }; render(); return; }
  const jobs = planJobs(day);
  if (!jobs.length) { hikSyncMsg = { err: true, text: 'No jobs planned for this day yet — add some below.' }; render(); return; }
  const plan = getPlan(day);
  const load = {}; inIds.forEach(id => load[id] = 0);
  jobs.forEach(j => { const pick = inIds.slice().sort((a, b) => load[a] - load[b])[0]; plan[j.key].assignedTo = pick; load[pick]++; });
  hikSyncMsg = { text: `Spread ${jobs.length} jobs across ${inIds.length} clocked-in.` };
  save(); render();
}

function viewPlan() {
  const wrap = el('<div class="body"></div>');
  const day = curPlanDay();
  const isTomorrow = day === tomorrowKey();
  const isToday = day === todayKey();

  // Fill the day from the schedule before drawing it, so the list is already
  // there on arrival instead of being an empty screen the office has to type in.
  // A day already laid out is re-checked rather than left as drawn, so what is on
  // screen is what the schedule says now — not what it said when it was first opened.
  const seeded = seedPlanOnce(day);
  const resynced = (!seeded && day > todayKey()) ? resyncPlanDay(day) : { added: 0, removed: 0, assigned: 0 };

  // The one thing this tab is opened to do. First, and on its own, so it is not
  // something to find among the week's controls.
  {
    const btn = el(`<button class="add-btn" style="background:#15803d;margin-bottom:4px;font-size:15px;padding:13px">`
      + `⚡ Plan tomorrow's rooms</button>`);
    btn.onclick = planTomorrow;
    wrap.appendChild(btn);
    wrap.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-bottom:14px">`
      + `Lays tomorrow out from the schedule and hands it to whoever is rostered on — then edit it below. `
      + `Nothing you have already changed is touched.</div>`));
  }

  // THE DAYS AHEAD — the week at a glance before dropping into any one day, so a
  // heavy Thursday is visible on Monday rather than on Thursday morning.
  {
    const ahead = scheduleAhead(7);
    const peak = Math.max(1, ...ahead.map((d) => d.count));
    const box = el('<div style="margin-bottom:16px"></div>');
    box.appendChild(el(`<div class="section-label">The week ahead</div>`));
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 10px">`
      + `Rooms due each day if each day's work gets done on the day. Tap one to plan it.</div>`));
    ahead.forEach((d, i) => {
      const dt = new Date(d.day + 'T00:00:00');
      const lbl = i === 0 ? 'Today' : i === 1 ? 'Tomorrow'
        : dt.toLocaleDateString('en-US', { weekday: 'long' });
      const row = el(`<div class="su-card" style="display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer${d.day === day ? ';border-color:#0284c7' : ''}"></div>`);
      const left = el('<div style="flex:0 0 92px;min-width:0"></div>');
      left.appendChild(el(`<div style="font-size:13px;font-weight:800;color:#0f1a27">${esc(lbl)}</div>`));
      left.appendChild(el(`<div style="font-size:10px;color:#5f7189;font-weight:600">${esc(dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }))}</div>`));
      row.appendChild(left);
      // A bar reads faster than a number when the question is "which day is heavy".
      const barWrap = el('<div style="flex:1;min-width:0"></div>');
      const bar = el('<div style="height:8px;background:#eef2f7;border-radius:4px;overflow:hidden"></div>');
      const heavy = d.count >= peak * 0.85 && peak > 1;
      bar.appendChild(el(`<div style="height:100%;width:${Math.round((d.count / peak) * 100)}%;background:${heavy ? '#b45309' : '#0284c7'}"></div>`));
      barWrap.appendChild(bar);
      const parts = Object.keys(d.byType).sort().map((t) => d.byType[t] + ' ' + UNIT_TYPES[t].label.toLowerCase());
      barWrap.appendChild(el(`<div style="font-size:10px;color:#5f7189;font-weight:600;margin-top:4px">${esc(parts.join(' · ') || 'nothing due')}</div>`));
      row.appendChild(barWrap);
      row.appendChild(el(`<div style="flex:0 0 auto;font-size:16px;font-weight:800;color:${heavy ? '#b45309' : '#0f1a27'}">${d.count}</div>`));
      row.onclick = () => { planDay = d.day; render(); };
      box.appendChild(row);
    });
    // One button for the whole week: level the days, lay them out, hand them round.
    // Doing it in three separate taps meant knowing which order they went in.
    {
      const pv = planAheadPreview(PLAN_AHEAD_DAYS);
      const btn = el(`<button class="add-btn" style="background:#b45309;margin-top:8px">`
        + `⚡ Get the next ${pv.span} days ready</button>`);
      btn.onclick = planAhead;
      box.appendChild(btn);
      box.appendChild(el(`<div style="font-size:10px;color:#5f7189;margin-top:4px">`
        + (pv.worthLevelling
          ? `Evens the days out (heaviest ${pv.lp.settledBefore} → ${pv.lp.settledAfter} rooms), lays every day out `
          : `Lays every day out `)
        + `from the schedule and hands it to whoever is rostered on. Nothing already handed out is moved.</div>`));
    }
    wrap.appendChild(box);
  }

  wrap.appendChild(el(`<div class="note">Planned from the schedule — daily rooms, every-other-day rooms that fall due, and anything overdue. Add or remove below, then assign whoever badges in.</div>`));
  if (seeded) wrap.appendChild(el(`<div class="section-label" style="color:#15803d">Filled in ${seeded} job${seeded === 1 ? '' : 's'} due on ${esc(day)}.</div>`));

  // Day picker
  const dayRow = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"></div>');
  const dayIn = el(`<input type="date" value="${esc(day)}" min="${esc(todayKey())}" style="flex:1;min-width:0;background:#ffffff;color:#15202e;border:1px solid #d8e0ea;border-radius:8px;padding:9px 10px;font-size:14px">`);
  dayIn.onchange = (e) => { planDay = e.target.value || null; render(); };
  dayRow.appendChild(dayIn);
  wrap.appendChild(dayRow);
  const quick = el('<div style="display:flex;gap:6px;margin-bottom:14px"></div>');
  const jump = (lbl, key, on) => { const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:1">${lbl}</button>`); b.onclick = () => { planDay = key; render(); }; return b; };
  quick.appendChild(jump('Today', todayKey(), isToday));
  quick.appendChild(jump('Tomorrow', tomorrowKey(), isTomorrow));
  wrap.appendChild(quick);

  if (hikSyncMsg) wrap.appendChild(el(`<div class="section-label" style="color:${hikSyncMsg.err ? '#dc2626' : '#15803d'}">${esc(hikSyncMsg.text)}</div>`));

  // WHO IS ON, AND WHO HAS WHAT — a future day is laid out from the rota the first
  // time it is opened, so this is normally just reporting what is already done.
  // Today is left to the morning: the door reader decides who is actually in.
  if (!isToday) {
    const onDuty = cleaningStaff().filter((p) => worksOnDay(p, day));
    const jobs = planJobs(day);
    const roomJobs = jobs.filter((j) => j.kind === 'unit');
    const named = roomJobs.filter((j) => j.assignedTo).length;
    const box = el('<div style="margin-bottom:14px"></div>');
    box.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600">`
      + `<b style="color:${onDuty.length ? '#15803d' : '#b45309'}">${onDuty.length}</b> rostered on`
      + (onDuty.length ? ` · ${esc(onDuty.map((p) => p.name.split(' ')[0]).join(', '))}` : '')
      + `</div>`));
    if (roomJobs.length) {
      box.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin-top:4px">`
        + `${named} of ${roomJobs.length} rooms already handed out</div>`));
    }
    // Handing the rooms out lives with the jobs it hands out, below — one
    // auto-assign for the day rather than two buttons doing nearly the same thing
    // in two places.
    // A day built before the schedule changed keeps whatever it was given, so there
    // has to be a way to say "do this one again from scratch".
    const rb = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:6px;border-color:#b45309;color:#b45309">⟳ Rebuild this day from the schedule</button>`);
    rb.onclick = () => {
      showConfirm(
        'Rebuild ' + day + '?',
        'The rooms on this day are set back to exactly what the schedule says is due, and handed out again. '
          + 'Rooms you added or removed by hand for this day are lost. Communal areas are left as they are.',
        () => {
          const r = rebuildPlanDay(day);
          hikSyncMsg = { text: 'Rebuilt: ' + r.added + ' added, ' + r.removed + ' dropped, ' + r.assigned + ' handed out.' };
          render();
        },
        'Rebuild it',
        'safe'
      );
    };
    box.appendChild(rb);
    wrap.appendChild(box);
  }

  // Due from the schedule but not on the plan — either removed by hand, or fallen
  // due since the day was seeded. Offered back rather than silently re-added.
  const plan0 = getPlan(day);
  const missing = planningJobsFor(day).filter(s => !plan0[planKey(s.kind, s.id)]);
  if (missing.length) {
    wrap.appendChild(el(`<div class="section-label" style="margin-top:6px;color:#b45309">Due but not planned (${missing.length})</div>`));
    const addAll = el(`<button class="add-btn" style="background:#b45309;margin-bottom:8px">＋ Add all ${missing.length} due job${missing.length === 1 ? '' : 's'}</button>`);
    addAll.onclick = () => { applySuggestions(day, missing); save(); render(); };
    wrap.appendChild(addAll);
    const box = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px"></div>');
    missing.forEach(s => {
      const b = el(`<button class="freqmini" style="flex:0 0 auto;padding:8px 12px${s.late ? ';border-color:#b45309;color:#b45309' : ''}">+ ${esc(s.label)} · ${esc(s.why)}</button>`);
      b.onclick = () => togglePlanJob(day, s.kind, s.id, s.label);
      box.appendChild(b);
    });
    wrap.appendChild(box);
  }

  // Planned jobs + assignment
  const jobs = planJobs(day);
  wrap.appendChild(el(`<div class="section-label" style="margin-top:6px">Planned jobs (${jobs.length})</div>`));
  if (!jobs.length) {
    wrap.appendChild(el(`<div class="empty" style="padding:14px 0">Nothing due on this day, and nothing added by hand.</div>`));
  } else {
    // One auto-assign, which reads the right thing for the day it is on. Today the
    // door reader decides who is in; on a day that has not happened nobody has
    // badged in at all, and the old button simply failed with "no one clocked in".
    const auto = el(`<button class="add-btn" style="background:#15803d;margin-bottom:6px">`
      + (isToday ? `⚡ Auto-assign to who's clocked in` : `⚡ Auto-assign to whoever is rostered on`)
      + `</button>`);
    auto.onclick = () => {
      if (isToday) { autoAssignPlan(day); return; }
      const r = autoPlanDay(day);
      hikSyncMsg = r.assigned
        ? { text: 'Handed ' + r.assigned + ' room' + (r.assigned === 1 ? '' : 's') + ' to the ' + r.crew + ' rostered on that day.' }
        : { err: true, text: 'Nothing to hand out — ' + (r.reason || 'no rooms on the plan') + '.' };
      render();
    };
    wrap.appendChild(auto);
    const clr = el(`<button class="reset-btn">Clear this day's plan</button>`);
    clr.onclick = () => clearPlanDay(day);
    wrap.appendChild(clr);

    const arrivedIds = new Set(Object.keys(hikArrivals));
    const staff = cleaningStaff();
    jobs.forEach(j => {
      const card = el(`<div class="su-card"></div>`);
      const top = el(`<div class="su-top"></div>`);
      top.appendChild(el(`<div style="flex:1;min-width:0"><div class="su-unit" style="font-size:15px">${esc(j.label)}</div></div>`));
      const rm = el(`<button class="su-rm">✕</button>`);
      rm.onclick = () => togglePlanJob(day, j.kind, j.refId, j.label);
      top.appendChild(rm);
      card.appendChild(top);
      const sel = el(`<select class="area-select" style="margin-top:8px"></select>`);
      sel.appendChild(el(`<option value="">— Assign someone —</option>`));
      staff.slice().sort((a, b) => (arrivedIds.has(b.id) ? 1 : 0) - (arrivedIds.has(a.id) ? 1 : 0))
        .forEach(p => {
          const o = el(`<option value="${esc(p.id)}">${arrivedIds.has(p.id) ? '✓ ' : ''}${esc(p.name)}</option>`);
          if (j.assignedTo === p.id) o.setAttribute('selected', '');
          sel.appendChild(o);
        });
      sel.onchange = (e) => setPlanAssignee(day, j.key, e.target.value);
      card.appendChild(sel);
      wrap.appendChild(card);
    });
  }

  // Add jobs — grouped pool with toggles
  wrap.appendChild(el(`<div class="section-label" style="margin-top:20px">Add jobs to this day</div>`));
  const plan = getPlan(day);
  const pool = planPool();
  if (!pool.length) {
    wrap.appendChild(el(`<div class="empty">No rooms or areas yet — add some on the Airbnb / Buildings / Offices tabs first.</div>`));
  } else {
    const groups = [...new Set(pool.map(x => x.group))];
    groups.forEach(g => {
      wrap.appendChild(el(`<div class="section-label" style="margin-top:12px;color:#5b6a7f">${esc(g)}</div>`));
      const box = el(`<div style="display:flex;flex-wrap:wrap;gap:6px"></div>`);
      pool.filter(x => x.group === g).forEach(x => {
        const on = !!plan[planKey(x.kind, x.id)];
        const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:0 0 auto;padding:8px 12px">${on ? '✓ ' : '+ '}${esc(x.label)}</button>`);
        b.onclick = () => togglePlanJob(day, x.kind, x.id, x.label);
        box.appendChild(b);
      });
      wrap.appendChild(box);
    });
  }
  return wrap;
}

// A single consolidated list of every room on the cleaning list.
function viewRooms() {
  const wrap = el('<div class="body"></div>');
  const units = (state.servicedUnits || []).slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  wrap.appendChild(el(`<div class="note">Every room on the cleaning list — <b>${units.length}</b> total. Tap <b>Daily</b> / <b>Every other day</b> / <b>Weekly</b> on any room to change how often it&rsquo;s cleaned, or use <b>Set all</b> to flip a whole group.</div>`));
  const pastBtn = el(`<button class="add-btn" style="width:100%;margin-bottom:14px">＋ Record a past day</button>`);
  pastBtn.onclick = () => openBackdate(yesterdayKey());
  wrap.appendChild(pastBtn);
  if (!units.length) { wrap.appendChild(el(`<div class="empty">No rooms yet.</div>`)); return wrap; }

  // A whole frequency group falling due on the same day is what makes the week swing
  // between a light day and a heavy one. "Even out the days" can't fix it: it delays a
  // room from its last clean, and rooms that come due together are overdue together,
  // so there is nothing for the delay to act on. Splitting them needs a hold-back.
  ['eod', 'weekly'].forEach((fk) => {
    const span = FREQ_DAYS[fk] || 1;
    const dueNow = (state.servicedUnits || []).filter((u) =>
      onRollCall(u) && !u.paused && (u.freq || 'daily') === fk && unitDueToday(u));
    if (span < 2 || dueNow.length <= span) return;
    const box = el('<div class="su-card" style="margin-bottom:14px;padding:12px"></div>');
    box.appendChild(el(`<div style="font-size:12px;font-weight:800;color:#b45309">`
      + `⚠ all ${dueNow.length} ${esc((FREQ_LABEL[fk] || fk).toLowerCase())} rooms are due the same day</div>`));
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:4px">`
      + `Clean them together and they stay together, so the week keeps swinging between a heavy day and a light one.</div>`));
    const btn = el(`<button class="freqmini" style="width:100%;margin-top:8px;padding:9px;border-color:#7c3aed;color:#7c3aed">⇄ Split them over ${span} days</button>`);
    btn.onclick = () => {
      const preview = staggerFrequencyGroup(fk, true);
      const extra = preview.groups.slice(1).reduce((n, g) => n + g.units.length, 0);
      showConfirm(
        'Split ' + dueNow.length + ' rooms over ' + span + ' days?',
        preview.groups.map((g, i) => (i === 0 ? 'Today, as normal' : 'Today AND again on ' + g.day) + ': ' + g.units.join(', ')).join('\n\n')
          + '\n\nThey are all cleaned today. ' + extra + ' of them are then cleaned again the next day, '
          + 'which puts them on the opposite day from then on. Nothing is delayed and nothing is skipped — '
          + 'it costs ' + extra + ' extra cleans once, and the rhythm carries itself afterwards.',
        () => { staggerFrequencyGroup(fk); },
        'Split them',
        'safe'
      );
    };
    box.appendChild(btn);
    wrap.appendChild(box);
  });
  const groups = {};
  units.forEach(u => { const t = unitType(u); (groups[t] = groups[t] || []).push(u); });
  ['airbnb', 'office', 'building'].forEach(tk => {
    const list = groups[tk]; if (!list || !list.length) return;
    const t = UNIT_TYPES[tk];
    const head = el(`<div class="crew-head" style="margin-top:16px"></div>`);
    head.appendChild(el(`<div class="crew-dot" style="background:${t.color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${t.label}</div>`));
    head.appendChild(el(`<div class="crew-sub">${list.length}</div>`));
    wrap.appendChild(head);

    // Group-level schedule flip + a breakdown of what this group is currently on,
    // so an odd room out ("13 on every-other-day") is visible instead of hidden.
    const ids = list.map(u => u.id);
    const tally = {};
    list.forEach(u => { const f = u.freq || 'daily'; tally[f] = (tally[f] || 0) + 1; });
    const spread = Object.keys(tally).sort((a, b) => tally[b] - tally[a])
      .map(f => `${tally[f]} ${FREQ_LABEL[f] || f}`).join(' · ');
    const bulk = el(`<div style="margin:6px 0 4px"></div>`);
    bulk.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:6px">Now: ${esc(spread)} · <b>Set all:</b></div>`));
    const bulkBtns = el(`<div style="display:flex;gap:6px"></div>`);
    [['daily', 'Daily'], ['eod', 'Every other day'], ['weekly', 'Weekly']].forEach(([fk, lbl]) => {
      const allOn = tally[fk] === list.length;
      const b = el(`<button class="freqmini ${allOn ? 'on' : ''}">${lbl}</button>`);
      b.onclick = () => setUnitsFreqBulk(ids, fk, t.label.toLowerCase());
      bulkBtns.appendChild(b);
    });
    bulk.appendChild(bulkBtns);

    const cleanedCount = list.filter(cleanedToday).length;
    const markRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
    markRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:0 0 auto">`
      + `${cleanedCount} of ${list.length} cleaned today · <b>Mark all:</b></div>`));
    const markToday = el(`<button class="freqmini ${cleanedCount === list.length ? 'on' : ''}" style="flex:0 0 auto;padding:6px 10px">✓ Cleaned today</button>`);
    markToday.onclick = () => setUnitsLastCleanedBulk(ids, todayKey(), t.label.toLowerCase());
    markRow.appendChild(markToday);
    // A past night can't be bulk-stamped with today's assignment — it goes through
    // the sheet, where the names come from who badged in that day.
    const markPast = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">↺ A past day…</button>`);
    markPast.onclick = () => openBackdateForType(tk, yesterdayKey());
    markRow.appendChild(markPast);
    bulk.appendChild(markRow);

    // Show the coming week's load, and offer to flatten it when one day spikes.
    const upcoming = {};
    list.forEach(u => { const d = nextDueDate(u) || todayKey(); upcoming[d] = (upcoming[d] || 0) + 1; });
    const days = Object.keys(upcoming).sort().slice(0, 4);
    const dayLabel = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    if (days.length) {
      const peak = Math.max(...days.map(d => upcoming[d]));
      const lightest = Math.min(...days.map(d => upcoming[d]));
      // Everything landing on ONE day is the worst case, not a balanced one —
      // don't let a single-day spread look like nothing is wrong.
      const allOnOneDay = days.length === 1 && upcoming[days[0]] > 1;
      const lopsided = allOnOneDay || peak - lightest > 1;
      const loadRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
      loadRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:0 0 auto">Next days: `
        + days.map(d => `<b>${upcoming[d]}</b> ${dayLabel(d)}`).join(' · ')
        + `</div>`));
      if (lopsided && balancePlan(ids).length) {
        loadRow.appendChild(el(`<div style="flex-basis:100%;height:0"></div>`));
        loadRow.appendChild(el(`<div style="font-size:11px;color:#b45309;font-weight:700;flex:0 0 auto">`
          + (allOnOneDay ? `⚠ all ${upcoming[days[0]]} land on ${dayLabel(days[0])}` : `⚠ ${peak} on one day vs ${lightest} on another`)
          + `</div>`));
        const balBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">⚖ Even out the days</button>`);
        balBtn.onclick = () => balanceUnitsAcrossDays(ids, t.label.toLowerCase());
        loadRow.appendChild(balBtn);
      }
      bulk.appendChild(loadRow);
    }
    wrap.appendChild(bulk);

    list.forEach(u => {
      const due = unitDueToday(u);
      const nd = nextDueDate(u);
      const who = (state.staff || []).find(p => p.id === (u.usualTo || u.assignedTo));
      const lastBase = lastCleanDate(u);
      const card = el(`<div class="su-card"></div>`);

      // Row 1: number + status
      const top = el(`<div style="display:flex;align-items:center;gap:10px"></div>`);
      top.appendChild(el(`<div style="font-size:16px;font-weight:800;min-width:56px;color:#0f1a27">${esc(u.unit)}</div>`));
      const mid = el(`<div style="flex:1;min-width:0"></div>`);
      mid.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600">${esc(t.label)}${who ? ' · ' + esc(who.name.split(' ')[0]) : ''}</div>`));
      const doneToday = cleanedToday(u);
      // "Due" and "we have no idea" are different things, and mixing them makes the
      // whole list untrustworthy: a room nobody has ever recorded looks identical to
      // one that genuinely came round again today.
      const noRecord = !lastCleanDate(u);
      const dueLabel = doneToday ? '✓ Cleaned today'
        : noRecord ? 'No record yet — set when it was last cleaned'
        : due ? 'Due today'
        : nd ? 'Next: ' + new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        : '';
      const tone = doneToday ? '#15803d' : noRecord ? '#b45309' : due ? '#15803d' : '#5b6a7f';
      mid.appendChild(el(`<div style="font-size:11px;color:${tone};font-weight:600">${esc(dueLabel)}</div>`));
      top.appendChild(mid);
      card.appendChild(top);

      // Row 2: frequency chips (set while allocating — remembered per room)
      const freqRow = el(`<div class="su-ctl" style="border-top:none;padding-top:8px;margin-top:6px"></div>`);
      [['daily', 'Daily'], ['eod', 'Every other day'], ['weekly', 'Weekly']].forEach(([fk, lbl]) => {
        const b = el(`<button class="freqmini ${u.freq === fk ? 'on' : ''}">${lbl}</button>`);
        b.onclick = () => setUnitFreq(u.id, fk);
        freqRow.appendChild(b);
      });
      card.appendChild(freqRow);

      // Row 3: last-cleaned quick set
      const lcRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap"></div>`);
      lcRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600">Last cleaned:${lastBase ? ' ' + new Date(lastBase + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ' —'}</div>`));
      const yb = el(`<button class="freqmini ${lastBase === yesterdayKey() ? 'on' : ''}" style="flex:0 0 auto;padding:6px 12px">Yesterday</button>`);
      yb.onclick = () => markCleanedOn(u.id, yesterdayKey());
      const tb = el(`<button class="freqmini ${lastBase === todayKey() ? 'on' : ''}" style="flex:0 0 auto;padding:6px 12px">Today</button>`);
      tb.onclick = () => setUnitLastCleaned(u.id, todayKey());
      lcRow.appendChild(yb); lcRow.appendChild(tb);
      if (u.lastCleaned) {
        const cb = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">✕</button>`);
        cb.onclick = () => setUnitLastCleaned(u.id, null);
        lcRow.appendChild(cb);
      }
      card.appendChild(lcRow);
      wrap.appendChild(card);
    });
  });
  return wrap;
}

// What still has to be cleaned on tonight's round. The roll call is a morning
// tool; the crew works into the night, so "what's left" needs its own screen that
// uses the work day (rolling over at 3am) rather than the calendar day.
function viewTonight() {
  const wrap = el('<div class="body"></div>');
  const unitById = {};
  (state.servicedUnits || []).forEach(u => { unitById[u.id] = u; });
  const areaById = {};
  (state.areas || []).forEach(a => { areaById[a.id] = a; });

  // The list and the button that clears it read from one place, so the count on
  // the button can never disagree with the number of cards under it.
  const outstanding = tonightOutstanding();
  const day = outstanding.day;
  const jobs = outstanding.jobs;

  const dayLabel = new Date(day + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  wrap.appendChild(el(`<div class="note">Everything still outstanding for <b>${esc(dayLabel)}</b>. Rooms already cleaned today have dropped off. Tick them here as the round goes.</div>`));

  if (!jobs.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:28px 0;color:#15803d;font-weight:700">✓ Nothing outstanding — the round is done.</div>`));
    return wrap;
  }

  // CLOSE OUT THE ROUND — the whole night in one tap, at the top where it can't be
  // missed. Unlike the roll call button this does cover Airbnb: it is off the
  // morning roll call, but it is still part of tonight's work and shows in this list.
  {
    const nRooms = outstanding.rooms.length, nAreas = outstanding.areas.length;
    const allBox = el('<div style="margin-bottom:16px"></div>');
    const allBtn = el(`<button class="add-btn" style="background:#15803d;color:#ffffff">✓ Mark all ${jobs.length} as cleaned</button>`);
    allBtn.onclick = () => markTonightAllDone();
    allBox.appendChild(allBtn);
    allBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
      + `${nRooms} room${nRooms === 1 ? '' : 's'}`
      + (nAreas ? ` · ${nAreas} communal area${nAreas === 1 ? '' : 's'}` : '')
      + ` — goes straight to History, and you can un-tick any of them one by one.</div>`));
    wrap.appendChild(allBox);
  }

  const late = jobs.filter(j => j.late).length;
  wrap.appendChild(el(`<div class="section-label">${jobs.length} to clean tonight${late ? ` · <span style="color:#b45309">${late} overdue</span>` : ''}</div>`));

  const groups = {};
  jobs.forEach(j => { (groups[j.group] = groups[j.group] || []).push(j); });
  Object.keys(groups).forEach(g => {
    wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#5f7189">${esc(g)} (${groups[g].length})</div>`));
    const list = el(`<div class="area-list"></div>`);
    groups[g].forEach(j => {
      const item = el(`<div class="area-item"></div>`);
      const row = el(`<div class="area-row"></div>`);
      const tick = el(`<button class="area-tick" title="Mark clean">✓</button>`);
      tick.onclick = () => { if (j.kind === 'unit') toggleServicedDone(j.id); else toggleAreaDone(j.id); };
      row.appendChild(tick);
      const who = j.kind === 'unit' ? cleanerForUnit(unitById[j.id]) : null;
      const whoName = who ? who.person.name.split(' ')[0] : (areaById[j.id] && areaById[j.id].assignedTo
        ? ((state.staff || []).find(p => p.id === areaById[j.id].assignedTo) || {}).name : null);
      row.appendChild(el(`<div class="area-name su-unit">${esc(j.label)}`
        + `<span class="area-freq" style="${j.late ? 'color:#b45309' : ''}"> · ${esc(j.why)}</span>`
        + (whoName ? `<span class="area-freq"> · ${esc(String(whoName).split(' ')[0])}</span>` : '')
        + `</div>`));
      item.appendChild(row);
      list.appendChild(item);
    });
    wrap.appendChild(list);
  });
  return wrap;
}
