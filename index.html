// A kind of room kept off the morning roll call is a separate job, done by its own
// people after the main round. Say so on its own tab — otherwise "it never appears
// in Roll Call" reads as a fault, and nobody records the work.
function offRollCallNote(typeKey) {
  if (!Array.isArray(state.rollCallTypes) || state.rollCallTypes.includes(typeKey)) return el('<div></div>');
  const cleared = (state.staff || []).filter((p) => p.isCleaner && canCleanType(p, typeKey)
    && Array.isArray(p.canClean) && p.canClean.includes(typeKey));
  const box = el('<div class="alert" style="background:#eef6fd;border-color:#cfe8fb"></div>');
  box.appendChild(el(`<div class="alert-title" style="color:#0369a1">Not on the morning roll call</div>`));
  box.appendChild(el(`<div class="alert-body">These rooms are a separate job, done after the main round. `
    + (cleared.length ? `Assigned to <b>${esc(cleared.map((p) => p.name.split(' ')[0]).join(' and '))}</b>. ` : '')
    + `Tick them off here as they're done — nothing on Roll Call will record them.</div>`));
  return box;
}

function servicedCard(u, isDue) {
  const done = servicedDone(u.id);
  const doneToday = cleanedToday(u);        // includes cleans logged from another phone
  const c = cleanerForUnit(u);
  const pendingAbsent = c && c.reason === 'owner-absent';
  const editing = state.editingUnit === u.id;
  const card = el(`<div class="su-card ${doneToday?'done':''} ${pendingAbsent?'needs-cover':''}"></div>`);
  card.style.borderLeft = '3px solid ' + UNIT_TYPES[unitType(u)].color;   // colour-code by type

  // --- EDIT MODE ---
  if (editing) {
    card.appendChild(el(`<div class="section-label" style="margin:0 0 8px">Edit unit</div>`));
    const eU = el(`<input id="edUnit_${u.id}" value="${esc(u.unit)}" placeholder="Unit number" style="margin-bottom:8px">`);
    const eG = el(`<input id="edGuest_${u.id}" value="${esc(u.guest||'')}" placeholder="Guest / customer name" style="margin-bottom:10px">`);
    card.appendChild(eU); card.appendChild(eG);
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:4px">Last cleaned on (optional — sets the schedule)</div>`));
    const eL = el(`<input id="edLast_${u.id}" type="date" value="${esc(u.lastCleaned||'')}" max="${esc(todayKey())}" style="margin-bottom:10px;width:100%">`);
    card.appendChild(eL);
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-bottom:4px">Note (e.g. guest preference)</div>`));
    const eN = el(`<input id="edNote_${u.id}" value="${esc(u.note||'')}" placeholder="e.g. Guest leaves by 9am — clean first" style="margin-bottom:10px;width:100%">`);
    card.appendChild(eN);
    const row = el(`<div style="display:flex;gap:8px"></div>`);
    const saveB = el(`<button class="add-btn" style="flex:1">Save</button>`);
    saveB.onclick = () => editServicedUnit(u.id, document.getElementById('edUnit_'+u.id).value, document.getElementById('edGuest_'+u.id).value, document.getElementById('edLast_'+u.id).value, document.getElementById('edNote_'+u.id).value);
    const cancelB = el(`<button class="modal-skip">Cancel</button>`);
    cancelB.onclick = () => cancelEditUnit();
    row.appendChild(saveB); row.appendChild(cancelB);
    card.appendChild(row);
    return card;
  }

  const top = el(`<div class="su-top"></div>`);
  const info = el(`<div style="flex:1;min-width:0"></div>`);
  info.appendChild(el(`<div class="su-unit">${u.priority?'⭐ ':''}${u.preferEarly?'🌅 ':u.preferLate?'🌇 ':''}Unit ${esc(u.unit)}`
    + `${u.preferEarly?' <span style="font-size:11px;color:#b45309;font-weight:700">Morning</span>':''}`
    + `${u.preferLate?' <span style="font-size:11px;color:#7c3aed;font-weight:700">Afternoon</span>':''}</div>`));
  if (u.guest) info.appendChild(el(`<div class="su-guest">${esc(u.guest)}</div>`));
  if (u.time) info.appendChild(el(`<div class="su-guest" style="color:#dc2626">🕐 Checkout ${esc(u.time)}</div>`));
  if (u.note) info.appendChild(el(`<div class="su-guest" style="color:#7c3aed">📝 ${esc(u.note)}</div>`));
  if (u.usualTo) { const usual = (state.staff||[]).find(x=>x.id===u.usualTo); if (usual) info.appendChild(el(`<div class="su-assign" style="color:#7c3aed">★ Usual: ${esc(usual.name.split(' ')[0])}</div>`)); }

  // Last cleaned — always shown. It used to render only when the room happened to
  // still be inside the newest-1000 history rows, so the line appeared and vanished
  // for no reason the office could see. "No record yet" is information too.
  const last = lastCleanInfo(u);
  info.appendChild(last
    ? el(`<div class="su-assign" style="color:#5f7189">🧹 Last: ${esc(last.when)}${last.who ? ' · ' + esc(last.who) : ''}</div>`)
    : el(`<div class="su-assign" style="color:#b45309">🧹 Last: no record yet</div>`));

  // Assigned cleaner line
  if (c) {
    const fname = c.person.name.split(' ')[0];
    if (pendingAbsent) {
      info.appendChild(el(`<div class="su-assign" style="color:#dc2626">⚠ ${esc(fname)} absent — needs cover</div>`));
    } else if (c.reason === 'cover') {
      info.appendChild(el(`<div class="su-assign" style="color:#15803d">↪ Covered by ${esc(fname)}</div>`));
    } else if (c.reason === 'override') {
      info.appendChild(el(`<div class="su-assign" style="color:#5f7189">Assigned: ${esc(fname)}</div>`));
    } else {
      info.appendChild(el(`<div class="su-assign" style="color:#5f7189">${esc(fname)} (Floor ${floorOfUnit(u.unit)})</div>`));
    }
  } else {
    info.appendChild(el(`<div class="su-assign" style="color:#5b6a7f">No cleaner assigned to Floor ${floorOfUnit(u.unit)||'?'}</div>`));
  }
  top.appendChild(info);

  if (done) {
    // We ticked it off here, so it can be un-ticked here.
    const mark = el(`<button class="su-mark">✓ Cleaned</button>`);
    mark.onclick = () => toggleServicedDone(u.id);
    top.appendChild(mark);
  } else if (doneToday) {
    // Cleaned today according to the shared log (another phone) — show it, don't offer an undo we can't honour.
    top.appendChild(el(`<div class="su-next" style="color:#15803d;background:#e7f6ec;border-color:#bfe6cd">✓ Done today</div>`));
  } else if (isDue) {
    const mark = el(`<button class="su-mark">Mark clean</button>`);
    mark.onclick = () => toggleServicedDone(u.id);
    top.appendChild(mark);
  } else {
    const nd = nextDueDate(u);
    const label = nd === tomorrowKey() ? 'Next: tomorrow'
      : nd ? 'Next: ' + new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      : FREQ_LABEL[u.freq];
    top.appendChild(el(`<div class="su-next" title="${esc(FREQ_LABEL[u.freq])}">${esc(label)}</div>`));
  }
  card.appendChild(top);

  // Who cleans this room (recorded in history when marked clean)
  const assignRow = el(`<div style="display:flex;align-items:center;gap:8px;margin-top:10px"></div>`);
  assignRow.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;white-space:nowrap">Cleaned by</div>`));
  const asel = el(`<select class="area-select" style="flex:1"></select>`);
  asel.appendChild(el(`<option value="">Auto (by floor)</option>`));
  // Only people cleared for this kind of room. Where a pair swaps rooms day to day,
  // this turns "who cleaned it" into a two-name choice instead of a list of twenty.
  cleaningStaff().filter(p => canCleanUnit(p, u)).forEach(p => {
    const o = el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`);
    if (u.assignedTo === p.id) o.setAttribute('selected', '');
    asel.appendChild(o);
  });
  asel.onchange = (e) => setUnitAssignee(u.id, e.target.value);
  assignRow.appendChild(asel);
  card.appendChild(assignRow);

  // frequency selector + edit + remove
  const ctl = el(`<div class="su-ctl"></div>`);
  ['nightly','daily','eod','weekly'].forEach(fk => {
    const b = el(`<button class="freqmini ${u.freq===fk?'on':''}">${FREQ_LABEL[fk]}</button>`);
    b.onclick = () => setUnitFreq(u.id, fk);
    ctl.appendChild(b);
  });
  const pri = el(`<button class="freqmini ${u.priority?'on':''}" title="Priority">${u.priority?'⭐ Priority':'☆ Priority'}</button>`);
  pri.onclick = () => setUnitPriority(u.id, !u.priority);
  ctl.appendChild(pri);
  const early = el(`<button class="freqmini ${u.preferEarly?'on':''}" title="Customer wants this done in the morning">${u.preferEarly?'🌅 Morning':'🌅 Prefers morning'}</button>`);
  early.onclick = () => setUnitPreferEarly(u.id, !u.preferEarly);
  ctl.appendChild(early);
  const late = el(`<button class="freqmini ${u.preferLate?'on':''}" title="Customer would rather this was left until the afternoon">${u.preferLate?'🌇 Afternoon':'🌇 Prefers afternoon'}</button>`);
  late.onclick = () => setUnitPreferLate(u.id, !u.preferLate);
  ctl.appendChild(late);
  const edit = el(`<button class="su-edit">Edit</button>`);
  edit.onclick = () => startEditUnit(u.id);
  ctl.appendChild(edit);
  const rm = el(`<button class="su-rm">Remove</button>`);
  rm.onclick = () => removeServicedUnit(u.id);
  ctl.appendChild(rm);
  card.appendChild(ctl);

  return card;
}

function viewRollCall() {
  const s = statsBar();
  const wrap = el('<div></div>');
  const body = el('<div class="body"></div>');

  // CLOSE OUT THE MORNING — first thing on the page, because at hand-over the
  // answer is nearly always "all of it" and it should not need scrolling for.
  // Today only: on a past day the rooms have long since been ticked or missed, and
  // a bulk tick there would silently backdate a whole morning.
  if ((selectedDay || todayKey()) === todayKey()) {
    const open = rollCallOutstanding();
    const openTotal = open.rooms.length + open.areas.length;
    if (openTotal) {
      const allBox = el('<div style="margin-bottom:18px"></div>');
      const allBtn = el(`<button class="add-btn" style="background:#15803d;color:#ffffff">✓ Mark all ${openTotal} as cleaned</button>`);
      allBtn.onclick = () => markRollCallAllDone();
      allBox.appendChild(allBtn);
      allBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
        + `${open.rooms.length} room${open.rooms.length === 1 ? '' : 's'}`
        + (open.areas.length ? ` · ${open.areas.length} communal area${open.areas.length === 1 ? '' : 's'}` : '')
        + ` — goes straight to History, and you can un-tick any of them one by one.</div>`));
      body.appendChild(allBox);
    }
  }

  // Sync staff roster · Import attendance file · pick the day
  const syncBox = el('<div style="margin-bottom:16px"></div>');
  const syncBtn = el('<button class="add-btn" style="background:#0284c7">⟳ Sync Staff (Hik-Connect)</button>');
  syncBtn.onclick = () => syncFromHik();
  syncBox.appendChild(syncBtn);
  const impBtn = el('<button class="add-btn" style="background:#ffffff;color:#0284c7;border:1px solid #cfe8fb;margin-top:8px">↑ Import Attendance File</button>');
  const impInput = el('<input type="file" accept=".xlsx,.xls,.csv" style="display:none">');
  impInput.onchange = (e) => { if (e.target.files[0]) importAttendance(e.target.files[0]); e.target.value = ''; };
  impBtn.onclick = () => impInput.click();
  syncBox.appendChild(impBtn);
  syncBox.appendChild(impInput);
  const cur = selectedDay || todayKey();
  const pickDay = (d) => { selectedDay = d || todayKey(); loadHikArrivals().then(() => render()); };
  const dayRow = el('<div style="display:flex;align-items:center;gap:8px;margin-top:10px"></div>');
  dayRow.appendChild(el('<div style="font-size:12px;color:#5f7189;font-weight:600;white-space:nowrap">Showing day</div>'));
  const dayIn = el(`<input type="date" value="${esc(cur)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#f4f7fb;color:#15202e;border:1px solid #d8e0ea;border-radius:8px;padding:8px 10px;font-size:14px">`);
  dayIn.onchange = (e) => pickDay(e.target.value);
  const calBtn = el('<button class="freqmini" title="Pick a date" style="flex:0 0 auto">📅</button>');
  calBtn.onclick = () => { try { dayIn.showPicker(); } catch (e) { dayIn.focus(); dayIn.click(); } };
  dayRow.appendChild(dayIn);
  dayRow.appendChild(calBtn);
  syncBox.appendChild(dayRow);
  // Quick jumps
  const quick = el('<div style="display:flex;gap:6px;margin-top:8px"></div>');
  const yday = shiftDay(todayKey(), -1);
  [['Today', todayKey()], ['Yesterday', yday]].forEach(([lbl, d]) => {
    const b = el(`<button class="freqmini ${cur === d ? 'on' : ''}">${lbl}</button>`);
    b.onclick = () => pickDay(d);
    quick.appendChild(b);
  });
  syncBox.appendChild(quick);
  // When was attendance last read? Without this, "nobody clocked in" and "we haven't
  // looked since you opened the page" are indistinguishable.
  const pullRow = el('<div style="display:flex;align-items:center;gap:8px;margin-top:10px"></div>');
  pullRow.appendChild(el(`<div id="lastPull" style="flex:1;min-width:0;font-size:11px;color:#5b6a7f;font-weight:600">${esc(lastPullLabel())}</div>`));
  const refreshBtn = el('<button class="freqmini" style="flex:0 0 auto;padding:6px 12px">↻ Check now</button>');
  refreshBtn.onclick = async () => { refreshBtn.textContent = '…'; await loadHikArrivals(); render(); };
  pullRow.appendChild(refreshBtn);
  syncBox.appendChild(pullRow);
  if (hikSyncMsg) {
    syncBox.appendChild(el(`<div style="font-size:12px;margin-top:8px;font-weight:600;color:${hikSyncMsg.err ? '#dc2626' : '#15803d'}">${esc(hikSyncMsg.text)}</div>`));
  }
  body.appendChild(syncBox);

  // Unknown-staff alert: badged in but not in the staff list
  if (hikUnknown.length) {
    const al = el(`<div class="alert"></div>`);
    al.appendChild(el(`<div class="alert-title">⚠ ${hikUnknown.length} badged in but not in your staff list</div>`));
    al.appendChild(el(`<div class="alert-body">${esc(hikUnknown.map((u) => u.name + (u.time ? ` (${u.time})` : '')).join(', '))}</div>`));
    body.appendChild(al);
  }

  const arrIds = Object.keys(hikArrivals);
  const staffById = {};
  for (const s of (state.staff || [])) staffById[s.id] = s;

  // TODAY'S ROOMS — surfaced up front so the office sees the actual workload when roll
  // call opens, instead of only finding out after tapping auto-assign.
  // Same order auto-assign uses: 🌅 early first, then ⭐ priority, then room number —
  // so what you see at the top is what gets handed out first.
  const todaysRooms = (state.servicedUnits || []).filter((u) => onRollCall(u) && onTodaysList(u)).slice()
    .sort((a, b) => (slotRank(a) - slotRank(b))
      || (b.priority ? 1 : 0) - (a.priority ? 1 : 0)
      || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const flags = (u) => (u.preferEarly ? '🌅 ' : u.preferLate ? '🌇 ' : '') + (u.priority ? '⭐ ' : '');
  if (todaysRooms.length) {
    const doneR = todaysRooms.filter(cleanedToday);
    const openR = todaysRooms.filter((u) => !cleanedToday(u));
    const unass = openR.filter((u) => !u.assignedTo);
    const toCheck = openR.filter((u) => u.assignedTo && !assignConfirmedToday(u));
    const okCount = openR.filter((u) => u.assignedTo && assignConfirmedToday(u)).length;
    const box = el('<div style="margin-bottom:18px"></div>');
    box.appendChild(el(`<div class="section-label">◷ Rooms to clean today (${todaysRooms.length})</div>`));
    const noRec = openR.filter((u) => !lastCleanDate(u)).length;
    box.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin:-6px 0 10px">`
      + `${openR.length - unass.length} handed out`
      + ` · <b style="color:${unass.length ? '#b45309' : '#15803d'}">${unass.length} still to hand out</b>`
      + (toCheck.length ? ` · <b style="color:#b45309">${toCheck.length} to check</b>` : '')
      + (doneR.length ? ` · <span style="color:#15803d">${doneR.length} done</span>` : '')
      + `</div>`));
    const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
    todaysRooms.forEach((u) => {
      const done = cleanedToday(u);
      const who = (state.staff || []).find((p) => p.id === u.assignedTo);
      const tone = done ? 'background:#eaf7ee;border-color:#bfe3ca;color:#15803d'
        : who ? 'background:#eef6fd;border-color:#cfe8fb;color:#0369a1'
        : 'background:#fff7ed;border-color:#fcd9a8;color:#b45309';
      const signed = who && assignConfirmedToday(u);
      const noRecord = !lastCleanDate(u);
      const tip = done ? 'Cleaned today'
        : noRecord ? 'No record of this room ever being cleaned'
        : who ? (signed ? 'Confirmed for ' + who.name : 'Suggested for ' + who.name + ' — not checked yet')
        : 'Not assigned yet';
      chips.appendChild(el(`<div class="freqmini" style="flex:0 0 auto;padding:6px 10px;${tone}" title="${esc(tip)}">`
        + `${flags(u)}${esc(u.unit)}`
        + `${done ? ' ✓' : who ? ' · ' + esc(who.name.split(' ')[0]) + (signed ? '' : ' ?') : ''}</div>`));
    });
    box.appendChild(chips);
    // Sits under the chips so the counts above stay the first thing read.
    if (noRec) {
      box.appendChild(el(`<div style="font-size:11px;color:#b45309;font-weight:600;margin-top:8px">`
        + `⚠ ${noRec} of these have never been recorded as cleaned — they may not actually be dirty. `
        + `Set "Last cleaned" on them in All Rooms and this list gets shorter.</div>`));
    }

    // The button that hands rooms out belongs above the list it produces.
    if (arrIds.length) {
      const autoBtn = el('<button class="add-btn" style="background:#15803d;color:#ffffff;margin:12px 0 4px">⚡ Auto-assign rooms evenly</button>');
      autoBtn.onclick = () => autoAssignRooms();
      box.appendChild(autoBtn);
    }
    // Tying rooms one at a time is why hardly any are tied. The log already knows who
    // has been doing what, so offer to read it — but only when it has something to say.
    {
      const lu = learnUsualPlan(LEARN_DAYS);
      if (lu.proposals.length) {
        const learnBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px;border-color:#7c3aed;color:#7c3aed">`
          + `★ Keep ${lu.proposals.length} room${lu.proposals.length === 1 ? '' : 's'} with whoever has been doing them</button>`);
        learnBtn.onclick = () => learnUsualCleaners();
        box.appendChild(learnBtn);
        box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-2px 0 8px">`
          + `From the last ${LEARN_DAYS} days of the log. Rooms without a clear regular keep rotating.</div>`));
      }
    }
    // Pinned rooms go back to the same person every morning, so once there are a lot
    // of them the hand-out stops rotating. Only worth mentioning when it's a real share.
    const pinnedCount = (state.servicedUnits || []).filter((u) => onRollCall(u) && u.usualTo).length;
    const rollTotal = (state.servicedUnits || []).filter((u) => onRollCall(u)).length;
    if (pinnedCount && pinnedCount >= rollTotal / 3) {
      const pinBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px;border-color:#7c3aed;color:#7c3aed">⟲ Free up ${pinnedCount} room${pinnedCount === 1 ? '' : 's'} tied to one cleaner</button>`);
      pinBtn.onclick = () => clearAllUsualCleaners();
      box.appendChild(pinBtn);
      box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-2px 0 8px">`
        + `${pinnedCount} of ${rollTotal} go to the same person every day, so they can't rotate.</div>`));
    }
    // Clearing the board only makes sense when something is actually on it.
    const heldNow = openR.filter((u) => u.assignedTo && !u.usualTo);
    if (heldNow.length) {
      const clearBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px;border-color:#b45309;color:#b45309">✕ Put all ${heldNow.length} room${heldNow.length === 1 ? '' : 's'} back in the pool</button>`);
      clearBtn.onclick = () => unassignAllRooms();
      box.appendChild(clearBtn);
    }
    // Reversible while today's shuffle is still the last thing that happened.
    if (state.lastAutoAssign && String(state.lastAutoAssign.at).slice(0, 10) === todayKey()) {
      const undoBtn = el(`<button class="freqmini" style="width:100%;padding:9px;margin-bottom:4px">${lastBoardChangeLabel()}</button>`);
      undoBtn.onclick = () => undoAutoAssign();
      box.appendChild(undoBtn);
    }

    // SIGN-OFF: auto-assign hands rooms out straight away, but every one it picked
    // still needs a yes/no. "No" opens the picker so the room goes somewhere else.
    if (toCheck.length) {
      box.appendChild(el(`<div class="section-label" style="margin-top:16px;color:#b45309">⚠ Check these assignments (${toCheck.length})</div>`));
      toCheck.forEach((u) => {
        const who = (state.staff || []).find((p) => p.id === u.assignedTo);
        const row = el('<div class="su-card" style="display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px"></div>');
        const info = el('<div style="flex:1;min-width:0"></div>');
        info.appendChild(el(`<div style="font-size:15px;font-weight:800;color:#0f1a27">${flags(u)}${esc(u.unit)}</div>`));
        info.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600">→ ${esc(who ? who.name : 'unknown')}</div>`));
        row.appendChild(info);
        const yes = el('<button class="freqmini" style="flex:0 0 auto;padding:9px 14px;background:#15803d;border-color:#15803d;color:#ffffff">✓ Yes</button>');
        yes.onclick = () => confirmAssignment(u.id);
        const no = el('<button class="freqmini" style="flex:0 0 auto;padding:9px 14px">✕ No</button>');
        no.onclick = () => openAssignPicker(u.id);
        row.appendChild(yes); row.appendChild(no);
        box.appendChild(row);
      });
    } else if (okCount) {
      box.appendChild(el(`<div style="font-size:12px;color:#15803d;font-weight:700;margin-top:12px">✓ All ${okCount} assignment${okCount === 1 ? '' : 's'} confirmed</div>`));
    }
    body.appendChild(box);
  }

  // NOT DUE TODAY — every-other-day and weekly rooms vanish from the roll call on
  // their off day, which reads as "a room has gone missing" rather than "it isn't
  // due yet". Listing them greyed out, with the day they come round, keeps the whole
  // estate accounted for. Outside the block above on purpose, twice over: they must
  // never join the count, the hand-out or the close-out, and a morning with nothing
  // due is exactly when "here is what is coming" is worth reading.
  {
    const notDue = (state.servicedUnits || []).filter((u) => onRollCall(u) && !onTodaysList(u) && !u.paused).slice()
      .sort((a, b) => String(nextDueDate(a) || '~').localeCompare(String(nextDueDate(b) || '~'))
        || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
    if (notDue.length) {
      const ndBox = el('<div style="margin-bottom:18px"></div>');
      ndBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:700">Not due today (${notDue.length})</div>`));
      const ndChips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>');
      notDue.forEach((u) => {
        const nd = nextDueDate(u);
        const when = !nd ? 'no date yet'
          : nd === shiftDay(todayKey(), 1) ? 'tomorrow'
          : new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
        ndChips.appendChild(el(`<div class="freqmini" style="flex:0 0 auto;padding:5px 9px;opacity:0.6;font-size:11px" `
          + `title="${esc((FREQ_LABEL[u.freq] || 'Daily') + (nd ? ' · next due ' + nd : ''))}">${esc(u.unit)} · ${esc(when)}</div>`));
      });
      ndBox.appendChild(ndChips);
      body.appendChild(ndBox);
    }
  }

  // COMMUNAL AREAS — the corridors, stairs and lobby still have to be given to
  // someone each morning. Hand-assigned on purpose: an area is a walk of the
  // building rather than a room on a count, so auto-assign leaves them alone.
  if (areasInterior().length) {
    const openA = areasOutstanding();
    const doneA = areasInterior().filter(areaDone);
    const abox = el('<div style="margin-bottom:18px"></div>');
    abox.appendChild(el(`<div class="section-label">▦ Communal areas (${openA.length} to do)</div>`));
    abox.appendChild(el(`<div style="font-size:12px;color:#5f7189;font-weight:600;margin:-6px 0 10px">`
      + `Hand these out yourself — auto-assign only spreads rooms.`
      + (doneA.length ? ` · <span style="color:#15803d">${doneA.length} done</span>` : '')
      + `</div>`));
    // Only what's left gets a card. A finished area collapses to a chip, so the
    // section shrinks through the morning instead of staying a wall of nine.
    if (openA.length) {
      const list = el(`<div class="area-list"></div>`);
      openA.forEach(a => list.appendChild(areaWorkCard(a, { presentOnly: true })));
      abox.appendChild(list);
    }
    if (!openA.length) abox.appendChild(el(`<div style="font-size:12px;color:#15803d;font-weight:700;margin-bottom:8px">✓ Every communal area is done</div>`));
    if (doneA.length) {
      const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>');
      doneA.forEach(a => {
        const who = (state.staff || []).find(p => p.id === a.assignedTo);
        const chip = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px;background:#eaf7ee;border-color:#bfe3ca;color:#15803d" `
          + `title="Tap to undo">${esc(a.label)}${who ? ' · ' + esc(who.name.split(' ')[0]) : ''} ✓</button>`);
        chip.onclick = () => toggleAreaDone(a.id);   // a mis-tap has to be undoable
        chips.appendChild(chip);
      });
      abox.appendChild(chips);
    }
    body.appendChild(abox);
  }

  // WHO'S IN TODAY — only people who badged in, with clock-in times + room assignment.
  const whoIn = el('<div style="margin-bottom:18px"></div>');
  const dayLbl = (selectedDay && selectedDay !== todayKey()) ? ('on ' + selectedDay) : 'today';
  const cleanersTagged = (state.staff || []).some((p) => p.isCleaner);
  whoIn.appendChild(el(`<div class="section-label" style="color:#15803d">✓ ${cleanersTagged ? 'Cleaners' : 'Staff'} clocked in ${dayLbl} (${arrIds.length})</div>`));
  // EXPECTED vs ACTUALLY IN — the badge-ins alone can't tell "hasn't arrived yet"
  // from "isn't working today", so a quiet morning reads as everyone being late.
  // Only shown once somebody actually has a rota; until then it would say nothing.
  {
    const shownDay = selectedDay || todayKey();
    const roster = cleaningStaff();
    if (roster.some((p) => Array.isArray(p.worksOn))) {
      const expected = roster.filter((p) => worksOnDay(p, shownDay));
      const off = roster.filter((p) => !worksOnDay(p, shownDay));
      const inCount = expected.filter((p) => hikArrivals[p.id]).length;
      whoIn.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:600;margin:-6px 0 10px">`
        + `<b style="color:${inCount >= expected.length ? '#15803d' : '#b45309'}">${inCount} of ${expected.length}</b> expected in`
        + (off.length ? ` · off today: ${esc(off.map((p) => p.name.split(' ')[0]).join(', '))}` : '')
        + `</div>`));
    }
  }
  if (!cleanersTagged) whoIn.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 10px">Tip: tag people as <b>Cleaner</b> in the Team tab so sync only shows cleaners.</div>`));
  // Manually add a cleaner who forgot to badge in. Someone who isn't working today
  // didn't forget, so offering them here is how a day off turns into a hand-out by
  // mistake. Badging in still wins over the rota everywhere else: if they turn up on
  // their day off they appear as present and get rooms like anyone else.
  const notIn = cleaningStaff().filter((p) => !hikArrivals[p.id] && worksOnDay(p, selectedDay || todayKey()));
  if (notIn.length) {
    const addSel = el('<select class="area-select" style="margin-bottom:12px"></select>');
    addSel.appendChild(el('<option value="">＋ Add someone who forgot to clock in…</option>'));
    notIn.slice().sort((a, b) => a.name.localeCompare(b.name))
      .forEach((p) => addSel.appendChild(el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`)));
    addSel.onchange = (e) => { if (e.target.value) addManualArrival(e.target.value); };
    whoIn.appendChild(addSel);
  }
  if (!arrIds.length) {
    whoIn.appendChild(el(`<div class="empty" style="text-align:center;padding:16px 0;color:#5b6a7f">No clock-ins for this day. Tap "Import Attendance File" and pick your Hik export.</div>`));
  } else {
    arrIds
      .map((id) => ({ s: staffById[id], t: hikArrivals[id].time, out: hikArrivals[id].out, raw: hikArrivals[id].raw }))
      .filter((x) => x.s)
      .sort((a, b) => String(a.raw || '').localeCompare(String(b.raw || '')))   // earliest badge-in first
      .forEach(({ s, t, out }) => {
        const manual = hikArrivals[s.id] && hikArrivals[s.id].manual;
        const card = el('<div class="person" style="flex-direction:column;align-items:stretch;gap:8px"></div>');
        const info = el('<div class="person-info"></div>');
        const lead = s.isLeader ? ` <span style="color:#d97706;font-size:12px;font-weight:700">★</span>` : '';
        const shk = shiftOf(s);
        const shiftBadge = shk !== 'day' ? ` <span style="color:${SHIFTS[shk].color};font-size:11px;font-weight:700">${SHIFTS[shk].icon} ${SHIFTS[shk].label}</span>` : '';
        const nameRow = el(`<div style="display:flex;align-items:center;gap:8px"></div>`);
        nameRow.appendChild(el(`<div class="person-name" style="flex:1">${esc(s.name)}${lead}${shiftBadge}</div>`));
        if (manual) {
          const rm = el(`<button class="su-rm" style="flex:0 0 auto">✕ Remove</button>`);
          rm.onclick = () => removeManualArrival(s.id);
          nameRow.appendChild(rm);
        }
        info.appendChild(nameRow);
        const timecard = manual
          ? `✚ Added by office <span style="color:#5b6a7f">· didn't badge</span>`
          : out
          ? `✓ In ${esc(t)} <span style="color:#5b6a7f">·</span> Out ${esc(out)}`
          : `✓ In ${esc(t)} <span style="color:#5b6a7f">· still in</span>`;
        info.appendChild(el(`<div class="person-floors" style="color:#15803d;font-weight:600">${timecard}</div>`));
        card.appendChild(info);
        const mine = (state.servicedUnits || []).filter((u) => u.assignedTo === s.id);
        const myAreas = areasInterior().filter((a) => a.assignedTo === s.id);
        if (mine.length || myAreas.length) {
          const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
          mine.forEach((u) => {
            const chip = el(`<button class="freqmini on" style="flex:0 0 auto;padding:6px 11px">${esc(u.unit)} ✕</button>`);
            chip.onclick = () => setUnitAssignee(u.id, '');
            chips.appendChild(chip);
          });
          // Areas carry their name, not a number, so they read differently from rooms
          // in the same row — which is the point: you can see what someone is holding.
          myAreas.forEach((a) => {
            const chip = el(`<button class="freqmini on" style="flex:0 0 auto;padding:6px 11px;background:#15803d;border-color:#15803d">${esc(a.label)}${areaDone(a) ? ' ✓' : ''} ✕</button>`);
            chip.onclick = () => setAreaAssign(a.id, '');
            chips.appendChild(chip);
          });
          card.appendChild(chips);
        }
        // Rooms still to hand out — due-today ones suggested first, everything else
        // tucked below so an out-of-schedule room is a deliberate choice, not an accident.
        // Kinds of room roll call doesn't cover must not be offered here either —
        // otherwise they're off the board but still handed out one by one.
        const free = (state.servicedUnits || []).filter((u) => onRollCall(u) && !u.assignedTo && !cleanedToday(u));
        const byUnit = (a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true });
        const freeDue = free.filter(unitDueToday).sort((a, b) =>
          (slotRank(a) - slotRank(b))
          || (b.priority ? 1 : 0) - (a.priority ? 1 : 0)
          || byUnit(a, b));
        const freeLater = free.filter((u) => !unitDueToday(u)).sort(byUnit);
        // Areas are handed out from the same place as rooms — a separate control for
        // them would mean remembering to use it.
        const freeAreas = areasInterior().filter((a) => !a.assignedTo && !areaDone(a));
        if (free.length || freeAreas.length) {
          const sel = el('<select class="area-select"></select>');
          sel.appendChild(el(`<option value="">+ Assign a room or area…${freeDue.length ? ` (${freeDue.length} due today)` : ''}</option>`));
          const optFor = (u, suffix) => el(`<option value="${esc(u.id)}">${flags(u)}Room ${esc(u.unit)}${suffix}</option>`);
          if (freeDue.length) {
            const g = el(`<optgroup label="Due today (${freeDue.length})"></optgroup>`);
            freeDue.forEach((u) => g.appendChild(optFor(u, '')));
            sel.appendChild(g);
          }
          if (freeLater.length) {
            const g = el(`<optgroup label="Not due yet (${freeLater.length})"></optgroup>`);
            freeLater.forEach((u) => {
              const nd = nextDueDate(u);
              g.appendChild(optFor(u, nd ? ' — next ' + new Date(nd + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''));
            });
            sel.appendChild(g);
          }
          if (freeAreas.length) {
            const g = el(`<optgroup label="Communal areas (${freeAreas.length})"></optgroup>`);
            freeAreas.forEach((a) => g.appendChild(el(`<option value="${esc(areaLogId(a))}">${esc(a.label)} — ${esc(FREQ[a.freq].label)}</option>`)));
            sel.appendChild(g);
          }
          sel.onchange = (e) => {
            const v = e.target.value;
            if (!v) return;
            if (isAreaLog(v)) setAreaAssign(v.slice(5), s.id); else setUnitAssignee(v, s.id);
          };
          card.appendChild(sel);
        } else if (!mine.length && !myAreas.length) {
          card.appendChild(el('<div style="font-size:11px;color:#5b6a7f">No rooms yet — add units on the Cleaning tab, then assign here.</div>'));
        }
        whoIn.appendChild(card);
      });
  }
  // Everyone else the door reader saw. Kept out of the roll call, but visible — and
  // one tap fixes the common case, which is a cleaner nobody tagged as one.
  if (hikOther.length) {
    const other = el('<div style="margin-bottom:18px"></div>');
    other.appendChild(el(`<div class="section-label">Also badged in — not cleaners (${hikOther.length})</div>`));
    other.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 10px">The door reader sees all staff. Tap someone to add them to the cleaning roll call.</div>`));
    const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
    hikOther.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach((o) => {
      const c = el(`<button class="freqmini" style="flex:0 0 auto;padding:7px 11px">${esc(o.name)} <span style="color:#5b6a7f">${esc(o.time)}</span> +</button>`);
      c.onclick = () => { toggleCleaner(o.id); loadHikArrivals().then(() => render()); };
      chips.appendChild(c);
    });
    other.appendChild(chips);
    body.appendChild(other);
  }

  body.appendChild(whoIn);
  wrap.appendChild(body);

  // "No" on an assignment → pick who should take it instead. Everyone clocked in is
  // listed with how many rooms they're already carrying, so the load stays visible.
  if (_assignPick) {
    const u = (state.servicedUnits || []).find((x) => x.id === _assignPick.unitId);
    if (!u) { _assignPick = null; return wrap; }
    const load = {};
    (state.servicedUnits || []).forEach((x) => { if (x.assignedTo) load[x.assignedTo] = (load[x.assignedTo] || 0) + 1; });
    const inNow = arrIds.map((id) => staffById[id]).filter(Boolean);
    const lightest = inNow.slice().sort((a, b) => (load[a.id] || 0) - (load[b.id] || 0))[0];
    const overlay = el('<div class="modal-overlay" id="assignPicker"></div>');
    const modal = el('<div class="modal"></div>');
    modal.appendChild(el(`<div class="modal-title">Who should take ${esc(u.unit)}?</div>`));
    modal.appendChild(el(`<div class="modal-sub">Currently suggested for ${esc((state.staff || []).find((p) => p.id === u.assignedTo) ? (state.staff || []).find((p) => p.id === u.assignedTo).name : 'nobody')}.</div>`));
    const picker = el('<div class="cover-picker" style="display:flex;flex-direction:column;gap:8px;margin-top:14px"></div>');
    if (!inNow.length) {
      picker.appendChild(el('<div class="empty">Nobody is clocked in yet.</div>'));
    }
    inNow.sort((a, b) => (load[a.id] || 0) - (load[b.id] || 0) || a.name.localeCompare(b.name)).forEach((p) => {
      const n = load[p.id] || 0;
      const isCur = p.id === u.assignedTo;
      // Someone not cleared for this kind of room shouldn't be offered it by mistake.
      if (!canCleanUnit(p, u)) {
        picker.appendChild(el(`<div class="cover-opt" style="opacity:0.5">${esc(p.name)}`
          + `<span class="cover-load">not cleared for ${esc(UNIT_TYPES[unitType(u)].label.toLowerCase())}</span></div>`));
        return;
      }
      const b = el(`<button class="cover-opt ${isCur ? 'on' : ''}">${esc(p.name)}`
        + `<span class="cover-load">${n} room${n === 1 ? '' : 's'}`
        + `${lightest && p.id === lightest.id && !isCur ? ' · lightest' : ''}${isCur ? ' · suggested' : ''}</span></button>`);
      b.onclick = () => setUnitAssignee(u.id, p.id);
      picker.appendChild(b);
    });
    modal.appendChild(picker);
    const btnRow = el('<div class="modal-btns"></div>');
    const back = el('<button class="modal-confirm" style="background:#b45309">Put it back in the pool</button>');
    back.onclick = () => setUnitAssignee(u.id, '');
    const cancel = el('<button class="modal-skip">Cancel</button>');
    cancel.onclick = () => dismissAssignPicker();
    btnRow.appendChild(cancel); btnRow.appendChild(back);
    modal.appendChild(btnRow);
    overlay.appendChild(modal);
    overlay.onclick = (e) => { if (e.target === overlay) dismissAssignPicker(); };
    wrap.appendChild(overlay);
  }

  return wrap;
}

function viewSettings() {
  const wrap = el('<div class="body"></div>');

  // --- What the app does on its own ---
  wrap.appendChild(el(`<div class="section-label">Automatic</div>`));
  const autoBox = el(`<div class="addbox"></div>`);
  [
    ['autoAssign', 'Hand out rooms each morning',
     'Once the first cleaners badge in, today\'s rooms are shared out automatically. Only ever when nothing has been handed out yet, so it can\'t undo your own decisions. Every room still needs your Yes.'],
    ['autoBalance', 'Keep the week level',
     'Stops the every-other-day rooms stacking onto one morning. Rooms are only ever delayed, never brought forward.'],
  ].forEach(([k, label, why]) => {
    const on = state[k] !== false;
    const row = el(`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #e7ecf3"></div>`);
    const info = el(`<div style="flex:1;min-width:0"></div>`);
    info.appendChild(el(`<div style="font-size:14px;font-weight:600;color:#0f1a27">${label}</div>`));
    info.appendChild(el(`<div style="font-size:11px;color:#5f7189;line-height:1.5;margin-top:2px">${why}</div>`));
    row.appendChild(info);
    const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:0 0 auto;padding:8px 14px">${on ? 'On' : 'Off'}</button>`);
    b.onclick = () => { state[k] = !on ? undefined : false; save(); render(); };
    row.appendChild(b);
    autoBox.appendChild(row);
  });
  autoBox.appendChild(el(`<div style="font-size:11px;color:#5f7189;line-height:1.5;padding-top:10px;border-top:1px solid #e7ecf3;margin-top:4px">`
    + `<b>Marking rooms cleaned is never automatic.</b> The app can plan the work, but only someone who saw it done can say it was done — guessing would fill your history with cleans that never happened.</div>`));
  wrap.appendChild(autoBox);

  // --- What the morning roll call is about ---
  wrap.appendChild(el(`<div style="height:22px"></div>`));

  const rcBox = el(`<div class="addbox"></div>`);

  const rcRow = el(`<div style="display:flex;gap:6px"></div>`);
  UNIT_TYPE_ORDER.forEach(tk => {
    const on = !Array.isArray(state.rollCallTypes) || state.rollCallTypes.includes(tk);

    b.onclick = () => toggleRollCallType(tk);
    rcRow.appendChild(b);
  });

  wrap.appendChild(rcBox);

  tBtn.onclick = () => { const v = document.getElementById('newTeam').value; if (!v.trim()) { document.getElementById('newTeam').focus(); return; } addTeam(v); };

  wrap.appendChild(tbox);

    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));

  employeeGroups(wrap);

  const frow = el(`<div style="display:flex;gap:8px;align-items:center"></div>`);

  frow.appendChild(fIn); frow.appendChild(fBtn); fbox.appendChild(frow);
  fbox.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;margin-top:8px">Currently ${state.floors} floors · ${state.floors*6} units</div>`));
  wrap.appendChild(fbox);

  // --- Add area ---
  wrap.appendChild(el(`<div class="section-label" style="margin-top:20px">Add a cleaning area</div>`));

function floorResidential(f) {
  const units = buildUnits().filter(u => u.floor===f);
  const doneCount = units.filter(u => state.completions[u.id+'::perm']).length;
  const who = whoCleansFloor(f);
  const color = who ? who.person.color : '#5b6a7f';
  const fid = 'floor-'+f;
  const open = state.expandedFloors[fid];
  const card = el(`<div class="floor"></div>`);
  const head = el(`<button class="floor-head"></button>`);
  head.appendChild(el(`<div class="floor-badge" style="background:${color}">${f}</div>`));
  const info = el(`<div class="floor-info"></div>`);
  info.appendChild(el(`<div class="floor-name">Floor ${f}</div>`));
  let sub = `${doneCount}/6 units · `;
  sub += who ? esc(who.person.name.split(' ')[0]) + (who.covering?' (cover)':'') : 'Unassigned';
  info.appendChild(el(`<div class="floor-sub">${sub}</div>`));
  head.appendChild(info);
  const prog = el(`<div class="floor-prog"></div>`);
  prog.appendChild(el(`<div style="width:${(doneCount/6)*100}%;background:${doneCount===6?'#15803d':'#b45309'}"></div>`));
  head.appendChild(prog);
  head.appendChild(el(`<div class="chev">${open?'▲':'▼'}</div>`));
  head.onclick = () => toggleFloorExpand(fid);
  card.appendChild(head);
  if (open) {
    const grid = el(`<div class="unit-grid"></div>`);
    units.forEach(u => {
      const done = !!state.completions[u.id+'::perm'];
      const unit = el(`<div class="unit ${done?'done':''}"></div>`);
      unit.appendChild(el(`<div class="unit-num">${u.num}</div>`));
      const mark = el(`<button class="unit-mark">${done?'✓ Done':'Mark'}</button>`);
      mark.onclick = (e) => { e.stopPropagation(); toggleUnit(u.id); };
      unit.appendChild(mark); grid.appendChild(unit);
    });
    card.appendChild(grid);
  }
  return card;
}

function floorCommon(id, label, zones, icon) {
  const doneCount = zones.filter(z => state.completions[z.id+'::'+freqKey(z.freq)]).length;
  const open = state.expandedFloors[id];
  const card = el(`<div class="floor"></div>`);
  const head = el(`<button class="floor-head"></button>`);
  head.appendChild(el(`<div class="floor-badge" style="background:#eef2f8;color:#5b6a7f;font-size:18px">${icon}</div>`));
  const info = el(`<div class="floor-info"></div>`);
  info.appendChild(el(`<div class="floor-name">${esc(label)}</div>`));
  info.appendChild(el(`<div class="floor-sub">${doneCount}/${zones.length} zones complete</div>`));
  head.appendChild(info);
  const prog = el(`<div class="floor-prog"></div>`);
  prog.appendChild(el(`<div style="width:${(doneCount/zones.length)*100}%;background:${doneCount===zones.length?'#15803d':'#b45309'}"></div>`));
  head.appendChild(prog);
  head.appendChild(el(`<div class="chev">${open?'▲':'▼'}</div>`));
  head.onclick = () => toggleFloorExpand(id);
  card.appendChild(head);
  if (open) {
    const list = el(`<div style="padding:4px 14px 14px"></div>`);
    zones.forEach(z => {
      const done = !!state.completions[z.id+'::'+freqKey(z.freq)];
      const fr = FREQ[z.freq];
      const row = el(`<div class="zone ${done?'done':''}"></div>`);
      const zinfo = el(`<div class="zone-info"></div>`);
      zinfo.appendChild(el(`<div class="zone-freq" style="color:${fr.tint}">${fr.label}</div>`));
      zinfo.appendChild(el(`<div class="zone-name">${esc(z.label)}</div>`));
      row.appendChild(zinfo);
      const mark = el(`<button class="zone-mark">${done?'✓':'Mark'}</button>`);
      mark.onclick = (e) => { e.stopPropagation(); toggleZone(z.id, z.freq); };
      row.appendChild(mark); list.appendChild(row);
    });
    card.appendChild(list);
  }
  return card;
}

function employeeCard(p) {
  const editing = state.editingEmp === p.id;

  if (editing) {
    const nameIn = el(`<input id="eeName_${p.id}" value="${esc(p.name)}" placeholder="Name">`);

    getTeams().forEach(t => {

    const canRow = el(`<div style="display:flex;gap:6px;flex-wrap:wrap"></div>`);
    UNIT_TYPE_ORDER.forEach(tk => {
      const on = canCleanType(p, tk);
      const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:1 1 28%">${on ? '✓ ' : ''}${UNIT_TYPES[tk].label}</button>`);
      b.onclick = () => toggleCanClean(p.id, tk);

    });

    const row = el(`<div style="display:flex;gap:8px"></div>`);

  info.appendChild(el(`<div class="person-name">${esc(p.name)}${leadBadge}</div>`));
  info.appendChild(el(`<div class="person-floors">${esc(personFloors(p))}</div>`));
  top.appendChild(info);
  card.appendChild(top);

  const ctl = el(`<div class="su-ctl" style="border-top:none;padding-top:0;margin-top:0;flex-wrap:wrap"></div>`);
  const clean = el(`<button class="freqmini ${p.isCleaner ? 'on' : ''}" style="flex:0 0 auto;padding:7px 14px">${p.isCleaner ? '✓ Cleaner' : '+ Cleaner'}</button>`);
  clean.onclick = () => toggleCleaner(p.id);
  const lead = el(`<button class="freqmini ${p.isLeader ? 'on' : ''}" style="flex:0 0 auto;padding:7px 14px">${p.isLeader ? '★ Leader' : '+ Leader'}</button>`);
  lead.onclick = () => toggleLeader(p.id);
  const sh = shiftOf(p);
  const shift = el(`<button class="freqmini" title="Tap to change shift" style="flex:0 0 auto;padding:7px 12px;color:${SHIFTS[sh].color};border-color:${SHIFTS[sh].color}">${SHIFTS[sh].icon} ${SHIFTS[sh].label}</button>`);
  shift.onclick = () => cycleShift(p.id);
  const ct = typeOf(p);
  const ctype = el(`<button class="freqmini" title="Tap to change type" style="flex:0 0 auto;padding:7px 12px;color:${CLEAN_TYPES[ct].color};border-color:${CLEAN_TYPES[ct].color}">${CLEAN_TYPES[ct].icon} ${CLEAN_TYPES[ct].label}</button>`);
  ctype.onclick = () => cycleCleanType(p.id);
  const ed = el(`<button class="su-edit">Edit</button>`);
  ed.onclick = () => startEditEmp(p.id);
  const rm = el(`<button class="su-rm">Remove</button>`);
  rm.onclick = () => removeEmployee(p.id);
  ctl.appendChild(clean); ctl.appendChild(lead); ctl.appendChild(shift); ctl.appendChild(ctype); ctl.appendChild(ed); ctl.appendChild(rm);
  card.appendChild(ctl);

  // WORKS ON — only worth the room for cleaners; nobody is handing rooms to the
  // rest, so a rota for them is noise. All seven lit is the default and means
  // "every day", which is why nothing here needs setting up before it works.
  if (p.isCleaner) {
    const wRow = el('<div class="su-ctl" style="border-top:none;padding-top:6px;margin-top:2px;flex-wrap:wrap;align-items:center"></div>');
    const offCount = Array.isArray(p.worksOn) ? 7 - p.worksOn.length : 0;
    wRow.appendChild(el(`<div style="flex:0 0 auto;font-size:11px;color:#5f7189;font-weight:700;margin-right:2px" `
      + `title="Which days this person is expected in">Works on${offCount ? '' : ' · every day'}</div>`));
    WEEKDAYS.forEach(([lbl, dow]) => {
      const rota = altRotaFor(p, dow);
      const st = rota ? 'rota' : worksStateOf(p, dow);
      const style = st === 'off' ? ';opacity:0.4'
        : st === 'rota' ? ';border-color:#7c3aed;color:#7c3aed' : '';
      const tip = st === 'off' ? 'Off every ' + lbl
        : st === 'on' ? 'In every ' + lbl
        : 'In on ' + rota.weeks.length + ' ' + lbl + 's out of every ' + rota.cycle;
      const b = el(`<button class="freqmini ${st === 'on' ? 'on' : ''}" title="${esc(tip)}" `
        + `style="flex:0 0 auto;padding:6px 9px;font-size:11px${style}">`
        + `${lbl}${rota ? ' ' + rota.weeks.length + '/' + rota.cycle : ''}</button>`);
      b.onclick = () => cycleWorksOn(p.id, dow);
      wRow.appendChild(b);
    });
    card.appendChild(wRow);
  }
  return card;
}

// Render staff grouped by team, using editable cards
function employeeGroups(wrap) {
  if (!STAFF.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">No employees yet. Add your first above.</div>`));
    return;
  }
  // Show only cleaners by default (once any are tagged); "All staff" reveals everyone.
  const anyCleaner = STAFF.some(p => p.isCleaner);
  const showAll = teamShowAll || !anyCleaner;
  const list = showAll ? STAFF : STAFF.filter(p => p.isCleaner);
  if (!list.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">No cleaners tagged yet. Switch to "All staff" and tap <b>+ Cleaner</b> on the cleaners.</div>`));
    return;
  }
  const crews = [...new Set(list.map(p => p.crew))];
  crews.forEach(crewName => {
    const members = list.filter(p => p.crew===crewName)
      .sort((a, b) => (b.isLeader?1:0) - (a.isLeader?1:0));   // team leader first
    const color = members[0].color;
    const group = el(`<div class="crew-group"></div>`);
    const head = el(`<div class="crew-head"></div>`);
    head.appendChild(el(`<div class="crew-dot" style="background:${color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${esc(crewName)}</div>`));
    head.appendChild(el(`<div class="crew-sub">${members.length}</div>`));
    group.appendChild(head);
    members.forEach(p => group.appendChild(employeeCard(p)));
    wrap.appendChild(group);
  });
}

function viewHistory() {
  const wrap = el('<div class="body"></div>');

  if (!db) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:30px 0">History needs the shared server, which isn't connected on this build.</div>`));
    return wrap;
  }

  // A night that never got entered is noticed here, so this is where you fix it.
  const pastBtn = el(`<button class="add-btn" style="width:100%;margin-bottom:14px">＋ Record a past day</button>`);
  pastBtn.onclick = () => openBackdate(historyDay && historyDay !== todayKey() ? historyDay : yesterdayKey());
  wrap.appendChild(pastBtn);

  // Room filter
  const sel = el(`<select class="area-select" style="margin-bottom:14px"></select>`);
  sel.appendChild(el(`<option value="all">All rooms</option>`));
  (state.servicedUnits || []).slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }))
    .forEach(u => {
      const o = el(`<option value="${esc(u.id)}">Unit ${esc(u.unit)}${u.guest ? ' · ' + esc(u.guest) : ''}</option>`);
      if (historyFilter === u.id) o.setAttribute('selected', '');
      sel.appendChild(o);
    });
  // Areas are logged like rooms, so they have to be findable like rooms.
  if (areasInterior().length) {
    const g = el(`<optgroup label="Communal areas"></optgroup>`);
    areasInterior().forEach(a => {
      const o = el(`<option value="${esc(areaLogId(a))}">${esc(a.label)}</option>`);
      if (historyFilter === areaLogId(a)) o.setAttribute('selected', '');
      g.appendChild(o);
    });
    sel.appendChild(g);
  }
  sel.onchange = (e) => { historyFilter = e.target.value; render(); };
  wrap.appendChild(sel);

  // Day picker — pick any past day to see what was cleaned that day (blank = every day).
  const dayRow = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"></div>');
  const dayIn = el(`<input type="date" value="${esc(historyDay)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#f4f7fb;color:#15202e;border:1px solid #d8e0ea;border-radius:8px;padding:8px 10px;font-size:14px">`);
  dayIn.onchange = (e) => { historyDay = e.target.value || ''; render(); };
  const calBtn = el('<button class="freqmini" title="Pick a date" style="flex:0 0 auto">📅</button>');
  calBtn.onclick = () => { try { dayIn.showPicker(); } catch (e) { dayIn.focus(); dayIn.click(); } };
  dayRow.appendChild(dayIn);
  dayRow.appendChild(calBtn);
  if (historyDay) {
    const clr = el('<button class="freqmini">✕ All days</button>');
    clr.onclick = () => { historyDay = ''; render(); };
    dayRow.appendChild(clr);
  }
  wrap.appendChild(dayRow);

  let rows = cleaningHistory;
  if (historyFilter !== 'all') rows = rows.filter(r => r.unit_id === historyFilter);
  if (historyDay) rows = rows.filter(r => dayKeyLocal(r.cleaned_at) === historyDay);

  const scope = historyDay ? ('on ' + historyDay) : 'in total';
  wrap.appendChild(el(`<div class="section-label">${rows.length} cleaning${rows.length === 1 ? '' : 's'} ${scope}</div>`));

  if (!rows.length) {
    const msg = historyDay ? 'Nothing was logged as cleaned on this day.' : 'Nothing logged yet. Mark a room clean and it shows up here.';
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">${msg}</div>`));
    return wrap;
  }

  // When viewing all days, break the list up with a header per day.
  let lastDay = null;
  rows.forEach(r => {
    if (!historyDay) {
      const dk = dayKeyLocal(r.cleaned_at);
      if (dk !== lastDay) {
        lastDay = dk;
        const dLabel = new Date(r.cleaned_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#5f7189">${esc(dLabel)}</div>`));
      }
    }
    const card = el(`<div class="su-card"></div>`);
    const top = el(`<div class="su-top"></div>`);
    const info = el(`<div style="flex:1;min-width:0"></div>`);
    // A communal area has a name, not a number — "Unit Main Lobby" reads as a fault.
    info.appendChild(el(`<div class="su-unit" style="font-size:15px">${isAreaLog(r.unit_id) ? '' : 'Unit '}${esc(r.unit_label || r.unit_id)}</div>`));
    info.appendChild(el(`<div class="su-guest">by ${esc(r.cleaner_name || 'Unknown')}</div>`));
    top.appendChild(info);
    top.appendChild(el(`<div class="su-next">${esc(fmtWhen(r.cleaned_at))}</div>`));
    card.appendChild(top);
    wrap.appendChild(card);
  });
  return wrap;
}

function viewTeam() {
  const wrap = el('<div class="body"></div>');
  const total = (state.staff || []).length;
  const cleaners = (state.staff || []).filter((p) => p.isCleaner).length;
  wrap.appendChild(el(`<div class="note">Tap <b>Cleaner</b> on a person to add them to the cleaning team — Roll Call and room assignments then show only cleaners. ${cleaners ? `<b>${cleaners}</b> of ${total} tagged.` : `None tagged yet, so all ${total} show for now.`}</div>`));

  // Filter: cleaners only (default) vs everyone. Lets you hide office/management after a sync.
  if (cleaners) {
    const seg = el('<div style="display:flex;gap:6px;margin-bottom:12px"></div>');
    const mk = (lbl, on, fn) => { const b = el(`<button class="freqpick ${on ? 'on' : ''}" style="flex:1">${lbl}</button>`); b.onclick = fn; return b; };
    seg.appendChild(mk(`Cleaners (${cleaners})`, !teamShowAll, () => { teamShowAll = false; render(); }));
    seg.appendChild(mk(`All staff (${total})`, teamShowAll, () => { teamShowAll = true; render(); }));
    wrap.appendChild(seg);
  }

  // SHARE OUT THE REST DAY — the Friday off alternates, so half the crew is in one
  // week and half the next. Doing that by hand across a whole crew is where it drifts
  // and somebody quietly ends up working most Fridays.
  if (cleaners) {
    const fri = 5;
    const crew = cleaningStaff();
    const onRota = crew.filter((p) => altRotaFor(p, fri));
    const box = el('<div style="margin-bottom:14px"></div>');
    box.appendChild(el(`<div class="section-label">Friday rota</div>`));
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 8px">`
      + `Pick how many are in each Friday. Everyone then does the same number of them, `
      + `and the week is easier for having had the hands.</div>`));
    const pickRow = el('<div style="display:flex;gap:6px;margin-bottom:8px"></div>');
    [2, 3, 4].forEach((n) => {
      if (n > crew.length) return;
      const b = el(`<button class="freqmini ${teamFridayPer === n ? 'on' : ''}" style="flex:1">${n} in</button>`);
      b.onclick = () => { teamFridayPer = n; render(); };
      pickRow.appendChild(b);
    });
    box.appendChild(pickRow);
    const btn = el(`<button class="add-btn" style="background:#7c3aed;color:#ffffff">⚖ Share the Friday rota out evenly</button>`);
    btn.onclick = () => {
      const rota = buildDayRota(fri, teamFridayPer);
      const each = rota.byPerson[Object.keys(rota.byPerson)[0]];
      const preview = rota.weeks.slice(0, 4)
        .map((wk, i) => 'Friday ' + (i + 1) + ': ' + wk.map((p) => p.name.split(' ')[0]).join(', ')).join('\n');
      showConfirm(
        rota.perWeek + ' in every Friday?',
        preview + (rota.cycle > 4 ? '\n… and so on' : '')
          + '\n\nIt comes round every ' + rota.cycle + ' weeks, so each of the ' + rota.crew.length
          + ' works ' + (each ? each.weeks.length : 0) + ' Fridays out of ' + rota.cycle
          + ' — the same for everybody. You can still change any one person by hand afterwards.',
        () => applyDayRota(fri, rota),
        'Set the rota',
        'safe'
      );
    };
    box.appendChild(btn);
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
      + (onRota.length
        ? `${onRota.length} of ${crew.length} are on a Friday rota — <b>${crew.filter((p) => worksOnDay(p, nextDowKey(fri))).length}</b> in this coming Friday.`
        : `Nobody is on a Friday rota yet — everyone is down as working every one.`)
      + `</div>`));
    wrap.appendChild(box);
  }

  // Add-employee form only matters when viewing everyone.
  if (teamShowAll || !cleaners) wrap.appendChild(employeeAddForm());
  employeeGroups(wrap);
  return wrap;
}

let _confirmState = null;
// okLabel/okTone let a non-destructive confirm (e.g. changing a schedule) avoid the
// red "Remove" button, which reads as "you're about to delete something".
function showConfirm(title, message, onConfirm, okLabel, okTone) {
  _confirmState = { title, message, onConfirm, okLabel, okTone };
  renderConfirmModal();
}
function dismissConfirmModal() { _confirmState = null; const e = document.getElementById('confirmModal'); if (e) e.remove(); }
function renderConfirmModal() {
  if (!_confirmState) return;
  const existing = document.getElementById('confirmModal');
  if (existing) existing.remove();
  const overlay = el(`<div class="modal-overlay" id="confirmModal" style="align-items:center"></div>`);
  const modal = el(`<div class="modal" style="border-radius:16px"></div>`);
  modal.appendChild(el(`<div class="modal-title">${esc(_confirmState.title)}</div>`));
  modal.appendChild(el(`<div class="modal-sub">${esc(_confirmState.message)}</div>`));
  const btnRow = el(`<div class="modal-btns"></div>`);
  const cancelBtn = el(`<button class="modal-skip">Cancel</button>`);
  cancelBtn.onclick = () => dismissConfirmModal();
  const confirmBtn = el(`<button class="${_confirmState.okTone === 'safe' ? 'modal-confirm' : 'modal-danger'}">${esc(_confirmState.okLabel || 'Remove')}</button>`);
  confirmBtn.onclick = () => { const cb = _confirmState.onConfirm; dismissConfirmModal(); cb(); };
  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(confirmBtn);
  modal.appendChild(btnRow);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) dismissConfirmModal(); };
  document.getElementById('app').appendChild(overlay);
}

// The sheet for recording a past day. Ticks and name-picks update the DOM in place
// rather than re-rendering: on a 60-room list a full redraw on every tap throws the
// office back to the top of the page mid-entry.
function backdateSheet() {
  const b = _backdate;
  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`<div class="modal" style="max-height:88vh;overflow-y:auto"></div>`);
  modal.appendChild(el(`<div class="modal-title">Record a past day</div>`));
  modal.appendChild(el(`<div class="modal-sub">Log work that was already done, on the day it happened. The names offered are the people who badged in that day.</div>`));

  // --- which day ---
  modal.appendChild(el(`<div class="modal-label">Which day</div>`));
  const dayRow = el(`<div style="display:flex;gap:6px;align-items:center"></div>`);
  const dayIn = el(`<input type="date" value="${esc(b.day)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#f4f7fb;color:#15202e;border:1px solid #d8e0ea;border-radius:8px;padding:9px 10px;font-size:14px">`);
  dayIn.onchange = (e) => setBackdateDay(e.target.value);
  dayRow.appendChild(dayIn);
  [['Yesterday', yesterdayKey()], ['Today', todayKey()]].forEach(([lbl, d]) => {
    const btn = el(`<button class="freqmini ${b.day === d ? 'on' : ''}" style="flex:0 0 auto;padding:9px 10px">${lbl}</button>`);
    btn.onclick = () => setBackdateDay(d);
    dayRow.appendChild(btn);
  });
  modal.appendChild(dayRow);

  // --- who was in that day ---
  const crew = Object.keys(b.arrivals)
    .map(id => (state.staff || []).find(p => p.id === id))
    .filter(Boolean)
    .sort((x, y) => String(b.arrivals[x.id].raw || '').localeCompare(String(b.arrivals[y.id].raw || '')));
  let crewMsg, crewTone = '#5f7189';
  if (b.loading) crewMsg = 'Checking who badged in…';
  else if (b.failed) { crewMsg = 'Could not read attendance for this day — pick names by hand.'; crewTone = '#b45309'; }
  else if (!crew.length) { crewMsg = 'Nobody badged in on this day. Add them on Roll Call for that day, or record the rooms as Office.'; crewTone = '#b45309'; }
  else crewMsg = crew.length + ' badged in — ' + crew.map(p => p.name.split(' ')[0] + ' ' + (b.arrivals[p.id].time || '')).join(' · ');
  modal.appendChild(el(`<div style="font-size:12px;color:${crewTone};font-weight:600;margin-top:10px;line-height:1.5">${esc(crewMsg)}</div>`));

  // --- which rooms ---
  modal.appendChild(el(`<div class="modal-label">What was cleaned</div>`));
  const filterRow = el(`<div style="display:flex;gap:6px;margin-bottom:10px"></div>`);
  [['all', 'All'], ['airbnb', 'Airbnb'], ['office', 'Offices'], ['building', 'Buildings']].forEach(([k, lbl]) => {
    const btn = el(`<button class="freqmini ${b.type === k ? 'on' : ''}">${lbl}</button>`);
    btn.onclick = () => setBackdateType(k);
    filterRow.appendChild(btn);
  });
  modal.appendChild(filterRow);

  const rooms = backdateRooms();
  const openRooms = rooms.filter(u => !loggedOnDay(u.id, b.day));
  const countLbl = el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:1"></div>`);
  const selRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"></div>`);
  selRow.appendChild(countLbl);
  const allBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">Tick all</button>`);
  allBtn.onclick = () => backdateSelectAll(true);
  const noneBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">Clear</button>`);
  noneBtn.onclick = () => backdateSelectAll(false);
  selRow.appendChild(allBtn); selRow.appendChild(noneBtn);
  modal.appendChild(selRow);

  const saveBtn = el(`<button class="modal-confirm"></button>`);
  const tickedCount = () => openRooms.filter(u => b.chosen[u.id]).length;
  const refreshCount = () => {
    const n = tickedCount();
    countLbl.textContent = n + ' of ' + openRooms.length + ' ticked';
    saveBtn.textContent = b.saving ? 'Saving…' : (n ? 'Log ' + n + ' cleaning' + (n === 1 ? '' : 's') : 'Log cleanings');
  };

  if (!rooms.length) modal.appendChild(el(`<div class="empty" style="text-align:center;padding:18px 0">No rooms of this kind.</div>`));
  rooms.forEach(u => {
    const already = loggedOnDay(u.id, b.day);
    const card = el(`<div class="su-card" style="padding:10px 12px;${already ? 'opacity:0.55' : ''}"></div>`);
    card.style.borderLeft = '3px solid ' + UNIT_TYPES[unitType(u)].color;
    const top = el(`<div style="display:flex;align-items:center;gap:10px"></div>`);
    const label = el(`<div style="flex:1;min-width:0"><div class="su-unit" style="font-size:14px">Unit ${esc(u.unit)}</div>`
      + `<div class="su-guest">${esc(u.guest || UNIT_TYPES[unitType(u)].label)}</div></div>`);
    if (already) {
      top.appendChild(label);
      top.appendChild(el(`<div class="su-next">Already logged</div>`));
      card.appendChild(top);
      modal.appendChild(card);
      return;
    }
    const tick = el(`<button class="freqmini ${b.chosen[u.id] ? 'on' : ''}" style="flex:0 0 auto;width:38px;padding:9px 0;font-size:13px">${b.chosen[u.id] ? '✓' : '○'}</button>`);
    const setTicked = (on) => {
      b.chosen[u.id] = on;
      tick.classList.toggle('on', on);
      tick.textContent = on ? '✓' : '○';   // an empty box reads as a field to fill in, not a tick
      refreshCount();
    };
    tick.onclick = () => setTicked(!b.chosen[u.id]);
    top.appendChild(tick);
    top.appendChild(label);
    card.appendChild(top);

    const cands = backdateCandidates(u);
    const cur = backdatePick(u);
    const who = el(`<select class="area-select" style="width:100%;margin-top:8px"></select>`);
    who.appendChild(el(`<option value="">${cands.length ? '— who cleaned it? —' : '— nobody badged in —'}</option>`));
    cands.forEach(p => {
      const o = el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`);
      if (cur === p.id) o.setAttribute('selected', '');
      who.appendChild(o);
    });
    const off = el(`<option value="office">Office (nobody badged in for it)</option>`);
    if (cur === 'office') off.setAttribute('selected', '');
    who.appendChild(off);
    // Naming who did a room says it was done — tick it rather than making the
    // office tap twice for the same fact.
    who.onchange = (e) => { b.picks[u.id] = e.target.value; if (e.target.value && !b.chosen[u.id]) setTicked(true); };
    card.appendChild(who);
    modal.appendChild(card);
  });

  if (b.warn) modal.appendChild(el(`<div style="font-size:12px;color:#b45309;font-weight:600;margin-top:12px;line-height:1.5">${esc(b.warn)}</div>`));

  // Sticky: with 60 rooms on the list, a footer at the end of the scroll is a
  // long way from the room you just ticked.
  const btnRow = el(`<div class="modal-btns" style="position:sticky;bottom:0;background:#ffffff;padding:10px 0 2px"></div>`);
  const cancel = el(`<button class="modal-skip">Cancel</button>`);
  cancel.onclick = () => { if (!b.saving) closeBackdate(); };
  saveBtn.onclick = () => saveBackdate();
  if (b.saving) saveBtn.disabled = true;
  btnRow.appendChild(cancel); btnRow.appendChild(saveBtn);
  modal.appendChild(btnRow);
  refreshCount();

  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay && !b.saving) closeBackdate(); };
  return overlay;
}

// MAIN RENDER
// ============================================================
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const s = statsBar();

  const header = el(`<div class="header"></div>`);
  header.appendChild(el(`<div class="h-eyebrow">66-UNIT BUILDING · 11 FLOORS</div>`));
  const titles = { offices:'Office Cleaning', buildings:'Building Cleaning', airbnb:'Airbnb Rooms', more:'More', rollcall:'Morning Roll Call', building:'Floors & Common Areas', exterior:'Exterior', history:'Cleaning History', team:'Team', settings:'Settings', plan:'Plan a Day', rooms:'All Rooms', tonight:'Tonight’s Round' };
  // A tab with no view renders an empty screen, so never trust it blindly:
  // fall back to Roll Call rather than showing a header over nothing.
  if (!titles[state.tab]) state.tab = 'rollcall';
  header.appendChild(el(`<div class="h-title">${titles[state.tab]}</div>`));
  header.appendChild(el(`<div class="h-date">${dateStr}</div>`));
  const typeTab = { offices: 'office', buildings: 'building', airbnb: 'airbnb' }[state.tab];
  if (typeTab) {
    const inType = state.servicedUnits.filter(u => unitType(u) === typeTab);
    // Today's list = rooms due now + rooms already cleaned today, so the count
    // doesn't shrink as the crew works through it ("3 of 12 done", not "9 due").
    const todayList = inType.filter(onTodaysList);
    const doneCount = todayList.filter(cleanedToday).length;
    const strip = el(`<div class="stats"></div>`);
    strip.appendChild(el(`<div class="stat"><div class="lbl">DUE TODAY</div><div class="val">${todayList.length}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">CLEANED</div><div class="val">${doneCount}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">TOTAL</div><div class="val">${inType.length}</div></div>`));
    header.appendChild(strip);
  }
  if (state.tab === 'rollcall') {
    const clockedIn = Object.keys(hikArrivals).length;
    const assigned = (state.servicedUnits || []).filter((u) => u.assignedTo).length;
    const totalRooms = (state.servicedUnits || []).length;
    const strip = el(`<div class="stats"></div>`);
    strip.appendChild(el(`<div class="stat"><div class="lbl">CLOCKED IN</div><div class="val">${clockedIn}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">ROOMS ASSIGNED</div><div class="val">${assigned}/${totalRooms}</div></div>`));
    header.appendChild(strip);
  }
  app.appendChild(header);

  if (state.tab==='offices') app.appendChild(viewOffices());
  else if (state.tab==='buildings') app.appendChild(viewBuildings());
  else if (state.tab==='airbnb') app.appendChild(viewAirbnb());
  else if (state.tab==='more') app.appendChild(viewMore());
  else if (state.tab==='plan') app.appendChild(viewPlan());
  else if (state.tab==='tonight') app.appendChild(viewTonight());
  else if (state.tab==='rooms') app.appendChild(viewRooms());
  else if (state.tab==='rollcall') app.appendChild(viewRollCall());
  else if (state.tab==='building') app.appendChild(viewBuilding());
  else if (state.tab==='exterior') app.appendChild(viewExterior());
  else if (state.tab==='history') app.appendChild(viewHistory());
  else if (state.tab==='team') app.appendChild(viewTeam());
  else if (state.tab==='settings') app.appendChild(viewSettings());

  app.appendChild(el(`<div class="footer">Changes save on this device · Daily tasks reset each day</div>`));

  // --- Cover confirmation popup ---
  if (state.pendingCover) {
    const pc = state.pendingCover;
    const absent = STAFF.find(p => p.id === pc.absentId);
    const affected = unitsOwnedBy(pc.absentId);
    if (absent && affected.length) {
      const overlay = el(`<div class="modal-overlay"></div>`);
      const modal = el(`<div class="modal"></div>`);
      modal.appendChild(el(`<div class="modal-title">${esc(absent.name.split(' ')[0])} is absent</div>`));
      const unitList = affected.map(u => 'Unit ' + esc(u.unit)).join(', ');
      modal.appendChild(el(`<div class="modal-sub">${affected.length} unit${affected.length>1?'s':''} need cover: ${unitList}</div>`));

      // chosen coverer (default = suggestion), selectable
      let chosen = pc.suggestId;
      modal.appendChild(el(`<div class="modal-label">Assign cover to:</div>`));
      const picker = el(`<div class="cover-picker"></div>`);
      const present = STAFF.filter(p => p.id !== pc.absentId && state.attendance[p.id] !== 'noshow');
      const loads = unitLoads();
      if (!present.length) {
        modal.appendChild(el(`<div class="modal-sub" style="color:#dc2626">No one else is present to cover.</div>`));
      }
      present
        .sort((a,b) => (loads[a.id]||0)-(loads[b.id]||0))
        .forEach(p => {
          const isSug = p.id === pc.suggestId;
          const btn = el(`<button class="cover-opt ${p.id===chosen?'on':''}">${esc(p.name.split(' ')[0])}<span class="cover-load">${loads[p.id]||0} units${isSug?' · lightest':''}</span></button>`);
          btn.onclick = () => { chosen = p.id; picker.querySelectorAll('.cover-opt').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); };
          picker.appendChild(btn);
        });
      modal.appendChild(picker);

      const btnRow = el(`<div class="modal-btns"></div>`);
      const confirmB = el(`<button class="modal-confirm">Confirm cover</button>`);
      confirmB.onclick = () => { if (chosen) confirmCover(chosen); else dismissCover(); };
      const skipB = el(`<button class="modal-skip">Skip for now</button>`);
      skipB.onclick = () => dismissCover();
      if (present.length) btnRow.appendChild(confirmB);
      btnRow.appendChild(skipB);
      modal.appendChild(btnRow);

      overlay.appendChild(modal);
      app.appendChild(overlay);
    }
  }

  if (_backdate) app.appendChild(backdateSheet());

  const nav = el(`<div class="nav"></div>`);
  const tabs = [
    { id:'rollcall', label:'Roll Call', ico:'☀' },
    { id:'airbnb', label:'Airbnb', ico:'⌂' },
    { id:'offices', label:'Offices', ico:'▤' },
    { id:'buildings', label:'Buildings', ico:'▦' },
    { id:'more', label:'More', ico:'⋯' },
  ];
  // "More" stays highlighted while you're on any of its sub-pages.
  const moreIds = ['more','rooms','plan','building','history','team','settings'];
  tabs.forEach(t => {
    const isActive = t.id === 'more' ? moreIds.includes(state.tab) : state.tab === t.id;
    const b = el(`<button class="${isActive?'active':''}"><div class="ico">${t.ico}</div><div>${t.label}</div></button>`);
    b.onclick = () => setTab(t.id);
    nav.appendChild(b);
  });
  app.appendChild(nav);
}

// ============================================================
// LOGIN  (real accounts via Supabase Auth; the local gate is only a
// fallback for when the server isn't configured)
// ============================================================
const AUTH_KEY = 'cleaning_app_auth';                              // legacy fallback flag
const CREDENTIALS = { username: 'admin', password: 'admin123' };   // fallback only (no server)
let authed = false;                                                // true when a real Supabase session exists

// Synchronous "is someone signed in?" used by route()/boot().
function isLoggedIn() { return db ? authed : (localStorage.getItem(AUTH_KEY) === 'true'); }

async function logout() {
  try { if (db) await db.auth.signOut(); } catch (e) {}
  authed = false;
  localStorage.removeItem(AUTH_KEY);
  renderLogin();
}

async function attemptLogin() {
  const pinEl = document.getElementById('loginPin');
  const errEl = document.getElementById('loginErr');
  const pin = (pinEl.value || '').trim();
  const fail = (msg) => { errEl.textContent = msg; pinEl.classList.add('error'); };
  if (!/^\d{4}$/.test(pin)) { fail('Enter your 4-digit PIN'); return; }
  const email = 'admin@orfanerealestate.so';
  const password = 'orfane-' + pin;   // 4-digit PIN padded to a valid password

  if (db) {
    const btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
    try {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      authed = true;
      boot();
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
      pinEl.value = '';
      fail('Wrong PIN');
    }
    return;
  }
  fail('Server not connected.');
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const screen = el(`<div class="login-screen"></div>`);
  const box = el(`<div class="login-box"></div>`);
  box.appendChild(el(`<div class="login-logo">✦</div>`));
  box.appendChild(el(`<div class="login-heading">Cleaning Ops</div>`));
  box.appendChild(el(`<div class="login-sub">Enter your 4-digit PIN</div>`));
  const pin = el(`<input class="login-input" id="loginPin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" style="text-align:center;letter-spacing:0.6em;font-size:26px">`);
  pin.addEventListener('input', () => {
    pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
    pin.classList.remove('error');
    if (pin.value.length === 4) attemptLogin();   // auto-submit on 4th digit
  });
  pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  box.appendChild(pin);
  const btn = el(`<button class="login-btn" id="loginBtn">Sign In</button>`);
  btn.onclick = attemptLogin;
  box.appendChild(btn);
  box.appendChild(el(`<div class="login-error" id="loginErr"></div>`));
  screen.appendChild(box);
  app.appendChild(screen);
  setTimeout(() => { try { pin.focus(); } catch (e) {} }, 100);
}

async function boot() {
  load();
  route();              // login → app
  await remotePull();   // wait for the staff roster before matching arrivals
  ensureTomorrowPlanned();   // tomorrow is laid out and handed round without anyone asking
  loadHikArrivals().then(() => { maybeAutoAssign(); route(); });
  startArrivalPolling();
  subscribeRealtime();
  refreshHistory();
  subscribeHistory();
}

// Startup: restore any existing Supabase session, then show the right screen.
async function startup() {
  if (!db) { if (isLoggedIn()) boot(); else renderLogin(); return; }
  try {
    const { data } = await db.auth.getSession();
    authed = !!(data && data.session);
  } catch (e) { authed = false; }
  db.auth.onAuthStateChange((_event, session) => {
    const was = authed;
    authed = !!session;
    if (!authed && was) renderLogin();   // signed out / session expired → back to login
  });
  if (authed) boot(); else renderLogin();
}
startup();
