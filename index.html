  /* Login screen */
  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  .login-btn { width: 100%; background: #29b6f5; color: #0a0e16; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; margin-top: 4px; }
  .login-error { font-size: 12px; color: #f87171; text-align: center; margin-top: 12px; font-weight: 600; }

  /* Backup buttons */
  .backup-btn { width: 100%; border-radius: 10px; padding: 13px; font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .backup-export { background: #141b28; color: #29b6f5; border: 1px solid #1f4a63; }
  .backup-import { background: #141b28; color: #d4a72c; border: 1px solid #4a3a10; }
  .backup-msg { font-size: 12px; text-align: center; margin-top: 8px; font-weight: 600; padding: 8px; border-radius: 8px; }
  .backup-msg.ok { color: #34d399; background: #0f2620; }
  .backup-msg.err { color: #f87171; background: #2a1515; }

  /* Persistent storage warning (save/load failures) */
  .storage-warn { background: #2a1515; color: #f87171; border-bottom: 1px solid #3a1a1a; padding: 11px 14px; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.4; }

  /* Make the native date-picker calendar icon visible on our dark fields */
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.65; cursor: pointer; }
  input[type="date"] { -webkit-appearance: none; appearance: none; }
</style>

<script>
// ============================================================
// SHARED SERVER (Supabase) — fill these two in after creating your project.
// Until then the app keeps working locally (localStorage only), exactly as before.
// See SETUP.md for the 5-minute walkthrough.
// ============================================================
const SUPABASE_URL = 'https://issnrivggzkhrcjfhzit.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzc25yaXZnZ3praHJjamZoeml0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNzU3MTIsImV4cCI6MjA5OTY1MTcxMn0.XiBy2O1KD41as85PsZCuEqkMXCFFfKQcgpr0-628pGI';
const BUILDING = 'orfane-main';   // must match the seeded row in supabase-schema.sql
const db = (window.supabase && !SUPABASE_URL.includes('YOUR-') && !SUPABASE_ANON_KEY.includes('YOUR-'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// ============================================================
// DATA MODEL — Edit STAFF to match your real team (one-time).
// ============================================================
const DEFAULT_STAFF = [
  { id: 'p1', name: 'Sofia Reyes',   crew: 'Team A', color: '#29b6f5', floors: [1, 2] },
  { id: 'p2', name: 'Daniel Chen',   crew: 'Team A', color: '#29b6f5', floors: [3, 4] },
  { id: 'p3', name: 'Priya Shah',    crew: 'Team B', color: '#29b6f5', floors: [5, 6] },
  { id: 'p4', name: 'Jamal Brooks',  crew: 'Team B', color: '#29b6f5', floors: [7, 8] },
  { id: 'p5', name: 'Elena Volkov',  crew: 'Team C', color: '#a78bfa', floors: [9, 10, 11] },
  { id: 'p6', name: 'Marcus Hill',   crew: 'Lead',   color: '#c2410c', floors: [], special: ['ground', 'rooftop'] },
];
// STAFF is a live reference into state.staff (set in load()). Using a getter
// so all existing code that reads STAFF keeps working unchanged.
let STAFF = DEFAULT_STAFF;

const DEFAULT_AREAS = [
  // Interior — ground/common
  { id: 'lobby', label: 'Main Lobby', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'mail', label: 'Mail Room', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'gym', label: 'Fitness Room', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'laundry', label: 'Laundry Room', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'trash', label: 'Trash / Recycling', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'elevator', label: 'Elevators / Lifts', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'stairs', label: 'Stairwells', freq: 'weekly', kind: 'interior', assignedTo: null },
  { id: 'corridors', label: 'Corridors', freq: 'daily', kind: 'interior', assignedTo: null },
  { id: 'windowsint', label: 'Interior Windows', freq: 'monthly', kind: 'interior', assignedTo: null },
  // Exterior
  { id: 'entrance', label: 'Entrance & Walkway', freq: 'daily', kind: 'exterior', assignedTo: null },
  { id: 'dumpster', label: 'Dumpster / Bin Store', freq: 'daily', kind: 'exterior', assignedTo: null },
  { id: 'sidewalks', label: 'Sidewalks', freq: 'weekly', kind: 'exterior', assignedTo: null },
  { id: 'landscape', label: 'Landscaping Edges', freq: 'weekly', kind: 'exterior', assignedTo: null },
  { id: 'windowsext', label: 'Exterior Windows', freq: 'monthly', kind: 'exterior', assignedTo: null },
  { id: 'rooftopcheck', label: 'Rooftop Check', freq: 'weekly', kind: 'exterior', assignedTo: null },
];
const DEFAULT_FLOORS = 11;

const FREQ = {
  daily:   { label: 'DAILY', tint: '#29b6f5' },
  weekly:  { label: 'WEEKLY', tint: '#d4a72c' },
  monthly: { label: 'MONTHLY', tint: '#a78bfa' },
};
const STATUS = {
  present: { label: 'PRESENT', color: '#34d399' },
  late:    { label: 'LATE', color: '#d4a72c' },
  noshow:  { label: 'NO-SHOW', color: '#f87171' },
  off:     { label: 'OFF', color: '#5d748c' },
};
const STATUS_ORDER = ['present', 'late', 'noshow', 'off'];

// Areas live in state (editable). Helpers to read them:
function areasInterior() { return (state.areas || []).filter(a => a.kind === 'interior'); }
function areasExterior() { return (state.areas || []).filter(a => a.kind === 'exterior'); }
// The cleaning crew = staff tagged as cleaners. Until anyone is tagged, fall
// back to everyone so cleaning screens are never empty after a Hik import.
function cleaningStaff() {
  const tagged = (state.staff || []).filter((p) => p.isCleaner);
  return tagged.length ? tagged : (state.staff || []);
}
function buildUnits() {
  const u = [];
  const floors = (state && state.floors) ? state.floors : DEFAULT_FLOORS;
  for (let f = 1; f <= floors; f++)
    for (let n = 1; n <= 6; n++)
      u.push({ id: 'u' + (f * 100 + n), num: f * 100 + n, floor: f });
  return u;
}

// ============================================================
// STATE
// ============================================================
const STORE = 'cleaning_app_v5';
// Local-time date keys (NOT toISOString/UTC) so the daily reset and schedules
// flip at local midnight, not a UTC-offset hour. Must stay consistent with
// daysSince()/unitDueToday(), which also use local time.
const todayKey = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const shiftDay = (key, delta) => { const [y,m,d]=key.split('-').map(Number); const dt=new Date(y,m-1,d+delta); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); };
const weekKey = () => { const d=new Date(),o=new Date(d.getFullYear(),0,1); return d.getFullYear()+'-W'+Math.ceil(((d-o)/864e5+o.getDay()+1)/7); };
const monthKey = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const freqKey = f => f==='daily'?todayKey():f==='weekly'?weekKey():f==='monthly'?monthKey():'perm';

// Days difference between an ISO date and today (whole days)
const daysSince = (iso) => {
  const a = new Date(iso + 'T00:00:00');
  const b = new Date(todayKey() + 'T00:00:00');
  return Math.round((b - a) / 864e5);
};

// Is a serviced unit due for cleaning today?
function unitDueToday(u) {
  if (u.freq === 'nightly') return true;
  if (u.freq === 'daily') return true;
  if (u.freq === 'eod') { const d = daysSince(u.startDate); return d >= 0 && d % 2 === 0; }
  if (u.freq === 'weekly') {
    const start = new Date(u.startDate + 'T00:00:00');
    return start.getDay() === new Date().getDay();
  }
  return false;
}
const FREQ_LABEL = { nightly: 'Nightly', daily: 'Daily', eod: 'Every other day', weekly: 'Weekly' };

// Infer floor from unit number: 906->9, 1106->11, 506->5
function floorOfUnit(unitStr) {
  const n = parseInt(String(unitStr).replace(/\D/g, ''), 10);
  if (isNaN(n)) return null;
  return Math.floor(n / 100) || null;
}
function ownerOfFloor(floor) {
  if (floor == null) return null;
  return STAFF.find(p => (p.floors || []).includes(floor)) || null;
}
// Who cleans this unit today: override > confirmed cover > floor owner
function cleanerForUnit(u) {
  if (u.assignedTo) { const p = STAFF.find(s => s.id === u.assignedTo); if (p) return { person: p, reason: 'override' }; }
  if (state.unitCover && state.unitCover[u.id]) { const p = STAFF.find(s => s.id === state.unitCover[u.id]); if (p) return { person: p, reason: 'cover' }; }
  const owner = ownerOfFloor(floorOfUnit(u.unit));
  if (owner) return { person: owner, reason: state.attendance[owner.id] === 'noshow' ? 'owner-absent' : 'owner' };
  return null;
}
// Count today's units per present person (for lightest-load suggestion)
function unitLoads() {
  const load = {};
  STAFF.forEach(p => { if (state.attendance[p.id] !== 'noshow') load[p.id] = 0; });
  state.servicedUnits.forEach(u => {
    const c = cleanerForUnit(u);
    if (c && c.reason !== 'owner-absent' && load[c.person.id] != null) load[c.person.id]++;
  });
  return load;
}
// Suggest lightest-loaded present person (excluding the absent owner)
function suggestCoverPerson(excludeId) {
  const load = unitLoads();
  const cands = Object.keys(load).filter(pid => pid !== excludeId);
  if (!cands.length) return null;
  cands.sort((a, b) => load[a] - load[b]);
  return STAFF.find(p => p.id === cands[0]) || null;
}
// Units a given person owns (via their floors) that are serviced
function unitsOwnedBy(personId) {
  const p = STAFF.find(s => s.id === personId);
  if (!p) return [];
  return state.servicedUnits.filter(u => (p.floors || []).includes(floorOfUnit(u.unit)) && !u.assignedTo);
}

// Seed any missing pieces from defaults + rebuild derived references (STAFF, team colors).
// Runs after both local load and remote sync so the shapes are always valid.
function finalizeState() {
  if (!Array.isArray(state.staff)) state.staff = DEFAULT_STAFF.map(p => ({ ...p }));
  if (!Array.isArray(state.areas)) state.areas = DEFAULT_AREAS.map(a => ({ ...a }));
  if (!Array.isArray(state.teams)) state.teams = DEFAULT_TEAMS.map(t => ({ ...t }));
  if (typeof state.floors !== 'number' || state.floors < 1) state.floors = DEFAULT_FLOORS;
  STAFF = state.staff;
  refreshTeamColors();
  STAFF.forEach(p => { if (!state.attendance[p.id]) state.attendance[p.id] = 'present'; });
}

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const saved = JSON.parse(raw);
      state = { ...state, ...saved, tab: 'rollcall' };
      if (state.coverageDay !== todayKey()) { state.coverage = {}; state.unitCover = {}; state.pendingCover = null; state.coverageDay = todayKey(); }
    }
  } catch (e) {}
  finalizeState();
}

// Save = write the local cache instantly, then push to the shared server.
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  remotePush();
}

// ============================================================
// SHARED SERVER SYNC (Supabase)
// The whole app state is stored as one row per building. Every device
// pulls it on open, pushes on every change, and gets live updates.
// NOTE (concurrency): this is document-level "last write wins". If two
// people save within the same ~second, one change can be overwritten.
// Fine for a small crew; if that becomes a problem the high-write pieces
// (attendance, completions) should move to their own rows — see SETUP.md.
// ============================================================
let _lastRemoteJSON = null;   // dedupe realtime echoes of our own writes
let _pushTimer = null;

function remotePush() {
  if (!db) return;             // not configured yet → local-only (unchanged behavior)
  clearTimeout(_pushTimer);    // debounce bursts of saves into one network write
  _pushTimer = setTimeout(async () => {
    try {
      const snapshot = JSON.stringify(state);
      _lastRemoteJSON = snapshot;
      const { error } = await db.from('app_state')
        .upsert({ building: BUILDING, data: JSON.parse(snapshot), updated_at: new Date().toISOString() });
      if (error) throw error;
      hideStorageWarn();
    } catch (e) {
      showStorageWarn('Changes are NOT saving to the server (' + (e.message || e) + '). They are kept on this device only.');
    }
  }, 250);
}

async function remotePull() {
  if (!db) return;
  try {
    const { data, error } = await db.from('app_state').select('data').eq('building', BUILDING).maybeSingle();
    if (error) throw error;
    if (data && data.data && Object.keys(data.data).length) {
      applyRemote(data.data);
    } else {
      remotePush();            // server empty → seed it with what this device has
    }
    hideStorageWarn();
  } catch (e) {
    showStorageWarn('Cannot reach the server (' + (e.message || e) + '). Showing this device\'s saved copy.');
  }
}

// Adopt state coming from the server (initial pull or a live update from another device).
function applyRemote(saved) {
  const serialized = JSON.stringify(saved);
  if (serialized === _lastRemoteJSON) return;   // this is our own write echoing back
  _lastRemoteJSON = serialized;
  const keepTab = state.tab;
  state = { ...state, ...saved, tab: keepTab, pendingCover: null, editingUnit: null, editingArea: null, editingEmp: null };
  if (state.coverageDay !== todayKey()) { state.coverage = {}; state.unitCover = {}; state.pendingCover = null; state.coverageDay = todayKey(); }
  finalizeState();
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  route();
}

function subscribeRealtime() {
  if (!db) return;
  db.channel('app_state_' + BUILDING)
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'app_state', filter: 'building=eq.' + BUILDING },
        (payload) => { if (payload.new && payload.new.data) applyRemote(payload.new.data); })
    .subscribe();
}

// The "save failed" banner (styled but previously never shown).
function showStorageWarn(msg) {
  let el = document.getElementById('storageWarn');
  if (!el) {
    el = document.createElement('div');
    el.id = 'storageWarn';
    el.className = 'storage-warn';
    el.style.position = 'sticky'; el.style.top = '0'; el.style.zIndex = '60';
    document.body.insertBefore(el, document.body.firstChild);
  }
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
function hideStorageWarn() {
  const el = document.getElementById('storageWarn');
  if (el) el.style.display = 'none';
}

// Friendly timestamp: "Today 2:30 PM", "Yesterday 9:05 AM", "Jul 14, 2:30 PM".
function fmtWhen(iso) {
  try {
    const d = new Date(iso);
    const now = new Date();
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'Today ' + time;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'Yesterday ' + time;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + time;
  } catch (e) { return iso; }
}

// LOGIC
// ============================================================
function personFloors(p) {
  const parts = [];
  if (p.floors && p.floors.length) parts.push('Floors ' + p.floors.join(', '));
  if (p.special) parts.push(p.special.map(s => s==='ground'?'Ground':'Rooftop').join(' + '));
  return parts.join(' · ') || 'No assignment';
}
function gaps() {
  const out = [];
  STAFF.forEach(p => {
    if (state.attendance[p.id] === 'noshow' && p.floors && p.floors.length) {
      p.floors.forEach(f => { if (!state.coverage[f]) out.push({ person: p, floor: f }); });
    }
  });
  return out;
}
function suggestCover(floor) {
  const candidates = STAFF.filter(p =>
    (state.attendance[p.id]==='present' || state.attendance[p.id]==='late') && p.floors && p.floors.length);
  if (!candidates.length) return null;
  const load = {};
  candidates.forEach(p => load[p.id] = (p.floors||[]).length);
  Object.values(state.coverage).forEach(pid => { if (load[pid]!=null) load[pid]++; });
  candidates.sort((a,b) => load[a.id]-load[b.id]);
  return candidates[0];
}
function whoCleansFloor(floor) {
  if (state.coverage[floor]) {
    const c = STAFF.find(p => p.id===state.coverage[floor]);
    if (c) return { person: c, covering: true };
  }
  const owner = STAFF.find(p => (p.floors||[]).includes(floor));
  return owner ? { person: owner, covering: false } : null;
}

// ============================================================
// ACTIONS
// ============================================================
function cycleStatus(pid) {
  const cur = state.attendance[pid] || 'present';
  const next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
  state.attendance[pid] = next;

  if (next === 'noshow') {
    // Does this person own any serviced units (via their floors)?
    const affected = unitsOwnedBy(pid);
    if (affected.length) {
      const sug = suggestCoverPerson(pid);
      state.pendingCover = { absentId: pid, suggestId: sug ? sug.id : null };
    }
  } else {
    // Back to present/late/off — release any cover they were given and clear pending
    if (state.unitCover) {
      Object.keys(state.unitCover).forEach(uid => {
        const u = state.servicedUnits.find(x => x.id === uid);
        if (u && ownerOfFloor(floorOfUnit(u.unit))?.id === pid) delete state.unitCover[uid];
      });
    }
    if (state.pendingCover && state.pendingCover.absentId === pid) state.pendingCover = null;
  }
  save(); render();
}
// Apply the confirmed cover: all the absent person's units -> chosen covererer
function confirmCover(coverId) {
  const pc = state.pendingCover;
  if (!pc) return;
  if (!state.unitCover) state.unitCover = {};
  unitsOwnedBy(pc.absentId).forEach(u => { state.unitCover[u.id] = coverId; });
  state.coverageDay = todayKey();
  state.pendingCover = null;
  save(); render();
}
function dismissCover() { state.pendingCover = null; save(); render(); }
function assignCover(floor, pid) { state.coverage[floor]=pid; state.coverageDay=todayKey(); save(); render(); }
function toggleUnit(uid) { const k=uid+'::perm'; if(state.completions[k])delete state.completions[k];else state.completions[k]=true; save(); render(); }
function toggleZone(zid, freq) { const k=zid+'::'+freqKey(freq); if(state.completions[k])delete state.completions[k];else state.completions[k]=true; save(); render(); }
function toggleFloorExpand(fid) { state.expandedFloors[fid]=!state.expandedFloors[fid]; save(); render(); }
function setTab(t) { state.tab=t; save(); render(); }
function resetCompletions() { showConfirm('Reset all completion checkmarks?', 'Attendance and assignments are kept.', () => { state.completions={}; save(); render(); }); }

  office:   { label: 'Office',   color: '#29b6f5' },

};
const UNIT_TYPE_ORDER = ['airbnb', 'office', 'building'];
const unitType = (u) => UNIT_TYPES[u && u.type] ? u.type : 'building';

function addServicedUnit(unit, guest, freq, type, time) {

  });

}
function removeServicedUnit(id) {
  showConfirm('Remove this unit?', 'This unit will be removed from cleaning service.', () => {
    state.servicedUnits = state.servicedUnits.filter(u => u.id !== id);
    save(); render();
  });
}
function setUnitFreq(id, freq) {
  const u = state.servicedUnits.find(x => x.id === id);
  if (u) { u.freq = freq; u.startDate = todayKey(); } // reset cycle anchor to today
  save(); render();
}
function setUnitAssignee(id, pid) {
  const u = state.servicedUnits.find(x => x.id === id);
  if (u) {
    u.assignedTo = pid || null;   // '' → auto (by floor owner)
    // Remember this as the room's "usual" cleaner so auto-assign keeps the same person here.
    if (pid) u.usualTo = pid; else u.usualTo = null;
  }
  save(); render();
}
function setUnitPriority(id, on) {
  const u = state.servicedUnits.find(x => x.id === id);
  if (u) u.priority = !!on;
  save(); render();
}

// One-tap auto-assign:
//   1. Rooms with a "usual" cleaner who clocked in → keep that same person (Airbnb stays with its crew).
//   2. Remaining rooms, priority ⭐ first, go to the earliest-arriving cleaners.
//   3. Everything balances so no one is overloaded.
function autoAssignRooms() {
  const people = Object.keys(hikArrivals)
    .filter((id) => (state.staff || []).some((s) => s.id === id))
    .map((id) => ({ id, raw: hikArrivals[id].raw }))
    .sort((a, b) => String(a.raw || '').localeCompare(String(b.raw || '')));   // earliest badge-in first
  if (!people.length) { hikSyncMsg = { err: true, text: 'No one clocked in to assign rooms to.' }; render(); return; }
  const inIds = new Set(people.map((p) => p.id));
  const load = {}; people.forEach((p) => { load[p.id] = 0; });

  const rooms = (state.servicedUnits || []).slice().sort((a, b) =>
    (b.priority ? 1 : 0) - (a.priority ? 1 : 0)                                  // priority ⭐ rooms first
    || String(a.time || '~').localeCompare(String(b.time || '~'))               // then earliest scheduled time
    || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  if (!rooms.length) { hikSyncMsg = { err: true, text: 'No rooms yet — add units on the Cleaning tab first.' }; render(); return; }
  rooms.forEach((u) => { u.assignedTo = null; });                               // start fresh

  // Pass 1: keep every room's usual cleaner if they clocked in.
  let kept = 0;
  rooms.forEach((u) => {
    if (u.usualTo && inIds.has(u.usualTo)) { u.assignedTo = u.usualTo; load[u.usualTo]++; kept++; }
  });
  // Pass 2: hand each leftover room to whoever's carrying the fewest (earliest breaks ties).
  const order = people.map((p) => p.id);
  rooms.filter((u) => !u.assignedTo).forEach((u) => {
    const pick = order.slice().sort((a, b) => load[a] - load[b])[0];
    u.assignedTo = pick; load[pick]++;
  });
  hikSyncMsg = { text: `Assigned ${rooms.length} rooms to ${people.length} cleaners${kept ? ` (${kept} kept with their usual crew)` : ''}.` };
  save(); render();
}

// --- Hik-Connect staff sync ---
let hikSyncMsg = null;
async function syncFromHik() {
  if (!db) { hikSyncMsg = { err: true, text: 'Server not connected.' }; render(); return; }
  hikSyncMsg = { text: 'Syncing staff from Hik-Connect…' };
  render();
  try {
    const { data, error } = await db.functions.invoke('hik-sync', { body: {} });
    if (error) throw error;
    if (!data || !data.ok) throw new Error(data && data.error ? data.error : 'Sync failed');
    const persons = data.persons || [];
    if (!Array.isArray(state.staff)) state.staff = [];
    const defaultCrew = (getTeams()[0] && getTeams()[0].name) || 'Team A';
    let added = 0, matched = 0;
    for (const p of persons) {
      // Match existing staff by Hik id, then badge code, then name — so re-syncs don't duplicate.
      const s = state.staff.find((x) => x.hikPersonId && x.hikPersonId === p.personId)
        || state.staff.find((x) => x.hikCode && p.personCode && x.hikCode === p.personCode)
        || state.staff.find((x) => (x.name || '').trim().toLowerCase() === (p.name || '').trim().toLowerCase());
      if (s) {
        s.hikPersonId = p.personId; s.hikCode = p.personCode; if (p.name) s.name = p.name;
        matched++;
      } else {
        state.staff.push({ id: 'p' + p.personId, name: p.name, crew: defaultCrew, color: teamColor(defaultCrew), floors: [], hikPersonId: p.personId, hikCode: p.personCode });
        added++;
      }
    }
    STAFF = state.staff;
    STAFF.forEach((pp) => { if (!state.attendance[pp.id]) state.attendance[pp.id] = 'present'; });
    save();
    await loadHikArrivals();
    const arr = Object.keys(hikArrivals).length;
    hikSyncMsg = { text: `Synced ${persons.length} staff — ${added} added, ${matched} matched. ${arr} badged in today${hikUnknown.length ? `, ${hikUnknown.length} unknown` : ''}.` };
    render();
  } catch (e) {
    hikSyncMsg = { err: true, text: 'Sync failed: ' + ((e && e.message) || e) };
    render();
  }
}

// Today's badge-in events → first arrival per person, matched to staff by name.
let hikArrivals = {};   // staff id -> { time }
let hikUnknown = [];    // [{ name, time }] badged in but no matching staff (the "unknown" alert)
let selectedDay = null; // which day Roll Call is showing (null = today)
function fmtEventTime(v) {
  if (!v) return '';
  const s = String(v);
  // Pull HH:MM straight from the string (EAT wall-clock) — no timezone shifting.
  const m = s.match(/(?:[ T])(\d{1,2}):(\d{2})/) || s.match(/^(\d{1,2}):(\d{2})/);
  if (m) { let h = parseInt(m[1], 10); const min = m[2]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + min + ' ' + ap; }
  const d = /^\d{10,}$/.test(s) ? new Date(Number(s)) : new Date(s);
  return isNaN(d.getTime()) ? s : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
// Load arrivals for the selected day (defaults to today), matched to staff by name.
async function loadHikArrivals() {
  if (!db) return;
  try {
    const day = selectedDay || todayKey();
    const { data, error } = await db.from('hik_events')
      .select('person_name,person_code,event_time')
      .like('event_time', day + '%')              // only the selected day's scans
      .order('event_time', { ascending: true });  // earliest first
    if (error) throw error;
    const firstByName = {};
    for (const e of (data || [])) {
      const key = (e.person_name || '').trim().toLowerCase();
      if (key && !firstByName[key]) firstByName[key] = e;   // first seen = earliest
    }
    // Only surface CLEANERS on the roll call (once any cleaner is tagged). Everyone is
    // still matched, but non-cleaner staff (office/management) are dropped silently.
    const cleaners = (state.staff || []).filter((p) => p.isCleaner);
    const onlyCleaners = cleaners.length > 0;
    const cleanerByName = {};
    for (const s of cleaners) cleanerByName[(s.name || '').trim().toLowerCase()] = s;
    const staffByName = {};
    for (const s of (state.staff || [])) staffByName[(s.name || '').trim().toLowerCase()] = s;
    hikArrivals = {}; hikUnknown = [];
    for (const key in firstByName) {
      const e = firstByName[key];
      const t = fmtEventTime(e.event_time);
      const s = onlyCleaners ? cleanerByName[key] : staffByName[key];   // case-insensitive name match
      if (s) hikArrivals[s.id] = { time: t, raw: e.event_time };
      else if (onlyCleaners && staffByName[key]) { /* known staff but not a cleaner — skip */ }
      else hikUnknown.push({ name: e.person_name, time: t });
    }
  } catch (e) { /* keep previous arrivals */ }
}

// Import a Hik export (Time Card or Access Record) → store check-ins → refresh Roll Call.
async function importAttendance(file) {
  hikSyncMsg = { text: 'Reading attendance file…' }; render();
  try {
    if (typeof XLSX === 'undefined') throw new Error('Spreadsheet reader not loaded — check your connection and retry.');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    let hdr = -1, C = {};
    for (let i = 0; i < rows.length; i++) {
      const r = (rows[i] || []).map((x) => String(x || '').trim().toLowerCase());
      if (r.includes('first name') && r.some((x) => x.includes('record'))) {
        hdr = i; C = { fmt: 'timecard', first: r.indexOf('first name'), last: r.indexOf('last name'), id: r.indexOf('id'), date: r.indexOf('date'), rec: r.findIndex((x) => x.includes('record')) }; break;
      }
      if (r.includes('name') && r.some((x) => x.includes('time'))) {
        hdr = i; C = { fmt: 'access', name: r.indexOf('name'), id: r.indexOf('id'), time: r.findIndex((x) => x.includes('time')) }; break;
      }
    }
    if (hdr < 0) throw new Error('Could not recognise the columns in this file.');
    const map = {};
    for (let i = hdr + 1; i < rows.length; i++) {
      const row = rows[i] || [];
      let name = '', code = '', date = '', times = [];
      if (C.fmt === 'timecard') {
        name = ((row[C.first] || '') + ' ' + (row[C.last] || '')).trim();
        code = String(row[C.id] || '').trim();
        date = String(row[C.date] || '').trim().slice(0, 10);
        times = String(row[C.rec] || '').split(/[;,]/).map((t) => t.trim()).filter((t) => /\d{1,2}:\d{2}/.test(t));
      } else {
        name = String(row[C.name] || '').trim();
        code = String(row[C.id] || '').trim();
        const ts = String(row[C.time] || '').trim();
        const dm = ts.match(/(\d{4}-\d{2}-\d{2})/); const tm = ts.match(/(\d{1,2}:\d{2})/);
        date = dm ? dm[1] : ''; times = tm ? [tm[1]] : [];
      }
      if (!name || !date || !times.length) continue;
      const first = times.slice().sort()[0];
      const et = date + ' ' + first;
      const key = name.toLowerCase() + '|' + date;
      if (!map[key] || et < map[key].event_time) map[key] = { person_name: name, person_code: code, event_time: et };
    }
    const records = Object.values(map);
    if (!records.length) throw new Error('No check-in rows found in the file.');
    if (db) {
      await db.from('hik_events').upsert(records.map((r) => ({ ...r, event_type: 'imported', raw: { source: 'import' } })), { onConflict: 'person_name,event_time', ignoreDuplicates: true });
    }
    const days = [...new Set(records.map((r) => r.event_time.slice(0, 10)))].sort();
    selectedDay = days[days.length - 1];   // show the latest day found in the file
    await loadHikArrivals();
    const matched = Object.keys(hikArrivals).length;
    let msg = `Imported ${records.length} check-ins (${days.length === 1 ? days[0] : days.length + ' days'}) — ${matched} matched.`;
    if (hikUnknown.length) msg += ` ${hikUnknown.length} not matched: ${hikUnknown.map((u) => u.name).join(', ')}.`;
    hikSyncMsg = { text: msg };
    render();
  } catch (e) {
    hikSyncMsg = { err: true, text: 'Import failed: ' + ((e && e.message) || e) };
    render();
  }
}

// --- Backup actions ---
function exportBackup() {
  try {
    const data = localStorage.getItem(STORE);
    if (!data) { showBackupMsg('Nothing to export yet.', true); return; }
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cleaning-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showBackupMsg('Backup downloaded successfully.', false);
  } catch (e) { showBackupMsg('Export failed: ' + e.message, true); }
}
function importBackup(file) {
  if (!file) return;
  if (!file.name.endsWith('.json')) { showBackupMsg('Please select a .json backup file.', true); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== 'object' || parsed === null) throw new Error('Invalid backup format');
      showConfirm('Replace all data?', 'This will overwrite everything on this device with the backup file.', () => {
        localStorage.setItem(STORE, JSON.stringify(parsed));
        location.reload();
      });
    } catch (err) { showBackupMsg('Invalid file — could not read backup data.', true); }
  };
  reader.onerror = () => { showBackupMsg('Could not read the file. Please try again.', true); };
  reader.readAsText(file);
}
function showBackupMsg(msg, isErr) {
  const el = document.getElementById('backupMsg');
  if (!el) return;
  el.textContent = msg;
  el.className = 'backup-msg ' + (isErr ? 'err' : 'ok');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// Render the type-grouped card list for the given type keys.
function unitGroups(wrap, typeKeys, emptyMsg) {
  const units = state.servicedUnits.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const relevant = units.filter(u => typeKeys.includes(unitType(u)));
  if (!relevant.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:30px 0">${emptyMsg || 'No units yet — add one above.'}</div>`));
    return;
  }
  typeKeys.forEach(tk => {
    const t = UNIT_TYPES[tk];
    const group = relevant.filter(u => unitType(u) === tk).sort((a, b) =>
      (b.priority ? 1 : 0) - (a.priority ? 1 : 0)                                  // priority ⭐ first
      || String(a.time || '~').localeCompare(String(b.time || '~'))               // then earliest time
      || String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
    if (!group.length) return;
    const head = el(`<div class="crew-head" style="margin-top:18px"></div>`);
    head.appendChild(el(`<div class="crew-dot" style="background:${t.color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${t.label}</div>`));
    head.appendChild(el(`<div class="crew-sub">${group.length}</div>`));
    wrap.appendChild(head);
    group.forEach(u => wrap.appendChild(servicedCard(u, unitDueToday(u))));
  });
}

  const lastClean = lastCleanedByUnit[u.id];
  if (lastClean) {
    info.appendChild(el(`<div class="su-assign" style="color:#5d8aa8">🧹 Last: ${esc(fmtWhen(lastClean.cleaned_at))} · ${esc(lastClean.cleaner_name || '—')}</div>`));
  }

  // Assigned cleaner line
  if (c) {
    const fname = c.person.name.split(' ')[0];
    if (pendingAbsent) {
      info.appendChild(el(`<div class="su-assign" style="color:#f87171">⚠ ${esc(fname)} absent — needs cover</div>`));
    } else if (c.reason === 'cover') {
      info.appendChild(el(`<div class="su-assign" style="color:#34d399">↪ Covered by ${esc(fname)}</div>`));
    } else if (c.reason === 'override') {
      info.appendChild(el(`<div class="su-assign" style="color:#8da2b8">Assigned: ${esc(fname)}</div>`));
    } else {
      info.appendChild(el(`<div class="su-assign" style="color:#8da2b8">${esc(fname)} (Floor ${floorOfUnit(u.unit)})</div>`));
    }
  } else {
    info.appendChild(el(`<div class="su-assign" style="color:#5d748c">No cleaner assigned to Floor ${floorOfUnit(u.unit)||'?'}</div>`));
  }
  top.appendChild(info);

  if (isDue) {
    const mark = el(`<button class="su-mark">${done?'✓ Cleaned':'Mark clean'}</button>`);
    mark.onclick = () => toggleServicedDone(u.id);
    top.appendChild(mark);
  } else {
    top.appendChild(el(`<div class="su-next">${FREQ_LABEL[u.freq]}</div>`));
  }
  card.appendChild(top);

  // Who cleans this room (recorded in history when marked clean)
  const assignRow = el(`<div style="display:flex;align-items:center;gap:8px;margin-top:10px"></div>`);
  assignRow.appendChild(el(`<div style="font-size:11px;color:#5d748c;font-weight:600;white-space:nowrap">Cleaned by</div>`));
  const asel = el(`<select class="area-select" style="flex:1"></select>`);
  asel.appendChild(el(`<option value="">Auto (by floor)</option>`));
  cleaningStaff().forEach(p => {
    const o = el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`);
    if (u.assignedTo === p.id) o.setAttribute('selected', '');
    asel.appendChild(o);
  });
  asel.onchange = (e) => setUnitAssignee(u.id, e.target.value);
  assignRow.appendChild(asel);
  card.appendChild(assignRow);

  // frequency selector + edit + remove
  const ctl = el(`<div class="su-ctl"></div>`);
  ['nightly','daily','eod','weekly'].forEach(fk => {
    const b = el(`<button class="freqmini ${u.freq===fk?'on':''}">${FREQ_LABEL[fk]}</button>`);
    b.onclick = () => setUnitFreq(u.id, fk);
    ctl.appendChild(b);
  });
  const pri = el(`<button class="freqmini ${u.priority?'on':''}" title="Priority">${u.priority?'⭐ Priority':'☆ Priority'}</button>`);
  pri.onclick = () => setUnitPriority(u.id, !u.priority);
  ctl.appendChild(pri);
  const edit = el(`<button class="su-edit">Edit</button>`);
  edit.onclick = () => startEditUnit(u.id);
  ctl.appendChild(edit);
  const rm = el(`<button class="su-rm">Remove</button>`);
  rm.onclick = () => removeServicedUnit(u.id);
  ctl.appendChild(rm);
  card.appendChild(ctl);

  return card;
}

function viewRollCall() {
  const s = statsBar();
  const wrap = el('<div></div>');
  const body = el('<div class="body"></div>');

  // Sync staff roster · Import attendance file · pick the day
  const syncBox = el('<div style="margin-bottom:16px"></div>');
  const syncBtn = el('<button class="add-btn" style="background:#29b6f5">⟳ Sync Staff (Hik-Connect)</button>');
  syncBtn.onclick = () => syncFromHik();
  syncBox.appendChild(syncBtn);
  const impBtn = el('<button class="add-btn" style="background:#141b28;color:#29b6f5;border:1px solid #1f4a63;margin-top:8px">↑ Import Attendance File</button>');
  const impInput = el('<input type="file" accept=".xlsx,.xls,.csv" style="display:none">');
  impInput.onchange = (e) => { if (e.target.files[0]) importAttendance(e.target.files[0]); e.target.value = ''; };
  impBtn.onclick = () => impInput.click();
  syncBox.appendChild(impBtn);
  syncBox.appendChild(impInput);
  const cur = selectedDay || todayKey();
  const pickDay = (d) => { selectedDay = d || todayKey(); loadHikArrivals().then(() => render()); };
  const dayRow = el('<div style="display:flex;align-items:center;gap:8px;margin-top:10px"></div>');
  dayRow.appendChild(el('<div style="font-size:12px;color:#8da2b8;font-weight:600;white-space:nowrap">Showing day</div>'));
  const dayIn = el(`<input type="date" value="${esc(cur)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#0a0e16;color:#e2e8f0;border:1px solid #283441;border-radius:8px;padding:8px 10px;font-size:14px">`);
  dayIn.onchange = (e) => pickDay(e.target.value);
  const calBtn = el('<button class="freqmini" title="Pick a date" style="flex:0 0 auto">📅</button>');
  calBtn.onclick = () => { try { dayIn.showPicker(); } catch (e) { dayIn.focus(); dayIn.click(); } };
  dayRow.appendChild(dayIn);
  dayRow.appendChild(calBtn);
  syncBox.appendChild(dayRow);
  // Quick jumps
  const quick = el('<div style="display:flex;gap:6px;margin-top:8px"></div>');
  const yday = shiftDay(todayKey(), -1);
  [['Today', todayKey()], ['Yesterday', yday]].forEach(([lbl, d]) => {
    const b = el(`<button class="freqmini ${cur === d ? 'on' : ''}">${lbl}</button>`);
    b.onclick = () => pickDay(d);
    quick.appendChild(b);
  });
  syncBox.appendChild(quick);
  if (hikSyncMsg) {
    syncBox.appendChild(el(`<div style="font-size:12px;margin-top:8px;font-weight:600;color:${hikSyncMsg.err ? '#f87171' : '#34d399'}">${esc(hikSyncMsg.text)}</div>`));
  }
  body.appendChild(syncBox);

  // Unknown-staff alert: badged in but not in the staff list
  if (hikUnknown.length) {
    const al = el(`<div class="alert"></div>`);
    al.appendChild(el(`<div class="alert-title">⚠ ${hikUnknown.length} badged in but not in your staff list</div>`));
    al.appendChild(el(`<div class="alert-body">${esc(hikUnknown.map((u) => u.name + (u.time ? ` (${u.time})` : '')).join(', '))}</div>`));
    body.appendChild(al);
  }

  // WHO'S IN TODAY — only people who badged in, with clock-in times + room assignment.
  const arrIds = Object.keys(hikArrivals);
  const staffById = {};
  for (const s of (state.staff || [])) staffById[s.id] = s;
  const whoIn = el('<div style="margin-bottom:18px"></div>');
  const dayLbl = (selectedDay && selectedDay !== todayKey()) ? ('on ' + selectedDay) : 'today';
  const cleanersTagged = (state.staff || []).some((p) => p.isCleaner);
  whoIn.appendChild(el(`<div class="section-label" style="color:#34d399">✓ ${cleanersTagged ? 'Cleaners' : 'Staff'} clocked in ${dayLbl} (${arrIds.length})</div>`));
  if (!cleanersTagged) whoIn.appendChild(el(`<div style="font-size:11px;color:#8da2b8;margin:-6px 0 10px">Tip: tag people as <b>Cleaner</b> in the Team tab so sync only shows cleaners.</div>`));
  if (arrIds.length && (state.servicedUnits || []).length) {
    const autoBtn = el('<button class="add-btn" style="background:#34d399;color:#0a0e16;margin-bottom:12px">⚡ Auto-assign rooms evenly</button>');
    autoBtn.onclick = () => autoAssignRooms();
    whoIn.appendChild(autoBtn);
  }
  if (!arrIds.length) {
    whoIn.appendChild(el(`<div class="empty" style="text-align:center;padding:16px 0;color:#5d748c">No clock-ins for this day. Tap "Import Attendance File" and pick your Hik export.</div>`));
  } else {
    arrIds
      .map((id) => ({ s: staffById[id], t: hikArrivals[id].time, raw: hikArrivals[id].raw }))
      .filter((x) => x.s)
      .sort((a, b) => String(a.raw || '').localeCompare(String(b.raw || '')))   // earliest badge-in first
      .forEach(({ s, t }) => {
        const card = el('<div class="person" style="flex-direction:column;align-items:stretch;gap:8px"></div>');
        const info = el('<div class="person-info"></div>');
        info.appendChild(el(`<div class="person-name">${esc(s.name)}</div>`));
        info.appendChild(el(`<div class="person-floors" style="color:#34d399;font-weight:600">✓ Arrived ${esc(t)}</div>`));
        card.appendChild(info);
        const mine = (state.servicedUnits || []).filter((u) => u.assignedTo === s.id);
        if (mine.length) {
          const chips = el('<div style="display:flex;flex-wrap:wrap;gap:6px"></div>');
          mine.forEach((u) => {
            const chip = el(`<button class="freqmini on" style="flex:0 0 auto;padding:6px 11px">${esc(u.unit)} ✕</button>`);
            chip.onclick = () => setUnitAssignee(u.id, '');
            chips.appendChild(chip);
          });
          card.appendChild(chips);
        }
        const free = (state.servicedUnits || []).filter((u) => !u.assignedTo);
        if (free.length) {
          const sel = el('<select class="area-select"></select>');
          sel.appendChild(el('<option value="">+ Assign a room…</option>'));
          free.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }))
            .forEach((u) => sel.appendChild(el(`<option value="${esc(u.id)}">Room ${esc(u.unit)}</option>`)));
          sel.onchange = (e) => { if (e.target.value) setUnitAssignee(e.target.value, s.id); };
          card.appendChild(sel);
        } else if (!mine.length) {
          card.appendChild(el('<div style="font-size:11px;color:#5d748c">No rooms yet — add units on the Cleaning tab, then assign here.</div>'));
        }
        whoIn.appendChild(card);
      });
  }
  body.appendChild(whoIn);

  wrap.appendChild(body);
  return wrap;
}

function viewBuilding() {

function floorResidential(f) {
  const units = buildUnits().filter(u => u.floor===f);
  const doneCount = units.filter(u => state.completions[u.id+'::perm']).length;
  const who = whoCleansFloor(f);
  const color = who ? who.person.color : '#5d748c';
  const fid = 'floor-'+f;
  const open = state.expandedFloors[fid];
  const card = el(`<div class="floor"></div>`);
  const head = el(`<button class="floor-head"></button>`);
  head.appendChild(el(`<div class="floor-badge" style="background:${color}">${f}</div>`));
  const info = el(`<div class="floor-info"></div>`);
  info.appendChild(el(`<div class="floor-name">Floor ${f}</div>`));
  let sub = `${doneCount}/6 units · `;
  sub += who ? esc(who.person.name.split(' ')[0]) + (who.covering?' (cover)':'') : 'Unassigned';
  info.appendChild(el(`<div class="floor-sub">${sub}</div>`));
  head.appendChild(info);
  const prog = el(`<div class="floor-prog"></div>`);
  prog.appendChild(el(`<div style="width:${(doneCount/6)*100}%;background:${doneCount===6?'#34d399':'#d4a72c'}"></div>`));
  head.appendChild(prog);
  head.appendChild(el(`<div class="chev">${open?'▲':'▼'}</div>`));
  head.onclick = () => toggleFloorExpand(fid);
  card.appendChild(head);
  if (open) {
    const grid = el(`<div class="unit-grid"></div>`);
    units.forEach(u => {
      const done = !!state.completions[u.id+'::perm'];
      const unit = el(`<div class="unit ${done?'done':''}"></div>`);
      unit.appendChild(el(`<div class="unit-num">${u.num}</div>`));
      const mark = el(`<button class="unit-mark">${done?'✓ Done':'Mark'}</button>`);
      mark.onclick = (e) => { e.stopPropagation(); toggleUnit(u.id); };
      unit.appendChild(mark); grid.appendChild(unit);
    });
    card.appendChild(grid);
  }
  return card;
}

function floorCommon(id, label, zones, icon) {
  const doneCount = zones.filter(z => state.completions[z.id+'::'+freqKey(z.freq)]).length;
  const open = state.expandedFloors[id];
  const card = el(`<div class="floor"></div>`);
  const head = el(`<button class="floor-head"></button>`);
  head.appendChild(el(`<div class="floor-badge" style="background:#eef2f6;color:#5e7488;font-size:18px">${icon}</div>`));
  const info = el(`<div class="floor-info"></div>`);
  info.appendChild(el(`<div class="floor-name">${esc(label)}</div>`));
  info.appendChild(el(`<div class="floor-sub">${doneCount}/${zones.length} zones complete</div>`));
  head.appendChild(info);
  const prog = el(`<div class="floor-prog"></div>`);
  prog.appendChild(el(`<div style="width:${(doneCount/zones.length)*100}%;background:${doneCount===zones.length?'#34d399':'#d4a72c'}"></div>`));
  head.appendChild(prog);
  head.appendChild(el(`<div class="chev">${open?'▲':'▼'}</div>`));
  head.onclick = () => toggleFloorExpand(id);
  card.appendChild(head);
  if (open) {
    const list = el(`<div style="padding:4px 14px 14px"></div>`);
    zones.forEach(z => {
      const done = !!state.completions[z.id+'::'+freqKey(z.freq)];
      const fr = FREQ[z.freq];
      const row = el(`<div class="zone ${done?'done':''}"></div>`);
      const zinfo = el(`<div class="zone-info"></div>`);
      zinfo.appendChild(el(`<div class="zone-freq" style="color:${fr.tint}">${fr.label}</div>`));
      zinfo.appendChild(el(`<div class="zone-name">${esc(z.label)}</div>`));
      row.appendChild(zinfo);
      const mark = el(`<button class="zone-mark">${done?'✓':'Mark'}</button>`);
      mark.onclick = (e) => { e.stopPropagation(); toggleZone(z.id, z.freq); };
      row.appendChild(mark); list.appendChild(row);
    });
    card.appendChild(list);
  }
  return card;
}

// Shared add-employee form (used in Team tab and Settings)
function employeeAddForm() {

  const teams = getTeams();
  let chosenTeam = teams.length ? teams[0].name : 'Team A';
  const teamRow = el(`<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap"></div>`);
  const teamBtns = {};
  teams.forEach((t, i) => {
    const b = el(`<button class="freqpick ${i===0?'on':''}" style="flex:1 1 22%">${esc(t.name)}</button>`);

    card.appendChild(nameIn);
    let chosenTeam = p.crew;
    const teamRow = el(`<div style="display:flex;gap:6px;flex-wrap:wrap"></div>`);

    getTeams().forEach(t => {
      const b = el(`<button class="freqpick ${t.name===p.crew?'on':''}" style="flex:1 1 22%">${esc(t.name)}</button>`);
      b.onclick = () => { chosenTeam = t.name; Object.values(teamBtns).forEach(x=>x.classList.remove('on')); b.classList.add('on'); };

    sv.onclick = () => editEmployee(p.id, document.getElementById('eeName_'+p.id).value, chosenTeam, document.getElementById('eeFloors_'+p.id).value);
    const cn = el(`<button class="modal-skip">Cancel</button>`);

  info.appendChild(el(`<div class="person-floors">${esc(personFloors(p))}</div>`));
  top.appendChild(info);

  const ctl = el(`<div class="su-ctl" style="border-top:none;padding-top:0;margin-top:0"></div>`);
  const clean = el(`<button class="freqmini ${p.isCleaner ? 'on' : ''}" style="flex:0 0 auto;padding:7px 14px">${p.isCleaner ? '✓ Cleaner' : '+ Cleaner'}</button>`);
  clean.onclick = () => toggleCleaner(p.id);
  const ed = el(`<button class="su-edit">Edit</button>`);
  ed.onclick = () => startEditEmp(p.id);
  const rm = el(`<button class="su-rm">Remove</button>`);
  rm.onclick = () => removeEmployee(p.id);
  ctl.appendChild(clean); ctl.appendChild(ed); ctl.appendChild(rm);
  card.appendChild(ctl);
  return card;
}

// Render staff grouped by team, using editable cards
function employeeGroups(wrap) {
  if (!STAFF.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">No employees yet. Add your first above.</div>`));
    return;
  }
  const crews = [...new Set(STAFF.map(p => p.crew))];
  crews.forEach(crewName => {
    const members = STAFF.filter(p => p.crew===crewName);
    const color = members[0].color;
    const group = el(`<div class="crew-group"></div>`);
    const head = el(`<div class="crew-head"></div>`);
    head.appendChild(el(`<div class="crew-dot" style="background:${color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${esc(crewName)}</div>`));
    head.appendChild(el(`<div class="crew-sub">${members.length}</div>`));

    members.forEach(p => group.appendChild(employeeCard(p)));

}

function viewHistory() {
  const wrap = el('<div class="body"></div>');

  if (!db) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:30px 0">History needs the shared server, which isn't connected on this build.</div>`));
    return wrap;
  }

  // Room filter
  const sel = el(`<select class="area-select" style="margin-bottom:14px"></select>`);
  sel.appendChild(el(`<option value="all">All rooms</option>`));
  (state.servicedUnits || []).slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }))
    .forEach(u => {
      const o = el(`<option value="${esc(u.id)}">Unit ${esc(u.unit)}${u.guest ? ' · ' + esc(u.guest) : ''}</option>`);
      if (historyFilter === u.id) o.setAttribute('selected', '');
      sel.appendChild(o);
    });
  sel.onchange = (e) => { historyFilter = e.target.value; render(); };
  wrap.appendChild(sel);

  // Day picker — pick any past day to see what was cleaned that day (blank = every day).
  const dayRow = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"></div>');
  const dayIn = el(`<input type="date" value="${esc(historyDay)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#0a0e16;color:#e2e8f0;border:1px solid #283441;border-radius:8px;padding:8px 10px;font-size:14px">`);
  dayIn.onchange = (e) => { historyDay = e.target.value || ''; render(); };
  const calBtn = el('<button class="freqmini" title="Pick a date" style="flex:0 0 auto">📅</button>');
  calBtn.onclick = () => { try { dayIn.showPicker(); } catch (e) { dayIn.focus(); dayIn.click(); } };
  dayRow.appendChild(dayIn);
  dayRow.appendChild(calBtn);
  if (historyDay) {
    const clr = el('<button class="freqmini">✕ All days</button>');
    clr.onclick = () => { historyDay = ''; render(); };
    dayRow.appendChild(clr);
  }
  wrap.appendChild(dayRow);

  let rows = cleaningHistory;
  if (historyFilter !== 'all') rows = rows.filter(r => r.unit_id === historyFilter);
  if (historyDay) rows = rows.filter(r => dayKeyLocal(r.cleaned_at) === historyDay);

  const scope = historyDay ? ('on ' + historyDay) : 'in total';
  wrap.appendChild(el(`<div class="section-label">${rows.length} cleaning${rows.length === 1 ? '' : 's'} ${scope}</div>`));

  if (!rows.length) {
    const msg = historyDay ? 'Nothing was logged as cleaned on this day.' : 'Nothing logged yet. Mark a room clean and it shows up here.';
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">${msg}</div>`));
    return wrap;
  }

  // When viewing all days, break the list up with a header per day.
  let lastDay = null;
  rows.forEach(r => {
    if (!historyDay) {
      const dk = dayKeyLocal(r.cleaned_at);
      if (dk !== lastDay) {
        lastDay = dk;
        const dLabel = new Date(r.cleaned_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#8da2b8">${esc(dLabel)}</div>`));
      }
    }
    const card = el(`<div class="su-card"></div>`);
    const top = el(`<div class="su-top"></div>`);
    const info = el(`<div style="flex:1;min-width:0"></div>`);
    info.appendChild(el(`<div class="su-unit" style="font-size:15px">Unit ${esc(r.unit_label || r.unit_id)}</div>`));
    info.appendChild(el(`<div class="su-guest">by ${esc(r.cleaner_name || 'Unknown')}</div>`));
    top.appendChild(info);
    top.appendChild(el(`<div class="su-next">${esc(fmtWhen(r.cleaned_at))}</div>`));
    card.appendChild(top);
    wrap.appendChild(card);
  });
  return wrap;
}

function viewTeam() {
  const wrap = el('<div class="body"></div>');

  const cleaners = (state.staff || []).filter((p) => p.isCleaner).length;

// ============================================================
// CUSTOM CONFIRM MODAL
// ============================================================
let _confirmState = null;
function showConfirm(title, message, onConfirm) {
  _confirmState = { title, message, onConfirm };
  renderConfirmModal();
}
function dismissConfirmModal() { _confirmState = null; const e = document.getElementById('confirmModal'); if (e) e.remove(); }
function renderConfirmModal() {
  if (!_confirmState) return;
  const existing = document.getElementById('confirmModal');
  if (existing) existing.remove();
  const overlay = el(`<div class="modal-overlay" id="confirmModal" style="align-items:center"></div>`);
  const modal = el(`<div class="modal" style="border-radius:16px"></div>`);
  modal.appendChild(el(`<div class="modal-title">${esc(_confirmState.title)}</div>`));
  modal.appendChild(el(`<div class="modal-sub">${esc(_confirmState.message)}</div>`));
  const btnRow = el(`<div class="modal-btns"></div>`);
  const cancelBtn = el(`<button class="modal-skip">Cancel</button>`);
  cancelBtn.onclick = () => dismissConfirmModal();
  const confirmBtn = el(`<button class="modal-danger">Remove</button>`);
  confirmBtn.onclick = () => { const cb = _confirmState.onConfirm; dismissConfirmModal(); cb(); };
  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(confirmBtn);
  modal.appendChild(btnRow);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) dismissConfirmModal(); };
  document.getElementById('app').appendChild(overlay);
}

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const s = statsBar();

  const header = el(`<div class="header"></div>`);
  header.appendChild(el(`<div class="h-eyebrow">66-UNIT BUILDING · 11 FLOORS</div>`));
  const titles = { offices:'Office Cleaning', buildings:'Building Cleaning', airbnb:'Airbnb Rooms', more:'More', rollcall:'Morning Roll Call', building:'Floors & Common Areas', exterior:'Exterior', history:'Cleaning History', team:'Team', settings:'Settings' };
  header.appendChild(el(`<div class="h-title">${titles[state.tab]}</div>`));
  header.appendChild(el(`<div class="h-date">${dateStr}</div>`));
  const typeTab = { offices: 'office', buildings: 'building', airbnb: 'airbnb' }[state.tab];
  if (typeTab) {
    const inType = state.servicedUnits.filter(u => unitType(u) === typeTab);
    const dueCount = inType.filter(unitDueToday).length;
    const doneCount = inType.filter(u => unitDueToday(u) && servicedDone(u.id)).length;
    const strip = el(`<div class="stats"></div>`);
    strip.appendChild(el(`<div class="stat"><div class="lbl">DUE TODAY</div><div class="val">${dueCount}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">CLEANED</div><div class="val">${doneCount}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">TOTAL</div><div class="val">${inType.length}</div></div>`));
    header.appendChild(strip);
  }
  if (state.tab === 'rollcall') {
    const clockedIn = Object.keys(hikArrivals).length;
    const assigned = (state.servicedUnits || []).filter((u) => u.assignedTo).length;
    const totalRooms = (state.servicedUnits || []).length;
    const strip = el(`<div class="stats"></div>`);
    strip.appendChild(el(`<div class="stat"><div class="lbl">CLOCKED IN</div><div class="val">${clockedIn}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">ROOMS ASSIGNED</div><div class="val">${assigned}/${totalRooms}</div></div>`));
    header.appendChild(strip);
  }
  app.appendChild(header);

  if (state.tab==='offices') app.appendChild(viewOffices());
  else if (state.tab==='buildings') app.appendChild(viewBuildings());
  else if (state.tab==='airbnb') app.appendChild(viewAirbnb());
  else if (state.tab==='more') app.appendChild(viewMore());
  else if (state.tab==='rollcall') app.appendChild(viewRollCall());
  else if (state.tab==='building') app.appendChild(viewBuilding());
  else if (state.tab==='exterior') app.appendChild(viewExterior());
  else if (state.tab==='history') app.appendChild(viewHistory());
  else if (state.tab==='team') app.appendChild(viewTeam());
  else if (state.tab==='settings') app.appendChild(viewSettings());

  app.appendChild(el(`<div class="footer">Changes save on this device · Daily tasks reset each day</div>`));

  // --- Cover confirmation popup ---
  if (state.pendingCover) {
    const pc = state.pendingCover;
    const absent = STAFF.find(p => p.id === pc.absentId);
    const affected = unitsOwnedBy(pc.absentId);
    if (absent && affected.length) {
      const overlay = el(`<div class="modal-overlay"></div>`);
      const modal = el(`<div class="modal"></div>`);
      modal.appendChild(el(`<div class="modal-title">${esc(absent.name.split(' ')[0])} is absent</div>`));
      const unitList = affected.map(u => 'Unit ' + esc(u.unit)).join(', ');
      modal.appendChild(el(`<div class="modal-sub">${affected.length} unit${affected.length>1?'s':''} need cover: ${unitList}</div>`));

      // chosen coverer (default = suggestion), selectable
      let chosen = pc.suggestId;
      modal.appendChild(el(`<div class="modal-label">Assign cover to:</div>`));
      const picker = el(`<div class="cover-picker"></div>`);
      const present = STAFF.filter(p => p.id !== pc.absentId && state.attendance[p.id] !== 'noshow');
      const loads = unitLoads();
      if (!present.length) {
        modal.appendChild(el(`<div class="modal-sub" style="color:#f87171">No one else is present to cover.</div>`));
      }
      present
        .sort((a,b) => (loads[a.id]||0)-(loads[b.id]||0))
        .forEach(p => {
          const isSug = p.id === pc.suggestId;
          const btn = el(`<button class="cover-opt ${p.id===chosen?'on':''}">${esc(p.name.split(' ')[0])}<span class="cover-load">${loads[p.id]||0} units${isSug?' · lightest':''}</span></button>`);
          btn.onclick = () => { chosen = p.id; picker.querySelectorAll('.cover-opt').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); };
          picker.appendChild(btn);
        });
      modal.appendChild(picker);

      const btnRow = el(`<div class="modal-btns"></div>`);
      const confirmB = el(`<button class="modal-confirm">Confirm cover</button>`);
      confirmB.onclick = () => { if (chosen) confirmCover(chosen); else dismissCover(); };
      const skipB = el(`<button class="modal-skip">Skip for now</button>`);
      skipB.onclick = () => dismissCover();
      if (present.length) btnRow.appendChild(confirmB);
      btnRow.appendChild(skipB);
      modal.appendChild(btnRow);

      overlay.appendChild(modal);
      app.appendChild(overlay);
    }
  }

  const nav = el(`<div class="nav"></div>`);
  const tabs = [
    { id:'rollcall', label:'Roll Call', ico:'☀' },
    { id:'airbnb', label:'Airbnb', ico:'⌂' },
    { id:'offices', label:'Offices', ico:'▤' },
    { id:'buildings', label:'Buildings', ico:'▦' },
    { id:'more', label:'More', ico:'⋯' },
  ];
  // "More" stays highlighted while you're on any of its sub-pages.
  const moreIds = ['more','building','history','team','settings'];
  tabs.forEach(t => {
    const isActive = t.id === 'more' ? moreIds.includes(state.tab) : state.tab === t.id;
    const b = el(`<button class="${isActive?'active':''}"><div class="ico">${t.ico}</div><div>${t.label}</div></button>`);
    b.onclick = () => setTab(t.id);
    nav.appendChild(b);
  });
  app.appendChild(nav);
}

// ============================================================
// LOGIN  (real accounts via Supabase Auth; the local gate is only a
// fallback for when the server isn't configured)
// ============================================================
const AUTH_KEY = 'cleaning_app_auth';                              // legacy fallback flag
const CREDENTIALS = { username: 'admin', password: 'admin123' };   // fallback only (no server)
let authed = false;                                                // true when a real Supabase session exists

// Synchronous "is someone signed in?" used by route()/boot().
function isLoggedIn() { return db ? authed : (localStorage.getItem(AUTH_KEY) === 'true'); }

async function logout() {
  try { if (db) await db.auth.signOut(); } catch (e) {}
  authed = false;
  localStorage.removeItem(AUTH_KEY);
  renderLogin();
}

async function attemptLogin() {
  const pinEl = document.getElementById('loginPin');
  const errEl = document.getElementById('loginErr');
  const pin = (pinEl.value || '').trim();
  const fail = (msg) => { errEl.textContent = msg; pinEl.classList.add('error'); };
  if (!/^\d{4}$/.test(pin)) { fail('Enter your 4-digit PIN'); return; }
  const email = 'admin@orfanerealestate.so';
  const password = 'orfane-' + pin;   // 4-digit PIN padded to a valid password

  if (db) {
    const btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
    try {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      authed = true;
      boot();
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
      pinEl.value = '';
      fail('Wrong PIN');
    }
    return;
  }
  fail('Server not connected.');
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const screen = el(`<div class="login-screen"></div>`);
  const box = el(`<div class="login-box"></div>`);
  box.appendChild(el(`<div class="login-logo">✦</div>`));
  box.appendChild(el(`<div class="login-heading">Cleaning Ops</div>`));
  box.appendChild(el(`<div class="login-sub">Enter your 4-digit PIN</div>`));
  const pin = el(`<input class="login-input" id="loginPin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" style="text-align:center;letter-spacing:0.6em;font-size:26px">`);
  pin.addEventListener('input', () => {
    pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
    pin.classList.remove('error');
    if (pin.value.length === 4) attemptLogin();   // auto-submit on 4th digit
  });
  pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  box.appendChild(pin);
  const btn = el(`<button class="login-btn" id="loginBtn">Sign In</button>`);
  btn.onclick = attemptLogin;
  box.appendChild(btn);
  box.appendChild(el(`<div class="login-error" id="loginErr"></div>`));
  screen.appendChild(box);
  app.appendChild(screen);
  setTimeout(() => { try { pin.focus(); } catch (e) {} }, 100);
}

async function boot() {
  load();
  route();              // login → app
  await remotePull();   // wait for the staff roster before matching arrivals
  loadHikArrivals().then(() => route());
  subscribeRealtime();
  refreshHistory();
  subscribeHistory();
}

// Startup: restore any existing Supabase session, then show the right screen.
async function startup() {
  if (!db) { if (isLoggedIn()) boot(); else renderLogin(); return; }
  try {
    const { data } = await db.auth.getSession();
    authed = !!(data && data.session);
  } catch (e) { authed = false; }
  db.auth.onAuthStateChange((_event, session) => {
    const was = authed;
    authed = !!session;
    if (!authed && was) renderLogin();   // signed out / session expired → back to login
  });
  if (authed) boot(); else renderLogin();
}
startup();
</script>
