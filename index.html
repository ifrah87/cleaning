<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f7fb">
<meta name="apple-mobile-web-app-title" content="Cleaning">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Cleaning Ops</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #f4f7fb;
    color: #15202e;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; font-size: 16px; }
  ::-webkit-scrollbar { display: none; }

  /* Brand palette
     navy   #0284c7   teal #0284c7   teal-soft #e3f2f4
     ink    #15202e   slate #5f7189  line #e7ecf3
     green  #15803d   amber #b45309  red #dc2626
  */

  #app { min-height: 100vh; padding-bottom: 78px; }

  .header {
    background: linear-gradient(180deg, #ffffff 0%, #eef2f8 100%);
    color: #15202e;
    padding: 18px 16px 16px;
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid #e7ecf3;
    box-shadow: 0 1px 3px rgba(15,40,80,0.06);
  }
  .h-eyebrow { font-size: 10px; letter-spacing: 0.18em; color: #5f7189; font-weight: 600; margin-bottom: 3px; }
  .h-title { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; color: #0f1a27; }
  .h-date { font-size: 11px; color: #5f7189; margin-top: 3px; font-weight: 500; }

  .stats { display: flex; gap: 8px; margin-top: 14px; }
  .stat {
    background: #eef2f8; border: 1px solid #e7ecf3;
    border-radius: 10px; padding: 8px 12px; flex: 1;
  }
  .stat .lbl { font-size: 9px; letter-spacing: 0.12em; color: #5b6a7f; font-weight: 600; margin-bottom: 1px; }
  .stat .val { font-size: 19px; font-weight: 800; color: #0f1a27; }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #ffffff; border-top: 1px solid #e7ecf3;
    display: flex; z-index: 30;
    padding-bottom: env(safe-area-inset-bottom, 0);
    box-shadow: 0 -2px 12px rgba(15,58,95,0.06);
  }
  .nav button {
    flex: 1; padding: 10px 4px 12px; text-align: center;
    color: #5b6a7f; font-size: 10px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .nav button.active { color: #0284c7; }
  .nav .ico { font-size: 19px; line-height: 1; }

  /* Top bar: getting back, and finding things. Both sit above the title on every
     screen so they are in the same place whatever you are looking at. */
  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-height: 26px; }
  .tb-btn {
    font-size: 12px; font-weight: 700; color: #0284c7;
    background: #eef6fd; border: 1px solid #cfe8fb; border-radius: 8px; padding: 5px 10px;
  }
  .tb-btn:active { background: #dceefb; }

  /* THE SEARCH BOX SCROLLED AWAY WITH EVERYTHING ELSE. Sixty-six rooms is a long
     list, and the one control that makes it short sat at the very top of it — so
     finding a second room meant scrolling all the way back up to the box. It sticks
     under the header now, which is itself sticky; --hdr is the header's real height,
     measured after each render because it changes with the screen. */
  .stickbar {
    position: sticky; top: var(--hdr, 0px); z-index: 15;
    background: #f4f7fb; padding: 8px 0 4px; margin: 0 -2px;
  }
  .grp-head { cursor: pointer; user-select: none; }
  .grp-btn {
    display: flex; align-items: center; gap: 9px; width: 100%;
    margin: 16px 0 6px; padding: 11px 12px; border-radius: 10px;
    background: #ffffff; border: 1px solid #e7ecf3; text-align: left;
  }
  .grp-btn:active { background: #eef2f8; }
  .grp-title { font-size: 14px; font-weight: 700; color: #0f1a27; }
  .grp-sub { font-size: 11px; color: #5f7189; margin-top: 1px; }
  .grp-count {
    font-size: 11px; font-weight: 700; color: #5b6a7f; background: #f4f7fb;
    border-radius: 20px; padding: 3px 9px; flex: 0 0 auto;
  }
  .grp-caret { font-size: 11px; color: #5b6a7f; width: 12px; }

  /* Segmented filter — one row of room kinds in place of four tabs. */
  .seg { display: flex; gap: 6px; margin-bottom: 14px; }
  .segbtn {
    flex: 1; padding: 9px 4px; border-radius: 9px; border: 1px solid #e7ecf3;
    background: #fff; color: #5f7189; font-size: 12px; font-weight: 700;
  }
  .segbtn.on { background: #0284c7; border-color: #0284c7; color: #fff; }
  .segn { display: block; font-size: 10px; font-weight: 600; opacity: 0.7; }

  /* Search sheet */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(15,32,46,0.45); z-index: 60;
    display: flex; flex-direction: column;
  }
  .sheet {
    background: #f4f7fb; margin-top: auto; border-radius: 16px 16px 0 0;
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet-head { padding: 14px 16px 10px; background: #fff; border-bottom: 1px solid #e7ecf3; }
  .sheet-body { padding: 12px 16px 24px; overflow-y: auto; }
  .sr-row {
    display: flex; align-items: center; gap: 10px; background: #fff;
    border: 1px solid #e7ecf3; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .sr-main { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: #0f1a27; }
  .sr-sub { font-size: 11px; color: #5f7189; font-weight: 500; margin-top: 1px; }
  .sr-kind { font-size: 9px; letter-spacing: 0.1em; font-weight: 700; color: #5b6a7f; }

  /* The hand-out sheet: one screen, photographable, no controls. */
  .sheet-paper { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 12px 14px; }
  .sp-head { border-bottom: 2px solid #0f1a27; padding-bottom: 7px; margin-bottom: 9px; }
  .sp-date { font-size: 16px; font-weight: 800; color: #0f1a27; letter-spacing: -0.01em; }
  .sp-meta { font-size: 11px; color: #5f7189; font-weight: 600; margin-top: 1px; }
  .sp-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #eef2f8; }
  .sp-row:last-child { border-bottom: none; }
  .sp-who {
    flex: 0 0 84px; font-size: 13px; font-weight: 800; color: #0f1a27;
    display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap;
  }
  .sp-with { flex: 1 0 100%; font-size: 10px; font-weight: 700; color: #5f7189; }
  .sp-lead { color: #d97706; font-size: 11px; }
  .sp-n { font-size: 10px; font-weight: 700; color: #5b6a7f; }
  .sp-jobs { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 3px 4px; }
  .sp-job {
    font-size: 12px; font-weight: 700; color: #15202e;
    background: #eef2f8; border-radius: 5px; padding: 1px 6px;
  }
  .sp-job.area { background: #e3f2f4; color: #0369a1; font-weight: 600; }
  .sp-loose .sp-who { color: #b45309; }
  .sp-loose .sp-job { background: #fdf3e6; color: #8a5a12; }
  @media (min-width: 900px) {
    body:not(.tv) .sp-who { flex: 0 0 110px; }
  }

  /* Floor allocation — tap a floor on or off for a person. */
  .fl-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .fl-btn {
    min-width: 30px; padding: 5px 7px; border-radius: 7px; font-size: 12px; font-weight: 700;
    border: 1px solid #e7ecf3; background: #fff; color: #5f7189;
  }
  .fl-btn.on { background: #0284c7; border-color: #0284c7; color: #fff; }
  .fl-btn.taken { border-style: dashed; color: #b45309; }

  /* A LIST OF JOBS IS NOT PROSE, SO IT DOES NOT WANT A COLUMN OF TEXT.
     On a phone this is one column and reads exactly as it did. On a monitor the same
     markup fills the width in as many columns as fit, which is the difference between
     seeing this morning at a glance and scrolling thirty-six rows to find one flat.
     A column width rather than a breakpoint: the number of them follows the window,
     including the half-width one somebody has the board open in.
     Multi-column rather than a grid, because a grid lines its rows up — so one long
     column (ten guest flats nobody has been given) leaves a band of white space beside
     every short one. Columns pack instead, which is what a board should do. */
  .jobcols { columns: 260px; column-gap: 12px; }
  .jobcols > div { break-inside: avoid; -webkit-column-break-inside: avoid;
                   display: inline-block; width: 100%; margin: 0 0 12px; }

  /* THE BOARD, IN YOUR HAND. The wall version is the one screen in this building that
     nobody has ever had to be taught — so the phone stops inventing a second way to show
     the same morning and simply becomes it. Same ground, same cards, same colours, same
     order. The only difference is that everything on it can be tapped. Sized in pixels
     rather than the wall's vw, because a thumb is a thumb whatever the screen. */
  .board { background: #0a1220; border-radius: 14px; padding: 12px;
           display: flex; flex-direction: column; gap: 12px; }
  /* A GRID, NOT A FLOW. Packed columns fit more on a screen and read as a jumble: cards
     start at different heights, a row is never a row, and the eye has no line to follow.
     Equal columns with their rows aligned is what makes it look like the wall. */
  .bd-cols { display: grid; gap: 10px; align-items: stretch;
             grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .bd-col { background: #101c30; border-radius: 12px; padding: 12px; margin: 0;
            display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  /* NOBODY YET holds everything nobody has been given, so on a morning where that is
     most of the guest flats it is three times the size of any other card. Two columns
     wide when it is carrying a crowd, so the chips lay out instead of stacking — but
     only where there are two columns to span. Spanning two in a one-column grid does
     not widen the card, it splits the whole board in half and squeezes every name on
     the phone into a ribbon. */
  @media (min-width: 900px) { .bd-col.wide2 { grid-column: span 2; } }
  /* ...and three wide once it is carrying most of a morning, on a screen with
     three columns to give it. The wall is read from across a room: chips that
     wrap into a narrow ribbon are the thing that makes it unreadable. */
  @media (min-width: 1300px) { .bd-col.wide3 { grid-column: span 3; } }
  .bd-col.none { padding: 14px 16px; }
  .bd-col.none .bd-chip, .bd-col.none .freqmini { padding: 8px 13px; }
  .bd-col.none { background: #2b2008; }
  .bd-col.out  { background: #241a06; }
  .bd-col.off  { background: #151d2b; }
  .bd-hd { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid #1e2f4d;
           padding-bottom: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .bd-who { font-size: 15px; font-weight: 800; color: #eaf1fb; }
  .bd-col.none .bd-who { color: #fbbf24; }
  .bd-col.out .bd-who { color: #fcd34d; }
  .bd-col.off .bd-who { color: #94a3b8; }
  .bd-sub { font-size: 11px; font-weight: 700; color: #6f8ab0; width: 100%; }
  .bd-at { font-size: 11px; font-weight: 800; color: #86efac; }
  .bd-at.none { color: #fbbf24; }
  .bd-count { margin-left: auto; font-size: 13px; font-weight: 800; color: #6f8ab0; }
  .bd-grp { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; color: #6f8ab0; margin: 10px 0 5px; }
  .bd-jobs { display: flex; flex-wrap: wrap; gap: 7px; }
  /* Every chip the same height and no narrower than a room number needs, so a column of
     them lines up instead of stepping in and out with the length of the label. */
  /* A CHIP IS TWO TARGETS. Tapping it means cleaned — that is what the crew do twenty
     times a day and it must never cost them a thought. Moving a room is the rarer,
     more deliberate act, so it gets its own grip on the edge: nothing is picked up by
     accident, and a mis-tap is a tick that untaps rather than a room in somebody's hand. */
  /* A chip is as wide as its name and no wider than the card it is in. "Main Lobby/Office
     · Hoolka & Xafiiska" is three times the width of "402", and without the cap it simply
     ran off the edge, taking its grip with it — the name was cut off and the one part you
     drag by was unreachable. Long names wrap inside the chip now. */
  .bd-job { min-height: 46px; min-width: 76px; max-width: 100%; border: 0;
            border-left: 5px solid #3d557f; border-radius: 9px; background: #1c2b45;
            color: #dce8f8; font-size: 16px; font-weight: 800;
            font-variant-numeric: tabular-nums;
            display: flex; align-items: stretch; overflow: hidden; }
  .bd-lbl { flex: 1 1 auto; min-width: 0; padding: 11px 12px; cursor: pointer; text-align: center;
            background: transparent; border: 0; color: inherit; font: inherit;
            overflow-wrap: anywhere; line-height: 1.25; }
  .bd-job.area .bd-lbl { text-align: left; }
  .bd-grip { flex: 0 0 auto; width: 26px; display: flex; align-items: center; justify-content: center;
             cursor: grab; color: #7f9abf; font-size: 13px; background: rgba(255,255,255,0.06);
             border: 0; border-left: 1px solid rgba(255,255,255,0.08); touch-action: none; }
  .bd-grip:active { cursor: grabbing; background: rgba(56,189,248,0.28); color: #eaf1fb; }
  /* A FINGER IS NOT A MOUSE POINTER. 26px is a comfortable target to click and a mean
     one to hit with a thumb on a moving bus, and missing it scrolls the board instead
     of picking the room up — which reads as the room refusing to move. Wider wherever
     the pointer is coarse, which is every phone and both televisions. */
  @media (pointer: coarse) { .bd-grip { width: 44px; font-size: 15px; } }
  .bd-job.held .bd-grip { background: #38bdf8; color: #04263a; }
  .bd-more { margin-top: auto; }
  .bd-job.early { background: #4a1414; color: #ffd9d9; border-left-color: #ef4444; }
  .bd-job.air   { background: #4c1d95; color: #f3e8ff; border-left-color: #c084fc; }
  .bd-job.area  { background: #1a2438; color: #b7c8de; border-left-color: #64748b; font-weight: 700; }
  .bd-job.done  { background: #123020; color: #86efac; border-left-color: #22c55e;
                  text-decoration: line-through; opacity: 0.85; }
  .bd-job.held  { outline: 3px solid #38bdf8; outline-offset: 1px; }
  .bd-more { width: 100%; padding: 9px; border-radius: 8px; border: 1px dashed #3d557f;
             background: transparent; color: #7ea6dc; font-size: 11px; font-weight: 700; cursor: pointer; }
  .bd-col.drop { outline: 2px dashed #38bdf8; }
  @media (hover: hover) { .bd-job { cursor: grab; } .bd-job:active { cursor: grabbing; } }
  .bd-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bd-tab { flex: 1 1 0; min-width: 84px; padding: 11px 10px; border-radius: 9px;
            border: 1px solid #1e2f4d; background: #101c30; color: #7f9abf;
            font-size: 13px; font-weight: 700; cursor: pointer; }
  .bd-tab.on { background: #1c2b45; border-color: #3d557f; color: #eaf1fb; }
  .bd-tally { display: flex; align-items: baseline; gap: 8px; color: #7f9abf;
              font-size: 13px; font-weight: 700; }
  .bd-tally b { font-size: 24px; font-weight: 900; }
  .bd-panel { background: #101c30; border: 1px solid #1e2f4d; border-radius: 10px; padding: 10px 12px;
              display: flex; flex-direction: column; gap: 8px; }
  .bd-panel .lbl { font-size: 11px; font-weight: 700; color: #7f9abf; }
  .bd-close { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #15803d;
              color: #eafaf0; font-size: 14px; font-weight: 800; cursor: pointer; }

  /* ONE APP, ONE GROUND.
     The board is dark and every other screen was paper, so tapping ☰ and opening the
     morning set-up looked like leaving the app and arriving in the old one. Screens that
     are used once a day still have to belong to the screen that is used all day. The
     palette below is the board's own, applied to the shared furniture — cards, rows,
     inputs, chips — so the sub-pages are the same app in a quieter room. The televisions
     are scoped out of all of it; they have their own stylesheet and always have. */
  body:not(.tv) { background: #0a1220; color: #eaf1fb; }
  /* The desktop rule further down paints #app paper-white and comes later in the file,
     so this one has to say it means it. */
  body:not(.tv) #app { background: #0a1220 !important; box-shadow: none !important; }
  body:not(.tv) .header { background: #0a1220; border-bottom: 1px solid #1e2f4d; }
  body:not(.tv) .h-title { color: #eaf1fb; }
  body:not(.tv) .h-eyebrow, body:not(.tv) .h-date { color: #7f9abf; }
  body:not(.tv) .body { background: #0a1220; }
  body:not(.tv) .stat { background: #101c30; border-color: #1e2f4d; }
  body:not(.tv) .stat .lbl { color: #7f9abf; }
  body:not(.tv) .stat .val { color: #eaf1fb; }
  body:not(.tv) .tb-btn { background: #101c30; border-color: #1e2f4d; color: #9fb6d4; }
  body:not(.tv) .tb-btn:active { background: #1c2b45; }
  body:not(.tv) .stickbar { background: #0a1220; border-color: #1e2f4d; }
  body:not(.tv) .segbtn { background: #101c30; border-color: #1e2f4d; color: #9fb6d4; }
  body:not(.tv) .segbtn.on { background: #1c2b45; border-color: #3d557f; color: #eaf1fb; }
  body:not(.tv) .sheet, body:not(.tv) .sheet-head { background: #101c30; border-color: #1e2f4d; }
  body:not(.tv) .sr-row { background: #101c30; border-color: #1e2f4d; color: #eaf1fb; }
  body:not(.tv) .sheet-paper { background: #101c30; border-color: #1e2f4d; }
  body:not(.tv) .person { background: #101c30; border-color: #1e2f4d; }
  body:not(.tv) .person-name { color: #eaf1fb; }
  body:not(.tv) .person-floors { color: #7f9abf; }
  body:not(.tv) .section-label { color: #7f9abf; }
  body:not(.tv) .note, body:not(.tv) .footer { color: #6f8ab0; }
  body:not(.tv) .empty { color: #7f9abf; }
  body:not(.tv) .su-card { background: #101c30; border-color: #1e2f4d; color: #eaf1fb; }
  body:not(.tv) .su-card.done { background: #123020; border-color: #22c55e; }
  body:not(.tv) .su-ctl { border-top-color: #1e2f4d; }
  body:not(.tv) .su-unit { color: #eaf1fb; }
  body:not(.tv) .sp-who { color: #eaf1fb; }
  body:not(.tv) .su-guest, body:not(.tv) .su-assign { color: #9fb6d4; }
  body:not(.tv) .area-list { background: #101c30; border-color: #1e2f4d; }
  body:not(.tv) .area-item { border-top-color: #1e2f4d; }
  body:not(.tv) .area-name { color: #eaf1fb; }
  body:not(.tv) .area-freq { color: #7f9abf; }
  body:not(.tv) .area-tick { background: #16233a; border-color: #3d557f; }
  body:not(.tv) .freqmini { background: #101c30; border-color: #1e2f4d; color: #9fb6d4; }
  body:not(.tv) .freqmini.on { background: #0284c7; border-color: #0284c7; color: #ffffff; }
  body:not(.tv) .reset-btn { background: #101c30; border-color: #1e2f4d; color: #9fb6d4; }
  body:not(.tv) .area-select, body:not(.tv) .su-card input,
  body:not(.tv) input, body:not(.tv) select { background: #16233a; color: #eaf1fb; border-color: #3d557f; }
  body:not(.tv) input::placeholder, body:not(.tv) .su-card input::placeholder { color: #6f8ab0; }
  body:not(.tv) .modal { background: #101c30; border-color: #1e2f4d; color: #eaf1fb; }
  body:not(.tv) .modal-skip { background: #16233a; border-color: #3d557f; color: #9fb6d4; }
  body:not(.tv) .alert { background: #2b1414; border-color: #7f1d1d; }
  /* The rest of the estate's furniture: the floor grid, the exterior rows, the hand-out
     sheet, the team groups and the status pills. Colour only — nothing here moves. */
  body:not(.tv) .zone { background: #101c30; border-color: #1e2f4d; box-shadow: none; }
  body:not(.tv) .zone.done { background: #123020; border-color: #22c55e; }
  body:not(.tv) .zone-name { color: #eaf1fb; }
  body:not(.tv) .zone.done .zone-name { color: #86efac; }
  body:not(.tv) .unit { background: #16233a; border-color: #1e2f4d; }
  body:not(.tv) .unit.done { background: #123020; border-color: #22c55e; }
  body:not(.tv) .unit-num { color: #eaf1fb; }
  body:not(.tv) .crew-name { color: #eaf1fb; }
  body:not(.tv) .crew-sub { color: #7f9abf; }
  body:not(.tv) .fl-btn { background: #16233a; border-color: #3d557f; color: #9fb6d4; }
  body:not(.tv) .sp-row { border-bottom-color: #1e2f4d; }
  body:not(.tv) .status-btn { background: #16233a; border-color: #3d557f; color: #9fb6d4; }
  body:not(.tv) .su-rm { border-color: #7f1d1d; color: #fca5a5; }
  body:not(.tv) .su-mark { background: #16233a; color: #9fb6d4; }
  body:not(.tv) .area-more, body:not(.tv) .area-who { background: #16233a; color: #9fb6d4; border-color: #3d557f; }
  body:not(.tv) .grp-btn { background: #101c30; border-color: #1e2f4d; }
  body:not(.tv) .grp-btn:active { background: #16233a; }
  body:not(.tv) .grp-title { color: #eaf1fb; }
  body:not(.tv) .grp-sub, body:not(.tv) .grp-caret { color: #7f9abf; }
  body:not(.tv) .grp-count { background: #16233a; color: #9fb6d4; }
  /* The room number on a room card was a near-black that vanished into the card. */

  /* THE BOARD IS THE PAGE, NOT A PANEL ON IT. A dark board floating in a white app is
     two designs meeting at a rounded corner, and it reads as exactly that — something
     embedded rather than the thing you came for. On the board screen the whole app takes
     the board's ground, edge to edge, header included. Every other screen stays paper. */
  body.boardmode { background: #0a1220; }
  body.boardmode #app { background: #0a1220 !important; box-shadow: none !important; }
  body.boardmode .header { background: #0a1220; border-bottom: 1px solid #1e2f4d; }
  body.boardmode .header div { color: #eaf1fb; }
  body.boardmode .tb-btn { background: #101c30; border-color: #1e2f4d; color: #9fb6d4; }
  body.boardmode .body { background: #0a1220; padding: 10px; }
  body.boardmode .board { background: transparent; border-radius: 0; padding: 0; }
  body.boardmode .note, body.boardmode .footer { color: #56698a; }

  .body { padding: 16px; }

  /* Roll call */
  .crew-group { margin-bottom: 16px; }
  .crew-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 0 2px; }
  .crew-dot { width: 10px; height: 10px; border-radius: 3px; }
  .crew-name { font-size: 13px; font-weight: 700; color: #0f1a27; }
  .crew-sub { font-size: 11px; color: #5b6a7f; font-weight: 600; margin-left: auto; }

  .person {
    background: #ffffff; border: 1px solid #e7ecf3; border-radius: 9px;
    padding: 8px 12px; margin-bottom: 5px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 3px rgba(15,58,95,0.04);
  }
  .person-name { font-size: 14px; }
  .person-floors { font-size: 11px; }
  .person-info { flex: 1; min-width: 0; }
  .person-name { font-size: 15px; font-weight: 600; color: #0f1a27; }
  .person-floors { font-size: 12px; color: #5f7189; margin-top: 1px; }
  .status-btn {
    padding: 9px 14px; border-radius: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    min-width: 96px; text-align: center; color: #ffffff;
  }

  .alert {
    background: #ffffff; border: 1px solid #f6d5d5; border-left: 4px solid #dc2626;
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(212,73,63,0.08);
  }
  .alert-title { font-size: 12px; color: #dc2626; font-weight: 700; }
  .alert-body { font-size: 13px; color: #b91c1c; margin-top: 5px; line-height: 1.5; }
  .cover-suggest {
    background: #e7f6ec; border: 1px solid #bfe6cd; border-radius: 9px;
    padding: 10px 12px; margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .cover-text { font-size: 12px; color: #15803d; flex: 1; }
  .cover-btn {
    background: #15803d; color: #ffffff; padding: 9px 14px; border-radius: 8px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }

  .confirm {
    background: #e7f6ec; border: 1px solid #bfe6cd; border-radius: 9px;
    padding: 10px 12px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .confirm-text { font-size: 12px; color: #15803d; flex: 1; }
  .undo-btn { font-size: 11px; color: #5f7189; border: 1px solid #d8e0ea; border-radius: 7px; padding: 7px 11px; font-weight: 600; }

  /* Floors */
  .floor { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; margin-bottom: 9px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,58,95,0.04); }
  .floor-head { width: 100%; padding: 13px 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
  .floor-badge {
    width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #ffffff;
  }
  .floor-info { flex: 1; min-width: 0; }
  .floor-name { font-size: 15px; font-weight: 700; color: #0f1a27; }
  .floor-sub { font-size: 11px; color: #5f7189; margin-top: 1px; font-weight: 500; }
  .floor-prog { width: 48px; height: 6px; border-radius: 3px; background: #e7ecf3; position: relative; flex-shrink: 0; overflow: hidden; }
  .floor-prog > div { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .chev { color: #5b6a7f; font-size: 12px; width: 14px; text-align: center; }

  .unit-grid { padding: 4px 14px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .unit { background: #eef2f8; border: 1px solid #e7ecf3; border-radius: 10px; padding: 11px 8px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .unit.done { background: #e7f6ec; border-color: #bfe6cd; }
  .unit-num { font-size: 15px; font-weight: 800; color: #0f1a27; }
  .unit.done .unit-num { color: #15803d; }
  .unit-mark { width: 100%; padding: 7px; border-radius: 7px; font-size: 11px; font-weight: 700; color: #ffffff; background: #0284c7; }
  .unit.done .unit-mark { background: #15803d; }

  /* Zones */
  .zone { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(15,58,95,0.04); }
  .zone.done { background: #e7f6ec; border-color: #bfe6cd; }
  .zone-info { flex: 1; min-width: 0; }
  .zone-freq { font-size: 10px; letter-spacing: 0.08em; font-weight: 700; }
  .zone-name { font-size: 14px; font-weight: 600; color: #0f1a27; margin-top: 2px; }
  .zone.done .zone-name { color: #15803d; }
  .zone-mark { padding: 9px 16px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #ffffff; background: #0284c7; white-space: nowrap; }
  .zone.done .zone-mark { background: #15803d; }

  .section-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; margin: 2px 0 12px; text-transform: uppercase; }
  .note { font-size: 13px; color: #5f7189; line-height: 1.55; margin-bottom: 14px; }
  .reset-btn { width: 100%; background: #ffffff; color: #5f7189; border: 1px solid #d8e0ea; border-radius: 10px; padding: 11px; font-size: 12px; font-weight: 600; margin-bottom: 14px; }
  .owner-tag { font-size: 9px; letter-spacing: 0.04em; padding: 4px 9px; border-radius: 6px; font-weight: 700; color: #ffffff; }
  .footer { padding: 18px 16px 8px; font-size: 11px; color: #6b7a8f; text-align: center; font-weight: 500; }
  .hint { font-size: 11px; color: #6b7a8f; text-align: center; margin-top: 6px; font-weight: 500; }

  /* Serviced units */
  .addbox { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .addbox input { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 11px; }
  .addbox input::placeholder { color: #5b6a7f; }
  .freqpick { flex: 1; padding: 9px 4px; border-radius: 8px; font-size: 11px; font-weight: 600; color: #5f7189; background: #f4f7fb; border: 1px solid #d8e0ea; }
  .freqpick.on { color: #ffffff; background: #0284c7; border-color: #0284c7; }
  .add-btn { width: 100%; background: #0284c7; color: #ffffff; border-radius: 9px; padding: 12px; font-size: 13px; font-weight: 700; }
  .su-card { background: #ffffff; border: 1px solid #e7ecf3; border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; }
  .su-card.done { background: #e7f6ec; border-color: #bfe6cd; }
  .su-top { display: flex; align-items: center; gap: 12px; }
  .su-unit { font-size: 16px; font-weight: 700; color: #0f1a27; }
  .su-guest { font-size: 12px; color: #5f7189; margin-top: 1px; }
  .su-mark { padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #ffffff; background: #0284c7; white-space: nowrap; }
  .su-card.done .su-mark { background: #15803d; }
  .su-next { font-size: 11px; color: #5f7189; font-weight: 600; padding: 6px 10px; border: 1px solid #d8e0ea; border-radius: 7px; white-space: nowrap; }
  .su-ctl { display: flex; gap: 6px; margin-top: 11px; padding-top: 11px; border-top: 1px solid #e7ecf3; }
  /* Communal areas: a plain list, not nine stacked cards. One thin rule between
     rows carries the separation a box was doing at ten times the height. */
  .area-list { background: #ffffff; border: 1px solid #e2e8f1; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .area-item { border-top: 1px solid #eef2f7; }
  .area-item:first-child { border-top: none; }
  .area-row { display: flex; align-items: center; gap: 8px; padding: 6px 9px; }
  .area-tick { flex: 0 0 auto; width: 19px; height: 19px; padding: 0; border-radius: 50%; border: 1.5px solid #cbd5e1; background: #ffffff; color: transparent; font-size: 10px; line-height: 1; }
  .area-tick.on { background: #15803d; border-color: #15803d; color: #ffffff; }
  .area-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 700; color: #15202e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .area-item.done .area-name { color: #94a3b8; }
  .area-freq { font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: 0.05em; }
  .area-who { flex: 0 1 112px; min-width: 0; font-size: 11.5px; padding: 3px 5px; border: 1px solid #e2e8f1; border-radius: 6px; background: #f8fafc; color: #334155; }
  .area-more { flex: 0 0 auto; width: 22px; padding: 3px 0; font-size: 12px; color: #94a3b8; background: transparent; border: none; }
  .area-ctl { display: flex; gap: 4px; padding: 0 9px 7px; }
  .freqmini { flex: 1; padding: 7px 4px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #5f7189; background: #f4f7fb; border: 1px solid #d8e0ea; }
  .freqmini.on { color: #ffffff; background: #0284c7; border-color: #0284c7; }
  .su-rm { padding: 7px 12px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #dc2626; background: transparent; border: 1px solid #f6d5d5; }
  .su-edit { padding: 7px 12px; border-radius: 7px; font-size: 10px; font-weight: 600; color: #0284c7; background: transparent; border: 1px solid #cfe8fb; }
  .area-select { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 10px; font-size: 13px; }
  .su-card input { width: 100%; background: #f4f7fb; color: #15202e; border: 1px solid #d8e0ea; border-radius: 8px; padding: 11px; }
  .su-card input::placeholder { color: #5b6a7f; }
  .su-assign { font-size: 11px; font-weight: 600; margin-top: 3px; }
  .su-card.needs-cover { border-color: #dc2626; }

  /* Cover confirmation popup */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: #ffffff; border: 1px solid #d8e0ea; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; padding: 20px 18px calc(20px + env(safe-area-inset-bottom,0)); }
  .modal-title { font-size: 18px; font-weight: 800; color: #0f1a27; }
  /* pre-line so an explanation can have paragraphs; single-line messages are unaffected */
  .modal-sub { font-size: 13px; color: #5f7189; margin-top: 6px; line-height: 1.5; white-space: pre-line; }
  .modal-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; text-transform: uppercase; margin: 16px 0 8px; }
  .cover-picker { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .cover-opt { display: flex; justify-content: space-between; align-items: center; padding: 13px 14px; border-radius: 10px; background: #eef2f8; border: 1px solid #d8e0ea; color: #15202e; font-size: 14px; font-weight: 600; }
  .cover-opt.on { border-color: #0284c7; background: #e6f4fd; }
  .cover-load { font-size: 11px; color: #5f7189; font-weight: 500; }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
  .modal-confirm { flex: 1; background: #0284c7; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 700; }
  .modal-skip { padding: 14px 18px; border-radius: 10px; background: transparent; border: 1px solid #d8e0ea; color: #5f7189; font-size: 13px; font-weight: 600; }
  .modal-danger { flex: 1; background: #dc2626; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 700; }

  /* Login screen */
  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 360px; }
  .login-logo { font-size: 36px; text-align: center; margin-bottom: 8px; }
  .login-heading { font-size: 22px; font-weight: 800; color: #0f1a27; text-align: center; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: #5b6a7f; text-align: center; margin-bottom: 28px; }
  .login-label { font-size: 11px; letter-spacing: 0.1em; color: #5b6a7f; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
  .login-input { width: 100%; background: #ffffff; color: #15202e; border: 1px solid #d8e0ea; border-radius: 10px; padding: 13px 14px; font-size: 15px; margin-bottom: 16px; outline: none; }
  .login-input:focus { border-color: #0284c7; }
  .login-input.error { border-color: #dc2626; }
  .login-btn { width: 100%; background: #0284c7; color: #ffffff; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; margin-top: 4px; }
  .login-error { font-size: 12px; color: #dc2626; text-align: center; margin-top: 12px; font-weight: 600; }

  /* Backup buttons */
  .backup-btn { width: 100%; border-radius: 10px; padding: 13px; font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .backup-export { background: #ffffff; color: #0284c7; border: 1px solid #cfe8fb; }
  .backup-import { background: #ffffff; color: #b45309; border: 1px solid #f5e4bd; }
  .backup-msg { font-size: 12px; text-align: center; margin-top: 8px; font-weight: 600; padding: 8px; border-radius: 8px; }
  .backup-msg.ok { color: #15803d; background: #e7f6ec; }
  .backup-msg.err { color: #dc2626; background: #fbe3e3; }

  /* Persistent storage warning (save/load failures) */
  .storage-warn { background: #fbe3e3; color: #dc2626; border-bottom: 1px solid #f6d5d5; padding: 11px 14px; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.4; }

  /* Make the native date-picker calendar icon visible on our dark fields */
  /* A room in the air, following the thumb. Pointer-events off so the element
     under it can still be found with elementFromPoint. */
  .drag-ghost {
    position: fixed; z-index: 90; pointer-events: none;
    transform: translate(-50%, -140%);
    background: #0284c7; color: #ffffff; border-radius: 8px;
    padding: 8px 13px; font-size: 14px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(15,58,95,0.3);
  }
  .drop-live { border-color: #0284c7 !important; background: #f0f9ff !important; }
  input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.55; cursor: pointer; }
  input[type="date"] { -webkit-appearance: none; appearance: none; }

  /* Lists of rooms flow into columns as the window allows. One room per full-width
     row is right on a phone and absurd on a desktop, where twenty-three of them
     become a scroll through a column of mostly empty space. auto-fill means the
     same markup is one column on a handset and five on the office monitor. */
  .rc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }
  .rc-grid > * { margin-bottom: 0 !important; }

  /* ---- TV board -----------------------------------------------------------
     Read from across the office, not from the hand. Everything is sized in vw/vh
     so the same file fills a 32" screen and a 65" one, and the 3vw/3vh padding
     keeps the edges clear of the overscan a TV crops off its own picture.
     Dark ground: a white board on a screen left on all day is a lamp, and the
     one thing an office TV must not be is tiring to glance at. */
  /* ============================================================
     DESKTOP. The app is built thumb-first — full-bleed rows, 12px button padding,
     16px inputs — which on a mouse-driven screen is a column of oversized controls
     stretched across a metre of desk. Same layout, sized for a pointer, and capped
     so a line of text is a readable length rather than the width of the monitor.
     Scoped away from body.tv: the office TV is read from across the room and wants
     everything BIGGER, not smaller.
     ============================================================ */
  @media (min-width: 900px) {
    body:not(.tv) #app { max-width: 900px; margin: 0 auto; box-shadow: 0 0 0 1px #e7ecf3; background: #f4f7fb; }
    body:not(.tv) .header { padding: 12px 20px 12px; }
    body:not(.tv) .h-title { font-size: 18px; }
    body:not(.tv) .body { padding: 14px 20px; }
    body:not(.tv) .add-btn { width: auto; min-width: 180px; padding: 8px 16px; font-size: 12px; }
    body:not(.tv) .freqpick { padding: 6px 8px; font-size: 11px; }
    body:not(.tv) .freqmini { padding: 5px 8px; font-size: 10px; }
    body:not(.tv) .segbtn { padding: 7px 6px; font-size: 12px; }
    body:not(.tv) .su-card { padding: 10px 12px; margin-bottom: 6px; }
    body:not(.tv) .su-mark { padding: 6px 12px; }
    body:not(.tv) .su-card input,
    body:not(.tv) .area-select { padding: 7px 9px; font-size: 13px; }
    body:not(.tv) input { font-size: 14px; }
    body:not(.tv) .stat { padding: 6px 10px; }
    body:not(.tv) .stat .val { font-size: 17px; }
    /* The bar is fixed to the bottom of the WINDOW on a phone, which on a monitor
       leaves it stranded far below the content it belongs to. */
    body:not(.tv) .nav { max-width: 900px; margin: 0 auto; }
    body:not(.tv) .nav button { padding: 8px 4px 9px; font-size: 11px; }
    body:not(.tv) .nav .ico { font-size: 16px; }
    body:not(.tv) .sheet { max-width: 900px; margin: auto auto 0; width: 100%; }
    /* ...EXCEPT ON A SCREEN THAT IS A BOARD. Ticking off is the one thing done from a
       desk as much as from a corridor, and 900px of it on a monitor is a single file of
       rows with two thirds of the screen empty beside them. The reading-width cap is
       for screens made of sentences; this one is made of jobs. */
    body.wide:not(.tv) #app,
    body.wide:not(.tv) .nav,
    body.wide:not(.tv) .sheet { max-width: 1400px; }
  }

  /* ---------------------------------------------------------------------------
     TWO GROUNDS, ONE BOARD. Every colour below is a variable so the light version
     is a palette swap and not a second stylesheet drifting out of step with this
     one. Dark is still the default and still for the reason it always was — a
     white screen left on all day is a lamp on the office wall — but the app is
     paper-white, and being able to put the two side by side on the actual TV is
     worth more than the argument about which is right.
     --------------------------------------------------------------------------- */
  body.tv {
    --tv-bg: #0a1220;      --tv-fg: #eaf1fb;      --tv-muted: #6f8ab0;
    --tv-card: #101c30;    --tv-line: #1e2f4d;    --tv-chip: #16233a;
    --tv-bar: #1b2942;     --tv-empty: #56698a;   --tv-accent: #7ea6dc;
    --tv-dot: #24344f;     --tv-job-bg: #1c2b45;  --tv-job-fg: #dce8f8;  --tv-job-ln: #3d557f;
    --tv-early-bg: #4a1414; --tv-early-fg: #ffd9d9; --tv-early-ln: #ef4444;
    --tv-done-bg: #123020;  --tv-done-fg: #86efac;  --tv-done-ln: #22c55e;
    --tv-area-bg: #1a2438;  --tv-area-fg: #b7c8de;  --tv-area-ln: #64748b;
    --tv-cover-bg: #3d2c08; --tv-cover-fg: #fde68a; --tv-cover-ln: #f59e0b;
    /* AIRBNB IS ITS OWN COLOUR. Red is "wanted first thing", amber is "nobody is on
       this", blue is an ordinary room — three colours already carrying three meanings.
       The guest flats are a different job done by a different pair, so they get violet
       rather than a fourth shade of something that already means something else. */
    --tv-air-bg: #4c1d95;   --tv-air-fg: #f3e8ff;   --tv-air-ln: #c084fc;
    --tv-none-bg: #2b2008;  --tv-none-fg: #fbbf24;
    --tv-out-bg: #241a06;   --tv-out-fg: #fcd34d;
    /* OFF IS NOT A GAP. Amber on this board means somebody should be doing this and
       is not — unhanded work, a no-show, somebody sick. A cleaner who is off was
       never coming, so their column is not a warning and must not wear the warning
       colour: slate, which reads as "not part of today" at ten feet. */
    --tv-off-bg: #151d2b;   --tv-off-fg: #94a3b8;
    background: var(--tv-bg); color: var(--tv-fg);
  }
  /* The app's own paper: same #f4f7fb ground, white cards, same urgency hues at
     the tints a light background needs to keep them legible. */
  body.tv.tvlight {
    --tv-bg: #f4f7fb;      --tv-fg: #0f172a;      --tv-muted: #5f7189;
    --tv-card: #ffffff;    --tv-line: #e7ecf3;    --tv-chip: #ffffff;
    --tv-bar: #e2e8f0;     --tv-empty: #94a3b8;   --tv-accent: #0284c7;
    --tv-dot: #cbd5e1;     --tv-job-bg: #eef3fa;  --tv-job-fg: #16324f;  --tv-job-ln: #94a9c9;
    --tv-early-bg: #fee2e2; --tv-early-fg: #991b1b; --tv-early-ln: #ef4444;
    --tv-done-bg: #dcfce7;  --tv-done-fg: #166534;  --tv-done-ln: #16a34a;
    --tv-area-bg: #f1f5f9;  --tv-area-fg: #475569;  --tv-area-ln: #64748b;
    --tv-cover-bg: #fef3c7; --tv-cover-fg: #92400e; --tv-cover-ln: #f59e0b;
    --tv-air-bg: #ede9fe;   --tv-air-fg: #4c1d95;   --tv-air-ln: #7c3aed;
    --tv-none-bg: #fff7ed;  --tv-none-fg: #b45309;
    --tv-out-bg: #fffbeb;   --tv-out-fg: #b45309;
    --tv-off-bg: #f1f5f9;   --tv-off-fg: #64748b;
  }
  body.tv.tvlight .tv-col { box-shadow: 0 0 0 1px var(--tv-line); }
  body.tv.tvlight .tv-chip { box-shadow: 0 0 0 1px var(--tv-line); }

  body.tv #app { min-height: 100vh; padding: 0; }
  ::-webkit-scrollbar { display: none; }
  /* height, not min-height: the page must fit the screen exactly. With min-height a
     tall board grew past the bottom of the television, where a TV crops rather than
     scrolls and the last row simply was not there. */
  .tv-wrap { height: 100vh; padding: 2.4vh 3vw; display: flex; flex-direction: column; gap: 1.4vh; overflow: hidden; }
  .tv-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; }
  .tv-brand { font-size: 1.5vw; font-weight: 800; letter-spacing: 0.18em; color: var(--tv-muted); }
  .tv-date { font-size: 3vw; font-weight: 800; line-height: 1.05; }
  .tv-clock { font-size: 5vw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .tv-stamp { font-size: 1.2vw; font-weight: 600; color: var(--tv-muted); text-align: right; margin-top: 0.4vh; }
  .tv-stale { color: #f59e0b; }

  /* Each number over its own word, so none of them can be read as part of the one
     next to it. This is the fix for "1 of 28 done", which nobody could parse. */
  .tv-progress { display: flex; align-items: flex-end; gap: 2.4vw; }
  .tv-tile { display: flex; flex-direction: column; align-items: center; }
  .tv-tile .n { font-size: 4.6vw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .tv-tile .cap { font-size: 1.05vw; font-weight: 800; letter-spacing: 0.12em; color: var(--tv-muted); margin-top: 0.3vh; white-space: nowrap; }
  .tv-bar { height: 1.1vh; border-radius: 1vh; background: var(--tv-bar); overflow: hidden; }
  .tv-bar > i { display: block; height: 100%; background: #22c55e; border-radius: 1vh; }

  /* Capped: the roll call may grow to a dozen people, and it was pushing the columns
     off the bottom of the screen. It gets a third of the height at most and the work
     keeps the rest. */
  /* NO CLIP. This capped the strip at 26vh and hid the overflow — the comment above
     says a strip "with two people quietly cut off answers who is still here? wrongly,
     which is worse than not asking", and the rule underneath it did precisely that:
     six people still here, four names on the wall, the last two gone over the edge
     with their badge-in times. It wraps and it shows everybody. The chips shrink a
     little when the crew is big, which is what keeps it off the round below. */
  .tv-crew { display: flex; flex-wrap: wrap; gap: 0.6vw; align-content: flex-start; }
  .tv-crew.many .tv-chip { font-size: 0.85vw; padding: 0.4vh 0.6vw; }
  .tv-crew.lots .tv-chip { font-size: 0.72vw; padding: 0.3vh 0.5vw; }
  /* Sized so a crew of a dozen lands in three rows. The cap below is a backstop
     against a much bigger crew, not the thing that is supposed to fire — a roll call
     with two people quietly cut off the bottom answers "who is still here?" wrongly,
     which is worse than not asking. */
  .tv-chip {
    font-size: 1.0vw; font-weight: 800; padding: 0.5vh 0.8vw; border-radius: 0.7vw;
    background: var(--tv-chip); border: 0.18vw solid transparent; letter-spacing: 0.02em;
  }
  .tv-crewhead { display: flex; gap: 1.4vw; align-items: baseline; }
  .tv-crewhead .on { font-size: 1.0vw; font-weight: 800; letter-spacing: 0.1em; color: #22c55e; }
  .tv-crewhead .off { font-size: 1.0vw; font-weight: 800; letter-spacing: 0.1em; color: var(--tv-muted); }
  .tv-crewhead .noscan { font-size: 1.0vw; font-weight: 800; letter-spacing: 0.1em; color: #fbbf24; }
  /* The people who are in but not on the round. Quieter than the roll call in every
     way - smaller, dimmer, no border - because it answers "who else is about?" and
     must never compete with the crew who actually have the morning. */
  .tv-also { display: flex; flex-wrap: wrap; gap: 0.4vw 0.9vw; align-items: baseline;
             margin-top: 0.5vh; opacity: 0.72; }
  .tv-also .lab { font-size: 0.8vw; font-weight: 800; letter-spacing: 0.1em; color: var(--tv-muted); }
  .tv-also .who { font-size: 0.85vw; font-weight: 700; color: var(--tv-ink); }
  .tv-also .at  { font-size: 0.8vw; font-weight: 700; color: var(--tv-muted);
                  font-variant-numeric: tabular-nums; margin-left: 0.25vw; }
  .tv-also .gone { opacity: 0.55; }
  .tv-with .tv-noscan { color: #fbbf24; font-weight: 800; }
  .tv-with .tv-atsm { font-weight: 800; opacity: 0.95; }
  .tv-note { font-size: 0.82vw; font-weight: 800; color: #fbbf24; letter-spacing: 0.02em;
             margin-top: 0.2vh; }
  .tv-chip.noscan { opacity: 0.92; }
  .tv-chip.gone { opacity: 0.5; }
  .tv-at.gone { color: var(--tv-muted); opacity: 0.9; }
  .tv-chip .st { font-size: 0.85vw; font-weight: 700; opacity: 0.85; margin-left: 0.5vw; font-variant-numeric: tabular-nums; }

  .tv-cols { --tvs: 1; flex: 1; display: grid; gap: calc(1.2vw * var(--tvs)); grid-auto-rows: minmax(0, 1fr); }
  /* overflow hidden as a backstop: type is sized to fit, but a freak name or a
     column with ten rooms in it must clip inside its own card rather than spill
     down the screen and take the row below with it. */
  .tv-col { background: var(--tv-card); border-radius: 1vw; padding: calc(1.4vh * var(--tvs)) calc(1vw * var(--tvs)); display: flex; flex-direction: column; gap: calc(0.8vh * var(--tvs)); min-width: 0; min-height: 0; overflow: hidden; }
  .tv-col-hd { border-bottom: 0.15vw solid var(--tv-line); padding-bottom: 0.9vh; }
  .tv-hd-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6vw; }
  /* Wraps rather than clips: a name cut off at the column edge is the same failure
     as a name cut to its first word, which is what this board just stopped doing. */
  .tv-who { font-size: calc(1.7vw * var(--tvs)); font-weight: 800; line-height: 1.12; min-width: 0; overflow-wrap: anywhere; }
  .tv-count { font-size: calc(1.3vw * var(--tvs)); font-weight: 800; color: var(--tv-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tv-with { font-size: calc(1vw * var(--tvs)); font-weight: 700; color: var(--tv-muted); margin-top: 0.35vh; overflow-wrap: anywhere; }
  .tv-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6vw; margin-top: 0.4vh; }
  /* "Team B · F…" is not a floor. The team-and-floors line was one nowrap line with an
     ellipsis, so on any card that also carries a "with <assistant>" name the floors —
     the thing the whole map exists to say — were the first characters to be dropped.
     It wraps to a second line now rather than losing the end of itself. */
  .tv-team { font-size: calc(1vw * var(--tvs)); font-weight: 800; letter-spacing: 0.06em; color: var(--tv-accent); overflow-wrap: anywhere; }
  .tv-at { font-size: calc(1vw * var(--tvs)); font-weight: 800; color: var(--tv-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tv-sub { font-size: calc(1.05vw * var(--tvs)); font-weight: 800; letter-spacing: 0.06em; margin-top: 0.4vh; }
  .tv-jobs { display: flex; flex-wrap: wrap; gap: calc(0.5vw * var(--tvs)); align-content: start; }
  .tv-job {
    font-size: calc(2vw * var(--tvs)); font-weight: 800; padding: calc(1vh * var(--tvs)) calc(1.1vw * var(--tvs)); border-radius: 0.6vw;
    background: var(--tv-job-bg); color: var(--tv-job-fg); border-left: 0.35vw solid var(--tv-job-ln);
  }
  /* Urgency reads as colour, and the order on screen is the instruction:
     early rooms red and at the front, done green, nobody-assigned amber. */
  .tv-job.early { background: var(--tv-early-bg); color: var(--tv-early-fg); border-left-color: var(--tv-early-ln); }
  .tv-job.done  { background: var(--tv-done-bg); color: var(--tv-done-fg); border-left-color: var(--tv-done-ln); text-decoration: line-through; text-decoration-thickness: 0.15vw; opacity: 0.75; }
  .tv-job.area  { background: var(--tv-area-bg); color: var(--tv-area-fg); border-left-color: var(--tv-area-ln); font-weight: 700; }
  /* Amber is the colour of work with no one behind it — whether it was never
     handed out, or the person it was handed to is off sick. Same colour either
     way, because from across the room they are the same problem. */
  .tv-job.cover { background: var(--tv-cover-bg); color: var(--tv-cover-fg); border-left-color: var(--tv-cover-ln); }
  /* Read across a room: the guest flats were a dim violet that lost to the blue rooms
     beside them at eight metres. Same hue, far more of it, and a thicker left edge so a
     run of them reads as one block rather than a scatter of chips. */
  .tv-job.air   { background: var(--tv-air-bg); color: var(--tv-air-fg);
                  border-left-color: var(--tv-air-ln); border-left-width: 0.9vw; font-weight: 800; }
  .tv-col.none { background: var(--tv-none-bg); }
  .tv-col.none .tv-who, .tv-col.none .tv-count { color: var(--tv-none-fg); }
  .tv-col.out { background: var(--tv-out-bg); }
  .tv-col.out .tv-who { color: var(--tv-out-fg); }
  /* After .out on purpose: somebody off is away, so they carry both classes. */
  .tv-col.off { background: var(--tv-off-bg); }
  .tv-col.off .tv-who, .tv-col.off .tv-count { color: var(--tv-off-fg); }
  /* THE MONTH, SIZED FOR A WALL. Same numbers the calendar tab shows — bar against the
     heaviest day in view, blue for laid out, grey for merely due, amber where work has
     nobody — at a size that reads from across the room instead of from a thumb. */
  /* SIX ROWS HAVE TO FIT, NOT FIVE. A month whose 1st falls late in the week needs six
     rows — August 2026 opens on a Saturday, so the 30th and 31st sit on a sixth — and
     with auto-sized rows the grid simply grew past the screen and .tv-wrap clipped the
     bottom of it. The end of the month is exactly the part somebody walks over to read.
     Equal rows, sized against what is left after the header, however many there are. */
  .tv-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr); gap: 0.5vw; flex: 1; min-height: 0; }
  .tv-cal-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.5vw; margin-bottom: 0.5vh; }
  .tv-cal-dow > div { text-align: center; font-size: 1vw; font-weight: 800; letter-spacing: 0.12em; color: var(--tv-muted); }
  .tv-cal-cell { background: var(--tv-card); border: 1px solid var(--tv-line); border-radius: 0.7vw;
    padding: 0.7vh 0.6vw; display: flex; flex-direction: column; justify-content: flex-start;
    gap: 0.4vh; min-width: 0; min-height: 0; overflow: hidden; }
  .tv-cal-cell.past { opacity: 0.42; }
  .tv-cal-cell.today { border-color: var(--tv-accent); border-width: 3px; }
  .tv-cal-cell.shown { background: var(--tv-chip); border-color: var(--tv-accent); border-width: 3px; }
  .tv-cal-cell.blank { background: none; border: none; }
  .tv-cal-n { font-size: 1.5vw; font-weight: 800; line-height: 1; }
  .tv-cal-bar { height: 0.8vh; background: var(--tv-bar); border-radius: 0.4vh; overflow: hidden; }
  .tv-cal-bar > div { height: 100%; }
  .tv-cal-sub { font-size: 0.95vw; font-weight: 800; }
  .tv-cal-key { font-size: 1vw; font-weight: 700; color: var(--tv-muted); margin-top: 0.8vh; }

  /* The separate job. Bigger cards than the board's chips because there are far
     fewer of them and each carries a deadline somebody has to act on. */
  .tv-air { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(20vw, 1fr));
            gap: 1.2vw; align-content: start; }
  .tv-aircard { background: var(--tv-card); border-radius: 1vw; padding: 1.6vh 1.4vw;
                border-left: 0.5vw solid var(--tv-cover-ln); min-width: 0; }
  .tv-aircard.done { border-left-color: var(--tv-done-ln); opacity: 0.72; }
  .tv-airunit { font-size: 3vw; font-weight: 800; line-height: 1; }
  .tv-aircard.done .tv-airunit { text-decoration: line-through; text-decoration-thickness: 0.15vw; color: var(--tv-done-fg); }
  .tv-airguest { font-size: 1.3vw; font-weight: 700; color: var(--tv-muted); margin-top: 0.6vh; overflow-wrap: anywhere; }
  .tv-airtime { font-size: 1.5vw; font-weight: 800; color: var(--tv-cover-fg); margin-top: 0.6vh; font-variant-numeric: tabular-nums; }
  .tv-airdone { font-size: 1.1vw; font-weight: 800; letter-spacing: 0.1em; color: var(--tv-done-fg); margin-top: 0.6vh; }

  .tv-group { font-size: calc(0.95vw * var(--tvs)); font-weight: 800; letter-spacing: 0.12em;
              color: var(--tv-muted); margin-top: calc(0.6vh * var(--tvs)); }
  .tv-empty { font-size: 1.4vw; font-weight: 700; color: var(--tv-empty); padding: 1vh 0; }
  /* WHAT THE REMOTE DOES, ON THE SCREEN THAT THE REMOTE DRIVES. The keys have worked
     since the day the pages went in and nothing ever said so, so the board read as a
     fixed picture and the month page might as well not have existed. Two axes, named,
     with the one you are on lit. */
  .tv-nav { display: flex; gap: 2.5vw; justify-content: center; align-items: center; flex-wrap: wrap; }
  .tv-navgrp { display: flex; gap: 0.7vw; align-items: center; }
  .tv-navk { font-size: 1.05vw; font-weight: 800; color: var(--tv-dot); letter-spacing: 0.1em; }
  .tv-navl { font-size: 1.05vw; font-weight: 800; letter-spacing: 0.1em; color: var(--tv-muted); }
  .tv-navl.on { color: var(--tv-accent); }
  .tv-pager { display: flex; gap: 0.6vw; justify-content: center; }
  .tv-dot { width: 0.8vw; height: 0.8vw; border-radius: 50%; background: var(--tv-dot); }
  .tv-dot.on { background: var(--tv-accent); }
</style>

// ============================================================

const DEFAULT_STAFF = [
  { id: 'p1', name: 'Sofia Reyes',   crew: 'Team A', color: '#0284c7', floors: [1, 2] },
  { id: 'p2', name: 'Daniel Chen',   crew: 'Team A', color: '#0284c7', floors: [3, 4] },
  { id: 'p3', name: 'Priya Shah',    crew: 'Team B', color: '#0284c7', floors: [5, 6] },

const DEFAULT_AREAS = [
  // Interior — ground/common
  { id: 'lobby', label: 'Main Lobby', freq: 'daily', kind: 'interior', assignedTo: null },

  { id: 'gym', label: 'Fitness Room', freq: 'daily', kind: 'interior', assignedTo: null },

};

  late:    { label: 'LATE', color: '#b45309' },
  noshow:  { label: 'NO-SHOW', color: '#dc2626' },
  sick:    { label: 'SICK', color: '#9333ea' },
  off:     { label: 'OFF', color: '#5b6a7f' },
};
const STATUS_ORDER = ['present', 'late', 'noshow', 'sick', 'off'];
// Didn't turn up for a shift they were expected on.
//
// OFF IS AWAY. It was deliberately left out — "that is the roster's business, and
// folding it in changes who the cover logic thinks is missing on days they were never
// due in" — and that reasoning only holds if something SETS off from the roster. Nothing
// does: `off` is reached one way, by a person tapping the status round to it, and it is
// the office saying THIS PERSON IS NOT IN TODAY. Outside this list that statement did
// nothing at all. Their rooms stayed on them, isAway said no, the board counted them as
// here, and their floor was never handed to anybody — so a leader marked OFF stood on
// the wall all morning holding five rooms nobody was going to clean.
//
// The rota (worksOn) still answers "is this a day they are due in"; this answers "are
// they here today", and off belongs on that side of the line.
const AWAY = ['noshow', 'sick', 'off'];
const isAway = (pid) => AWAY.includes(state.attendance[pid] || 'present');

// Areas live in state (editable). Helpers to read them:
// Alphabetical, like the teams and the staff. Areas were kept in the order they were
// typed in, so removing one and adding it back sent it to the bottom of every list it
// appears in and there was no way to get the order back except retyping the lot.
const byLabel = (a, b) => String(a.label).localeCompare(String(b.label), undefined, { numeric: true, sensitivity: 'base' });
function areasInterior() { return (state.areas || []).filter(a => a.kind === 'interior' && oneOffLive(a)).sort(byLabel); }
function areasExterior() { return (state.areas || []).filter(a => a.kind === 'exterior').sort(byLabel); }

// --- Communal areas as work --------------------------------------------------
// The interior areas are a job somebody has to be given, the same as a room. They
// were only ever visible on the Floors & Common Areas checklist, which is not where
// the morning is allocated, so nobody was ever handed the corridors.
// An area stays outstanding until it's ticked off for its current period: daily
// areas come back each day, weekly each week, monthly each month.
const areaDoneKey = (a) => a.id + '::' + freqKey(a.freq);
const areaDone = (a) => !!state.completions[areaDoneKey(a)];
// History holds areas next to rooms. The 'area:' prefix keeps an area's id from ever
// colliding with a room's, and tells History to print the name plainly.
const areaLogId = (a) => 'area:' + a.id;
const areaAsUnit = (a) => ({ id: areaLogId(a), unit: a.label });
const isAreaLog = (unitId) => String(unitId || '').startsWith('area:');
const areasOutstanding = () => areasInterior().filter(a => !areaDone(a));
// Outstanding first — what's left to do is what the morning is about.
const areasByOpenFirst = () => areasInterior().slice().sort((a, b) => (areaDone(a) ? 1 : 0) - (areaDone(b) ? 1 : 0));
let _areaCtlOpen = null;   // which area's change/remove controls are showing (one at a time)
let _areaAddOpen = false;  // the add form stays folded away until it's wanted
// The cleaning crew = staff tagged as cleaners. Until anyone is tagged, fall
// back to everyone so cleaning screens are never empty after a Hik import.
// ALWAYS ALPHABETICAL, ALWAYS A COPY. The crew came out in whatever order people
// were added, so the same list read differently on every screen and a rehired cleaner
// sat at the bottom of it. The copy matters too: callers sort this, and sorting the
// live array would quietly reorder state.staff itself.
function cleaningStaff() {
  const tagged = (state.staff || []).filter((p) => p.isCleaner);
  return (tagged.length ? tagged : (state.staff || []).slice())

}
// WHO IS IN THE ROOM HAND-OUT. "Rooms by hand only" (noAuto) already keeps somebody

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const saved = JSON.parse(raw);
      state = { ...state, ...saved, tab: 'board' };
      if (state.coverageDay !== todayKey()) { state.coverage = {}; state.unitCover = {}; state.pendingCover = null; state.coverageDay = todayKey(); }
    }
  } catch (e) {}
  finalizeState();

// Save = write the local cache instantly, then push to the shared server.

// can never be left stranded on one phone (see DIRTY FLAG below).
// ============================================================
// THREE KINDS OF STATE, NOT ONE
// ============================================================
// The whole app travels as a single blob and the last writer wins, so every field in it
// is a race. Rooms, plans, areas, ticks and the roster are defended in applyRemote by
// the moment they were touched. Everything else was not, and it split cleanly in two
// when it was actually listed out.

// group you have open, which cleaner's card you are editing — twenty-odd fields that
// describe one person's phone and nothing about the building. They were being pushed to
// the server and pulled down onto the wall, so a tap on a phone re-rendered the TV, and
// every one of them was another reason for a stale copy to be sent. They stay local now:
// stripped on the way out, ignored on the way in.

// are on the roll call, how many early rooms each. A stale phone could put any of them

  // stalest copy in the building, and the whole state travels as one blob, so a
  // single push from the TV overwrites everything the crew and the office have done

// ============================================================
// SHARED SERVER SYNC (Supabase)

// pulls it on open, pushes on every change, and gets live updates.
// NOTE (concurrency): this is document-level "last write wins". If two
// people save within the same ~second, one change can be overwritten.
// Fine for a small crew; if that becomes a problem the high-write pieces
// (attendance, completions) should move to their own rows — see SETUP.md.
//
// DURABILITY: a save is not finished until the server confirms it. Until then
// the device is "dirty": it retries, it flushes before the page is hidden or
// closed, it re-pushes on the next open, and it refuses to let a server copy
// overwrite the change it has not managed to send yet. Without this, a tap
// followed by locking the phone lost the change silently — it stayed in

// in" and not "is the network up" — whether these rooms and these people were ever

// pushNow(). Deliberately NOT persisted: a fresh page load has not synced yet, and
// that is precisely the window this exists to cover.
