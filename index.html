  const inU = el(`<input id="newUnit" placeholder="Unit (e.g. 906)" style="flex:1;min-width:0">`);
  const inG = el(`<input id="newGuest" placeholder="${opts.guestPlaceholder || 'Guest name (optional)'}" style="flex:1.4;min-width:0">`);
  rowU.appendChild(inU); rowU.appendChild(inG); form.appendChild(rowU);

  // Optional checkout / target-time field
  let inT = null;
  if (opts.showTime) {
    const rowT = el(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"></div>`);
    rowT.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:600;white-space:nowrap">${opts.timeLabel || 'Checkout time'}</div>`));
    inT = el(`<input id="newTime" type="time" style="flex:1;min-width:0;background:#16233a;color:#eaf1fb;border:1px solid #3d557f;border-radius:8px;padding:7px 10px">`);
    rowT.appendChild(inT); form.appendChild(rowT);
  }

  // Type picker (colour-coded) — only when more than one type is offered
  if (types.length > 1) {
    const typeRow = el(`<div style="display:flex;gap:6px;margin-bottom:8px"></div>`);
    const typeBtns = {};
    types.forEach(tk => {
      const t = UNIT_TYPES[tk];
      const on = tk === chosenType;
      const b = el(`<button class="freqpick ${on ? 'on' : ''}" style="${on ? `background:${t.color};border-color:${t.color};color:#ffffff` : ''}">${t.label}</button>`);
      b.onclick = () => {
        chosenType = tk;
        Object.values(typeBtns).forEach(x => { x.classList.remove('on'); x.style.background = ''; x.style.borderColor = ''; x.style.color = ''; });
        b.classList.add('on'); b.style.background = t.color; b.style.borderColor = t.color; b.style.color = '#f4f7fb';
      };
      typeBtns[tk] = b; typeRow.appendChild(b);
    });
    form.appendChild(typeRow);
  }

  const freqRow = el(`<div style="display:flex;gap:6px;margin-bottom:10px"></div>`);
  let chosenFreq = 'daily';
  const freqBtns = {};
  ['nightly','daily','eod','weekly'].forEach(fk => {
    const b = el(`<button class="freqpick ${fk==='daily'?'on':''}" data-f="${fk}">${FREQ_LABEL[fk]}</button>`);
    b.onclick = () => { chosenFreq = fk; Object.values(freqBtns).forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    freqBtns[fk] = b; freqRow.appendChild(b);
  });
  form.appendChild(freqRow);

  const addBtn = el(`<button class="add-btn">+ Add unit</button>`);
  addBtn.onclick = () => {
    const u = document.getElementById('newUnit').value;
    const g = document.getElementById('newGuest').value;
    const tm = inT ? inT.value : '';
    if (!u.trim()) { document.getElementById('newUnit').focus(); return; }
    addServicedUnit(u, g, chosenFreq, chosenType, tm);
  };
  form.appendChild(addBtn);
  return form;
}

// ============================================================
// SEARCH — one box for the whole app
// ============================================================
// You could not look anything up without first knowing where it lived: which of the
// four room tabs a unit was filed under, whether "Lift lobby" was a communal area or
// an exterior one, whether a name was on Team or Settings. This searches all of it
// at once and takes you to the thing, with the term already applied when you land.
let _search = null;      // null | { q }
let _roomSeek = null;    // term to seed the room list's own filter with on arrival
function openSearch() { _search = { q: '' }; render(); }
function closeSearch() { _search = null; render(); }

function searchHits(q) {
  const t = String(q || '').trim().toLowerCase();
  if (t.length < 1) return [];
  const out = [];
  (state.servicedUnits || []).forEach((u) => {
    const hay = [u.unit, u.guest, u.note].filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(t)) return;
    const kind = UNIT_TYPES[unitType(u)] ? UNIT_TYPES[unitType(u)].label : 'Room';
    out.push({
      group: 'ROOM',
      kind: kind.toUpperCase(),
      main: 'Unit ' + u.unit,
      sub: [u.guest, schedLabel(u), u.paused ? 'paused' : ''].filter(Boolean).join(' · '),
      go: () => { _roomSeek = u.unit; _search = null; setTab({ office: 'offices', building: 'buildings', airbnb: 'airbnb' }[unitType(u)] || 'rooms'); },
    });
  });
  (state.areas || []).forEach((a) => {
    if (!String(a.label || '').toLowerCase().includes(t)) return;
    out.push({
      group: 'AREA',
      kind: a.kind === 'exterior' ? 'EXTERIOR' : 'COMMUNAL',
      main: a.label,
      sub: (FREQ_LABEL[a.freq] || a.freq || 'daily') + (areaDone(a) ? ' · done' : ' · outstanding'),
      go: () => { _search = null; setTab(a.kind === 'exterior' ? 'exterior' : 'building'); },
    });
  });
  (state.staff || []).forEach((p) => {
    if (!String(p.name || '').toLowerCase().includes(t)) return;
    out.push({
      group: 'PERSON',
      kind: p.isCleaner ? (p.isLeader ? 'LEADER' : 'CLEANER') : 'STAFF',
      main: p.name,
      sub: [p.crew, (p.floors || []).length ? 'Floors ' + p.floors.join(', ') : 'no floors'].filter(Boolean).join(' · '),
      go: () => { _search = null; setTab('team'); },
    });
  });
  // Alphabetical inside each kind, so the same search always reads the same way.
  const byMain = (a, b) => String(a.main).localeCompare(String(b.main), undefined, { numeric: true, sensitivity: 'base' });
  const KIND_ORDER = ['ROOM', 'AREA', 'PERSON'];
  return out.sort((a, b) => (KIND_ORDER.indexOf(a.group) - KIND_ORDER.indexOf(b.group)) || byMain(a, b));
}

function searchSheet() {
  const bg = el('<div class="sheet-bg"></div>');
  bg.onclick = (e) => { if (e.target === bg) closeSearch(); };
  const sheet = el('<div class="sheet"></div>');
  const head = el('<div class="sheet-head"></div>');
  const row = el('<div style="display:flex;gap:8px;align-items:center"></div>');
  const box = el(`<input type="search" placeholder="Room, guest, area or person…" `
    + `style="flex:1;min-width:0;background:#16233a;color:#eaf1fb;border:1px solid #3d557f;`
    + `border-radius:10px;padding:11px 13px;font-size:16px">`);
  box.value = _search.q;
  const cancel = el('<button class="tb-btn">Close</button>');
  cancel.onclick = closeSearch;
  row.appendChild(box); row.appendChild(cancel);
  head.appendChild(row);
  sheet.appendChild(head);
  const body = el('<div class="sheet-body"></div>');
  sheet.appendChild(body);

  const draw = () => {
    body.innerHTML = '';
    const q = box.value;
    if (!q.trim()) {
      body.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">`
        + `Type a unit number, a guest, an area or a name.</div>`));
      return;
    }
    const hits = searchHits(q);
    if (!hits.length) {
      body.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">Nothing matches “${esc(q.trim())}”.</div>`));
      return;
    }
    body.appendChild(el(`<div class="section-label">${hits.length} match${hits.length === 1 ? '' : 'es'}</div>`));
    hits.slice(0, 40).forEach((h) => {
      const r = el('<div class="sr-row"></div>');
      const mid = el('<div style="flex:1;min-width:0"></div>');
      mid.appendChild(el(`<div class="sr-main">${esc(h.main)}</div>`));
      if (h.sub) mid.appendChild(el(`<div class="sr-sub">${esc(h.sub)}</div>`));
      r.appendChild(mid);
      r.appendChild(el(`<div class="sr-kind">${esc(h.kind)}</div>`));
      r.appendChild(el(`<div style="color:#5b6a7f;font-size:18px">›</div>`));
      r.onclick = h.go;
      body.appendChild(r);
    });
    if (hits.length > 40) body.appendChild(el(`<div class="sr-sub" style="text-align:center;padding:8px 0">`
      + `${hits.length - 40} more — keep typing to narrow it.</div>`));
  };
  // Redrawing only the results keeps the cursor and the keyboard where they are.
  box.oninput = () => { _search.q = box.value; draw(); };
  draw();
  bg.appendChild(sheet);
  setTimeout(() => box.focus(), 30);
  return bg;
}

// Render the type-grouped card list for the given type keys.
function unitGroups(wrap, typeKeys, emptyMsg) {
  const units = state.servicedUnits.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const relevant = units.filter(u => typeKeys.includes(unitType(u)));
  if (!relevant.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:30px 0">${emptyMsg || 'No units yet — add one above.'}</div>`));
    return;
  }

  // FIND A ROOM BY TYPING ITS NUMBER. These tabs are the reference list — you come
  // here to look one room up, and with sixty-six of them that meant scrolling. The
  // filter runs over the cards already on screen rather than re-drawing the page,
  // so the box keeps the cursor while you type.
  const rows = [];
  let q = '', freqPick = '';
  const search = el(`<input type="search" placeholder="Search a room, guest or note…" `
    + `style="width:100%;margin:6px 0 6px;background:#16233a;color:#eaf1fb;border:1px solid #3d557f;`
    + `border-radius:10px;padding:11px 13px;font-size:15px">`);
  // FILTER BY HOW OFTEN IT IS CLEANED. "Which rooms are weekly?" and "what is still
  // on a frequency rather than fixed days?" are the two questions this list is read
  // for, and both meant opening rooms one at a time to find out.
  const FREQ_FILTERS = [['', 'All'], ['pinned', 'On set days'], ['nightly', 'Nightly'], ['daily', 'Daily'],
    ['eod', 'Every other day'], ['weekly', 'Weekly'], ['monthly', 'Monthly']];
  const freqRow = el(`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px"></div>`);
  const freqBtns = {};
  const hits = el(`<div style="font-size:11px;color:#5f7189;font-weight:600;min-height:15px;margin-bottom:6px"></div>`);
  const apply = () => {
    let shown = 0;
    rows.forEach((g) => {
      let n = 0;
      g.cards.forEach(({ card, hay, freq, pinned }) => {
        const okText = !q || hay.includes(q);
        const okFreq = !freqPick || (freqPick === 'pinned' ? pinned : (!pinned && freq === freqPick));
        const on = okText && okFreq;
        card.style.display = on ? '' : 'none';
        if (on) n += 1;
      });
      g.head.style.display = n ? '' : 'none';
      g.count.textContent = (q || freqPick) ? n + ' of ' + g.cards.length : String(g.cards.length);
      shown += n;
    });
    Object.keys(freqBtns).forEach((k) => freqBtns[k].classList.toggle('on', k === freqPick));
    // A frequency with nothing in it is worth saying — it is usually the answer to
    // "why is nothing weekly?" (because every room got pinned to set days instead).
    if (!q && freqPick) {
      const lbl = (FREQ_FILTERS.find(([k]) => k === freqPick) || ['', ''])[1];
      hits.style.color = shown ? '#5f7189' : '#b45309';
      hits.textContent = shown ? shown + ' ' + lbl.toLowerCase() : 'No rooms are set to ' + lbl.toLowerCase() + '.';
      return;
    }
    hits.textContent = '';
    hits.style.color = '#5f7189';
    if (!q) return;
    const shownNow = shown;
    if (shownNow) { hits.textContent = shownNow + ' match' + (shownNow === 1 ? '' : 'es'); return; }
    // NOTHING HERE — BUT IS IT ON ANOTHER TAB? Rooms are split across Offices,
    // Buildings and Airbnb by type, and each tab only ever searched its own. Look for
    // 605 on Offices when it is filed as a building room and the answer was a blank
    // screen, which reads as "the room is gone" rather than "you are on the wrong tab".
    const TAB_OF = { office: 'offices', building: 'buildings', airbnb: 'airbnb' };
    const elsewhere = (state.servicedUnits || []).filter((u) =>
      !typeKeys.includes(unitType(u))
      && [u.unit, u.guest, u.note].filter(Boolean).join(' ').toLowerCase().includes(q));
    if (!elsewhere.length) { hits.textContent = 'No room matches “' + search.value.trim() + '”.'; return; }
    hits.style.color = '#b45309';
    const first = elsewhere[0];
    const tabName = UNIT_TYPES[unitType(first)].label;
    hits.textContent = elsewhere.length === 1
      ? 'Unit ' + first.unit + ' is filed as a ' + tabName + ' room — it is on the ' + tabName + ' tab.'
      : elsewhere.length + ' matching rooms are on other tabs (' + [...new Set(elsewhere.map((u) => UNIT_TYPES[unitType(u)].label))].join(', ') + ').';
    const go = el(`<button class="freqmini" style="margin-left:8px;padding:4px 10px;font-size:11px">`
      + `Go to ${esc(tabName)} →</button>`);
    go.onclick = () => setTab(TAB_OF[unitType(first)] || 'rooms');
    hits.appendChild(go);
  };
  // Arriving from the global search: land with the term already in the box and the
  // list already narrowed, rather than on the right tab and none the wiser.
  if (_roomSeek) {
    search.value = _roomSeek; q = String(_roomSeek).trim().toLowerCase(); _roomSeek = null;
    // A hit inside a folded group is a hit nobody can see. Only this view's own
    // groups are opened — the room list's drop-downs keep however they were left.
    Object.keys(state.shutGroups || {}).forEach((k) => {
      if (k.indexOf('rooms:') !== 0) delete state.shutGroups[k];
    });
  }
  search.oninput = () => { q = search.value.trim().toLowerCase(); apply(); };
  FREQ_FILTERS.forEach(([key, label]) => {
    const b = el(`<button class="freqmini${key === '' ? ' on' : ''}" style="flex:0 0 auto;padding:6px 10px;font-size:11px">${esc(label)}</button>`);
    b.onclick = () => { freqPick = (freqPick === key) ? '' : key; apply(); };
    freqBtns[key] = b;
    freqRow.appendChild(b);
  });
  // ABOVE EVERYTHING, INCLUDING THE ADD FORM. Appended in place it landed under a
  // full "add a unit" form, so finding a room meant scrolling past the thing you use
  // once a month to reach the thing you use every day — and it read as missing.
  const stick = el('<div class="stickbar"></div>');
  stick.appendChild(search); stick.appendChild(freqRow); stick.appendChild(hits);
  wrap.insertBefore(stick, wrap.firstChild);

  typeKeys.forEach(tk => {
    const t = UNIT_TYPES[tk];
    // UNIT ORDER, PLAINLY. This is the reference list, not a round to be worked, so
    // it reads 101, 102, 103 — an early or priority room jumping the queue here is
    // just a room you cannot find. The working order lives on the roll call and the
    // plan, which is where the order is an instruction.
    const group = relevant.filter(u => unitType(u) === tk)
      .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
    if (!group.length) return;
    // A GROUP YOU CAN SHUT. Scrolling past forty building units to reach the four
    // offices underneath is the whole complaint about this list; tapping the heading
    // folds it away, and which ones are folded is remembered.
    const shut = !!(state.shutGroups || {})[tk];
    const head = el(`<div class="crew-head grp-head" style="margin-top:18px"></div>`);
    head.appendChild(el(`<div class="grp-caret">${shut ? '▸' : '▾'}</div>`));
    head.appendChild(el(`<div class="crew-dot" style="background:${t.color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${t.label}</div>`));
    const count = el(`<div class="crew-sub">${group.length}${shut ? ' · hidden' : ''}</div>`);
    head.appendChild(count);
    head.onclick = () => {
      state.shutGroups = state.shutGroups || {};
      if (state.shutGroups[tk]) delete state.shutGroups[tk]; else state.shutGroups[tk] = true;
      save(); render();
    };
    wrap.appendChild(head);
    if (shut) { rows.push({ head, count, cards: [] }); return; }
    const cards = group.map((u) => {
      const card = servicedCard(u, onTodaysList(u));
      wrap.appendChild(card);
      return { card, freq: u.freq || 'daily', pinned: !!fixedDays(u),
        hay: [u.unit, u.guest, u.note, u.time].filter(Boolean).join(' ').toLowerCase() };
    });
    rows.push({ head, count, cards });
  });
  if (q || freqPick) apply();
}

  wrap.appendChild(addUnitForm({ types: ['building'], defaultType: 'building', title: 'Add a building unit' }));
  unitGroups(wrap, ['building'], 'No building units yet. Add your first above.');

// "More" menu — the less-used tabs live here so the bottom bar stays clean.
// ============================================================
// PLAN A DAY — build tomorrow's job list, then fill it with whoever badges in.
// ============================================================
let planDay = null;   // selected day in the Plan view (null => tomorrow)
// The day's jobs are what this tab is for, and the whole list has to fit on a screen
// so it can be screenshotted and sent to the crew. Everything else — the week chart,
// the pool of jobs to add, rebuilding — sits behind this.
let planMore = false;
// Anchored to the work day, not the clock day: at 00:20 the crew is still on the
// round that started last night, so "tomorrow" must not skip a day under them.
const tomorrowKey = () => shiftDay(workToday(), 1);
// OPENS ON THE DAY THE ROLL CALL IS SHOWING. It opened on tomorrow, so tapping Plan
// from the morning board landed you on a different day's rooms with a warning that
// these are not today's — two screens about the same building that never agreed.
// Tomorrow is one tap along, and the button under the picker plans it.
function curPlanDay() { return planDay || workToday(); }
// Tomorrow's list, computed from the schedule instead of typed in by hand. Rooms
// come from their own cycle (daily / every other day / weekly), interior areas
// from whether their period is still outstanding. Overdue work is carried in and
// flagged rather than quietly dropped.
function suggestedJobsFor(day) {
  const out = [];
  // TODAY'S PLAN IS TODAY'S WORK, INCLUDING WHAT IS ALREADY DONE. The roll call keeps
  // a cleaned room on the list with a tick so the morning does not shrink as the crew
  // work through it; the plan dropped it the moment it stopped being due. Same day,
  // same building, two different lists and two different totals — 22 rooms on one
  // screen and 13 on the other. A room cleaned today belongs on today's plan, ticked.
  const isToday = day === workToday();
  (state.servicedUnits || []).forEach(u => {
    if (!dueOnDay(u, day) && !(isToday && cleanedToday(u))) return;
    const due = lastCleanDate(u) ? nextDueDate(u) : null;
    out.push({
      kind: 'unit', id: u.id, label: 'Unit ' + u.unit,
      group: UNIT_TYPES[unitType(u)].label,
      why: !due ? 'No record yet' : (due < day ? 'Overdue since ' + due : schedLabel(u)),
      late: !!due && due < day,
    });
  });
  areasInterior().forEach(a => {
    if (state.completions[a.id + '::' + freqKeyOn(a.freq, day)]) return;
    out.push({ kind: 'area', id: a.id, label: a.label, group: 'Interior areas',
               why: FREQ_LABEL[a.freq] || (FREQ[a.freq] || {}).label || '', late: false });
  });
  return out;
}
// What the office plans and looks ahead at, as opposed to what gets cleaned. Kinds
// of room switched off in "Roll Call covers" are run as their own operation on their
// own tab — Airbnb is cleaned by its own pair after the offices — so planning them
// here is noise. Tonight's round deliberately does NOT use this: the night's work is
// the night's work, whatever the morning is organised around.
function planningJobsFor(day) {
  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const jobs = suggestedJobsFor(day).filter((j) => j.kind !== 'unit' || onRollCall(unitById[j.id]));
  // For a day still to come, take the rooms the schedule will actually have reached
  // by then rather than everything outstanding now — otherwise every-other-day rooms
  // land on all seven days and each day reads as the same full list.
  const dueIds = projectedDueIdsOn(day);
  if (!dueIds) return jobs;
  return jobs.filter((j) => j.kind !== 'unit' || dueIds.has(j.id));
}
// Fill a day's plan from the schedule. Additive: anything already on the plan
// keeps its assignee, so seeding can never wipe a hand-made list.
function applySuggestions(day, jobs) {
  const plan = getPlan(day);
  // A ROOM TAKEN OFF A DAY STAYS OFF IT. togglePlanJob writes a headstone for exactly
  // this reason — "taking a job off a day is a decision, and it has to outlast the next
  // re-sync" — and resyncPlanDay honours it. This, the other half of the same idea,
  // never asked: so trimming a light Friday down to the rooms you actually mean to
  // clean, and then rebuilding the day, put every one of them straight back. Same
  // intent, two implementations, one of them forgot.
  const dropped = droppedFor(day);
  let added = 0;
  jobs.forEach(s => {
    const k = planKey(s.kind, s.id);
    if (plan[k] || (dropped && dropped[k])) return;
    // `auto` records that the schedule put this here, not a person. Only an
    // auto-placed job may be taken away again without asking.
    plan[k] = { kind: s.kind, refId: s.id, label: s.label, assignedTo: null, auto: true };
    added++;
  });
  return added;
}
// Lay a future day out by itself: who is rostered on, what is due, and an even split
// between them. Nobody has badged in for a day that hasn't happened, so this reads
// the rota where the morning reads the door — otherwise the rules are the same ones:
// the times customers asked for come first and get spread, then load, then don't give
// somebody the room they cleaned last time, and finally even out whatever is lopsided.
//
// Communal areas are left alone on purpose, as auto-assign leaves them alone: an area
// is a walk of the building rather than a room on a count, and who does it is a call
// for the morning.
function autoPlanDay(day) {
  const plan = getPlan(day);
  // Marked sick or off is a statement about today, so it only overrides the rota
  // for today — a rota says who is expected next Thursday, not who is ill now.
  // ROOMS GO TO LEADERS. NOTHING TO THE ASSISTANTS. The morning hand-out has refused
  // them for a while — an assistant works the leader's round WITH them, so a room dealt
  // to an assistant means two people answering for the same flat — and the carry onto
  // the board refuses them too. This, the pass that lays the day out in the first place,
  // did not know: it dealt to every cleaner rostered on, and five of tomorrow's
  // seventeen rooms went to assistants who would then be refused at the carry. Those
  // rooms did not go to somebody else — they silently fell out of the plan and nobody
  // was told, on a building where the automatic hand-out is switched off and nothing
  // was coming to pick them up.
  //
  // NO FALLBACK HERE, deliberately, unlike the morning. Naming an assistant on a plan
  // produces work that cannot be carried, which is worse than naming nobody: a room
  // left unassigned at least sits in NOBODY YET where it can be seen and given out.
  const crew = cleaningStaff().filter((p) => takesRooms(p) && p.isLeader
      && worksOnDay(p, day) && !(day === todayKey() && isAway(p.id)))
    .slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (!crew.length) return { assigned: 0, crew: 0, reason: 'nobody is rostered on' };
  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const keys = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && unitById[plan[k].refId]
    && !neverAutoDealt(unitById[plan[k].refId]));   // a flat is still ON the day, just not dealt
  if (!keys.length) return { assigned: 0, crew: crew.length, reason: 'nothing on the plan' };

  const order = crew.map((p) => p.id);
  const staffById = {};
  crew.forEach((p) => { staffById[p.id] = p; });
  const load = {}, slotLoad = { early: {}, late: {} };
  order.forEach((id) => { load[id] = 0; slotLoad.early[id] = 0; slotLoad.late[id] = 0; });
  const roomOf = (k) => unitById[plan[k].refId];
  // The same leader rules the morning hand-out works to — a plan that ignored them
  // would simply hand the breach to the morning to discover.
  const LEADER_ROOMS = 4, LEADER_EARLY = 2;
  const isLeader = (id) => !!(staffById[id] && staffById[id].isLeader);
  const underCap = (id) => (load[id] || 0) < (isLeader(id) ? LEADER_ROOMS : Infinity);
  // THE MORNING ROUND IS CAPPED HERE TOO, or the cap does not exist. The morning
  // hand-out honours the plan — a planned room goes to the person the plan names —
  // so a plan that piled four asked-for rooms on one cleaner handed that straight
  // through, cap and all. Which is what happened: the plan gave Mahad Abdi two pinned
  // morning rooms plus two more, and the morning dealt it out exactly as written.
  const EARLY_CAP = earlyCap();
  const overEarly = (u, id) => timeSlot(u) === 'early' && (slotLoad.early[id] || 0) >= EARLY_CAP;
  const ableFor = (u) => {
    const all = order.filter((id) => canCleanUnit(staffById[id], u) && !overEarly(u, id));
    const spare = all.filter(underCap);
    return spare.length ? spare : all;
  };
  const repeats = (id, u) => (u.lastCleanedBy && id === u.lastCleanedBy) ? 1 : 0;

  // A ROOM SOMEBODY PUT ON A PERSON BY HAND SURVIVES A REBUILD. "Rebuild this day from
  // the schedule" exists to re-cut which ROOMS fall on a day, but it re-dealt the
  // cleaners too, so one tap undid an evening's arranging — the last remaining way to
  // lose a day that had already been settled. The schedule has an opinion about which
  // rooms are due; it has none about who they belong to once a person has said.
  // Machine picks still clear and are dealt again, so a rebuild does what it says.
  // …UNLESS THE ROTA SAYS THEY ARE NOT IN THAT DAY. A hand-made assignment is a
  // decision about a PERSON doing a job on a DAY, and the rota can make it untrue after
  // the fact: put 503 on Mahamed Nur while he is down for Fridays, then take his team
  // off Fridays, and it stops being a decision — it is a room with a name on it that
  // nobody is coming to clean, and no rebuild would shift it because a rebuild is
  // exactly what protects it.
  //
  // The morning hand-out has always taken this view of somebody marked away — "a room
  // held for somebody who has been marked AWAY is not a decision any more, it is a gap:
  // nobody is coming to clean it" — and a rota saying they are not in is the same
  // statement made in advance. staffById holds the crew rostered on THIS day, so this
  // is the same question, asked of the same list the deal is about to use.
  keys.forEach((k) => {
    if (plan[k].byHand && plan[k].assignedTo && staffById[plan[k].assignedTo]) return;
    plan[k].assignedTo = null;
  });
  // Hand-held rooms are counted before anything is dealt, or the deal hands somebody a
  // full round on top of the rooms they are already holding.
  keys.forEach((k) => {
    const who = plan[k].byHand && plan[k].assignedTo;
    if (!who || !(who in load)) return;
    load[who] += 1;
    const sl = timeSlot(roomOf(k));
    if (sl !== 'any') slotLoad[sl][who] += 1;
  });
  // ROOMS TIED TO ONE CLEANER FIRST, so their pins count towards the round before any
  // ordinary morning room is dealt. Otherwise somebody with two pinned early rooms is
  // dealt a full round on top of them and starts the day holding four.
  keys.forEach((k) => {
    const u = roomOf(k);
    if (!u || !u.usualTo || plan[k].assignedTo) return;
    if (!staffById[u.usualTo] || !canCleanUnit(staffById[u.usualTo], u)) return;
    plan[k].assignedTo = u.usualTo;
    load[u.usualTo] += 1;
    const sl = timeSlot(u);
    if (sl !== 'any') slotLoad[sl][u.usualTo] += 1;
  });
  const deal = (slot) => {
    keys.filter((k) => !plan[k].assignedTo && (slot ? timeSlot(roomOf(k)) === slot : true)).forEach((k) => {
      const u = roomOf(k);
      const owed = (id) => (slot === 'early' && isLeader(id) && slotLoad.early[id] < LEADER_EARLY) ? 0 : 1;
      const pick = ableFor(u).slice().sort((a, b) =>
        (owed(a) - owed(b))
        || (slot ? slotLoad[slot][a] - slotLoad[slot][b] : 0)
        || (load[a] - load[b])
        || (repeats(a, u) - repeats(b, u))
        || (order.indexOf(a) - order.indexOf(b)))[0];
      if (!pick) return;                               // nobody rostered on is cleared for it
      plan[k].assignedTo = pick; load[pick] += 1;
      if (slot) slotLoad[slot][pick] += 1;
    });
  };
  // THE FLOOR COMES BEFORE THE COUNT. This laid the day out on load alone — pins, then
  // whoever was carrying least — and never once asked whose floor a room was on. The
  // morning hand-out has had a floor pass for a long time, but it is switched off on
  // this building, so the floor map decided nothing at all: across a whole week of
  // plans, six rooms out of a hundred and eight landed with the person who owns their
  // floor. Restoring the map changed nothing, because the stage that decides the day
  // was not reading it.
  //
  // A room goes to the owner of its floor if they are rostered on and under their round.
  // Everything the load pass does happens after, on what is left.
  let onFloor = 0, offFloor = 0;
  keys.forEach((k) => {
    if (plan[k].assignedTo) return;
    const u = roomOf(k);
    if (!u) return;
    const owner = ownerOfFloor(floorOfUnit(u.unit));
    if (!owner || !staffById[owner.id]) return;                 // not rostered on today
    if (!canCleanUnit(owner, u) || !underCap(owner.id)) return;
    const sl = timeSlot(u);
    if (sl === 'early' && slotLoad.early[owner.id] >= EARLY_CAP) return;
    plan[k].assignedTo = owner.id; load[owner.id] += 1; onFloor += 1;
    if (sl !== 'any') slotLoad[sl][owner.id] += 1;
  });
  deal('early'); deal('late'); deal(null);
  // COMMUNAL AREAS STAY IN THE NOBODY BOX. They were dealt out here for a while,
  // because leaving them for the morning had meant nobody was named on them and they
  // got missed. Handing them out automatically fixed the wrong half of that: an area
  // is a walk of the building, and who walks it depends on who is actually in and what
  // the morning looks like — so the app was making a call the office wanted to make.
  // Worse, an area counted towards a load, which quietly pushed rooms off their floor
  // to compensate for a lobby nobody had agreed to yet.
  //
  // They are laid out on the day, unassigned, and picked up from the nobody box. The
  // missed-area problem is a visibility one and belongs on the board, not here.
  const areaKeys = Object.keys(plan).filter((k) => plan[k].kind !== 'unit');
  // An area the office put on somebody by hand (byHand, set in setPlanAssignee) is a
  // decision and stays exactly where it was put. Only the machine's own picks clear.
  // Same for a communal walk put on somebody by hand: it is theirs until the rota says
  // they are not in, and then it is nobody's and belongs back in the box.
  areaKeys.forEach((k) => {
    if (!plan[k].byHand || !staffById[plan[k].assignedTo]) plan[k].assignedTo = null;
  });

  // Even it out, exactly as the morning does. A room the customer asked a time for
  // stays where it is; that was their decision, not a balancing one.
  //
  // AND A PERMANENT CLEANER IS ABSOLUTE HERE TOO. The morning's levelling has excluded
  // pinned rooms for a long time — "rooms are pinned deliberately, so the same person
  // has the same rooms and knows them" — and this one tested the time slot and nothing
  // else, so it levelled straight through a pin. 705 is tied to Mahamed Nur Hassan and
  // tomorrow's plan handed it to Mohamed Salaal. A pin that only holds on the morning
  // board and not on the plan is not a pin.
  // A FLOOR HOLDS UNTIL SOMEBODY HAS ONE ROOM AND SOMEBODY ELSE HAS FOUR. Same rule and
  // the same numbers as the morning: a room sitting with its own floor's owner is left
  // alone, and only opens up once the round is three or more apart — then it closes
  // again at two. Without this the levelling flattened the day perfectly and undid every
  // floor to do it, which is how a plan reached 6% on-floor while looking even.
  //
  // The clumping this exists for is real: Hassan's floors 1-2 are due four rooms on a
  // Monday and one on a Tuesday, because three of the four are every-other-day and fall
  // together. A day like that SHOULD move a room. A day two apart should not.
  const withOwner = (k) => {
    const u = roomOf(k);
    if (!u) return false;
    const owner = ownerOfFloor(floorOfUnit(u.unit));
    return !!owner && plan[k].assignedTo === owner.id;
  };
  const movable = (k) => {
    const u = roomOf(k);
    return !!u && !u.usualTo && timeSlot(u) === 'any' && !withOwner(k);
  };
  // A MORNING PREFERENCE SAYS WHEN, NOT WHO — the morning hand-out learned this and
  // this pass never did. It would only ever move a room with no time on it, and with 17
  // of 24 rooms marked early and one marked late, that left it almost nothing it was
  // allowed to touch: Mahamed Nur held four rooms — one late, one pinned, two early —
  // and not one could legally move, at any threshold, while two people sat on two rooms
  // each. Moving a room to a different cleaner does not change its time. It is still the
  // early round; it is simply carried by somebody who is not already holding four.
  //
  // Second in the order, so a room with no preference is always spent first.
  const timedButMovable = (k) => {
    const u = roomOf(k);
    return !!u && !u.usualTo && timeSlot(u) !== 'any' && !withOwner(k);
  };
  const movableFromFloor = (k) => {
    const u = roomOf(k);
    return !!u && !u.usualTo && withOwner(k);
  };
  // ...but never onto somebody already holding their round of asked-for rooms. That cap
  // is the whole reason one person does not start the morning with five of them.
  const canTake = (lo, k) => {
    const u = roomOf(k); const sl = u ? timeSlot(u) : 'any';
    if (sl === 'early') return (slotLoad.early[lo] || 0) < EARLY_CAP;
    return true;
  };
  for (let guard = keys.length * 4; guard > 0; guard -= 1) {
    const ranked = order.slice().sort((a, b) => load[a] - load[b]);
    const hi = ranked[ranked.length - 1];
    const gap = load[hi] - load[ranked[0]];
    if (gap <= 1) break;
    let done = false;
    // Rooms with no claim on them first, everywhere they can help. A floor is only
    // opened up once somebody is holding one room while somebody else holds four.
    const passes = emptyHandedOnly(load, ranked)
      ? [movable, timedButMovable, movableFromFloor]
      : [movable, timedButMovable];
    for (const pass of passes) {
      for (const lo of ranked) {
        if (load[hi] - load[lo] <= 1) break;
        if (pass === movableFromFloor && load[lo] !== 0) continue;   // empty hands only
        const cands = keys.filter((k) => plan[k].assignedTo === hi && pass(k)
          && canCleanUnit(staffById[lo], roomOf(k)) && canTake(lo, k));
        const move = cands.find((k) => !repeats(lo, roomOf(k))) || cands[0];
        if (!move) continue;
        const ms = timeSlot(roomOf(move));
        if (ms !== 'any') { slotLoad[ms][hi] -= 1; slotLoad[ms][lo] = (slotLoad[ms][lo] || 0) + 1; }
        plan[move].assignedTo = lo; load[hi] -= 1; load[lo] += 1;
        if (pass === movableFromFloor) offFloor += 1;
        done = true; break;
      }
      if (done) break;
    }
    if (!done) break;
  }
  save();
  return { assigned: keys.filter((k) => plan[k].assignedTo).length, crew: crew.length,
    onFloor, offFloor };
}

// Seed a day once, the first time it's looked at. Recorded per day so that
// clearing a plan on purpose stays cleared instead of springing back on re-render.
// The hand-out goes in at the same time: a plan nobody is named on is half a plan,
// and the whole point is that tomorrow is already laid out without being asked.
function seedPlanOnce(day) {
  if (!state.planSeeded) state.planSeeded = {};
  if (state.planSeeded[day]) return 0;
  state.planSeeded[day] = true;
  const added = applySuggestions(day, planningJobsFor(day));
  // Today is the morning's business — the door reader decides who is actually in,
  // and overwriting that from a rota would undo real hand-outs.
  // THE WORK DAY, NOT THE CALENDAR DAY. Every day here is keyed by workToday(), which
  // does not roll over until 3am — so between midnight and 3am this compared the work
  // day against tomorrow's date, decided the current morning was "a future day", and
  // auto-planned it. The whole board was handed out to whoever the rota said, before a
  // single person had badged in, and the morning then treated all of it as decided.
  // Anybody opening the app in the small hours saw a day that had dealt itself.
  if (day !== workToday() && added) autoPlanDay(day);
  save();
  return added;
}
// Build a day again from scratch. A day is seeded once and then left alone, which is
// right for a plan somebody has edited — but it also means a day built under an older
// idea of what was due keeps that list for good. Anything already opened before the
// every-other-day fix still carries the full room list, and no amount of re-opening
// will correct it. This re-syncs the rooms to what the schedule now says and hands
// them out again.
function rebuildPlanDay(day) {
  const plan = getPlan(day);
  const want = planningJobsFor(day);
  const wantKeys = new Set(want.map((s) => planKey(s.kind, s.id)));
  let removed = 0;
  Object.keys(plan).forEach((k) => {
    // Only rooms are re-synced. A communal area put on a day by hand was somebody's
    // decision, and the schedule has no opinion to overrule it with.
    if (plan[k].kind !== 'unit') return;
    if (!wantKeys.has(k)) { delete plan[k]; removed += 1; }
  });
  const added = applySuggestions(day, want);
  // A DAY THAT HAS BEEN WORKED IS A RECORD, NOT A PLAN. Re-dealing only ever skipped
  // TODAY, so pointing this at yesterday wiped every assignment and dealt the day
  // again from scratch — nineteen of Aug 24's twenty rooms changed hands overnight,
  // while the ticks stayed exactly where they were. The board then said a room had
  // been cleaned by somebody who never touched it, and the week's history read as
  // scatter because it had been re-scattered after the fact.
  // Rooms can still be added or dropped to match the schedule; who did the work is
  // no longer the schedule's to decide once the day has happened.
  const dealt = (day <= workToday()) ? { assigned: 0 } : autoPlanDay(day);
  save();
  return { added, removed, assigned: dealt.assigned || 0 };
}

// Break a clump of same-frequency rooms into equal groups, one group starting each
// day of the cycle. Eleven every-other-day rooms that all fall due together give
// 23 rooms one day and 12 the next; split five and six across two days and every day
// is about 17. Only ever holds a room back — a clean is never pulled forward — and
// the hold lapses as soon as the room is done, so the new rhythm carries itself.
function staggerFrequencyGroup(freqKeyName, dryRun) {
  const start = workToday();
  const rooms = (state.servicedUnits || [])
    .filter((u) => onRollCall(u) && !u.paused && (u.freq || 'daily') === freqKeyName && unitDueToday(u))
    .slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const span = FREQ_DAYS[freqKeyName] || 1;
  if (rooms.length < 2 || span < 2) return { moved: 0, groups: [] };
  const groups = [];
  for (let g = 0; g < span; g += 1) groups.push([]);
  rooms.forEach((u, i) => groups[i % span].push(u));
  let moved = 0;
  groups.forEach((grp, g) => {
    const day = shiftDay(start, g);
    grp.forEach((u) => {
      if (g === 0) {
        if (!dryRun) { delete u.holdUntil; delete u.alsoCleanOn; }   // first group is due today as normal
        return;
      }
      // Every group after the first gets an extra clean on its day. They are all due
      // today too, so those rooms are cleaned twice inside the cycle — once now, once
      // on their new day — and come out of it landing on the opposite day for good.
      if (!dryRun) { u.alsoCleanOn = day; delete u.holdUntil; }
      moved += 1;
    });
  });
  if (!dryRun) { save(); render(); }
  return { moved, groups: groups.map((grp, g) => ({ day: shiftDay(start, g), units: grp.map((u) => u.unit) })) };
}

// ============================================================
// TOMORROW, WITHOUT BEING ASKED
// The Plan tab lays a day out the moment somebody opens it. That is too late to
// be useful: if nobody opens it, tomorrow does not exist until tomorrow. This
// builds it on app open instead, and — because a day was only ever laid out once,
// then left alone for good — brings it back in line every time it is looked at,
// so a plan drawn up this morning still matches what the schedule says tonight.
// ============================================================
function ensureDayPlanned(day) {
  if (!state.planSeeded) state.planSeeded = {};
  if (!state.planSeeded[day]) return { day, seeded: seedPlanOnce(day), added: 0, removed: 0, assigned: 0 };
  return { day, seeded: 0, ...resyncPlanDay(day) };
}
function ensureTomorrowPlanned() { return ensureDayPlanned(tomorrowKey()); }

// TODAY, which the week-ahead loop skips because it starts at tomorrow. Today's plan
// was drawn up days ago from a projection that assumes every day gets done. Clean a
// room by hand, backdate one, change a frequency, add a room — and the schedule now
// says something is due today that the frozen plan never listed. The plan IS the roll
// call, and the carry-forward only rescues rooms that were on an EARLIER day's plan,
// so a room in that gap appears nowhere at all and is quietly skipped. Every-other-day
// rooms are the ones this catches: a daily room is on every plan, so it cannot fall
// down the gap. Add-only — today never loses a room this way.
function topUpTodayPlan() { return resyncPlanDay(workToday(), true); }

// The whole week, not just tomorrow. Tomorrow laid itself out and the rest of the
// week waited to be asked, so Thursday only existed once somebody went to Thursday.
// Every day ahead is laid out and handed round when the app opens, and kept in line
// after that — the same rules as tomorrow, so an edit is never undone: an existing
// hand-out stays, an area put on a day by hand stays, a job taken off stays off.
function ensureWeekPlanned(nDays) {
  const span = nDays || PLAN_AHEAD_DAYS;
  let jobs = 0, assigned = 0, days = 0;
  // FROM TODAY, NOT FROM TOMORROW. Every day ahead was laid out and today was skipped,
  // so today was the one day that never had a plan at all: Plan a Day showed an empty
  // screen for it while Roll Call showed twenty-two rooms, and the roll call carried a
  // standing warning that there was no plan for today and it was falling back to the
  // raw schedule. topUpTodayPlan could not rescue it either — it re-syncs an existing
  // plan, and bails on an empty one so that a day cleared on purpose stays cleared.
  // Seeding today is safe: seedPlanOnce deliberately does not hand today's rooms round
  // from the rota, because the door reader decides who is actually in.
  for (let i = 0; i <= span; i += 1) {
    const r = ensureDayPlanned(shiftDay(workToday(), i));
    const n = (r.seeded || 0) + (r.added || 0);
    if (n || r.assigned) days += 1;
    jobs += n; assigned += (r.assigned || 0);
  }
  return { jobs, assigned, days, span };
}

// ============================================================
// PLAN THE WEEK AHEAD — one button
// Getting a week ready meant levelling the fortnight, then opening each day in
// turn so it would lay itself out, then checking each was handed round. That is
// four or five taps and knowing which order they go in. This is the whole thing:
// level the days if they are lopsided, lay every day out from the schedule, hand
// each one to whoever is rostered on it.
// ============================================================
const PLAN_AHEAD_DAYS = 7;

// What one tap would do, worked out without changing anything.
function planAheadPreview(nDays) {
  const span = nDays || PLAN_AHEAD_DAYS;
  const lp = levelPlan(LEVEL_HORIZON);
  const worthLevelling = lp.moves.length > 0 && (lp.settledBefore - lp.settledAfter) >= 2;
  let toPlan = 0, days = 0;
  for (let i = 1; i <= span; i += 1) {
    const day = shiftDay(workToday(), i);
    const already = Object.keys(getPlan(day)).length;
    const want = planningJobsFor(day).length;
    if (want > already) toPlan += want - already;
    if (want || already) days += 1;
  }
  return { span, lp, worthLevelling, toPlan, days };
}

function runPlanAhead(nDays, doLevel) {
  const span = nDays || PLAN_AHEAD_DAYS;
  // Levelling first: it changes which rooms fall on which day, and laying the days
  // out before that would plan the days it is about to move.
  if (doLevel) applyLevelPlan(levelPlan(LEVEL_HORIZON));
  let jobs = 0, assigned = 0;
  for (let i = 1; i <= span; i += 1) {
    const r = ensureDayPlanned(shiftDay(workToday(), i));
    jobs += (r.seeded || 0) + (r.added || 0);
    assigned += (r.assigned || 0);
  }
  save();
  return { jobs, assigned, span };
}

// Level the days without being asked. Waiting to be asked meant the every-other-day
// rooms went on stacking onto one morning until somebody noticed the chart and went
// looking for the button — which is the same as not having it. Governed by the
// existing "Keep the week level" setting, and only when it is genuinely lopsided:
// a room or two of difference is just how they fall and is not worth an extra clean.
function autoLevelIfLopsided() {
  if (state.autoBalance === false) return { moves: 0 };
  if (state.autoLevelledOn === todayKey()) return { moves: 0 };   // once a day is plenty
  const lp = levelPlan(LEVEL_HORIZON);
  if (!lp.moves.length || (lp.settledBefore - lp.settledAfter) < 2) return { moves: 0 };
  state.autoLevelledOn = todayKey();
  // Kept so the week-ahead panel can say what happened. Levelling changes the shape
  // of the fortnight on its own, and a change nobody can see is one nobody trusts.
  state.lastAutoLevel = {
    day: todayKey(),
    moves: lp.moves.length,
    extras: lp.moves.filter((m) => m.kind === 'extra').length,
    from: lp.settledBefore,
    to: lp.settledAfter,
  };
  applyLevelPlan(lp);
  return { moves: lp.moves.length };
}

// Plan tomorrow, in one press, and land on it ready to be edited. Tomorrow lays
// itself out when the app opens, but there was no way to simply ASK for it — you had
// to know that, trust it, and go looking. This is the asking.
//
// It never wipes an edit: anything already on the day stays, anything already handed
// out keeps its cleaner. To start the day over there is "Rebuild this day" below.
function planTomorrow() {
  const day = tomorrowKey();
  ensureDayPlanned(day);
  const plan = getPlan(day);
  const loose = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && !plan[k].assignedTo);
  if (loose.length) assignNewPlanJobs(day, loose);
  save();
  planDay = day;                       // land on it, so the next tap is an edit
  const rooms = Object.values(plan).filter((v) => v.kind === 'unit');
  const named = rooms.filter((v) => v.assignedTo).length;
  hikSyncMsg = rooms.length
    ? { text: 'Tomorrow is planned — ' + rooms.length + ' room' + (rooms.length === 1 ? '' : 's') + ', '
        + named + ' handed out. Change anything below.' }
    : { err: true, text: 'Nothing is due tomorrow. Add a job below if something needs doing.' };
  render();
}

function planAhead() {
  const pv = planAheadPreview(PLAN_AHEAD_DAYS);
  const bits = [];
  if (pv.worthLevelling) {
    const extras = pv.lp.moves.filter((m) => m.kind === 'extra').length;
    bits.push('Evens the days out — the heaviest goes from ' + pv.lp.settledBefore + ' rooms to '
      + pv.lp.settledAfter + ', by spreading ' + pv.lp.moves.length + ' across the cycle'
      + (extras ? ' (' + extras + ' get one extra clean to break up the clump)' : '')
      + '. Nothing waits longer than its frequency.');
  }
  bits.push('Lays out the next ' + pv.span + ' days'
    + (pv.toPlan ? ' — about ' + pv.toPlan + ' more job' + (pv.toPlan === 1 ? '' : 's') : '')
    + ', handed to whoever is rostered on. Anything already handed out stays.');
  showConfirm(
    'Get the next ' + pv.span + ' days ready?',
    bits.join(' '),
    () => {
      const r = runPlanAhead(PLAN_AHEAD_DAYS, pv.worthLevelling);
      hikSyncMsg = { text: 'Next ' + r.span + ' days are ready — ' + r.jobs + ' job'
        + (r.jobs === 1 ? '' : 's') + ' laid out, ' + r.assigned + ' handed round.' };
      render();
    },
    'Get them ready',
    'safe'
  );
}

// Bring a already-laid-out day back in line with what the schedule now says, without
// undoing anybody's decisions. A room that has become due is added and handed to
// whoever is carrying least; a room that is no longer due is dropped only if the
// schedule was what put it there and nobody has been given it. Assignments already
// made are never shuffled — that is the difference between this and a rebuild.
// addOnly: for TODAY. A day still to come can have rooms taken back off it when the
// schedule moves, but today is being worked — a room already cleaned drops out of
// "what's due", and pruning against that would delete the morning's finished work off
// the board. Today only ever gains rooms.
function resyncPlanDay(day, addOnly) {
  const plan = getPlan(day);
  // Emptied on purpose ("Clear this day's plan") — an automatic refill would
  // override a deliberate act, so a cleared day stays cleared.
  if (!Object.keys(plan).length) return { added: 0, removed: 0, assigned: 0 };

  const want = planningJobsFor(day);
  const wantKeys = new Set(want.map((j) => planKey(j.kind, j.id)));
  let removed = 0;
  if (!addOnly) Object.keys(plan).forEach((k) => {
    if (plan[k].kind !== 'unit') return;        // an area on a day was somebody's call
    if (wantKeys.has(k)) return;                // still due on this day — it stays
    if (!plan[k].auto) return;                  // somebody put this room on the day by hand
    // A NAME ON A ROOM IS NOT A REASON TO KEEP IT. This used to skip anything with an
    // assignee at all, and seeding a future day hands every room out immediately — so
    // every auto-added room had a name from the moment it existed and could never be
    // removed again. Clean an every-other-day room today and its next due moves past
    // tomorrow, the re-sync correctly drops it from what is wanted, and then refused
    // to delete it: 701 and 704 sat on today AND tomorrow, and the day's own warning
    // ("on both days without being daily") was the app noticing its own bug.
    // Only a hand-out somebody actually made is protected now. Rooms dealt by the
    // machine have no such claim, and jobs from before this flag existed carry no
    // mark — which is what lets the days already wrong put themselves right.
    if (plan[k].byHand) return;
    delete plan[k]; removed += 1;
  });

  const dropped = droppedFor(day);
  const added = [];
  want.forEach((j) => {
    const k = planKey(j.kind, j.id);
    if (plan[k] || (dropped && dropped[k])) return;   // already there, or taken off by hand
    plan[k] = { kind: j.kind, refId: j.id, label: j.label, assignedTo: null, auto: true };
    added.push(k);
  });

  // A ROOM TIED TO ONE CLEANER IS THEIRS ON EVERY DAY, INCLUDING THE ONES ALREADY
  // DRAWN UP. A plan made before the pin existed keeps the old name for ever — the
  // re-sync only ever added and removed rooms, it never revisited who was on them. So
  // the morning after tying 503 to somebody, the plan still read out the previous
  // cleaner, and the office had two answers to the same question.
  let repinned = 0;
  Object.keys(plan).forEach((k) => {
    const j = plan[k];
    if (j.kind !== 'unit') return;
    const u = (state.servicedUnits || []).find((x) => x.id === j.refId);
    if (!u) return;
    // A PIN DOES NOT HAND OUT A GUEST FLAT. This walks the whole plan rather than the
    // list autoPlanDay deals from, and it was the one pass in the app that had never
    // heard of neverAutoDealt: a flat with a usual cleaner was written onto them here
    // every time the day re-synced, and mirrorPlanToBoard then put that name on the
    // board. Which flats get done, and by whom, follows who checked out and who is free
    // once the offices are finished — a pin cannot know either. The pin still says who
    // USUALLY takes it, which is worth knowing when the office gives them out; what it
    // does not do is give them out. A name the app dealt onto a flat before this is
    // cleared on the next sync — byHand is what somebody deciding looks like, and a name
    // without it was the machine's.
    if (neverAutoDealt(u)) {
      if (j.assignedTo && !j.byHand) { j.assignedTo = null; repinned += 1; }
      return;
    }
    if (!u.usualTo || j.assignedTo === u.usualTo) return;
    j.assignedTo = u.usualTo; repinned += 1;
  });

  const assigned = assignNewPlanJobs(day, added);
  if (removed || added.length || repinned) save();
  return { added: added.length, removed, assigned, repinned };
}

// Hand out only the jobs just added, fitting them around what is already dealt.
// autoPlanDay deals the whole day from scratch and would wipe existing hand-outs.
function assignNewPlanJobs(day, keys, skip) {
  const plan = getPlan(day);
  // THE SAME ROOMS autoPlanDay REFUSES TO DEAL. That pass lifts the guest flats out
  // before it hands anything round; this one, which tops a plan up with the jobs just
  // added, dealt whatever it was given — so a flat arriving on a day's plan was handed
  // to whoever was carrying least, and the carry wrote the name onto the board. The flat
  // belongs on the day and in NOBODY YET until a person gives it out. See neverAutoDealt.
  const roomKeys = keys.filter((k) => plan[k] && plan[k].kind === 'unit'
    && !neverAutoDealt((state.servicedUnits || []).find((u) => u.id === plan[k].refId)));
  if (!keys.some((k) => plan[k])) return 0;
  // skip = whoever cannot take work today, so somebody off sick does not get handed
  // their own rooms straight back.
  const out = skip instanceof Set ? skip : new Set(skip ? [skip] : []);
  const able = cleaningStaff().filter((p) => worksOnDay(p, day) && !out.has(p.id)
      && !(day === todayKey() && isAway(p.id)))
    .slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  // Same rule as the morning: the room is the leader's and the assistant works it with
  // them, so a plan must not name an assistant either — otherwise tomorrow is drawn up
  // one way and handed out another. Falls back to everybody when no leader is down to
  // work that day, because a plan with nobody on it is no plan.
  // ...and never past "rooms by hand only", for the same reason the morning deal does
  // not: the fallback is there to reach assistants when no leader is on, not to undo a
  // decision the office made about one person.
  const withLead = able.filter((p) => p.isLeader && !noAuto(p));
  const crew = withLead.length ? withLead : able.filter((p) => !noAuto(p));
  if (!crew.length) return 0;

  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const staffById = {}, load = {};
  const slotLoad = { early: {}, late: {} };
  crew.forEach((p) => { staffById[p.id] = p; load[p.id] = 0; slotLoad.early[p.id] = 0; slotLoad.late[p.id] = 0; });
  // Count what each of them is already carrying, so the new work lands on whoever
  // has the least rather than on top of the person who is already fullest. Counted
  // per time slot as well as overall: an even total is no use if one person is
  // holding every room the customer asked for first thing.
  //
  // THE BOARD IS THE TRUTH, NOT THE PLAN. This counted plan[k].assignedTo, and moving a
  // room by hand writes u.assignedTo on the BOARD without touching the plan — so every
  // correction the office made was invisible here, and the next top-up piled work onto
  // somebody who only looked light. The board wins wherever it has an opinion; the plan
  // fills in for rooms that have not reached the board yet.
  //
  // Communal areas are not counted at all: they are not dealt automatically any more
  // (they wait in NOBODY YET for a person), so counting them would weigh a person down
  // for work the app never gave them. See the areas note in autoPlanDay.
  const counted = new Set();
  (state.servicedUnits || []).forEach((u) => {
    if (!u || !u.assignedTo || load[u.assignedTo] === undefined) return;
    if (neverAutoDealt(u)) return;
    counted.add(u.id);
    load[u.assignedTo] += 1;
    const slot = timeSlot(u);
    if (slot !== 'any') slotLoad[slot][u.assignedTo] += 1;
  });
  Object.keys(plan).forEach((k) => {
    const who = plan[k].assignedTo;
    if (!who || load[who] === undefined) return;
    if (plan[k].kind !== 'unit') return;                 // a communal walk is not on this count
    const u = unitById[plan[k].refId];
    if (!u || counted.has(u.id) || neverAutoDealt(u)) return;   // the board already spoke for it
    load[who] += 1;
    const slot = timeSlot(u);
    if (slot !== 'any') slotLoad[slot][who] += 1;
  });

  // Asked-for times go out first and are spread on their own count, exactly as the
  // morning deals them — otherwise the early rooms stack on whoever happens to be
  // lightest overall and one person carries the whole first hour.
  const order = crew.map((p) => p.id);
  const give = (k) => {
    const u = unitById[plan[k].refId];
    if (!u) return false;
    const slot = timeSlot(u);
    const pick = order
      .filter((id) => canCleanUnit(staffById[id], u))
      .sort((a, b) => (slot !== 'any' ? slotLoad[slot][a] - slotLoad[slot][b] : 0)
        || (load[a] - load[b])
        || ((u.lastCleanedBy === a ? 1 : 0) - (u.lastCleanedBy === b ? 1 : 0))
        || (order.indexOf(a) - order.indexOf(b)))[0];
    if (!pick) return false;                    // nobody rostered on is cleared for it
    plan[k].assignedTo = pick; load[pick] += 1;
    if (slot !== 'any') slotLoad[slot][pick] += 1;
    return true;
  };
  let n = 0;
  const inSlot = (s) => roomKeys.filter((k) => unitById[plan[k].refId] && timeSlot(unitById[plan[k].refId]) === s);
  [...inSlot('early'), ...inSlot('late'), ...inSlot('any')].forEach((k) => { if (give(k)) n += 1; });
  // COMMUNAL AREAS ARE NOT DEALT HERE EITHER. autoPlanDay stopped handing them out —
  // an area is a walk of the building and who walks it depends on who is actually in —
  // and this pass carried on doing it, which is why communal jobs kept reappearing on
  // people who had not been given them. They stay in NOBODY YET for a person to hand
  // out on the day, and they are not on anybody's automatic count.
  return n;
}

// ============================================================
// DRAG A ROOM ONTO SOMEBODY ELSE
// Tapping a room and picking from a list is fine for one room. Shuffling a
// morning around — which is what happens when somebody is late or ill — is faster
// with your thumb: hold a room, drag it onto whoever should have it, let go.
// Pointer events rather than HTML5 drag-and-drop, which does not exist on touch.
// The hold is what separates a drag from a tap, so both still work.
// ============================================================
const DRAG_HOLD_MS = 300;
let _movePick = null;   // {day, key} while "move this to…" is open

// Hold a room to move it. Dragging it onto somebody was worse than it sounds: on a
// phone the list scrolls under your thumb, the target sits beneath your hand where
// you cannot see it, and a miss puts the room somewhere you did not intend. Same
// gesture, but it opens a list of names instead of asking you to aim.
function makeRoomDraggable(chipEl, day, key, label, isSpare) {
  let timer = null, startX = 0, startY = 0, moved = false, held = false;

  chipEl.addEventListener('pointerdown', (e) => {
    if (e.button != null && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY; moved = false; held = false;
    timer = setTimeout(() => {
      held = true;
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
      _movePick = { day, key };
      render();
    }, DRAG_HOLD_MS);
  });
  // Moving means the page is being scrolled, not that a room is being picked up.
  chipEl.addEventListener('pointermove', (e) => {
    if (held) return;
    if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) {
      moved = true; clearTimeout(timer); timer = null;
    }
  });
  const stop = () => { clearTimeout(timer); timer = null; };
  chipEl.addEventListener('pointerup', stop);
  chipEl.addEventListener('pointercancel', stop);

  // On today, a tap ticks the job off — planning today and working today are the
  // same thing. On a day ahead there is nothing to tick, so a tap takes the room
  // off that person. The ✕ or ✓ on the chip says which it will be.
  chipEl.addEventListener('click', (e) => {
    if (moved || held) { e.preventDefault(); e.stopPropagation(); return; }
    if (day === todayKey() || day === workToday()) {
      const j = getPlan(day)[key];
      if (!j) return;
      if (j.kind === 'unit') toggleServicedDone(j.refId); else toggleAreaDone(j.refId);
      return;
    }
    if (isSpare) return;
    setPlanAssignee(day, key, '');
  });
}

// The sheet the hold opens: who should have this one instead.
function moveJobSheet(day) {
  if (!_movePick || _movePick.day !== day) return null;
  const plan = getPlan(day);
  const j = plan[_movePick.key];
  if (!j) { _movePick = null; return null; }
  const isToday = day === todayKey() || day === workToday();
  const arrived = new Set(Object.keys(hikArrivals));
  const load = {};
  Object.values(plan).forEach((v) => { if (v.assignedTo) load[v.assignedTo] = (load[v.assignedTo] || 0) + 1; });

  const overlay = el('<div class="modal-overlay"></div>');
  const modal = el('<div class="modal"></div>');
  modal.appendChild(el(`<div class="modal-title">Move ${esc(String(j.label).replace(/^Unit\s+/, ''))}</div>`));
  modal.appendChild(el(`<div class="modal-sub">Who should have it?</div>`));
  const picker = el('<div class="cover-picker"></div>');
  // WHOEVER THE ROTA HAS IN ON THIS DAY. Moving a room onto somebody who is at home is
  // the quietest way to lose it: it reads as handed out and nobody comes for it. The one
  // holding it now stays offered whatever the rota says, so the sheet can always show
  // where the room actually is.
  cleaningStaff().filter((p) => onDutyForDay(p, day) || j.assignedTo === p.id).slice()
    .sort((a, b) => (isToday ? (arrived.has(b.id) ? 1 : 0) - (arrived.has(a.id) ? 1 : 0) : 0)
      || ((load[a.id] || 0) - (load[b.id] || 0))
      || String(a.name).localeCompare(String(b.name)))
    .forEach((p) => {
      const n = load[p.id] || 0;
      const b = el(`<button class="cover-pick${j.assignedTo === p.id ? ' on' : ''}">`
        + `<span>${isToday && arrived.has(p.id) ? '✓ ' : ''}${esc(p.name)}</span>`
        + `<span class="cover-load">${n} room${n === 1 ? '' : 's'}</span></button>`);
      b.onclick = () => { const k = _movePick.key; _movePick = null; setPlanAssignee(day, k, p.id); };
      picker.appendChild(b);
    });
  modal.appendChild(picker);
  const row = el('<div class="modal-btns"></div>');
  const pool = el('<button class="modal-skip">Nobody yet</button>');
  pool.onclick = () => { const k = _movePick.key; _movePick = null; setPlanAssignee(day, k, ''); };
  const off = el('<button class="modal-confirm" style="background:#b45309">Take it off this day</button>');
  off.onclick = () => { _movePick = null; togglePlanJob(day, j.kind, j.refId, j.label); };
  row.appendChild(pool); row.appendChild(off);
  modal.appendChild(row);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) { _movePick = null; render(); } };
  return overlay;
}

// Somebody is off. Take their rooms back and deal them round whoever is left,
// rather than making the office move them one at a time — which is the moment the
// plan gets abandoned and the morning is improvised instead.
function sharePersonsRoomsOut(day, personId) {
  const plan = getPlan(day);
  const theirs = Object.keys(plan).filter((k) => plan[k].kind === 'unit' && plan[k].assignedTo === personId);
  if (!theirs.length) return { moved: 0, stranded: 0 };
  theirs.forEach((k) => { plan[k].assignedTo = null; });
  const dealt = assignNewPlanJobs(day, theirs, personId);
  mirrorPlanToBoard(day);
  save();
  return { moved: dealt, stranded: theirs.length - dealt };
}

function getPlan(day) { if (!state.plans) state.plans = {}; if (!state.plans[day]) state.plans[day] = {}; return state.plans[day]; }
function planJobs(day) { return Object.entries(getPlan(day)).map(([key, v]) => ({ key, ...v })); }
const planKey = (kind, id) => kind + ':' + id;
// All cleanable things you can put on a plan: serviced units (by type) + areas.
function planPool() {
  const rooms = (state.servicedUnits || []).map(u => ({ kind: 'unit', id: u.id, label: 'Unit ' + u.unit, group: UNIT_TYPES[unitType(u)].label }));
  const areas = (state.areas || []).map(a => ({ kind: 'area', id: a.id, label: a.label, group: a.kind === 'exterior' ? 'Exterior areas' : 'Interior areas' }));
  return [...rooms, ...areas];
}
function togglePlanJob(day, kind, id, label) {
  stampPlanEdit(day);
  const plan = getPlan(day); const k = planKey(kind, id);
  // Taking a job off a day is a decision, and it has to outlast the next re-sync —
  // otherwise the schedule quietly puts it back and it looks like the tap did nothing.
  if (plan[k]) { delete plan[k]; markPlanDropped(day, k); }
  else { plan[k] = { kind, refId: id, label, assignedTo: null }; unmarkPlanDropped(day, k); }
  save(); render();
}
function droppedFor(day) { if (!state.planDropped) state.planDropped = {}; return state.planDropped[day] || null; }
function markPlanDropped(day, k) {
  if (!state.planDropped) state.planDropped = {};
  if (!state.planDropped[day]) state.planDropped[day] = {};
  state.planDropped[day][k] = true;
}
function unmarkPlanDropped(day, k) {
  const d = droppedFor(day);
  if (!d) return;
  delete d[k];
  if (!Object.keys(d).length) delete state.planDropped[day];
}
// WHEN THIS DAY WAS LAST ARRANGED BY A PERSON. Rooms carry this already: the newest
// hand edit wins the merge rather than the newest push. A day's plan carried nothing, so
// a device with an older copy could — and did — undo a morning that had just been laid
// out. Stamped on every hand move, and read in applyRemote.
function stampPlanEdit(day) {
  if (!state.planEdited) state.planEdited = {};
  state.planEdited[day] = new Date().toISOString();
}
function setPlanAssignee(day, k, pid) {
  stampPlanEdit(day);
  const plan = getPlan(day);
  // MARK IT AS A HUMAN DECISION. Every hand move — the drag, the move sheet, the
  // dropdown — comes through here, and the re-sync needs to tell a room somebody
  // deliberately gave to a person from one the machine dealt out on its own.
  if (plan[k]) {
    plan[k].assignedTo = pid || null;
    if (pid) plan[k].byHand = true; else delete plan[k].byHand;
  }
  mirrorPlanToBoard(day, k);
  save(); render();
}
// Planning TODAY and the morning roll call are the same job. They were separate:
// the plan lived in state.plans and the roll call read the room's own assignedTo,
// so planning today changed nothing the crew could see. Anything set on today's
// plan is written straight onto the room (or area) the roll call reads.
function mirrorPlanToBoard(day, key, keepBoard) {
  // THE WORK DAY, AND ONLY THE WORK DAY. This used to accept the calendar day as well,
  // so that a plan filed after midnight while a round was still running still landed.
  // The cost was far worse than the fix: between midnight and 3am the calendar day is
  // TOMORROW's work day, which is a future day and therefore already handed round from
  // the rota — so opening the app at 1am wrote tomorrow's rota onto tonight's board,
  // stamped every room as decided, and the morning would not re-deal any of it. The
  // crew arrived to a board naming people who were not there. Outside that window the
  // two dates are identical and nothing changes.
  if (day !== workToday()) return;
  const plan = getPlan(day);
  const keys = key ? [key] : Object.keys(plan);
  keys.forEach((k) => {
    const j = plan[k];
    if (!j) return;
    if (j.kind === 'unit') {
      const u = (state.servicedUnits || []).find((x) => x.id === j.refId);
      if (!u) return;
      // ...but only a name put there THIS round. keepBoard exists to stop the plan
      // overwriting what somebody has decided since it was drawn; yesterday's leftover
      // is not a decision, it is the last round that nobody has cleared yet.
      if (keepBoard && u.assignedTo && assignedThisRound(u)) return;
      // An assistant works the leader's round with them, so a plan naming one must not
      // put the room on the board against their name. The room stays free and the
      // morning hands it to a leader. Assigning it to them on the board by hand still
      // works — that is somebody deciding, which the app does not overrule.
      if (j.assignedTo && !((state.staff || []).find((p) => p.id === j.assignedTo) || {}).isLeader) return;
      // Same rule as the morning: a room tied to one cleaner is not the plan's to give
      // away. Left alone here, it shows as unassigned until it reaches its own person.
      if (j.assignedTo && u.usualTo && u.usualTo !== j.assignedTo) return;
      u.assignedTo = j.assignedTo || null;
      // Handing a room out on purpose is the sign-off, exactly as it is on the board.
      // Marked as having come from the PLAN, though, not from somebody at the screen:
      // a plan is drawn for whoever is rostered, and the crew who actually turn up is
      // a different set. Without the mark the morning could not tell the two apart and
      // treated every planned room as a decision no automatic level was allowed to
      // touch — which is how two early birds ended up holding eleven rooms each while
      // three people stood there with nothing.
      if (j.assignedTo) {
        // A PLAN THE APP WROTE IS NOT A DECISION. Days ahead are laid out from the
        // ROTA — who is down to work — and the crew who actually turn up is a different
        // set. Stamping every planned room as signed off meant the whole day arrived
        // already decided: fourteen of Sunday's fifteen rooms were the rota's guess,
        // the morning was not allowed to touch any of them, and whoever badged in last
        // got whatever the rota had left them, however lopsided. Only a room somebody
        // moved BY HAND is a decision; the rest are a starting point the morning is
        // free to deal again as people arrive.
        if (j.byHand) state.assignConfirmed[u.id] = todayKey();
        else delete state.assignConfirmed[u.id];
        state.planCarried = state.planCarried || {};
        state.planCarried[u.id] = todayKey();
      } else {
        delete state.assignConfirmed[u.id];
      }
    } else {
      const a = areasInterior().find((x) => x.id === j.refId);
      if (!a || (keepBoard && a.assignedTo)) return;
      // AN AREA IS A LEADER'S, EXACTLY AS A ROOM IS. The unit branch above has
      // refused to hand a planned room to an assistant since the beginning - "the
      // room is the leader's and the assistant is there to work it with them" - and
      // this branch never got the same line. So the corridors could be planned onto
      // somebody's assistant, and on 24 Aug Interior Windows was: Abdirisaq Ahmed Nur
      // holding a job of his own while the leader he works with held none of it.
      if (j.assignedTo && !((state.staff || []).find((x) => x.id === j.assignedTo) || {}).isLeader) return;
      a.assignedTo = j.assignedTo || null;
    }
  });
}

// The morning the planned day arrives. A plan made last night for today only
// reached the board if somebody edited it again, or if the automatic hand-out
// happened to run — which needs badge-ins and only fires once. So the crew could
// open the app to an empty board and a plan sitting one tab away. This puts it on
// the roll call as the app opens, without touching anything already handed out
// there: a change made on the board is newer than the plan and wins.
function carryPlanToBoardOnOpen() {
  // The day the crew is actually working, which between midnight and 3am is still
  // yesterday's date — a round that runs late is on the day it started. The calendar
  // day is deliberately NOT included: in that window it is tomorrow's work day, and
  // tomorrow has already been handed round from the rota. See mirrorPlanToBoard.
  const days = [workToday()];
  if (!state.plans || !days.some((d) => state.plans[d])) return 0;
  const before = (state.servicedUnits || []).filter((u) => u.assignedTo).length;
  days.forEach((d) => { if (state.plans[d]) mirrorPlanToBoard(d, null, true); });
  const after = (state.servicedUnits || []).filter((u) => u.assignedTo).length;
  if (after !== before) save();
  return after - before;
}
// Whether a planned job has actually been done, read from the same place the roll
// call reads it, so a plan for today shows the morning's real progress.
function planJobDone(j) {
  if (j.kind === 'unit') return servicedDone(j.refId);
  const a = areasInterior().find((x) => x.id === j.refId);
  return a ? areaDone(a) : false;
}
function clearPlanDay(day) { showConfirm('Clear this day’s plan?', 'Removes every planned job for ' + day + '.', () => { if (state.plans) delete state.plans[day]; save(); render(); }); }
// Auto-spread the planned jobs evenly across whoever's clocked in.
function autoAssignPlan(day) {
  const byId = {};
  for (const p of (state.staff || [])) byId[p.id] = p;
  const arrived = Object.keys(hikArrivals).filter(id => byId[id]);
  // The room is the leader's; the assistant works it with them. Same rule as every
  // other hand-out, with the same fallback when no leader is in.
  const leadIn = arrived.filter((id) => byId[id] && byId[id].isLeader && !noAuto(byId[id]));
  const inIds = leadIn.length ? leadIn : arrived;
  if (!inIds.length) { hikSyncMsg = { err: true, text: 'No one clocked in yet to assign these jobs to.' }; render(); return; }
  const jobs = planJobs(day);
  if (!jobs.length) { hikSyncMsg = { err: true, text: 'No jobs planned for this day yet — add some below.' }; render(); return; }
  const plan = getPlan(day);
  const load = {}; inIds.forEach(id => load[id] = 0);
  jobs.forEach(j => { const pick = inIds.slice().sort((a, b) => load[a] - load[b])[0]; plan[j.key].assignedTo = pick; load[pick]++; });
  hikSyncMsg = { text: `Spread ${jobs.length} jobs across ${inIds.length} clocked-in.` };
  save(); render();
}

// THE SHEET THAT GETS HANDED OUT. The plan screen is built for editing a day —
// pickers, day jumps, a control on every job — none of which survives being
// photographed and sent to the security desk, who only need to know which rooms go
// to which person. This is the same day with everything else taken off: names down
// the side, their rooms beside them, sized to fit one screen so a screenshot is the
// whole day rather than the top third of it.
let _planSheet = false;
function planHandoutSheet(day) {
  const wrap = el('<div class="sheet-paper"></div>');
  const staffById = {};
  (state.staff || []).forEach((p) => { staffById[p.id] = p; });
  const byPerson = {}, loose = [];
  planJobs(day).forEach((j) => {
    const label = j.kind === 'unit' ? String(j.label || '').replace(/^Unit\s+/, '') : String(j.label || '');
    const item = { label, area: j.kind !== 'unit' };
    if (j.assignedTo && staffById[j.assignedTo]) (byPerson[j.assignedTo] = byPerson[j.assignedTo] || []).push(item);
    else loose.push(item);
  });
  const byLbl = (a, b) => String(a.label).localeCompare(String(b.label), undefined, { numeric: true, sensitivity: 'base' });
  const ids = Object.keys(byPerson).sort((a, b) =>
    String(staffById[a].name).localeCompare(String(staffById[b].name), undefined, { sensitivity: 'base' }));

  const dt = new Date(day + 'T00:00:00');
  const total = Object.values(byPerson).reduce((n, l) => n + l.length, 0) + loose.length;
  const head = el('<div class="sp-head"></div>');
  head.appendChild(el(`<div class="sp-date">${esc(dt.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' }))}</div>`));
  head.appendChild(el(`<div class="sp-meta">${ids.length} cleaner${ids.length === 1 ? '' : 's'} · ${total} job${total === 1 ? '' : 's'}</div>`));
  wrap.appendChild(head);

  if (!total) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:22px 0">Nothing planned for this day yet.</div>`));
    return wrap;
  }
  ids.forEach((id) => {
    const list = byPerson[id].slice().sort(byLbl);
    const row = el('<div class="sp-row"></div>');
    const p = staffById[id];
    const mates = assistantsFor(p, (x) => byPerson[x.id] === undefined)
      .map((x) => String(x.name).split(' ')[0]);
    const who = el(`<div class="sp-who">${esc(String(p.name).split(' ')[0])}`
      + `${p.isLeader ? ' <span class="sp-lead">★</span>' : ''}`
      + `<span class="sp-n">${list.length}</span></div>`);
    // Only assistants who have no rooms of their own on the sheet: one with their own
    // line is already accounted for, and naming them twice reads as two hand-outs.
    if (mates.length) who.appendChild(el(`<div class="sp-with">+ ${esc(mates.join(', '))}</div>`));
    row.appendChild(who);
    row.appendChild(el(`<div class="sp-jobs">${list.map((x) =>
      `<span class="sp-job${x.area ? ' area' : ''}">${esc(x.label)}</span>`).join('')}</div>`));
    wrap.appendChild(row);
  });
  if (loose.length) {
    const row = el('<div class="sp-row sp-loose"></div>');
    row.appendChild(el(`<div class="sp-who">Nobody<span class="sp-n">${loose.length}</span></div>`));
    row.appendChild(el(`<div class="sp-jobs">${loose.slice().sort(byLbl).map((x) =>
      `<span class="sp-job${x.area ? ' area' : ''}">${esc(x.label)}</span>`).join('')}</div>`));
    wrap.appendChild(row);
  }
  return wrap;
}

// THE SAME BOARD, FOR ANY DAY.
// Today's work is moved by dragging a chip from one person to another, and the day
// before had to be arranged through a list and a dropdown — the same job done two
// different ways depending on which screen you were on. This is the board again,
// reading from the plan for the day being looked at and writing through
// setPlanAssignee, which is the same call the dropdown always used. Nothing about how
// a plan is built, seeded or re-synced changes; this is a second way to look at one.
function planBoard(day) {
  const plan = getPlan(day);
  const jobs = Object.entries(plan).map(([key, j]) => ({ key, ...j }));
  const wrap = el('<div class="board" style="margin-bottom:14px"></div>');
  if (!jobs.length) {
    wrap.appendChild(el('<div style="color:#7f9abf;font-size:13px;padding:6px 2px">Nothing laid out for this day yet.</div>'));
    return wrap;
  }
  const cols = el('<div class="bd-cols"></div>');
  const byId = {};
  (state.servicedUnits || []).forEach((u) => { byId[u.id] = u; });
  // ONLY WHO THE ROTA HAS IN ON THAT DAY. An empty column for a leader who is at home is
  // an invitation to drop a room on them. Anybody already holding a job on the day keeps
  // their column whatever the rota says — a filter must not make work look unhanded.
  const holders = new Set(jobs.map((j) => j.assignedTo).filter(Boolean));
  const people = cleaningStaff().filter((p) => p.isLeader
    && (onDutyForDay(p, day) || holders.has(p.id)));
  const buckets = { __none__: [] };
  people.forEach((p) => { buckets[p.id] = []; });
  jobs.forEach((j) => { (buckets[j.assignedTo && buckets[j.assignedTo] ? j.assignedTo : '__none__']).push(j); });

  const order = ['__none__'].concat(people.map((p) => p.id));
  order.forEach((pid) => {
    const mine = buckets[pid] || [];
    const none = pid === '__none__';
    if (!mine.length && none) return;                 // nothing unhanded is nothing to show
    const col = el(`<div class="bd-col${none ? ' none' : ''}${_picked ? ' drop' : ''}"></div>`);
    col.setAttribute('data-plandrop', pid);
    col.addEventListener('click', () => {
      if (!_picked || !_picked.planKey) return;
