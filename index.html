function clearDirty() {
  try { localStorage.removeItem(DIRTY_KEY); localStorage.removeItem(DIRTY_SINCE); } catch (e) {}
}
// How long this device has been sitting on something it could not send. Zero when there
// is nothing owed, which is nearly always.
function dirtyForMs() {
  if (!isDirty()) return 0;
  try {
    const t = Number(localStorage.getItem(DIRTY_SINCE) || 0);
    return t ? Math.max(0, Date.now() - t) : 0;
  } catch (e) { return 0; }
}
// A DEVICE THAT CANNOT SEND MUST NOT GO DEAF FOR EVER.
// Refusing an incoming copy while holding an unsent change is right for a moment: it
// stops somebody else's older copy wiping a tick that has not gone up yet. But the push
// can keep failing — a weak signal, a locked phone, a sleeping tab — and then that
// device never accepts anything again. It sits on its own morning and pushes it at
// everybody, which is how 1102 came to be cleaned on the laptop and not on the phone.
// After two minutes it takes the incoming copy and merges: ticks are unioned, rooms and
// areas it alone has seen survive, the newest hand edit wins. Nothing recorded is lost —
// and what it owed is still owed, so it pushes straight afterwards.
const DEAF_LIMIT_MS = 2 * 60 * 1000;

// Debounced push: collapses a burst of saves into one network write.
// COALESCE THE RUSH. Every save sends the WHOLE state and realtime then broadcasts it
// to every other device, so a quarter-second debounce meant a morning of ticking rooms
// off was a push — and a broadcast to every phone and the TV — per tap. A second and a
// bit gathers a burst into one write without anybody feeling it: the screen has already
// updated locally, and nothing waits on the push. A change still in the window is not
// at risk — it is marked owed, flushed when the page is hidden, and retried on failure.
function remotePush() {
  if (!db) return;             // not configured yet → local-only (unchanged behavior)
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => { pushNow(); }, 1200);
}

// Send the current state to the server. Resolves true only when the row is written.
async function pushNow() {
  if (!db || _pushing || TV_MODE) return false;   // the board is a display, not a writer
  // A DEVICE MAY NOT UPLOAD A BOARD IT HAS NEVER DOWNLOADED.
  // The seed guard in remotePull() only covers one way in, and on 2026-08-23 that was
  // not the way in. Every other path to here — a tap calling save(), the flush when a
  // phone is pocketed, the retry timer, the dirty-first branch at the top of
  // remotePull() — will happily send whatever the device is holding, and after a
  // cleared localStorage plus one failed first pull what it is holding is
  // DEFAULT_STAFF: six invented people, all auto-marked present. That uploads exactly
  // like a real save, because by then it IS the state.
  //
  // The missing idea was never a permission check, it was provenance: nothing recorded
  // whether this copy of the board had ever come from the server. _everSynced does,
  // and a starter board that has never synced is refused rather than sent.
  //
  // The dirty flag is cleared with it, deliberately. What is being dropped is an edit
  // made on top of demo data, worth nothing — and leaving it owed would stop
  // remotePull() ever pulling again, stranding the device on the fiction for good.
  if (!_everSynced && looksLikeSeedState()) {
    clearDirty();
    showStorageWarn('This device has not loaded the board yet, so it will not send its starter copy. Reload the page, or sign in again.');
    return false;
  }
  clearTimeout(_pushTimer);    // a pending debounce is now redundant
  clearTimeout(_retryTimer);
  _pushing = true;
  const snapshot = JSON.stringify(sharedState());   // this device's screen stays on it
  try {
    const { error } = await db.from('app_state')
      .upsert({ building: BUILDING, data: JSON.parse(snapshot), updated_at: new Date().toISOString() });
    if (error) throw error;
    _lastRemoteJSON = snapshot;   // only now is it genuinely our own write echoing back
    stampSynced();                // so an offline session can say how old the board is
    clearDirty();
    _retryDelay = 0;
    hideStorageWarn();
    return true;
  } catch (e) {
    markDirty();                  // still ours to deliver
    showStorageWarn('Not saved to the server yet (' + (e.message || e) + '). Retrying — keep this page open.');
    scheduleRetry();
    return false;
  } finally {
    _pushing = false;
  }
}

// Keep trying, backing off 1s → 2s → 4s … up to 30s, until the write lands.
function scheduleRetry() {
  clearTimeout(_retryTimer);
  _retryDelay = Math.min(_retryDelay ? _retryDelay * 2 : 1000, 30000);
  _retryTimer = setTimeout(() => { if (isDirty()) pushNow(); }, _retryDelay);
}

// Flush before the page goes away. Locking a phone or switching apps fires
// visibilitychange/pagehide; without this the debounce timer was killed first
// and the change was never sent.
function flushBeforeHide() {
  if (!db || !isDirty()) return;
  clearTimeout(_pushTimer);
  pushNow();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushBeforeHide(); });
// ============================================================
// A PHONE IN A POCKET IS NOT A TV ON A WALL
// ============================================================
// remotePull() ran exactly twice on a phone or a laptop: once at boot, and never
// again. Everything after that arrived down the realtime websocket — and a phone
// browser kills that socket the moment the screen locks or you switch apps. So the
// office unlocked their phone to a board frozen at whenever they last opened it,
// with no banner saying so, waiting on an event that was never coming. The wall TV
// never had this problem because startTVLoop() re-pulls every minute regardless;
// its comment says why — "smart TV browsers drop websockets silently". Phones do
// exactly the same thing and simply never got the same treatment.
//
// Two belts, same reasoning as the board: pull on coming back to the foreground,
// which is the moment somebody is actually looking, and a slow pull behind it for a
// tab left open all morning. Reads only — applyRemote() already refuses to overwrite
// anything this device has not delivered yet, so a refresh can never lose work.
const APP_PULL_MS = 60000;
let _appPull = null;
function startStatePolling() {
  if (TV_MODE) return;                       // the board has its own, see startTVLoop()
  clearInterval(_appPull);
  _appPull = setInterval(() => { if (!offlineMode) remotePull(); }, APP_PULL_MS);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !TV_MODE && !offlineMode) remotePull();
});
// Safari on iOS restores a backgrounded tab from its page cache without ever firing
// visibilitychange, so the board would come back exactly as stale as it went away.
window.addEventListener('pageshow', () => { if (!TV_MODE && !offlineMode) remotePull(); });
window.addEventListener('pagehide', flushBeforeHide);
window.addEventListener('online', () => { if (isDirty()) { _retryDelay = 0; pushNow(); } });

async function remotePull() {
  if (!db) return;
  // A BOARD CANNOT DELIVER, SO IT MUST NOT WAIT TO. This asked "am I holding anything
  // unsent?" and, if so, tried to send it and gave up on the pull when that failed —
  // and on a television pushNow() returns false at the door, because the board is a
  // display and never writes. So the dirty flag was never cleared, the guard was never
  // satisfied, and the wall stopped pulling ENTIRELY: frozen on whatever it happened to
  // be holding, for the rest of the day, while the corner still read "up to date"
  // because that stamp only means the last attempt did not throw.
  //
  // The flag lives in localStorage against the origin, so it did not even need a bug to
  // get there: one visit to the plain URL on that TV — no ?tv=1, so not TV mode — and a
  // single tap is enough to strand the board for good.
  //
  // A television reads regardless. It is NOT cleared — clearing would throw away
  // whatever the flag stands for, and a board that once ran as an ordinary page may
  // genuinely be holding the only copy of something. It is simply not allowed to stop
  // the read: applyRemote merges rather than replaces, so anything only this device has
  // survives the pull anyway. The flag stays set and harmless.
  //
  // An unsent local change outranks whatever the server holds — deliver it first,
  // otherwise adopting the server copy below would wipe it.
  // ...AND NEITHER MAY A PHONE, FOR EVER. The same shape stranded ordinary devices too:
  // if pushNow keeps failing — no signal, a lapsed session — isDirty stays true and this
  // returns early every time, so the device stops READING the board as well as writing
  // to it. applyRemote solved exactly this two minutes in ("after two minutes stuck, an
  // incoming copy is taken") and this half never got the same treatment. Same limit,
  // same reasoning: what is owed is still owed and still retried, but a device that
  // cannot deliver must not also go blind. The merge protects the unsent change.
  if (!TV_MODE && isDirty() && dirtyForMs() < DEAF_LIMIT_MS) {
    await pushNow();
    if (isDirty()) return;
  }
  try {
    const { data, error } = await db.from('app_state').select('data').eq('building', BUILDING).maybeSingle();
    if (error) throw error;
    if (data && data.data && Object.keys(data.data).length) {
      applyRemote(data.data);
      _everSynced = true;      // these people came from the server; this copy is real
      hideStorageWarn();
      return true;             // and only this path may say the board is up to date
    }
    // AN EMPTY READ IS NOT AN EMPTY SERVER.
    // RLS is authenticated-only (supabase-lockdown.sql), and a row the caller is not
    // allowed to see comes back as no row at all — with no error. That is character
    // for character what a building nobody has set up yet looks like, so this branch
    // used to seed the server from whatever the device happened to be holding.
    //
    // On 2026-08-23 at 11:15 that cost the office its roster. A device whose session
    // had lapsed read nothing, concluded the server was blank, and pushed up the
    // DEFAULT_STAFF demo seed — Sofia Reyes and five others, all auto-marked present —
    // over thirty real people, the teams, the areas and the morning's attendance.
    // Both televisions then displayed it faithfully all morning, because a board that
    // cannot write can only ever adopt.
    //
    // So seeding now has to earn it twice: the device must know it is signed in, and
    // it must be holding something worth sending. Neither test is clever, and that is
    // the point — the failure they exist to stop was a guess made confidently.
    let signedIn = false;
    try { const { data: s } = await db.auth.getSession(); signedIn = !!(s && s.session); } catch (e) {}
    if (!signedIn) {
      showStorageWarn('Signed out, so the board cannot be read. Showing this device\'s saved copy — sign in to sync.');
      return;
    }
    if (looksLikeSeedState()) {
      showStorageWarn('This device is holding an empty starter board, so it will not be sent to the server. Reload, or sign in again.');
      return;
    }
    _everSynced = true;      // signed in, and the emptiness is real rather than refused
    await pushNow();         // genuinely empty server, and we have something real to put in it
    hideStorageWarn();
  } catch (e) {
    showStorageWarn('Cannot reach the server (' + (e.message || e) + '). Showing this device\'s saved copy.');
  }
}

// Adopt state coming from the server (initial pull or a live update from another device).
function applyRemote(saved) {
  const serialized = JSON.stringify(saved);
  if (serialized === _lastRemoteJSON) return;   // this is our own write echoing back
  // Never discard a change this device has not delivered yet; send ours instead.
  if (isDirty() && !TV_MODE && dirtyForMs() < DEAF_LIMIT_MS) { pushNow(); return; }
  _lastRemoteJSON = serialized;
  const keepTab = state.tab;
  // A DAY THAT ONLY THIS DEVICE HAS SEEN SURVIVES THE PULL.
  // The whole state travels as one blob and the last writer wins, so a plan made
  // here while the connection was down was being wiped by the next device to push —
  // a TV or a phone whose copy had never contained it. The plan was correct, saved,
  // and then deleted by somebody else's snapshot, which is why it never reached the
  // roll call. Days the incoming copy has are still its business; days it has never
  // heard of are kept and pushed back rather than dropped on the floor.
  const localPlans = state.plans || {};
  const mergedPlans = { ...(saved.plans || {}) };
  let rescued = 0;
  Object.keys(localPlans).forEach((d) => {
    if (mergedPlans[d] || !Object.keys(localPlans[d] || {}).length) return;
    mergedPlans[d] = localPlans[d]; rescued += 1;
  });
  // A JOB ONLY THIS DEVICE HAS SEEN SURVIVES TOO, not just a whole day. The rescue
  // above saves a day the incoming copy has never heard of and stops there — so a room
  // ADDED BY HAND to a day the server already knows about was simply dropped on the
  // next pull. Adding a room to today is the commonest hand edit there is, and it
  // lasted until whichever device pulled next. Rooms have been rescued job-by-job for
  // a long while; the plan was still being rescued a day at a time.
  //
  // A job the office deliberately took OFF a day stays off: that is what planDropped
  // is for, and it has to bite in both directions or the delete travels back.
  Object.keys(localPlans).forEach((d) => {
    const mine = localPlans[d] || {}, theirs = mergedPlans[d];
    if (!theirs) return;                                  // whole day already rescued above
    const dropped = (state.planDropped || {})[d] || {};
    Object.keys(mine).forEach((k) => {
      if (theirs[k] || dropped[k]) return;
      theirs[k] = mine[k]; rescued += 1;
    });
  });
  // A DAY ARRANGED BY HAND HERE, MORE RECENTLY THAN THERE, STAYS. Same rule the rooms
  // have. Without it a balanced morning could be undone a minute after it was made by
  // any device that still held the old one — which is exactly what happened on 24 Aug.
  const localEdited = state.planEdited || {};
  const mergedEdited = { ...(saved.planEdited || {}) };
  Object.keys(localEdited).forEach((d) => {
    const mine = localEdited[d], theirs = mergedEdited[d];
    if (!mine) return;
    if (!theirs || String(mine) > String(theirs)) {
      if (localPlans[d] && Object.keys(localPlans[d]).length) mergedPlans[d] = localPlans[d];
      mergedEdited[d] = mine;
      rescued += 1;
    }
  });
  // A ROOM ONLY THIS DEVICE HAS SEEN SURVIVES THE PULL, for the same reason a plan
  // does: the whole state is one blob and the last writer wins, so adding rooms on
  // one device and then opening another was enough to lose them. A room the other
  // side deleted on purpose stays deleted — that is what the tombstones are for.
  const gone = { ...(saved.removedUnits || {}), ...(state.removedUnits || {}) };
  const remoteUnits = Array.isArray(saved.servicedUnits) ? saved.servicedUnits : null;
  let unitsKept = 0, mergedUnits = remoteUnits;
  if (remoteUnits) {
    const haveId = new Set(remoteUnits.map((u) => u.id));
    const extra = (state.servicedUnits || []).filter((u) => u && !haveId.has(u.id) && !gone[u.id]);
    mergedUnits = remoteUnits.concat(extra);
    unitsKept = extra.length;
    // A tombstone has to bite in BOTH directions, or a delete simply travels back
    // from whichever device had not heard about it yet and the room reappears.
    const before = mergedUnits.length;
    mergedUnits = mergedUnits.filter((u) => !gone[u.id]);
    if (mergedUnits.length !== before) unitsKept = Math.max(unitsKept, 1);
  }

  // A TICK IS A FACT, AND FACTS MERGE. The whole state travels as one blob and the
  // last writer wins, so `completions` — the ticks themselves — were taken wholesale
  // from whichever device pushed most recently. Two people ticking rooms off on two
  // phones was enough to wipe one of them, with no error and nothing on screen: the
  // room simply came back as due, and it read as the crew forgetting to tick.
  // A tick is now never removed because the other copy had not heard of it. Only a
  // deliberate un-tick removes one, and that leaves a headstone in `untick` which
  // travels the same way — so an un-tick is not undone by a stale copy either.
  // ...BUT A DISPLAY HAS NO UN-TICKS OF ITS OWN. The board never writes, so every
  // headstone it is holding came from the server once and can only be out of date now.
  // Unioning it back in on every pull resurrects an un-tick the office has since undone:
  // 301 was ticked, un-ticked, ticked again, and the wall went on showing it undone
  // while every phone showed it green — for as long as the headstone lives, which is
  // three weeks. The one screen that cannot correct itself was the one that could not
  // be told. It takes the server's word instead.
  const untick = TV_MODE
    ? { ...(saved.untick || {}) }
    : { ...(saved.untick || {}), ...(state.untick || {}) };
  const mergedDone = { ...(saved.completions || {}) };
  let ticksKept = 0;
  Object.keys(state.completions || {}).forEach((k) => {
    if (!state.completions[k] || mergedDone[k]) return;
    mergedDone[k] = true; ticksKept += 1;
  });
  Object.keys(untick).forEach((k) => { if (mergedDone[k]) { delete mergedDone[k]; ticksKept += 1; } });

  // The same rule for the date stamped on the room itself, which is the other half of
  // "was this cleaned today" — otherwise a stale copy hands the tick back but reverts
  // the room's own record, and the room reads as due anyway.
  // A COMMUNAL AREA ONLY THIS DEVICE HAS SEEN SURVIVES THE PULL, and one deleted on
  // purpose stays deleted — word for word the rule rooms already had. Areas never got
  // it, so a laptop with an older copy silently put Trash / Recycling back on the board
  // and took OFFSITE- 2 DHAGAX off it, and the office watched the wall change for no
  // reason anybody could name.
  const goneAreas = { ...(saved.removedAreas || {}), ...(state.removedAreas || {}) };
  let mergedAreas = Array.isArray(saved.areas) ? saved.areas : null;
  let areasKept = 0;
  if (mergedAreas) {
    const haveArea = new Set(mergedAreas.map((a) => a.id));
    const extraA = (state.areas || []).filter((a) => a && !haveArea.has(a.id) && !goneAreas[a.id] && !a.seeded);
    mergedAreas = mergedAreas.concat(extraA);
    areasKept = extraA.length;
    const beforeA = mergedAreas.length;
    mergedAreas = mergedAreas.filter((a) => !goneAreas[a.id]);
    if (mergedAreas.length !== beforeA) areasKept = Math.max(areasKept, 1);
  }

  // THE ROSTER MERGES LIKE THE ROOMS DO. Everything else in this function already
  // survives a stale copy — plans, rooms, areas, ticks — because each carries the
  // moment it was last touched. Staff did not, and `state = { ...state, ...saved }`
  // replaces the array outright, so the last device to push decided the whole roster:
  // its floors, its teams, its "rooms by hand only" switches. A phone that had added
  // people but never seen the floor map pushed both — the new people arrived and every
  // floor went with them.
  //
  // Three rules, the same three the rooms get: a person edited here more recently than
  // there keeps their edit; a person only this device has is kept and pushed rather
  // than dropped; and a person deleted on purpose stays deleted, in both directions.
  const goneStaff = { ...(saved.removedStaff || {}), ...(state.removedStaff || {}) };
  const remoteStaff = Array.isArray(saved.staff) ? saved.staff : null;
  let staffKept = 0, mergedStaff = remoteStaff;
  if (remoteStaff) {
    const mineStaff = {};
    (state.staff || []).forEach((x) => { if (x && x.id) mineStaff[x.id] = x; });
    mergedStaff = remoteStaff.map((x) => {
      const mine = mineStaff[x.id];
      if (!mine) return x;
      // Newest hand edit wins, not the newest push. Mine fills over theirs so anything
      // only their copy knows (a door-reader id, say) still comes through.
      if (mine.editedAt && (!x.editedAt || String(mine.editedAt) > String(x.editedAt))) {
        return { ...x, ...mine };
      }
      return x;
    });
    const haveStaff = new Set(remoteStaff.map((x) => x && x.id));
    // ONLY SOMEBODY THIS DEVICE ACTUALLY ADDED IS RESCUED. Rooms can be rescued on id
    // alone because an unsaved room does not exist until somebody makes one — but the
    // roster is SEEDED with a demo crew (DEFAULT_STAFF) before the first pull lands, so
    // "anybody the server has not got" meant Sofia Reyes and Jamal Brooks walking onto
    // a real building's board and being dealt real rooms. A person added here carries
    // the moment they were added (addEmployee stamps it); the seeded crew carries
    // nothing, and nothing is what it is worth.
    const extraP = (state.staff || []).filter((x) => x && x.editedAt && !haveStaff.has(x.id) && !goneStaff[x.id]);
    mergedStaff = mergedStaff.concat(extraP);
    staffKept = extraP.length;
    const beforeP = mergedStaff.length;
    mergedStaff = mergedStaff.filter((x) => !goneStaff[x.id]);
    if (mergedStaff.length !== beforeP) staffKept = Math.max(staffKept, 1);
  }

  if (mergedUnits) {
    const mineById = {};
    (state.servicedUnits || []).forEach((u) => { mineById[u.id] = u; });
    mergedUnits = mergedUnits.map((u) => {
      const mine = mineById[u.id];
      if (!mine) return u;
      // THE NEWEST HAND EDIT WINS, NOT THE NEWEST PUSH. Set a frequency on the laptop
      // and a phone that had not looked since breakfast pushed the old one straight
      // back. Every edit somebody makes carries the moment it was made (stampUnitEdit),
      // so a copy that predates an edit can no longer undo it. Untouched rooms are
      // unaffected: with no stamp on either side this changes nothing.
      if (mine.editedAt && (!u.editedAt || String(mine.editedAt) > String(u.editedAt))) {
        u = { ...u,
          unit: mine.unit, guest: mine.guest, note: mine.note, type: mine.type,
          freq: mine.freq, days: mine.days || null, daysAuto: mine.daysAuto,
          startDate: mine.startDate, alsoCleanOn: mine.alsoCleanOn || null,
          holdUntil: mine.holdUntil || null, rollCallOn: mine.rollCallOn || null,
          paused: mine.paused, editedAt: mine.editedAt };
      }
      const stamp = (src) => ({ ...u,
        lastCleaned: src.lastCleaned || null,
        lastCleanedBy: src.lastCleanedBy || null,
        lastCleanedByName: src.lastCleanedByName || null });
      // Un-ticked here, and the incoming copy has not heard: keep our reverted date.
      if (u.lastCleaned && untick['su:' + u.id + '::' + u.lastCleaned]) return stamp(mine);
      // Otherwise the later clean wins. A clean that happened cannot be undone by a
      // copy that predates it.
      if (mine.lastCleaned && (!u.lastCleaned || String(mine.lastCleaned) > String(u.lastCleaned))) return stamp(mine);
      return u;
    });
  }

  const localSeeded = state.planSeeded || {};
  const mergedSeeded = { ...(saved.planSeeded || {}) };
  Object.keys(localSeeded).forEach((d) => { if (mergedPlans[d]) mergedSeeded[d] = mergedSeeded[d] || localSeeded[d]; });

  // WHAT THIS DEVICE KEEPS, WHATEVER ARRIVES.
  // Screen state is not shared — an incoming copy has no opinion about which tab this
  // phone is on — and a setting changed here more recently than there is not undone by
  // a copy that predates the change. Same rule the rooms and the roster get.
  const mineDevice = {};
  DEVICE_KEYS.forEach((k) => { mineDevice[k] = state[k]; });
  const stampsMine = state.settingsEditedAt || {};
  const stampsTheirs = (saved && saved.settingsEditedAt) || {};
  const mineSettings = {};
  SETTING_KEYS.forEach((k) => {
    const a = stampsMine[k], b = stampsTheirs[k];
    if (a && (!b || String(a) > String(b))) mineSettings[k] = state[k];   // ours is newer
  });
  const mergedStamps = { ...stampsTheirs };
  Object.keys(stampsMine).forEach((k) => {
    if (!mergedStamps[k] || String(stampsMine[k]) > String(mergedStamps[k])) mergedStamps[k] = stampsMine[k];
  });
  state = { ...state, ...saved, ...mineDevice, ...mineSettings,
    settingsEditedAt: mergedStamps,
    tab: keepTab, pendingCover: null, editingUnit: null, editingArea: null, editingEmp: null };
  // A setting this device won on is a change the server has not got. Deliver it.
  if (Object.keys(mineSettings).length && !TV_MODE) markDirty();
  if (mergedAreas) state.areas = mergedAreas;
  state.removedAreas = goneAreas;
  // TURN THE MORNING HAND-OUT BACK ON, ONCE. It was switched off at some point and the
  // office has asked for the rooms to be dealt automatically again — but a setting lives
  // in the saved state, where no new build can reach it. Done here, on the settings as
  // they come off the server: finalizeState also runs against the empty default state a
  // moment earlier, and stamping the job done there marked it finished against settings
  // that had not arrived yet. Recorded so it is a one-off — switch it off after this and
  // it stays off, which is what a setting means.
  if (!TV_MODE && !state.autoAssignOnce) {
    state.autoAssignOnce = '2026-08-22';
    if (state.autoAssign === false) { delete state.autoAssign; markDirty(); }
  }
  // THE MORNING ROUND IS TWO ROOMS, NOT THREE. Three was a guess and it was already
  // saved into the settings by the time the office said so, where a new default cannot
  // reach it. Same one-off treatment: set once, recorded, and changeable in Settings
  // afterwards like any other setting.
  // ONE-OFF: Ahmed Daahir is dealt no rooms automatically. He badges in late enough
  // that a hand-out driven by the door reader gets it wrong every morning, and the
  // office was unpicking it by hand each time. Set once, by name, because the flag is
  // new and cannot otherwise reach a roster that already exists — after this it is the
  // "Rooms by hand only" switch on his card like anybody else's, and can be turned off.
  if (!TV_MODE && !state.noAutoOnce) {
    state.noAutoOnce = '2026-08-23';
    const late = (state.staff || []).find((x) => String(x.name || '').trim().toLowerCase() === 'ahmed daahir');
    if (late && !late.noAuto) { late.noAuto = true; markDirty(); }
  }
  if (!TV_MODE && !state.earlyCapOnce) {
    state.earlyCapOnce = '2026-08-23';
    if (state.earlyCap !== EARLY_CAP_DEFAULT) { state.earlyCap = EARLY_CAP_DEFAULT; markDirty(); }
  }
  state.plans = mergedPlans;
  state.planSeeded = mergedSeeded;
  state.planEdited = mergedEdited;
  state.removedUnits = gone;
  state.completions = mergedDone;
  state.untick = untick;
  if (mergedUnits) state.servicedUnits = mergedUnits;
  if (mergedStaff) { state.staff = mergedStaff; STAFF = state.staff; }
  state.removedStaff = goneStaff;
  if ((rescued || unitsKept || areasKept || ticksKept || staffKept) && !TV_MODE) markDirty();   // ours to deliver — the server has not got these
  if (state.coverageDay !== todayKey()) { state.coverage = {}; state.unitCover = {}; state.pendingCover = null; state.coverageDay = todayKey(); }
  finalizeState();
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  stampSynced();             // fresh from the server counts as in sync, same as a push
  tvLastData = Date.now();   // the TV board dates itself off the last thing it heard
  if ((rescued || unitsKept || areasKept || ticksKept) && !TV_MODE) remotePush();  // get them up before anything overwrites them
  route();
}

// A SOCKET THAT DIES STAYS DEAD, AND NOBODY IS TOLD. This subscribed once at boot and
// never looked again — and the polling fallback beside it exists precisely because
// "smart TV browsers drop websockets silently". So the first time a TV's socket went,
// the wall quietly dropped to the 60-second poll and stayed there until somebody
// reloaded it: a room ticked on a phone took up to a minute to reach the board, every
// time, for the rest of the day. That is the lag the office has been living with.
//
// Supabase reports the channel's state, so the state is now watched: a channel that
// closes, errors or times out is torn down and re-subscribed, backing off 2s → 4s → …
// to 30s so a genuinely offline TV is not hammering the network.
let _rtChannel = null, _rtRetry = 0, _rtTimer = null;
function subscribeRealtime() {
  if (!db) return;
  clearTimeout(_rtTimer);
  if (_rtChannel) { try { db.removeChannel(_rtChannel); } catch (e) {} _rtChannel = null; }
  _rtChannel = db.channel('app_state_' + BUILDING + '_' + Date.now())
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'app_state', filter: 'building=eq.' + BUILDING },
        (payload) => { if (payload.new && payload.new.data) applyRemote(payload.new.data); })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { _rtRetry = 0; return; }
      if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        _rtRetry = Math.min(_rtRetry ? _rtRetry * 2 : 2000, 30000);
        clearTimeout(_rtTimer);
        _rtTimer = setTimeout(subscribeRealtime, _rtRetry);
      }
    });
}
// Coming back from sleep is the other way a socket is lost — a TV that blanks overnight
// wakes with a channel the server let go hours ago. Re-check on the way back in.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!_rtChannel || _rtChannel.state !== 'joined') subscribeRealtime();
});

}

// CLEANING HISTORY LOG  (append-only table in Supabase)
// ============================================================
let cleaningHistory = [];        // recent log rows, newest first
let lastCleanedByUnit = {};      // unit_id -> newest row (drives the "last cleaned" line)
let historyFilter = 'all';       // History view room filter (per-device UI state)
let historyDay = '';             // History view day filter ('' = all days)
let teamShowAll = false;         // Team tab: false = cleaners only (default once any tagged)
let teamFridayPer = 3;
let teamFridayShift = 0;   // rotates which group lands on the coming Friday           // how many are in on each Friday, chosen in Team
let teamFridayOrder = null;   // a drawn order, or null for alphabetical — see buildDayRota
let teamFridayBy = 'team';    // 'team' shares the rest day in teams, 'person' one by one
let teamFridayStart = [];     // which teams are in on the Friday coming up
const dayKeyLocal = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('en-CA'); }; // local YYYY-MM-DD

// dayKey lets a clean be recorded against the day it happened rather than the
// moment it was entered — the office often marks yesterday's work this morning.
// whoId names who actually did it. Without it a backdated entry gets stamped with
// today's assignment, which is the wrong person as soon as the crew rotates.
async function logClean(unit, dayKey, whoId) {
  if (!db) return null;
  const picked = (whoId && whoId !== 'office') ? (state.staff || []).find(p => p.id === whoId) : null;
  // Only fall back to the room's assignment when no name was given at all —
  // an explicit "Office" has to stay Office, not resolve to the floor's cleaner.
  const c = (picked || whoId === 'office') ? null : cleanerForUnit(unit);
  const cleanerId = picked ? picked.id : (c ? c.person.id : 'office');
  const cleanerName = picked ? picked.name : (c ? c.person.name : 'Office');
  // Midday avoids a timezone shift dragging the entry onto the wrong date.
  const when = (dayKey && dayKey !== todayKey())
    ? new Date(dayKey + 'T12:00:00').toISOString()
    : new Date().toISOString();
  try {
    const { data, error } = await db.from('cleaning_log')
      .insert({
        building: BUILDING,
        unit_id: unit.id,
        unit_label: unit.unit,
        cleaner_id: cleanerId,
        cleaner_name: cleanerName,
        cleaned_at: when,
      })
      .select('id')
      .single();
    if (error) throw error;
    refreshHistory();
    return data.id;
  } catch (e) {
    showStorageWarn('Could not log this cleaning to history (' + (e.message || e) + ').');
    return null;
  }
}

// Recording a past night writes a whole crew's work at once. One insert keeps it
// to a single round trip and a single history refresh instead of one of each per
// room, and the caller learns whether the write landed before it moves schedules.
async function logCleanMany(entries, dayKey) {
  if (!db || !entries.length) return false;
  const when = (dayKey && dayKey !== todayKey())
    ? new Date(dayKey + 'T12:00:00').toISOString()
    : new Date().toISOString();
  const rows = entries.map(({ u, who }) => {
    const picked = (who && who !== 'office') ? (state.staff || []).find(p => p.id === who) : null;
    return {
      building: BUILDING,
      unit_id: u.id,
      unit_label: u.unit,
      cleaner_id: picked ? picked.id : 'office',
      cleaner_name: picked ? picked.name : 'Office',
      cleaned_at: when,
    };
  });
  try {
    // Ask for the ids back so a caller that ticks many things at once can still
    // hold a history reference per row — without them, un-ticking one of them
    // would clear the checkmark and strand its entry in History.
    const { data, error } = await db.from('cleaning_log').insert(rows).select('id');
    if (error) throw error;
    refreshHistory();
    return (data || []).map((r) => r.id);
  } catch (e) {
    showStorageWarn('Could not log ' + rows.length + ' backdated cleaning' + (rows.length === 1 ? '' : 's') + ' (' + (e.message || e) + ').');
    return null;
  }
}

async function unlogClean(logId) {
  if (!db || !logId) return;
  try { await db.from('cleaning_log').delete().eq('id', logId); refreshHistory(); } catch (e) {}
}

async function refreshHistory() {
  if (!db) return;
  try {
    const { data, error } = await db.from('cleaning_log')
      .select('id,unit_id,unit_label,cleaner_id,cleaner_name,cleaned_at')
      .eq('building', BUILDING)
      .order('cleaned_at', { ascending: false })
      .limit(1000);
    if (error) throw error;
    cleaningHistory = data || [];
    const map = {};
    for (const row of cleaningHistory) { if (!map[row.unit_id]) map[row.unit_id] = row; } // first seen = newest
    lastCleanedByUnit = map;
    if (getMe()) render();
  } catch (e) {}
}

// ============================================================
// LEARN WHO USUALLY DOES WHAT
// A room can be tied to a cleaner (★ Usual), and once it is, the hand-out gives it
// back to that person every morning they are in. Setting them one room at a time is
// the reason almost nothing is tied: nobody taps forty rooms. The log already knows
// who has been doing what, so this reads it rather than asking.
//
// Only a clear pattern counts. Somebody who has done a room once, or half the time,
// is not "who does that room" — those stay in the pool and keep rotating.
// ============================================================
const LEARN_DAYS = 30;          // how far back to look
const LEARN_MIN_CLEANS = 3;     // fewer than this is not a pattern, it is a coincidence
const LEARN_SHARE = 0.6;        // and they must have done most of them

function learnUsualPlan(days) {
  const since = shiftDay(todayKey(), -(days || LEARN_DAYS));
  const staffById = {};
  (state.staff || []).forEach((s) => { staffById[s.id] = s; });
  const byName = {};
  (state.staff || []).forEach((s) => { byName[String(s.name).trim().toLowerCase()] = s; });

  // unit -> cleaner -> how many times
  const tally = {};
  (cleaningHistory || []).forEach((r) => {
    if (!r.unit_id || dayKeyLocal(r.cleaned_at) < since) return;
    // Older rows were written before cleaner_id was recorded; fall back to the name.
    const who = (r.cleaner_id && staffById[r.cleaner_id]) ? r.cleaner_id
      : (byName[String(r.cleaner_name || '').trim().toLowerCase()] || {}).id;
    if (!who) return;
    (tally[r.unit_id] = tally[r.unit_id] || {})[who] = (tally[r.unit_id][who] || 0) + 1;
  });

  const proposals = [], skipped = [];
  (state.servicedUnits || []).forEach((u) => {
    if (!onRollCall(u) || u.paused) return;
    const counts = tally[u.id];
    if (!counts) return;
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const [top] = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const n = counts[top];
    if (n < LEARN_MIN_CLEANS || n / total < LEARN_SHARE) { skipped.push({ u, reason: 'no clear pattern' }); return; }
    if (u.usualTo === top) return;                              // already theirs
    // A room nobody is cleared for is not a room to tie to them.
    if (!canCleanUnit(staffById[top], u)) { skipped.push({ u, reason: 'not cleared for it' }); return; }
    proposals.push({ u, who: top, name: (staffById[top] || {}).name || top, n, total, was: u.usualTo || null });
  });
  proposals.sort((a, b) => String(a.u.unit).localeCompare(String(b.u.unit), undefined, { numeric: true }));
  return { proposals, skipped, days: days || LEARN_DAYS };
}

function applyLearnedUsuals(plan) {
  plan.proposals.forEach((p) => { p.u.usualTo = p.who; });
  save();
}

function learnUsualCleaners() {
  const plan = learnUsualPlan(LEARN_DAYS);
  if (!plan.proposals.length) {
    hikSyncMsg = { err: false, text: 'Nothing clear enough in the last ' + plan.days
      + ' days — no room has one person doing most of it.' };
    render(); return;
  }
  const byWho = {};
  plan.proposals.forEach((p) => { (byWho[p.name] = byWho[p.name] || []).push(p.u.unit); });
  const summary = Object.keys(byWho).sort()
    .map((nm) => nm.split(' ')[0] + ': ' + byWho[nm].join(', ')).join(' · ');
  const changing = plan.proposals.filter((p) => p.was).length;
  showConfirm(
    'Tie ' + plan.proposals.length + ' room' + (plan.proposals.length === 1 ? '' : 's') + ' to who does them?',
    summary + '. Taken from the last ' + plan.days + ' days of the log — each of these has one person doing '
      + 'most of the cleans. They will go back to that person every morning they are in, instead of being '
      + 'dealt out again.'
      + (changing ? ' ' + changing + ' of them are tied to somebody else at the moment and will change hands.' : '')
      + ' Rooms with no clear pattern are left in the pool to rotate as they do now.',
    () => { applyLearnedUsuals(plan); render(); },
    'Tie them',
    'safe'
  );
}

function subscribeHistory() {
  if (!db) return;
  db.channel('cleaning_log_' + BUILDING)
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'cleaning_log', filter: 'building=eq.' + BUILDING },
        () => refreshHistory())
    .subscribe();
}

// Friendly timestamp: "Today 2:30 PM", "Yesterday 9:05 AM", "Jul 14, 2:30 PM".
function fmtWhen(iso) {
  try {
    const d = new Date(iso);
    const now = new Date();
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'Today ' + time;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'Yesterday ' + time;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + time;
  } catch (e) { return iso; }
}

// ============================================================
// LOGIC
// ============================================================
function personFloors(p) {
  const parts = [];
  if (p.floors && p.floors.length) parts.push('Floors ' + p.floors.join(', '));
  if (p.special) parts.push(p.special.map(s => s==='ground'?'Ground':'Rooftop').join(' + '));
  return parts.join(' · ') || 'No assignment';
}
function gaps() {
  const out = [];
  STAFF.forEach(p => {
    if (isAway(p.id) && p.floors && p.floors.length) {
      p.floors.forEach(f => { if (!state.coverage[f]) out.push({ person: p, floor: f }); });
    }
  });
  return out;
}
function suggestCover(floor) {
  const candidates = STAFF.filter(p =>
    (state.attendance[p.id]==='present' || state.attendance[p.id]==='late') && p.floors && p.floors.length);
  if (!candidates.length) return null;
  const load = {};
  candidates.forEach(p => load[p.id] = (p.floors||[]).length);
  Object.values(state.coverage).forEach(pid => { if (load[pid]!=null) load[pid]++; });
  candidates.sort((a,b) => load[a.id]-load[b.id]);
  return candidates[0];
}
function whoCleansFloor(floor) {
  if (state.coverage[floor]) {
    const c = STAFF.find(p => p.id===state.coverage[floor]);
    if (c) return { person: c, covering: true };
  }
  const owner = STAFF.find(p => (p.floors||[]).includes(floor));
  return owner ? { person: owner, covering: false } : null;
}

// ============================================================
// ACTIONS
// ============================================================
function cycleStatus(pid) {
  const cur = state.attendance[pid] || 'present';
  const next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
  state.attendance[pid] = next;

  if (AWAY.includes(next)) {
    // Their rooms are nobody's now. Left on them they keep a name against them and are
    // quietly never done — the same reason taking a manual arrival back off releases
    // them. Anything they already finished stays theirs.
    (state.servicedUnits || []).forEach((u) => {
      if (u.assignedTo === pid && !cleanedToday(u)) { u.assignedTo = null; delete state.assignConfirmed[u.id]; }
    });
    // Does this person own any serviced units (via their floors)?
    const affected = unitsOwnedBy(pid);
    if (affected.length) {
      const sug = suggestCoverPerson(pid);
      state.pendingCover = { absentId: pid, suggestId: sug ? sug.id : null };
    }
  } else {
    // Back to present/late/off — release any cover they were given and clear pending
    if (state.unitCover) {
      Object.keys(state.unitCover).forEach(uid => {
        const u = state.servicedUnits.find(x => x.id === uid);
        if (u && ownerOfFloor(floorOfUnit(u.unit))?.id === pid) delete state.unitCover[uid];
      });
    }
    if (state.pendingCover && state.pendingCover.absentId === pid) state.pendingCover = null;
  }
  // Somebody leaving, or coming back, is a different crew — share the morning out
  // again over the people who are actually here rather than waiting for the poll.
  maybeAutoAssign();
  save(); render();
}
// Apply the confirmed cover: all the absent person's units -> chosen covererer
function confirmCover(coverId) {
  const pc = state.pendingCover;
  if (!pc) return;
  if (!state.unitCover) state.unitCover = {};
  unitsOwnedBy(pc.absentId).forEach(u => { state.unitCover[u.id] = coverId; });
  state.coverageDay = todayKey();
  state.pendingCover = null;
  save(); render();
}
function dismissCover() { state.pendingCover = null; save(); render(); }
function assignCover(floor, pid) { state.coverage[floor]=pid; state.coverageDay=todayKey(); save(); render(); }
function toggleUnit(uid) { const k=uid+'::perm'; if(state.completions[k])delete state.completions[k];else state.completions[k]=true; save(); render(); }
function toggleZone(zid, freq) { const k=zid+'::'+freqKey(freq); if(state.completions[k])delete state.completions[k];else state.completions[k]=true; save(); render(); }
function toggleFloorExpand(fid) { state.expandedFloors[fid]=!state.expandedFloors[fid]; save(); render(); }
// FOUR TABS FOR ONE LIST. Offices, Buildings, Airbnb and All Rooms were four views
// of the same rooms, so finding a room meant knowing which tab it lived on before you
// could look for it. They are one Rooms tab with a filter now. The old tab ids still
// work — every button in the app that asks for 'offices' lands on Rooms showing
// offices — so nothing that pointed at them had to be rewritten.
const ROOM_TAB_TYPE = { offices: 'office', buildings: 'building', airbnb: 'airbnb', rooms: 'all' };
// Where you came from. Deliberately NOT part of state: it is this device's history,
// it changes on every tap, and the state travels to every other device on every save.
let _navStack = [];
function setTab(t, opts) {
  if (ROOM_TAB_TYPE[t]) { state.roomsFilter = ROOM_TAB_TYPE[t]; t = 'rooms'; }
  // A screen you cannot get out of is how the app loses your place: you tap into
  // Settings from the roll call and the only way back is to work out which tab you
  // were on. Every jump remembers where it came from, so ‹ Back always means the
  // screen before this one.
  if (!(opts && opts.back) && state.tab && state.tab !== t) {
    _navStack.push(state.tab);
    if (_navStack.length > 12) _navStack.shift();
  }
  state.tab = t; _assignPick = null; save(); render();
}
function goBack() {
  const prev = _navStack.pop();
  setTab(prev || 'board', { back: true });
}
function resetCompletions() { showConfirm('Reset all completion checkmarks?', 'Attendance and assignments are kept.', () => { state.completions={}; save(); render(); }); }

// --- Serviced unit actions ---
// Cleaning types, colour-coded.
const UNIT_TYPES = {
  airbnb:   { label: 'Airbnb',   color: '#dc2626' },
  office:   { label: 'Office',   color: '#0284c7' },
  building: { label: 'Building', color: '#15803d' },
};
const UNIT_TYPE_ORDER = ['airbnb', 'office', 'building'];
// Which kinds of room the morning roll call is about. Some kinds are run as a
// separate operation and only clutter it. No list set = all of them.
// AIRBNB IS NEVER ON THE ROLL CALL. It is a separate job: cleaned after the offices,
// by two people, and the office picks which flats and who does them — turnovers depend
// on who has checked out, which the app has no way of knowing. It was kept off by a
// setting, which is a switch somebody can flip by accident (or a fresh device can
// default differently) and then the morning quietly hands out twelve flats nobody
// asked for. It is a rule, so it lives in the code. The Airbnb tab still has its own
// list, its own schedule and its own hand-out button — that is where they are picked.
// AIRBNB IS A ROOM LIKE ANY OTHER, DONE LATER IN THE DAY.
// It used to be excluded from the morning round outright, on the grounds that it is its
// own job with its own pair — true, but the way to say "later" is to say later, not to
// keep the work off the board and hand it out by memory. Guest flats are marked as
// afternoon work instead: dealt like an office room, worked after the morning round,
// and sorted to the bottom of every list by the rank the app already had for it.
// Nothing is hard-excluded now; the Settings switch decides, like every other kind.
// (Taking Airbnb off the roll call outright was tried on 26 Aug and reverted within
// the hour: the Airbnb tab, the ticking screen and the hand-out all read the same
// list, so the flats vanished from the board entirely and could not be ticked or
// given to anybody. Off the roll call is not what "not allocated automatically"
// means — see neverAutoDealt below, which is.)
const OFF_ROLL_CALL_TYPES = [];
// A GUEST FLAT IS HANDED OUT BY A PERSON, NEVER BY THE APP. The flats are their own
// job — done after the offices, by whoever is free once the morning round is finished —
// and who takes them is a call somebody makes on the day, looking at the board. The app
// dealt them like offices, so the office arrived to find flats already on people who
// were not going to be doing them, and moved them by hand every morning.
//
// They stay ON the board, in NOBODY YET, so they can be ticked and given out on the
// Airbnb tab exactly as before. The only thing that changes is that nothing puts a name
// on one unless a person does.
//
// NOT EVEN A PIN. A permanent cleaner was the one exception left, and it was the one way
// the app still put a name on a flat by itself: 206 is tied to Mahad, so 206 arrived on
// Mahad's column every morning whatever the day looked like — and because a flat is
// never re-dealt, the name then sat there for days (see clearStaleHandouts). A pin says
// who USUALLY takes a flat, which is worth knowing when the flats are given out. It is
// not the office asking the app to give it out. The pin is untouched and still decides
// the suggestion; what it no longer does is deal.
const neverAutoDealt = (u) => unitType(u) === 'airbnb';
// ONE ROOM, PUT ON TODAY'S BOARD BY HAND. The rule below is about a KIND of room —
// Airbnb is its own job, cleaned after the offices by its own pair, and it never joins
// the morning round. That stays exactly as it was. What it never had was an exception:
// a guest checks out, that one room has to be cleaned with everything else today, and
// there was nowhere to say so. Stamped with the WORK day, so it lapses by itself
// tomorrow — the kind is never quietly moved onto the roll call for good.
const onRollCallToday = (u) => !!u && String(u.rollCallOn || '') === workToday();
const onRollCall = (u) => onRollCallToday(u)
  || (OFF_ROLL_CALL_TYPES.indexOf(unitType(u)) < 0

    names + (plan.moves.length > 10 ? ' and ' + (plan.moves.length - 10) + ' more' : '') + '.'
      + '\n\nEvery other day, per day now: ' + weekBefore
      + '\nAfter this: ' + weekAfter
      + (plan.frees ? '\n\n' + plan.frees + ' of them come off ' + MANUAL_DAYS.map((d) => DOW_LABEL[d]).join('/')
          + ', which you pick by hand — nothing automatic is scheduled for that day.' : '')
      + '\n\nA moved room is cleaned once off its usual rhythm, then runs every other day from its new days. '
      + 'Rooms on days you set yourself are untouched.',
    () => { applyEodLevel(plan); hikSyncMsg = { text: plan.moves.length + ' rooms moved — the week is level now.' }; render(); },
    'Move them',
    'safe'
  );
}

// PUT THE ROOMS ON DAYS WITHOUT BEING ASKED. Working the days out was a button
// inside a collapsed drawer on the roll call, which meant the schedule went on
// drifting for anyone who never found it — and a drifting every-other-day group is
// exactly what makes one morning carry 38 rooms and the next 25. It runs on its own
// now, once a day, and only ever on rooms that are on a frequency with NO days set:
// a room somebody has put on days is a decision and is never overruled.
function autoPinDaysFromFreq() {
  if (TV_MODE) return { pinned: 0 };                 // the board cannot write
  if (state.autoDays === false) return { pinned: 0 };
  if (state.autoDaysOn === todayKey()) return { pinned: 0 };
  state.autoDaysOn = todayKey();
  const plan = suggestDaysFromFreq();
  if (!plan.proposals.length) return { pinned: 0 };
  applySuggestedDays(plan);
  // Kept so the roll call can say what changed underneath it. A schedule that
  // rearranges itself silently is one nobody trusts.
  state.lastAutoDays = {
    day: todayKey(),
    pinned: plan.proposals.length,

  };

}
function applySuggestedDays(plan) {
  plan.proposals.forEach((p) => { keepTodayThroughDayChange(p.u, () => { p.u.days = p.days.slice(); }); });
  save();
}
function suggestDaysFromFreqConfirm() {
  const plan = suggestDaysFromFreq();
  if (!plan.proposals.length) {

  plan.proposals.forEach((p) => {
    const k = DOW_PICK_ORDER.filter((d) => p.days.indexOf(d) >= 0).map((d) => DOW_LABEL[d]).join(' ');
    (byPattern[k] = byPattern[k] || []).push(p.u.unit);
  });
  const summary = Object.keys(byPattern)
    .map((k) => k + ' — ' + byPattern[k].length + ' room' + (byPattern[k].length === 1 ? '' : 's')).join(' · ');
  const week = DOW_PICK_ORDER.map((d) => DOW_SHORT[d] + ' ' + plan.load[d]).join(', ');
  showConfirm(
    'Put ' + plan.proposals.length + ' room' + (plan.proposals.length === 1 ? '' : 's') + ' on fixed days?',
    summary + '.\n\nRooms per day after this: ' + week + '.'
      + (plan.skipped.length ? '\n\n' + plan.skipped.length + ' left alone — daily rooms are due every day anyway.' : '')
      + '\n\nRooms already on days are untouched.',
    () => { applySuggestedDays(plan); render(); },
    'Set the days',
    'safe'
  );
}

// ============================================================
// LEVEL THE WEEK
// Thirteen rooms tomorrow and twenty-four the day after is the same fortnight's
// work either way, but the heavy day cannot actually be finished and the light one
// wastes a crew. This replaced an earlier balancer that split each frequency group
// into equal blocks by room number: that evened out a group in isolation and said
// nothing about what the day as a whole ended up carrying, so the every-other-day
// split could land squarely on the day the weeklies already fell. It also delayed
// rooms, where this brings them forward, and the two pulled against each other
// depending on which had run last.
//
// This works from the projection the week-ahead view shows, so what gets levelled is
// the number the office is actually looking at, and it picks each room's place in
// its own cycle to flatten the daily totals.
//
// It only ever moves a clean EARLIER, never later — the same rule the rest of the
// scheduling keeps. Nothing waits longer than its frequency to be cleaned; a room
// simply takes its next turn a day or two sooner, and carries on from there.
// ============================================================
const LEVEL_HORIZON = 14;

// The projected count for each of the next n days as the schedule stands.
function projectedCounts(horizon) {
  const counts = {};
  projectDueDays(horizon).forEach((d) => { counts[d.day] = d.due.length; });
  return counts;
}

// Work out where each room would sit to make the days come out even. Returns the
// moves and the before/after shape, without touching anything.
function levelPlan(horizon) {
  const span = horizon || LEVEL_HORIZON;
  const start = workToday();
  const days = [];
  for (let i = 0; i < span; i += 1) days.push(shiftDay(start, i));
  const idx = {};
  days.forEach((d, i) => { idx[d] = i; });

  const before = projectedCounts(span);
  const walk = projectDueDays(span);
  const firstDueIdx = {};      // room -> the day it is next due, as an offset
  walk.forEach((d, i) => d.due.forEach((u) => { if (firstDueIdx[u.id] === undefined) firstDueIdx[u.id] = i; }));

  const units = (state.servicedUnits || []).filter((u) => !u.paused && onRollCall(u));
  const load = new Array(span).fill(0);
  const movable = [];
  units.forEach((u) => {
    const n = FREQ_DAYS[u.freq] || 1;
    const from = firstDueIdx[u.id];
    // A daily room is on every day whatever we do, and a room not due inside the
    // horizon has nothing to place. Both are fixed load to work around.
    if (n <= 1 || from === undefined) {
      if (from !== undefined) for (let i = from; i < span; i += n) load[i] += 1;
      return;
    }
    movable.push({ u, n, from });
  });

  // Fewest choices first: an every-other-day room can only sit on one of two days,
  // so it must pick before a weekly that can go anywhere fits itself around it.
  movable.sort((a, b) => (a.n - b.n)
    || String(a.u.unit).localeCompare(String(b.u.unit), undefined, { numeric: true }));

  const moves = [];
  movable.forEach((m) => {
    // A room already due today is the hard case, and the common one: when every
    // every-other-day room falls due together there is no earlier day to move any of
    // them to, so nothing can prise them apart. It is going to be cleaned today
    // whatever happens, so the way to split the clump is an EXTRA clean on the
    // opposite day — one more clean, once, after which the room runs on its new day
    // for good. Nothing is ever delayed to tidy the schedule.
    // Two ways to move a room, and never a third: bring its next turn FORWARD, or
    // leave that turn where it is and give it one EXTRA clean later in the cycle.
    // Nothing is ever held back. The extra clean is what prises apart a clump that
    // is due now — there is no earlier day to move any of them to, so the only way
    // to break it up is to clean some of them twice, once, and let them carry on
    // from the opposite day thereafter.
    const cands = [];
    for (let at = Math.min(1, m.from); at <= m.from; at += 1) cands.push({ at, kind: 'earlier', keep: [] });
    for (let at = m.from + 1; at <= m.from + m.n - 1 && at < span; at += 1) cands.push({ at, kind: 'extra', keep: [m.from] });

    const inSeries = (i, at) => i >= at && (i - at) % m.n === 0;
    let best = { at: m.from, kind: 'earlier', keep: [] }, bestCost = Infinity;
    cands.forEach((c) => {
      let peak = 0, sq = 0;
      for (let i = 0; i < span; i += 1) {
        const v = load[i] + ((inSeries(i, c.at) || c.keep.includes(i)) ? 1 : 0);
        if (v > peak) peak = v;
        sq += v * v;
      }
      // Flatten the worst day first, then the shape as a whole. An extra clean is
      // real work, so it has to beat staying put outright rather than merely tie.
      const cost = peak * 10000 + sq + (c.kind === 'extra' ? 1 : 0);
      if (cost < bestCost - 1e-9) { bestCost = cost; best = c; }
    });

    best.keep.forEach((i) => { if (!inSeries(i, best.at)) load[i] += 1; });
    for (let i = best.at; i < span; i += m.n) load[i] += 1;
    if (best.at !== m.from) {
      moves.push({ u: m.u, from: days[m.from], to: days[best.at], freq: m.u.freq, kind: best.kind });
    }
  });

  const after = {};
  days.forEach((d, i) => { after[d] = load[i]; });
  const nums = days.map((d) => after[d]);
  // The first days of the horizon carry work that is already due and is never
  // delayed, so they cannot be lightened and judging the result by them hides a
  // real fix: a clump due tomorrow still lands tomorrow, whatever we do about the
  // fortnight after it. The settled half is where levelling shows up.
  const tail = Math.floor(span / 2);
  return {
    days, moves, before, after,
    peakBefore: Math.max(...days.map((d) => before[d] || 0)),
    peakAfter: Math.max(...nums),
    lowBefore: Math.min(...days.map((d) => before[d] || 0)),
    lowAfter: Math.min(...nums),
    settledBefore: Math.max(...days.slice(tail).map((d) => before[d] || 0)),
    settledAfter: Math.max(...nums.slice(tail)),
    settledLowAfter: Math.min(...nums.slice(tail)),
  };
}

// Apply a levelling. A room takes its next turn earlier by being given that day
// outright — the same one-off extra clean the clump-splitter uses, which lapses the
// moment it is done and leaves the room running on its new day for good.
function applyLevelPlan(plan) {
  plan.moves.forEach((m) => { m.u.alsoCleanOn = m.to; delete m.u.holdUntil; });
  save();
}

// Record a whole group as cleaned (or not) in one go — at the end of a day where
// the crew got through everything, ticking 25 rooms individually is the bottleneck.
function setUnitsLastCleanedBulk(ids, dayKey, groupLabel, whoId) {
  const changing = (state.servicedUnits || []).filter(u => ids.includes(u.id) && (u.lastCleaned || null) !== dayKey).length;
  if (!changing) return;
  const what = dayKey === todayKey() ? 'cleaned today' : dayKey ? 'cleaned on ' + dayKey : 'not cleaned yet';
  showConfirm(
    `Mark ${changing} room${changing === 1 ? '' : 's'} ${what}?`,
    `Applies to ${groupLabel} only. Their next clean is scheduled from this date.`,
    () => {
      (state.servicedUnits || []).forEach(u => {
        if (!ids.includes(u.id)) return;
        const was = u.lastCleaned || null;
        u.lastCleaned = dayKey || null;
        stampCleanedBy(u, dayKey, whoId);
        if (dayKey && dayKey !== was) logClean(u, dayKey, whoId);   // record it, don't just reschedule
      });
      save(); render();
    },
    dayKey ? 'Mark ' + what : 'Clear',
    'safe'
  );
}

// --- Record a past day -------------------------------------------------------
// Last night's work gets entered the next morning. Ticking rooms off "today" puts
// the whole night on the wrong date and credits whoever happens to be assigned
// now, so past days get their own sheet: pick the day, and the only names offered
// are the people who actually badged in on it.
let _backdate = null;   // { day, loading, failed, arrivals, picks, chosen, type, warn, saving }
let _backdateSeq = 0;   // a slow day-load must not land after you've moved to another day

function openBackdate(day) {
  _backdate = { day: day || yesterdayKey(), loading: true, failed: false, arrivals: {},
                picks: {}, chosen: {}, type: 'all', warn: '', saving: false };
  render();
  loadBackdateDay();
}
function closeBackdate() { _backdate = null; render(); }
function setBackdateDay(day) {
  if (!_backdate || !day || day > todayKey()) return;   // no attendance exists for a day that hasn't happened
  _backdate.day = day; _backdate.loading = true; _backdate.warn = '';
  _backdate.picks = {}; _backdate.chosen = {};          // another day is another crew — start the names over
  render();
  loadBackdateDay();
}
function setBackdateType(t) { if (_backdate) { _backdate.type = t; _backdate.warn = ''; render(); } }
async function loadBackdateDay() {
  const b = _backdate; if (!b) return;
  const token = ++_backdateSeq;
  const res = await arrivalsForDay(b.day);
  if (_backdate !== b || token !== _backdateSeq) return;   // day changed (or sheet closed) mid-read
  b.arrivals = res ? res.arrivals : {};
  b.failed = !res;
  b.loading = false;
  render();
}

function backdateRooms() {
  const b = _backdate; if (!b) return [];
  return (state.servicedUnits || [])
    .filter(u => b.type === 'all' || unitType(u) === b.type)
    .slice()
    .sort((x, y) => String(x.unit).localeCompare(String(y.unit), undefined, { numeric: true }));
}
// Already in History for that day — offering it again would double-count the room.
const loggedOnDay = (unitId, day) => cleaningHistory.some(r => r.unit_id === unitId && dayKeyLocal(r.cleaned_at) === day);
// Who could have cleaned this room that day: badged in, and cleared for the kind.
function cleanersPresentFor(u, arrivals) {
  return cleaningStaff().filter(p => arrivals[p.id] && canCleanUnit(p, u));
}
// Best guess at the name, drawn from that day's crew — never from today's assignment.
// Their usual room comes first, then the floor's owner; today's override is the
// weakest signal because auto-assign rewrites it every morning. No clear answer
// returns nothing, so the office picks rather than the app inventing a name.
function defaultCleanerFrom(u, arrivals) {
  const cands = cleanersPresentFor(u, arrivals);
  if (!cands.length) return '';
  const among = (id) => id ? cands.find(p => p.id === id) : null;
  const owner = ownerOfFloor(floorOfUnit(u.unit));
  const pick = among(u.usualTo) || (owner && among(owner.id)) || among(u.assignedTo)
            || (cands.length === 1 ? cands[0] : null);
  return pick ? pick.id : '';
}
const backdateCandidates = (u) => (_backdate ? cleanersPresentFor(u, _backdate.arrivals) : []);
const backdatePick = (u) => (_backdate.picks[u.id] !== undefined ? _backdate.picks[u.id] : defaultCleanerFrom(u, _backdate.arrivals));

// Jump in from a room group: the day picker still rules, but the group arrives
// ticked so a whole night is a couple of taps.
function openBackdateForType(typeKey, day) {
  openBackdate(day);
  _backdate.type = typeKey;
  backdateSelectAll(true);
}
// One room, one tap. The name comes from that day's badge-ins; when the day's crew
// doesn't point at one person, open the sheet instead of guessing.
async function markCleanedOn(id, day) {
  const u = (state.servicedUnits || []).find(x => x.id === id);
  if (!u) return;
  const res = await arrivalsForDay(day);
  const who = res ? defaultCleanerFrom(u, res.arrivals) : '';
  if (!who) {
    openBackdate(day);
    _backdate.type = unitType(u);
    _backdate.chosen[u.id] = true;
    render();
    return;
  }
  setUnitLastCleaned(id, day, who);
}

function backdateSelectAll(on) {
  const b = _backdate; if (!b) return;
  backdateRooms().forEach(u => { if (!loggedOnDay(u.id, b.day)) b.chosen[u.id] = on; });
  b.warn = '';
  render();
}

async function saveBackdate() {
  const b = _backdate; if (!b || b.saving) return;
  const rooms = backdateRooms().filter(u => b.chosen[u.id] && !loggedOnDay(u.id, b.day));
  if (!rooms.length) { b.warn = 'Tick the rooms that were cleaned first.'; render(); return; }
  // Logging an unnamed room as "Office" would quietly credit nobody for a night's
  // work, so stop and ask rather than guess.
  const missing = rooms.filter(u => !backdatePick(u));
  if (missing.length) {
    b.warn = missing.length + (missing.length === 1 ? ' room still needs a name: ' : ' rooms still need a name: ')
           + missing.slice(0, 4).map(u => u.unit).join(', ') + (missing.length > 4 ? '…' : '');
    render(); return;
  }
  const day = b.day;
  const entries = rooms.map(u => ({ u, who: backdatePick(u) }));
  b.saving = true; render();
  const ok = await logCleanMany(entries, day);
  if (!ok) { if (_backdate === b) { b.saving = false; b.warn = 'Nothing was saved — try again.'; render(); } return; }
  entries.forEach(({ u, who }) => {
    const was = u.lastCleaned || null;
    // Never drag a schedule backwards: a room cleaned again since that night is
    // still due from the later clean. The name only moves with the date — crediting
    // that night's cleaner for a later clean they didn't do would be worse than
    // leaving the newer name in place.
    if (!was || day > was) { u.lastCleaned = day; stampCleanedBy(u, day, who); }
  });
  save();
  _backdate = null;
  // Land on that day in History — seeing the entries is the only real confirmation
  // that the night was recorded.
  historyDay = day; historyFilter = 'all'; state.tab = 'history';
  render();
}

// --- Assignment sign-off -----------------------------------------------------
// Auto-assign hands rooms out immediately, but each one still needs a yes/no from
// the office. Confirmation is stamped with the day so it expires on its own.
let _assignPick = null;   // {unitId} while the "who should take this?" picker is open
// With the morning on automatic there is nothing to sign off: the rooms were dealt
// from the rota, evenly, by rules the office set. Asking twenty-three times whether
// that was alright is the manual step, and manual steps are where the mistakes were.
const assignConfirmedToday = (u) => !!state.autoConfirm
  || (state.assignConfirmed || {})[u.id] === todayKey();
// IS THE NAME ON THIS ROOM FROM THE ROUND THAT IS RUNNING NOW?
// Every hand-out stamps the day it was made — by hand (assignConfirmed, setUnitAssignee),
// from the plan (planCarried), or by the morning deal (autoDealtOn) — and nothing ever
// asked. A room simply kept whoever it was last given to, and the ONLY thing that took a
// name back off was the morning hand-out, which does not run until somebody badges in.
//
// So on a morning before the first scan the whole board was still wearing YESTERDAY's
// names, and today's plan could not get in past keepBoard to correct it: 27 Aug was
// planned for five leaders with Abdiwakiil correctly off, and the board underneath still
// showed him holding 305, 403, 1103 and 704 from the day before.
//
// The stamps are calendar days by convention (see applyPlannedAssignments) and a round
// belongs to a WORK day, so the test is "not older than the work day" — which is also
// what stops a round still running at 1am reading as stale and being re-dealt underneath
// the crew working it.
const assignedThisRound = (u) => {
  const d = workToday();
  return String((state.assignConfirmed || {})[u.id] || '') >= d
    || String((state.planCarried || {})[u.id] || '') >= d
    || String(u.autoDealtOn || '') >= d;
};
// Taking the whole deal in one go. Checking a hand-out room by room is right when
// you disagree with two of them and wrong as the default: twenty-three yes-taps is
// not a review, it is a toll, and the point of dealing the rooms out automatically
// was to stop the morning being a list of small confirmations.
function confirmAllAssignments(ids) {
  const day = todayKey();
  (ids || []).forEach((id) => { state.assignConfirmed[id] = day; });
  save(); render();
}
function confirmAssignment(id) {
  state.assignConfirmed[id] = todayKey();
  save(); render();
}
// Put every room back the way it was before the last auto-assign, including who
// had already been signed off.
// Take the whole morning back off its cleaners in one go. Undo already covers the
// last auto-assign, but only while it is still the last thing that happened; this
// works any time — the usual reason being that the crew who turned up is not the
// crew the board was built for, so it is easier to start again than to move a
// dozen rooms one at a time. A permanent cleaner is a standing decision made in
// Settings rather than a hand-out for the morning, so those rooms keep their person.
function unassignAllRooms() {
  const rooms = (state.servicedUnits || []).filter((u) =>
    onRollCall(u) && onTodaysList(u) && u.assignedTo && !u.usualTo);
  if (!rooms.length) return;
  const signed = rooms.filter((u) => assignConfirmedToday(u)).length;
  const kept = (state.servicedUnits || []).filter((u) =>
    onRollCall(u) && onTodaysList(u) && u.assignedTo && u.usualTo).length;
  showConfirm(
    'Put all ' + rooms.length + ' rooms back in the pool?',
    'They all come off their cleaner' + (signed ? ', including ' + signed + ' already checked' : '')
      + ', ready to hand out again.'
      + (kept ? ' ' + kept + ' room' + (kept === 1 ? ' with a permanent cleaner keeps' : 's with a permanent cleaner keep') + ' that person.' : '')
      + ' You can undo it afterwards.',
    () => runUnassignAll(rooms),
    'Put back in pool',
    'safe'
  );
}

function runUnassignAll(rooms) {
  // Same snapshot the auto-assign undo reads, so one Undo covers whichever bulk
  // change to the board happened last.
  state.lastAutoAssign = {
    at: new Date().toISOString(),
    kind: 'unassign',
    who: rooms.reduce((m, u) => { m[u.id] = u.assignedTo || null; return m; }, {}),
    confirmed: rooms.reduce((m, u) => { if (state.assignConfirmed[u.id]) m[u.id] = state.assignConfirmed[u.id]; return m; }, {}),
  };
  rooms.forEach((u) => { u.assignedTo = null; delete state.assignConfirmed[u.id]; });
  // AND LET THE MORNING DEAL AGAIN. autoAssignedFor is the morning's "already done
  // this crew" mark, and putting the rooms back used to leave it standing — so the
  // next pass saw the same people badged in, decided the deal had already happened,
  // and returned without touching the pool. The rooms simply sat there with nobody
  // against them until somebody new walked through the door, which on a crew that is
  // all in by seven can be never. 201 and 301 spent a morning like that.
  //
  // Clearing it is the whole point of the button: the office is asking for the
  // morning to be worked out again, and this is what lets it.
  state.autoAssignedFor = null;
  hikSyncMsg = { text: rooms.length + ' room' + (rooms.length === 1 ? ' is' : 's are') + ' back in the pool.' };
  save(); render();
}

function undoAutoAssign() {
  const snap = state.lastAutoAssign;
  if (!snap) return;
  Object.keys(snap.who).forEach((id) => {
    const u = (state.servicedUnits || []).find((x) => x.id === id);
    if (!u) return;
    u.assignedTo = snap.who[id];
    if (snap.confirmed[id]) state.assignConfirmed[id] = snap.confirmed[id];
    else delete state.assignConfirmed[id];
  });
  state.lastAutoAssign = null;
  hikSyncMsg = { text: 'Put the assignments back as they were.' };
  save(); render();
}
const lastBoardChangeLabel = () => {
  const l = state.lastAutoAssign || {};
  if (l.kind === 'move') return '↩ Undo moving ' + (l.label || 'that room');
  if (l.kind === 'unassign') return '↩ Undo putting them back';
  return '↩ Undo auto-assign';
};
// Hand the rooms out on their own once the crew starts badging in, so the morning
// works without anyone remembering to press anything. Deliberately conservative:
// it runs once a day, only when NOTHING has been handed out yet, so it can never
// overwrite a decision the office already made. Everything it does still needs a
// yes/no, and Undo is there — it is a starting point, not a verdict.
// Keep the week level on its own. Rooms cleaned together come due together, so
// left alone the every-other-day rooms re-stack onto a single morning — 38 rooms
// one day, 25 the next. This spreads them the moment that starts happening.
// Only ever delays a room; a clean is never pulled forward.
// Carry a plan made for today into this morning. Planning tomorrow last night and
// then watching the roll call deal the rooms out again from scratch makes the
// planning pointless, so a planned hand-out is honoured rather than recomputed.
// Only for people who actually turned up: somebody who isn't in can't clean, so
// their rooms fall through to be dealt with the rest.
function applyPlannedAssignments() {
  // Read the plan by the WORK day — a round still running at 1am is on last night's
  // plan, not tomorrow's — but stamp sign-offs with the calendar day, because that is
  // what every other reader of assignConfirmed compares against.
  const planDay = workToday();
  const stampDay = todayKey();
  const plan = (state.plans || {})[planDay];
  const out = { carried: 0, absent: 0, waiting: 0, overCap: [], load: {}, slotLoad: { early: {}, late: {} } };
  if (!plan) return out;
  // THE CAP HAS TO BE CHECKED WHERE THE BOARD IS ACTUALLY FILLED. runAutoAssign caps a
  // leader at four rooms and autoPlanDay caps them again when it lays a day out — and
  // this, the stage between them that puts the plan on the morning board, checked
  // nothing at all. A plan holding six rooms against one name put six rooms against
  // that name and the cap never saw it happen. Rooms above the cap are left unhanded,
  // in NOBODY YET, where the morning deal can pick them up for somebody who has room.
  const CARRY_CAP = 4;
  const carried = {};
  const unitById = {};
  (state.servicedUnits || []).forEach((u) => { unitById[u.id] = u; });
  const staffById = {};

    // due by its own schedule, so a room deliberately ADDED to tomorrow — which is

    // touched here: that is somebody deciding, not the app guessing.

    // loud below rather than dropped quietly — a silent cap is how a lopsided morning

    // drawn up before the pin existed still carries the old name. Carrying it would
    // hand the room to somebody else on the very morning after it was pinned. The
    // room is left for the deal, which gives it to the person it belongs to.
    if (u.usualTo && u.usualTo !== j.assignedTo) return;

    // and saved keeps whatever it said, and it was written before the round existed —
    // so a cleaner named on four asked-for rooms had all four carried onto the board and
    // the cap never got a look in. Their own pinned rooms count first and are never
    // refused; beyond that, an asked-for room past the round goes back to the deal and
    // is shared with whoever else is in. Nothing is lost — it is handed out this morning
    // either way, just not all to one person.
    if (timeSlot(u) === 'early' && u.usualTo !== j.assignedTo
