// Shared editable employee card
function employeeCard(p) {
  const editing = state.editingEmp === p.id;
  const card = el(`<div class="person" style="flex-direction:column;align-items:stretch;gap:10px"></div>`);

  if (editing) {
    const nameIn = el(`<input id="eeName_${p.id}" value="${esc(p.name)}" placeholder="Name">`);
    card.appendChild(nameIn);
    let chosenTeam = p.crew;
    const teamRow = el(`<div style="display:flex;gap:6px;flex-wrap:wrap"></div>`);
    const teamBtns = {};
    getTeams().forEach(t => {
      const b = el(`<button class="freqpick ${t.name===p.crew?'on':''}" style="flex:1 1 22%">${esc(t.name)}</button>`);
      b.onclick = () => { chosenTeam = t.name; Object.values(teamBtns).forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
      teamBtns[t.name] = b; teamRow.appendChild(b);
    });
    card.appendChild(teamRow);
    // Floors are tapped on and off, and save as you tap — see floorGrid(). A dashed
    // amber number is a floor somebody else has; tapping it moves the floor over.
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-top:8px">Floors</div>`));
    card.appendChild(floorGrid(p));
    // What this person is cleared to clean. Trainees are commonly kept off offices.
    card.appendChild(el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;margin-top:8px">Cleared to clean</div>`));
    const canRow = el(`<div style="display:flex;gap:6px;flex-wrap:wrap"></div>`);
    UNIT_TYPE_ORDER.forEach(tk => {
      const on = canCleanType(p, tk);
      const b = el(`<button class="freqmini ${on ? 'on' : ''}" style="flex:1 1 28%">${on ? '✓ ' : ''}${UNIT_TYPES[tk].label}</button>`);
      b.onclick = () => toggleCanClean(p.id, tk);
      canRow.appendChild(b);
    });
    card.appendChild(canRow);
    const row = el(`<div style="display:flex;gap:8px"></div>`);
    const sv = el(`<button class="add-btn" style="flex:1">Save</button>`);
    // null = leave the floors alone; the grid above has already saved them.
    sv.onclick = () => editEmployee(p.id, document.getElementById('eeName_'+p.id).value, chosenTeam, null);
    const cn = el(`<button class="modal-skip">Cancel</button>`);
    cn.onclick = () => cancelEditEmp();
    row.appendChild(sv); row.appendChild(cn);
    card.appendChild(row);
    return card;
  }

  const role = roleOf(p);
  const top = el(`<div style="display:flex;align-items:center;gap:10px"></div>`);
  const info = el(`<div class="person-info"></div>`);
  // The role is the first thing about a person, so it is on the name line — as a
  // word, not a star somebody has to be told the meaning of.
  info.appendChild(el(`<div class="person-name">${esc(p.name)}`
    + ` <span style="color:${ROLES[role].color};font-size:12px;font-weight:700">`
    + `${ROLES[role].icon}${ROLES[role].label}</span></div>`));
  info.appendChild(el(`<div class="person-floors">${esc(p.crew || 'No team')} · ${esc(personFloors(p))}</div>`));
  top.appendChild(info);
  card.appendChild(top);

  // ROLE: one picker, three states. Two independent toggles meant a leader who was
  // not a cleaner was possible and meaningless, and nothing ever said "assistant".
  const roleRow = el(`<div style="display:flex;gap:6px"></div>`);
  ROLE_ORDER.forEach((rk) => {
    const on = role === rk;
    const b = el(`<button class="freqmini ${on ? 'on' : ''}" title="${esc(ROLES[rk].hint)}" `
      + `style="flex:1 1 0;padding:8px 6px;font-size:12px`
      + (on ? `;border-color:${ROLES[rk].color};color:${ROLES[rk].color};font-weight:800` : '') + `">`
      + `${ROLES[rk].icon}${esc(ROLES[rk].label)}</button>`);
    b.onclick = () => setRole(p.id, rk);
    roleRow.appendChild(b);
  });
  card.appendChild(roleRow);
  card.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:-4px">${esc(ROLES[role].hint)}</div>`));

  // TEAM: changed here, not three taps away inside Edit.
  const teamRow = el(`<div style="display:flex;align-items:center;gap:8px"></div>`);
  teamRow.appendChild(el(`<div style="font-size:11px;color:#5f7189;font-weight:700;flex:0 0 auto">Team</div>`));
  const teamSel = el(`<select style="flex:1;min-width:0;background:#ffffff;color:#15202e;`
    + `border:1px solid #d8e0ea;border-radius:8px;padding:8px 10px;font-size:14px"></select>`);
  getTeams().forEach((t) => {
    const o = el(`<option value="${esc(t.name)}"${t.name === p.crew ? ' selected' : ''}>${esc(t.name)}</option>`);
    teamSel.appendChild(o);
  });
  teamSel.onchange = (e) => editEmployee(p.id, p.name, e.target.value, (p.floors || []).join(', '));
  teamRow.appendChild(teamSel);
  card.appendChild(teamRow);

  const ctl = el(`<div class="su-ctl" style="border-top:none;padding-top:0;margin-top:0;flex-wrap:wrap"></div>`);
  const sh = shiftOf(p);
  const shift = el(`<button class="freqmini" title="Tap to change shift" style="flex:0 0 auto;padding:7px 12px;color:${SHIFTS[sh].color};border-color:${SHIFTS[sh].color}">${SHIFTS[sh].icon} ${SHIFTS[sh].label}</button>`);
  shift.onclick = () => cycleShift(p.id);
  const ct = typeOf(p);
  const ctype = el(`<button class="freqmini" title="Tap to change type" style="flex:0 0 auto;padding:7px 12px;color:${CLEAN_TYPES[ct].color};border-color:${CLEAN_TYPES[ct].color}">${CLEAN_TYPES[ct].icon} ${CLEAN_TYPES[ct].label}</button>`);
  ctype.onclick = () => cycleCleanType(p.id);
  const ed = el(`<button class="su-edit">Edit</button>`);
  ed.onclick = () => startEditEmp(p.id);
  const rm = el(`<button class="su-rm">Remove</button>`);
  rm.onclick = () => removeEmployee(p.id);
  ctl.appendChild(shift); ctl.appendChild(ctype); ctl.appendChild(ed); ctl.appendChild(rm);
  card.appendChild(ctl);

  // WORKS ON — only worth the room for cleaners; nobody is handing rooms to the
  // rest, so a rota for them is noise. All seven lit is the default and means
  // "every day", which is why nothing here needs setting up before it works.
  if (p.isCleaner) {
    // FOLDED AWAY UNLESS IT SAYS SOMETHING. Seven buttons on every card is most of
    // the height of the Team tab, and for almost everyone they all read "in". The
    // line states the rota; tap it to change it.
    const offCount = Array.isArray(p.worksOn) ? 7 - p.worksOn.length : 0;
    const rotaOpen = (state.expandedRota || {})[p.id];
    if (!rotaOpen) {
      const sum = el(`<button class="freqmini" style="width:100%;padding:7px;font-size:11px;text-align:left">`
        + `Works ${offCount ? WEEKDAYS.filter(([, d]) => worksStateOf(p, d) !== 'off').map(([l]) => l).join(' ') : 'every day'} · change</button>`);
      sum.onclick = () => { state.expandedRota = { ...(state.expandedRota || {}), [p.id]: true }; save(); render(); };
      card.appendChild(sum);
      return card;
    }
    const wRow = el('<div class="su-ctl" style="border-top:none;padding-top:6px;margin-top:2px;flex-wrap:wrap;align-items:center"></div>');
    const hide = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 9px;font-size:11px">▾</button>`);
    hide.onclick = () => { state.expandedRota = { ...(state.expandedRota || {}), [p.id]: false }; save(); render(); };
    wRow.appendChild(hide);
    wRow.appendChild(el(`<div style="flex:0 0 auto;font-size:11px;color:#5f7189;font-weight:700;margin-right:2px" `
      + `title="Which days this person is expected in">Works on${offCount ? '' : ' · every day'}</div>`));
    WEEKDAYS.forEach(([lbl, dow]) => {
      const rota = altRotaFor(p, dow);
      const st = rota ? 'rota' : worksStateOf(p, dow);
      const style = st === 'off' ? ';opacity:0.4'
        : st === 'rota' ? ';border-color:#7c3aed;color:#7c3aed' : '';
      const tip = st === 'off' ? 'Off every ' + lbl
        : st === 'on' ? 'In every ' + lbl
        : 'In on ' + rota.weeks.length + ' ' + lbl + 's out of every ' + rota.cycle;
      const b = el(`<button class="freqmini ${st === 'on' ? 'on' : ''}" title="${esc(tip)}" `
        + `style="flex:0 0 auto;padding:6px 9px;font-size:11px${style}">`
        + `${lbl}${rota ? ' ' + rota.weeks.length + '/' + rota.cycle : ''}</button>`);
      b.onclick = () => cycleWorksOn(p.id, dow);
      wRow.appendChild(b);
    });
    card.appendChild(wRow);
  }
  return card;
}

// Render staff grouped by team, using editable cards
function employeeGroups(wrap) {
  if (!STAFF.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">No employees yet. Add your first above.</div>`));
    return;
  }
  // Show only cleaners by default (once any are tagged); "All staff" reveals everyone.
  const anyCleaner = STAFF.some(p => p.isCleaner);
  const showAll = teamShowAll || !anyCleaner;
  const list = showAll ? STAFF : STAFF.filter(p => p.isCleaner);
  if (!list.length) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">No cleaners tagged yet. Switch to "All staff" and tap <b>+ Cleaner</b> on the cleaners.</div>`));
    return;
  }
  const crews = [...new Set(list.map(p => p.crew))]
    .sort((a, b) => String(a || '').localeCompare(String(b || ''), undefined, { numeric: true, sensitivity: 'base' }));
  crews.forEach(crewName => {
    const members = list.filter(p => p.crew===crewName)
      // Leader first, then by name. Without the name tie-break the crew appeared in
      // whatever order people were added, so a rehired cleaner sat at the bottom.
      .sort((a, b) => (b.isLeader?1:0) - (a.isLeader?1:0)
        || String(a.name).localeCompare(String(b.name), undefined, { numeric: true, sensitivity: 'base' }));
    const color = members[0].color;
    const group = el(`<div class="crew-group"></div>`);
    const head = el(`<div class="crew-head"></div>`);
    head.appendChild(el(`<div class="crew-dot" style="background:${color}"></div>`));
    head.appendChild(el(`<div class="crew-name">${esc(crewName)}</div>`));
    head.appendChild(el(`<div class="crew-sub">${members.length}</div>`));
    group.appendChild(head);

    // WHO ANSWERS FOR THIS TEAM, AND WHO IS WITH THEM. A flat stack of identical
    // cards says nothing about how the team is actually shaped — you had to read
    // every card and remember which ones carried a star. The leader is named, and the
    // assistants read straight off the same line, so the team is one glance.
    const leaders = members.filter((x) => x.isLeader);
    const assistants = members.filter((x) => !x.isLeader && x.isCleaner);
    const first = (n) => String(n).split(' ')[0];
    const shape = el(`<div style="font-size:12px;font-weight:600;margin:-4px 0 8px;line-height:1.5"></div>`);
    shape.appendChild(el(leaders.length
      ? `<span style="color:#b45309">${leaders.map((l) => '★ ' + esc(l.name)).join(' · ')}</span>`
      : `<span style="color:#b45309">No leader yet</span>`));
    shape.appendChild(el(assistants.length
      ? `<span style="color:#5f7189"> with ${esc(assistants.map((a) => first(a.name)).join(', '))}</span>`
      : `<span style="color:#5f7189"> — no assistants</span>`));
    group.appendChild(shape);

    members.forEach(p => group.appendChild(employeeCard(p)));
    wrap.appendChild(group);
  });
}

function viewHistory() {
  const wrap = el('<div class="body"></div>');

  if (!db) {
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:30px 0">History needs the shared server, which isn't connected on this build.</div>`));
    return wrap;
  }

  // A night that never got entered is noticed here, so this is where you fix it.
  const pastBtn = el(`<button class="add-btn" style="width:100%;margin-bottom:14px">＋ Record a past day</button>`);
  pastBtn.onclick = () => openBackdate(historyDay && historyDay !== todayKey() ? historyDay : yesterdayKey());
  wrap.appendChild(pastBtn);

  // Room filter
  const sel = el(`<select class="area-select" style="margin-bottom:14px"></select>`);
  sel.appendChild(el(`<option value="all">All rooms</option>`));
  (state.servicedUnits || []).slice()
    .sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }))
    .forEach(u => {
      const o = el(`<option value="${esc(u.id)}">Unit ${esc(u.unit)}${u.guest ? ' · ' + esc(u.guest) : ''}</option>`);
      if (historyFilter === u.id) o.setAttribute('selected', '');
      sel.appendChild(o);
    });
  // Areas are logged like rooms, so they have to be findable like rooms.
  if (areasInterior().length) {
    const g = el(`<optgroup label="Communal areas"></optgroup>`);
    areasInterior().forEach(a => {
      const o = el(`<option value="${esc(areaLogId(a))}">${esc(a.label)}</option>`);
      if (historyFilter === areaLogId(a)) o.setAttribute('selected', '');
      g.appendChild(o);
    });
    sel.appendChild(g);
  }
  sel.onchange = (e) => { historyFilter = e.target.value; render(); };
  wrap.appendChild(sel);

  // Day picker — pick any past day to see what was cleaned that day (blank = every day).
  const dayRow = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"></div>');
  const dayIn = el(`<input type="date" value="${esc(historyDay)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#f4f7fb;color:#15202e;border:1px solid #d8e0ea;border-radius:8px;padding:8px 10px;font-size:14px">`);
  dayIn.onchange = (e) => { historyDay = e.target.value || ''; render(); };
  const calBtn = el('<button class="freqmini" title="Pick a date" style="flex:0 0 auto">📅</button>');
  calBtn.onclick = () => { try { dayIn.showPicker(); } catch (e) { dayIn.focus(); dayIn.click(); } };
  dayRow.appendChild(dayIn);
  dayRow.appendChild(calBtn);
  if (historyDay) {
    const clr = el('<button class="freqmini">✕ All days</button>');
    clr.onclick = () => { historyDay = ''; render(); };
    dayRow.appendChild(clr);
  }
  wrap.appendChild(dayRow);

  let rows = cleaningHistory;
  if (historyFilter !== 'all') rows = rows.filter(r => r.unit_id === historyFilter);
  if (historyDay) rows = rows.filter(r => dayKeyLocal(r.cleaned_at) === historyDay);

  const scope = historyDay ? ('on ' + historyDay) : 'in total';
  wrap.appendChild(el(`<div class="section-label">${rows.length} cleaning${rows.length === 1 ? '' : 's'} ${scope}</div>`));

  if (!rows.length) {
    const msg = historyDay ? 'Nothing was logged as cleaned on this day.' : 'Nothing logged yet. Mark a room clean and it shows up here.';
    wrap.appendChild(el(`<div class="empty" style="text-align:center;padding:24px 0">${msg}</div>`));
    return wrap;
  }

  // When viewing all days, break the list up with a header per day.
  let lastDay = null;
  rows.forEach(r => {
    if (!historyDay) {
      const dk = dayKeyLocal(r.cleaned_at);
      if (dk !== lastDay) {
        lastDay = dk;
        const dLabel = new Date(r.cleaned_at).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        wrap.appendChild(el(`<div class="section-label" style="margin-top:14px;color:#5f7189">${esc(dLabel)}</div>`));
      }
    }
    const card = el(`<div class="su-card"></div>`);
    const top = el(`<div class="su-top"></div>`);
    const info = el(`<div style="flex:1;min-width:0"></div>`);
    // A communal area has a name, not a number — "Unit Main Lobby" reads as a fault.
    info.appendChild(el(`<div class="su-unit" style="font-size:15px">${isAreaLog(r.unit_id) ? '' : 'Unit '}${esc(r.unit_label || r.unit_id)}</div>`));
    info.appendChild(el(`<div class="su-guest">by ${esc(r.cleaner_name || 'Unknown')}</div>`));
    top.appendChild(info);
    top.appendChild(el(`<div class="su-next">${esc(fmtWhen(r.cleaned_at))}</div>`));
    card.appendChild(top);
    wrap.appendChild(card);
  });
  return wrap;
}

function viewTeam() {
  const wrap = el('<div class="body"></div>');
  const total = (state.staff || []).length;
  const cleaners = (state.staff || []).filter((p) => p.isCleaner).length;
  wrap.appendChild(el(`<div class="note">${cleaners ? `<b>${cleaners}</b> of ${total} tagged as cleaners.` : `None tagged as cleaners yet, so all ${total} show.`} Tap <b>Cleaner</b> on a person to add them.</div>`));

  // Filter: cleaners only (default) vs everyone. Lets you hide office/management after a sync.
  if (cleaners) {
    const seg = el('<div style="display:flex;gap:6px;margin-bottom:12px"></div>');
    const mk = (lbl, on, fn) => { const b = el(`<button class="freqpick ${on ? 'on' : ''}" style="flex:1">${lbl}</button>`); b.onclick = fn; return b; };
    seg.appendChild(mk(`Cleaners (${cleaners})`, !teamShowAll, () => { teamShowAll = false; render(); }));
    seg.appendChild(mk(`All staff (${total})`, teamShowAll, () => { teamShowAll = true; render(); }));
    wrap.appendChild(seg);
  }

  if (cleaners) wrap.appendChild(floorAllocationBox());

  // SHARE OUT THE REST DAY — the Friday off alternates, so half the crew is in one
  // week and half the next. Doing that by hand across a whole crew is where it drifts
  // and somebody quietly ends up working most Fridays.
  if (cleaners) {
    const fri = 5;
    const crew = cleaningStaff();
    const onRota = crew.filter((p) => altRotaFor(p, fri));
    const box = el('<div style="margin-bottom:14px"></div>');
    box.appendChild(el(`<div class="section-label">Friday rota</div>`));
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 8px">`
      + `Pick how many are in each Friday. Everyone then does the same number of them, `
      + `and the week is easier for having had the hands.</div>`));
    const pickRow = el('<div style="display:flex;gap:6px;margin-bottom:8px"></div>');
    [2, 3, 4].forEach((n) => {
      if (n > crew.length) return;
      const b = el(`<button class="freqmini ${teamFridayPer === n ? 'on' : ''}" style="flex:1">${n} in</button>`);
      b.onclick = () => { teamFridayPer = n; render(); };
      pickRow.appendChild(b);
    });
    box.appendChild(pickRow);
    const btn = el(`<button class="add-btn" style="background:#7c3aed;color:#ffffff">⚖ Share the Friday rota out evenly</button>`);
    btn.onclick = () => {
      const rota = buildDayRota(fri, teamFridayPer, teamFridayShift);
      const each = rota.byPerson[Object.keys(rota.byPerson)[0]];
      // WHICH OF THESE IS TOMORROW. "Friday 1, Friday 2" is unanswerable on its own —
      // the whole question is who is in on the one coming up.
      const nextFri = nextDowKey(fri);
      const slot = weekIndex(nextFri, rota.cycle);
      const onNext = Object.keys(rota.byPerson)
        .filter((pid) => rota.byPerson[pid].weeks.indexOf(slot) >= 0)
        .map((pid) => rota.byPerson[pid].name.split(' ')[0]);
      const preview = rota.weeks.slice(0, 4)
        .map((wk, i) => 'Friday ' + (i + 1) + ': ' + wk.map((p) => p.name.split(' ')[0]).join(', ')).join('\n');
      showConfirm(
        rota.perWeek + ' in every Friday?',
        'This coming Friday (' + fmtDay(nextFri) + '): ' + (onNext.join(', ') || 'nobody')
          + '\n\nIf that is the same lot who were in last Friday, close this and tap '
          + '"↻ Put the other group on first", then set it.\n\n'
          + preview + (rota.cycle > 4 ? '\n… and so on' : '')
          + '\n\nIt comes round every ' + rota.cycle + ' weeks, so each of the ' + rota.crew.length
          + ' works ' + (each ? each.weeks.length : 0) + ' Fridays out of ' + rota.cycle
          + ' — the same for everybody. You can still change any one person by hand afterwards.',
        () => applyDayRota(fri, rota),
        'Set the rota',
        'safe'
      );
    };
    box.appendChild(btn);
    const shift = el(`<button class="freqmini" style="width:100%;padding:9px;margin-top:6px">`
      + `↻ Put the other group on first</button>`);
    shift.onclick = () => { teamFridayShift = (teamFridayShift + 1) % Math.max(2, cleaningStaff().length); render(); };
    box.appendChild(shift);
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin-top:6px">`
      + (onRota.length
        ? `${onRota.length} of ${crew.length} are on a Friday rota — <b>${crew.filter((p) => worksOnDay(p, nextDowKey(fri))).length}</b> in this coming Friday.`
        : `Nobody is on a Friday rota yet — everyone is down as working every one.`)
      + `</div>`));
    wrap.appendChild(box);
  }

  // WORK THE ROTA OUT FROM WHO ACTUALLY TURNS UP. The machinery for this has been
  // here all along — it reads six weeks of clock-ins and tells a rest day from a
  // sick day — but nothing ever called it, so the rota stayed hand-typed and drifted
  // out of step with the crew. It proposes; you see exactly what changes before it
  // is applied, and any one person can still be set by hand afterwards.
  if (cleaners) {
    const box = el('<div style="margin-bottom:14px"></div>');
    box.appendChild(el(`<div class="section-label">Work out the rota</div>`));
    box.appendChild(el(`<div style="font-size:11px;color:#5f7189;margin:-6px 0 8px">`
      + `From the last ${ROTA_WINDOW_DAYS} days of clock-ins. Anyone too irregular to call is left alone.</div>`));
    const btn = el(`<button class="add-btn" style="background:#0284c7;color:#ffffff">🗓 Work out the rota from the clock-ins</button>`);
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = 'Reading the clock-ins…';
      const r = await inferRotasFromAttendance(ROTA_WINDOW_DAYS);
      btn.disabled = false; btn.textContent = '🗓 Work out the rota from the clock-ins';
      if (!r) { showInfo('Could not read the clock-ins', 'The server did not answer. Check the connection and try again.'); return; }
      if (!r.days) { showInfo('No clock-ins to read', 'Nothing has been recorded in the last ' + ROTA_WINDOW_DAYS + ' days, so there is nothing to work a rota out from.'); return; }
      if (!r.proposals.length) {
        showInfo('Nothing to change', 'Across ' + r.days + ' days of clock-ins, everybody reads as working every day they are already down for.'
          + (r.skipped.length ? '\n\nToo irregular to call: ' + r.skipped.map((x) => x.name.split(' ')[0] + ' (' + x.reason + ')').join(', ') : ''));
        return;
      }
      const lines = r.proposals.map((x) =>
        x.name.split(' ')[0] + ' — off ' + x.off.map((d) => DOW_LABEL[d]).join(', ')
        + (x.unclear.length ? ' (' + x.unclear.map((d) => DOW_LABEL[d]).join(', ') + ' left on, too few to judge)' : ''));
      showConfirm(
        'Set the rota for ' + r.proposals.length + ' ' + (r.proposals.length === 1 ? 'person' : 'people') + '?',
        'From ' + r.days + ' days of clock-ins:\n\n' + lines.join('\n')
          + (r.skipped.length ? '\n\nLeft alone, too irregular to read: ' + r.skipped.map((x) => x.name.split(' ')[0]).join(', ') : '')
          + '\n\nA rest day set here only stops rooms being handed out on it. Anyone who turns up anyway still shows on the roll call and can be given rooms.',
        () => applyRotas(r.proposals),
        'Set the rota',
        'safe'
      );
    };
    box.appendChild(btn);
    wrap.appendChild(box);
  }

  // Add-employee form only matters when viewing everyone.
  if (teamShowAll || !cleaners) wrap.appendChild(employeeAddForm());
  employeeGroups(wrap);
  return wrap;
}

// ============================================================
// CUSTOM CONFIRM MODAL
// ============================================================
let _confirmState = null;
// okLabel/okTone let a non-destructive confirm (e.g. changing a schedule) avoid the
// red "Remove" button, which reads as "you're about to delete something".
function showConfirm(title, message, onConfirm, okLabel, okTone, infoOnly) {
  _confirmState = { title, message, onConfirm, okLabel, okTone, infoOnly };
  renderConfirmModal();
}
// Something to read, not something to decide. One way out, so nobody has to work out
// what the difference between "Cancel" and "Close" is meant to be.
function showInfo(title, message) {
  showConfirm(title, message, () => {}, 'Close', 'safe', true);
}
function dismissConfirmModal() { _confirmState = null; const e = document.getElementById('confirmModal'); if (e) e.remove(); }
function renderConfirmModal() {
  if (!_confirmState) return;
  const existing = document.getElementById('confirmModal');
  if (existing) existing.remove();
  const overlay = el(`<div class="modal-overlay" id="confirmModal" style="align-items:center"></div>`);
  const modal = el(`<div class="modal" style="border-radius:16px"></div>`);
  modal.appendChild(el(`<div class="modal-title">${esc(_confirmState.title)}</div>`));
  modal.appendChild(el(`<div class="modal-sub">${esc(_confirmState.message)}</div>`));
  const btnRow = el(`<div class="modal-btns"></div>`);
  const cancelBtn = el(`<button class="modal-skip">Cancel</button>`);
  cancelBtn.onclick = () => dismissConfirmModal();
  if (_confirmState.infoOnly) cancelBtn.style.display = 'none';
  const confirmBtn = el(`<button class="${_confirmState.okTone === 'safe' ? 'modal-confirm' : 'modal-danger'}">${esc(_confirmState.okLabel || 'Remove')}</button>`);
  confirmBtn.onclick = () => { const cb = _confirmState.onConfirm; dismissConfirmModal(); cb(); };
  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(confirmBtn);
  modal.appendChild(btnRow);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) dismissConfirmModal(); };
  document.getElementById('app').appendChild(overlay);
}

// The sheet for recording a past day. Ticks and name-picks update the DOM in place
// rather than re-rendering: on a 60-room list a full redraw on every tap throws the
// office back to the top of the page mid-entry.
function backdateSheet() {
  const b = _backdate;
  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`<div class="modal" style="max-height:88vh;overflow-y:auto"></div>`);
  modal.appendChild(el(`<div class="modal-title">Record a past day</div>`));
  modal.appendChild(el(`<div class="modal-sub">Names offered are whoever badged in that day.</div>`));

  // --- which day ---
  modal.appendChild(el(`<div class="modal-label">Which day</div>`));
  const dayRow = el(`<div style="display:flex;gap:6px;align-items:center"></div>`);
  const dayIn = el(`<input type="date" value="${esc(b.day)}" max="${esc(todayKey())}" style="flex:1;min-width:0;background:#f4f7fb;color:#15202e;border:1px solid #d8e0ea;border-radius:8px;padding:9px 10px;font-size:14px">`);
  dayIn.onchange = (e) => setBackdateDay(e.target.value);
  dayRow.appendChild(dayIn);
  [['Yesterday', yesterdayKey()], ['Today', todayKey()]].forEach(([lbl, d]) => {
    const btn = el(`<button class="freqmini ${b.day === d ? 'on' : ''}" style="flex:0 0 auto;padding:9px 10px">${lbl}</button>`);
    btn.onclick = () => setBackdateDay(d);
    dayRow.appendChild(btn);
  });
  modal.appendChild(dayRow);

  // --- who was in that day ---
  const crew = Object.keys(b.arrivals)
    .map(id => (state.staff || []).find(p => p.id === id))
    .filter(Boolean)
    .sort((x, y) => String(b.arrivals[x.id].raw || '').localeCompare(String(b.arrivals[y.id].raw || '')));
  let crewMsg, crewTone = '#5f7189';
  if (b.loading) crewMsg = 'Checking who badged in…';
  else if (b.failed) { crewMsg = 'Could not read attendance for this day — pick names by hand.'; crewTone = '#b45309'; }
  else if (!crew.length) { crewMsg = 'Nobody badged in on this day. Add them on Roll Call for that day, or record the rooms as Office.'; crewTone = '#b45309'; }
  else crewMsg = crew.length + ' badged in — ' + crew.map(p => p.name.split(' ')[0] + ' ' + (b.arrivals[p.id].time || '')).join(' · ');
  modal.appendChild(el(`<div style="font-size:12px;color:${crewTone};font-weight:600;margin-top:10px;line-height:1.5">${esc(crewMsg)}</div>`));

  // --- which rooms ---
  modal.appendChild(el(`<div class="modal-label">What was cleaned</div>`));
  const filterRow = el(`<div style="display:flex;gap:6px;margin-bottom:10px"></div>`);
  [['all', 'All'], ['airbnb', 'Airbnb'], ['office', 'Offices'], ['building', 'Buildings']].forEach(([k, lbl]) => {
    const btn = el(`<button class="freqmini ${b.type === k ? 'on' : ''}">${lbl}</button>`);
    btn.onclick = () => setBackdateType(k);
    filterRow.appendChild(btn);
  });
  modal.appendChild(filterRow);

  const rooms = backdateRooms();
  const openRooms = rooms.filter(u => !loggedOnDay(u.id, b.day));
  const countLbl = el(`<div style="font-size:11px;color:#5b6a7f;font-weight:600;flex:1"></div>`);
  const selRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"></div>`);
  selRow.appendChild(countLbl);
  const allBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">Tick all</button>`);
  allBtn.onclick = () => backdateSelectAll(true);
  const noneBtn = el(`<button class="freqmini" style="flex:0 0 auto;padding:6px 10px">Clear</button>`);
  noneBtn.onclick = () => backdateSelectAll(false);
  selRow.appendChild(allBtn); selRow.appendChild(noneBtn);
  modal.appendChild(selRow);

  const saveBtn = el(`<button class="modal-confirm"></button>`);
  const tickedCount = () => openRooms.filter(u => b.chosen[u.id]).length;
  const refreshCount = () => {
    const n = tickedCount();
    countLbl.textContent = n + ' of ' + openRooms.length + ' ticked';
    saveBtn.textContent = b.saving ? 'Saving…' : (n ? 'Log ' + n + ' cleaning' + (n === 1 ? '' : 's') : 'Log cleanings');
  };

  if (!rooms.length) modal.appendChild(el(`<div class="empty" style="text-align:center;padding:18px 0">No rooms of this kind.</div>`));
  rooms.forEach(u => {
    const already = loggedOnDay(u.id, b.day);
    const card = el(`<div class="su-card" style="padding:10px 12px;${already ? 'opacity:0.55' : ''}"></div>`);
    card.style.borderLeft = '3px solid ' + UNIT_TYPES[unitType(u)].color;
    const top = el(`<div style="display:flex;align-items:center;gap:10px"></div>`);
    const label = el(`<div style="flex:1;min-width:0"><div class="su-unit" style="font-size:14px">Unit ${esc(u.unit)}</div>`
      + `<div class="su-guest">${esc(u.guest || UNIT_TYPES[unitType(u)].label)}</div></div>`);
    if (already) {
      top.appendChild(label);
      top.appendChild(el(`<div class="su-next">Already logged</div>`));
      card.appendChild(top);
      modal.appendChild(card);
      return;
    }
    const tick = el(`<button class="freqmini ${b.chosen[u.id] ? 'on' : ''}" style="flex:0 0 auto;width:38px;padding:9px 0;font-size:13px">${b.chosen[u.id] ? '✓' : '○'}</button>`);
    const setTicked = (on) => {
      b.chosen[u.id] = on;
      tick.classList.toggle('on', on);
      tick.textContent = on ? '✓' : '○';   // an empty box reads as a field to fill in, not a tick
      refreshCount();
    };
    tick.onclick = () => setTicked(!b.chosen[u.id]);
    top.appendChild(tick);
    top.appendChild(label);
    card.appendChild(top);

    const cands = backdateCandidates(u);
    const cur = backdatePick(u);
    const who = el(`<select class="area-select" style="width:100%;margin-top:8px"></select>`);
    who.appendChild(el(`<option value="">${cands.length ? '— who cleaned it? —' : '— nobody badged in —'}</option>`));
    cands.forEach(p => {
      const o = el(`<option value="${esc(p.id)}">${esc(p.name)}</option>`);
      if (cur === p.id) o.setAttribute('selected', '');
      who.appendChild(o);
    });
    const off = el(`<option value="office">Office (nobody badged in for it)</option>`);
    if (cur === 'office') off.setAttribute('selected', '');
    who.appendChild(off);
    // Naming who did a room says it was done — tick it rather than making the
    // office tap twice for the same fact.
    who.onchange = (e) => { b.picks[u.id] = e.target.value; if (e.target.value && !b.chosen[u.id]) setTicked(true); };
    card.appendChild(who);
    modal.appendChild(card);
  });

  if (b.warn) modal.appendChild(el(`<div style="font-size:12px;color:#b45309;font-weight:600;margin-top:12px;line-height:1.5">${esc(b.warn)}</div>`));

  // Sticky: with 60 rooms on the list, a footer at the end of the scroll is a
  // long way from the room you just ticked.
  const btnRow = el(`<div class="modal-btns" style="position:sticky;bottom:0;background:#ffffff;padding:10px 0 2px"></div>`);
  const cancel = el(`<button class="modal-skip">Cancel</button>`);
  cancel.onclick = () => { if (!b.saving) closeBackdate(); };
  saveBtn.onclick = () => saveBackdate();
  if (b.saving) saveBtn.disabled = true;
  btnRow.appendChild(cancel); btnRow.appendChild(saveBtn);
  modal.appendChild(btnRow);
  refreshCount();

  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay && !b.saving) closeBackdate(); };
  return overlay;
}

// ============================================================
// TV BOARD
// ============================================================
// The office TV. Nobody taps it, so it is a statement rather than a screen:
// who is in, what each of them has, what is done. It redraws itself on a timer
// and pulls from Supabase on its own, because there is no one to press refresh.
const TV_MODE = /[?&]tv\b/.test(location.search) || /^#tv\b/.test(location.hash);
// Five is as thin as a column can get before a name stops reading from the far side
// of the office. That is a limit on how WIDE a column may be, though, and it had been
// doing duty as a limit on how many people fit on the screen — so a crew of nine got
// split across two pages that swapped every fifteen seconds, and nobody could answer
// "who has 604?" without standing there waiting for the board to come back round.
// The columns are two-thirds air (nobody holds more than about five jobs), so it
// stacks into a second and third row instead, and only pages when even that is full.
const TV_MAX_ACROSS = 5;
const TV_MAX_ROWS = 3;
const TV_COLS_PER_PAGE = TV_MAX_ACROSS * TV_MAX_ROWS;

// Shorter columns need smaller type, or the job chips spill out of them. Indexed by
// row count so the single-row board is left at exactly the size it always was.
const TV_ROW_SCALE = { 1: 1, 2: 0.72, 3: 0.55 };

// Squarest arrangement that holds n columns: 9 people is 5 across and 2 deep, not
// 5 and then a row of 4 hanging off the end at a different width.
function tvGrid(n) {
  const rows = Math.min(TV_MAX_ROWS, Math.max(1, Math.ceil(n / TV_MAX_ACROSS)));
  return { rows: rows, across: Math.max(1, Math.ceil(n / rows)), scale: TV_ROW_SCALE[rows] || 0.55 };
}
const TV_PAGE_MS = 15000;        // long enough to read a column before it moves
const TV_TICK_MS = 20000;        // redraw: clock, and anything realtime already dropped into state
const TV_PULL_MS = 60000;        // belt and braces — smart TV browsers drop websockets silently
let tvPage = 0;
let tvLastData = 0;              // when the board last saw fresh numbers

const tvFirst = (n) => String(n || '').trim().split(/\s+/)[0] || '—';

// A first name is the right length for a television — until two of them are the same.
// Two cleaners called Mahad give you two identical chips and two columns either of
// them could be holding, and from across the office the only thing telling them apart
// is which rooms are underneath, which is precisely the thing you were trying to read.
// So the first name is kept while it is unambiguous and grown only as far as it must
// be: an initial where that settles it, the whole second name where it does not.
// Nobody gets a longer name because somebody else has a twin.
function tvNamesFor(people) {
  const parts = (n) => String(n || '').trim().split(/\s+/).filter(Boolean);
  const out = {}, byFirst = {};
  people.forEach((p) => {
    const f = parts(p.name)[0] || '—';
    (byFirst[f] = byFirst[f] || []).push(p);
  });
  Object.keys(byFirst).forEach((f) => {
    const group = byFirst[f];
    if (group.length === 1) { out[group[0].id] = f; return; }
    const byInitial = {};
    group.forEach((p) => {
      const i = (parts(p.name)[1] || '').charAt(0).toUpperCase();
      (byInitial[i] = byInitial[i] || []).push(p);
    });
    group.forEach((p) => {
      const w = parts(p.name);
      const i = (w[1] || '').charAt(0).toUpperCase();
      // No second name to grow into: leave it be rather than print a bare full stop.
      if (!i) { out[p.id] = f; return; }
      out[p.id] = (byInitial[i].length === 1) ? (f + ' ' + i + '.') : (f + ' ' + w[1]);
    });
  });
  return out;
}

// Rebuilt only when the roster actually changes: renderTV runs on a 20s timer and
// this would otherwise recompute the same answer for the life of the board.
let _tvNames = { sig: '', map: {} };
function tvName(p) {
  if (!p) return '—';
  const people = (state.staff || []);
  const sig = people.map((x) => x.id + ':' + x.name).join('|');
  if (sig !== _tvNames.sig) _tvNames = { sig: sig, map: tvNamesFor(people) };
  return _tvNames.map[p.id] || tvFirst(p.name);
}

// Every job on today's board, grouped by who is holding it. Rooms and communal
// areas together: from across the room a walk is another thing somebody has to
// get through, and splitting them into two lists hides half the load.
function tvJobsByPerson() {
  const buckets = {}, order = [];
  const bucket = (id) => {
    const k = id || '__none__';
    if (!buckets[k]) { buckets[k] = []; order.push(k); }
    return buckets[k];
  };
  todaysRoomList().forEach((u) => {
    bucket(u.assignedTo).push({
      label: u.unit,
      done: cleanedToday(u),
      early: timeSlot(u) === 'early',
      area: false,
    });
  });
  areasInterior().forEach((a) => {
    bucket(a.assignedTo).push({ label: a.label, done: areaDone(a), early: false, area: true });
  });
  // Red first, then whatever is still open, then the finished ones out of the way.
  Object.keys(buckets).forEach((k) => {
    buckets[k].sort((x, y) =>
      (x.done ? 1 : 0) - (y.done ? 1 : 0)
      || (y.early ? 1 : 0) - (x.early ? 1 : 0)
      || String(x.label).localeCompare(String(y.label), undefined, { numeric: true }));
  });
  return { buckets: buckets, order: order };
}

// Columns: everyone rostered on today gets one even when they are empty-handed,
// because an empty column is the useful bit of news. Unassigned work goes in an
// amber column at the front — it is the only thing on the board nobody owns.
function tvColumns() {
  const grouped = tvJobsByPerson();
  const cols = [];
  const unassigned = grouped.buckets['__none__'] || [];
  if (unassigned.length) {
    cols.push({ key: '__none__', name: 'NOBODY YET', jobs: unassigned, none: true, out: false, status: null });
  }
  const seen = {};
  cleaningStaff().filter((p) => worksToday(p)).forEach((p) => {
    seen[p.id] = true;
    const st = state.attendance[p.id] || 'present';
    cols.push({
      key: p.id, name: tvName(p), jobs: grouped.buckets[p.id] || [],
      none: false, out: AWAY.indexOf(st) >= 0, status: st,
    });
  });
  // Somebody off the rota still holding work has to show, or that work vanishes.
  (state.staff || []).forEach((p) => {
    if (seen[p.id] || !(grouped.buckets[p.id] || []).length) return;
    const st = state.attendance[p.id] || 'present';
    cols.push({
      key: p.id, name: tvName(p), jobs: grouped.buckets[p.id],
      none: false, out: AWAY.indexOf(st) >= 0, status: st,
    });
  });
  // Stranded work first. The board pages itself, and a sick cleaner's untouched
  // rooms are the one thing that must not be sitting on the page nobody saw.
  return cols.sort((a, b) => {
    const rank = (c) => (c.none ? 0 : (c.out && c.jobs.some((j) => !j.done)) ? 1 : 2);
    return rank(a) - rank(b);
  });
}

function tvCrewStrip() {
  const wrap = el(`<div class="tv-crew"></div>`);
  const crew = cleaningStaff().filter((p) => worksToday(p));
  if (!crew.length) { wrap.appendChild(el(`<div class="tv-empty">Nobody is rostered on today</div>`)); return wrap; }
  // Away first: who is missing is the thing you want to read without hunting.
  crew.slice().sort((a, b) => {
    const rank = (p) => AWAY.indexOf(state.attendance[p.id] || 'present') >= 0 ? 0 : 1;
    return rank(a) - rank(b) || String(a.name).localeCompare(String(b.name));
  }).forEach((p) => {
    const st = state.attendance[p.id] || 'present';
    const meta = STATUS[st] || STATUS.present;
    const chip = el(`<div class="tv-chip"><span>${esc(tvName(p))}</span><span class="st">${esc(meta.label)}</span></div>`);
    chip.style.borderColor = meta.color;
    chip.style.color = (st === 'present') ? '#eaf1fb' : meta.color;
    wrap.appendChild(chip);
  });
  return wrap;
}

function renderTV() {
  const app = document.getElementById('app');
  document.body.classList.add('tv');
  app.innerHTML = '';
  const now = new Date();
  const wrap = el(`<div class="tv-wrap"></div>`);

  const cols = tvColumns();
  const jobs = cols.reduce((n, c) => n + c.jobs.length, 0);
  const done = cols.reduce((n, c) => n + c.jobs.filter((j) => j.done).length, 0);
  const pct = jobs ? Math.round((done / jobs) * 100) : 0;

  // --- top line ---
  const top = el(`<div class="tv-top"></div>`);
  const left = el(`<div></div>`);
  left.appendChild(el(`<div class="tv-brand">CLEANING BOARD</div>`));
  left.appendChild(el(`<div class="tv-date">${esc(now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }))}</div>`));
  top.appendChild(left);

  const mid = el(`<div class="tv-progress"></div>`);
  mid.appendChild(el(`<div class="n">${done}</div>`));
  mid.appendChild(el(`<div class="of">of ${jobs} done</div>`));
  // Work with nobody behind it gets its own number at the top. The columns turn
  // over on a timer, so the one thing that must never be on the page you missed
  // is how much of today is currently falling on the floor.
  const cover = cols.filter((c) => c.out || c.none)
    .reduce((n, c) => n + c.jobs.filter((j) => !j.done).length, 0);
  if (cover) {
    const warn = el(`<div class="tv-progress" style="margin-left:2vw"></div>`);
    warn.appendChild(el(`<div class="n" style="color:#f59e0b">${cover}</div>`));
    warn.appendChild(el(`<div class="of" style="color:#f59e0b">need cover</div>`));
    mid.appendChild(warn);
  }
  top.appendChild(mid);

  const right = el(`<div></div>`);
  right.appendChild(el(`<div class="tv-clock">${esc(now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }))}</div>`));
  // A board nobody can tell is stale is worse than no board. Say when it last
  // heard anything, and go amber once that stops being reassuring.
  const mins = tvLastData ? Math.round((Date.now() - tvLastData) / 60000) : null;
  const stampTxt = (mins === null) ? 'waiting for data'
    : mins < 2 ? 'up to date' : mins + ' min since last update';
  right.appendChild(el(`<div class="tv-stamp${mins !== null && mins >= 10 ? ' tv-stale' : ''}">${esc(stampTxt)}</div>`));
  top.appendChild(right);
  wrap.appendChild(top);

  const bar = el(`<div class="tv-bar"><i></i></div>`);
  bar.firstChild.style.width = pct + '%';
  wrap.appendChild(bar);

  wrap.appendChild(tvCrewStrip());

  // --- columns, a page at a time ---
  // Spread the columns evenly over the pages rather than filling each to the
  // brim: six people is 3+3, not 5 then a lonely 1, and the column width stops
  // jumping about every time the board turns over.
  const pages = Math.max(1, Math.ceil(cols.length / TV_COLS_PER_PAGE));
  const perPage = Math.max(1, Math.ceil(cols.length / pages));
  if (tvPage >= pages) tvPage = 0;
  const shown = cols.slice(tvPage * perPage, tvPage * perPage + perPage);

  const grid = el(`<div class="tv-cols"></div>`);
  const g = tvGrid(shown.length);
  grid.style.gridTemplateColumns = 'repeat(' + g.across + ', minmax(0, 1fr))';
  grid.style.setProperty('--tvs', String(g.scale));
  if (!cols.length) {
    grid.appendChild(el(`<div class="tv-empty">Nothing on today's board yet</div>`));
  }
  shown.forEach((c) => {
    const col = el(`<div class="tv-col${c.none ? ' none' : ''}${c.out ? ' out' : ''}"></div>`);
    const hd = el(`<div class="tv-col-hd"></div>`);
    const row = el(`<div class="tv-hd-row"></div>`);
    row.appendChild(el(`<div class="tv-who">${esc(c.name)}</div>`));
    row.appendChild(el(`<div class="tv-count">${c.jobs.filter((j) => j.done).length}/${c.jobs.length}</div>`));
    hd.appendChild(row);
    // The name alone doesn't say the work is stranded. Spell it out on its own
    // line, where a long name can't push it off the edge.
    const open = c.jobs.filter((j) => !j.done).length;
    if (c.out) {
      const meta = STATUS[c.status] || STATUS.noshow;
      const sub = el(`<div class="tv-sub">${esc(meta.label)}${open ? ' · ' + open + ' NEED COVER' : ' · NOTHING OPEN'}</div>`);
      sub.style.color = open ? '#fbbf24' : meta.color;
      hd.appendChild(sub);
    } else if (c.none) {
      hd.appendChild(el(`<div class="tv-sub" style="color:#fbbf24">NOT HANDED OUT</div>`));
    }
    col.appendChild(hd);
    const list = el(`<div class="tv-jobs"></div>`);
    if (!c.jobs.length) list.appendChild(el(`<div class="tv-empty">—</div>`));
    c.jobs.forEach((j) => {
      // An away person's unfinished room is nobody's room until someone picks it
      // up, so it wears the same amber as work that was never handed out.
      const cls = j.done ? 'done' : (c.out || c.none) ? 'cover' : j.early ? 'early' : j.area ? 'area' : '';
      list.appendChild(el(`<div class="tv-job ${cls}">${j.early && !j.done ? '🌅 ' : ''}${esc(j.label)}</div>`));
    });
    col.appendChild(list);
    grid.appendChild(col);
  });
  wrap.appendChild(grid);

  if (pages > 1) {
    const pager = el(`<div class="tv-pager"></div>`);
    for (let i = 0; i < pages; i++) pager.appendChild(el(`<div class="tv-dot${i === tvPage ? ' on' : ''}"></div>`));
    wrap.appendChild(pager);
  }

  app.appendChild(wrap);
}

// No hands on this screen, so the board has to keep itself alive: redraw on a
// tick, turn the page on its own, and re-pull in case realtime quietly died.
function startTVLoop() {
  const pages = () => Math.max(1, Math.ceil(tvColumns().length / TV_COLS_PER_PAGE));
  // PICK UP NEW CODE WITHOUT ANYBODY WALKING TO THE TV. The board pulls fresh DATA
  // all day, but the JavaScript it is running is whatever it downloaded when the page
  // was opened — and this screen is opened once and left for weeks. Every fix shipped
  // since then simply never arrives, and the one screen nobody touches is the one
  // running the oldest code.
  //
  // So it reloads itself once a night, in the half hour after the work day rolls over
  // at 3am: the previous round has closed out, the crew is hours from arriving, and a
  // blink of a page load costs nothing. Only after six hours up, so a reload cannot
  // loop, and never while something is still waiting to be delivered.
  const bootedAt = Date.now();
  setInterval(() => {
    const h = new Date().getHours(), m = new Date().getMinutes();
    const quiet = h === WORKDAY_CUTOFF_HOUR && m >= 30 && m < 40;
    if (!quiet) return;
    if (Date.now() - bootedAt < 6 * 3600e3) return;
    if (isDirty()) return;                    // something of ours is still owed
    location.reload();
  }, 60000);
  setInterval(() => renderTV(), TV_TICK_MS);
  setInterval(() => { tvPage = (tvPage + 1) % pages(); renderTV(); }, TV_PAGE_MS);
  setInterval(() => {
    remotePull().then(() => { tvLastData = Date.now(); renderTV(); }).catch(() => {});
  }, TV_PULL_MS);
  // A TV that sleeps at 10am is a blank wall. Wake Lock is refused by most TV
  // browsers, so this is a try-and-shrug, not a guarantee — turn the screensaver
  // off in the TV's own settings as well.
  const hold = () => {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    navigator.wakeLock.request('screen').catch(() => {});
  };
  hold();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { hold(); renderTV(); } });
}

// ============================================================
// MAIN RENDER
// ============================================================
function render() {
  // One entry point, so every existing caller — realtime, save, the arrival
  // poller — lands on the board without knowing the board exists.
  if (TV_MODE) { renderTV(); return; }
  const app = document.getElementById('app');
  app.innerHTML = '';
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const s = statsBar();

  const header = el(`<div class="header"></div>`);
  // Back and Search, in the same place on every screen. Neither existed: you got out
  // of a screen by working out which tab you had come from, and you found a room by
  // knowing which tab it was on first.
  const topbar = el(`<div class="topbar"></div>`);
  if (_navStack.length) {
    const back = el(`<button class="tb-btn">‹ Back</button>`);
    back.onclick = goBack;
    topbar.appendChild(back);
  }
  topbar.appendChild(el(`<div style="flex:1"></div>`));
  const searchBtn = el(`<button class="tb-btn">⌕ Search</button>`);
  searchBtn.onclick = openSearch;
  topbar.appendChild(searchBtn);
  header.appendChild(topbar);
  header.appendChild(el(`<div class="h-eyebrow">66-UNIT BUILDING · 11 FLOORS</div>`));
  const ROOMS_TITLE = { all: 'All Rooms', airbnb: 'Airbnb Rooms', office: 'Office Cleaning', building: 'Building Cleaning' };
  const titles = { more:'More', rollcall:'Morning Roll Call', building:'Floors & Common Areas', exterior:'Exterior', history:'Cleaning History', team:'Team', settings:'Settings', plan:'Plan a Day', rooms: ROOMS_TITLE[roomsFilter()], tonight:'Tonight’s Round' };
  // A tab with no view renders an empty screen, so never trust it blindly:
  // fall back to Roll Call rather than showing a header over nothing.
  if (!titles[state.tab]) state.tab = 'rollcall';
  header.appendChild(el(`<div class="h-title">${titles[state.tab]}</div>`));
  // ON THE PLAN SCREEN, SAY WHICH DAY IS BEING PLANNED.
  // It opens on TOMORROW but the header printed today's date, so the office planned
  // what it believed was today, the work was filed against tomorrow, and today's roll
  // call came up empty. Nothing was wrong with the plan or the sync — the screen was
  // naming the wrong day.
  if (state.tab === 'plan') {
    const pd = curPlanDay();
    const pretty = new Date(pd + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    // Same work-day notion the Plan screen and Roll Call use, so the header cannot
    // call a day "not today" that the tab below it is treating as today.
    const isToday = pd === workToday() || pd === todayKey();
    const rel = isToday ? 'TODAY' : pd === tomorrowKey() ? 'TOMORROW' : null;
    header.appendChild(el(`<div class="h-date" style="font-size:13px;font-weight:800;color:${isToday ? '#15803d' : '#b45309'}">`
      + `Planning ${rel ? rel + ' · ' : ''}${esc(pretty)}</div>`));
    if (!isToday) header.appendChild(el(`<div class="h-date" style="color:#b45309">`
      + `Not today — these rooms appear on the roll call on ${esc(pretty.split(',')[0])}.</div>`));
  } else {
    header.appendChild(el(`<div class="h-date">${dateStr}</div>`));
  }
  const typeTab = state.tab === 'rooms' && roomsFilter() !== 'all' ? roomsFilter() : null;
  if (typeTab) {
    const inType = state.servicedUnits.filter(u => unitType(u) === typeTab);
    // Today's list = rooms due now + rooms already cleaned today, so the count
    // doesn't shrink as the crew works through it ("3 of 12 done", not "9 due").
    const todayList = inType.filter(onTodaysList);
    const doneCount = todayList.filter(cleanedToday).length;
    const strip = el(`<div class="stats"></div>`);
    strip.appendChild(el(`<div class="stat"><div class="lbl">DUE TODAY</div><div class="val">${todayList.length}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">CLEANED</div><div class="val">${doneCount}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">TOTAL</div><div class="val">${inType.length}</div></div>`));
    header.appendChild(strip);
  }
  if (state.tab === 'rollcall') {
    const clockedIn = Object.keys(hikArrivals).length;
    // Of TODAY's rooms, not of every room in the building. "14/33" invited you to
    // reconcile the day against a number that has nothing to do with it.
    const today = todaysRoomList();
    const assigned = today.filter((u) => u.assignedTo).length;
    const totalRooms = today.length;
    const strip = el(`<div class="stats"></div>`);
    strip.appendChild(el(`<div class="stat"><div class="lbl">CLOCKED IN</div><div class="val">${clockedIn}</div></div>`));
    strip.appendChild(el(`<div class="stat"><div class="lbl">ROOMS ASSIGNED</div><div class="val">${assigned}/${totalRooms}</div></div>`));
    header.appendChild(strip);
  }
  app.appendChild(header);

  if (state.tab==='more') app.appendChild(viewMore());
  else if (state.tab==='plan') app.appendChild(viewPlan());
  else if (state.tab==='tonight') app.appendChild(viewTonight());
  else if (state.tab==='rooms') app.appendChild(viewRoomsHub());
  else if (state.tab==='rollcall') app.appendChild(viewRollCall());
  else if (state.tab==='building') app.appendChild(viewBuilding());
  else if (state.tab==='exterior') app.appendChild(viewExterior());
  else if (state.tab==='history') app.appendChild(viewHistory());
  else if (state.tab==='team') app.appendChild(viewTeam());
  else if (state.tab==='settings') app.appendChild(viewSettings());

  // NOBODY SHOULD MISTAKE A STALE BOARD FOR A LIVE ONE. Says what it is, how old it
  // is, and that the work is not lost — the three things somebody needs to decide
  // whether to trust what they are looking at.
  if (offlineMode) {
    const bar = el(`<div style="background:#fdf3e6;border:1px solid #f0d9b5;border-radius:10px;`
      + `padding:10px 12px;margin:0 14px 12px;font-size:12px;color:#8a5a12;font-weight:600">`
      + `⚠ Offline — showing the board as saved ${esc(lastSyncLabel())}. `
      + `Your ticks are kept and go up when it is back.</div>`);
    app.insertBefore(bar, app.firstChild ? app.firstChild.nextSibling : null);
  }
  app.appendChild(el(`<div class="footer">`
    + (offlineMode ? 'Offline — changes are held on this device until the server is back'
                   : 'Changes save on this device · Daily tasks reset each day')
    + `</div>`));

  // --- Cover confirmation popup ---
  if (state.pendingCover) {
    const pc = state.pendingCover;
    const absent = STAFF.find(p => p.id === pc.absentId);
    const affected = unitsOwnedBy(pc.absentId);
    if (absent && affected.length) {
      const overlay = el(`<div class="modal-overlay"></div>`);
      const modal = el(`<div class="modal"></div>`);
      modal.appendChild(el(`<div class="modal-title">${esc(absent.name.split(' ')[0])} is absent</div>`));
      const unitList = affected.map(u => 'Unit ' + esc(u.unit)).join(', ');
      modal.appendChild(el(`<div class="modal-sub">${affected.length} unit${affected.length>1?'s':''} need cover: ${unitList}</div>`));

      // chosen coverer (default = suggestion), selectable
      let chosen = pc.suggestId;
      modal.appendChild(el(`<div class="modal-label">Assign cover to:</div>`));
      const picker = el(`<div class="cover-picker"></div>`);
      const present = STAFF.filter(p => p.id !== pc.absentId && state.attendance[p.id] !== 'noshow');
      const loads = unitLoads();
      if (!present.length) {
        modal.appendChild(el(`<div class="modal-sub" style="color:#dc2626">No one else is present to cover.</div>`));
      }
      present
        .sort((a,b) => (loads[a.id]||0)-(loads[b.id]||0))
        .forEach(p => {
          const isSug = p.id === pc.suggestId;
          const btn = el(`<button class="cover-opt ${p.id===chosen?'on':''}">${esc(p.name.split(' ')[0])}<span class="cover-load">${loads[p.id]||0} units${isSug?' · lightest':''}</span></button>`);
          btn.onclick = () => { chosen = p.id; picker.querySelectorAll('.cover-opt').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); };
          picker.appendChild(btn);
        });
      modal.appendChild(picker);

      const btnRow = el(`<div class="modal-btns"></div>`);
      const confirmB = el(`<button class="modal-confirm">Confirm cover</button>`);
      confirmB.onclick = () => { if (chosen) confirmCover(chosen); else dismissCover(); };
      const skipB = el(`<button class="modal-skip">Skip for now</button>`);
      skipB.onclick = () => dismissCover();
      if (present.length) btnRow.appendChild(confirmB);
      btnRow.appendChild(skipB);
      modal.appendChild(btnRow);

      overlay.appendChild(modal);
      app.appendChild(overlay);
    }
  }

  if (_backdate) app.appendChild(backdateSheet());
  if (_search) app.appendChild(searchSheet());

  const nav = el(`<div class="nav"></div>`);
  // The bar carries the four screens the day actually runs on. Three of the old five
  // were the same room list filtered three ways, which spent most of the bar on one
  // thing and pushed Plan and Team — used every day — behind "More".
  const tabs = [
    { id:'rollcall', label:'Roll Call', ico:'☀' },
    { id:'rooms', label:'Rooms', ico:'▤' },
    { id:'plan', label:'Plan', ico:'🗓' },
    { id:'team', label:'Team', ico:'☰' },
    { id:'more', label:'More', ico:'⋯' },
  ];
  // "More" stays highlighted while you're on any of its sub-pages.
  const moreIds = ['more','tonight','building','exterior','history','settings'];
  tabs.forEach(t => {
    const isActive = t.id === 'more' ? moreIds.includes(state.tab) : state.tab === t.id;
    const b = el(`<button class="${isActive?'active':''}"><div class="ico">${t.ico}</div><div>${t.label}</div></button>`);
    b.onclick = () => setTab(t.id);
    nav.appendChild(b);
  });
  app.appendChild(nav);
  // The sticky search bar has to sit exactly under the header, and the header's
  // height changes with the screen and with which strips it is showing — so it is
  // measured rather than guessed.
  const hdr = app.querySelector('.header');
  if (hdr) app.style.setProperty('--hdr', hdr.offsetHeight + 'px');
}

// ============================================================
// LOGIN  (real accounts via Supabase Auth; the local gate is only a
// fallback for when the server isn't configured)
// ============================================================
const AUTH_KEY = 'cleaning_app_auth';                              // legacy fallback flag
const CREDENTIALS = { username: 'admin', password: 'admin123' };   // fallback only (no server)
let authed = false;                                                // true when a real Supabase session exists

// ============================================================
// WORKING WHEN THE SERVER IS NOT
//
// The whole board is written to localStorage on every save, and yet the app
// refused to open without a live Supabase session — db is always truthy, so the
// gate always demanded the server. On 19 Aug 2026 Supabase restricted the project
// over an Edge Function quota and returned 402 to everything, including auth. The
// crew met a login screen that could never accept their PIN, with a perfectly good
// copy of the morning's board sitting unused on the device.
//
// A backend will go down sometime — this one, or whichever replaces it. So the
// server being reachable is no longer what decides whether anyone can work.
//
// The gate is KEPT, not dropped: on a successful sign-in the PIN is hashed and the
// hash stored, so offline it can still be checked. Only a device that has signed in
// for real can fall back; a fresh device stays locked out exactly as before.
// ============================================================
const PIN_HASH_KEY = 'cleaning_pin_hash';    // sha-256 of the PIN, never the PIN
const CACHE_STAMP_KEY = 'cleaning_last_sync';
let offlineMode = false;                     // running from the local copy

async function pinHash(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('orfane:' + pin));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
const canWorkOffline = () => {
  try { return !!localStorage.getItem(PIN_HASH_KEY) && !!localStorage.getItem(STORE); }
  catch (e) { return false; }
};
// A refusal that is about the SERVER, not about the PIN. A wrong PIN must never
// open the offline door — only an unreachable or broken back end does.
const isServerDown = (e) => {
  const msg = String((e && (e.message || e.error_description || e)) || '').toLowerCase();
  const status = e && (e.status || e.statusCode);
  if (status && (status === 402 || status === 403 || status >= 500)) return true;
  return /restricted|quota|failed to fetch|networkerror|load failed|timeout|502|503|504/.test(msg);
};
function stampSynced() { try { localStorage.setItem(CACHE_STAMP_KEY, new Date().toISOString()); } catch (e) {} }
function lastSyncLabel() {
  try {
    const v = localStorage.getItem(CACHE_STAMP_KEY);
    if (!v) return 'an earlier session';
    const d = new Date(v);
    return isNaN(d) ? 'an earlier session'
      : d.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  } catch (e) { return 'an earlier session'; }
}

// Synchronous "is someone signed in?" used by route()/boot().
function isLoggedIn() { return db ? (authed || offlineMode) : (localStorage.getItem(AUTH_KEY) === 'true'); }

async function logout() {
  try { if (db) await db.auth.signOut(); } catch (e) {}
  authed = false;
  offlineMode = false;
  localStorage.removeItem(AUTH_KEY);
  // Signing out closes the offline door as well, or "log out" would leave the device
  // still openable by the same PIN with no way to revoke it.
  try { localStorage.removeItem(PIN_HASH_KEY); } catch (e) {}
  renderLogin();
}

async function attemptLogin() {
  const pinEl = document.getElementById('loginPin');
  const errEl = document.getElementById('loginErr');
  const pin = (pinEl.value || '').trim();
  const fail = (msg) => { errEl.textContent = msg; pinEl.classList.add('error'); };
  if (!/^\d{4}$/.test(pin)) { fail('Enter your 4-digit PIN'); return; }
  const email = 'admin@orfanerealestate.so';
  const password = 'orfane-' + pin;   // 4-digit PIN padded to a valid password

  if (db) {
    const btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
    try {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      authed = true;
      offlineMode = false;
      // Keep a hash of the PIN that just worked, so this device can check it again
      // when the server cannot be asked. Never the PIN itself.
      try { localStorage.setItem(PIN_HASH_KEY, await pinHash(pin)); } catch (e2) {}
      boot();
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
      // THE SERVER IS DOWN, NOT THE PIN WRONG. Check it against the hash this device
      // stored the last time it signed in for real, and open the local copy.
      if (isServerDown(e) && canWorkOffline() && (await pinHash(pin)) === localStorage.getItem(PIN_HASH_KEY)) {
        offlineMode = true;
        authed = false;
        bootOffline();
        return;
      }
      pinEl.value = '';
      fail(isServerDown(e) ? 'Server unavailable — try again' : 'Wrong PIN');
    }
    return;
  }
  fail('Server not connected.');
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const screen = el(`<div class="login-screen"></div>`);
  const box = el(`<div class="login-box"></div>`);
  box.appendChild(el(`<div class="login-logo">✦</div>`));
  box.appendChild(el(`<div class="login-heading">Cleaning Ops</div>`));
  box.appendChild(el(`<div class="login-sub">Enter your 4-digit PIN</div>`));
  const pin = el(`<input class="login-input" id="loginPin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" style="text-align:center;letter-spacing:0.6em;font-size:26px">`);
  pin.addEventListener('input', () => {
    pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
    pin.classList.remove('error');
    if (pin.value.length === 4) attemptLogin();   // auto-submit on 4th digit
  });
  pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  box.appendChild(pin);
  const btn = el(`<button class="login-btn" id="loginBtn">Sign In</button>`);
  btn.onclick = attemptLogin;
  box.appendChild(btn);
  box.appendChild(el(`<div class="login-error" id="loginErr"></div>`));
  screen.appendChild(box);
  app.appendChild(screen);
  setTimeout(() => { try { pin.focus(); } catch (e) {} }, 100);
}

// Everything automatic about planning used to happen here and only here, which meant
// it happened when somebody OPENED the app. That was survivable while the office
// reloaded it on a phone each morning; it is not survivable on a TV left on for a
// week, where boot runs once and the day rolls over without anything re-planning.
// So the chain lives in its own function and a watcher re-runs it when the work day
// changes, with nobody touching anything.
function planningPass() {
  // Level first — it decides which rooms fall on which day, and planning ahead of it
  // would lay out days it is about to move.
  autoLevelIfLopsided();
  ensureWeekPlanned();   // the week ahead is laid out and handed round without anyone asking
  topUpTodayPlan();      // and anything the schedule says is due today but the frozen plan missed
  carryPlanToBoardOnOpen();   // and last night's plan for today is on the board already
}

let _plannedForDay = null;
let _dayWatch = null;
function startDayWatch() {
  clearInterval(_dayWatch);
  _dayWatch = setInterval(() => {
    // Top up every pass, not only at the rollover: a room can fall due because
    // somebody backdated a clean or changed a frequency on another device, and the
    // realtime update brings that in without any day having changed.
    const day = workToday();
    if (day !== _plannedForDay) {
      _plannedForDay = day;
      autoPinDaysFromFreq();
      planningPass();
      loadHikArrivals().then(() => { maybeAutoAssign(); render(); });
      render();
      return;
    }
    if ((topUpTodayPlan().added || 0) > 0) { carryPlanToBoardOnOpen(); render(); }
  }, 300000);   // five minutes — a day boundary and a backdated clean are both slow news
}

async function boot() {
  load();
  route();              // login → app
  await remotePull();   // wait for the staff roster before matching arrivals
  tvLastData = Date.now();
  _plannedForDay = workToday();
  // Days first: the planning pass reads the schedule, so the rooms need to be ON
  // their days before it runs, not after. It is a property of the rota rather than
  // of who has badged in, so it does not wait for the roll call.
  autoPinDaysFromFreq();
  planningPass();
  loadHikArrivals().then(() => { maybeAutoAssign(); route(); });
  startArrivalPolling();
  startDayWatch();
  subscribeRealtime();
  refreshHistory();
  subscribeHistory();
  if (TV_MODE) startTVLoop();
}

// Boot from the copy on the device. Everything that needs the server is left out —
// no pull, no realtime, no arrival polling — but the day still plans itself and the
// board is fully usable. Writes go to localStorage and are marked as owed, so the
// retry that already exists delivers them the moment the server answers again.
function bootOffline() {
  load();
  offlineMode = true;
  route();
  _plannedForDay = workToday();
  planningPass();
  startDayWatch();
  // Keep knocking. When the server comes back this promotes itself to a real session
  // without anybody reloading — and the first push carries everything done offline.
  clearInterval(_offlineWatch);
  _offlineWatch = setInterval(async () => {
    if (!db || !offlineMode) return;
    try {
      const { error } = await db.from('app_state').select('building').limit(1);
      if (error) throw error;
      offlineMode = false;
      clearInterval(_offlineWatch);
      // A session may still be live even though the project was refusing requests.
      let ok = false;
      try { const { data } = await db.auth.getSession(); ok = !!(data && data.session); } catch (e2) {}
      if (ok) { authed = true; boot(); }
      else renderLogin();
    } catch (e) { /* still down — keep the board up and try again */ }
  }, 60000);
}
let _offlineWatch = null;

// Startup: restore any existing Supabase session, then show the right screen.
async function startup() {
  if (!db) { if (isLoggedIn()) boot(); else renderLogin(); return; }
  try {
    const { data } = await db.auth.getSession();
    authed = !!(data && data.session);
  } catch (e) { authed = false; }
  db.auth.onAuthStateChange((_event, session) => {
    const was = authed;
    authed = !!session;
    if (!authed && was) renderLogin();   // signed out / session expired → back to login
  });
  if (authed) {
    // A stored session proves somebody signed in once, not that the server will
    // answer now. Ask it something cheap first: if the project is restricted or
    // unreachable, open the local copy rather than an app that cannot load anything.
    try {
      const { error } = await db.from('app_state').select('building').limit(1);
      if (error) throw error;
      boot();
    } catch (e) {
      if (isServerDown(e) && canWorkOffline()) bootOffline(); else boot();
    }
    return;
  }
  renderLogin();
}
startup();

// INSTALLABLE, AND OPENABLE WITH NO NETWORK. Registering the worker is what lets the
// app be added to a home screen and, more importantly, what lets it start at all when
// the connection is gone — the offline board is no use if the page cannot load to
// reach it. Registered after startup so it never delays the first paint.
// isSecureContext, not a protocol check: it is true for https AND for localhost, so
// the worker can be exercised in testing exactly as it runs in production, and still
// never registers from a file:// copy where the scope would be meaningless.
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
